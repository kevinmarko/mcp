                    className={`
                        ${actualBgClass}
                        ${actualTextClass}
                        ${isFaded ? 'opacity-40' : (isValid ? 'opacity-100' : 'opacity-70')}

                        border border-black ${isSelected ? 'shadow-inner' : 'shadow-md shadow-black/20'}
                        hover:brightness-110 transition-all flex items-center justify-center text-center ${extraClass}
                    `}
                >
                    {children}
                </button>
            );
        };

        // 2026-09-08, per Kevin: "Clear Filters" always cleared every slicer at once,
        // even when only one needed clearing -- a small per-slicer clear button that
        // only appears once that specific slicer actually has a selection, so
        // clearing one doesn't cost every other filter too. Rendered right after each
        // slicer's own label, before its button group.
        //
        // Same day, per Kevin: give it "a bubble pop animation" on click. The button
        // only ever renders while its slicer has a selection (its parent's own
        // `selectedX.length > 0 &&`), so once the real clear fires the button
        // unmounts on its own -- no need to reset any local state afterward. To
        // actually SEE the pop before that happens, the real clear is delayed by the
        // animation's own duration (POP_MS) via setTimeout: click sets `popping` (adds
        // the bubblePop keyframe class, see the <style> block in <head>), the button
        // visibly inflates then shrinks to nothing over that window, and only once
        // it's done does onClick() (the actual setSelectedX([])) run.
        const POP_MS = 180;
        // NOT wrapped in React.memo (2026-09-10 perf pass, F6 -- deliberate non-change, same
        // reasoning as SlicerBtn above): all 7 call sites pass a fresh `onClick` arrow (e.g.
        // `onClick={() => setSelectedSubTrades([])}`), so a memo wrap would never see equal
        // props and would just add a comparison for nothing. `label` is a stable string literal
        // at every call site, but React.memo's default shallow compare requires ALL props to
        // match, so the one unstable prop (`onClick`) sinks it. This button also already
        // unmounts on its own once the real clear fires (its parent's own
        // `selectedX.length > 0 &&` guard), so most of its renders are a fresh mount anyway --
        // memoizing it would only ever help on an unrelated re-render while the selection is
        // still non-empty, which `onClick`'s instability rules out regardless.
        const SlicerClearBtn = ({ onClick, label }) => {
            const [popping, setPopping] = useState(false);
            const handleClick = () => {
                setPopping(true);
                setTimeout(onClick, POP_MS);
            };
            return (
                <button
                    type="button"
                    onClick={handleClick}
                    title={`Clear ${label} filter`}
                    aria-label={`Clear ${label} filter`}
                    className={`mr-1.5 mt-0.5 w-4 h-4 shrink-0 rounded-full bg-gray-500 dark:bg-gray-500 text-white text-[10px] leading-none flex items-center justify-center hover:bg-gray-700 dark:hover:bg-gray-400 transition-colors cursor-pointer ${popping ? 'pointer-events-none' : ''}`}
                    style={popping ? { animation: `bubblePop ${POP_MS}ms ease-out forwards` } : undefined}
                >
                    ×
                </button>
            );
        };

        const normalizeApStatus = (raw) => String(raw || '')
            .trim()
            .replace(/\s*\(GD6\)\s*$/i, '')
            .toUpperCase();

        // toNum: shared raw-string -> number helper for real arithmetic (Class D, 2026-08-18
        // -- strips thousands-separator commas so "42,079" doesn't truncate to 42 at the first
        // non-numeric char the way a bare parseFloat would). Also strips "%" (some raw percent
        // columns arrive with a literal "%" suffix -- see getPercentNum/getPeakUtilPercentNum
        // below for the fuller percent-scale story) and "(", ")".
        // 2026-09-10 fix: that last part used to strip "(" and ")" WITHOUT checking whether they
        // were wrapping the whole value -- i.e. the accounting convention where "(1,234)" means
        // NEGATIVE 1,234, parentheses standing in for the minus sign instead of accompanying one.
        // Stripping the parens and nothing else silently discarded that sign: toNum("(1,234)")
        // returned +1234, turning a real negative into a positive with no error, no NaN, nothing
        // visibly wrong -- exactly the "silently 100x/sign-flipped" failure mode this file's own
        // helpers have twice shipped at percent-scale (ff07afb, 22af1d4). Neither real export
        // audited on 2026-09-10 (964-row xlsx, 8,769-row live CSV) currently produces a
        // parenthesized *numeric* cell for any field this function touches -- real negatives in
        // both arrive with a plain leading "-" (e.g. "Max Laden vs POL  Booking" going as low as
        // -4830) -- so this fix changes no currently-displayed value; it closes the hole before a
        // future export (or a manually-entered accounting-formatted cell) hits it the way the
        // live comma-formatted CSV eventually hit the pre-Class-D parseFloat. Must NOT fire on
        // this app's OWN "(-N)" accounting-negative display convention (formatAccountingNumber/
        // formatAccountingSigned below, e.g. "(-1,234)") being re-parsed -- that string already
        // carries an explicit minus once the parens are stripped, so it must pass through
        // unchanged rather than being negated a second time.
        const toNum = (val) => {
            const s = String(val ?? '').trim();
            const stripped = s.replace(/[,%()]/g, '');
            let n = parseFloat(stripped) || 0;
            if (/^\(.*\)$/.test(s) && !stripped.startsWith('-') && n !== 0) {
                n = -n;
            }
            return n;
        };

        const getPercentNum = (val) => {
            if (!val) return 0;
            let s = String(val).trim();
            // 2026-09-10 fix (Class D, same shape as toNum's comma-truncation bug): a
            // percent-formatted cell whose value is >=1,000% can arrive thousands-separated
            // (e.g. "1,036%", confirmed possible here because adjacent raw percent columns in
            // real exports already reach 1400% as bare fractions -- see RFR Utilz%/"Measures
            // POL Reefer Utilz", 28 booked TEU / 2 max TEU = 14 -> 1400%). A bare parseFloat
            // stops at the first non-numeric character, so "1,036%" silently truncated to 1 (as
            // "1%") instead of 1036 -- undetectable without a data point that actually reaches
            // 4 digits. Strip the comma before parsing, exactly like toNum already does; no
            // effect on any value below 1,000% (nothing to strip).
            if (s.includes('%')) return parseFloat(s.replace(/,/g, '')) || 0;
            let n = parseFloat(s);
            if (isNaN(n)) return 0;
            return n * 100;
        };

        // getPeakUtilPercentNum: like getPercentNum, but self-corrects for a scale quirk
        // specific to the "Measures Peak Overall/Pol Utilz" raw columns (peakUtilRaw /
        // peakPolUtilzRaw) -- unlike every other percent field in this app, real pulls of
        // this one have been observed arriving BOTH as a true fraction (0.06 meaning 6%,
        // the convention getPercentNum assumes) AND already percent-scaled (214 meaning
        // 214%, no fraction). Confirmed 2026-09-04 via Kevin's live screenshot: Booking
        // Flash Detail's "Peak Utiliz %" column was showing values inflated by an extra
        // 100x (21400% instead of 214%) because the naive getPercentNum-style *100 was
        // applied on top of a value that was already percent-scale. This exact
        // self-correcting heuristic pre-dates this session -- it already lived inline in
        // the Analyze modal's own peak-util trend calc (see groupPeakUtils below), just
        // never applied anywhere else peakUtilRaw is rendered/compared. Extracted here so
        // the Detail tab's displayed column and the utilization-gap alert get the same
        // protection instead of only the Analyze modal having it. Returns NaN (not 0) for
        // blank/unparseable input so callers can tell "no value" apart from a real zero.
        const getPeakUtilPercentNum = (val) => {
            if (val === undefined || val === null || val === '') return NaN;
            const strVal = String(val).trim();
            // 2026-09-10 fix: same comma-truncation hole as getPercentNum above -- a
            // thousands-separated percent string ("1,036%") must have its comma stripped before
            // parseFloat, or it silently truncates to 1 ("1%") instead of 1036. This raw column
            // has independently been observed BOTH as a true fraction and already percent-scaled
            // (see the block comment above), and adjacent percent columns in real exports already
            // reach 1400%, so a 4-digit comma-formatted peak-utilization pull is not far-fetched.
            if (strVal.includes('%')) return parseFloat(strVal.replace(/,/g, ''));
            let parsed = parseFloat(strVal.replace(/[^0-9.-]/g, ''));
            if (isNaN(parsed)) return NaN;
            if (parsed > 0 && parsed <= 5) parsed *= 100;      // a true fraction (2.14 -> 214)
            else if (parsed >= 1000) parsed /= 100;             // double-scaled (21400 -> 214)
            return parsed;                                      // else already percent-scale (214 -> 214)
        };

        const formatPercent = (val) => {
            if (val === '' || val === null || val === undefined) return '';
            let strVal = String(val).trim();
            if (strVal.includes('%')) {
                // 2026-09-10 fix: same comma-truncation hole as getPercentNum/
                // getPeakUtilPercentNum above -- strip the thousands separator before parsing so
                // a >=1,000% value like "1,036%" doesn't silently render as "1%".
                const parsed = parseFloat(strVal.replace(/,/g, ''));
                return isNaN(parsed) ? strVal : `${Math.round(parsed)}%`;
            }
            let num = parseFloat(strVal);
            if (!isNaN(num)) {
                return `${Math.round(num * 100)}%`;
            }
            return strVal;
        };

        const formatNumberWithCommas = (val) => {
            if (val === '' || val === null || val === undefined) return val;
            const num = parseFloat(String(val).replace(/,/g, ''));
            if (isNaN(num)) return val;
            return Math.round(num).toLocaleString('en-US');
        };

        const formatAccountingNumber = (val) => {
            if (val === '' || val === null || val === undefined) return val;
            const num = Math.round(parseFloat(String(val).replace(/,/g, '')));
            if (isNaN(num)) return val;
            if (num < 0) {
                return `(-${Math.abs(num).toLocaleString('en-US')})`;
            }
            return num.toLocaleString('en-US');
        };

        const formatAccountingSigned = (val) => {
            if (val === '' || val === null || val === undefined) return val;
            const num = Math.round(parseFloat(String(val).replace(/,/g, '')));
            if (isNaN(num)) return val;
            if (num < 0) return `(-${Math.abs(num).toLocaleString('en-US')})`;
            return `+${num.toLocaleString('en-US')}`;
        };

        const DATE_MONTH_INDEX = { jan: 0, feb: 1, mar: 2, apr: 3, may: 4, jun: 5, jul: 6, aug: 7, sep: 8, oct: 9, nov: 10, dec: 11 };
        const parseKnownDate = (str) => {
            let m = str.match(/^(\d{4})-(\d{1,2})-(\d{1,2})(?:[ T](\d{1,2}):(\d{2})(?::\d{2})?)?$/);
            if (m) {
                const [, y, mo, d, h, mi] = m;
                return { year: parseInt(y, 10), month0: parseInt(mo, 10) - 1, day: parseInt(d, 10), hour: h !== undefined ? parseInt(h, 10) : null, minute: mi };
            }
            // This branch had no time-group capture at all, unlike its ISO sibling above --
            // SheetJS's real sheet_to_json({raw:false}) output for a "m/d/yy h:mm"-formatted
            // cell (Last Coastal ETA Time/Proforma ETA Time) is "7/3/26 1:00", not ISO, so it
            // never matched either branch and fell through to the raw passthrough at the bottom
            // of formatDate -- which happened to look almost right except the intended
            // padStart(2,'0') hour zero-pad (only applied on a successful parseKnownDate match,
            // just below) never actually ran for this data source, silently losing the leading
            // zero on a large fraction of populated rows (e.g. "7/3/26 1:00" instead of the
            // intended "7/3/26 01:00"). Value/meaning unaffected, this only fixes the missing
            // leading zero. Ported from booking_flash_report_na_Kevin_1.10_AUTO_REFRESH.html.
            m = str.match(/^(\d{1,2})\/(\d{1,2})\/(\d{2,4})(?:\s+(\d{1,2}):(\d{2})(?::\d{2})?)?$/);
            if (m) {
                const [, mo, d, y, h, mi] = m;
                return { year: y.length === 4 ? parseInt(y, 10) : 2000 + parseInt(y, 10), month0: parseInt(mo, 10) - 1, day: parseInt(d, 10), hour: h !== undefined ? parseInt(h, 10) : null, minute: mi };
            }
            return null;
        };
        const formatDate = (val, yearHintDateStr) => {
            const str = String(val ?? '').trim();
            if (!str) return '';

            const known = parseKnownDate(str);
            if (known) {
                const datePart = `${known.month0 + 1}/${known.day}/${String(known.year).slice(-2)}`;
                return known.hour !== null ? `${datePart} ${String(known.hour).padStart(2, '0')}:${known.minute}` : datePart;
            }

            const m = str.match(/^([A-Za-z]{3,9})\s+(\d{1,2})$/);
            if (m) {
                const monthKey = m[1].slice(0, 3).toLowerCase();
                const day = parseInt(m[2], 10);
                if (!(monthKey in DATE_MONTH_INDEX)) return str;
                const month0 = DATE_MONTH_INDEX[monthKey];
                const hint = parseKnownDate(String(yearHintDateStr ?? '').trim());
                if (!hint) return str;
                let year = hint.year;
                if (month0 > hint.month0 || (month0 === hint.month0 && day > hint.day)) year -= 1;
                return `${month0 + 1}/${day}/${String(year).slice(-2)}`;
            }

            return str;
        };

        // Day-granularity "has this date already happened" check (2026-09-02) -- used by the
        // Analyze modal's "Departed" star on the Weekly Capacity vs. Laden Trend chart: a VVD
        // counts as departed once its ETD Last Port date is today or earlier. Reuses
        // parseKnownDate (same date-format handling as formatDate above) rather than a raw
        // `new Date(rawVal)` parse, since raw values come through as "M/D/YY(YY)" or ISO
        // strings that Date's own parser doesn't reliably handle the same way across browsers.
        // Both sides are truncated to local midnight so a same-day ETD (any time of day) still
        // reads as departed, and the comparison isn't sensitive to the exact wall-clock moment
        // this renders.
        const isOnOrBeforeDay = (rawVal, referenceDate) => {
            const known = parseKnownDate(String(rawVal ?? '').trim());
            if (!known) return false;
            const parsed = new Date(known.year, known.month0, known.day);
            const ref = new Date(referenceDate.getFullYear(), referenceDate.getMonth(), referenceDate.getDate());
            return parsed.getTime() <= ref.getTime();
        };

        const negativeValueClass = (rawVal, format) =>
            (format === 'accounting' || format === 'number') && (parseFloat(rawVal) || 0) < 0 ? 'text-red-600' : '';

        // 2026-09-03: POL Booking Flash's "Max Ldn Vs POL Bkg" column (only) uses the reverse of
        // every other accounting/number field's convention -- red flags a POSITIVE value here,
        // black (default) a negative one, per explicit request. Deliberately a separate helper
        // from negativeValueClass above rather than a shared flag, so this one field's flipped
        // convention can't leak into Loadable Quant/Loadable WGT (same row) or any Trade/Sector
        // Summary pivot column, all of which still use the normal negative-is-red convention.
        const positiveValueClass = (rawVal) => (parseFloat(rawVal) || 0) > 0 ? 'text-red-600' : '';

        const isUtilGapFlagged = (currentUtilz, peakUtilz) => {
            const cur = Number(currentUtilz) || 0;
            const peak = Number(peakUtilz) || 0;
            return (cur - peak) > 10;
        };
        const utilGapCellClass = (currentUtilz, peakUtilz) =>
            isUtilGapFlagged(currentUtilz, peakUtilz) ? 'bg-red-600 text-white font-bold' : '';

        // Hoisted to module scope (2026-09-10 perf pass, F7 follow-up -- see
        // PERFORMANCE_REVIEW.md's corrected F7 finding for the full "measure first" writeup).
        // polRowStatusInfo/polNumVal/polVmsBlank/polUtilGapClass used to be defined fresh on
        // every render of the POL Booking Flash tab's render IIFE (the `activeTab ===
        // 'pol_booking' && (() => {...})()` block), even though none of them close over any
        // component state -- each is a pure function of the row (and, for polUtilGapClass, the
        // already-module-level getPercentNum/getPeakUtilPercentNum/utilGapCellClass) passed to
        // it. Recreating a pure function on every render is wasted allocation with zero
        // behavioral difference, and -- more importantly for the actual fix below --
        // PolTableRow's React.memo wrap needs a genuinely stable function identity to reference
        // for its own internal calls; a closure freshly allocated by the parent every render
        // would still work fine INSIDE a memoized child (it's called, not compared), so hoisting
        // these is a correctness-neutral cleanup that also documents that these never needed to
        // live inside the render body in the first place.
        const polRowStatusInfo = (row) => {
            const isVMS = String(row.vvd || '').trim().toUpperCase() === 'VMS' || String(row.vessel || '').trim().toUpperCase() === 'VMS';
            const isAPFrozen = row.loadingStatus === 'AP FROZEN';
            const isAPOnly = row.loadingStatus === 'AP ONLY';
            const isNoNACall = String(row.pol || '').trim().toUpperCase() === 'NO N.A. CALL';
            const bg = isVMS ? 'bg-[#d9d9d9] text-black font-semibold'
                : isAPFrozen ? 'bg-[#DA9694] text-black font-bold'
                : isAPOnly ? 'bg-[#ffc000] text-black font-bold'
                : isNoNACall ? 'bg-[#FF0000] italic text-black' : '';
            const badge = isNoNACall ? '[NO N.A. CALL] ' : '';
            return { isVMS, bg, badge };
        };
        const polNumVal = (row, key) => parseFloat(String(row[key] ?? '0').replace(/[,%()]/g, '')) || 0;
        const polVmsBlank = (row, displayVal) => polRowStatusInfo(row).isVMS ? '' : displayVal;
        const polUtilGapClass = (row) => utilGapCellClass(getPercentNum(row.polBkgUtilzRaw), getPeakUtilPercentNum(row.peakPolUtilzRaw));

        // Same hoist as polRowStatusInfo above, for the Booking Flash (Detail) tab's own
        // per-row VMS/AP-ONLY/AP-FROZEN status + background-class logic -- previously computed
        // inline inside processedData.map() (isVMS/isAPOnly/isAPFrozen/getBg/vmsBlank), fresh
        // per row, on every render regardless of whether that row's own data actually changed.
        // Used by the memoized DetailTableRow component below.
        const detailRowStatus = (row) => {
            const isVMS = String(row.vvd).trim().toUpperCase() === 'VMS' || String(row.vessel).trim().toUpperCase() === 'VMS';
            const isAPOnly = row.status === 'AP ONLY';
            const isAPFrozen = row.status === 'AP FROZEN';
            const isFlaggedRow = isVMS || isAPOnly || isAPFrozen;
            // `overrideTextClass` (optional, added for the shortfall column's red-flag fix --
            // see below) lets a caller supply its OWN conditional text-color utility (e.g.
            // `text-red-600` when a value is over threshold) instead of concatenating it onto
            // the className template literal separately. That concatenation is exactly Class B
            // from HANDOFF.md's "Known bug classes": every branch above already bundles a
            // `text-black` utility with its background, and appending a second text-color
            // utility of the SAME specificity (a plain single class, just like `text-black`)
            // does not "win" by coming later in the class attribute string -- the class
            // ATTRIBUTE's order has no effect on CSS precedence; only each utility's position in
            // Tailwind's generated stylesheet decides the winner when specificity ties, and that
            // insertion order is a Tailwind-internal/CDN-version detail this code doesn't
            // control. Two same-specificity text-color classes on one cell is therefore an
            // undefined winner today, not a red cell -- it only currently renders red because of
            // where Tailwind happens to emit `text-red-600` relative to `text-black`, which a
            // future Tailwind CDN bump could silently flip with no error anywhere. Routing the
            // override through getBg lets it strip its own bundled text-color class first, so
            // each cell only ever carries ONE text-color utility -- the winner is decided by
            // this code, not by stylesheet ordering.
            const getBg = (defaultBg, isApRange, overrideTextClass) => {
                let cls;
                if (isVMS) cls = 'bg-[#d9d9d9] text-black';
                else if (isAPOnly && isApRange) cls = 'bg-[#ffc000] text-black';
                else if (isAPFrozen && isApRange) cls = 'bg-[#DA9694] text-black';
                else cls = defaultBg === 'bg-white' ? 'bg-white dark:bg-gray-800' : defaultBg;
                if (!overrideTextClass) return cls;
                // Strip our own text-colour utility (including any variant prefix such as
                // `dark:`/`hover:`) before appending the caller's, so exactly ONE text-colour
                // class is ever emitted -- see the Class B note at the shortfall cell below for
                // why two would be a bug. The `(?:[a-z-]+:)*` is not currently exercised (none of
                // the branches above carry a `dark:text-*`), but this file uses `dark:` variants
                // heavily and a bare `\btext-\S+\b` would strip `text-gray-100` out of
                // `dark:text-gray-100` and leave a stray, meaningless `dark:` behind.
                return `${cls.replace(/(?:^|\s)(?:[a-z-]+:)*text-\S+/g, ' ').replace(/\s+/g, ' ').trim()} ${overrideTextClass}`.trim();
            };
            // 2026-09-04 (Item 21, Kevin): "if the VVD or Vessel name = 'VMS' make all following
            // fields blank" -- same vmsBlank pattern as the POL Booking Flash tab (see
            // polVmsBlank's own comment for the fuller history).
            const vmsBlank = (displayVal) => isVMS ? '' : displayVal;
            return { isVMS, isAPOnly, isAPFrozen, isFlaggedRow, getBg, vmsBlank };
        };

        function compareSaleWeek(a, b) {
            const parse = (s) => {
                const m = /^(\d{4})\/W(\d{1,2})$/.exec(String(s || '').trim());
                return m ? [parseInt(m[1], 10), parseInt(m[2], 10)] : null;
            };
            const pa = parse(a), pb = parse(b);
            if (pa && pb) {
                if (pa[0] !== pb[0]) return pa[0] - pb[0];
                return pa[1] - pb[1];
            }
            if (pa && !pb) return -1;
            if (!pa && pb) return 1;
            return collator.compare(String(a || ''), String(b || ''));
        }

        // 2026-09-08, per Kevin: within a Sale Week, POL Booking Flash and Booking
        // Flash/Detail should order rows by actual ETD date, not alphabetically by
        // vessel/VVD/POL. Confirmed live why this mattered: a vessel's PAROD01 leg
        // (Port Seq 3, sails LAST) was rendering as the FIRST row in that vessel's
        // block, purely because "PAROD..." sorts alphabetically before "USLAX...";
        // its true Coastal ETD is later than the other legs'. Reuses parseKnownDate
        // (same date-format handling formatDate/isOnOrBeforeDay already rely on)
        // rather than a second parallel date parser. Mirrors compareSaleWeek's own
        // fallback shape: a row with an unparseable/blank date sorts after one that
        // parses, and two unparseable dates fall back to a plain string compare so
        // the order is still fully deterministic (never "equal," which would leave
        // sort() free to reorder those rows arbitrarily between renders).
        function compareEtd(a, b) {
            const parse = (s) => {
                const known = parseKnownDate(String(s ?? '').trim());
                if (!known) return null;
                return new Date(known.year, known.month0, known.day, known.hour || 0, known.minute || 0).getTime();
            };
            const pa = parse(a), pb = parse(b);
            if (pa !== null && pb !== null) return pa - pb;
            if (pa !== null && pb === null) return -1;
            if (pa === null && pb !== null) return 1;
            return collator.compare(String(a || ''), String(b || ''));
        }

        // ---------------------------------------------------------------------------
        // Schedule-change warning (2026-09-08, placeholder thresholds -- see
        // SCHEDULE_CHANGE_THRESHOLDS below and DATA_ARCHITECTURE.md/HANDOFF.md for the
        // full writeup). Motivating case: the live CSV source is itself a Google Sheet
        // that gets edited between refreshes -- a sailing's status can flip to
        // "NO N.A. CALL", a whole Sale Week's assigned vessel can change, etc. That's
        // normal upstream data churn, not an app bug, but from inside the app it looks
        // identical to a real regression (a vessel's Cutoff/ETD go from populated to
        // blank; a Sale Week that had data now has none) -- Kevin had to re-investigate
        // from scratch once already to tell the two apart (Lane MAR, VVD NLAT0668E).
        // diffScheduleChange() compares the dataset about to replace the live one
        // against the one it's replacing (see applyCsvText's own call site) so a
        // big-enough change can be flagged with a plain-English "this is probably the
        // data source, not the app" explanation instead of a silent, confusing swap.
        //
        // Keyed by VVD (String(row.vvd || '').trim().toUpperCase()). Blank VVDs are
        // skipped -- nothing meaningful to track. "VMS" is also skipped: it's a real
        // placeholder VVD used for a not-yet-nominated sailing week, not an actual
        // vessel, so a "VMS" appearing/disappearing between refreshes is meaningless
        // (every real lane has one at any time a week isn't yet nominated -- flagging
        // that would be permanent noise, not a signal).
        const isBlankVal = (v) => String(v ?? '').trim() === '';
        const isNoNaCallVal = (v) => String(v ?? '').trim().toUpperCase() === 'NO N.A. CALL';

        // A VVD can have multiple raw rows, one per POL leg (see HANDOFF's "row-
        // duplication-per-VVD" note). Every field this diff needs (lane/saleWeek/
        // vessel/cutoff/etd/pol/status) is a whole-vessel/whole-sailing attribute, not
        // a per-leg one, so first-leg-wins is fine here -- unlike a TEU/quantity field,
        // there's no aggregation semantics to get wrong.
        function collapseRowsByVvdForDiff(rows) {
            const byVvd = new Map();
            for (const row of (rows || [])) {
                const vvd = String(row.vvd || '').trim().toUpperCase();
                if (!vvd || vvd === 'VMS') continue;
                if (byVvd.has(vvd)) continue;
                byVvd.set(vvd, {
                    vvd,
                    lane: row.lane || '(no lane)',
                    saleWeek: row.saleWeek || '',
                    vessel: row.vessel || '',
                    cutoff: row.cutoff,
                    etd: row.etd,
                    pol: row.pol,
                    status: row.statusDisplay || row.status || '',
                });
            }
            return byVvd;
        }

        // Pure: takes two already-parsed row arrays (the OLD/currently-live dataset and
        // the NEW/about-to-replace-it one) and returns a structured diff, never mutates
        // either input and touches no React state -- callers decide what to do with the
        // result. See applyCsvText for the one real call site (liveRawRowsRef.current
        // as oldRows, result.rows as newRows, called BEFORE either ref/state is
        // overwritten).
        function diffScheduleChange(oldRows, newRows) {
            const oldByVvd = collapseRowsByVvdForDiff(oldRows);
            const newByVvd = collapseRowsByVvdForDiff(newRows);

            const removedItems = [];
            const addedItems = [];
            for (const [vvd, entry] of oldByVvd) {
                if (!newByVvd.has(vvd)) removedItems.push(entry);
            }
            for (const [vvd, entry] of newByVvd) {
                if (!oldByVvd.has(vvd)) addedItems.push(entry);
            }

            // Per-lane VVD counts in each dataset -- the denominator for the rate-based
            // half of the significance rule (see SCHEDULE_CHANGE_THRESHOLDS).
            const countByLane = (byVvd) => {
                const counts = new Map();
                for (const entry of byVvd.values()) {
                    counts.set(entry.lane, (counts.get(entry.lane) || 0) + 1);
                }
                return counts;
            };
            const oldLaneCounts = countByLane(oldByVvd);
            const newLaneCounts = countByLane(newByVvd);

            const groupByLane = (items) => {
                const byLane = new Map();
                for (const item of items) {
                    if (!byLane.has(item.lane)) byLane.set(item.lane, []);
                    byLane.get(item.lane).push(item);
                }
                return byLane;
            };
            const buildLaneStats = (items, laneDenomCounts) => {
                const grouped = groupByLane(items);
                const stats = [];
                for (const [lane, laneItems] of grouped) {
                    const denom = laneDenomCounts.get(lane) || laneItems.length;
                    stats.push({
                        lane,
                        changedCount: laneItems.length,
                        denomCount: denom,
                        ratePct: denom > 0 ? (laneItems.length / denom) * 100 : 0,
                        vvds: laneItems,
                    });
                }
                stats.sort((a, b) => b.ratePct - a.ratePct);
                return stats;
            };
            // removedLaneStats' rate is "removed / how many that lane had before" (the
            // motivating case's actual shape -- a lane losing its own sailings).
            const removedLaneStats = buildLaneStats(removedItems, oldLaneCounts);
            // addedLaneStats' rate is "added / how many that lane has now" -- same shape,
            // informational (a lane suddenly gaining several new VVDs at once is also
            // worth a human's attention, e.g. several weeks getting nominated at once),
            // but per Kevin's motivating case this doesn't by itself drive isSignificant
            // below -- only disappearing schedule data does. Kept here so a future
            // calibration pass can wire it in without re-deriving this grouping.
            const addedLaneStats = buildLaneStats(addedItems, newLaneCounts);

            // Date flips: cutoff/etd going blank->populated or populated->blank on a
            // VVD present in BOTH datasets (a VVD that disappeared entirely is already
            // counted above, not double-counted here).
            const dateFlips = [];
            const polFlipsToNoNaCall = [];
            const polFlipsFromNoNaCall = [];
            for (const [vvd, oldEntry] of oldByVvd) {
                const newEntry = newByVvd.get(vvd);
                if (!newEntry) continue;

                for (const field of ['cutoff', 'etd']) {
                    const wasBlank = isBlankVal(oldEntry[field]);
                    const isBlankNow = isBlankVal(newEntry[field]);
                    if (wasBlank !== isBlankNow) {
                        dateFlips.push({
                            vvd, lane: newEntry.lane, field,
                            oldValue: oldEntry[field], newValue: newEntry[field],
                            direction: wasBlank ? 'blank_to_populated' : 'populated_to_blank',
                        });
                    }
                }

                // This is the exact real-world pattern from the motivating case (a
                // sailing's status flipping to "NO N.A. CALL") -- called out as its own
                // bucket, separate from dateFlips above, even though the two are
                // correlated in practice (a "NO N.A. CALL" leg's Cutoff/ETD are usually
                // blank too), because "the POL itself changed" is a clearer, more
                // specific thing to tell a human than "some date went blank."
                const wasNoCall = isNoNaCallVal(oldEntry.pol);
                const isNoCallNow = isNoNaCallVal(newEntry.pol);
                if (!wasNoCall && isNoCallNow) {
                    polFlipsToNoNaCall.push({ vvd, lane: newEntry.lane, oldValue: oldEntry.pol, newValue: newEntry.pol });
                } else if (wasNoCall && !isNoCallNow) {
                    polFlipsFromNoNaCall.push({ vvd, lane: newEntry.lane, oldValue: oldEntry.pol, newValue: newEntry.pol });
                }
            }

            // --- Significance (see SCHEDULE_CHANGE_THRESHOLDS for the full derivation) ---
            const T = SCHEDULE_CHANGE_THRESHOLDS;
            // Net VVDs lost per lane this refresh (removed minus added, i.e. NOT
            // backfilled same-day) -- the universal primary signal, computed for every
            // lane that lost or gained at least one VVD so a lane that only gained isn't
            // missed (it'll just come out <=0 and never fire).
            const removedCountByLane = new Map(removedLaneStats.map(s => [s.lane, s.changedCount]));
            const addedCountByLane = new Map(addedLaneStats.map(s => [s.lane, s.changedCount]));
            const touchedLanes = new Set([...removedCountByLane.keys(), ...addedCountByLane.keys()]);
            const laneNetLoss = new Map();
            for (const lane of touchedLanes) {
                laneNetLoss.set(lane, (removedCountByLane.get(lane) || 0) - (addedCountByLane.get(lane) || 0));
            }
            // A lane counts as significantly affected if EITHER the universal net-loss
            // rule fires (removed-added >= laneNetLossThreshold, any lane size) OR the
            // supplementary gross-rate rule fires (large lanes only -- >= laneSizeForRatePct
            // VVDs before this refresh -- losing >= perLaneRemovedRatePct% of themselves at
            // once even if fully backfilled to net-zero). See the threshold block's own
            // comments for why both rules exist.
            const significantRemovedLanes = removedLaneStats.filter(s =>
                (laneNetLoss.get(s.lane) || 0) >= T.laneNetLossThreshold ||
                (s.denomCount >= T.laneSizeForRatePct && s.ratePct >= T.perLaneRemovedRatePct)
            );
            // Distinct VVDs having a "concerning" flip -- concerningFlipVvdThreshold is a
            // VVD count, not a raw flip-event count, so a single VVD flipping both Cutoff
            // AND ETD blank only counts once here. Direction matters: only
            // populated->blank date flips and flips TO "NO N.A. CALL" count -- the
            // opposite directions (blank->populated, flipping OFF "NO N.A. CALL") are
            // benign "good news" and are deliberately excluded (see the threshold
            // block's own comment for the archive evidence behind this).
            const concerningFlippedVvds = new Set([
                ...dateFlips.filter(f => f.direction === 'populated_to_blank').map(f => f.vvd),
                ...polFlipsToNoNaCall.map(f => f.vvd),
            ]);
            const isSignificant = significantRemovedLanes.length > 0 || concerningFlippedVvds.size >= T.concerningFlipVvdThreshold;

            // --- Human-readable summary (the banner renders these directly) ---
            const summaryLines = [];
            for (const s of significantRemovedLanes) {
                summaryLines.push(
                    s.denomCount < T.laneSizeForRatePct
                        ? `${s.lane}: ${s.changedCount} of ${s.denomCount} sailing(s) lost their schedule data`
                        : `${s.lane}: ${s.changedCount} of ${s.denomCount} sailings (${Math.round(s.ratePct)}%) lost their schedule data`
                );
            }
            // 2026-09-09, per Kevin: name which lane(s) each flip-based line touches -- unlike
            // significantRemovedLanes above (already one line PER lane), a flip-based line
            // aggregates across every affected VVD into a single count, which could span many
            // lanes at once with no way to tell which ones without opening the raw data. Each
            // flip object already carries its own `lane` (set where dateFlips/polFlips* are
            // built, right after collapseRowsByVvdForDiff), so this is just a distinct-lane
            // list, deduped and sorted -- same truncate-past-N-then-"..." convention already
            // used for the VVD list on the NO N.A. CALL line just below.
            const laneList = (flips, cap = 6) => {
                const lanes = [...new Set(flips.map(f => f.lane || '(no lane)'))].sort();
                return lanes.length > cap ? `${lanes.slice(0, cap).join(', ')}, ...` : lanes.join(', ');
            };
            if (polFlipsToNoNaCall.length > 0) {
                summaryLines.push(`${polFlipsToNoNaCall.length} sailing(s) flipped to "NO N.A. CALL" (${polFlipsToNoNaCall.slice(0, 3).map(f => f.vvd).join(', ')}${polFlipsToNoNaCall.length > 3 ? ', ...' : ''}) -- lane(s): ${laneList(polFlipsToNoNaCall)}`);
            }
            if (polFlipsFromNoNaCall.length > 0) {
                summaryLines.push(`${polFlipsFromNoNaCall.length} sailing(s) flipped OFF "NO N.A. CALL" (now show a real POL again) -- lane(s): ${laneList(polFlipsFromNoNaCall)}`);
            }
            const blankedFlips = dateFlips.filter(f => f.direction === 'populated_to_blank');
            const populatedFlips = dateFlips.filter(f => f.direction === 'blank_to_populated');
            if (blankedFlips.length > 0) summaryLines.push(`${blankedFlips.length} Cutoff/ETD value(s) went from populated to blank -- lane(s): ${laneList(blankedFlips)}`);
            if (populatedFlips.length > 0) summaryLines.push(`${populatedFlips.length} Cutoff/ETD value(s) went from blank to populated -- lane(s): ${laneList(populatedFlips)}`);
            if (addedItems.length > 0) {
                summaryLines.push(`${addedItems.length} new VVD(s) appeared that weren't in the previous refresh`);
            }
            if (removedItems.length > 0 && significantRemovedLanes.length === 0) {
                // Removed VVDs happened but no single lane crossed the significance bar
                // (e.g. spread thinly across many lanes) -- still worth a line if
                // something else (date/POL flips) is what triggered isSignificant.
                summaryLines.push(`${removedItems.length} VVD(s) total disappeared from the schedule (spread across ${removedLaneStats.length} lane(s), none individually over the threshold)`);
            }

            return {
                removedVvds: { count: removedItems.length, items: removedItems, byLane: removedLaneStats },
                addedVvds: { count: addedItems.length, items: addedItems, byLane: addedLaneStats },
                dateFlips,
                polFlips: { toNoNaCall: polFlipsToNoNaCall, fromNoNaCall: polFlipsFromNoNaCall },
                isSignificant,
                summaryLines,
            };
        }

        const SEC_ALLOC_BOLD_KEYWORDS = [
            "AEJEA:", "CNNGB:", "CNSHA:", "CNSHK:", "COOPL Discharge:", "COSPC Discharge(Unit):",
            "CR/GT/NI Discharge:", "EB PA Load:", "FRFOS/ESVLC Discharge:", "GRPIR:", "INPAV:",
            "KRPUS:", "LATAM Load:", "MX Laden:", "PA Load:", "PAROD Discharge :",
            "PAROD Move Count Unit:", "LKCMB:", "SGSIN:", "BEANR:", "DEBRV:", "DEHAM:", "FRLEH:",
            "GBSOU:", "LATAM:", "NLRTM:", "THLCH:", "VNCMP:", "ESALG:", "ESVLC:", "FRFOS:",
            "ITGOA:", "ITSPE:", "Laden:", "ITSAL:", "TRALI:", "TRISK:", "TRIST:", "INNSA:", "MTY:",
            "PAROD Discharge:"
        ];

        const SEC_ALLOC_PATTERN = (() => {
            const escapeRegex = (s) => s.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
            const sortedKeywords = [...SEC_ALLOC_BOLD_KEYWORDS].sort((a, b) => b.length - a.length);
            const keywordPattern = sortedKeywords.map(escapeRegex).join('|');
            const redPattern = '\\+\\d+\\*+|\\(-\\d+\\*+\\)';
            return new RegExp(`(${keywordPattern})|(${redPattern})`, 'gi');
        })();

        const renderSecAlloc = (text) => {
            if (text === null || text === undefined || text === '') return text;
            const raw = String(text);
            if (raw.trim() === '*') return null;

            const combined = SEC_ALLOC_PATTERN;
            combined.lastIndex = 0;

            const parts = [];
            let lastIndex = 0;
            let match;
            let key = 0;
            while ((match = combined.exec(raw)) !== null) {
                if (match.index > lastIndex) {
                    parts.push(<React.Fragment key={key++}>{raw.slice(lastIndex, match.index)}</React.Fragment>);
                }
                if (match[1]) {
                    parts.push(<b key={key++}>{match[1]}</b>);
                } else if (match[2]) {
                    parts.push(<span key={key++} className="text-red-600 font-semibold">{match[2]}</span>);
                }
                lastIndex = combined.lastIndex;
                if (match.index === combined.lastIndex) combined.lastIndex += 1;
            }
            if (lastIndex < raw.length) {
                parts.push(<React.Fragment key={key++}>{raw.slice(lastIndex)}</React.Fragment>);
            }
            return parts;
        };

        const renderAsteriskHide = (text) => {
            if (text === null || text === undefined || text === '') return text;
            const raw = String(text);
            if (raw.trim() === '*') return null;
            return raw;
        };

        const measureRenderedTextWidth = (el) => {
            if (!el) return 0;
            try {
                const range = document.createRange();
                range.selectNodeContents(el);
                const handle = el.querySelector(':scope > [data-resize-handle]');
                if (handle) range.setEndBefore(handle);
                return range.getBoundingClientRect().width;
            } catch {
                return el.scrollWidth || 0;
            }
        };

        // PivotTableViewer itself is NOT wrapped in React.memo (2026-09-10 perf pass, F6 --
        // deliberate non-change). All of its call sites (Booking Summary/Sector Summary x2/Trade
        // Summary tabs, further down in FlashReportDashboard's render) pass `config` as a fresh
        // inline object literal every render -- new `rowFields`/`dataFields` arrays, new
        // `cellClass`/`calc` arrow functions every time -- and one of them (Trade Summary) also
        // closes over `laneAwareMaxLdn`, a non-memoized component-scoped function. A React.memo
        // wrap would shallow-compare `config` against a different object reference on every
        // single render regardless of whether the actual pivot shape changed, so it would never
        // skip a re-render -- pure comparison overhead for zero benefit, and those call sites sit
        // outside this workstream's owned regions (entangled with the filter-pipeline code
        // another agent in this pass owns), so hoisting the configs to stable references is out
        // of scope here. The real, in-scope wins applied instead: toggleCollapse and
        // startColResize below are now stable across renders (useCallback), the resize drag is
        // rAF-coalesced instead of one setState per raw mousemove event (F5), and
        // ColResizeHandle -- instantiated once per visible column header -- is memoized.
        const PivotTableViewer = ({ data, config }) => {
            const [collapsedNodes, setCollapsedNodes] = useState(new Set());
            // useCallback + functional setState (2026-09-10 perf pass, F6): this used to close
            // over `collapsedNodes` directly and be recreated on every render (a fresh function
            // handed to every expand/collapse button in the tree, defeating any memoization of
            // the row components below it). Reading the previous Set from the setState updater
            // instead of the render-time closure makes this stable across renders (empty dep
            // array) with byte-for-byte identical toggle behavior.
            const toggleCollapse = useCallback((nodeId) => {
                setCollapsedNodes(prev => {
                    const next = new Set(prev);
                    if (next.has(nodeId)) next.delete(nodeId);
                    else next.add(nodeId);
                    return next;
                });
            }, []);
            const { rowFields = [], dataFields = [], title = "Pivot", colField = null, valuesInRows = false, rowClass = null, accentColor = '#E5007D', prettyGrandTotal = false, showGrandTotal = true, showGrandTotalColumn = true, childOrder = null, hideRowToggles = false, tabular = false } = config;

            const [colWidths, setColWidths] = useState({});
            const manualColWidthKeysRef = useRef(new Set());
            // colWidthsRef mirrors colWidths so startColResize can read the latest widths
            // without closing over the `colWidths` state value -- that's what lets the
            // useCallback below have an empty dep array (a stable identity for the life of the
            // component) instead of being rebuilt every time a resize commits a new width.
            const colWidthsRef = useRef(colWidths);
            useEffect(() => { colWidthsRef.current = colWidths; }, [colWidths]);
            // pendingResizeRef/resizeRafRef (2026-09-10 perf pass, F5): the drag handler used to
            // call setColWidths on every native 'mousemove' event -- which fires at up to
            // display refresh rate or higher -- and each call re-rendered this whole pivot table
            // (every row, every cell) mid-drag. Coalescing into one requestAnimationFrame-
            // scheduled state write per frame means at most one re-render per painted frame,
            // which is all a resize handle's visual feedback needs; the resulting column width
            // is identical, just applied at most once per frame instead of once per raw event.
            const pendingResizeRef = useRef(null); // { key, startWidth, startX, clientX }
            const resizeRafRef = useRef(null);
            // activeResizeCleanupRef lets an unmount mid-drag (e.g. the user switches tabs,
            // which unmounts this PivotTableViewer instance, while a resize handle is still
            // held down) actually remove the window-level listeners instead of leaking them --
            // previously onUp only ran on a real 'mouseup', so an interrupted drag left a
            // 'mousemove'/'mouseup' listener on `window` forever (and a phantom rAF still
            // pending), silently doing work for the lifetime of the page even though the pivot
            // table that started it is long gone.
            const activeResizeCleanupRef = useRef(null);
            useEffect(() => {
                return () => {
                    if (activeResizeCleanupRef.current) {
                        activeResizeCleanupRef.current();
                        activeResizeCleanupRef.current = null;
                    }
                };
            }, []);
            const startColResize = useCallback((key) => (e) => {
                e.preventDefault();
                e.stopPropagation();
                const thEl = e.currentTarget.closest('th');
                const startWidth = colWidthsRef.current[key] || (thEl ? thEl.offsetWidth : 80);
                const startX = e.clientX;
                pendingResizeRef.current = { key, startWidth, startX, clientX: startX };
                const flush = () => {
                    resizeRafRef.current = null;
                    const p = pendingResizeRef.current;
                    if (!p) return;
                    manualColWidthKeysRef.current.add(p.key);
                    const newWidth = Math.max(40, p.startWidth + (p.clientX - p.startX));
                    setColWidths(prev => ({ ...prev, [p.key]: newWidth }));
                };
                const onMove = (moveEvent) => {
                    if (!pendingResizeRef.current) return;
                    pendingResizeRef.current.clientX = moveEvent.clientX;
                    if (resizeRafRef.current == null) {
                        resizeRafRef.current = requestAnimationFrame(flush);
                    }
                };
                const onUp = () => {
                    window.removeEventListener('mousemove', onMove);
                    window.removeEventListener('mouseup', onUp);
                    if (resizeRafRef.current != null) {
                        cancelAnimationFrame(resizeRafRef.current);
                        resizeRafRef.current = null;
                    }
                    pendingResizeRef.current = null;
                    activeResizeCleanupRef.current = null;
                };
                activeResizeCleanupRef.current = onUp;
                window.addEventListener('mousemove', onMove);
                window.addEventListener('mouseup', onUp);
            }, []);
            // ColResizeHandle is instantiated once per visible column header (often dozens per
            // pivot). A plain function defined inline in a render body gets a brand-new
            // component *type* every render regardless of React.memo (memo only helps when the
            // component reference itself is stable), which would force React to unmount/remount
            // every handle's <span> each render instead of just updating it. useMemo freezes the
            // component's identity for the life of this PivotTableViewer instance, keyed off
            // `startColResize` -- which is itself now stable (useCallback, empty deps, above) --
            // so the memoized component is built exactly once, and its own React.memo wrapper
            // then does real work: colKey is a primitive string, so unchanged colKey -> skip.
            const ColResizeHandle = useMemo(() => React.memo(({ colKey }) => {
                const onMouseDown = useCallback((e) => startColResize(colKey)(e), [colKey]);
                return (
                    <span
                        onMouseDown={onMouseDown}
                        data-resize-handle="true"
                        className="absolute top-0 right-0 h-full w-1.5 cursor-col-resize hover:bg-blue-400 active:bg-blue-600 z-10"
                        style={{ userSelect: 'none' }}
                        aria-hidden="true"
                    />
                );
            }), [startColResize]);

            const tableRef = useRef(null);

            const getRowStatusBadge = (cls) => {
                if (!cls) return '';
                if (cls.includes('bg-[#d9d9d9]')) return '[VMS] ';
                if (cls.includes('bg-[#DA9694]')) return '[AP Frozen] ';
                if (cls.includes('bg-[#ffc000]')) return '[AP Only] ';
                if (cls.includes('bg-[#FF0000]')) return '[NO N.A. CALL] ';
                if (cls.includes('bg-[#fecaca]')) return '[Port Excluded] ';
                return '';
            };

            const aggregated = useMemo(() => {
                const root = { _totals: {}, _children: {}, label: 'Grand Total', context: {} };
                const colKeysSet = new Set();
                
                data.forEach(row => {
                    if (colField) {
                        const colVal = row[colField] || '(blank)';
                        colKeysSet.add(colVal);
                    }
                    
                    let current = root;
                    
                    const aggregateData = (node, r, colVal = 'Total') => {
                        if (!node._totals[colVal]) {
                            node._totals[colVal] = {};
                            dataFields.forEach(df => {
                                node._totals[colVal][df.name] = { sum: 0, count: 0, max: -Infinity };
                            });
                        }
                        dataFields.forEach(df => {
                            const val = parseFloat(String(r[df.base] || '0').replace(/[,%()]/g, '')) || 0;
                            node._totals[colVal][df.name].sum += val;
                            node._totals[colVal][df.name].count += 1;
                            if (val > node._totals[colVal][df.name].max) node._totals[colVal][df.name].max = val;
                        });
                    };
                    
                    const cVal = colField ? (row[colField] || '(blank)') : 'Total';
                    
                    aggregateData(root, row, 'Total');
                    if (colField) aggregateData(root, row, cVal);
                    
                    rowFields.forEach((rf, idx) => {
                        const val = row[rf.key] || '(blank)';
                        if (!current._children[val]) {
                            current._children[val] = { _totals: {}, _children: {}, label: val, context: { ...current.context, [rf.key]: row[rf.key] } };
                        }
                        
                        current = current._children[val];
                        aggregateData(current, row, 'Total');
                        if (colField) aggregateData(current, row, cVal);
                    });
                });
                
                const colKeys = Array.from(colKeysSet).sort(compareSaleWeek);

                const rollupFields = dataFields.filter(df => df.rollupSumOfChildren && df.agg === 'max');
                if (rollupFields.length > 0) {
                    const applyRollup = (node, depth) => {
                        const childNodes = Object.values(node._children);
                        childNodes.forEach(c => applyRollup(c, depth + 1));
                        if (childNodes.length === 0) return;
                        rollupFields.forEach(df => {
                            const stableAtDepth = df.rollupStableAtDepth || Infinity;
                            if (depth >= stableAtDepth) return;
                            const colVals = new Set(Object.keys(node._totals));
                            childNodes.forEach(c => Object.keys(c._totals).forEach(cv => colVals.add(cv)));
                            colVals.forEach(colVal => {
                                if (!node._totals[colVal] || !node._totals[colVal][df.name]) return;
                                let sum = 0;
                                childNodes.forEach(c => {
                                    const ct = c._totals[colVal] && c._totals[colVal][df.name];
                                    if (ct) sum += ct.max;
                                });
                                node._totals[colVal][df.name].max = sum;
                            });
                        });
                    };
                    applyRollup(root, 0);
                }

                return { root, colKeys };
            }, [data, config]);
            
            const flattenTabular = (node, level = 0, currentPath = [], isLastChild = true) => {
                let rows = [];
                const hasChildren = Object.keys(node._children).length > 0;

                const myPath = level === 0 ? [] : [...currentPath, node.label];
                // Latent-bug fix (correctness audit, 2026-09-10): `nodeId` used to be built by
                // plain string concatenation with an implicit, unescaped "-" separator
                // (`${parentId}-${node.label}`). A label containing its own "-" is never
                // escaped, so two different tree paths can produce the same id -- e.g. a Trade
                // "A-B" + SubTrade "C" collides with Trade "A" + SubTrade "B-C" (both used to
                // stringify to "root-A-B-C"). `nodeId` keys the `collapsedNodes` Set, so a
                // collision meant collapsing one row silently collapsed an unrelated one too.
                // Fixed by keying off `JSON.stringify(myPath)` instead: `myPath` is already the
                // full array of this node's ancestor labels (built above, one real string per
                // tree level, never concatenated into one), and JSON's own array/string
                // encoding unambiguously escapes quotes/backslashes inside each element and
                // delimits elements with structural `,`/`[`/`]`/`"` characters that a raw label
                // cannot forge -- so path ["A-B","C"] and ["A","B-C"] now serialize to
                // genuinely different strings (`["A-B","C"]` vs `["A","B-C"]`) instead of
                // colliding. This is stable across re-renders (same node visited twice in the
                // same render always has the same `myPath`, so `collapsedNodes` entries survive
                // a re-render, e.g. a filter change, without being silently dropped -- see the
                // verification notes in HANDOFF.md/this commit's message) and safe as a React
                // `key`/DOM attribute value (any string is; see below for why JSON's bracket-
                // and-quote-heavy shape was still chosen over a plain escaped-hyphen scheme:
                // readability under devtools inspection was judged less important than not
                // hand-rolling a second custom escaping scheme alongside this file's existing
                // one for `path.join('|')` used by `childOrder` lookups just below).
                // **Currently latent, but closer to reachable than it looks**: no trade/sub-
                // trade/lane/sale-week/VVD code in either real export
                // (`Booking_Flash_Data_MAIN_UPLOAD_8-12-2026.xlsx`,
                // `Booking_Flash_Historical_Data_2026-08-24_to_2026-09-01.csv`) contains a
                // hyphen, but the VESSEL NAME field does: "X-PRESS ANTLIA" appears in both real
                // exports, and `vessel` is a rowField on the one PivotTableViewer instance
                // (`activeTab === 'booking_flash'`, hidden per README/HANDOFF -- do not wire it
                // up) that actually exercises `flatten()`/`collapsedNodes`. Today's data still
                // does not produce an actual id collision (no two distinct tree paths happen to
                // concatenate to the same string), so this remains a no-op on the live app, but
                // it is one real-world label away from tripping, not a purely hypothetical
                // config. `flattenTabular` itself never reads `collapsedNodes` (see the comment
                // above `renderRows`), so this fix only changes the `id` field's *value*, never
                // its presence/absence or any rendered output -- confirmed via the tabular-mode
                // pixel diff in this commit's verification.
                const nodeId = JSON.stringify(myPath);

                if (level === rowFields.length || (!hasChildren && level > 0)) {
                    rows.push({
                        id: nodeId,
                        level,
                        path: myPath,
                        label: node.label,
                        totals: node._totals,
                        context: node.context,
                        isLastChild,
                        hasChildren
                    });
                    return rows;
                }

                const pathStr = myPath.join('|') || 'ROOT';
                const order = childOrder && childOrder[pathStr];
                const childrenKeys = rowFields[level] && rowFields[level].key === 'saleWeek'
                    ? Object.keys(node._children).sort(compareSaleWeek)
                    : order
                        ? [
                            ...order.filter(k => k in node._children),
                            ...Object.keys(node._children).filter(k => !order.includes(k)).sort()
                        ]
                        : Object.keys(node._children).sort();

                if (childrenKeys.length === 0) {
                     rows.push({
                        id: nodeId,
                        level,
                        path: myPath,
                        label: node.label,
                        totals: node._totals,
                        context: node.context,
                        isLastChild,
                        hasChildren: false
                    });
                } else {
                    childrenKeys.forEach((key, index) => {
                        const isLast = index === childrenKeys.length - 1;
                        rows = rows.concat(flattenTabular(node._children[key], level + 1, myPath, isLast));
                    });
                }
                return rows;
            };

            const flatten = (node, level = 0, isLastChild = true, prefix = '', parentPath = '', idPath = []) => {
                let rows = [];
                const hasChildren = Object.keys(node._children).length > 0;
                // Latent-bug fix (correctness audit, 2026-09-10) -- see flattenTabular's own
                // longer writeup just above (~line 1516) for the full explanation; this is the
                // exact same defect and the exact same fix, applied to the render path that
                // actually reads `collapsedNodes` (`flattenTabular` never does -- see the
                // comment above `renderRows` below). `nodeId` used to be
                // `${parentId}-${node.label}`, an unescaped "-"-joined string where a label
                // containing its own "-" (e.g. the real vessel name "X-PRESS ANTLIA", confirmed
                // present in both `Booking_Flash_Data_MAIN_UPLOAD_8-12-2026.xlsx` and
                // `Booking_Flash_Historical_Data_2026-08-24_to_2026-09-01.csv`, and reachable
                // here because `vessel` is a rowField on the one PivotTableViewer instance --
                // `activeTab === 'booking_flash'`, hidden, do not wire it up -- that actually
                // exercises this function) could make two different tree paths hash to the same
                // id, which would silently collapse an unrelated row alongside the one the user
                // actually clicked (`collapsedNodes` is keyed by this id). `idPath` is the
                // array of this node's ancestor labels, one real array element per tree level
                // (built the same way `flattenTabular`'s `myPath` is); `JSON.stringify(idPath)`
                // turns it into an id whose structural `[`/`]`/`"`/`,` characters and built-in
                // escaping of quotes/backslashes cannot be forged by a label's own "-", so
                // distinct paths can no longer collide no matter what a label contains. Stable
                // across re-renders (same node -> same `idPath` -> same id every time, so a
                // `collapsedNodes` entry survives a re-render -- e.g. a filter change -- instead
                // of silently dropping), and a JSON-array string is valid as both a React `key`
                // and a plain string Set member / DOM attribute value. This is a no-op on the
                // live app today (no two real tree paths currently reconstruct the same
                // concatenated string even with "X-PRESS ANTLIA" in the data), but latent bugs
                // in this exact shape are how the recent `collapsedNodes` dependency-array fix
                // (see comment above `renderRows`) made collapse start actually doing something
                // again -- worth closing before that happens here too.
                const nodeId = JSON.stringify(idPath);
                rows.push({
                    id: nodeId,
                    level,
                    label: node.label,
                    totals: node._totals,
                    context: node.context,
                    isLastChild,
                    prefix,
                    hasChildren
                });

                if (collapsedNodes.has(nodeId)) return rows;

                const path = parentPath || 'ROOT';
                const order = childOrder && childOrder[path];
                const childrenKeys = rowFields[level] && rowFields[level].key === 'saleWeek'
                    ? Object.keys(node._children).sort(compareSaleWeek)
                    : order
                        ? [
                            ...order.filter(k => k in node._children),
                            ...Object.keys(node._children).filter(k => !order.includes(k)).sort()
                        ]
                        : Object.keys(node._children).sort();
                childrenKeys.forEach((key, index) => {
                    const isLast = index === childrenKeys.length - 1;
                    const newPrefix = prefix + (isLastChild ? '    ' : '│   ');
                    const newParentPath = parentPath ? `${parentPath}|${key}` : key;
                    rows = rows.concat(flatten(node._children[key], level + 1, isLast, newPrefix, newParentPath, [...idPath, key]));
                });
                return rows;
            };
            
            // 2026-09-10 (W7 correctness audit): `collapsedNodes` was missing from this
            // useMemo's dependency array. The `!tabular` branch's `flatten()` reads
            // `collapsedNodes` directly to decide whether to skip a node's children
            // (`if (collapsedNodes.has(nodeId)) return rows;`), but useMemo only recomputes
            // when something in the dep array itself changes identity -- it has no way to
            // know the memoized callback's own closure reads component state that isn't
            // listed. So a collapse/expand click (`toggleCollapse` -> `setCollapsedNodes`)
            // re-rendered the component -- the clicked toggle button's own arrow/aria-label
            // flipped correctly, since that JSX reads `collapsedNodes` live, outside this
            // memo -- but `renderRows` kept serving its stale flattened list, so the row
            // stayed expanded/collapsed on screen regardless of the click. Confirmed live: a
            // synthetic PivotTableViewer instance with `hideRowToggles`/`tabular` both left
            // at their default `false` (the shape needed for a toggle button to even render
            // -- see below) had its collapse button correctly flip its own arrow/aria-label
            // on click, while the child rows it should have hidden stayed on screen with an
            // unchanged row count, reproducing this exact bug.
            // **Currently dormant in the live app**: every PivotTableViewer instance actually
            // reachable from a tab (Trade Summary, both Sector Summary pivots) sets
            // `tabular: true`, and `tabular` mode's own render path (`flattenTabular`) never
            // reads `collapsedNodes` at all -- collapse toggles only exist in the `!tabular`
            // branch, and those 3 pivots also set `hideRowToggles: true` on top of that, so
            // none of today's wired-up pivots even render a toggle button to click. Fixed
            // here anyway, in the shared engine rather than at a call site, since the very
            // next pivot config that leaves both flags at their default would hit this dead
            // on arrival with no warning -- the fix costs nothing today (`collapsedNodes`
            // only ever changes via a button this dependency has no other effect on) and
            // prevents a silent regression the moment collapse becomes reachable again.
            const renderRows = useMemo(() => {
                if (!aggregated.root || Object.keys(aggregated.root._totals).length === 0) return [];
                if (tabular) {
                    const flat = flattenTabular(aggregated.root, 0, [], true);
                    return showGrandTotal ? flat : flat.filter(row => row.level !== 0);
                } else {
                    const flat = flatten(aggregated.root, 0, true, '');
                    return showGrandTotal ? flat : flat.filter(row => row.level !== 0);
                }
            }, [aggregated, showGrandTotal, tabular, collapsedNodes]);
            
            const colKeysToRender = colField ? aggregated.colKeys : ['Total'];

            const colKeysWithTotal = colField
                ? (showGrandTotalColumn ? [...colKeysToRender, 'Total'] : colKeysToRender)
                : ['Total'];

            useLayoutEffect(() => {
                const table = tableRef.current;
                if (!table) return;
                const cells = table.querySelectorAll('[data-autofit-col]');
                
                const originalStyles = [];
                cells.forEach(el => {
                    originalStyles.push(el.style.whiteSpace);
                    el.style.whiteSpace = 'nowrap';
                });

                const maxByKey = {};
                cells.forEach(el => {
                    const key = el.getAttribute('data-autofit-col');
                    const w = measureRenderedTextWidth(el);
                    if (!(key in maxByKey) || w > maxByKey[key]) maxByKey[key] = w;
                });
                
                cells.forEach((el, i) => {
                    el.style.whiteSpace = originalStyles[i];
                });

                const AUTO_FIT_PADDING = 22;
                const AUTO_FIT_MIN = 40;
                setColWidths(prev => {
                    let changed = false;
                    const next = { ...prev };
                    Object.keys(maxByKey).forEach(key => {
                        if (manualColWidthKeysRef.current.has(key)) return;
                        const target = Math.ceil(Math.max(AUTO_FIT_MIN, maxByKey[key] + AUTO_FIT_PADDING));
                        if (Math.abs((prev[key] || 0) - target) > 1) {
                            next[key] = target;
                            changed = true;
                        }
                    });
                    return changed ? next : prev;
                });
            }, [renderRows, colKeysWithTotal, dataFields]);

            return (
                // 2026-09-11, per Kevin: was `w-max max-w-full` (the box shrink-wraps to the
                // table's own column widths, same pattern POL Booking Flash's own table box
                // uses deliberately -- see that tab's own comment for why: box/border tracks
                // the real columns exactly, accepting that a monitor wider than the table
                // shows plain page background past the box's edge). On Trade Summary/Sector
                // Summary (both rendered by this shared PivotTableViewer), that same tradeoff
                // read as an "odd gap" instead -- reported via screenshot showing the box (and
                // the tab-bar row above it, which IS full-width via its own flex layout)
                // visibly stopping short of the browser's right edge on a wide window, with
                // plain background beyond both. Kevin's call that day: `w-full` instead, so
                // the box always fills the panel's available width -- the tradeoff flips to
                // the OPPOSITE one (empty space shows INSIDE the box/border, to the right of
                // the last real column, rather than outside it).
                // 2026-09-14, per Kevin, reverted: a follow-up screenshot of Sector Summary
                // showed exactly that flipped tradeoff in practice -- both pivots' boxes
                // stretching to the full panel width with a wide blank strip to the right of
                // their real columns -- and Kevin asked for the tables to "auto-size" instead,
                // i.e. back to shrink-wrap. Restored `w-max max-w-full`, which also brings
                // Trade Summary/Sector Summary back in line with POL Booking Flash's box
                // (still a separate `w-max` block, not this component, but now the same
                // shrink-wrap behavior again on all three).
                <div className="w-max max-w-full border border-black dark:border-gray-600 overflow-x-auto bg-white dark:bg-gray-800 shadow-lg rounded-md mb-4">
                    <h2 className="text-lg font-bold text-white py-1.5 px-2 flex justify-between rounded-t-sm" style={{ backgroundColor: accentColor }}>
                        <span>{title}</span>
                    </h2>
                    <table ref={tableRef} className="w-max table-fixed text-xs text-center border-collapse border border-gray-400">
                        <caption style={{ position: 'absolute', width: '1px', height: '1px', padding: 0, margin: '-1px', overflow: 'hidden', clip: 'rect(0,0,0,0)', whiteSpace: 'nowrap', border: 0 }}>{title}</caption>
                        <thead className="bg-[#333333] text-white sticky top-0 z-20 [&_th]:border-0 [&_th]:shadow-[inset_0_0_0_1px_#000] [&_th]:bg-clip-padding [&_th:not([class*='bg-'])]:bg-[#333333]">
                            {colField && !valuesInRows && (
                                <tr>
                                    {tabular ? (
                                        rowFields.map((rf, i) => (
                                            <th key={`rl-${i}`} data-autofit-col={`rowLabels-${i}`} className="border border-black py-0.5 px-0.5 min-w-[80px] text-center relative" style={colWidths[`rowLabels-${i}`] ? { width: colWidths[`rowLabels-${i}`], minWidth: colWidths[`rowLabels-${i}`] } : undefined}>{rf.label}<ColResizeHandle colKey={`rowLabels-${i}`} /></th>
                                        ))
                                    ) : (
                                        <th data-autofit-col="rowLabels" className="border border-black py-0.5 px-0.5 min-w-[200px] text-left relative" style={colWidths.rowLabels ? { width: colWidths.rowLabels, minWidth: colWidths.rowLabels } : undefined}>Row Labels<ColResizeHandle colKey="rowLabels" /></th>
                                    )}
                                    {colKeysToRender.map((c, i) => (
                                        <th key={i} colSpan={dataFields.length} className="border border-black py-0.5 px-0.5 bg-[#444444]">{c}</th>
                                    ))}
                                    {showGrandTotalColumn && <th colSpan={dataFields.length} className="border border-black py-0.5 px-0.5 font-bold">Grand Total</th>}
                                </tr>
                            )}
                            <tr>
                                {tabular ? (
                                    <>
                                     {rowFields.map((rf, i) => (
                                        <th key={`rl2-${i}`} data-autofit-col={`rowLabels-${i}`} className="border border-black py-0.5 px-0.5 min-w-[80px] text-center relative bg-gray-100 text-black dark:bg-gray-700 dark:text-gray-200" style={colWidths[`rowLabels-${i}`] ? { width: colWidths[`rowLabels-${i}`], minWidth: colWidths[`rowLabels-${i}`] } : undefined}>{rf.label}<ColResizeHandle colKey={`rowLabels-${i}`} /></th>
                                     ))}
                                     {valuesInRows && (
                                         <th data-autofit-col="valuesCol" className="border border-black py-0.5 px-0.5 bg-[#444444] text-gray-200 text-left relative" style={colWidths.valuesCol ? { width: colWidths.valuesCol, minWidth: colWidths.valuesCol } : undefined}><span className="invisible">Values</span><ColResizeHandle colKey="valuesCol" /></th>
                                     )}
                                    </>
                                ) : (
                                    <th data-autofit-col="rowLabels" className="border border-black py-0.5 px-0.5 min-w-[200px] text-left relative" style={colWidths.rowLabels ? { width: colWidths.rowLabels, minWidth: colWidths.rowLabels } : undefined}>Row Labels<ColResizeHandle colKey="rowLabels" /></th>
                                )}
                                {colField && valuesInRows && !tabular && (
                                    <>
                                        <th data-autofit-col="valuesCol" className="border border-black py-0.5 px-0.5 bg-[#444444] relative" style={colWidths.valuesCol ? { width: colWidths.valuesCol, minWidth: colWidths.valuesCol } : undefined}><span className="invisible">Values</span><ColResizeHandle colKey="valuesCol" /></th>
                                    </>
                                )}
                                {colField && valuesInRows && (
                                    <>
                                        {colKeysToRender.map((c, i) => (
                                            <th key={i} data-autofit-col={`col:${c}`} className="border border-black py-0.5 px-0.5 bg-[#444444] relative" style={colWidths[`col:${c}`] ? { width: colWidths[`col:${c}`], minWidth: colWidths[`col:${c}`] } : undefined}>{c}<ColResizeHandle colKey={`col:${c}`} /></th>
                                        ))}
                                        {showGrandTotalColumn && <th data-autofit-col="grandTotalValuesCol" className="border border-black py-0.5 px-0.5 font-bold relative" style={colWidths.grandTotalValuesCol ? { width: colWidths.grandTotalValuesCol, minWidth: colWidths.grandTotalValuesCol } : undefined}>Grand Total<ColResizeHandle colKey="grandTotalValuesCol" /></th>}
                                    </>
                                )}
                                {(!colField || !valuesInRows) && colKeysWithTotal.map((cKey) => (
                                    dataFields.map((df, dfIdx) => (
