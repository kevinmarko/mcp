                    {/* Auto-Refresh OFF reminder (2026-09-09, per Kevin: "don't want anyone to
                        forget they turned it off"). Deliberately no dismiss (×) button, unlike
                        the schedule-change warning below -- the whole point is that it should
                        NOT be easy to make this go away without actually addressing it (turning
                        Auto-Refresh back on, or explicitly deciding to keep checking manually).
                        A standing state, not a one-off event like the other banners here, so
                        unlike newDataAvailable/scheduleChangeWarning it does NOT hide while
                        viewingHistoricalDate -- staying off is still true, and still worth
                        knowing, once someone clicks "Back to Live." Same isCsvSourceConfigured()
                        guard as the Auto-Refresh toggle itself (Settings popover) -- no live
                        source means there's nothing to auto-refresh in the first place. */}
                    {!autoRefreshEnabled && isCsvSourceConfigured() && rawRows.length > 0 && (
                        <div className="flex items-center justify-between gap-3 bg-yellow-50 dark:bg-yellow-950 border border-yellow-400 dark:border-yellow-700 text-yellow-800 dark:text-yellow-300 font-semibold px-4 py-2 rounded mb-4 mx-4 shadow-sm text-sm" role="status">
                            <span>⏸️ Auto-Refresh is turned OFF -- new data from the Sheet won't be applied automatically. Use "Refresh Now" to check manually, or turn it back on.</span>
                            <button
                                onClick={() => setAutoRefreshEnabled(true)}
                                className="bg-yellow-600 text-white px-3 py-1 rounded shadow-sm hover:bg-yellow-700 transition-colors text-sm font-bold cursor-pointer whitespace-nowrap"
                            >
                                Turn On
                            </button>
                        </div>
                    )}

                    {autoFetchError && rawRows.length > 0 && (
                        <div className="bg-yellow-50 dark:bg-yellow-950 border border-yellow-400 dark:border-yellow-700 text-yellow-800 dark:text-yellow-300 font-semibold px-4 py-2 rounded mb-4 mx-4 shadow-sm text-sm" role="alert">
                            {autoFetchError}
                        </div>
                    )}

                    {/* 2026-09-08: sectorFetchError was already being set on fetch
                        failure (and cleared on success) but nothing ever rendered it --
                        the Sector Summary tab would silently fall back to its built-in
                        seed data with only a console.warn, no on-screen indication the
                        live data didn't load. Mirrors the autoFetchError banner directly
                        above (same yellow "soft failure, fell back to something else"
                        treatment) since this is the same class of problem. */}
                    {sectorFetchError && rawRows.length > 0 && (
                        <div className="bg-yellow-50 dark:bg-yellow-950 border border-yellow-400 dark:border-yellow-700 text-yellow-800 dark:text-yellow-300 font-semibold px-4 py-2 rounded mb-4 mx-4 shadow-sm text-sm" role="alert">
                            Couldn't load live Sector Allocation data ({sectorFetchError}). Showing built-in defaults instead.
                        </div>
                    )}

                    {/* 2026-09-04 (math/logic audit): hidden while viewingHistoricalDate is
                        set -- clicking this banner's own Refresh button used to silently
                        exit historical mode with no warning (same root issue as the
                        auto-apply effect above, just user-triggered instead of automatic).
                        The pending update isn't lost: newDataAvailable/pendingCsvTextRef
                        stay set, so this banner (and the auto-apply effect) picks back up
                        the moment the user returns to live data via "Back to Live". */}
                    {newDataAvailable && rawRows.length > 0 && !viewingHistoricalDate && (
                        <div className="flex items-center justify-between gap-3 bg-blue-50 dark:bg-blue-950 border border-blue-400 dark:border-blue-700 text-blue-900 dark:text-blue-200 font-semibold px-4 py-2 rounded mb-4 mx-4 shadow-sm text-sm" role="status">
                            <span>New data is available from the underlying Sheet.</span>
                            <button onClick={applyPendingUpdate} className="bg-blue-700 text-white px-3 py-1 rounded shadow-sm hover:bg-blue-800 transition-colors text-sm font-bold cursor-pointer whitespace-nowrap">
                                Refresh
                            </button>
                        </div>
                    )}

                    {/* Schedule-change warning (2026-09-08, see diffScheduleChange/
                        SCHEDULE_CHANGE_THRESHOLDS above for the full writeup, and
                        DATA_ARCHITECTURE.md/HANDOFF.md for the motivating case). Fires
                        when the most recent live-data swap (auto-poll auto-apply, this
                        banner's own dismiss doesn't block that -- the data always
                        applies normally, this is a heads-up, not a confirmation gate) looked
                        drastic enough to plausibly be the live Sheet itself changing
                        (a lane losing a chunk of its sailings, several Cutoff/ETD dates
                        going blank, a POL flipping to "NO N.A. CALL") rather than an app
                        bug. Deliberately its OWN color (amber/orange) -- distinct from
                        the blue "new data available" banner above and the yellow
                        soft-failure banners elsewhere on this same screen -- so it reads
                        as "heads up, likely expected" rather than either of those.
                        Same rawRows.length > 0 / !viewingHistoricalDate guard as the
                        newDataAvailable banner immediately above, for the identical
                        reason: don't show a live-refresh warning while someone is
                        looking at a historical snapshot, which isn't affected by it. */}
                    {scheduleChangeWarning && rawRows.length > 0 && !viewingHistoricalDate && (
                        <div className="flex items-start justify-between gap-3 bg-orange-50 dark:bg-orange-950 border border-orange-400 dark:border-orange-700 text-orange-900 dark:text-orange-200 font-semibold px-4 py-2 rounded mb-4 mx-4 shadow-sm text-sm" role="alert">
                            <div className="flex-1 min-w-0">

                                                                    {compareData.changed.map((row, i) => (
                                                                        <tr key={i} className="odd:bg-white even:bg-amber-50">
                                                                            <td className="p-1.5 border border-gray-300">{row.trade}</td>
                                                                            <td className="p-1.5 border border-gray-300">{row.subTrade}</td>
                                                                            <td className="p-1.5 border border-gray-300">{row.lane}</td>
                                                                            <td className="p-1.5 border border-gray-300">{row.saleWeek}</td>
                                                                            <td className="p-1.5 border border-gray-300">{row.vvd}</td>
                                                                            <td className="p-1.5 border border-gray-300">{row.pol}</td>
                                                                            <td className="p-1.5 border border-gray-300">
                                                                                {row.diffs.map((d, di) => (
                                                                                    <div key={di}>
                                                                                        <span className="font-bold">{d.label}:</span> {d.oldVal} <span className="text-gray-400">{'→'}</span> {' '}
                                                                                        {/* 2026-09-09, per Kevin: color the NEW value green/red for an
                                                                                            increase/decrease -- only for Current Laden and Vessel Utilz
                                                                                            (d.colorable, set above in compareData's diffs.map), everything
                                                                                            else (Max Laden, Peak Utilz, the text fields) stays plain, same
                                                                                            green/red pair as this tab's own KPI delta cards above. */}
                                                                                        <span className={d.colorable ? (d.increased ? 'text-green-700 dark:text-green-400 font-semibold' : 'text-red-700 dark:text-red-400 font-semibold') : ''}>
                                                                                            {d.newVal}
                                                                                        </span>
                                                                                    </div>
                                                                                ))}
                                                                            </td>
                                                                        </tr>
                                                                    ))}
                                                                </tbody>
                                                            </table>
                                                        </div>
                                                    )}
                                                </>
                                            )}
                                        </>
                                    )}
                                </div>
                            )}
                            </div>
                        </>
                    )}

                    {/* Hover tooltip overlay (2026-09-04) -- see hoverTooltip state's own
                        comment above for why this is fixed-positioned via JS rather than a
                        CSS-only hover-reveal nested in the cell (the table's own
                        overflow-auto scroll container would clip it). Position flips to
                        open leftward/upward near the viewport's right/bottom edge so it
                        never renders off-screen regardless of which cell triggered it. */}
                    {hoverTooltip && (() => {
                        const { rect, text } = hoverTooltip;
                        const margin = 8;
                        const maxWidth = Math.min(480, window.innerWidth - margin * 2);
                        const openLeft = window.innerWidth - rect.left < maxWidth + margin;
                        const openUp = window.innerHeight - rect.bottom < 160;
                        const style = {
                            maxWidth: `${maxWidth}px`,
                            maxHeight: '70vh',
                            ...(openLeft
                                ? { right: `${Math.max(margin, window.innerWidth - rect.right)}px` }
                                : { left: `${Math.max(margin, rect.left)}px` }),
                            ...(openUp
                                ? { bottom: `${Math.max(margin, window.innerHeight - rect.top + 6)}px` }
                                : { top: `${rect.bottom + 6}px` }),
                        };
                        return (
                            <div
                                className="fixed z-50 bg-white dark:bg-gray-800 dark:text-gray-100 border-2 border-black dark:border-gray-500 shadow-lg rounded-md p-2 text-xs whitespace-pre-wrap break-words overflow-y-auto pointer-events-none"
                                style={style}
                            >
                                {text}
                            </div>
                        );
                    })()}
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<FlashReportDashboard />);
    </script>
</body>
</html>
