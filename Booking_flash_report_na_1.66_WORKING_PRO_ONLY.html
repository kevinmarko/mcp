                const maxByKey = {};
                cells.forEach(el => {
                    const key = el.getAttribute('data-autofit-col');

                });

                cells.forEach((el, i) => {
                    el.style.whiteSpace = originalStyles[i];
                });

                const AUTO_FIT_PADDING = 22;
                const AUTO_FIT_MIN = 40;
                setPolColWidths(prev => {
                    let changed = false;
                    const next = { ...prev };
                    Object.keys(maxByKey).forEach(key => {
                        if (manualPolColWidthKeysRef.current.has(key)) return;
                        const target = Math.ceil(Math.max(AUTO_FIT_MIN, maxByKey[key] + AUTO_FIT_PADDING));
                        if (Math.abs((prev[key] || 0) - target) > 1) {
                            next[key] = target;
                            changed = true;
                        }
                    });
                    return changed ? next : prev;
                });
            }, [activeTab, filteredRawRows, reeferHidden, activityHidden, etaHidden, opIssuesHidden, vcoHidden]);

            const compareData = useMemo(() => {
                if (rawRows.length === 0 || oldRawRows.length === 0) return null;

                const keyOf = (row) => {
                    const vvd = String(row.vvd || '').trim();
                    const pol = String(row.pol || '').trim();
                    return (vvd && pol) ? `${vvd}|${pol}` : null;
                };

                const oldByKey = new Map();
                oldRawRows.forEach(row => { const k = keyOf(row); if (k && !oldByKey.has(k)) oldByKey.set(k, row); });
                const newByKey = new Map();
                rawRows.forEach(row => { const k = keyOf(row); if (k && !newByKey.has(k)) newByKey.set(k, row); });

                const TRACKED_FIELDS = [
                    { key: 'statusDisplay', label: 'Status', type: 'text' },
                    { key: 'pic', label: 'PIC', type: 'text' },
                    { key: 'vessel', label: 'Vessel', type: 'text' },
                    { key: 'maxLdn', label: 'Max Laden', type: 'number' },
                    { key: 'curLaden', label: 'Current Laden', type: 'number' },
                    { key: 'curUtilRaw', label: 'Booking Utilz', type: 'percent' },
                    { key: 'peakUtilRaw', label: 'Peak Utilz', type: 'percent' },
                ];
                const fieldVal = (row, field) => {
                    if (field.type === 'text') return String(row[field.key] || '').trim();
                    if (field.type === 'percent') return Math.round(getPercentNum(row[field.key]));
                    return Math.round(toNum(row[field.key]));
                };
                const formatFieldVal = (row, field) => {
                    if (field.type === 'text') return String(row[field.key] || '').trim() || '—';
                    if (field.type === 'percent') return `${Math.round(getPercentNum(row[field.key]))}%`;
                    return formatNumberWithCommas(toNum(row[field.key]));
                };
                const identity = (row) => ({
                    trade: row.trade, subTrade: row.subTrade, lane: row.lane,
                    saleWeek: row.saleWeek, vvd: row.vvd, pol: row.pol, vessel: row.vessel,
                });

                const added = [];
                const removed = [];
                const changed = [];

                newByKey.forEach((newRow, key) => {
                    if (!oldByKey.has(key)) added.push(identity(newRow));
                });
                oldByKey.forEach((oldRow, key) => {
                    if (!newByKey.has(key)) {
                        removed.push(identity(oldRow));
                        return;
                    }
                    const newRow = newByKey.get(key);
                    const diffs = TRACKED_FIELDS
                        .filter(f => fieldVal(oldRow, f) !== fieldVal(newRow, f))
                        .map(f => ({ label: f.label, oldVal: formatFieldVal(oldRow, f), newVal: formatFieldVal(newRow, f) }));
                    if (diffs.length > 0) changed.push({ ...identity(newRow), diffs });
                });

                const overallSnapshot = (rows) => {
                    const byLane = {};
                    let ladenSum = 0;
                    rows.forEach(row => {
                        const lane = row.lane || '(blank)';
                        const v = toNum(row.maxLdn);
                        if (!(lane in byLane) || v > byLane[lane]) byLane[lane] = v;
                        ladenSum += toNum(row.ladenTeu);
                    });
                    const maxLdnSum = Object.values(byLane).reduce((s, v) => s + v, 0);

                    const byLaneWeek = {};
                    rows.forEach(row => {
                        const lane = row.lane || '(blank)';
                        const key = `${lane}|${row.saleWeek || '(blank)'}`;
                        if (!byLaneWeek[key]) byLaneWeek[key] = { lane, maxLdn: 0, laden: 0 };
                        byLaneWeek[key].maxLdn = Math.max(byLaneWeek[key].maxLdn, toNum(row.maxLdn));
                        byLaneWeek[key].laden += toNum(row.ladenTeu);
                    });
                    const weeklyByLane = {};
                    Object.values(byLaneWeek).forEach(bucket => {
                        if (!weeklyByLane[bucket.lane]) weeklyByLane[bucket.lane] = [];
                        weeklyByLane[bucket.lane].push(bucket);
                    });
                    let avgWklyCapacitySum = 0, avgWklyLadenSum = 0;
                    Object.values(weeklyByLane).forEach(weeks => {
                        const n = weeks.length;
                        avgWklyCapacitySum += weeks.reduce((s, w) => s + w.maxLdn, 0) / n;
                        avgWklyLadenSum += weeks.reduce((s, w) => s + w.laden, 0) / n;
                    });

                    return {
                        maxLdn: maxLdnSum,
                        laden: ladenSum,
                        utilz: avgWklyCapacitySum > 0 ? Math.round((avgWklyLadenSum / avgWklyCapacitySum) * 100) : 0,
                        bookingCount: rows.length,
                    };
                };

                return {
                    added, removed, changed,
                    oldSnapshot: overallSnapshot(oldRawRows),
                    newSnapshot: overallSnapshot(rawRows),
                };
            }, [rawRows, oldRawRows]);

            const serviceLaneAnalysis = useMemo(() => {
                if (activeTab !== 'detail' && activeTab !== 'pol_booking') return null;
                const groupKey = activeTab === 'pol_booking' ? 'pol' : 'lane';
                const groupLabel = activeTab === 'pol_booking' ? 'POL' : 'Lane';

                const weeksPresent = Array.from(new Set(
                    filteredRawRows.map(r => r.saleWeek).filter(w => w !== undefined && w !== null && String(w).trim() !== '')
                )).sort(compareSaleWeek);
                
                const manualWeeks = analysisSelectedWeeks.length > 0
                    ? weeksPresent.filter(w => analysisSelectedWeeks.includes(w))
                    : [];
                const usingDefault = !analysisShowAllWeeks && manualWeeks.length === 0;
                const activeWeeks = analysisShowAllWeeks
                    ? weeksPresent
                    : (usingDefault ? weeksPresent.slice(0, 4) : manualWeeks);
                if (activeWeeks.length === 0) return null;
                const weekSet = new Set(activeWeeks);
                const analysisRows = filteredRawRows.filter(r => weekSet.has(r.saleWeek));
                if (analysisRows.length === 0) return null;

                const numVal = (row, key) => parseFloat(String(row[key] ?? '').replace(/[,%()]/g, '')) || 0;

                const groupBy = (fieldKey) => {
                    const byKeyWeek = {};
                    const groupPeakUtils = {};
                    
                    analysisRows.forEach(row => {
                        const g = row[fieldKey] || '(blank)';
                        const w = row.saleWeek;
                        const bucketKey = `${g}|${w}`;
                        if (!byKeyWeek[bucketKey]) byKeyWeek[bucketKey] = { key: g, maxLdn: 0, laden: 0 };
                        const bucket = byKeyWeek[bucketKey];
                        bucket.maxLdn = Math.max(bucket.maxLdn, numVal(row, 'maxLdn'));
                        bucket.laden += numVal(row, 'curLaden');
                        
                        if (!groupPeakUtils[g]) groupPeakUtils[g] = [];
                        if (row.peakUtilRaw !== undefined && row.peakUtilRaw !== null && row.peakUtilRaw !== '') {
                            const strVal = String(row.peakUtilRaw).trim();
                            let parsed = parseFloat(strVal.replace(/[^0-9.-]/g, ''));
                            if (!isNaN(parsed)) {
                                if (!strVal.includes('%') && parsed > 0 && parsed <= 5) parsed *= 100;
                                else if (parsed >= 1000) parsed /= 100;
                                groupPeakUtils[g].push(parsed);
                            }
                        }
                    });
                    
                    const byKey = {};
                    Object.values(byKeyWeek).forEach(bucket => {
                        if (!byKey[bucket.key]) byKey[bucket.key] = [];
                        byKey[bucket.key].push(bucket);
                    });
                    
                    return Object.entries(byKey).map(([key, weeks]) => {
                        const n = weeks.length;
                        const avgWklyMaxLdn = weeks.reduce((s, w) => s + w.maxLdn, 0) / n;
                        const avgWklyLaden = weeks.reduce((s, w) => s + w.laden, 0) / n;
                        const avgWklyShortfall = avgWklyLaden - avgWklyMaxLdn;
                        const avgUtilization = avgWklyMaxLdn > 0 ? (avgWklyLaden / avgWklyMaxLdn) * 100 : 0;
                        
                        const pUtils = groupPeakUtils[key] || [];
                        let avgPeakUtilization = pUtils.length > 0 ? pUtils.reduce((s, v) => s + v, 0) / pUtils.length : 0;
                        if (avgPeakUtilization > 100) avgPeakUtilization = 100;
                        
                        return { group: key, weekCount: n, avgWklyMaxLdn, avgWklyLaden, avgWklyShortfall, avgUtilization, avgPeakUtilization };
                    }).sort((a, b) => String(a.group).localeCompare(String(b.group)));
                };

                const groupSummaries = groupBy(groupKey);
                const laneSummaries = groupKey === 'lane' ? groupSummaries : groupBy('lane');

                const overallCapacity = laneSummaries.reduce((s, g) => s + g.avgWklyMaxLdn, 0);
                const overallLaden = laneSummaries.reduce((s, g) => s + g.avgWklyLaden, 0);
                const overallShortfall = overallLaden - overallCapacity;
                const overallUtilization = overallCapacity > 0 ? (overallLaden / overallCapacity) * 100 : 0;

                // "Departed" (2026-09-02): a week's bar carries the star if ANY lane/VVD
                // contributing to it has already sailed (row.etd on or before today) -- an
                // OR across every row folded into that week, same as maxLdn/laden are folded
                // in by max/sum below. Computed once per render rather than per row so every
                // row in this pass compares against the exact same moment.
                const today = new Date();
                const weeklyTotalsMap = {};
                analysisRows.forEach(row => {
                    const w = row.saleWeek;
                    const lane = row.lane || '(blank)';
                    const bucketKey = `${lane}|${w}`;
                    if (!weeklyTotalsMap[bucketKey]) {
                        weeklyTotalsMap[bucketKey] = { week: w, lane: lane, maxLdn: 0, laden: 0, departed: false };
                    }
                    weeklyTotalsMap[bucketKey].maxLdn = Math.max(weeklyTotalsMap[bucketKey].maxLdn, numVal(row, 'maxLdn'));
                    weeklyTotalsMap[bucketKey].laden += numVal(row, 'curLaden');
                    if (isOnOrBeforeDay(row.etd, today)) weeklyTotalsMap[bucketKey].departed = true;
                });

                const weeklySeriesMap = {};
                Object.values(weeklyTotalsMap).forEach(bucket => {
                    const w = bucket.week;
                    if (!weeklySeriesMap[w]) {
                        weeklySeriesMap[w] = { week: w, maxLdn: 0, laden: 0, departed: false };
                    }
                    weeklySeriesMap[w].maxLdn += bucket.maxLdn;
                    weeklySeriesMap[w].laden += bucket.laden;
                    if (bucket.departed) weeklySeriesMap[w].departed = true;
                });
                const weeklySeries = Object.values(weeklySeriesMap).sort((a, b) => compareSaleWeek(a.week, b.week));

                return {
                    groupLabel,
                    weekRange: activeWeeks.length > 1 ? `${activeWeeks[0]} to ${activeWeeks[activeWeeks.length - 1]}` : activeWeeks[0],
                    weekCount: activeWeeks.length,
                    groupCount: groupSummaries.length,
                    overall: { utilization: overallUtilization, capacity: overallCapacity, laden: overallLaden, shortfall: overallShortfall },
                    groups: groupSummaries,
                    weeksPresent,
                    activeWeeks,
                    usingDefault,
                    showingAll: analysisShowAllWeeks,
                    weeklySeries
                };
            }, [activeTab, filteredRawRows, analysisSelectedWeeks, analysisShowAllWeeks]);

            const laneAwareMaxLdn = (ctx, cKey) => {
                const matching = filteredRawRows.filter(r =>
                    (!ctx.trade || r.trade === ctx.trade) &&
                    (!ctx.subTrade || r.subTrade === ctx.subTrade) &&
                    (cKey === 'Total' || r.saleWeek === cKey)
                );
                const byLane = {};
                matching.forEach(r => {
                    const lane = r.lane || '(blank)';
                    const v = toNum(r.maxLdn);
                    if (!(lane in byLane) || v > byLane[lane]) byLane[lane] = v;
                });
                return Object.values(byLane).reduce((s, v) => s + v, 0);
            };

            const sectorDataMapped = useMemo(() => {
                return sectorSourceRows
                    .filter(r => {
                        const matchSubTrade = selectedSubTrades.length === 0 || selectedSubTrades.includes(r['Vessel 1st Sub Trade']);
                        const matchLane = selectedLanes.length === 0 || selectedLanes.includes(r['Vessel 1st Lane']);
                        return matchSubTrade && matchLane;
                    })
                    .map(r => {
                        const lane = r['Vessel 1st Lane'];
                        const podSec = r['POD Sec'];
                        return {
                            trade: r['Vessel 1st Trade'],
                            subTrade: r['Vessel 1st Sub Trade'],
                            lane,
                            podSec,
                            sectorAlloc: r['MCT Sector Allocation'],
                            avgBooking: r['Average Booking'],
                            openSpace: r['Sector Open Space'],
                            portExcluded: PORT_EXCLUDE_KEYS.has(`${lane}|${podSec}`)
                        };
                    });
            }, [sectorSourceRows, selectedSubTrades, selectedLanes]);

            const past4WeekRows = useMemo(() => {
                return filteredRawRows.filter(row => String(row.past4WeekFlag || '').trim().toUpperCase() === 'Y');
            }, [filteredRawRows]);

            const SECTOR_LEFT_ORDER = {
                ROOT: ['TPT', 'TAT', 'LAT'],
                TPT: ['AW', 'PN', 'PS'],
                'TPT|AW': ['EC1', 'EC2', 'EC3', 'EC4', 'WIN'],
                'TPT|PN': ['FP2', 'PN1', 'PN3'],
                'TPT|PS': ['MS2', 'PS1', 'PS3', 'PS4', 'PS6', 'PS7', 'PS8', 'VSE'],
                TAT: ['TA'],
                'TAT|TA': ['AL5', 'AT1', 'AT3', 'AT4', 'EMA'],
                LAT: ['LN'],
                'LAT|LN': ['AN2', 'ANG', 'FLX', 'MAR'],
            };
            const SECTOR_RIGHT_ORDER = {
                ROOT: ['TPT', 'TAT'],
                TPT: ['AW', 'PN', 'PS'],
                'TPT|AW': ['EC3'],
                'TPT|AW|EC3': ['CNNGB', 'CNSHA', 'CNTAO', 'LKCMB', 'PAMIT', 'SGSIN', 'THLCH', 'VNCMP'],
                'TPT|PN': ['FP2'],
                'TPT|PN|FP2': ['SGSIN'],
                'TPT|PS': ['PS3'],
                'TPT|PS|PS3': ['CNSHA', 'CNSHK', 'INNSA', 'SGSIN'],
                TAT: ['TA'],
                'TAT|TA': ['AL5', 'AT1', 'AT3', 'AT4', 'EMA'],
                'TAT|TA|AL5': ['BEANR', 'DEHAM', 'FRLEH', 'GBSOU'],
                'TAT|TA|AT1': ['BEANR', 'DEBRV', 'FRLEH', 'GBSOU', 'NLRTM'],
                'TAT|TA|AT3': ['BEANR', 'DEBRV', 'GBSOU', 'NLRTM', 'USHOU'],
                'TAT|TA|AT4': ['ESALG', 'ESVLC', 'FRFOS', 'ITGOA', 'ITSPE'],
                'TAT|TA|EMA': ['GRPIR', 'ITSAL', 'TRALI', 'TRISK', 'TRIST'],
            };

            const sectorRows = useMemo(() => {
                const parsed = [];
                filteredRawRows.forEach(row => {
                    if (row.sectorRemarks) {
                        const parts = String(row.sectorRemarks).split('/');
                        parts.forEach(p => {
                            const match = p.match(/([A-Z]+):\s*([\d,]+)\s*-\s*([\d,]+)/);
                            if (match) {
                                parsed.push({
                                    ...row,
                                    podSector: match[1],
                                    sectorAlloc: parseFloat(match[2].replace(/,/g, '')),
                                    avgBooking: parseFloat(match[3].replace(/,/g, ''))
                                });
                            }
                        });
                    }
                });
                return parsed;
            }, [filteredRawRows]);

            const tableData = useMemo(() => {
                const aggregatedMap = {};
                filteredRawRows.forEach(row => {
                    const key = `${row.trade}-${row.subTrade}-${row.lane}-${row.saleWeek}-${row.vvd}-${row.vessel}`;
                    if (!row.vvd && !row.vessel) {
                        aggregatedMap[`uid-${row.id}`] = row;
                        return;
                    }

                    if (!aggregatedMap[key]) {
                        aggregatedMap[key] = { ...row };
                        // 'broken' (Broken Routes) -- like every other TEU-quantity field here, a
                        // VVD's multiple raw POL-leg rows need to be SUMMED, not first-leg-wins.
                        // 'shortfall' also belongs here (see the duplicate-key branch's own
                        // comment below for why it was missing there specifically).
                        const numerics = ['curLaden', 'quote', 'shortfall', 'broken', 'rfrBkgPlugs', 'rfrBkgTtl', 'inlandAct', 'inlandNoAct', 'inlandTotal', 'portAct', 'portNoAct', 'portTotal', 'dgTeu', 'tpt', 'tat', 'lwt', 'lnt', 'imt', 'let', 'ladenTeu', 'activeTotalTeu'];
                        numerics.forEach(n => aggregatedMap[key][n] = toNum(aggregatedMap[key][n]));

                        // 'peakUtilRaw'/'rfrBsaTeuRfMax' are both "Max of ..." per their DAX (see
                        // rfrUtilizRaw's own post-aggregation recompute below, and Current Laden
                        // Utiliz %'s own MAX-across-legs convention, same as curUtilRaw just
                        // below) -- omitting them here left them first-leg-wins.
                        const maxes = ['maxLdn', 'bsaTeu', 'bsaWgt', 'rfrBsaPlugs', 'rfrMaxLdn', 'peakUtilRaw', 'rfrBsaTeuRfMax'];
                        maxes.forEach(n => aggregatedMap[key][n] = toNum(aggregatedMap[key][n]));

                        aggregatedMap[key].curUtilRaw = getPercentNum(row.curUtilRaw);
                    } else {
                        // 'shortfall' and 'broken': present in the init-branch numerics list above
                        // but were missing from this accumulate branch, so a later leg's raw value
                        // was silently dropped instead of summed (shortfall is normally overwritten
                        // by a fresh ladenTeu-maxLdn calc below whenever the VVD's aggregated Max
                        // Laden is non-blank, so this mostly only surfaces on the rarer
                        // maxLdn-blank branch; broken has no such override and was undercounted,
                        // in some cases down to 0, on every multi-leg VVD with a nonzero later leg).
                        const numerics = ['curLaden', 'quote', 'shortfall', 'broken', 'rfrBkgPlugs', 'rfrBkgTtl', 'inlandAct', 'inlandNoAct', 'inlandTotal', 'portAct', 'portNoAct', 'portTotal', 'dgTeu', 'tpt', 'tat', 'lwt', 'lnt', 'imt', 'let', 'ladenTeu', 'activeTotalTeu'];
                        numerics.forEach(n => {
                            aggregatedMap[key][n] += toNum(row[n]);
                        });

                        const maxes = ['maxLdn', 'bsaTeu', 'bsaWgt', 'rfrBsaPlugs', 'rfrMaxLdn', 'peakUtilRaw', 'rfrBsaTeuRfMax'];
                        maxes.forEach(n => {
                            aggregatedMap[key][n] = Math.max(aggregatedMap[key][n], toNum(row[n]));
                        });

                        aggregatedMap[key].curUtilRaw = Math.max(aggregatedMap[key].curUtilRaw, getPercentNum(row.curUtilRaw));
                    }
                });

                return Object.values(aggregatedMap).map(row => {
                    row.standby = formatPercent(row.standbyRaw);
                    row.peakUtil = formatPercent(row.peakUtilRaw);
                    // rfrUtilizRaw was computed once per raw POL leg (rfrBkgTtl/rfrBsaTeuRfMax at
                    // parse time) and never recomputed after the leg-aggregation above, so a
                    // multi-leg VVD rendered its first leg's ratio instead of the correct one
                    // computed from the now-aggregated totals -- understating RFR Utiliz % on
                    // every multi-leg VVD whose legs differ (confirmed 2-10x understated on 125
                    // real VVDs in the reference dataset). Recompute from the aggregated fields,
                    // same pattern actVsBkgUtilzRaw below already uses.
                    const rfrBsaTeuRfMaxNum = toNum(row.rfrBsaTeuRfMax);
                    row.rfrUtilizRaw = rfrBsaTeuRfMaxNum > 0 ? (toNum(row.rfrBkgTtl) / rfrBsaTeuRfMaxNum) : 0;
                    row.rfrUtiliz = formatPercent(row.rfrUtilizRaw);

                    const activeTotalTeuNum = toNum(row.activeTotalTeu);
                    const ladenTeuNum = toNum(row.ladenTeu);
                    row.actVsBkgUtilzRaw = ladenTeuNum > 0 ? (activeTotalTeuNum / ladenTeuNum) : 0;
                    row.actVsBkgUtilz = formatPercent(row.actVsBkgUtilzRaw);

                    row.actVsMaxLdnRaw = activeTotalTeuNum - toNum(row.maxLdn);
                    const formattedMaxLdnRaw = formatNumberWithCommas(row.actVsMaxLdnRaw);
                    row.actVsMaxLdn = (row.actVsMaxLdnRaw > 0 ? '+' : '') + formattedMaxLdnRaw;
                    row.actVsMaxLdnStyle = row.actVsMaxLdnRaw > 0 ? { color: 'red' } : {};

                    const parsedMax = parseFloat(row.maxLdn);
                    row.maxLdn = (parsedMax === 0 || isNaN(parsedMax)) ? '' : formatNumberWithCommas(row.maxLdn);

                    row.curUtil = `${Math.round(row.curUtilRaw || 0)}%`;

                    row.utilGapFlagged = isUtilGapFlagged(row.curUtilRaw, getPercentNum(row.peakUtilRaw));
                    row.utilGapStyle = row.utilGapFlagged ? { backgroundColor: '#dc2626', color: '#fff', fontWeight: 'bold' } : {};

                    if (row.maxLdn !== '' && row.ladenTeu !== undefined) {
                        const rawMaxLdn = toNum(row.maxLdn);
                        const calculatedShortfall = toNum(row.ladenTeu) - rawMaxLdn;
                        row.shortfallNegative = calculatedShortfall < 0;
                        row.shortfall = formatAccountingNumber(calculatedShortfall);
                    } else {
                        row.shortfallNegative = toNum(row.shortfall) < 0;
                        row.shortfall = formatAccountingNumber(row.shortfall);
                    }
                    
                    row.curLaden = formatNumberWithCommas(row.curLaden);
                    row.quote = formatNumberWithCommas(row.quote);
                    row.bsaTeu = formatNumberWithCommas(row.bsaTeu);
                    row.bsaWgt = formatNumberWithCommas(row.bsaWgt);
                    
                  if (String(row.vvd).trim().toUpperCase() === 'VMS') {
    const fieldsToKeep = ['id', 'trade', 'subTrade', 'lane', 'saleWeek', 'pic', 'vvd', 'vessel'];
    Object.keys(row).forEach(key => {
        if (!fieldsToKeep.includes(key)) {
            row[key] = (row[key] && typeof row[key] === 'object') ? {} : '';
        }
    });
    row.vessel = 'VMS'; // Guarantees the Vessel column outputs VMS
}

                    return row;
                });
            }, [filteredRawRows]);

            const processedData = useMemo(() => {
                let filtered = [...tableData];
                
                filtered.sort((a, b) => {
                    if (a.trade !== b.trade) return String(a.trade || '').localeCompare(String(b.trade || ''));
                    if (a.subTrade !== b.subTrade) return String(a.subTrade || '').localeCompare(String(b.subTrade || ''));
                    if (a.lane !== b.lane) return String(a.lane || '').localeCompare(String(b.lane || ''));
                    if (a.saleWeek !== b.saleWeek) return compareSaleWeek(a.saleWeek, b.saleWeek);
                    return String(a.vessel || '').localeCompare(String(b.vessel || ''));
                });

                const withBlanks = [];
                for (let i = 0; i < filtered.length; i++) {
                    withBlanks.push(filtered[i]);
                    const isLastInLane = i === filtered.length - 1 || filtered[i].lane !== filtered[i+1].lane;
                    if (isLastInLane) {
                        withBlanks.push({
                            id: `blank-${filtered[i].id || i}`,
                            isBlankRow: true,
                            trade: filtered[i].trade,
                            subTrade: filtered[i].subTrade,
                            lane: filtered[i].lane
                        });
                    }
                }

                const spanned = withBlanks.map(row => ({
                    ...row,
                    showTrade: true, tradeSpan: 1,
                    showSub: true, subSpan: 1,
                    showLane: true, laneSpan: 1
                }));

                for (let i = 0; i < spanned.length; i++) {
                    if (spanned[i].showTrade) {
                        let spanCount = 1;
                        for (let j = i + 1; j < spanned.length; j++) {
                            if (spanned[j].trade === spanned[i].trade) {
                                spanCount++;
                                spanned[j].showTrade = false;
                            } else break;
                        }
                        spanned[i].tradeSpan = spanCount;
                    }

                    if (spanned[i].showSub) {
                        let spanCount = 1;
                        for (let j = i + 1; j < spanned.length; j++) {
                            if (spanned[j].trade === spanned[i].trade && spanned[j].subTrade === spanned[i].subTrade) {
                                spanCount++;
                                spanned[j].showSub = false;
                            } else break;
                        }
                        spanned[i].subSpan = spanCount;
                    }

                    if (spanned[i].showLane) {
                        let spanCount = 1;
                        for (let j = i + 1; j < spanned.length; j++) {
                            if (spanned[j].trade === spanned[i].trade &&
                                spanned[j].subTrade === spanned[i].subTrade &&
                                spanned[j].lane === spanned[i].lane) {
                                spanCount++;
                                spanned[j].showLane = false;
                            } else break;
                        }
                        spanned[i].laneSpan = spanCount;
                    }
                }
                return spanned;
            }, [tableData]);

                                                    <th rowSpan={2} className="border border-black font-semibold p-1 min-w-[85px] text-xs leading-tight bg-[#ffc000] text-black whitespace-nowrap relative" style={detailColWidths['rfrBsaPlugs'] ? { width: detailColWidths['rfrBsaPlugs'], minWidth: detailColWidths['rfrBsaPlugs'] } : undefined} >RFR BSA<br/>Plugs<ColResizeHandle onMouseDown={startDetailColResize('rfrBsaPlugs')} /></th>
                                                    <th rowSpan={2} className="border border-black font-semibold p-1 min-w-[85px] text-xs leading-tight bg-[#ffc000] text-black whitespace-nowrap relative" style={detailColWidths['rfrBkgPlugs'] ? { width: detailColWidths['rfrBkgPlugs'], minWidth: detailColWidths['rfrBkgPlugs'] } : undefined} >RFR BKG<br/>Plugs<ColResizeHandle onMouseDown={startDetailColResize('rfrBkgPlugs')} /></th>
                                                    <th rowSpan={2} className="border border-black font-semibold p-1 min-w-[85px] text-xs leading-tight bg-[#ffc000] text-black whitespace-nowrap relative" style={detailColWidths['rfrMaxLdn'] ? { width: detailColWidths['rfrMaxLdn'], minWidth: detailColWidths['rfrMaxLdn'] } : undefined} >RFR Max<br/>LDN<ColResizeHandle onMouseDown={startDetailColResize('rfrMaxLdn')} /></th>
                                                    <th rowSpan={2} className="border border-black font-semibold p-1 min-w-[85px] text-xs leading-tight bg-[#ffc000] text-black whitespace-nowrap relative" style={detailColWidths['rfrBkgTtl'] ? { width: detailColWidths['rfrBkgTtl'], minWidth: detailColWidths['rfrBkgTtl'] } : undefined} >RFR BKG<br/>TTL<ColResizeHandle onMouseDown={startDetailColResize('rfrBkgTtl')} /></th>
                                                    <th rowSpan={2} className="border border-black font-semibold p-1 min-w-[85px] text-xs leading-tight bg-[#ffc000] text-black whitespace-nowrap relative" style={detailColWidths['rfrUtiliz'] ? { width: detailColWidths['rfrUtiliz'], minWidth: detailColWidths['rfrUtiliz'] } : undefined} >RFR<br/>Utiliz %<ColResizeHandle onMouseDown={startDetailColResize('rfrUtiliz')} /></th>
                                                </>
                                            )}
                                            
                                            {!activityHidden && (
                                                <>
                                                    <th rowSpan={2} className="border border-black font-semibold p-1 min-w-[95px] text-xs leading-tight whitespace-nowrap relative" style={detailColWidths['actVsBkgUtilz'] ? { width: detailColWidths['actVsBkgUtilz'], minWidth: detailColWidths['actVsBkgUtilz'] } : undefined} >Activity vs<br/>Booking Utilz<ColResizeHandle onMouseDown={startDetailColResize('actVsBkgUtilz')} /></th>
                                                    <th rowSpan={2} className="border border-black font-semibold p-1 min-w-[95px] text-xs leading-tight whitespace-nowrap relative" style={detailColWidths['actVsMaxLdn'] ? { width: detailColWidths['actVsMaxLdn'], minWidth: detailColWidths['actVsMaxLdn'] } : undefined} >Activity vs<br/>Max Laden<ColResizeHandle onMouseDown={startDetailColResize('actVsMaxLdn')} /></th>
                                                    <th colSpan={3} className="border border-black font-bold p-1 min-w-[160px] text-sm leading-tight bg-[#C4BD97] text-black whitespace-nowrap">Inland Activity</th>
                                                    <th colSpan={3} className="border border-black font-bold p-1 min-w-[160px] text-sm leading-tight bg-[#C4BD97] text-black whitespace-nowrap">Port Activity</th>
                                                </>
                                            )}

                                            {!opIssuesHidden && <th rowSpan={2} className="border border-black font-semibold p-1 min-w-[100px] text-xs leading-tight whitespace-nowrap relative" style={detailColWidths['opIssues'] ? { width: detailColWidths['opIssues'], minWidth: detailColWidths['opIssues'] } : undefined} >Operational<br/>Issues<ColResizeHandle onMouseDown={startDetailColResize('opIssues')} /></th>}
                                            {!sectorAllocHidden && (
                                                <>
                                                    <th rowSpan={2} className="border border-black font-semibold p-1 min-w-[95px] text-xs leading-tight whitespace-nowrap relative" style={detailColWidths['sectorRemarks'] ? { width: detailColWidths['sectorRemarks'], minWidth: detailColWidths['sectorRemarks'] } : undefined} >Sector<br/>Allocation<ColResizeHandle onMouseDown={startDetailColResize('sectorRemarks')} /></th>
                                                    <th rowSpan={2} className="border border-black font-semibold p-1 min-w-[95px] text-xs leading-tight whitespace-nowrap relative" style={detailColWidths['sgsinDryVsRfr'] ? { width: detailColWidths['sgsinDryVsRfr'], minWidth: detailColWidths['sgsinDryVsRfr'] } : undefined} >SGSIN Dry<br/>vs Reefer<ColResizeHandle onMouseDown={startDetailColResize('sgsinDryVsRfr')} /></th>
                                                </>
                                            )}
                                            {!rotationHidden && (
                                                <>
                                                    <th rowSpan={2} className="border border-black font-semibold p-1 min-w-[110px] text-xs leading-tight whitespace-nowrap relative" style={detailColWidths['proformaRot'] ? { width: detailColWidths['proformaRot'], minWidth: detailColWidths['proformaRot'] } : undefined} >Proforma<br/>Rotation<ColResizeHandle onMouseDown={startDetailColResize('proformaRot')} /></th>
                                                    <th rowSpan={2} className="border border-black font-semibold p-1 min-w-[110px] text-xs leading-tight whitespace-nowrap relative" style={detailColWidths['actualRot'] ? { width: detailColWidths['actualRot'], minWidth: detailColWidths['actualRot'] } : undefined} >Actual<br/>Rotation<ColResizeHandle onMouseDown={startDetailColResize('actualRot')} /></th>
                                                </>
                                            )}
                                            {!apStatusHidden && <th rowSpan={2} className="border border-black font-semibold p-1 min-w-[85px] text-xs leading-tight whitespace-nowrap relative" style={detailColWidths['apStatus'] ? { width: detailColWidths['apStatus'], minWidth: detailColWidths['apStatus'] } : undefined} >AP<br/>Status<ColResizeHandle onMouseDown={startDetailColResize('apStatus')} /></th>}
                                            {!tradeBreakdownHidden && (
                                                <>
                                                    <th rowSpan={2} className="border border-black font-semibold p-1 min-w-[55px] text-xs leading-tight whitespace-nowrap relative" style={detailColWidths['tpt'] ? { width: detailColWidths['tpt'], minWidth: detailColWidths['tpt'] } : undefined} >TPT<ColResizeHandle onMouseDown={startDetailColResize('tpt')} /></th>
                                                    <th rowSpan={2} className="border border-black font-semibold p-1 min-w-[55px] text-xs leading-tight whitespace-nowrap relative" style={detailColWidths['tat'] ? { width: detailColWidths['tat'], minWidth: detailColWidths['tat'] } : undefined} >TAT<ColResizeHandle onMouseDown={startDetailColResize('tat')} /></th>
                                                    <th rowSpan={2} className="border border-black font-semibold p-1 min-w-[55px] text-xs leading-tight whitespace-nowrap relative" style={detailColWidths['lwt'] ? { width: detailColWidths['lwt'], minWidth: detailColWidths['lwt'] } : undefined} >LWT<ColResizeHandle onMouseDown={startDetailColResize('lwt')} /></th>
                                                    <th rowSpan={2} className="border border-black font-semibold p-1 min-w-[55px] text-xs leading-tight whitespace-nowrap relative" style={detailColWidths['lnt'] ? { width: detailColWidths['lnt'], minWidth: detailColWidths['lnt'] } : undefined} >LNT<ColResizeHandle onMouseDown={startDetailColResize('lnt')} /></th>
                                                    <th rowSpan={2} className="border border-black font-semibold p-1 min-w-[55px] text-xs leading-tight whitespace-nowrap relative" style={detailColWidths['imt'] ? { width: detailColWidths['imt'], minWidth: detailColWidths['imt'] } : undefined} >IMT<ColResizeHandle onMouseDown={startDetailColResize('imt')} /></th>
                                                    <th rowSpan={2} className="border border-black font-semibold p-1 min-w-[55px] text-xs leading-tight whitespace-nowrap relative" style={detailColWidths['let'] ? { width: detailColWidths['let'], minWidth: detailColWidths['let'] } : undefined} >LET<ColResizeHandle onMouseDown={startDetailColResize('let')} /></th>
                                                </>
                                            )}
                                            {!dgVolumeHidden && <th rowSpan={2} className="border border-black font-semibold p-1 min-w-[75px] text-xs leading-tight whitespace-nowrap relative" style={detailColWidths['dgTeu'] ? { width: detailColWidths['dgTeu'], minWidth: detailColWidths['dgTeu'] } : undefined} >DG<br/>TEU<ColResizeHandle onMouseDown={startDetailColResize('dgTeu')} /></th>}
                                            
                                            {!remarksHidden && (
                                                <th rowSpan={2} className="border border-black font-semibold p-1 min-w-[200px] text-xs leading-tight whitespace-nowrap text-left relative" style={detailColWidths['remarks'] ? { width: detailColWidths['remarks'], minWidth: detailColWidths['remarks'] } : undefined} >Voyage Remarks<ColResizeHandle onMouseDown={startDetailColResize('remarks')} /></th>
                                            )}
                                        </tr>
                                        <tr>
                                            {!activityHidden && (
                                                <>
                                                    <th className="border border-black font-semibold p-1 min-w-[85px] text-xs leading-tight whitespace-nowrap bg-[#444444] text-white relative" style={detailColWidths['inlandAct'] ? { width: detailColWidths['inlandAct'], minWidth: detailColWidths['inlandAct'] } : undefined} >Inland<br/>Activity<ColResizeHandle onMouseDown={startDetailColResize('inlandAct')} /></th>
                                                    <th className="border border-black font-semibold p-1 min-w-[95px] text-xs leading-tight whitespace-nowrap bg-[#444444] text-white relative" style={detailColWidths['inlandNoAct'] ? { width: detailColWidths['inlandNoAct'], minWidth: detailColWidths['inlandNoAct'] } : undefined} >Inland No<br/>Activity<ColResizeHandle onMouseDown={startDetailColResize('inlandNoAct')} /></th>
                                                    <th className="border border-black font-semibold p-1 min-w-[85px] text-xs leading-tight whitespace-nowrap bg-[#444444] text-white relative" style={detailColWidths['inlandTotal'] ? { width: detailColWidths['inlandTotal'], minWidth: detailColWidths['inlandTotal'] } : undefined} >Inland<br/>Total<ColResizeHandle onMouseDown={startDetailColResize('inlandTotal')} /></th>
                                                    <th className="border border-black font-semibold p-1 min-w-[85px] text-xs leading-tight whitespace-nowrap bg-[#444444] text-white relative" style={detailColWidths['portAct'] ? { width: detailColWidths['portAct'], minWidth: detailColWidths['portAct'] } : undefined} >Port<br/>Activity<ColResizeHandle onMouseDown={startDetailColResize('portAct')} /></th>
                                                    <th className="border border-black font-semibold p-1 min-w-[95px] text-xs leading-tight whitespace-nowrap bg-[#444444] text-white relative" style={detailColWidths['portNoAct'] ? { width: detailColWidths['portNoAct'], minWidth: detailColWidths['portNoAct'] } : undefined} >Port No<br/>Activity<ColResizeHandle onMouseDown={startDetailColResize('portNoAct')} /></th>
                                                    <th className="border border-black font-semibold p-1 min-w-[85px] text-xs leading-tight whitespace-nowrap bg-[#444444] text-white relative" style={detailColWidths['portTotal'] ? { width: detailColWidths['portTotal'], minWidth: detailColWidths['portTotal'] } : undefined} >Port<br/>Total<ColResizeHandle onMouseDown={startDetailColResize('portTotal')} /></th>
                                                </>
                                            )}
                                        </tr>
                                    </thead>
                                    <tbody className="whitespace-nowrap text-xs leading-[14px]">
                                        {processedData.map((row, index) => {
                                            if (row.isBlankRow) {
                                                return (
                                                    <tr key={row.id || `blank-${index}`}>
                                                        {row.showTrade && <td rowSpan={row.tradeSpan} className="border border-gray-400 font-bold bg-white dark:bg-gray-800 align-top pt-0.5">{row.trade}</td>}
                                                        {row.showSub && <td rowSpan={row.subSpan} className="border border-gray-400 font-bold bg-[#e2efda] text-black align-top pt-0.5">{row.subTrade}</td>}
                                                        {row.showLane && <td rowSpan={row.laneSpan} className="border border-gray-400 font-bold bg-[#bdd7ee] text-[#2f5597] align-top pt-0.5">{row.lane}</td>}
                                                        <td colSpan={detailBlankRowColSpan} className="border border-gray-400 bg-[#f3f3f3] dark:bg-gray-800 p-0.5 h-[22px]">&nbsp;</td>
                                                    </tr>
                                                );
                                            }

                                            const isVMS = String(row.vvd).trim().toUpperCase() === 'VMS';
                                            const isAPOnly = row.status === 'AP ONLY';
                                            const isAPFrozen = row.status === 'AP FROZEN';
                                            const isFlaggedRow = isVMS || isAPOnly || isAPFrozen;

                                            const getBg = (defaultBg, isApRange) => {
                                                if (isVMS) return 'bg-[#d9d9d9] text-black';
                                                if (isAPOnly && isApRange) return 'bg-[#ffc000] text-black';
                                                if (isAPFrozen && isApRange) return 'bg-[#DA9694] text-black';
                                                return defaultBg === 'bg-white' ? 'bg-white dark:bg-gray-800' : defaultBg;
                                            };

                                            const rowStatusBadge = '';

                                            return (
                                                <tr key={row.id || index}>
                                                    {row.showTrade && <td rowSpan={row.tradeSpan} className="border border-gray-400 font-bold bg-white dark:bg-gray-800 align-top pt-0.5">{row.trade}</td>}
                                                    {row.showSub && <td rowSpan={row.subSpan} className="border border-gray-400 font-bold bg-[#e2efda] text-black align-top pt-0.5">{row.subTrade}</td>}
                                                    {row.showLane && <td rowSpan={row.laneSpan} className="border border-gray-400 font-bold bg-[#bdd7ee] text-[#2f5597] align-top pt-0.5">{row.lane}</td>}

                                                    <td className={`border border-gray-400 p-0.5 font-bold ${getBg('bg-white', true)}`}>{rowStatusBadge}{row.saleWeek}</td>
                                                    <td className={`border border-gray-400 p-0.5 ${getBg('bg-white', true)}`}>{row.pic}</td>
                                                    <td className={`border border-gray-400 p-0.5 ${getBg('bg-white', true)}`}>{formatDate(row.cutoff)}</td>
                                                    <td className={`border border-gray-400 p-0.5 ${getBg('bg-white', true)}`}>{formatDate(row.etd)}</td>
                                                    <td className={`border border-gray-400 p-0.5 ${getBg('bg-white', true)}`}>{row.statusDisplay}</td>
                                                    <td className={`border border-gray-400 p-0.5 font-bold text-black ${getBg('bg-[#d9e1f2]', true)}`}>{row.vvd}</td>
                                                    <td className={`border border-gray-400 p-0.5 font-bold whitespace-nowrap text-[#2f5597] ${getBg('bg-[#d9e1f2]', true)}`}>{row.vessel}</td>
                                                    <td className={`border border-gray-400 p-0.5 font-bold ${getBg('bg-white', true)}`}>{row.maxLdn}</td>
                                                    <td className={`border border-gray-400 p-0.5 ${getBg('bg-white', true)}`}>{row.standby}</td>
                                                    <td className={`border border-gray-400 p-0.5 font-bold text-black ${getBg('bg-[#d9e1f2]', true)}`}>{row.curLaden}</td>
                                                    <td className={`border border-gray-400 p-0.5 ${getBg('bg-white', true)}`} style={row.utilGapFlagged && !isVMS && !isAPOnly && !isAPFrozen ? row.utilGapStyle : {}} title={row.utilGapFlagged && !isVMS && !isAPOnly && !isAPFrozen ? 'Utilization increased by 10% or greater since the prior business day.' : undefined}>{row.peakUtil}</td>
                                                    <td className={`border border-gray-400 p-0.5 font-bold text-black ${getBg('bg-[#FDE9D9]', true)}`} style={row.utilGapFlagged && !isVMS && !isAPOnly && !isAPFrozen ? row.utilGapStyle : {}} title={row.utilGapFlagged && !isVMS && !isAPOnly && !isAPFrozen ? 'Utilization increased by 10% or greater since the prior business day.' : undefined}>{row.curUtil}</td>
                                                    <td className={`border border-gray-400 p-0.5 ${getBg('bg-white', true)} ${row.shortfallNegative ? 'text-red-600' : ''}`}>{row.shortfall}</td>
                                                    <td className={`border border-gray-400 p-0.5 font-bold text-[#974706] ${isFlaggedRow ? '' : 'dark:text-amber-500'} ${getBg('bg-white', true)}`}>{row.quote}</td>
                                                    <td className={`border border-gray-400 p-0.5 text-[#2f5597] ${isFlaggedRow ? '' : 'dark:text-blue-400'} ${getBg('bg-white', true)}`}>{formatNumberWithCommas(toNum(row.broken))}</td>
                                                    {!bsaHidden && (
                                                        <>
                                                            <td className={`border border-gray-400 p-0.5 ${getBg('bg-white', true)}`}>{row.bsaTeu}</td>
                                                            <td className={`border border-gray-400 p-0.5 ${getBg('bg-white', true)}`}>{row.bsaWgt}</td>
                                                        </>
                                                    )}
                                                    {!reeferHidden && (
                                                        <>
                                                            <td className={`border border-gray-400 p-0.5 ${getBg('bg-white', true)}`}>{formatNumberWithCommas(row.rfrBsaPlugs)}</td>
                                                            <td className={`border border-gray-400 p-0.5 ${getBg('bg-white', true)}`}>{formatNumberWithCommas(row.rfrBkgPlugs)}</td>
                                                            <td className={`border border-gray-400 p-0.5 ${getBg('bg-white', true)}`}>{formatNumberWithCommas(row.rfrMaxLdn)}</td>
                                                            <td className={`border border-gray-400 p-0.5 ${getBg('bg-white', true)}`}>{formatNumberWithCommas(row.rfrBkgTtl)}</td>
                                                            <td className={`border border-gray-400 p-0.5 ${getBg('bg-white', true)}`}>{row.rfrUtiliz}</td>
                                                        </>
                                                    )}
                                                    {!activityHidden && (
                                                        <>
                                                            <td className={`border border-gray-400 p-0.5 ${getBg('bg-white', true)}`}>{row.actVsBkgUtilz}</td>
                                                            <td className={`border border-gray-400 p-0.5 ${getBg('bg-white', true)}`} style={row.actVsMaxLdnStyle}>{row.actVsMaxLdn}</td>
                                                            <td className={`border border-gray-400 p-0.5 ${getBg('bg-white', true)}`}>{formatNumberWithCommas(row.inlandAct)}</td>
                                                            <td className={`border border-gray-400 p-0.5 ${getBg('bg-white', true)}`}>{formatNumberWithCommas(row.inlandNoAct)}</td>
                                                            <td className={`border border-gray-400 p-0.5 ${getBg('bg-white', true)}`}>{formatNumberWithCommas(row.inlandTotal)}</td>
                                                            <td className={`border border-gray-400 p-0.5 ${getBg('bg-white', true)}`}>{formatNumberWithCommas(row.portAct)}</td>
                                                            <td className={`border border-gray-400 p-0.5 ${getBg('bg-white', true)}`}>{formatNumberWithCommas(row.portNoAct)}</td>
                                                            <td className={`border border-gray-400 p-0.5 ${getBg('bg-white', true)}`}>{formatNumberWithCommas(row.portTotal)}</td>
                                                        </>
                                                    )}
                                                    {!opIssuesHidden && (
                                                        <td className={`border border-gray-400 py-0.5 text-left px-2 whitespace-nowrap ${getBg('bg-white', false)}`} style={String(row.opIssues || '').trim().toUpperCase().startsWith('**ALERT') ? { color: '#FF0000', fontWeight: 'bold' } : {}}>{renderAsteriskHide(row.opIssues)}</td>
                                                    )}
                                                    {!sectorAllocHidden && (
                                                        <>
                                                            <td className={`border border-gray-400 py-0.5 text-left px-2 ${getBg('bg-white', false)}`}>{renderSecAlloc(row.sectorRemarks)}</td>
                                                            <td className={`border border-gray-400 p-0.5 ${getBg('bg-white', false)}`}>{renderSecAlloc(row.sgsinDryVsRfr)}</td>
                                                        </>
                                                    )}
                                                    {!rotationHidden && (
                                                        <>
                                                            <td className={`border border-gray-400 p-0.5 whitespace-nowrap ${getBg('bg-white', false)}`}>{renderAsteriskHide(row.proformaRot)}</td>
                                                            <td className={`border border-gray-400 p-0.5 whitespace-nowrap ${getBg('bg-white', false)}`}>{renderAsteriskHide(row.actualRot)}</td>
                                                        </>
                                                    )}
                                                    {!apStatusHidden && (
                                                        <td className={`border border-gray-400 p-0.5 ${getBg('bg-white', false)}`}>{renderAsteriskHide(row.apStatus)}</td>
                                                    )}
                                                    {!tradeBreakdownHidden && (
                                                        <>
                                                            <td className={`border border-gray-400 p-0.5 ${getBg('bg-white', false)}`}>{formatNumberWithCommas(row.tpt)}</td>
                                                            <td className={`border border-gray-400 p-0.5 ${getBg('bg-white', false)}`}>{formatNumberWithCommas(row.tat)}</td>
                                                            <td className={`border border-gray-400 p-0.5 ${getBg('bg-white', false)}`}>{formatNumberWithCommas(row.lwt)}</td>
                                                            <td className={`border border-gray-400 p-0.5 ${getBg('bg-white', false)}`}>{formatNumberWithCommas(row.lnt)}</td>
                                                            <td className={`border border-gray-400 p-0.5 ${getBg('bg-white', false)}`}>{formatNumberWithCommas(row.imt)}</td>
                                                            <td className={`border border-gray-400 p-0.5 ${getBg('bg-white', false)}`}>{formatNumberWithCommas(row.let)}</td>
                                                        </>
                                                    )}
                                                    {!dgVolumeHidden && (
                                                        <td className={`border border-gray-400 p-0.5 ${getBg('bg-white', false)}`}>{formatNumberWithCommas(row.dgTeu)}</td>
                                                    )}

                                                    {!remarksHidden && (
                                                        <td className="border border-gray-400 py-0.5 bg-white dark:bg-gray-800 text-left px-2 whitespace-nowrap">{renderAsteriskHide(row.remarks)}</td>
                                                    )}
                                                </tr>
                                            );
                                        })}
                                        
                                        {processedData.length === 0 && (
                                            <tr>
                                                <td colSpan={detailNoDataColSpan} className="p-8 text-center text-gray-500 dark:text-gray-400 font-semibold bg-white dark:bg-gray-800 border border-gray-400">
                                                    No data matches the selected filters.
                                                </td>
                                            </tr>
                                        )}
                                    </tbody>
                                </table>
                            </div>
                            </>
                                            )}
                            </div>
                        </>
                    )}
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<FlashReportDashboard />);
    </script>
</body>
</html>
