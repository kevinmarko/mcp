        const getPercentNum = (val) => {
            if (!val) return 0;
            let s = String(val).trim();
            if (s.includes('%')) return parseFloat(s) || 0;
            let n = parseFloat(s);
            if (isNaN(n)) return 0;
            return n * 100;
        };

        const formatPercent = (val) => {
            if (val === '' || val === null || val === undefined) return '';
            let strVal = String(val).trim();
            if (strVal.includes('%')) {
                const parsed = parseFloat(strVal);
                return isNaN(parsed) ? strVal : `${Math.round(parsed)}%`;
            }
            let num = parseFloat(strVal);
            if (!isNaN(num)) {
                return `${Math.round(num * 100)}%`;
            }
            return strVal;
        };

        const formatNumberWithCommas = (val) => {
            if (val === '' || val === null || val === undefined) return val;
            const num = parseFloat(String(val).replace(/,/g, ''));
            if (isNaN(num)) return val;
            return Math.round(num).toLocaleString('en-US');
        };

        const formatAccountingNumber = (val) => {
            if (val === '' || val === null || val === undefined) return val;
            const num = Math.round(parseFloat(String(val).replace(/,/g, '')));
            if (isNaN(num)) return val;
            if (num < 0) {
                return `(-${Math.abs(num).toLocaleString('en-US')})`;
            }
            return num.toLocaleString('en-US');
        };

        const formatAccountingSigned = (val) => {
            if (val === '' || val === null || val === undefined) return val;
            const num = Math.round(parseFloat(String(val).replace(/,/g, '')));
            if (isNaN(num)) return val;
            if (num < 0) return `(-${Math.abs(num).toLocaleString('en-US')})`;
            return `+${num.toLocaleString('en-US')}`;
        };

        const DATE_MONTH_INDEX = { jan: 0, feb: 1, mar: 2, apr: 3, may: 4, jun: 5, jul: 6, aug: 7, sep: 8, oct: 9, nov: 10, dec: 11 };
        const parseKnownDate = (str) => {
            let m = str.match(/^(\d{4})-(\d{1,2})-(\d{1,2})(?:[ T](\d{1,2}):(\d{2})(?::\d{2})?)?$/);
            if (m) {
                const [, y, mo, d, h, mi] = m;
                return { year: parseInt(y, 10), month0: parseInt(mo, 10) - 1, day: parseInt(d, 10), hour: h !== undefined ? parseInt(h, 10) : null, minute: mi };
            }
            m = str.match(/^(\d{1,2})\/(\d{1,2})\/(\d{2,4})$/);
            if (m) {
                const [, mo, d, y] = m;
                return { year: y.length === 4 ? parseInt(y, 10) : 2000 + parseInt(y, 10), month0: parseInt(mo, 10) - 1, day: parseInt(d, 10), hour: null, minute: null };
            }
            return null;
        };
        const formatDate = (val, yearHintDateStr) => {
            const str = String(val ?? '').trim();
            if (!str) return '';

            const known = parseKnownDate(str);
            if (known) {
                const datePart = `${known.month0 + 1}/${known.day}/${String(known.year).slice(-2)}`;
                return known.hour !== null ? `${datePart} ${String(known.hour).padStart(2, '0')}:${known.minute}` : datePart;
            }

            const m = str.match(/^([A-Za-z]{3,9})\s+(\d{1,2})$/);
            if (m) {
                const monthKey = m[1].slice(0, 3).toLowerCase();
                const day = parseInt(m[2], 10);
                if (!(monthKey in DATE_MONTH_INDEX)) return str;
                const month0 = DATE_MONTH_INDEX[monthKey];
                const hint = parseKnownDate(String(yearHintDateStr ?? '').trim());
                if (!hint) return str;
                let year = hint.year;
                if (month0 > hint.month0 || (month0 === hint.month0 && day > hint.day)) year -= 1;
                return `${month0 + 1}/${day}/${String(year).slice(-2)}`;
            }

            return str;
        };

        // Day-granularity "has this date already happened" check (2026-09-02) -- used by the
        // Analyze modal's "Departed" star on the Weekly Capacity vs. Laden Trend chart: a VVD
        // counts as departed once its ETD Last Port date is today or earlier. Reuses
        // parseKnownDate (same date-format handling as formatDate above) rather than a raw
        // `new Date(rawVal)` parse, since raw values come through as "M/D/YY(YY)" or ISO
        // strings that Date's own parser doesn't reliably handle the same way across browsers.
        // Both sides are truncated to local midnight so a same-day ETD (any time of day) still
        // reads as departed, and the comparison isn't sensitive to the exact wall-clock moment
        // this renders.
        const isOnOrBeforeDay = (rawVal, referenceDate) => {
            const known = parseKnownDate(String(rawVal ?? '').trim());
            if (!known) return false;
            const parsed = new Date(known.year, known.month0, known.day);
            const ref = new Date(referenceDate.getFullYear(), referenceDate.getMonth(), referenceDate.getDate());
            return parsed.getTime() <= ref.getTime();
        };

        };
        const utilGapCellClass = (currentUtilz, peakUtilz) =>
            isUtilGapFlagged(currentUtilz, peakUtilz) ? 'bg-red-600 text-white font-bold' : '';

        function compareSaleWeek(a, b) {
            const parse = (s) => {
                const m = /^(\d{4})\/W(\d{1,2})$/.exec(String(s || '').trim());
                return m ? [parseInt(m[1], 10), parseInt(m[2], 10)] : null;
            };
            const pa = parse(a), pb = parse(b);
            if (pa && pb) {
                if (pa[0] !== pb[0]) return pa[0] - pb[0];
                return pa[1] - pb[1];
            }
            if (pa && !pb) return -1;
            if (!pa && pb) return 1;
            return String(a || '').localeCompare(String(b || ''));
        }

        const SEC_ALLOC_BOLD_KEYWORDS = [
            "AEJEA:", "CNNGB:", "CNSHA:", "CNSHK:", "CR/GT/NI Discharge:", "EB PA Load:",
            "FRFOS/ESVLC Discharge:", "GRPIR:", "INPAV:", "KRPUS:", "LATAM Load:", "MX Laden:",
            "PA Load:", "PAROD Discharge :", "PAROD Move Count Unit:", "LKCMB:", "SGSIN:",
            "BEANR:", "DEBRV:", "DEHAM:", "FRLEH:", "GBSOU:", "LATAM:", "NLRTM:", "THLCH:",
            "VNCMP:", "ESALG:", "ESVLC:", "FRFOS:", "ITGOA:", "ITSPE:", "Laden:", "ITSAL:",
            "TRALI:", "TRISK:", "TRIST:", "INNSA:", "MTY:", "PAROD Discharge:"
        ];

        const SEC_ALLOC_PATTERN = (() => {
            const escapeRegex = (s) => s.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
            const sortedKeywords = [...SEC_ALLOC_BOLD_KEYWORDS].sort((a, b) => b.length - a.length);
            const keywordPattern = sortedKeywords.map(escapeRegex).join('|');
            const redPattern = '\\+\\d+\\*+|\\(-\\d+\\*+\\)';
            return new RegExp(`(${keywordPattern})|(${redPattern})`, 'gi');
        })();

        const renderSecAlloc = (text) => {
            if (text === null || text === undefined || text === '') return text;
            const raw = String(text);
            if (raw.trim() === '*') return null;

            const combined = SEC_ALLOC_PATTERN;
            combined.lastIndex = 0;

            const parts = [];
            let lastIndex = 0;
            let match;
            let key = 0;
            while ((match = combined.exec(raw)) !== null) {
                if (match.index > lastIndex) {
                    parts.push(<React.Fragment key={key++}>{raw.slice(lastIndex, match.index)}</React.Fragment>);
                }
                if (match[1]) {
                    parts.push(<b key={key++}>{match[1]}</b>);
                } else if (match[2]) {
                    parts.push(<span key={key++} className="text-red-600 font-semibold">{match[2]}</span>);
                }
                lastIndex = combined.lastIndex;
                if (match.index === combined.lastIndex) combined.lastIndex += 1;
            }
            if (lastIndex < raw.length) {
                parts.push(<React.Fragment key={key++}>{raw.slice(lastIndex)}</React.Fragment>);
            }
            return parts;
        };

        const renderAsteriskHide = (text) => {
            if (text === null || text === undefined || text === '') return text;
            const raw = String(text);
            if (raw.trim() === '*') return null;
            return raw;
        };

        const measureRenderedTextWidth = (el) => {
            if (!el) return 0;
            try {
                const range = document.createRange();
                range.selectNodeContents(el);
                const handle = el.querySelector(':scope > [data-resize-handle]');
                if (handle) range.setEndBefore(handle);
                return range.getBoundingClientRect().width;
            } catch {
                return el.scrollWidth || 0;
            }
        };

        const PivotTableViewer = ({ data, config }) => {
            const [collapsedNodes, setCollapsedNodes] = useState(new Set());
            const toggleCollapse = (nodeId) => {
                const next = new Set(collapsedNodes);
                if (next.has(nodeId)) next.delete(nodeId);
                else next.add(nodeId);
                setCollapsedNodes(next);
            };
            const { rowFields = [], dataFields = [], title = "Pivot", colField = null, valuesInRows = false, rowClass = null, accentColor = '#E5007D', prettyGrandTotal = false, showGrandTotal = true, showGrandTotalColumn = true, childOrder = null, hideRowToggles = false, tabular = false } = config;

            const [colWidths, setColWidths] = useState({});
            const manualColWidthKeysRef = useRef(new Set());
            const startColResize = (key) => (e) => {
                e.preventDefault();
                e.stopPropagation();
                const thEl = e.currentTarget.closest('th');
                const startWidth = colWidths[key] || (thEl ? thEl.offsetWidth : 80);
                const startX = e.clientX;
                const onMove = (moveEvent) => {
                    manualColWidthKeysRef.current.add(key);
                    const newWidth = Math.max(40, startWidth + (moveEvent.clientX - startX));
                    setColWidths(prev => ({ ...prev, [key]: newWidth }));
                };
                const onUp = () => {
                    window.removeEventListener('mousemove', onMove);
                    window.removeEventListener('mouseup', onUp);
                };
                window.addEventListener('mousemove', onMove);
                window.addEventListener('mouseup', onUp);
            };
            const ColResizeHandle = ({ colKey }) => (
                <span
                    onMouseDown={startColResize(colKey)}
                    data-resize-handle="true"
                    className="absolute top-0 right-0 h-full w-1.5 cursor-col-resize hover:bg-blue-400 active:bg-blue-600 z-10"
                    style={{ userSelect: 'none' }}
                    aria-hidden="true"
                />
            );

            const tableRef = useRef(null);

            const getRowStatusBadge = (cls) => {
                if (!cls) return '';
                if (cls.includes('bg-[#d9d9d9]')) return '[VMS] ';
                if (cls.includes('bg-[#DA9694]')) return '[AP Frozen] ';
                if (cls.includes('bg-[#ffc000]')) return '[AP Only] ';
                if (cls.includes('bg-[#FF0000]')) return '[NO N.A. CALL] ';
                if (cls.includes('bg-[#fecaca]')) return '[Port Excluded] ';
                return '';
            };

            const aggregated = useMemo(() => {
                const root = { _totals: {}, _children: {}, label: 'Grand Total', context: {} };
                const colKeysSet = new Set();
                
                data.forEach(row => {
                    if (colField) {
                        const colVal = row[colField] || '(blank)';
                        colKeysSet.add(colVal);
                    }
                    
                    let current = root;
                    
                    const aggregateData = (node, r, colVal = 'Total') => {
                        if (!node._totals[colVal]) {
                            node._totals[colVal] = {};
                            dataFields.forEach(df => {
                                node._totals[colVal][df.name] = { sum: 0, count: 0, max: -Infinity };
                            });
                        }
                        dataFields.forEach(df => {
                            const val = parseFloat(String(r[df.base] || '0').replace(/[,%()]/g, '')) || 0;
                            node._totals[colVal][df.name].sum += val;
                            node._totals[colVal][df.name].count += 1;
                            if (val > node._totals[colVal][df.name].max) node._totals[colVal][df.name].max = val;
                        });
                    };
                    
                    const cVal = colField ? (row[colField] || '(blank)') : 'Total';
                    
                    aggregateData(root, row, 'Total');
                    if (colField) aggregateData(root, row, cVal);
                    
                    rowFields.forEach((rf, idx) => {
                        const val = row[rf.key] || '(blank)';
                        if (!current._children[val]) {
                            current._children[val] = { _totals: {}, _children: {}, label: val, context: { ...current.context, [rf.key]: row[rf.key] } };
                        }
                        
                        current = current._children[val];
                        aggregateData(current, row, 'Total');
                        if (colField) aggregateData(current, row, cVal);
                    });
                });
                
                const colKeys = Array.from(colKeysSet).sort(compareSaleWeek);

                const rollupFields = dataFields.filter(df => df.rollupSumOfChildren && df.agg === 'max');
                if (rollupFields.length > 0) {
                    const applyRollup = (node, depth) => {
                        const childNodes = Object.values(node._children);
                        childNodes.forEach(c => applyRollup(c, depth + 1));
                        if (childNodes.length === 0) return;
                        rollupFields.forEach(df => {
                            const stableAtDepth = df.rollupStableAtDepth || Infinity;
                            if (depth >= stableAtDepth) return;
                            const colVals = new Set(Object.keys(node._totals));
                            childNodes.forEach(c => Object.keys(c._totals).forEach(cv => colVals.add(cv)));
                            colVals.forEach(colVal => {
                                if (!node._totals[colVal] || !node._totals[colVal][df.name]) return;
                                let sum = 0;
                                childNodes.forEach(c => {
                                    const ct = c._totals[colVal] && c._totals[colVal][df.name];
                                    if (ct) sum += ct.max;
                                });
                                node._totals[colVal][df.name].max = sum;
                            });
                        });
                    };
                    applyRollup(root, 0);
                }

                return { root, colKeys };
            }, [data, config]);
            
            const flattenTabular = (node, level = 0, currentPath = [], isLastChild = true, parentId = 'root') => {
                let rows = [];
                const nodeId = `${parentId}-${node.label}`;
                const hasChildren = Object.keys(node._children).length > 0;
                
                const myPath = level === 0 ? [] : [...currentPath, node.label];

                if (level === rowFields.length || (!hasChildren && level > 0)) {
                    rows.push({
                        id: nodeId,
                        level,
                        path: myPath,
                        label: node.label,
                        totals: node._totals,
                        context: node.context,
                        isLastChild,
                        hasChildren
                    });
                    return rows;
                }

                const pathStr = myPath.join('|') || 'ROOT';
                const order = childOrder && childOrder[pathStr];
                const childrenKeys = rowFields[level] && rowFields[level].key === 'saleWeek'
                    ? Object.keys(node._children).sort(compareSaleWeek)
                    : order
                        ? [
                            ...order.filter(k => k in node._children),
                            ...Object.keys(node._children).filter(k => !order.includes(k)).sort()
                        ]
                        : Object.keys(node._children).sort();

                if (childrenKeys.length === 0) {
                     rows.push({
                        id: nodeId,
                        level,
                        path: myPath,
                        label: node.label,
                        totals: node._totals,
                        context: node.context,
                        isLastChild,
                        hasChildren: false
                    });
                } else {
                    childrenKeys.forEach((key, index) => {
                        const isLast = index === childrenKeys.length - 1;
                        rows = rows.concat(flattenTabular(node._children[key], level + 1, myPath, isLast, nodeId));
                    });
                }
                return rows;
            };

            const flatten = (node, level = 0, isLastChild = true, prefix = '', parentId = 'root', parentPath = '') => {
                let rows = [];
                const nodeId = `${parentId}-${node.label}`;
                const hasChildren = Object.keys(node._children).length > 0;
                rows.push({
                    id: nodeId,
                    level,
                    label: node.label,
                    totals: node._totals,
                    context: node.context,
                    isLastChild,
                    prefix,
                    hasChildren
                });

                if (collapsedNodes.has(nodeId)) return rows;

                const path = parentPath || 'ROOT';
                const order = childOrder && childOrder[path];
                const childrenKeys = rowFields[level] && rowFields[level].key === 'saleWeek'
                    ? Object.keys(node._children).sort(compareSaleWeek)
                    : order
                        ? [
                            ...order.filter(k => k in node._children),
                            ...Object.keys(node._children).filter(k => !order.includes(k)).sort()
                        ]
                        : Object.keys(node._children).sort();
                childrenKeys.forEach((key, index) => {
                    const isLast = index === childrenKeys.length - 1;
                    const newPrefix = prefix + (isLastChild ? '    ' : '│   ');
                    const newParentPath = parentPath ? `${parentPath}|${key}` : key;
                    rows = rows.concat(flatten(node._children[key], level + 1, isLast, newPrefix, nodeId, newParentPath));
                });
                return rows;
            };
            
            const renderRows = useMemo(() => {
                if (!aggregated.root || Object.keys(aggregated.root._totals).length === 0) return [];
                if (tabular) {
                    const flat = flattenTabular(aggregated.root, 0, [], true);
                    return showGrandTotal ? flat : flat.filter(row => row.level !== 0);
                } else {
                    const flat = flatten(aggregated.root, 0, true, '');
                    return showGrandTotal ? flat : flat.filter(row => row.level !== 0);
                }
            }, [aggregated, showGrandTotal, tabular]);
            
            const colKeysToRender = colField ? aggregated.colKeys : ['Total'];

            const colKeysWithTotal = colField
                ? (showGrandTotalColumn ? [...colKeysToRender, 'Total'] : colKeysToRender)
                : ['Total'];

            useLayoutEffect(() => {
                const table = tableRef.current;
                if (!table) return;
                const cells = table.querySelectorAll('[data-autofit-col]');
                
                const originalStyles = [];
                cells.forEach(el => {
                    originalStyles.push(el.style.whiteSpace);
                    el.style.whiteSpace = 'nowrap';
                });

                const maxByKey = {};
                cells.forEach(el => {
                    const key = el.getAttribute('data-autofit-col');
                    const w = measureRenderedTextWidth(el);
                    if (!(key in maxByKey) || w > maxByKey[key]) maxByKey[key] = w;
                });
                
                cells.forEach((el, i) => {
                    el.style.whiteSpace = originalStyles[i];
                });

                const AUTO_FIT_PADDING = 22;
                const AUTO_FIT_MIN = 40;
                setColWidths(prev => {
                    let changed = false;
                    const next = { ...prev };
                    Object.keys(maxByKey).forEach(key => {
                        if (manualColWidthKeysRef.current.has(key)) return;
                        const target = Math.ceil(Math.max(AUTO_FIT_MIN, maxByKey[key] + AUTO_FIT_PADDING));
                        if (Math.abs((prev[key] || 0) - target) > 1) {
                            next[key] = target;
                            changed = true;
                        }
                    });
                    return changed ? next : prev;
                });
            }, [renderRows, colKeysWithTotal, dataFields]);

            return (
                <div className="w-max max-w-full border border-black dark:border-gray-600 overflow-x-auto bg-white dark:bg-gray-800 shadow-lg rounded-md mb-4">
                    <h2 className="text-lg font-bold text-white py-1.5 px-2 flex justify-between rounded-t-sm" style={{ backgroundColor: accentColor }}>
                        <span>{title}</span>
                    </h2>
                    <table ref={tableRef} className="w-max table-fixed text-xs text-center border-collapse border border-gray-400">
                        <caption style={{ position: 'absolute', width: '1px', height: '1px', padding: 0, margin: '-1px', overflow: 'hidden', clip: 'rect(0,0,0,0)', whiteSpace: 'nowrap', border: 0 }}>{title}</caption>
                        <thead className="bg-[#333333] text-white sticky top-0 z-20 [&_th]:border-0 [&_th]:shadow-[inset_0_0_0_1px_#000] [&_th]:bg-clip-padding [&_th:not([class*='bg-'])]:bg-[#333333]">
                            {colField && !valuesInRows && (
                                <tr>
                                    {tabular ? (
                                        rowFields.map((rf, i) => (
                                            <th key={`rl-${i}`} data-autofit-col={`rowLabels-${i}`} className="border border-black py-0.5 px-0.5 min-w-[80px] text-center relative" style={colWidths[`rowLabels-${i}`] ? { width: colWidths[`rowLabels-${i}`], minWidth: colWidths[`rowLabels-${i}`] } : undefined}>{rf.label}<ColResizeHandle colKey={`rowLabels-${i}`} /></th>
                                        ))
                                    ) : (
                                        <th data-autofit-col="rowLabels" className="border border-black py-0.5 px-0.5 min-w-[200px] text-left relative" style={colWidths.rowLabels ? { width: colWidths.rowLabels, minWidth: colWidths.rowLabels } : undefined}>Row Labels<ColResizeHandle colKey="rowLabels" /></th>
                                    )}
                                    {colKeysToRender.map((c, i) => (
                                        <th key={i} colSpan={dataFields.length} className="border border-black py-0.5 px-0.5 bg-[#444444]">{c}</th>
                                    ))}
                                    {showGrandTotalColumn && <th colSpan={dataFields.length} className="border border-black py-0.5 px-0.5 font-bold">Grand Total</th>}
                                </tr>
                            )}
                            <tr>
                                {tabular ? (
                                    <>
                                     {rowFields.map((rf, i) => (
                                        <th key={`rl2-${i}`} data-autofit-col={`rowLabels-${i}`} className="border border-black py-0.5 px-0.5 min-w-[80px] text-center relative bg-gray-100 text-black dark:bg-gray-700 dark:text-gray-200" style={colWidths[`rowLabels-${i}`] ? { width: colWidths[`rowLabels-${i}`], minWidth: colWidths[`rowLabels-${i}`] } : undefined}>{rf.label}<ColResizeHandle colKey={`rowLabels-${i}`} /></th>
                                     ))}
                                     {valuesInRows && (
                                         <th data-autofit-col="valuesCol" className="border border-black py-0.5 px-0.5 bg-[#444444] text-gray-200 text-left relative" style={colWidths.valuesCol ? { width: colWidths.valuesCol, minWidth: colWidths.valuesCol } : undefined}><span className="invisible">Values</span><ColResizeHandle colKey="valuesCol" /></th>
                                     )}
                                    </>
                                ) : (
                                    <th data-autofit-col="rowLabels" className="border border-black py-0.5 px-0.5 min-w-[200px] text-left relative" style={colWidths.rowLabels ? { width: colWidths.rowLabels, minWidth: colWidths.rowLabels } : undefined}>Row Labels<ColResizeHandle colKey="rowLabels" /></th>
                                )}
                                {colField && valuesInRows && !tabular && (
                                    <>
                                        <th data-autofit-col="valuesCol" className="border border-black py-0.5 px-0.5 bg-[#444444] relative" style={colWidths.valuesCol ? { width: colWidths.valuesCol, minWidth: colWidths.valuesCol } : undefined}><span className="invisible">Values</span><ColResizeHandle colKey="valuesCol" /></th>
                                    </>
                                )}
                                {colField && valuesInRows && (
                                    <>
                                        {colKeysToRender.map((c, i) => (
                                            <th key={i} data-autofit-col={`col:${c}`} className="border border-black py-0.5 px-0.5 bg-[#444444] relative" style={colWidths[`col:${c}`] ? { width: colWidths[`col:${c}`], minWidth: colWidths[`col:${c}`] } : undefined}>{c}<ColResizeHandle colKey={`col:${c}`} /></th>
                                        ))}
                                        {showGrandTotalColumn && <th data-autofit-col="grandTotalValuesCol" className="border border-black py-0.5 px-0.5 font-bold relative" style={colWidths.grandTotalValuesCol ? { width: colWidths.grandTotalValuesCol, minWidth: colWidths.grandTotalValuesCol } : undefined}>Grand Total<ColResizeHandle colKey="grandTotalValuesCol" /></th>}
                                    </>
                                )}
                                {(!colField || !valuesInRows) && colKeysWithTotal.map((cKey) => (
                                    dataFields.map((df, dfIdx) => (
                                        <th key={`${cKey}-${dfIdx}`} data-autofit-col={df.name} className={`border border-black py-0.5 px-0.5 min-w-[80px] relative ${cKey === 'Total' && colField ? 'font-bold bg-[#333333]' : ''}`} style={colWidths[df.name] ? { width: colWidths[df.name], minWidth: colWidths[df.name] } : undefined}>{df.label}<ColResizeHandle colKey={df.name} /></th>
                                    ))
                                ))}
                            </tr>
                        </thead>
                        <tbody className="whitespace-nowrap">
                            {renderRows.map((row, i) => {
                                const customClass = rowClass && row.level === rowFields.length ? rowClass(row.totals, row.context) : '';
                                const trClassBase = `${customClass ? '' : 'hover:bg-gray-100 dark:hover:bg-gray-700'} ${row.level === 0 ? (prettyGrandTotal ? 'font-bold shadow-md' : 'bg-[#d9e1f2] text-black font-bold') : ''} ${row.level === 1 && !tabular ? 'font-bold' : ''}`;
                                const grandTotalCellStyle = (row.level === 0 && prettyGrandTotal) ? { backgroundColor: accentColor, color: '#fff' } : undefined;

                                if (tabular) {
                                    if (valuesInRows) {
                                        return (
                                            <React.Fragment key={`tab-${i}`}>
                                                {dataFields.map((df, dfIdx) => {
                                                    const isFirstValRow = dfIdx === 0;
                                                    
                                                    // Determine if we should show the row grouping label and calculate rowspan
                                                    const renderedFields = [];
                                                    for (let rfIdx = 0; rfIdx < rowFields.length; rfIdx++) {
                                                        const isFirstInstance = i === 0 || renderRows[i - 1].path[rfIdx] !== row.path[rfIdx] || 
                                                            (rfIdx > 0 && renderRows[i - 1].path[rfIdx - 1] !== row.path[rfIdx - 1]);
                                                        
                                                        // Only show the cell if it's the first instance AND we are on the first value row (so it doesn't repeat per value row)
                                                        const showVal = isFirstInstance && isFirstValRow;
                                                        
                                                        if (showVal) {
                                                            let groupRowSpan = 0;
                                                            for (let j = i; j < renderRows.length; j++) {
                                                                let samePath = true;
                                                                for(let k=0; k<=rfIdx; k++){
                                                                    if (renderRows[j].path[k] !== row.path[k]) {
                                                                        samePath = false;
                                                                        break;
                                                                    }
                                                                }
                                                                if (samePath) {
                                                                groupRowSpan += dataFields.length; // Span all value rows for this group item
                                                            } else {
                                                                break;
                                                            }
                                                        }
                                                        renderedFields.push(
                                                            <td key={`rl-${rfIdx}`} rowSpan={groupRowSpan} data-autofit-col={`rowLabels-${rfIdx}`} className={`border border-gray-400 py-1 px-1 text-center align-top ${rowFields[rfIdx].cellClass ? rowFields[rfIdx].cellClass : 'bg-gray-50 dark:bg-gray-800'} whitespace-nowrap ${row.level === rfIdx + 1 ? 'font-bold' : ''}`} style={colWidths[`rowLabels-${rfIdx}`] ? { width: colWidths[`rowLabels-${rfIdx}`], minWidth: colWidths[`rowLabels-${rfIdx}`] } : undefined}>
                                                                {row.path[rfIdx]}
                                                            </td>
                                                        );
                                                    }
                                                }

                                                // Calculate if this is a subtotal row or grand total row
                                                const isGrandTotal = row.level === 0;
                                                    const isSubtotal = row.level < rowFields.length && row.level > 0;
                                                    
                                                    let rowSpanContext = null;
                                                    if (isGrandTotal) {
                                                       rowSpanContext = <td rowSpan={dataFields.length} className="border border-gray-400 py-1 px-1 text-left align-top bg-[#d9e1f2] text-black font-bold whitespace-nowrap" colSpan={rowFields.length}>Grand Total</td>;
                                                    } else if (isSubtotal) {
                                                        const label = `${row.label} Total`;
                                                        rowSpanContext = <td rowSpan={dataFields.length} className="border border-gray-400 py-1 px-1 text-left align-top bg-blue-100 dark:bg-blue-900 font-bold whitespace-nowrap" colSpan={rowFields.length - row.level + 1}>{label}</td>;
                                                    }

                                                    return (
                                                        <tr key={`tab-${i}-${dfIdx}`} className={`${customClass || 'bg-white dark:bg-gray-800 hover:bg-gray-50 dark:hover:bg-gray-700'}`}>
                                                            {isFirstValRow && rowSpanContext}
                                                            {!isGrandTotal && !isSubtotal && renderedFields}
                                                            <td data-autofit-col="valuesCol" className={`border border-gray-400 py-1 px-1 text-left font-semibold ${isGrandTotal ? 'bg-[#d9e1f2] text-black' : isSubtotal ? 'bg-blue-100 dark:bg-blue-900' : 'bg-white dark:bg-gray-800'}`} style={colWidths.valuesCol ? { width: colWidths.valuesCol, minWidth: colWidths.valuesCol } : undefined}>{df.label}</td>
                                                            {colKeysWithTotal.map((cKey, cIdx) => {
                                                                let val = 0;
                                                                const tGrp = row.totals[cKey] || {};
                                                                if (df.agg === 'calc' && df.calc) {
                                                                    val = df.calc(tGrp, row.context, cKey);
                                                                } else {
                                                                    const t = tGrp[df.name] || { sum: 0, max: 0, count: 0 };
                                                                    if (df.agg === 'sum') val = t.sum;
                                                                    if (df.agg === 'max') val = t.max;
                                                                    if (df.agg === 'count') val = t.count;
                                                                    if (df.agg === 'avg') val = t.count > 0 ? t.sum / t.count : 0;
                                                                }

                                                                let displayVal = val;
                                                                if (df.format === 'number') displayVal = formatNumberWithCommas(val);
                                                                else if (df.format === 'percent') displayVal = `${Math.round(df.rawFraction ? getPercentNum(val) : val)}%`;
                                                                else if (df.format === 'accounting') displayVal = formatAccountingNumber(val);
                                                                else if (df.format === 'accountingSignedRed') displayVal = formatAccountingSigned(val);

                                                                const cClass = `${df.cellClass ? df.cellClass(val, tGrp) : ''} ${negativeValueClass(val, df.format)}`.trim();
                                                                const cClassHasOwnBg = cClass.includes('bg-');
                                                                const colKeyStr = cKey === 'Total' ? 'grandTotalValuesCol' : `col:${cKey}`;
                                                                return <td key={cIdx} data-autofit-col={colKeyStr} className={`border border-gray-400 py-1 px-0.5 ${(cKey === 'Total' && !cClassHasOwnBg) ? 'font-bold bg-[#eef2fa] dark:bg-blue-950 text-black dark:text-gray-100' : (cKey === 'Total' ? 'font-bold' : '')} ${isGrandTotal ? 'bg-[#d9e1f2] text-black' : isSubtotal ? 'bg-blue-100 dark:bg-blue-900' : ''} ${cClass}`} style={colWidths[colKeyStr] ? { width: colWidths[colKeyStr], minWidth: colWidths[colKeyStr] } : undefined}>{displayVal}</td>;
                                                            })}
                                                        </tr>
                                                    );
                                                })}
                                            </React.Fragment>
                                        );
                                    }

                                    // Tabular without Values In Rows
                                    return (
                                        <tr key={`tab-${i}`} className={`hover:bg-gray-100 dark:hover:bg-gray-700 ${customClass}`}>
                                            {row.level === 0 ? (
                                                <td colSpan={rowFields.length} className="border border-gray-400 py-1 px-1 text-left font-bold bg-[#d9e1f2] text-black whitespace-nowrap">
                                                    Grand Total
                                                </td>
                                            ) : row.level < rowFields.length ? (
                                                <>
                                                    {rowFields.map((rf, rfIdx) => {
                                                        if (rfIdx < row.level - 1) {
                                                            const showVal = i === 0 || renderRows[i - 1].path[rfIdx] !== row.path[rfIdx] || 
                                                                (rfIdx > 0 && renderRows[i - 1].path[rfIdx - 1] !== row.path[rfIdx - 1]);
                                                            
                                                            if (showVal) {
                                                                let rowSpan = 1;
                                                                for (let j = i + 1; j < renderRows.length; j++) {
                                                                    let samePath = true;
                                                                    for(let k=0; k<=rfIdx; k++){
                                                                        if (renderRows[j].path[k] !== row.path[k]) {
                                                                            samePath = false;
                                                                            break;
                                                                        }
                                                                    }
                                                                    if (samePath) {
                                                                        rowSpan++;
                                                                    } else {
                                                                        break;
                                                                    }
                                                                }
                                                                return (
                                                                    <td key={`subt-${rfIdx}`} rowSpan={rowSpan} data-autofit-col={`rowLabels-${rfIdx}`} className={`border border-gray-400 py-1 px-1 text-center align-top ${rf.cellClass ? rf.cellClass : 'bg-white dark:bg-gray-800'} font-bold whitespace-nowrap`}>
                                                                        {row.path[rfIdx]}
                                                                    </td>
                                                                );
                                                            }
                                                            return null;
                                                        } else if (rfIdx === row.level - 1) {
                                                            return <td key={`subt-${rfIdx}`} colSpan={rowFields.length - rfIdx} className="border border-gray-400 py-1 px-1 text-left font-bold bg-blue-100 dark:bg-blue-900 whitespace-nowrap">{row.label} Total</td>;
                                                        }
                                                        return null;
                                                    })}
                                                </>
                                            ) : (
                                                rowFields.map((rf, rfIdx) => {
                                                    const showVal = i === 0 || renderRows[i - 1].path[rfIdx] !== row.path[rfIdx] || 
                                                        (rfIdx > 0 && renderRows[i - 1].path[rfIdx - 1] !== row.path[rfIdx - 1]);
                                                    
                                                    if (showVal) {
                                                        let rowSpan = 1;
                                                        for (let j = i + 1; j < renderRows.length; j++) {
                                                            let samePath = true;
                                                            for(let k=0; k<=rfIdx; k++){
                                                                if (renderRows[j].path[k] !== row.path[k]) {
                                                                    samePath = false;
                                                                    break;
                                                                }
                                                            }
                                                            if (samePath) {
                                                                rowSpan++;
                                                            } else {
                                                                break;
                                                            }
                                                        }
                                                        return (
                                                            <td key={rfIdx} rowSpan={rowSpan} data-autofit-col={`rowLabels-${rfIdx}`} className={`border border-gray-400 py-1 px-1 text-center align-top ${rf.cellClass ? rf.cellClass : 'bg-white dark:bg-gray-800'} font-semibold whitespace-nowrap`}>
                                                                {getRowStatusBadge(customClass)}{row.path[rfIdx]}
                                                            </td>
                                                        );
                                                    }
                                                    return null;
                                                })
                                            )}

                                            {colKeysWithTotal.map((cKey) => (
                                                dataFields.map((df, colIdx) => {
                                                    let val = 0;
                                                    const tGrp = row.totals[cKey] || {};
                                                    if (df.agg === 'calc' && df.calc) {
                                                        val = df.calc(tGrp, row.context, cKey);
                                                    } else {
                                                        const t = tGrp[df.name] || { sum: 0, max: 0, count: 0 };
                                                        if (df.agg === 'sum') val = t.sum;
                                                        if (df.agg === 'max') val = t.max;
                                                        if (df.agg === 'count') val = t.count;
                                                        if (df.agg === 'avg') val = t.count > 0 ? t.sum / t.count : 0;
                                                    }

                                                    let displayVal = val;
                                                    if (df.format === 'number') displayVal = formatNumberWithCommas(val);
                                                    else if (df.format === 'percent') displayVal = `${Math.round(df.rawFraction ? getPercentNum(val) : val)}%`;
                                                    else if (df.format === 'accounting') displayVal = formatAccountingNumber(val);
                                                    else if (df.format === 'accountingSignedRed') displayVal = formatAccountingSigned(val);

                                                    if (df.hideOnLevels && df.hideOnLevels.includes(row.level)) {
                                                        displayVal = '';
                                                    }

                                                    const isSubtotalRow = row.level < rowFields.length && row.level > 0;
                                                    const isGrandTotalRow = row.level === 0;
                                                    const cClass = `${df.cellClass ? df.cellClass(val, tGrp) : ''} ${negativeValueClass(val, df.format)}`.trim();
                                                    const cClassHasOwnBg = cClass.includes('bg-');
                                                    return <td key={`${cKey}-${colIdx}`} data-autofit-col={df.name} className={`border border-gray-400 py-1 px-0.5 ${(cKey === 'Total' && !cClassHasOwnBg) ? 'font-bold bg-[#eef2fa] dark:bg-blue-950 text-black dark:text-gray-100' : (cKey === 'Total' ? 'font-bold' : '')} ${isGrandTotalRow ? 'bg-[#d9e1f2] text-black font-bold' : isSubtotalRow ? 'bg-blue-100 dark:bg-blue-900 font-bold' : ''} ${cClass}`}>{displayVal}</td>;
                                                })
                                            ))}
                                        </tr>
                                    );
                                }

                                if (valuesInRows) {
                                    return (
                                        <React.Fragment key={i}>
                                            <tr className={`${trClassBase} ${customClass} ${row.level === 0 ? 'bg-[#d9e1f2] text-black font-bold' : ''}`}>
                                                <td rowSpan={dataFields.length + 1} data-autofit-col="rowLabels" className={`border border-gray-400 py-1 px-0.5 align-top ${row.level === 0 ? 'text-center' : 'text-left'}`}>
                                                    <span style={{ paddingLeft: row.level === 0 ? 0 : `${Math.max(0, row.level - 1) * 1.5}rem` }} className={row.level === 0 ? '' : 'inline-flex items-center'}>
                                                        {row.level > 0 && !hideRowToggles && (row.hasChildren
                                                            ? <button type="button" onClick={() => toggleCollapse(row.id)} aria-label={collapsedNodes.has(row.id) ? 'Expand row' : 'Collapse row'} className="mr-1 w-4 text-center border border-gray-400 dark:border-gray-500 bg-white dark:bg-gray-700 dark:text-gray-100 shadow-sm font-bold text-[10px] leading-tight hover:bg-gray-200 dark:hover:bg-gray-600">{collapsedNodes.has(row.id) ? '+' : '−'}</button>
                                                            : <span className="mr-1 w-4 text-center inline-block">•</span>
                                                        )}
                                                        {row.label}
                                                    </span>
                                                </td>
                                                <td className="border border-gray-400 py-1 px-0.5 bg-gray-100 dark:bg-gray-700"></td>
                                                {colKeysWithTotal.map((cKey, cIdx) => (
                                                    <td key={`empty-${cIdx}`} className="border border-gray-400 py-1 px-0.5 bg-gray-100 dark:bg-gray-700"></td>
                                                ))}
                                            </tr>
                                            {dataFields.map((df, dfIdx) => (
                                                <tr key={`${i}-${dfIdx}`} className={`${customClass || 'bg-white dark:bg-gray-800 hover:bg-gray-50 dark:hover:bg-gray-700'}`}>
                                                    <td data-autofit-col="valuesCol" className="border border-gray-400 py-1 px-0.5 text-left bg-gray-100 dark:bg-gray-700 font-semibold">{df.label}</td>
                                                    {colKeysWithTotal.map((cKey, cIdx) => {
                                                        let val = 0;
                                                        const tGrp = row.totals[cKey] || {};
                                                        if (df.agg === 'calc' && df.calc) {
                                                            val = df.calc(tGrp, row.context, cKey);
                                                        } else {
                                                            const t = tGrp[df.name] || { sum: 0, max: 0, count: 0 };
                                                            if (df.agg === 'sum') val = t.sum;
                                                            if (df.agg === 'max') val = t.max;
                                                            if (df.agg === 'count') val = t.count;
                                                            if (df.agg === 'avg') val = t.count > 0 ? t.sum / t.count : 0;
                                                        }

                                                        let displayVal = val;
                                                        if (df.format === 'number') displayVal = formatNumberWithCommas(val);
                                                        else if (df.format === 'percent') displayVal = `${Math.round(df.rawFraction ? getPercentNum(val) : val)}%`;
                                                        else if (df.format === 'accounting') displayVal = formatAccountingNumber(val);
                                                        else if (df.format === 'accountingSignedRed') displayVal = formatAccountingSigned(val);

                                                        const cClass = `${df.cellClass ? df.cellClass(val, tGrp) : ''} ${negativeValueClass(val, df.format)}`.trim();
                                                        const cClassHasOwnBg = cClass.includes('bg-');
                                                        return <td key={cIdx} data-autofit-col={cKey === 'Total' ? 'grandTotalValuesCol' : `col:${cKey}`} className={`border border-gray-400 py-1 px-0.5 ${(cKey === 'Total' && !cClassHasOwnBg) ? 'font-bold bg-[#eef2fa] dark:bg-blue-950 text-black dark:text-gray-100' : (cKey === 'Total' ? 'font-bold' : '')} ${cClass}`}>{displayVal}</td>;
                                                    })}
                                                </tr>
                                            ))}
                                        </React.Fragment>
                                    );
                                }
                                
                                return (
                                    <tr key={i} className={`${trClassBase} ${customClass}`}>
                                        <td data-autofit-col="rowLabels" className={`border border-gray-400 py-1 px-0.5 ${row.level === 0 ? 'text-center' : 'text-left'}`} style={grandTotalCellStyle}>
                                            <span style={{ paddingLeft: row.level === 0 ? 0 : `${Math.max(0, row.level - 1) * 1.5}rem` }}>
                                                {row.level > 0 && !hideRowToggles && (row.hasChildren
                                                    ? <button type="button" onClick={() => toggleCollapse(row.id)} aria-label={collapsedNodes.has(row.id) ? 'Expand row' : 'Collapse row'} className="cursor-pointer select-none hover:text-blue-700 bg-transparent border-0 p-0 m-0 inline align-baseline">{collapsedNodes.has(row.id) ? '▶ ' : '▼ '}</button>
                                                    : '• '
                                                )}
                                                {getRowStatusBadge(customClass)}{row.label}
                                            </span>
                                        </td>
                                        {colKeysWithTotal.map((cKey) => (
                                            dataFields.map((df, colIdx) => {
                                                let val = 0;
                                                const tGrp = row.totals[cKey] || {};
                                                if (df.agg === 'calc' && df.calc) {
                                                    val = df.calc(tGrp, row.context, cKey);
                                                } else {
                                                    const t = tGrp[df.name] || { sum: 0, max: 0, count: 0 };
                                                    if (df.agg === 'sum') val = t.sum;
                                                    if (df.agg === 'max') val = t.max;
                                                    if (df.agg === 'count') val = t.count;
                                                    if (df.agg === 'avg') val = t.count > 0 ? t.sum / t.count : 0;
                                                }

                                                let displayVal = val;
                                                if (df.format === 'number') displayVal = formatNumberWithCommas(val);
                                                else if (df.format === 'percent') displayVal = `${Math.round(df.rawFraction ? getPercentNum(val) : val)}%`;
                                                else if (df.format === 'accounting') displayVal = formatAccountingNumber(val);
                                                else if (df.format === 'accountingSignedRed') displayVal = formatAccountingSigned(val);

                                                const isLeafRow = row.level === rowFields.length;
                                                const rowIsVMS = isLeafRow && String(row.context.vvd || '').trim().toUpperCase() === 'VMS';
                                                let isVmsMasked = false;
                                                if (rowIsVMS && val === 0 && config.vmsZeroMaskFields && config.vmsZeroMaskFields.includes(df.name)) {
                                                    displayVal = '';
                                                    isVmsMasked = true;
                                                }
                                                
                                                if (df.hideOnLevels && df.hideOnLevels.includes(row.level)) {
                                                    displayVal = '';
                                                }

                                                const cClass = `${(!isVmsMasked && df.cellClass) ? df.cellClass(val, tGrp) : ''} ${!isVmsMasked ? negativeValueClass(val, df.format) : ''}`.trim();
                                                const cClassHasOwnBg = cClass.includes('bg-');
                                                return <td key={`${cKey}-${colIdx}`} data-autofit-col={df.name} className={`border border-gray-400 py-1 px-0.5 ${(cKey === 'Total' && !cClassHasOwnBg) ? 'font-bold bg-[#eef2fa] dark:bg-blue-950 text-black dark:text-gray-100' : (cKey === 'Total' ? 'font-bold' : '')} ${cClass}`} style={grandTotalCellStyle}>{displayVal}</td>;
                                            })
                                        ))}
                                    </tr>
                                );
                            })}
                        </tbody>
                    </table>
                </div>
            );
        };

        const CSV_SOURCE_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vQNykGT8bYqwDC4k9loE5L8-j-rs9fyzPetfnrNwYAAZVRTXVLDyxrtCm9eP736OUAYEi6wULzeCaBn/pub?gid=0&single=true&output=csv';
        const POLL_INTERVAL_MS = 5 * 60 * 1000;
        const isCsvSourceConfigured = () => !!CSV_SOURCE_URL && !CSV_SOURCE_URL.includes('REPLACE_WITH');

        const SECTOR_DATA_CSV_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vTHQ6pKVIaNKU3DiTaLFrqKJS-mr0DP12xhXXcsCvPDJiTolxYOA013WwHZAg5mFC4xN9cPwSNr3-O_/pub?gid=0&single=true&output=csv';
        const isSectorCsvSourceConfigured = () => !!SECTOR_DATA_CSV_URL && !SECTOR_DATA_CSV_URL.includes('REPLACE_WITH');

        function FlashReportDashboard() {
            const [remarksHidden, setRemarksHidden] = useState(true);
            const [reeferHidden, setReeferHidden] = useState(true);
            const [bsaHidden, setBsaHidden] = useState(true);
            const [activityHidden, setActivityHidden] = useState(true);
            const [sectorAllocHidden, setSectorAllocHidden] = useState(false);
            const [dgVolumeHidden, setDgVolumeHidden] = useState(true);
            const [opIssuesHidden, setOpIssuesHidden] = useState(false);
            const [apStatusHidden, setApStatusHidden] = useState(true);
            const [rotationHidden, setRotationHidden] = useState(true);
            const [tradeBreakdownHidden, setTradeBreakdownHidden] = useState(true);
            const [vcoHidden, setVcoHidden] = useState(true);
            const [etaHidden, setEtaHidden] = useState(true);
            const [businessRulesOpen, setBusinessRulesOpen] = useState(false);
            const [displaySettingsOpen, setDisplaySettingsOpen] = useState(false);
            // Auto-Refresh (2026-08-31): background polling (POLL_INTERVAL_MS below) always
            // checks the published Sheet for changes, but by default only sets
            // newDataAvailable so the "New data available" banner can offer a manual
            // "Refresh" click -- it deliberately never swaps rawRows out from under someone
            // mid-review. This toggle lets a user opt into skipping that manual step: when
            // on, a detected change is applied immediately (see the effect below that watches
            // newDataAvailable). Persisted like darkMode so the choice survives a reload.
            const [autoRefreshEnabled, setAutoRefreshEnabled] = useState(() => {
                try { return localStorage.getItem('bookingFlashAutoRefresh') === '1'; }
                catch { return false; }
            });
            useEffect(() => {
                try { localStorage.setItem('bookingFlashAutoRefresh', autoRefreshEnabled ? '1' : '0'); }
                catch { }
            }, [autoRefreshEnabled]);
            const [analysisModalOpen, setAnalysisModalOpen] = useState(false);
            const [analysisSelectedWeeks, setAnalysisSelectedWeeks] = useState([]);
            // "All" mode for the Analyze modal's own Sale Week slicer (2026-09-01 redesign) --
            // a third state alongside the default "last 4" and a manual multi-select: distinct
            // from setting analysisSelectedWeeks to every present week because the "All" chip
            // itself needs to read as selected while the individual week chips read as NOT
            // selected (matching the reference slicer's look), and because this needs to survive
            // weeksPresent changing (e.g. a filter elsewhere adds a new week) without having to
            // re-capture every week label into analysisSelectedWeeks.
            const [analysisShowAllWeeks, setAnalysisShowAllWeeks] = useState(false);

            const [polColWidths, setPolColWidths] = useState({});
            const [detailColWidths, setDetailColWidths] = useState({});
            const manualPolColWidthKeysRef = useRef(new Set());
            
            const makeColResizer = (widths, setWidths, manualKeysRef) => (key) => (e) => {
                e.preventDefault();
                e.stopPropagation();
                const thEl = e.currentTarget.closest('th');
                const startWidth = widths[key] || (thEl ? thEl.offsetWidth : 80);
                const startX = e.clientX;
                const onMove = (moveEvent) => {
                    if (manualKeysRef) manualKeysRef.current.add(key);
                    const newWidth = Math.max(40, startWidth + (moveEvent.clientX - startX));
                    setWidths(prev => ({ ...prev, [key]: newWidth }));
                };
                const onUp = () => {
                    window.removeEventListener('mousemove', onMove);
                    window.removeEventListener('mouseup', onUp);
                };
                window.addEventListener('mousemove', onMove);
                window.addEventListener('mouseup', onUp);
            };
            const startPolColResize = makeColResizer(polColWidths, setPolColWidths, manualPolColWidthKeysRef);
            const startDetailColResize = makeColResizer(detailColWidths, setDetailColWidths);
            
            const ColResizeHandle = ({ onMouseDown }) => (
                <span
                    onMouseDown={onMouseDown}
                    data-resize-handle="true"
                    className="absolute top-0 right-0 h-full w-1.5 cursor-col-resize hover:bg-blue-400 active:bg-blue-600 z-10"
                    style={{ userSelect: 'none' }}
                    aria-hidden="true"
                />
            );
            
            const [textSizePx, setTextSizePx] = useState(12);
            const textSizeZoomPct = Math.round((textSizePx / 12) * 10000) / 100;

            useEffect(() => {
                if (!businessRulesOpen) return;
                const handleEscape = (e) => {
                    if (e.key === 'Escape') setBusinessRulesOpen(false);
                };
                document.addEventListener('keydown', handleEscape);
                return () => document.removeEventListener('keydown', handleEscape);
            }, [businessRulesOpen]);

            useEffect(() => {
                if (!displaySettingsOpen) return;
                const handleEscape = (e) => {
                    if (e.key === 'Escape') setDisplaySettingsOpen(false);
                };
                document.addEventListener('keydown', handleEscape);
                return () => document.removeEventListener('keydown', handleEscape);
            }, [displaySettingsOpen]);

            const DETAIL_BASE_COLUMN_COUNT = 18; 
            const detailVisibleColumnCount = DETAIL_BASE_COLUMN_COUNT
                + (bsaHidden ? 0 : 2)            
                + (reeferHidden ? 0 : 5)         
                + (activityHidden ? 0 : 8)       
                + (opIssuesHidden ? 0 : 1)       
                + (sectorAllocHidden ? 0 : 2)    
                + (rotationHidden ? 0 : 2)       
                + (apStatusHidden ? 0 : 1)       
                + (tradeBreakdownHidden ? 0 : 6) 
                + (dgVolumeHidden ? 0 : 1)       
                + (remarksHidden ? 0 : 1);       
            const detailBlankRowColSpan = detailVisibleColumnCount - 3; 
            const detailNoDataColSpan = detailVisibleColumnCount;

            const [zoomLevel, setZoomLevel] = useState(1.0);
            const [darkMode, setDarkMode] = useState(() => {
                try { return localStorage.getItem('bookingFlashDarkMode') === '1'; }
                catch { return false; }
            });
            useEffect(() => {
                try { localStorage.setItem('bookingFlashDarkMode', darkMode ? '1' : '0'); }
                catch { }
            }, [darkMode]);
            
            const [isDragging, setIsDragging] = useState(false);
            const [lastRefresh, setLastRefresh] = useState(null);
            const [rawRows, setRawRows] = useState([]);
            const [activeTab, setActiveTab] = useState('detail');
            const [parseError, setParseError] = useState(null);
            const [newDataAvailable, setNewDataAvailable] = useState(false);
            const [autoFetchError, setAutoFetchError] = useState(null);
            const [isCheckingForUpdates, setIsCheckingForUpdates] = useState(false);
            const pendingCsvTextRef = useRef(null);
            const lastLoadedCsvTextRef = useRef(null);
            const hasLoadedDataRef = useRef(false);
            
            const [sectorSourceRows, setSectorSourceRows] = useState(SECTOR_DATA_SEED);
            const [sectorFetchError, setSectorFetchError] = useState(null);
            
            const fileInputRef = useRef(null);
            const activeTabContentRef = useRef(null);
            const polTableContainerRef = useRef(null);
            const detailTableContainerRef = useRef(null);
            
            const [tableAreaMaxHeight, setTableAreaMaxHeight] = useState(null);
            useEffect(() => {
                const recalc = () => {
                    const el = activeTab === 'pol_booking' ? polTableContainerRef.current
                        : activeTab === 'detail' ? detailTableContainerRef.current
                        : null;
                    if (!el) return;
                    const rect = el.getBoundingClientRect();
                    const visualScale = el.offsetHeight > 0 ? (rect.height / el.offsetHeight) : 1;
                    const availableVisual = window.innerHeight - rect.top - 16;
                    const availableLocal = availableVisual / (visualScale || 1);
                    setTableAreaMaxHeight(prev => {
                        const next = Math.max(300, availableLocal);
                        return prev !== null && Math.abs(prev - next) < 1 ? prev : next;
                    });
                };
                recalc();
                const target = activeTabContentRef.current;
                const observer = new ResizeObserver(recalc);
                if (target) observer.observe(target);
                window.addEventListener('resize', recalc);
                return () => { observer.disconnect(); window.removeEventListener('resize', recalc); };
            }, [activeTab, zoomLevel, textSizePx, rawRows]);

            const [oldRawRows, setOldRawRows] = useState([]);
            const [oldFileName, setOldFileName] = useState(null);
            const [oldParseError, setOldParseError] = useState(null);
            const oldFileInputRef = useRef(null);

            const [selectedSubTrades, setSelectedSubTrades] = useState([]);
            const [selectedAnalysts, setSelectedAnalysts] = useState([]);
            const [selectedCoasts, setSelectedCoasts] = useState([]);
            const [selectedLanes, setSelectedLanes] = useState([]);
            const [selectedSaleWeeks, setSelectedSaleWeeks] = useState([]);
            const [selectedYards, setSelectedYards] = useState([]);
            const [yardSearchText, setYardSearchText] = useState('');
            const [selectedApStatuses, setSelectedApStatuses] = useState([]);

            const [headerFilters, setHeaderFilters] = useState({});

            const handleHeaderFilterChange = (key, value) => {
                setHeaderFilters(prev => ({ ...prev, [key]: value }));
            };

            const renderFilter = (colKey, label) => (
                <input
                    type="text"
                    className="block w-full text-black dark:text-gray-100 font-normal text-[9px] px-1 py-0.5 border border-gray-400 dark:border-gray-600 focus:outline-none focus:border-blue-500 bg-white dark:bg-gray-900 placeholder-gray-400 dark:placeholder-gray-500 shadow-inner rounded-sm"
                    placeholder="Filter..."
                    aria-label={`Filter by ${label}`}
                    value={headerFilters[colKey] || ''}
                    onChange={e => handleHeaderFilterChange(colKey, e.target.value)}
                    onClick={e => e.stopPropagation()}
                />
            );

            const parseWorkbookToRows = (wb) => {
                const wsname = wb.SheetNames[0];
                const ws = wb.Sheets[wsname];

                const rawData = window.XLSX.utils.sheet_to_json(ws, { raw: false, defval: '' });

                if (rawData && rawData.length > 0) {
                    const CRITICAL_COLUMNS = [
                        ['Vessel 1st Trade', 'Trade'],
                        ['Vessel 1st Sub Trade', 'Sub Trade', 'SubTrade', 'Sub_Trade'],
                        ['Vessel 1st VVD', 'VVD', 'Voyage'],
                        ['Route Date 1st Sale Week', 'Sale Week', 'SaleWeek', 'Week'],
                        ['Route Location 1st Yard', '1st Pol', 'POL'],
                        ['Measures Overall Status', 'BKG FLASH STATUS', 'MeasuresOverallStatus'],

                        const cleanAlias = rawAlias.toLowerCase().replace(/[^a-z0-9]/g, '');

                        rowObj.pic = (rowObj.pic && String(rowObj.pic).trim()) || 'TBA';

                        const activeTotalTeuNum = toNum(rowObj.activeTotalTeu);
                        const ladenTeuNum = toNum(rowObj.ladenTeu);
                        rowObj.actVsBkgUtilzRaw = ladenTeuNum > 0 ? (activeTotalTeuNum / ladenTeuNum) : 0;

                        const rfrBsaTeuRfMax = toNum(rowObj.rfrBsaTeuRfMax);
                        rowObj.rfrUtilizRaw = rfrBsaTeuRfMax > 0 ? (toNum(rowObj.rfrBkgTtl) / rfrBsaTeuRfMax) : 0;

                        return rowObj;
                    });

                    return { ok: true, rows: formattedData };

            const processFile = (file) => {
                if (!file) return;

                if (!window.XLSX) {
                    console.error("XLSX library is not loaded.");
                    setParseError("Unable to read the file: the XLSX library failed to load. Please refresh the page and try again.");
                    return;
                }

                const reader = new FileReader();
                reader.onload = (evt) => {
                    try {
                        const bstr = evt.target.result;
                        const wb = window.XLSX.read(bstr, { type: 'binary' });
                        const result = parseWorkbookToRows(wb);
                        if (result.ok) {
                            setRawRows(result.rows);
                            setParseError(null);
                            setAutoFetchError(null);
                            setLastRefresh(new Date());
                            setNewDataAvailable(false);
                            pendingCsvTextRef.current = null;
                            hasLoadedDataRef.current = true;
                        } else {
                            setParseError(result.error);
                        }
                        if (fileInputRef.current) fileInputRef.current.value = '';
                    } catch (error) {
                        console.error("Error parsing the file:", error);
                        setParseError(`Failed to parse the uploaded file: ${error && error.message ? error.message : 'unknown error'}. Please verify the file is a valid Excel export and try again.`);
                        if (fileInputRef.current) fileInputRef.current.value = '';
                    }
                };
                reader.readAsBinaryString(file);
            };

            const handleFileUpload = (e) => {
                processFile(e.target.files[0]);
            };

            const handleDrop = (e) => {
                e.preventDefault();
                setIsDragging(false);
                if (e.dataTransfer.files && e.dataTransfer.files.length > 0) {
                    processFile(e.dataTransfer.files[0]);
                    e.dataTransfer.clearData();
                }
            };

            const processOldFile = (file) => {

                if (!window.XLSX) {
                    setOldParseError("Unable to read the file: the XLSX library failed to load. Please refresh the page and try again.");
                    return;
                }
                const reader = new FileReader();
                reader.onload = (evt) => {
                    try {
                        const wb = window.XLSX.read(evt.target.result, { type: 'binary' });
                        const result = parseWorkbookToRows(wb);
                        if (result.ok) {

                        } else {

                        }
                        if (oldFileInputRef.current) oldFileInputRef.current.value = '';
                    } catch (error) {

                        setOldParseError(`Failed to parse the file: ${error && error.message ? error.message : 'unknown error'}. Please verify it's a valid Booking Flash export.`);

            const fetchCsvText = async () => {
                const res = await fetch(CSV_SOURCE_URL, { cache: 'no-store' });
                if (!res.ok) throw new Error(`Fetch failed with status ${res.status}`);
                return res.text();
            };

            const applyCsvText = (csvText) => {
                const wb = window.XLSX.read(csvText, { type: 'string' });
                const result = parseWorkbookToRows(wb);
                if (result.ok) {
                    setRawRows(result.rows);
                    setParseError(null);
                    setAutoFetchError(null);
                    setLastRefresh(new Date());
                    setNewDataAvailable(false);
                    pendingCsvTextRef.current = null;
                    lastLoadedCsvTextRef.current = csvText;
                    hasLoadedDataRef.current = true;
                }
                return result;
            };

            const fetchAndApplySectorData = async () => {
                if (!isSectorCsvSourceConfigured()) return;
                try {
                    const res = await fetch(SECTOR_DATA_CSV_URL, { cache: 'no-store' });
                    if (!res.ok) throw new Error(`Fetch failed with status ${res.status}`);
                    const csvText = await res.text();
                    const wb = window.XLSX.read(csvText, { type: 'string' });
                    const ws = wb.Sheets[wb.SheetNames[0]];
                    const rows = window.XLSX.utils.sheet_to_json(ws, { raw: false, defval: '' });
                    if (rows && rows.length > 0) {
                        setSectorSourceRows(rows);
                        setSectorFetchError(null);
                    }
                } catch (err) {
                    console.warn('Sector data fetch failed (falling back to built-in seed data):', err.message);
                    setSectorFetchError(err.message);
                }
            };

            useEffect(() => {
                fetchAndApplySectorData();
                if (!isCsvSourceConfigured()) return;
                let cancelled = false;
                (async () => {
                    try {
                        const csvText = await fetchCsvText();
                        if (cancelled) return;
                        const result = applyCsvText(csvText);
                        if (!result.ok) setAutoFetchError(result.error);
                    } catch (err) {
                        if (cancelled) return;
                        console.error('Initial data fetch failed:', err);
                        setAutoFetchError(`Couldn't load data automatically (${err.message}). Upload a file manually below, or click Refresh once the connection is back.`);
                    }
                })();
                return () => { cancelled = true; };
            }, []);

            useEffect(() => {
                if (!isCsvSourceConfigured()) return;
                const checkForUpdates = async () => {
                    setIsCheckingForUpdates(true);
                    try {
                        const csvText = await fetchCsvText();
                        if (!hasLoadedDataRef.current) {
                            applyCsvText(csvText);
                        } else if (csvText !== lastLoadedCsvTextRef.current) {
                            pendingCsvTextRef.current = csvText;
                            setNewDataAvailable(true);
                        }
                    } catch (err) {
                        console.error('Background refresh check failed:', err);
                    } finally {
                        setIsCheckingForUpdates(false);
                    }
                };
                const intervalId = setInterval(checkForUpdates, POLL_INTERVAL_MS);
                return () => clearInterval(intervalId);
            }, []);

                const intervalId = setInterval(fetchAndApplySectorData, POLL_INTERVAL_MS);
                return () => clearInterval(intervalId);

            const applyPendingUpdate = () => {

                    if (headerAndApMatch && matchSubTrade && matchAnalyst && matchLane && matchCoast && matchYard) vSaleWeeks.add(row.saleWeek);

                    if (matchSubTrade && matchAnalyst && matchLane && matchCoast && matchSaleWeek && matchYard && headerAndApMatch) {
                        fRows.push(row);
                    }
                });

                return { 
                    filteredRawRows: fRows, 
                    validSubTrades: vSubTrades, 
                    validCoasts: vCoasts, 
                    validAnalysts: vAnalysts, 
                    validLanes: vLanes, 
                    validSaleWeeks: vSaleWeeks, 
                    validYards: vYards 
                };
            }, [rawRows, selectedSubTrades, selectedAnalysts, selectedLanes, selectedCoasts, selectedSaleWeeks, selectedYards, selectedApStatuses, headerFilters, activeTab]);

            useLayoutEffect(() => {
                if (activeTab !== 'pol_booking') return;
                const container = polTableContainerRef.current;
                if (!container) return;
                const cells = container.querySelectorAll('[data-autofit-col]');
                
                const originalStyles = [];
                cells.forEach(el => {
                    originalStyles.push(el.style.whiteSpace);
