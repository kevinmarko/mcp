                                                    entirely different days, with no live data involved at all. */}
                                                <div className="text-sm">
                                                    {/* 2026-09-04: "vessels" here now shows the same distinct-VVD count as
                                                        the "Vessels" tile below (both fixed together) -- was oldRawRows.
                                                        length/rawRows.length, the raw per-POL-leg row count, which would
                                                        disagree with the tile once that got fixed to count real vessels. */}
                                                    Comparing <span className="font-bold text-blue-700 dark:text-blue-400">{oldFileName}</span> ({compareData ? compareData.oldSnapshot.bookingCount.toLocaleString() : oldRawRows.length.toLocaleString()} vessels)
                                                    {' '}against {viewingHistoricalDate
                                                        ? <>the <span className="font-bold text-indigo-700 dark:text-indigo-400">historical snapshot for {viewingHistoricalDate}</span></>
                                                        : 'the current data'} ({compareData ? compareData.newSnapshot.bookingCount.toLocaleString() : rawRows.length.toLocaleString()} vessels{viewingHistoricalDate ? '' : `, last refreshed ${lastRefresh ? lastRefresh.toLocaleString() : '—'}`}).
                                                </div>
                                                <div className="flex gap-2">
                                                    <button onClick={() => oldFileInputRef.current?.click()} className="text-xs font-bold text-[#E5007D] border border-[#E5007D] rounded px-2 py-1 hover:bg-blue-50 transition-colors cursor-pointer">
                                                        Change File
                                                    </button>
                                                    <button onClick={clearOldFile} className="text-xs font-bold text-gray-500 dark:text-gray-300 border border-gray-400 dark:border-gray-600 rounded px-2 py-1 hover:bg-gray-100 dark:hover:bg-gray-700 transition-colors cursor-pointer">
                                                        Clear
                                                    </button>
                                                </div>
                                            </div>

                                            {compareData && (compareData.oldZeroedBySlicers || compareData.newZeroedBySlicers) && (
                                                <div className="bg-amber-100 dark:bg-amber-950 border-2 border-amber-500 dark:border-amber-700 text-amber-900 dark:text-amber-200 font-semibold px-4 py-2 rounded mb-4 shadow-sm text-sm" role="alert">
                                                    ⚠️ The current slicer selection matches {compareData.oldZeroedBySlicers && compareData.newZeroedBySlicers ? 'no rows in either file' : compareData.oldZeroedBySlicers ? 'no rows in the OLD file' : 'no rows in the CURRENT file'} below, even though that file has data outside this filter -- the numbers below are comparing against zero, not a real absence of data, and any "change" they show is misleading. Adjust or clear the slicers above to fix this.
                                                </div>
                                            )}

                                            {compareData && (
                                                <>
                                                    <div className="grid grid-cols-2 md:grid-cols-4 gap-3 mb-6">
                                                        {[
                                                            { label: 'Vessels', old: compareData.oldSnapshot.bookingCount, cur: compareData.newSnapshot.bookingCount, fmt: (v) => v.toLocaleString() },
                                                            { label: 'Total Max Laden', old: compareData.oldSnapshot.maxLdn, cur: compareData.newSnapshot.maxLdn, fmt: formatNumberWithCommas },
                                                            { label: 'Total Booked TEU', old: compareData.oldSnapshot.laden, cur: compareData.newSnapshot.laden, fmt: formatNumberWithCommas },
                                                            { label: 'Overall Utilization', old: compareData.oldSnapshot.utilz, cur: compareData.newSnapshot.utilz, fmt: (v) => `${v}%` },
                                                        ].map(card => {
                                                            const delta = card.cur - card.old;
                                                            const deltaColor = delta > 0 ? 'text-green-700 dark:text-green-400' : delta < 0 ? 'text-red-700 dark:text-red-400' : 'text-gray-500 dark:text-gray-400';
                                                            const deltaSign = delta > 0 ? '+' : '';
                                                            return (
                                                                <div key={card.label} className="border border-gray-300 dark:border-gray-600 rounded-md p-3 bg-gray-50 dark:bg-gray-800">
                                                                    <div className="text-xs font-bold text-gray-500 dark:text-gray-400 uppercase mb-1">{card.label}</div>
                                                                    <div className="text-sm text-gray-500 dark:text-gray-400">Old: {card.fmt(card.old)}</div>
                                                                    <div className="text-lg font-extrabold text-[#E5007D]">New: {card.fmt(card.cur)}</div>
                                                                    <div className={`text-sm font-bold ${deltaColor}`}>{deltaSign}{card.fmt(delta)}</div>
                                                                </div>
                                                            );
                                                        })}
                                                    </div>

                                                    {/* New/Removed vessel tables removed 2026-09-03 per explicit
                                                        request -- "more of an internal note section, but we will
                                                        store somewhere else." compareData.added/.removed are still
                                                        computed above (cheap, and something else may want them
                                                        later) but nothing renders them anymore. */}

                                                    <h3 className="text-lg font-bold text-amber-700 mb-2">Notable Vessel Changes ({compareData.changed.length})</h3>
                                                    {compareData.changed.length === 0 ? (
                                                        <p className="text-sm text-gray-500">No tracked-field changes on vessels present in both files.</p>
                                                    ) : (
                                                        <div className="overflow-x-auto border border-gray-300 rounded">
                                                            <table className="w-full text-xs text-left border-collapse">
                                                                <thead className="bg-amber-100">
                                                                    <tr>
                                                                        <th className="p-1.5 border border-gray-300">Trade</th>
                                                                        <th className="p-1.5 border border-gray-300">Sub Trade</th>
                                                                        <th className="p-1.5 border border-gray-300">Lane</th>
                                                                        <th className="p-1.5 border border-gray-300">Sale Week</th>
                                                                        <th className="p-1.5 border border-gray-300">VVD</th>
                                                                        <th className="p-1.5 border border-gray-300">POL</th>
                                                                        <th className="p-1.5 border border-gray-300">What Changed</th>
                                                                    </tr>
                                                                </thead>
                                                                <tbody>
                                                                    {compareData.changed.map((row, i) => (
                                                                        <tr key={i} className="odd:bg-white even:bg-amber-50">
                                                                            <td className="p-1.5 border border-gray-300">{row.trade}</td>
                                                                            <td className="p-1.5 border border-gray-300">{row.subTrade}</td>
                                                                            <td className="p-1.5 border border-gray-300">{row.lane}</td>
                                                                            <td className="p-1.5 border border-gray-300">{row.saleWeek}</td>
                                                                            <td className="p-1.5 border border-gray-300">{row.vvd}</td>
                                                                            <td className="p-1.5 border border-gray-300">{row.pol}</td>
                                                                            <td className="p-1.5 border border-gray-300">
                                                                                {row.diffs.map((d, di) => (
                                                                                    <div key={di}>
                                                                                        <span className="font-bold">{d.label}:</span> {d.oldVal} <span className="text-gray-400">{'→'}</span> {' '}
                                                                                        {/* 2026-09-09, per Kevin: color the NEW value green/red for an
                                                                                            increase/decrease -- only for Current Laden and Vessel Utilz
                                                                                            (d.colorable, set above in compareData's diffs.map), everything
                                                                                            else (Max Laden, Peak Utilz, the text fields) stays plain, same
                                                                                            green/red pair as this tab's own KPI delta cards above. */}
                                                                                        <span className={d.colorable ? (d.increased ? 'text-green-700 dark:text-green-400 font-semibold' : 'text-red-700 dark:text-red-400 font-semibold') : ''}>
                                                                                            {d.newVal}
                                                                                        </span>
                                                                                    </div>
                                                                                ))}
                                                                            </td>
                                                                        </tr>
                                                                    ))}
                                                                </tbody>
                                                            </table>
                                                        </div>
                                                    )}
                                                </>
                                            )}
                                        </>
                                    )}
                                </div>
                            )}
                            </div>
                        </>
                    )}

                    {/* Hover tooltip overlay (2026-09-04) -- see hoverTooltip state's own
                        comment above for why this is fixed-positioned via JS rather than a
                        CSS-only hover-reveal nested in the cell (the table's own
                        overflow-auto scroll container would clip it). Position flips to
                        open leftward/upward near the viewport's right/bottom edge so it
                        never renders off-screen regardless of which cell triggered it. */}
                    {hoverTooltip && (() => {
                        const { rect, text } = hoverTooltip;
                        const margin = 8;
                        const maxWidth = Math.min(480, window.innerWidth - margin * 2);
                        const openLeft = window.innerWidth - rect.left < maxWidth + margin;
                        const openUp = window.innerHeight - rect.bottom < 160;
                        const style = {
                            maxWidth: `${maxWidth}px`,
                            maxHeight: '70vh',
                            ...(openLeft
                                ? { right: `${Math.max(margin, window.innerWidth - rect.right)}px` }
                                : { left: `${Math.max(margin, rect.left)}px` }),
                            ...(openUp
                                ? { bottom: `${Math.max(margin, window.innerHeight - rect.top + 6)}px` }
                                : { top: `${rect.bottom + 6}px` }),
                        };
                        return (
                            <div
                                className="fixed z-50 bg-white dark:bg-gray-800 dark:text-gray-100 border-2 border-black dark:border-gray-500 shadow-lg rounded-md p-2 text-xs whitespace-pre-wrap break-words overflow-y-auto pointer-events-none"
                                style={style}
                            >
                                {text}
                            </div>
                        );
                    })()}
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<FlashReportDashboard />);
    </script>
</body>
</html>
