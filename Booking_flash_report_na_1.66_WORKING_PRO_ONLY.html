                    // 2026-09-08: `raw: true` HERE (at the XLSX.read level, not just the
                    // sheet_to_json calls below) -- see applyCsvText's own comment on the
                    // identical fix for the full writeup of why. Net effect on this
                    // function specifically: rawDateOnly's "Record Date" value is now
                    // always the untouched literal string (never auto-promoted to a date
                    // serial by SheetJS's CSV parser), so normalizeRecordDate's numeric
                    // branch above no longer ever fires -- its plain
                    // `String(value || '').trim()` fallback already returns a clean,
                    // correctly-sortable 'YYYY-MM-DD' for this column's actual shape,
                    // so no change was needed there, just left in place as a defensive
                    // fallback for a hypothetical future source that IS date-typed.
                    const wb = window.XLSX.read(csvText, { type: 'string', raw: true });
                    const ws = wb.Sheets[wb.SheetNames[0]];
                    const rawData = window.XLSX.utils.sheet_to_json(ws, { raw: false, defval: '' });
                    // "Record Date" is the one column in this archive that ISN'T part of
                    // the normal 97-column Data_download schema -- it's how a single
                    // published Sheet holds many days' worth of rows at all. getVal()
                    // inside parseWorkbookToRows only ever pulls fields it's told to look
                    // for by name, so this extra column is simply never referenced once a
                    // date's rows are handed to it below -- confirmed safe, not a landmine
                    // risk the way an aliased column would be (see DATA_ARCHITECTURE.md's
                    // Class E). rawDateOnly is the raw:true parallel pass normalizeRecordDate
                    // above needs -- same row order as rawData, so they're zipped by index.
                    const rawDateOnly = window.XLSX.utils.sheet_to_json(ws, { raw: true, defval: '' });
                    const grouped = {};
                    rawData.forEach((row, i) => {
                        const rawValue = rawDateOnly[i] ? rawDateOnly[i]['Record Date'] : row['Record Date'];
                        const d = normalizeRecordDate(rawValue);
                        if (!d) return;
                        if (!grouped[d]) grouped[d] = [];
                        grouped[d].push(row);
                    });
                    // Back off if a newer fetch has started since -- e.g. the popover
                    // was closed and reopened (or "Refresh Historical List" clicked
                    // again) before this one landed. Whichever fetch was started LAST
                    // should win, not whichever happens to resolve last by accident.
                    if (mySeq !== historicalApplySeqRef.current) return;
                    setHistoricalRowsByDate(grouped);
                    setHistoricalDates(Object.keys(grouped).sort().reverse()); // newest first
                    setHistoricalFetchError(null);
                    historicalParsedCacheRef.current = {}; // stale now -- a refresh may have changed a date's rows
                } catch (err) {
                    if (mySeq !== historicalApplySeqRef.current) return;
                    console.error('Historical data fetch failed:', err);
                    setHistoricalFetchError(err.message);
                }
            };

            useEffect(() => {
                fetchHistoricalData();
                // eslint-disable-next-line react-hooks/exhaustive-deps
            }, []);

            // 2026-09-08, per Kevin: opened the Historical Data popover wanting to compare
            // "yesterday to today" and today wasn't offered as a date -- confirmed live
            // that today's row DOES exist in HISTORICAL_DATA_CSV_URL's archive (Hoa's daily
            // append had already run), so this wasn't a missing-data problem. Root cause:
            // fetchHistoricalData only ever ran once, on page mount, above -- if the page
            // had been open since before that day's append ran (or was just open a while),
            // the date list goes stale and nothing re-fetches it except the manual
            // "Refresh Historical List" button, easy to not think to click. Both "View a
            // Date" and "Compare Two Dates" already read from the exact same
            // `historicalDates` array (see their shared render block further down), so
            // this wasn't a Compare-specific gap either -- View a Date would have shown
            // the same stale list, it just wasn't the mode being tested that day. Re-fetch
            // every time the popover is opened (not just on mount) so the common case --
            // open the popover, want today -- works without an extra manual click; cheap
            // (one CSV fetch), and the button stays for a mid-session refresh while the
            // popover is already open.
            useEffect(() => {
                if (historicalDataOpen) fetchHistoricalData();
                // eslint-disable-next-line react-hooks/exhaustive-deps
            }, [historicalDataOpen]);

            // Parses one historical date's row slice through the SAME parseWorkbookToRows
            // every other loading path uses -- built from that date's raw rows via
            // SheetJS's json_to_sheet/book_new, the same round trip a real single-day
            // CSV upload would go through -- so every getVal() alias/computed field this
            // app already gets right (Broken Routes aggregation, RFR Utiliz % recompute,
            // POL column, etc.) applies identically here, never a second parallel
            // implementation that could quietly drift from the real one. Cached per date
            // in historicalParsedCacheRef so flipping back and forth between the same
            // date(s) doesn't reparse ~1,000 rows on every click.
            const getParsedHistoricalRows = (date) => {
                if (historicalParsedCacheRef.current[date]) return historicalParsedCacheRef.current[date];
                const rowsForDate = historicalRowsByDate[date];
                if (!rowsForDate || rowsForDate.length === 0) {
                    return { ok: false, error: `No historical rows found for ${date}.` };
                }
                const ws = window.XLSX.utils.json_to_sheet(rowsForDate);
                const wb = window.XLSX.utils.book_new();
                window.XLSX.utils.book_append_sheet(wb, ws, 'Sheet1');
                const result = parseWorkbookToRows(wb);
                if (result.ok) historicalParsedCacheRef.current[date] = result;
                return result;
            };

            // "View this date" -- swaps rawRows to one historical day's parsed snapshot
            // so all 4 visible tabs render exactly as if that day's export had been
            // uploaded. Deliberately does NOT touch liveRawRowsRef (see its own comment
            // above) -- only processFile/applyCsvText ever do, so it always holds the
            // true live/manual dataset no matter how many historical dates get viewed.
            const viewHistoricalDate = (date) => {
                const result = getParsedHistoricalRows(date);
                if (result.ok) {
                    setRawRows(result.rows);
                    setViewingHistoricalDate(date);
                    setHistoricalFetchError(null);
                } else {
                    setHistoricalFetchError(result.error);
                }
            };

            // "Back to Live" -- restores whatever the live/manual dataset actually was
            // before any historical date was viewed.
            const backToLiveData = () => {
                setRawRows(liveRawRowsRef.current);
                setViewingHistoricalDate(null);
            };

            // "Compare These Two Dates" -- feeds two historical snapshots into the
            // EXISTING Compare tab/oldRawRows mechanism (see compareData above) instead
            // of building a second, parallel diff view: Snapshot A becomes oldRawRows
            // (the "old" side of that existing diff), Snapshot B becomes rawRows (the
            // "current" side), then jumps straight to the Compare tab. oldFileName is
            // repurposed to say which historical date is standing in for the "old
            // file" -- the Compare tab's render (unchanged) already displays whatever's
            // in oldFileName, so no new UI is needed there. The manual "old file"
            // upload/Change File/Clear affordances keep working exactly as before
            // afterward -- this only seeds the two states once, it doesn't replace
            // their normal lifecycle.
            const compareHistoricalDates = (dateA, dateB) => {
                const resultA = getParsedHistoricalRows(dateA);
                if (!resultA.ok) { setHistoricalFetchError(resultA.error); return; }
                const resultB = getParsedHistoricalRows(dateB);
                if (!resultB.ok) { setHistoricalFetchError(resultB.error); return; }
                setOldRawRows(resultA.rows);
                setOldFileName(`Historical snapshot: ${dateA}`);
                setOldParseError(null);
                setRawRows(resultB.rows);
                setViewingHistoricalDate(dateB);
                setHistoricalFetchError(null);
                setActiveTab('compare');
                setHistoricalDataOpen(false);
            };

            const fetchCsvText = async () => {
                const res = await fetch(CSV_SOURCE_URL, { cache: 'no-store' });
                if (!res.ok) throw new Error(`Fetch failed with status ${res.status}`);
                const text = await res.text();
                // See lastChecked's own comment near its useState -- every successful fetch
                // counts as "checked," independent of whether applyCsvText below ends up
                // finding a real change worth applying.
                setLastChecked(new Date());
                return text;
            };

            const applyCsvText = (csvText) => {
                // 2026-09-08, per Kevin: "1st POL Cutoff"/"ETD Last Port" (and any other
                // ISO-shaped date column pulled from the live CSV) were rendering exactly
                // one day EARLIER than the real date, on every lane, every row -- reproduced
                // and root-caused: SheetJS's default CSV parser auto-detects an ISO-shaped
                // cell (e.g. "2026-08-16") as a date, converts it via an internal Date
                // object anchored to UTC midnight, then formats that Date's LOCAL calendar
                // day for its `w` (displayed text) property. In any timezone behind UTC --
                // every North American one included -- that local day is the PREVIOUS day,
                // so this app's `getVal()` receives an already-wrong "8/15/26" for a real
                // "2026-08-16" cell before formatDate/parseKnownDate (which are themselves
                // timezone-safe -- pure regex/arithmetic, no Date object) ever see it.
                // Confirmed empirically: reproduced the exact off-by-one under
                // America/New_York and America/Los_Angeles (0 under UTC, which is why this
                // was never caught testing in a UTC sandbox), and confirmed it's isolated to
                // ISO-shaped cells specifically -- plain numbers, comma-formatted numbers,
                // percentages, blanks, and the year-less "Mon D" date shape all came through
                // byte-for-byte identical either way.
                //   Fix: pass `raw: true` to XLSX.read ITSELF (not just sheet_to_json) --
                // this makes SheetJS's CSV parser keep every cell as its literal original
                // text, never auto-promoting an ISO-shaped one to a date type at all, so the
                // buggy Date-object round-trip simply never happens. This app's own
                // getVal()/formatDate()/parseKnownDate() already parse a raw ISO string
                // correctly (that's the FIRST branch parseKnownDate tries), so nothing else
                // needed to change -- this was purely a SheetJS-internal conversion this app
                // never asked for and had no way to see happening.
                const wb = window.XLSX.read(csvText, { type: 'string', raw: true });
                const result = parseWorkbookToRows(wb);
                if (result.ok) {
                    // Schedule-change warning (2026-09-08, see diffScheduleChange/
                    // SCHEDULE_CHANGE_THRESHOLDS above): diff the OLD live dataset
                    // against the NEW one about to replace it, BEFORE either
                    // liveRawRowsRef.current or rawRows gets overwritten below --
                    // liveRawRowsRef.current is always the true "current live dataset"
                    // regardless of what's currently on screen (rawRows may be showing
                    // a historical snapshot instead, if viewingHistoricalDate is set).
                    // Skipped entirely on the very first-ever load (nothing to compare
                    // against yet) -- guarded on liveRawRowsRef.current having anything
                    // in it at all.
                    if (liveRawRowsRef.current.length > 0) {
                        const scheduleDiff = diffScheduleChange(liveRawRowsRef.current, result.rows);
                        setScheduleChangeWarning(scheduleDiff.isSignificant ? scheduleDiff : null);
                    }
                    setRawRows(result.rows);
                    setParseError(null);
                    setAutoFetchError(null);
                    setLastRefresh(new Date());
                    setNewDataAvailable(false);
                    pendingCsvTextRef.current = null;
                    lastLoadedCsvTextRef.current = csvText;
                    hasLoadedDataRef.current = true;
                    // Same reasoning as processFile above: this IS the live dataset now,
                    // so re-sync liveRawRowsRef and exit historical-viewing mode if it
                    // was active.
                    liveRawRowsRef.current = result.rows;
                    setViewingHistoricalDate(null);
                }
                return result;
            };

            const fetchAndApplySectorData = async () => {
                if (!isSectorCsvSourceConfigured()) return;
                // 2026-09-1x (W11 sequence-guard follow-up): this function is called
                // from three independent, genuinely concurrent-capable sites -- the
                // initial-mount effect, its own POLL_INTERVAL_MS interval, and
                // handleManualRefresh's fire-and-forget call -- with no ordering
                // between them before this fix, the same shape as the CSV-pipeline
                // race those three fixes above addressed (flagged in the original W11
                // audit as suspected-but-not-yet-reproduced with a concrete
                // stale-overwrite, for lack of a cheap ordering-sensitive field to
                // observe). Uses its OWN independent counter (sectorApplySeqRef), not
                // csvApplySeqRef -- this commits to setSectorSourceRows, a completely
                // separate state slot from rawRows, so mixing the two counters would
                // incorrectly invalidate an in-flight CSV-pipeline ticket on an
                // unrelated sector fetch, and vice versa. See csvApplySeqRef's own big
                // comment (near pendingCsvTextRef) for the shared design.
                const mySeq = ++sectorApplySeqRef.current;
                try {
                    const res = await fetch(SECTOR_DATA_CSV_URL, { cache: 'no-store' });
                    if (!res.ok) throw new Error(`Fetch failed with status ${res.status}`);
                    const csvText = await res.text();
                    // 2026-09-08: raw:true here too, for consistency with applyCsvText's
                    // identical fix -- see its own comment for the full writeup. This
                    // source has no date columns today, so it's a no-op currently, just
                    // future-proofing against the same bug if one is ever added here.
                    const wb = window.XLSX.read(csvText, { type: 'string', raw: true });
                    const ws = wb.Sheets[wb.SheetNames[0]];
                    const rows = window.XLSX.utils.sheet_to_json(ws, { raw: false, defval: '' });
                    // Back off if a newer attempt has started since -- whether or not
                    // it has finished yet, this result is no longer the freshest thing
                    // in flight and must not commit over (or set an error alongside)
                    // whatever that newer attempt does.
                    if (mySeq !== sectorApplySeqRef.current) return;
                    if (rows && rows.length > 0) {
                        setSectorSourceRows(rows);
                        setSectorFetchError(null);
                    }
                } catch (err) {
                    if (mySeq !== sectorApplySeqRef.current) return;
                    console.warn('Sector data fetch failed (falling back to built-in seed data):', err.message);
                    setSectorFetchError(err.message);
                }
            };

            useEffect(() => {
                fetchAndApplySectorData();
                if (!isCsvSourceConfigured()) return;
                let cancelled = false;
                // Claim this attempt's ticket as early as possible -- right at the
                // start of the effect, before the fetch itself -- so any OTHER
                // CSV-pipeline attempt that starts later (a poll tick, a manual
                // refresh, or a manual file upload bumping the counter directly)
                // is correctly recognized as "newer" the moment it claims its own
                // ticket, regardless of which one's own fetch happens to resolve
                // first. See csvApplySeqRef's own big comment (near
                // pendingCsvTextRef) for the full design.
                const mySeq = ++csvApplySeqRef.current;
                (async () => {
                    try {
                        const csvText = await fetchCsvText();
                        if (cancelled) return;
                        // 2026-09-10 (W11 data-ingestion audit): a slow/stalled
                        // connection on the very first load can cause THIS fetch to
                        // resolve well after the 10-minute background poll's own
                        // first tick already completed the bootstrap load instead --
                        // checkForUpdates below has its own `if
                        // (!hasLoadedDataRef.current) applyCsvText(csvText)` branch
                        // for exactly that "poll wins the race to load first"
                        // scenario, but until this fix, THIS side of the same race had
                        // no equivalent check: it always called applyCsvText
                        // unconditionally once its own fetch resolved, no matter how
                        // late. Confirmed live (Playwright: this fetch mocked to
                        // resolve slower than the poll's first tick, both serving
                        // different content) that the late-resolving initial fetch
                        // silently overwrote the ALREADY-DISPLAYED, ALREADY-NEWER data
                        // the poll had just applied -- with setLastRefresh(new Date())
                        // inside applyCsvText even stamping "Last Refresh" to "just
                        // now" despite the content going backward in time. The stale
                        // data then sat on screen, with zero on-screen indication
                        // anything was wrong, until the NEXT poll tick happened to
                        // notice its own fetch differed from what got clobbered in --
                        // up to a full POLL_INTERVAL_MS (10 minutes in production) of
                        // silently-wrong data. Fix: reuse hasLoadedDataRef the exact
                        // same way checkForUpdates already does -- if a load already
                        // completed from ANY path by the time this one resolves, this
                        // slower/older result has nothing to contribute, so back off
                        // instead of clobbering something newer. Kept alongside (not
                        // replaced by) the seq check below -- see the big comment on
                        // csvApplySeqRef for why a manual file upload specifically
                        // needs THIS check too, not just the seq one.
                        if (hasLoadedDataRef.current) return;
                        // 2026-09-1x (W11 sequence-guard follow-up): general ordering
                        // check -- if anything else (a poll tick, a manual refresh, or
                        // a manual upload) has claimed a ticket since this one was
                        // issued above, this fetch's result is stale by definition
                        // even though hasLoadedDataRef might still read false in some
                        // theoretical interleaving (e.g. a newer attempt claimed its
                        // ticket but hasn't itself committed yet) -- back off rather
                        // than risk a redundant/out-of-order commit.
                        if (mySeq !== csvApplySeqRef.current) return;
                        const result = applyCsvText(csvText);
                        if (!result.ok) setAutoFetchError(result.error);
                    } catch (err) {
                        if (cancelled) return;
                        console.error('Initial data fetch failed:', err);
                        setAutoFetchError(`Couldn't load data automatically (${err.message}). Upload a file manually below, or click Refresh once the connection is back.`);
                    }
                })();
                return () => { cancelled = true; };
            }, []);

            useEffect(() => {
                if (!isCsvSourceConfigured()) return;
                const checkForUpdates = async () => {
                    setIsCheckingForUpdates(true);
                    // See csvApplySeqRef's own big comment (near pendingCsvTextRef)
                    // for the full design -- claimed up front, before the fetch,
                    // same reasoning as the initial-mount effect above.
                    const mySeq = ++csvApplySeqRef.current;
                    try {
                        const csvText = await fetchCsvText();
                        // 2026-09-1x (W11 sequence-guard follow-up): if something
                        // newer has claimed a ticket since this poll tick started
                        // (another poll tick can't -- this effect's own interval is
                        // the only thing that calls checkForUpdates, and it can't
                        // overlap itself faster than POLL_INTERVAL_MS -- but a manual
                        // refresh, a manual upload, or applyPendingUpdate firing off
                        // an earlier pending payload all can), this poll's own result
                        // is stale relative to whatever already committed. Don't
                        // apply it directly, and don't stage it as "pending" either --
                        // staging a payload we already know is older than what's on
                        // screen would just show a misleading "New data available"
                        // banner for data that isn't actually new.
                        if (mySeq !== csvApplySeqRef.current) return;
                        if (!hasLoadedDataRef.current) {
                            applyCsvText(csvText);
                        } else if (csvText !== lastLoadedCsvTextRef.current) {
                            pendingCsvTextRef.current = csvText;
                            // Remember which ticket this staged payload belongs to --
                            // applyPendingUpdate re-checks this before ever committing
                            // it, since the payload can sit staged for minutes and an
                            // even-newer commit could land in the meantime (see
                            // applyPendingUpdate's own comment).
                            pendingCsvTextSeqRef.current = mySeq;
                            setNewDataAvailable(true);
                        }
                    } catch (err) {
                        // 2026-09-03: this poll runs every POLL_INTERVAL_MS silently in the
                        // background -- previously only console.error'd on failure, so a
                        // connection drop mid-session (now more likely to matter with
                        // Auto-Refresh on by default) gave no visible sign at all. Reuses
                        // the same autoFetchError banner the initial load/manual refresh
                        // already show; cleared automatically by applyCsvText's own
                        // success path on the next good poll, so it self-resolves once the
                        // connection is back -- no separate "reconnected" state needed.
                        console.error('Background refresh check failed:', err);
                        setAutoFetchError(`Lost connection to the Sheet (${err.message}). Still showing the last data successfully loaded -- will keep checking automatically every ${Math.round(POLL_INTERVAL_MS / 60000)} min.`);
                    } finally {
                        setIsCheckingForUpdates(false);
                    }
                };
                // scheduleAlignedInterval, not setInterval -- see its own big
                // comment near POLL_INTERVAL_MS for why (wall-clock-aligned polling
                // so every user's tab checks at the same real-world moments,
                // instead of drifting apart based on when each tab happened to load).
                return scheduleAlignedInterval(checkForUpdates, POLL_INTERVAL_MS);
            }, []);

            useEffect(() => {
                if (!isSectorCsvSourceConfigured()) return;
                // Same fix, same reasoning as checkForUpdates's own poll just above --
                // this is the Sector Summary tab's right-hand pivot's data source, and
                // was exactly as susceptible to the same per-tab-load-time drift.
                return scheduleAlignedInterval(fetchAndApplySectorData, POLL_INTERVAL_MS);
            }, []);

            // window.__EXEC_URL__ / isFramedForAppUpdate -- deploy-path detection shared
            // by the poll effect below and the banner's render block (near
            // appUpdateAvailable's other comment).
            //
            // window.__EXEC_URL__ is injected by apps-script/Code.gs (see its own big
            // comment) ONLY when this file is served through the Apps Script Web App
            // path AND that deployment has been updated to include the injection. It
            // holds the real, stable "/exec" URL the user actually opened -- something
            // this script cannot otherwise discover, because on that deploy path
            // window.location here is a transient *.googleusercontent.com sandbox URL,
            // not the real page (Kevin's 2026-09-10 report, both symptoms: the phantom
            // "new version" nag came from diffing that unstable URL's content, and the
            // blank-page-on-refresh hang came from navigating it). It's undefined on
            // every other deploy path (local dev, plain static hosting) and on an
            // Apps Script deployment that hasn't picked up the Code.gs update yet.
            //
            // isFramedForAppUpdate catches "running inside some iframe" generically
            // (true for the Apps Script sandbox, but this also protects against any
            // other unknown embed) -- computed once since neither framing nor the
            // injected global can change over the life of a loaded page. The
            // window.top read is wrapped in try/catch: reading it can throw
            // cross-origin in a heavily sandboxed context, and "throws" is exactly the
            // signal that we're framed and cannot trust our own URL, so it's treated
            // the same as "yes, framed."
            const execUrlForAppUpdate = (typeof window.__EXEC_URL__ === 'string' && window.__EXEC_URL__) || null;
            const isFramedForAppUpdate = (() => {
                try { return window.top !== window.self; } catch (e) { return true; }
            })();

            // App-update poll (see appUpdateAvailable's own comment above). Runs
            // unconditionally -- unlike the CSV/sector polls this doesn't depend on any
            // isXCsvSourceConfigured() gate, since it only needs a check endpoint to be
            // reachable, true regardless of whether a live data source is set up.
            // Uses its own APP_UPDATE_POLL_INTERVAL_MS rather than POLL_INTERVAL_MS --
            // see that constant's own comment for why the two are kept independent.
            //
            // Three deploy-path branches (see execUrlForAppUpdate/isFramedForAppUpdate
            // above), all funneling into the same baseline-ref/threshold bookkeeping:
            //   A. execUrlForAppUpdate present (Apps Script, redeployed Code.gs) --
            //      poll `${execUrl}?check=version`, a tiny server-computed content hash
            //      of index.html's real bytes. Cheapest and most reliable: it never
            //      touches the sandbox's own unstable URL at all.
            //   B. isFramedForAppUpdate true but no execUrl (an OLD Apps Script
            //      deployment that hasn't picked up the Code.gs fix yet, or some other
            //      unknown iframe embed) -- there is no reliable signal available, so
            //      this warns once and does nothing further, rather than repeating the
            //      original bug of fetching/diffing our own (sandboxed/unrepresentative)
            //      URL.
            //   C. Not framed (local dev server, plain static hosting) -- our own
            //      window.location genuinely is the real page, so fetch it and diff, but
            //      only the app's own `<script type="text/babel">` payload rather than
            //      the full response, so per-request scaffolding an unknown host might
            //      inject (an analytics tag, a proxy-stamped timestamp) doesn't register
            //      as a false "update." Hashed rather than kept as a ~500KB string (also
            //      sidesteps crypto.subtle's secure-context requirement, so this still
            //      works on a plain-http internal host, not just https/localhost).
            //
            // Self-disabling instability guard (all branches): this is the single most
            // important defense here, because it makes the feature fail safe on ANY
            // deploy path we haven't specifically diagnosed, not just the confirmed
            // Apps Script one. If the signal changes (or fails) on
            // UNSTABLE_THRESHOLD-many CONSECUTIVE polls, that's far more consistent with
            // an untrustworthy source (per-request variance, a persistent CORS/network
            // block) than with real deploys landing minutes apart, so the check disables
            // itself for the rest of this page's lifetime, logs why via console.warn,
            // and clears any currently-shown banner. A false "new version" nag every
            // few minutes forever is worse than no banner at all; this bounds the worst
            // case to at most one shown-then-retracted banner, and only for this one
            // open tab -- a fresh page load starts the whole thing over with a clean
            // baseline, so a real deploy that happens to look unstable isn't lost
            // forever, just for the current session.
            //
            // appHtmlBaselineRef always holds "the newest fingerprint we've actually
            // observed," not just whatever loaded at mount: the first successful check
            // seeds it, and every later check that finds a DIFFERENT fingerprint both
            // flags appUpdateAvailable (unless that trips the instability guard above)
            // and re-seeds the baseline to the new one. That re-seed is what makes
            // dismissing the banner (below) safe -- once dismissed, the next poll only
            // re-fires if the fingerprint changes AGAIN since the version that was just
            // dismissed, not because it's still comparing against the original version
            // from mount.
            useEffect(() => {
                let cancelled = false;
                let unstableDisabled = false;
                let consecutiveChanges = 0;  // back-to-back polls where the signal differed from the one right before it
                let consecutiveFailures = 0; // back-to-back fetch/parse failures (e.g. a persistent CORS block)
                const UNSTABLE_THRESHOLD = 2;
                const MAX_CONSECUTIVE_FAILURES = 5;

                const disable = (reason) => {
                    unstableDisabled = true;
                    setAppUpdateAvailable(false); // don't leave a stale/spurious banner up once the signal can't be trusted
                    console.warn('[app-update-check] disabling for this session: ' + reason);
                };

                const recordFingerprint = (fp, unstableReasonPrefix) => {
                    consecutiveFailures = 0;
                    if (appHtmlBaselineRef.current === null) {
                        appHtmlBaselineRef.current = fp;
                        return;
                    }
                    if (fp !== appHtmlBaselineRef.current) {
                        consecutiveChanges++;
                        appHtmlBaselineRef.current = fp;
                        if (consecutiveChanges >= UNSTABLE_THRESHOLD) {
                            disable(unstableReasonPrefix + ' changed on ' + consecutiveChanges +
                                ' consecutive polls -- treating as an unreliable signal (e.g. per-request ' +
                                'variance from a sandboxed host) rather than a real deploy.');
                            return;
                        }
                        setAppUpdateAvailable(true);
                    } else {
                        consecutiveChanges = 0; // a stable poll -- only BACK-TO-BACK changes count as instability
                    }
                };

                const recordFailure = (context, err) => {
                    consecutiveFailures++;
                    console.warn('App-update check (' + context + ') failed:', err && err.message ? err.message : err);
                    if (consecutiveFailures >= MAX_CONSECUTIVE_FAILURES) {
                        disable('the ' + context + ' check failed ' + consecutiveFailures +
                            ' times in a row -- giving up rather than retrying forever.');
                    }
                };

                // Path A -- Apps Script Web App, redeployed with the version-check branch.
                const checkViaVersionEndpoint = async () => {
                    try {
                        const sep = execUrlForAppUpdate.indexOf('?') === -1 ? '?' : '&';
                        const res = await fetch(execUrlForAppUpdate + sep + 'check=version', { cache: 'no-store' });
                        if (cancelled) return;
                        if (!res.ok) throw new Error('HTTP ' + res.status);
                        const text = (await res.text()).trim();
                        if (cancelled) return;
                        // A real response from the version-check branch is a short MD5
                        // hex digest. Anything else -- a full HTML page (an OLD Code.gs
                        // deployment that doesn't have this branch yet and just serves
                        // the whole app for any query string), a login/interstitial
                        // page, an error page -- fails this shape check. Disabling here
                        // (rather than either treating it as "changed," which would nag,
                        // or falling back to diffing the wrong URL, which is the
                        // original bug) is what makes an un-redeployed Code.gs fail safe.
                        if (!/^[0-9a-f]{32}$/i.test(text)) {
                            // Two very different situations produce a non-hash response here, and
                            // they need opposite handling:
                            //
                            //  * A LONG body means the endpoint served something substantial that
                            //    isn't a hash -- almost always an OLD Code.gs deployment without the
                            //    ?check=version branch, which ignores the unrecognized query string
                            //    and returns the whole ~500KB app (a login/interstitial page lands
                            //    here too). That's a permanent condition for this session: retrying
                            //    cannot fix it, so disable and point at the redeploy instructions.
                            //
                            //  * A SHORT/EMPTY body is a transient blip -- a truncated or dropped
                            //    response from a proxy or flaky network. Observed live against the
                            //    real deployment on 2026-09-10: roughly 1 poll in 15 came back
                            //    HTTP 200 with 0 bytes while every other poll returned the identical
                            //    correct hash. Treating that as "old deployment" and disabling
                            //    permanently would silently kill update checking for the rest of the
                            //    session on a single hiccup -- exactly the "banner never fires again
                            //    and nobody notices" failure the instability guard is supposed to
                            //    avoid, just arrived at from the other direction. So route it through
                            //    recordFailure(), which retries and only gives up after
                            //    MAX_CONSECUTIVE_FAILURES back-to-back.
                            //
                            // 64 is a deliberately generous cutoff: comfortably above any hash shape
                            // we'd accept (32 hex chars) yet far below any real HTML page.
                            if (text.length <= 64) {
                                recordFailure('version endpoint returned a short/empty body (' +
                                    text.length + ' chars) instead of a version hash -- treating as a ' +
                                    'transient network blip and retrying', new Error('short response'));
                                return;
                            }
                            disable('the ?check=version endpoint did not return a version hash (got ' +
                                text.length + ' chars back) -- this Apps Script deployment\'s Code.gs ' +
                                'likely predates this fix; see apps-script/README.md to redeploy it.');
                            return;
                        }
                        recordFingerprint(text, 'the version hash');
                    } catch (err) {
                        recordFailure('version endpoint, possibly blocked cross-origin from inside the Apps Script sandbox', err);
                    }
                };

                // Path B -- framed with no execUrl: no trustworthy signal is available.
                const warnFramedNoSignal = () => {
                    console.warn('[app-update-check] running inside an iframe with no window.__EXEC_URL__ ' +
                        '(if this is the Apps Script Web App deploy, redeploy apps-script/Code.gs per its ' +
                        'README to enable update checking) -- skipping rather than checking this page\'s ' +
                        'own likely-sandboxed, non-representative URL.');
                    unstableDisabled = true; // one warning is enough; don't repeat every interval
                };

                // Path C -- not framed: our own URL is the real page.
                const extractPayload = (html) => {
                    const m = /<script type="text\/babel">([\s\S]*?)<\/script>/.exec(html);
                    return m ? m[1] : null;
                };
                const hashPayload = (str) => { // FNV-1a, 32-bit -- fast, no crypto.subtle secure-context requirement
                    let h = 0x811c9dc5;
                    for (let i = 0; i < str.length; i++) {
                        h ^= str.charCodeAt(i);
                        h = Math.imul(h, 0x01000193);
                    }
                    return (h >>> 0).toString(16);
                };
                const checkViaOwnUrl = async () => {
                    try {
                        const res = await fetch(window.location.href, { cache: 'no-store' });
                        if (!res.ok || cancelled) return;
                        const html = await res.text();
                        if (cancelled) return;
                        const payload = extractPayload(html);
                        if (payload === null) {
                            recordFailure('own-URL fetch (no app payload found in the response, e.g. a login/interstitial page)',
                                new Error('payload not found'));
                            return;
                        }
                        recordFingerprint(hashPayload(payload), 'the page payload');
                    } catch (err) {
                        recordFailure('own-URL fetch', err);
                    }
                };

                const checkForAppUpdate = () => {
                    if (unstableDisabled) return;
                    if (execUrlForAppUpdate) return checkViaVersionEndpoint();
                    if (isFramedForAppUpdate) return warnFramedNoSignal();
                    return checkViaOwnUrl();
                };

                checkForAppUpdate();
                // scheduleAlignedInterval, not setInterval -- see its own big comment
                // near POLL_INTERVAL_MS for why. `cancelStopped` is this helper's OWN
                // cancel function (unrelated to the `cancelled` flag above, which
                // checkViaOwnUrl/checkViaVersionEndpoint already check themselves) --
                // both need to fire on unmount, so the cleanup below calls both.
                const cancelStopped = scheduleAlignedInterval(checkForAppUpdate, APP_UPDATE_POLL_INTERVAL_MS);
                return () => { cancelled = true; cancelStopped(); };
            }, []);

            // Refresh button target for the NOT-framed case only (see the banner's
            // render block for the Apps Script / framed cases, which use a real
            // `<a target="_top">` link or a "refresh manually" message instead -- never
            // this function; see forceAppReload's own history below for why).
            //
            // This used to append a cache-busting `?_refresh=<timestamp>` query param
            // before navigating, reasoning that a plain reload() could be served from
            // an intermediate cache "on some hosts (e.g. the Apps Script Web App route
            // in apps-script/)." That reasoning was backwards for its own stated
            // example: on the Apps Script path this function's old body navigated
            // window.location -- the sandboxed iframe's own transient URL, not the real
            // page -- to that URL plus an unrecognized query param, which is exactly
            // symptom 1 of Kevin's 2026-09-10 report (the button blanked the page and
            // hung). That path now uses the real `<a target="_top">` link above instead
            // and never calls this function at all. For the genuinely-not-framed case
            // this function actually runs in, there's no known caching problem to work
            // around, so it takes the simpler, lower-risk option the investigation
            // recommended: a plain reload. Appending an unrecognized query param has
            // its own failure mode on a host we don't control (a 404, a redirect loop,
            // or the param just being stripped) for no proven benefit here.
            const forceAppReload = () => {
                window.location.reload();
            };

            // Dismissing does NOT mean "stop checking" -- it only clears the current
            // notice. Since the poll effect above already re-seeds appHtmlBaselineRef to
            // whatever fingerprint it just flagged, the banner only comes back if the
            // signal changes AGAIN after this one, not immediately on the next poll --
            // see that effect's own comment. This holds regardless of which of the three
            // check paths is active, and the instability guard's own disable() call
            // clears the banner the same way, so a dismiss is never "undone" by later
            // instability handling finding something to (briefly) flag first.
            const dismissAppUpdateBanner = () => setAppUpdateAvailable(false);

            // 2026-09-10 (W11 data-ingestion audit): this used to call applyCsvText()
            // with NO try/catch and no result.ok check at all -- the only one of
            // applyCsvText's three callers that didn't. applyCsvText's own
            // XLSX.read()/parseWorkbookToRows() calls are deliberately NOT
            // self-wrapped (so each caller can decide how to surface a failure), and
            // handleManualRefresh / the initial-mount effect both DO wrap their own
            // call in try/catch -- this one didn't, and it's reached by the ONE path
            // that needs it most: the fully-automatic auto-apply effect right below,
            // which runs with ZERO user action whenever Auto-Refresh is on (the
            // default) and a poll found the CSV text had changed at all, even to
            // something that isn't valid CSV.
            //   checkForUpdates only does a raw string-inequality check before
            // staging a poll result as "pending" -- it never validates parseability.
            // A transient upstream hiccup (a Google auth interstitial, a truncated
            // download, a "spreadsheet too large" error page -- all real, expected
            // failure modes for a "Publish to the web" CSV link, see README's Data
            // pipeline section) is textually different from the last good load, so
            // it gets staged, and the auto-apply effect immediately calls this
            // function on it. window.XLSX.read() throws synchronously on genuinely
            // non-tabular text (confirmed: "Invalid HTML: could not find <table>" for
            // an HTML interstitial body) -- with no catch here, that exception
            // propagated straight out of the useEffect callback. This app has no
            // ErrorBoundary anywhere, so React's own top-level handling for an
            // uncaught error thrown during a passive effect unmounts the ENTIRE tree:
            // confirmed live via Playwright (page.route serving an HTML interstitial
            // in place of the CSV, then letting the poll pick it up) that #root's
            // innerHTML goes to length 0 -- a fully blank white page, the
            // previously-good live report gone completely, with no on-screen error
            // and no recovery short of a manual browser reload. Fixed the same way
            // handleManualRefresh already guards its own applyCsvText call: wrap in
            // try/catch and surface both a thrown exception AND an {ok:false} parse
            // result via the existing autoFetchError banner (self-clears on the next
            // successful load, same as every other autoFetchError case) instead of
            // either crashing or silently doing nothing. Deliberately does NOT clear
            // pendingCsvTextRef/newDataAvailable on failure -- leaving them set means
            // a manual click on the "New data available" banner's Refresh button (the
            // other caller of this function) can retry the exact same payload and get
            // the same clear error again rather than the banner just vanishing with
            // nothing having happened, and the next genuinely-different good poll
            // result still overwrites pendingCsvTextRef normally once the upstream
            // issue clears.
            const applyPendingUpdate = () => {
                if (!pendingCsvTextRef.current) return;
                // 2026-09-1x (W11 sequence-guard follow-up): the staged payload can
                // sit here for minutes -- the user has to either notice the "New data
                // available" banner and click it, or return from Historical View --
                // and in that window an even-newer ticket may have already committed
                // directly (e.g. a manual refresh, or another poll tick that found
                // hasLoadedDataRef still meant applying directly, or a manual upload).
                // If so, pendingCsvTextRef.current is now STALE relative to what's
                // already on screen: applying it would silently regress rawRows back
                // in time. Recognize that and quietly clear the stale staged payload
                // instead -- this is not an error (something newer already covers it),
                // so no autoFetchError banner, just a silent no-op that also tidies up
                // newDataAvailable so the banner doesn't linger for data that's no
                // longer actually new. See csvApplySeqRef's own big comment (near
                // pendingCsvTextRef) for the full design.
                if (pendingCsvTextSeqRef.current !== csvApplySeqRef.current) {
                    pendingCsvTextRef.current = null;
                    setNewDataAvailable(false);
                    return;
                }
                try {
                    const result = applyCsvText(pendingCsvTextRef.current);
                    if (!result.ok) setAutoFetchError(result.error);
                } catch (err) {
                    console.error('Applying the pending update failed:', err);
                    setAutoFetchError(`Couldn't apply the newly-fetched data (${err && err.message ? err.message : 'unknown error'}). Still showing the last good data -- click Refresh Now to retry once the connection is back.`);
                }
            };

            // When Auto-Refresh is on, apply a detected change the moment it's found instead
            // of waiting for a manual click on the "New data available" banner.
            //
            // 2026-09-04 (math/logic audit): added the `!viewingHistoricalDate` guard --
            // this effect used to fire regardless of historical-viewing state, so a
            // background poll landing while someone was reviewing a past date (or a
            // Compare-These-Two-Dates session built from two past dates) would silently
            // swap rawRows back to live data and reset viewingHistoricalDate to null via
            // applyCsvText, with zero warning. On the Compare tab this was worse than a
            // plain historical view: the user never leaves the tab, oldRawRows/oldFileName
            // (the "old" snapshot) stay put, so only the "current" side quietly changes
            // out from under them mid-review -- confirmed live (Playwright + a virtual
            // clock driving the real 5-minute poll) to swap the displayed vessel count and
            // every delta on screen with no visible signal anything happened.
            //
            // Adding viewingHistoricalDate to the dependency array (not just checking it)
            // means this doesn't just skip once -- it re-evaluates the moment the user
            // exits historical mode (clicking "Back to Live" sets viewingHistoricalDate to
            // null), so a poll result that arrived while they were away still applies
            // automatically as soon as they're looking at live data again. No new state
            // needed: newDataAvailable/pendingCsvTextRef already hold whatever was found.
            useEffect(() => {
                if (autoRefreshEnabled && newDataAvailable && !viewingHistoricalDate) {
                    applyPendingUpdate();
                }
            }, [autoRefreshEnabled, newDataAvailable, viewingHistoricalDate]);

            const handleManualRefresh = async () => {
                fetchAndApplySectorData();
                if (!isCsvSourceConfigured()) return;
                setIsCheckingForUpdates(true);
                // See csvApplySeqRef's own big comment (near pendingCsvTextRef) for
                // the full design -- this is the ONE direct-apply call site that
                // originally had no ordering check at all (not even hasLoadedDataRef),
                // which is exactly the residual gap that motivated this general
                // mechanism: a manual "Refresh Now" click's own slow fetch could
                // resolve after an independent poll's applyPendingUpdate had already
                // committed fresher data, silently overwriting it. Claimed up front,
                // before the fetch, same reasoning as every other site.
                const mySeq = ++csvApplySeqRef.current;
                try {
                    const csvText = await fetchCsvText();
                    // 2026-09-10 (W11 data-ingestion audit): the "Refresh Now" header
                    // button (this function) is rendered and enabled unconditionally
                    // whenever rawRows.length > 0 -- including while viewingHistoricalDate
                    // is set (a single "View a Date" snapshot, OR a Compare-These-Two-Dates
                    // session built from two historical snapshots, which also leaves
                    // viewingHistoricalDate set to Snapshot B's date). Before this fix,
                    // clicking it there called applyCsvText() unconditionally, which
                    // silently overwrites rawRows with live data AND resets
                    // viewingHistoricalDate to null -- exactly the same silent-yank bug
                    // the AUTOMATIC auto-apply effect (near applyPendingUpdate's own
                    // declaration) was already fixed for on 2026-09-04, just reachable
                    // here via a manual click instead of a background poll. On a
                    // Compare-These-Two-Dates session specifically this is worse than a
                    // plain historical view: the user never leaves the Compare tab,
                    // oldRawRows/oldFileName (Snapshot A, the "old" side) stay put, so
                    // only the "current"/rawRows side silently swaps from Snapshot B to
                    // live data mid-review -- reproduced live via Playwright (clicked
                    // "Refresh Now" while viewing a historical date; the "Viewing
                    // historical data for ..." banner vanished and live data appeared
                    // with no confirmation of any kind). "Refresh Now"'s own tooltip
                    // ("Re-fetch the latest data from the Sheet now") gives no hint this
                    // can happen either.
                    //   Fix: reuse the SAME deferred-apply mechanism checkForUpdates
                    // already uses once initial data has loaded -- stage the freshly-
                    // fetched text as a pending update (only if it's actually different
                    // from what's currently the live dataset) instead of applying it
                    // straight through. The historical/compare view on screen is left
                    // completely undisturbed; the fetched update surfaces normally via
                    // the "New data available" banner (or the auto-apply effect, if
                    // Auto-Refresh is on) the moment the user clicks "Back to Live" --
                    // this is the exact mechanism the 2026-09-04 fix's own comment
                    // describes ("the pending update isn't lost... picks back up the
                    // moment the user returns to live data"), just also reachable from
                    // this manual path now. lastChecked (set inside fetchCsvText above)
                    // still updates normally either way, so "last checked" stays
                    // accurate even on a run where nothing visibly changes.
                    // 2026-09-1x (W11 sequence-guard follow-up): re-check before
                    // committing OR staging -- something newer (another manual click,
                    // a poll tick, a manual upload) may have already claimed a ticket
                    // while this fetch was in flight, in which case this result is
                    // stale regardless of which branch below it would otherwise take.
                    if (mySeq !== csvApplySeqRef.current) return;
                    if (viewingHistoricalDate) {
                        if (csvText !== lastLoadedCsvTextRef.current) {
                            pendingCsvTextRef.current = csvText;
                            // See checkForUpdates's identical line for why this is
                            // recorded -- applyPendingUpdate re-verifies it before ever
                            // committing this staged payload.
                            pendingCsvTextSeqRef.current = mySeq;
                            setNewDataAvailable(true);
                        }
                    } else {
                        const result = applyCsvText(csvText);
                        if (!result.ok) setAutoFetchError(result.error);
                    }
                } catch (err) {
                    console.error('Manual refresh failed:', err);
                    setAutoFetchError(`Refresh failed (${err.message}). Please try again, or upload a file manually.`);
                } finally {
                    setIsCheckingForUpdates(false);
                }
            };

            const exportToExcel = () => {
                if (!window.XLSX || !activeTabContentRef.current) return;
                const tables = activeTabContentRef.current.querySelectorAll('table');
                const wb = XLSX.utils.book_new();
                // 2026-09-04 (math/logic audit): the Compare tab's KPI summary (Vessels/
                // Total Max Laden/Total Booked TEU/Overall Utilization, each Old/New/Delta)
                // is a styled <div> grid, not a <table> -- the querySelectorAll('table')
                // scrape below silently skipped it entirely, so exporting from Compare only
                // ever produced the "Notable Vessel Changes" table, missing the headline
                // numbers. Build it as its own sheet here, ahead of the generic table scrape,
                // whenever Compare has data to show.
                if (activeTab === 'compare' && compareData) {
                    const summaryRows = [
                        { Metric: 'Vessels', Old: compareData.oldSnapshot.bookingCount, New: compareData.newSnapshot.bookingCount, Delta: compareData.newSnapshot.bookingCount - compareData.oldSnapshot.bookingCount },
                        { Metric: 'Total Max Laden', Old: compareData.oldSnapshot.maxLdn, New: compareData.newSnapshot.maxLdn, Delta: compareData.newSnapshot.maxLdn - compareData.oldSnapshot.maxLdn },
                        { Metric: 'Total Booked TEU', Old: compareData.oldSnapshot.laden, New: compareData.newSnapshot.laden, Delta: compareData.newSnapshot.laden - compareData.oldSnapshot.laden },
                        { Metric: 'Overall Utilization %', Old: compareData.oldSnapshot.utilz, New: compareData.newSnapshot.utilz, Delta: compareData.newSnapshot.utilz - compareData.oldSnapshot.utilz },
                    ];
                    const summaryWs = XLSX.utils.json_to_sheet(summaryRows);
                    XLSX.utils.book_append_sheet(wb, summaryWs, 'Summary');
                }
                tables.forEach((table, i) => {
                    const caption = table.querySelector('caption');
                    const rawName = (caption && caption.textContent.trim()) || `Table ${i + 1}`;
                    const sheetName = rawName.replace(/[\\/?*[\]:]/g, ' ').slice(0, 31) || `Table ${i + 1}`;
                    const ws = XLSX.utils.table_to_sheet(table);
                    XLSX.utils.book_append_sheet(wb, ws, sheetName);
                });
                // 2026-09-04: previously just `return`'d here with zero feedback if there was
                // nothing to export (e.g. the Compare tab before an old file is loaded) --
                // confirmed live that clicking Export in that state did nothing at all, no
                // error, no file, no indication anything was even attempted.
                if (wb.SheetNames.length === 0) {
                    alert("There's nothing to export yet on this tab.");
                    return;
                }
                XLSX.writeFile(wb, `${activeTab}_export.xlsx`);
            };

            const exportAnalysisToExcel = () => {
                if (!window.XLSX || !serviceLaneAnalysis) return;
                // 2026-09-10: column headers qualified with "POL" when groupLabel is 'POL',
                // mirroring the on-screen Overall Snapshot tiles/per-card labels -- safe to do
                // as a single shared header across the whole sheet now that OVERALL and every
                // group row share the same basis (see laneSummaries' own comment above);
                // before this fix OVERALL was always Lane-wide, so a "POL" header would have
                // been actively misleading on that row specifically.
                const polQualifier = serviceLaneAnalysis.groupLabel === 'POL' ? 'POL ' : '';
                const utilizationCol = `Avg ${polQualifier}Utilization %`;
                const peakUtilizationCol = `Avg Peak ${polQualifier}Utilization %`;
                const maxLadenCol = `Avg Wkly Capacity (${polQualifier}Max Laden)`;
                const rows = [
                    {
                        [serviceLaneAnalysis.groupLabel]: 'OVERALL',
                        [utilizationCol]: Math.round(serviceLaneAnalysis.overall.utilization),
                        [peakUtilizationCol]: '',
                        [maxLadenCol]: Math.round(serviceLaneAnalysis.overall.capacity),
                        'Avg Wkly Laden': Math.round(serviceLaneAnalysis.overall.laden),
                        'Avg Wkly Shortfall': Math.round(serviceLaneAnalysis.overall.shortfall)
                    },
                    ...serviceLaneAnalysis.groups.map(g => ({
                        [serviceLaneAnalysis.groupLabel]: g.group,
                        [utilizationCol]: Math.round(g.avgUtilization),
                        [peakUtilizationCol]: Math.round(g.avgPeakUtilization),
                        [maxLadenCol]: Math.round(g.avgWklyMaxLdn),
                        'Avg Wkly Laden': Math.round(g.avgWklyLaden),
                        'Avg Wkly Shortfall': Math.round(g.avgWklyShortfall)
                    }))
                ];
                // 2026-09-10: the appended "don't sum to the OVERALL row" note (the exported
                // mirror of the on-screen caption removed the same day, see that caption's own
                // comment) was retired here too -- OVERALL is now built from these same POL rows
                // when groupLabel is 'POL', so they do sum to it now.
                const ws = XLSX.utils.json_to_sheet(rows);
                const wb = XLSX.utils.book_new();
                XLSX.utils.book_append_sheet(wb, ws, 'Service Lane Analysis'.slice(0, 31));
                const weekTag = String(serviceLaneAnalysis.weekRange).replace(/[^\w]+/g, '_');
                XLSX.writeFile(wb, `${activeTab}_analysis_${weekTag}.xlsx`);
            };

            const toggleFilter = (e, setState, value) => {
                const isMulti = e.altKey || e.ctrlKey || e.metaKey || e.shiftKey;
                if (isMulti) {
                    setState(prev => prev.includes(value) ? prev.filter(v => v !== value) : [...prev, value]);
                } else {
                    setState(prev => prev.length === 1 && prev[0] === value ? [] : [value]);
                }
            };

            const closeAnalysisModal = () => {
                setAnalysisModalOpen(false);
                setAnalysisSelectedWeeks([]);
                setAnalysisShowAllWeeks(false);
                setAnalysisModalPos({ x: 0, y: 0 });
            };

            const clearSlicers = () => {
                setSelectedSubTrades([]);
                setSelectedAnalysts([]);
                setSelectedMktgAnalysts([]);
                setSelectedCoasts([]);
                setSelectedLanes([]);
                setSelectedSaleWeeks([]);
                setSelectedYards([]);
                setSelectedApStatuses([]);
                setHeaderFilters({});
                setYardSearchText('');
            };

            const saleWeekOptions = useMemo(() => {
                const seen = new Set();
                rawRows.forEach(row => {
                    const week = row.saleWeek;
                    if (week !== undefined && week !== null && String(week).trim() !== '') {
                        seen.add(String(week).trim());
                    }
                });
                return Array.from(seen).sort(compareSaleWeek);
            }, [rawRows]);

            const availableYards = useMemo(() => {
                const set = new Set();
                rawRows.forEach(row => {
                    if (row.yard && row.yard.trim().toUpperCase() !== 'NO N.A. CALL') set.add(row.yard);
                });
                return Array.from(set).sort();
            }, [rawRows]);

            const availableSubTrades = useMemo(() => {
                const set = new Set();
                rawRows.forEach(row => { if (row.subTrade) set.add(row.subTrade); });
                return Array.from(set).sort();
            }, [rawRows]);

            const COAST_PREFERRED_ORDER = ['WC', 'EC'];
            const availableCoasts = useMemo(() => {
                const set = new Set();
                rawRows.forEach(row => { if (row.coast) set.add(row.coast); });
                const known = COAST_PREFERRED_ORDER.filter(c => set.has(c));
                const extra = Array.from(set).filter(c => !COAST_PREFERRED_ORDER.includes(c)).sort();
                return [...known, ...extra];
            }, [rawRows]);

            const availableAnalysts = useMemo(() => {
                const set = new Set();
                rawRows.forEach(row => {
                    const raw = String(row.pic || '').trim();
                    if (!raw.includes('/')) return;
                    const spc = raw.split('/')[0].trim();
                    if (spc) set.add(spc);
                });
                return Array.from(set).sort();
            }, [rawRows]);

            // MKG PIC (2026-09-09) -- mirrors availableAnalysts exactly, reading the Mktg half
            // (split index 1) of the same "SPC / Mktg" combined row.pic string instead of the
            // SPC half (index 0).
            const availableMktgAnalysts = useMemo(() => {
                const set = new Set();
                rawRows.forEach(row => {
                    const raw = String(row.pic || '').trim();
                    if (!raw.includes('/')) return;
                    const mktg = raw.split('/')[1].trim();
                    if (mktg) set.add(mktg);
                });
                return Array.from(set).sort();
            }, [rawRows]);

            const availableLanes = useMemo(() => {
                const set = new Set();
                rawRows.forEach(row => { if (row.lane) set.add(row.lane); });
                return Array.from(set).sort();
            }, [rawRows]);

            useEffect(() => {
                if (!yardSearchText || yardSearchText.trim() === '') {
                    setSelectedYards([]);
                    return;
                }
                const searchLower = yardSearchText.trim().toLowerCase();
                const matchingYards = availableYards.filter(yard =>
                    String(yard).toLowerCase().includes(searchLower)
                );
                if (matchingYards.length > 0) {
                    setSelectedYards(matchingYards);
                } else {
                    setSelectedYards(['__NO_MATCH__']);
                }
            }, [yardSearchText, availableYards]);

            // F4 (PERFORMANCE_REVIEW.md): header-filter text is deferred so a keystroke in
            // renderFilter's <input> doesn't force the O(rawRows) memo below to re-run
            // synchronously on every character (which in turn re-rendered the un-virtualized
            // table on every keystroke). The <input> itself still binds to `headerFilters`
            // directly via handleHeaderFilterChange (see :2327-2339), so it stays a controlled,
            // instantly-echoing input -- only the expensive memo below reads the deferred copy,
            // which trails typing by a render or two under React's scheduler and catches up once
            // the user pauses. Clear Filters (`clearSlicers` -> `setHeaderFilters({})`, :3211-3220)
            // is a single discrete update rather than a burst of keystrokes, so nothing is
            // competing for the scheduler and the deferred value catches up on the very next
            // render -- it does not get stuck showing stale (pre-clear) filtered results.
            const deferredHeaderFilters = useDeferredValue(headerFilters);

            // F3 (PERFORMANCE_REVIEW.md): this memo re-scans every one of the ~8.8k rawRows on
            // every filter/tab change. Everything hoisted above the `rawRows.forEach` below is
            // loop-invariant -- it does not depend on `row` -- and used to be recomputed once
            // per row for no reason: lowercasing each selected SPC/MKG analyst name, O(k)
            // `Array#includes` scans for every categorical slicer (Sub Trade/Lane/Coast/Sale
            // Week/Yard/AP Status), and re-lowercasing + re-cleaning each header filter's search
            // text. `Set#has` and `Array#includes` both use SameValueZero equality (so `NaN`
            // matches either way), so swapping the categorical arrays for `Set`s here is a
            // behaviour-preserving O(k)->O(1) win, not just a style change.
            //
            // F3b: `activeTab` used to sit directly in this memo's dependency array even though
            // it only steers two narrow per-row branches: `matchYard`'s "the Detail tab ignores
            // the Yard slicer" rule, and which status field AP-status matching reads
            // (`loadingStatus` on POL Booking Flash, `status` everywhere else). That meant
            // *every* tab switch re-scanned all rawRows and rebuilt every valid-value Set -- even
            // switching between Trade Summary / Sector Summary / Compare, whose filtering
            // behaviour here is byte-for-byte identical (neither branch treats those tabs
            // differently). Depending on the two booleans `activeTab` actually projects onto,
            // instead of `activeTab` itself, means the memo only recomputes when a tab switch
            // actually changes behaviour (entering/leaving 'detail' or 'pol_booking'), while
            // switching among the other tabs is free.
            const isDetailTab = activeTab === 'detail';
            const isPolBookingTab = activeTab === 'pol_booking';

            const { filteredRawRows, validSubTrades, validCoasts, validAnalysts, validMktgAnalysts, validLanes, validSaleWeeks, validYards } = useMemo(() => {
                const fRows = [];
                const vSubTrades = new Set();
                const vCoasts = new Set();
                const vAnalysts = new Set();
                const vMktgAnalysts = new Set();
                const vLanes = new Set();
                const vSaleWeeks = new Set();
                const vYards = new Set();

                // Loop-invariant precomputation (F3), see comment above the memo.
                const subTradeSet = new Set(selectedSubTrades);
                const laneSet = new Set(selectedLanes);
                const coastSet = new Set(selectedCoasts);
                const saleWeekSet = new Set(selectedSaleWeeks);
                const yardSet = new Set(selectedYards);
                const apStatusSet = new Set(selectedApStatuses);
                // row.pic is matched case-insensitively against each selected SPC/MKG analyst
                // name -- lowercase the (short) selected-analyst lists once instead of on every
                // row.
                const analystsLower = selectedAnalysts.map(analyst => analyst.toLowerCase());
                const mktgAnalystsLower = selectedMktgAnalysts.map(mktg => mktg.toLowerCase());

                // Precompute the active header (per-column) text filters once: lowercase + trim
                // each filter value, and precompute the ",%()"-stripped "cleaned" variant used by
                // the fallback match, instead of redoing both per row per active filter.
                const activeHeaderFilters = [];
                for (const key in deferredHeaderFilters) {
                    const filterValue = deferredHeaderFilters[key];
                    if (filterValue && filterValue.trim() !== '') {
                        const searchVal = filterValue.toLowerCase().trim();
                        activeHeaderFilters.push({
                            key,
                            searchVal,
                            cleanedSearchVal: searchVal.replace(/[,%()]/g, '')
                        });
                    }
                }

                rawRows.forEach(row => {
                    const matchSubTrade = subTradeSet.size === 0 || subTradeSet.has(row.subTrade);
                    const matchAnalyst = analystsLower.length === 0 || (row.pic && analystsLower.some(analystLower =>
                        row.pic.toLowerCase().includes(analystLower)
                    ));
                    // MKG PIC (2026-09-09) -- same substring-against-the-whole-pic-string
                    // matching convention as matchAnalyst just above, deliberately: a loose
                    // "includes" check, not isolated to the split Mktg half specifically, for
                    // identical behavior/precision to the existing SPC Analyst filter.
                    const matchMktgAnalyst = mktgAnalystsLower.length === 0 || (row.pic && mktgAnalystsLower.some(mktgLower =>
                        row.pic.toLowerCase().includes(mktgLower)
                    ));
                    const matchLane = laneSet.size === 0 || laneSet.has(row.lane);
                    const matchCoast = coastSet.size === 0 || coastSet.has(row.coast);
                    const matchSaleWeek = saleWeekSet.size === 0 || saleWeekSet.has(row.saleWeek);
                    const matchYard = isDetailTab || yardSet.size === 0 || yardSet.has(row.yard);

                    const currentStatusField = isPolBookingTab ? row.loadingStatus : row.status;
                    const matchApStatus = apStatusSet.size === 0 || apStatusSet.has(currentStatusField);

                    let matchHeaderFilters = true;
                    for (let i = 0; i < activeHeaderFilters.length; i++) {
                        const { key, searchVal, cleanedSearchVal } = activeHeaderFilters[i];
                        const rawRowVal = String(row[key] || '').toLowerCase();
                        const cleanedRowVal = rawRowVal.replace(/[,%()]/g, '');

                        if (!rawRowVal.includes(searchVal) && !cleanedRowVal.includes(cleanedSearchVal)) {
                            matchHeaderFilters = false;
                            break;
                        }
                    }

                    const headerAndApMatch = matchApStatus && matchHeaderFilters;

                    if (headerAndApMatch && matchAnalyst && matchMktgAnalyst && matchLane && matchCoast && matchSaleWeek && matchYard) vSubTrades.add(row.subTrade);
                    if (headerAndApMatch && matchSubTrade && matchMktgAnalyst && matchLane && matchCoast && matchSaleWeek && matchYard) {
                        const raw = String(row.pic || '').trim();
                        if (raw.includes('/')) {
                            const spc = raw.split('/')[0].trim();
                            if (spc) vAnalysts.add(spc);
                        }
                    }
                    if (headerAndApMatch && matchSubTrade && matchAnalyst && matchLane && matchCoast && matchSaleWeek && matchYard) {
                        const raw = String(row.pic || '').trim();
                        if (raw.includes('/')) {
                            const mktg = raw.split('/')[1].trim();
                            if (mktg) vMktgAnalysts.add(mktg);
                        }
                    }
                    if (headerAndApMatch && matchSubTrade && matchAnalyst && matchMktgAnalyst && matchCoast && matchSaleWeek && matchYard) vLanes.add(row.lane);
                    if (headerAndApMatch && matchSubTrade && matchAnalyst && matchMktgAnalyst && matchLane && matchSaleWeek && matchYard) vCoasts.add(row.coast);
                    if (headerAndApMatch && matchSubTrade && matchAnalyst && matchMktgAnalyst && matchLane && matchCoast && matchYard) vSaleWeeks.add(row.saleWeek);
                    if (headerAndApMatch && matchSubTrade && matchAnalyst && matchMktgAnalyst && matchLane && matchCoast && matchSaleWeek) vYards.add(row.yard);

                    if (matchSubTrade && matchAnalyst && matchMktgAnalyst && matchLane && matchCoast && matchSaleWeek && matchYard && headerAndApMatch) {
                        fRows.push(row);
                    }
                });

                return {
                    filteredRawRows: fRows,
                    validSubTrades: vSubTrades,
                    validCoasts: vCoasts,
                    validAnalysts: vAnalysts,
                    validMktgAnalysts: vMktgAnalysts,
                    validLanes: vLanes,
                    validSaleWeeks: vSaleWeeks,
                    validYards: vYards
                };
            }, [rawRows, selectedSubTrades, selectedAnalysts, selectedMktgAnalysts, selectedLanes, selectedCoasts, selectedSaleWeeks, selectedYards, selectedApStatuses, deferredHeaderFilters, isDetailTab, isPolBookingTab]);

            useLayoutEffect(() => {
                if (activeTab !== 'pol_booking') return;
                const container = polTableContainerRef.current;
                if (!container) return;
                const cells = container.querySelectorAll('[data-autofit-col]');
                
                const originalStyles = [];
                cells.forEach(el => {
