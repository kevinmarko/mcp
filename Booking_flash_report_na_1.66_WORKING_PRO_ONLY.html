                                        <th key={`${cKey}-${dfIdx}`} data-autofit-col={df.name} className={`border border-black py-0.5 px-0.5 min-w-[80px] relative ${cKey === 'Total' && colField ? 'font-bold bg-[#333333]' : ''}`} style={colWidths[df.name] ? { width: colWidths[df.name], minWidth: colWidths[df.name] } : undefined}>{df.label}<ColResizeHandle colKey={df.name} /></th>
                                    ))
                                ))}
                            </tr>
                        </thead>
                        <tbody className="whitespace-nowrap">
                            {renderRows.map((row, i) => {
                                const customClass = rowClass && row.level === rowFields.length ? rowClass(row.totals, row.context) : '';
                                const trClassBase = `${customClass ? '' : 'hover:bg-gray-100 dark:hover:bg-gray-700'} ${row.level === 0 ? (prettyGrandTotal ? 'font-bold shadow-md' : 'bg-[#d9e1f2] text-black font-bold') : ''} ${row.level === 1 && !tabular ? 'font-bold' : ''}`;
                                const grandTotalCellStyle = (row.level === 0 && prettyGrandTotal) ? { backgroundColor: accentColor, color: '#fff' } : undefined;

                                if (tabular) {
                                    if (valuesInRows) {
                                        return (
                                            <React.Fragment key={`tab-${i}`}>
                                                {dataFields.map((df, dfIdx) => {
                                                    const isFirstValRow = dfIdx === 0;
                                                    
                                                    // Determine if we should show the row grouping label and calculate rowspan
                                                    const renderedFields = [];
                                                    for (let rfIdx = 0; rfIdx < rowFields.length; rfIdx++) {
                                                        const isFirstInstance = i === 0 || renderRows[i - 1].path[rfIdx] !== row.path[rfIdx] || 
                                                            (rfIdx > 0 && renderRows[i - 1].path[rfIdx - 1] !== row.path[rfIdx - 1]);
                                                        
                                                        // Only show the cell if it's the first instance AND we are on the first value row (so it doesn't repeat per value row)
                                                        const showVal = isFirstInstance && isFirstValRow;
                                                        
                                                        if (showVal) {
                                                            let groupRowSpan = 0;
                                                            for (let j = i; j < renderRows.length; j++) {
                                                                let samePath = true;
                                                                for(let k=0; k<=rfIdx; k++){
                                                                    if (renderRows[j].path[k] !== row.path[k]) {
                                                                        samePath = false;
                                                                        break;
                                                                    }
                                                                }
                                                                if (samePath) {
                                                                groupRowSpan += dataFields.length; // Span all value rows for this group item
                                                            } else {
                                                                break;
                                                            }
                                                        }
                                                        renderedFields.push(
                                                            <td key={`rl-${rfIdx}`} rowSpan={groupRowSpan} data-autofit-col={`rowLabels-${rfIdx}`} className={`border border-gray-400 py-1 px-1 text-center align-top ${rowFields[rfIdx].cellClass ? rowFields[rfIdx].cellClass : 'bg-gray-50 dark:bg-gray-800'} whitespace-nowrap ${row.level === rfIdx + 1 ? 'font-bold' : ''}`} style={colWidths[`rowLabels-${rfIdx}`] ? { width: colWidths[`rowLabels-${rfIdx}`], minWidth: colWidths[`rowLabels-${rfIdx}`] } : undefined}>
                                                                {row.path[rfIdx]}
                                                            </td>
                                                        );
                                                    }
                                                }

                                                // Calculate if this is a subtotal row or grand total row
                                                const isGrandTotal = row.level === 0;
                                                    const isSubtotal = row.level < rowFields.length && row.level > 0;
                                                    
                                                    let rowSpanContext = null;
                                                    if (isGrandTotal) {
                                                       rowSpanContext = <td rowSpan={dataFields.length} className="border border-gray-400 py-1 px-1 text-left align-top bg-[#d9e1f2] text-black font-bold whitespace-nowrap" colSpan={rowFields.length}>Grand Total</td>;
                                                    } else if (isSubtotal) {
                                                        const label = `${row.label} Total`;
                                                        rowSpanContext = <td rowSpan={dataFields.length} className="border border-gray-400 py-1 px-1 text-left align-top bg-blue-100 dark:bg-blue-900 font-bold whitespace-nowrap" colSpan={rowFields.length - row.level + 1}>{label}</td>;
                                                    }

                                                    return (
                                                        <tr key={`tab-${i}-${dfIdx}`} className={`${customClass || 'bg-white dark:bg-gray-800 hover:bg-gray-50 dark:hover:bg-gray-700'}`}>
                                                            {isFirstValRow && rowSpanContext}
                                                            {!isGrandTotal && !isSubtotal && renderedFields}
                                                            <td data-autofit-col="valuesCol" className={`border border-gray-400 py-1 px-1 text-left font-semibold ${isGrandTotal ? 'bg-[#d9e1f2] text-black' : isSubtotal ? 'bg-blue-100 dark:bg-blue-900' : 'bg-white dark:bg-gray-800'}`} style={colWidths.valuesCol ? { width: colWidths.valuesCol, minWidth: colWidths.valuesCol } : undefined}>{df.label}</td>
                                                            {colKeysWithTotal.map((cKey, cIdx) => {
                                                                let val = 0;
                                                                const tGrp = row.totals[cKey] || {};
                                                                if (df.agg === 'calc' && df.calc) {
                                                                    val = df.calc(tGrp, row.context, cKey);
                                                                } else {
                                                                    const t = tGrp[df.name] || { sum: 0, max: 0, count: 0 };
                                                                    if (df.agg === 'sum') val = t.sum;
                                                                    if (df.agg === 'max') val = t.max;
                                                                    if (df.agg === 'count') val = t.count;
                                                                    if (df.agg === 'avg') val = t.count > 0 ? t.sum / t.count : 0;
                                                                }

                                                                let displayVal = val;
                                                                if (df.format === 'number') displayVal = formatNumberWithCommas(val);
                                                                else if (df.format === 'percent') displayVal = `${Math.round(df.rawFraction ? getPercentNum(val) : val)}%`;
                                                                else if (df.format === 'accounting') displayVal = formatAccountingNumber(val);
                                                                else if (df.format === 'accountingSignedRed') displayVal = formatAccountingSigned(val);

                                                                // Latent-bug fix (correctness audit, 2026-09-10): this is the ONE of
                                                                // PivotTableViewer's render branches (tabular:true + valuesInRows:true) that
                                                                // used to skip the `hideOnLevels` check the other two branches both apply
                                                                // (see the identical `if (df.hideOnLevels...)` block ~40 lines below in the
                                                                // "Tabular without Values In Rows" branch, and again in the default
                                                                // non-tabular tree branch further down) -- a dataField carrying
                                                                // `hideOnLevels: [...]` would render its subtotal/grand-total value here
                                                                // instead of being blanked out like it is everywhere else. Matched exactly:
                                                                // both sibling branches blank the CELL TEXT (`displayVal = ''`) while still
                                                                // rendering the cell's background/border/cClass -- they do not omit the
                                                                // `<td>` itself -- so this does the same, not some alternate "skip the cell"
                                                                // interpretation. This is a no-op today: Trade Summary is the only config
                                                                // that reaches this branch (tabular+valuesInRows), and none of its three
                                                                // dataFields (maxLdn/curLaden/utilization) set `hideOnLevels`, so
                                                                // `df.hideOnLevels` is always undefined here and the condition never fires
                                                                // on the live app. It would only matter if a future Trade-Summary-shaped
                                                                // config added a `hideOnLevels` dataField.
                                                                if (df.hideOnLevels && df.hideOnLevels.includes(row.level)) {
                                                                    displayVal = '';
                                                                }

                                                                const cClass = `${df.cellClass ? df.cellClass(val, tGrp) : ''} ${negativeValueClass(val, df.format)}`.trim();
                                                                const cClassHasOwnBg = cClass.includes('bg-');
                                                                // Class B fix (see HANDOFF.md's "Known bug classes" and getBg's own comment in
                                                                // detailRowStatus above for the fuller writeup): this is the exact mirror of
                                                                // cClassHasOwnBg just above, applied to TEXT color instead of background. A
                                                                // dataField's own cClass (e.g. avgMaxVsBkg's `text-red-600 font-semibold`) can
                                                                // supply a text-color utility without supplying its own background, so checking
                                                                // cClassHasOwnBg alone isn't enough -- the Total column's own `text-black
                                                                // dark:text-gray-100` below would still get concatenated onto the same cell as
                                                                // cClass's `text-red-600`, two same-specificity Tailwind utilities whose winner
                                                                // is decided only by Tailwind's stylesheet insertion order, not by which one
                                                                // appears later in this class string. Omitting our own text-color (but keeping
                                                                // the Total column's background) whenever cClass brings its own makes the

                                            </tr>
                                            {dataFields.map((df, dfIdx) => (
                                                <tr key={`${i}-${dfIdx}`} className={`${customClass || 'bg-white dark:bg-gray-800 hover:bg-gray-50 dark:hover:bg-gray-700'}`}>

                                                    {colKeysWithTotal.map((cKey, cIdx) => {
                                                        let val = 0;
                                                        const tGrp = row.totals[cKey] || {};
                                                        if (df.agg === 'calc' && df.calc) {
                                                            val = df.calc(tGrp, row.context, cKey);
                                                        } else {
                                                            const t = tGrp[df.name] || { sum: 0, max: 0, count: 0 };
                                                            if (df.agg === 'sum') val = t.sum;
                                                            if (df.agg === 'max') val = t.max;
                                                            if (df.agg === 'count') val = t.count;
                                                            if (df.agg === 'avg') val = t.count > 0 ? t.sum / t.count : 0;
                                                        }

                                                        let displayVal = val;
                                                        if (df.format === 'number') displayVal = formatNumberWithCommas(val);
                                                        else if (df.format === 'percent') displayVal = `${Math.round(df.rawFraction ? getPercentNum(val) : val)}%`;
                                                        else if (df.format === 'accounting') displayVal = formatAccountingNumber(val);
                                                        else if (df.format === 'accountingSignedRed') displayVal = formatAccountingSigned(val);

                                                        const cClass = `${df.cellClass ? df.cellClass(val, tGrp) : ''} ${negativeValueClass(val, df.format)}`.trim();
                                                        const cClassHasOwnBg = cClass.includes('bg-');

                                                {row.level > 0 && !hideRowToggles && (row.hasChildren
                                                    ? <button type="button" onClick={() => toggleCollapse(row.id)} aria-label={collapsedNodes.has(row.id) ? 'Expand row' : 'Collapse row'} className="cursor-pointer select-none hover:text-blue-700 bg-transparent border-0 p-0 m-0 inline align-baseline">{collapsedNodes.has(row.id) ? '▶ ' : '▼ '}</button>
                                                    : '• '
                                                )}
                                                {getRowStatusBadge(customClass)}{row.label}
                                            </span>
                                        </td>
                                        {colKeysWithTotal.map((cKey) => (
                                            dataFields.map((df, colIdx) => {
                                                let val = 0;
                                                const tGrp = row.totals[cKey] || {};
                                                if (df.agg === 'calc' && df.calc) {
                                                    val = df.calc(tGrp, row.context, cKey);
                                                } else {
                                                    const t = tGrp[df.name] || { sum: 0, max: 0, count: 0 };
                                                    if (df.agg === 'sum') val = t.sum;
                                                    if (df.agg === 'max') val = t.max;
                                                    if (df.agg === 'count') val = t.count;
                                                    if (df.agg === 'avg') val = t.count > 0 ? t.sum / t.count : 0;

                                                let displayVal = val;
                                                if (df.format === 'number') displayVal = formatNumberWithCommas(val);
                                                else if (df.format === 'percent') displayVal = `${Math.round(df.rawFraction ? getPercentNum(val) : val)}%`;
                                                else if (df.format === 'accounting') displayVal = formatAccountingNumber(val);
                                                else if (df.format === 'accountingSignedRed') displayVal = formatAccountingSigned(val);

                                                const isLeafRow = row.level === rowFields.length;
                                                const rowIsVMS = isLeafRow && String(row.context.vvd || '').trim().toUpperCase() === 'VMS';
                                                let isVmsMasked = false;
                                                if (rowIsVMS && val === 0 && config.vmsZeroMaskFields && config.vmsZeroMaskFields.includes(df.name)) {
                                                    displayVal = '';
                                                    isVmsMasked = true;
                                                }
                                                
                                                if (df.hideOnLevels && df.hideOnLevels.includes(row.level)) {
                                                    displayVal = '';
                                                }

                                                const cClass = `${(!isVmsMasked && df.cellClass) ? df.cellClass(val, tGrp) : ''} ${!isVmsMasked ? negativeValueClass(val, df.format) : ''}`.trim();
                                                const cClassHasOwnBg = cClass.includes('bg-');
                                                // Class B fix -- see the fuller writeup on the first cClassHasOwnText of this
                                                // shape above (~line 1817).
                                                const cClassHasOwnText = cClass.includes('text-');
                                                return <td key={`${cKey}-${colIdx}`} data-autofit-col={df.name} className={`border border-gray-400 py-1 px-0.5 ${cKey === 'Total' ? 'font-bold' : ''} ${(cKey === 'Total' && !cClassHasOwnBg) ? 'bg-[#eef2fa] dark:bg-blue-950' : ''} ${(cKey === 'Total' && !cClassHasOwnBg && !cClassHasOwnText) ? 'text-black dark:text-gray-100' : ''} ${cClass}`} style={grandTotalCellStyle}>{displayVal}</td>;
                                            })
                                        ))}

                            })}
                        </tbody>
                    </table>
                </div>
            );
        };

        const CSV_SOURCE_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vQNykGT8bYqwDC4k9loE5L8-j-rs9fyzPetfnrNwYAAZVRTXVLDyxrtCm9eP736OUAYEi6wULzeCaBn/pub?gid=0&single=true&output=csv';
        // 2026-09-10, per Kevin: "maybe we should poll the google sheet every 10
        // minutes" -- bumped from the original 5. Governs both this source's poll
        // (checkForUpdates below) and SECTOR_DATA_CSV_URL's identical poll
        // (fetchAndApplySectorData) -- both are live Google Sheet "Publish to the
        // web" CSV exports, on the same cadence by design (see DATA_ARCHITECTURE.md's
        // SECTOR_DATA_SEED entry). Deliberately NOT shared with the app-update poll
        // (APP_UPDATE_POLL_INTERVAL_MS, near checkForAppUpdate) -- how often to check
        // for new DATA and how often to check for a new APP VERSION are unrelated
        // concerns that just happened to start out equal, so keeping them on separate
        // constants means tuning one (like this one, just now) can't silently change
        // the other.
        const POLL_INTERVAL_MS = 10 * 60 * 1000;
        const APP_UPDATE_POLL_INTERVAL_MS = 5 * 60 * 1000;

        // 2026-09-14, per Kevin's "not everyone gets the schedule-change banner at
        // the same time" report: every poll below used to run on a plain
        // `setInterval(fn, POLL_INTERVAL_MS)`, which starts counting from whenever
        // THAT PARTICULAR BROWSER TAB happened to mount -- not from any shared
        // clock. Two people who opened the app minutes apart would poll (and so
        // notice the exact same server-side change) up to a full POLL_INTERVAL_MS
        // apart, purely from that load-time offset. Proved live with two
        // Playwright sessions loaded 15s apart against a shared mock data source:
        // they saw the identical change 10.5s apart despite identical settings
        // (see HANDOFF.md's "Schedule-change notification: not simultaneous
        // across users" entry for the full writeup and numbers).
        //   Fix: align every poll to the next WALL-CLOCK multiple of its own
        // interval (e.g. every 10 minutes means :00/:10/:20/:30/:40/:50 past the
        // hour, UTC) instead of "N minutes after this tab loaded". Since
        // Date.now() is the same real-world millisecond count for every user
        // regardless of timezone, and every interval used here divides evenly
        // into an hour, this makes every tab's poll land within the same handful
        // of seconds of each other (fetch latency + a tick of JS scheduling
        // jitter), not up to a whole interval apart. msUntilNextAlignedTick's
        // `intervalMs - (now % intervalMs)` is exactly "time until the next
        // multiple of intervalMs since the Unix epoch" -- the epoch itself starts
        // on a whole-minute boundary, so this lines up with human-readable clock
        // marks with no timezone math needed. Each poll site below reschedules
        // itself via setTimeout (recomputing the delay fresh each time) rather
        // than a single setInterval, so it self-corrects for the poll's own
        // variable run time and for browser throttling of backgrounded tabs
        // instead of silently drifting off-alignment over a long-running session.
        const msUntilNextAlignedTick = (intervalMs) => intervalMs - (Date.now() % intervalMs);
        // Schedules `fn` to run at the next wall-clock-aligned tick, then again
        // after every subsequent one, indefinitely -- the self-rescheduling
        // replacement for `setInterval(fn, intervalMs)` described above. Returns a
        // cancel function, same shape as `() => clearInterval(id)` at every
        // existing call site, so swapping one for the other needs no other change
        // nearby. `fn` may be sync or async -- awaited either way so two ticks of
        // the same poll can never overlap if `fn` itself ever runs long.
        const scheduleAlignedInterval = (fn, intervalMs) => {
            let timeoutId = null;
            let cancelled = false;
            const tick = async () => {
                if (cancelled) return;
                try { await fn(); } finally {
                    if (!cancelled) timeoutId = setTimeout(tick, msUntilNextAlignedTick(intervalMs));
                }
            };
            timeoutId = setTimeout(tick, msUntilNextAlignedTick(intervalMs));
            return () => { cancelled = true; clearTimeout(timeoutId); };
        };
        const isCsvSourceConfigured = () => !!CSV_SOURCE_URL && !CSV_SOURCE_URL.includes('REPLACE_WITH');

        // SCHEDULE_CHANGE_THRESHOLDS -- 2026-09-08, feeds diffScheduleChange() (see
        // near compareEtd above) and the "Large schedule change" warning banner (see
        // its render block near the other applyCsvText-driven banners).
        //
        // Calibrated 2026-09-08 against Booking_Flash_Historical_Data_2026-08-24_to_
        // 2026-09-01.csv -- 9 real consecutive days, 8 day-over-day diffs, 28 lanes,
        // 368-391 VVDs/day, 223 (lane, day-pair) observations. Full derivation/raw
        // numbers in DATA_ARCHITECTURE.md's entry for this feature; summary below.
        //
        // Two complementary rules decide whether a lane's VVD losses are significant
        // (see diffScheduleChange's own use of these numbers for exactly how they
        // combine): a UNIVERSAL net-loss rule (applies at every lane size) and a
        // SUPPLEMENTARY gross-rate rule (large lanes only). Net loss (removed minus
        // added, i.e. VVDs actually lost with no same-day replacement) is the one that
        // matters most: across all 223 observations it NEVER exceeded 1 in a single
        // lane in a single refresh -- including the archive's single busiest day
        // (2026-08-30->31, a routine weekly voyage-number rollover that swapped 24
        // VVDs for 23 new ones across ~24 different lanes simultaneously, net ~0
        // everywhere but one). A flat percentage threshold alone would have false-
        // positived on that routine day for any small lane (MAR-sized lanes: losing 1
        // of 3 near-term sailings reads as 33%) and would have MISSED a real "lost 2
        // of 5, no replacement" event on a small lane if judged by raw count alone
        // without the net-loss framing. The supplementary rate rule exists for a
        // different case the net-loss rule can't see: a LARGE lane where many VVDs get
        // swapped out and immediately back-filled (net ~0) but the sheer gross
        // proportion changing at once is still worth a heads-up -- the archive's worst
        // *normal* case there (excluding one known data-format artifact, see below)
        // was 13.3% (ANG, 15->15, fully backfilled same day).
        const SCHEDULE_CHANGE_THRESHOLDS = {
            // A lane (>= laneSizeForRatePct VVDs) losing more than this % of its own
            // previous-refresh VVDs at once is flagged, regardless of net loss --
            // catches "most of a large lane got swapped in one refresh" even when
            // backfilled to net-zero. p90/p95/p99 across 223 observations were
            // 6.2%/7.1%/10.0%; worst normal case (lanes >=8 VVDs) was 13.3% -- set well
            // above that with real margin while still catching a genuine multi-sailing
            // loss.
            perLaneRemovedRatePct: 40,
            // Below this many VVDs in a lane (old-dataset count), the rate rule above
            // is too noisy to trust (see this constant's own top comment for why) --
            // use the universal net-loss rule instead for those lanes too. There's a
            // clean gap in observed lane sizes in the calibration data (2-7, then a
            // jump to 10+, nothing at 8-9), so 8 is a real cutoff, not an arbitrary one
            // -- revisit if a future lane ever sits at exactly 8-9 VVDs.
            laneSizeForRatePct: 8,
            // Net VVDs lost (removed minus added) in one lane in one refresh, with NO
            // same-day replacement -- applies at every lane size, not just small ones.
            // Never exceeded 1 anywhere in 223 real (lane, day-pair) observations,
            // including the routine mass-rollover day above -- 2+ never occurred
            // naturally in 9 days of real data, so this fires zero times on the
            // baseline while still catching a real "MAR lost 2 of 3 sailings" event.
            laneNetLossThreshold: 2,
            // >=1 DISTINCT VVD having a Cutoff or ETD flip from POPULATED TO BLANK, or a
            // POL flip TO the literal "NO N.A. CALL", in one refresh -- flagged on its
            // own, independent of the per-lane removed-VVD rules above (this is the
            // exact real-world pattern from the motivating case: the VVD is still
            // present, just with blanked/flipped fields, so a removed-VVD count alone
            // wouldn't catch it). Direction matters and is deliberately NOT symmetric:
            // across all 8 day-pairs / ~3,300 held-in-common VVD comparisons, this
            // populated->blank direction happened on exactly ONE real VVD in the whole
            // archive (7E3T0001W, lane EC4) -- and that VVD disappeared entirely the
            // very next refresh, the closest real analog in this data to Kevin's actual
            // MAR/NLAT0668E incident. The OPPOSITE direction (blank->populated, i.e. a
            // schedule finally being announced, or a sailing's real N.A. port coming
            // back) happened twice in the same archive and was benign both times (a
            // schedule being filled in) -- deliberately excluded from this count so
            // good news doesn't trigger the same warning as bad news. See
            // diffScheduleChange's own dateFlips/polFlips direction tracking.
            concerningFlipVvdThreshold: 1,
        };

        const SECTOR_DATA_CSV_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vTHQ6pKVIaNKU3DiTaLFrqKJS-mr0DP12xhXXcsCvPDJiTolxYOA013WwHZAg5mFC4xN9cPwSNr3-O_/pub?gid=0&single=true&output=csv';
        const isSectorCsvSourceConfigured = () => !!SECTOR_DATA_CSV_URL && !SECTOR_DATA_CSV_URL.includes('REPLACE_WITH');

        // HISTORICAL_DATA_CSV_URL: a THIRD independent "Publish to the web" CSV link,
        // separate from CSV_SOURCE_URL (today's live data) and SECTOR_DATA_CSV_URL
        // (Sector Summary's right pivot). Its shape is different from both of those,
        // though: it's ONE Google Sheet whose rows span MANY dates via a leading
        // "Record Date" column, not a snapshot of just today -- confirmed by fetching
        // the real published link and inspecting it directly (98 columns: "Record
        // Date" plus the exact same 97-column Data_download schema
        // parseWorkbookToRows/getVal() already parse). This is NOT "one published
        // Sheet per historical week" -- an earlier assumption that turned out not to
        // match the real data -- so the app groups this single source's rows by
        // Record Date client-side instead of expecting a separate URL per date. Hoa
        // (a colleague) appends a new day's rows to this Sheet daily, so the
        // distinct-date list is designed to grow unbounded, not fixed at whatever
        // count it happens to have today. Same isXCsvSourceConfigured() placeholder-
        // guard pattern as the other two. Ported from
        // booking_flash_report_na_Kevin_1.10_AUTO_REFRESH.html.
        const HISTORICAL_DATA_CSV_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vR1YNb3SKa8jS53bK2UNLg6DSxUUNKMm36NjAlADroYHeWtb4CZiAfHHHzarRVUw5Z2tIaGVjY174gq/pub?output=csv';
        const isHistoricalCsvSourceConfigured = () => !!HISTORICAL_DATA_CSV_URL && !HISTORICAL_DATA_CSV_URL.includes('REPLACE_WITH');

        // ===========================================================================
        // F7 (PERFORMANCE_REVIEW.md), corrected -- read this before touching either
        // table's row rendering again
        // ===========================================================================
        // PERFORMANCE_REVIEW.md's original F7 assumed the Detail table renders "every row" at
        // "well over 100k DOM nodes" and prescribed virtualization/windowing. That premise was
        // checked against this repo's real exports and found wrong: the Detail ("Booking Flash")
        // table renders `processedData`, which is `tableData` (defined in FlashReportDashboard,
        // ~line 4600) -- an aggregation of `filteredRawRows` by
        // trade-subTrade-lane-saleWeek-vvd-vessel -- with sort + rowSpan/blank-row bookkeeping
        // layered on top, NOT the raw per-POL-leg rows. Measured against the repo's own sample
        // exports: `Booking_Flash_Data_MAIN_UPLOAD_8-12-2026.xlsx` (964 raw rows) aggregates to
        // 434 Detail rows (~17k <td> at ~40 cols/row); the 9-day historical CSV (8,769 raw rows)
        // aggregates to 463. Windowing pays off in the 5k-100k+ row range; at ~450 rows its own
        // overhead (scroll listener, position math, a re-render per scroll frame) is net-negative,
        // and -- more importantly -- it would break three things this table depends on:
        //   1. rowSpan grouping: Trade/Sub-Trade/Lane cells span many rows (spanned/withBlanks
        //      logic above processedData's return, ~line 4770 area). A window of only the
        //      visible rows makes a span incoherent unless spans are recomputed per-window,
        //      which changes what's actually rendered.
        //   2. The auto-fit `useLayoutEffect` (measures every `[data-autofit-col]` cell to size
        //      columns) -- with only a window's worth of rows in the DOM, column widths would
        //      shift as the user scrolls past rows that were never measured.
        //   3. tests/booking_flash_regression_tests.js, which asserts structural invariants by
        //      reading the live DOM (e.g. a parent row's value equals the sum of its children's).
        //      Rows that were never mounted silently turn those assertions into no-ops instead
        //      of failures.
        //
        // The REAL, measured symptom (W3's perf pass, PERFORMANCE_REVIEW.md's F5/F6) was
        // re-render COST, not DOM node count: a column-resize drag on this table re-rendered
        // every one of those ~450 rows on every animation frame, because there was no memo
        // boundary between the table header (the only part a column-width change actually
        // affects -- widths live on `<th style>`, `<td>` cells never set their own width) and
        // the body. tests/perf_benchmark.js's DRAG scenario (targets this exact table by
        // default -- FlashReportDashboard's `activeTab` initial state is 'detail') is the
        // reproducible proxy for this; see this file's own recorded before/after numbers in its
        // header comment.
        //
        // The fix applied here is memoization, not windowing: DetailTableRow/PolTableRow below
        // are each wrapped in React.memo so an unrelated state change (column-resize drag,
        // header-filter keystroke, tab switch, zoom, any of this file's other ~65 useState
        // hooks) skips re-rendering rows whose own data hasn't changed, while preserving every
        // row in the DOM -- rowSpan, the auto-fit pass, and the regression suite's structural
        // reads all keep working exactly as before because nothing is unmounted. This ONLY pays
        // off because `row` is a genuinely stable object reference across such renders --
        // `processedData`/`tableData` (Detail) and `polSpannedRows` (POL, below) are each a
        // `useMemo` keyed on upstream data only, so a row's identity is unchanged by a render
        // that doesn't touch that data. A React.memo fed a fresh object/array/inline-arrow prop
        // every render is pure overhead (an extra shallow-compare, zero skipped renders) -- see
        // this file's own F6 comments on SlicerBtn/SlicerClearBtn/PivotTableViewer (~line 575
        // onward) for the exact anti-pattern this must not repeat. Every prop below is either a
        // primitive (the `*Hidden` display-toggle booleans, `detailBlankRowColSpan`) or a
        // `useCallback`'d stable function reference (`showHoverTooltip`/`hideHoverTooltip`) --
        // do not add a prop here without confirming the same holds, or the memo wrap silently
        // becomes overhead instead of a fix.
        //
        // POL Booking Flash's table shares the same "no memo boundary" defect (confirmed by
        // W3's numbers, which found the identical unthrottled-mousemove-to-full-rerender shape
        // on its column resizer, backed by the same `makeColResizer` factory as Detail's), so
        // it gets the same treatment (PolTableRow, below) -- with one added wrinkle: unlike
        // Detail, this tab renders straight from `filteredRawRows` (see tableData's own comment
        // on `rfrMaxLdn` for why aggregation doesn't apply to this tab), and its sort/blank-row/
        // rowSpan computation used to run inline in the render body on EVERY render (not even
        // wrapped in a `useMemo`) -- so a column-resize drag or filter keystroke while on this
        // tab re-sorted and re-spanned the entire raw row set on every frame, independent of any
        // row-level memoization. `polSpannedRows` below fixes that half of the problem the same
        // way tableData/processedData already did for Detail.
        function DetailTableRow({

        }) {

                        {row.showLane && <td rowSpan={row.laneSpan} className="border border-gray-400 font-bold bg-[#bdd7ee] text-[#2f5597] align-top pt-0.5">{row.lane}</td>}
                        <td colSpan={detailBlankRowColSpan} className="border border-gray-400 bg-[#f3f3f3] dark:bg-gray-800 p-0.5 h-[22px]">&nbsp;</td>
                    </tr>
                );
            }

            const { isVMS, isAPOnly, isAPFrozen, isFlaggedRow, getBg, vmsBlank } = detailRowStatus(row);
            const rowStatusBadge = '';

            // Click-to-highlight (2026-09-14, per Kevin -- see the big comment on
            // highlightedRowIds above for the full design). getSelection() alone correctly
            // guards a click-and-drag selection (mousedown, drag, mouseup, click -- only ONE
            // click event, fired after the drag-selection already exists) but is NOT enough
            // for a genuine double-click: found by an independent Agent-tool verification pass
            // (2026-09-14) that a real double-click's FIRST click event fires before any
            // selection exists at all -- browsers only create the word-selection at the
            // SECOND mousedown, not before -- so that first click's toggle went through
            // unguarded, flipping the row's highlight as a side effect of double-clicking to
            // copy a word. Fixed with the standard single/double-click disambiguation
            // pattern: defer the toggle behind a short timer, and cancel it outright on
            // `onDoubleClick` -- a double-click (whose whole intent is text selection, not row
            // selection) never toggles the row at all, while an ordinary single click still
            // toggles after a short, barely-perceptible delay.
            const handleRowClick = () => {
                if (clickTimerRef.current) clearTimeout(clickTimerRef.current);
                clickTimerRef.current = setTimeout(() => {
                    clickTimerRef.current = null;
                    const sel = window.getSelection();
                    if (sel && sel.toString().length > 0) return;
                    onToggleRowHighlight(row.id);
                }, 300);
            };
            const handleRowDoubleClick = () => {
                if (clickTimerRef.current) { clearTimeout(clickTimerRef.current); clickTimerRef.current = null; }
            };
            // Outline rather than a background: nearly every <td> below already sets its own
            // explicit background (VMS grey, AP Frozen/AP Only colors, utilization-gap flags,
            // etc.), which would paint straight over a `<tr>`-level background and hide it.
            // An outline draws around the row's full bounding box in its own paint step, on
            // top of every cell's background, so it stays visible regardless of a row's other
            // color-coding -- and doesn't compete with what those colors mean.
            const highlightClass = isRowHighlighted ? 'outline outline-[3px] outline-[#E5007D] -outline-offset-[2px]' : '';
            // Freeze Panes (2026-09-14, per Kevin): when on, VVD is pinned to the left edge at
            // a fixed width (so Vessel Name's own sticky offset below has a known, constant
            // value to pin against -- this table's columns are otherwise fluid/auto-width, not
            // fixed), and Vessel Name is pinned right after it. Both already carry an opaque
            // background via getBg('bg-[#d9e1f2]', true) below, so scrolled-under columns
            // don't show through -- no separate background needed just for freezing.
            const vvdFreezeStyle = freezePanesEnabled ? { position: 'sticky', left: 0, width: 95, minWidth: 95, maxWidth: 95, zIndex: 1 } : undefined;
            const vesselFreezeStyle = freezePanesEnabled ? { position: 'sticky', left: 95, zIndex: 1 } : undefined;
            const freezeEdgeClass = freezePanesEnabled ? 'shadow-[2px_0_4px_rgba(0,0,0,0.25)]' : '';

            return (
                <tr className={highlightClass || undefined} onClick={handleRowClick} onDoubleClick={handleRowDoubleClick}>
                    {row.showTrade && <td rowSpan={row.tradeSpan} className="border border-gray-400 font-bold bg-white dark:bg-gray-800 align-top pt-0.5">{row.trade}</td>}
                    {row.showSub && <td rowSpan={row.subSpan} className="border border-gray-400 font-bold bg-[#e2efda] text-black align-top pt-0.5">{row.subTrade}</td>}
                    {row.showLane && <td rowSpan={row.laneSpan} className="border border-gray-400 font-bold bg-[#bdd7ee] text-[#2f5597] align-top pt-0.5">{row.lane}</td>}

                    <td className={`border border-gray-400 p-0.5 font-bold ${getBg('bg-white', true)}`}>{rowStatusBadge}{row.saleWeek}</td>
                    <td className={`border border-gray-400 p-0.5 ${getBg('bg-white', true)}`}>{row.pic}</td>
                    <td className={`border border-gray-400 p-0.5 ${getBg('bg-white', true)}`}>{formatDate(row.cutoff)}</td>
                    <td className={`border border-gray-400 p-0.5 ${getBg('bg-white', true)}`}>{formatDate(row.etd)}</td>
                    <td className={`border border-gray-400 p-0.5 ${getBg('bg-white', true)}`}>{row.statusDisplay}</td>
                    <td className={`border border-gray-400 p-0.5 font-bold text-black ${getBg('bg-[#d9e1f2]', true)} ${freezeEdgeClass}`} style={vvdFreezeStyle}>{row.vvd}</td>
                    <td className={`border border-gray-400 p-0.5 font-bold whitespace-nowrap text-black ${getBg('bg-[#d9e1f2]', true)} ${freezeEdgeClass}`} style={vesselFreezeStyle}>{row.vessel}</td>
                    <td className={`border border-gray-400 p-0.5 font-bold ${getBg('bg-white', true)}`}>{vmsBlank(row.maxLdn)}</td>
                    <td className={`border border-gray-400 p-0.5 ${getBg('bg-white', true)}`}>{vmsBlank(row.standby)}</td>
                    <td className={`border border-gray-400 p-0.5 font-bold text-black ${getBg('bg-[#d9e1f2]', true)}`}>{vmsBlank(row.curLaden)}</td>
                    <td className={`border border-gray-400 p-0.5 ${getBg('bg-white', true)}`} style={row.utilGapFlagged && !isVMS && !isAPOnly && !isAPFrozen ? row.utilGapStyle : {}} title={row.utilGapFlagged && !isVMS && !isAPOnly && !isAPFrozen ? 'Utilization increased by 10% or greater since the prior business day.' : undefined}>{vmsBlank(row.peakUtil)}</td>
                    <td className={`border border-gray-400 p-0.5 font-bold text-black ${getBg('bg-[#FDE9D9]', true)}`} style={row.utilGapFlagged && !isVMS && !isAPOnly && !isAPFrozen ? row.utilGapStyle : {}} title={row.utilGapFlagged && !isVMS && !isAPOnly && !isAPFrozen ? 'Utilization increased by 10% or greater since the prior business day.' : undefined}>{vmsBlank(row.curUtil)}</td>
                    {/* Class B fix (see HANDOFF.md / getBg's own comment above): the conditional
                        `text-red-600` used to be concatenated onto this template literal AFTER
                        getBg('bg-white', true)'s own bundled `text-black` (on VMS/AP ONLY/AP
                        FROZEN rows), leaving two same-specificity text-color utilities on one
                        cell whose winner depended on Tailwind's stylesheet insertion order, not
                        this code. Passing the red class into getBg lets it strip its own
                        text-black first, so the cell only ever carries the ONE text-color class
                        this code intends -- red when shortfallPositive, otherwise whatever
                        getBg would already have returned (text-black on a flagged row, or no
                        text-color override on a plain row). Confirmed via computed-style checks
                        that every previously-red cell stays red and every previously-black cell
                        stays black (see verification notes for this change). */}
                    <td className={`border border-gray-400 p-0.5 ${getBg('bg-white', true, row.shortfallPositive ? 'text-red-600' : '')}`}>{vmsBlank(row.shortfall)}</td>
                    <td className={`border border-gray-400 p-0.5 font-bold text-[#974706] ${isFlaggedRow ? '' : 'dark:text-amber-500'} ${getBg('bg-white', true)}`}>{vmsBlank(row.quote)}</td>
                    <td className={`border border-gray-400 p-0.5 text-[#2f5597] ${isFlaggedRow ? '' : 'dark:text-blue-400'} ${getBg('bg-white', true)}`}>{vmsBlank(formatNumberWithCommas(toNum(row.broken)))}</td>
                    {!bsaHidden && (
                        <>
                            <td className={`border border-gray-400 p-0.5 ${getBg('bg-white', true)}`}>{vmsBlank(row.bsaTeu)}</td>
                            <td className={`border border-gray-400 p-0.5 ${getBg('bg-white', true)}`}>{vmsBlank(row.bsaWgt)}</td>
                        </>
                    )}
                    {!reeferHidden && (
                        <>
                            <td className={`border border-gray-400 p-0.5 ${getBg('bg-white', true)}`}>{vmsBlank(formatNumberWithCommas(row.rfrBsaPlugs))}</td>
                            <td className={`border border-gray-400 p-0.5 ${getBg('bg-white', true)}`}>{vmsBlank(formatNumberWithCommas(row.rfrBkgPlugs))}</td>
                            <td className={`border border-gray-400 p-0.5 ${getBg('bg-white', true)}`}>{vmsBlank(formatNumberWithCommas(row.rfrMaxLdn))}</td>
                            <td className={`border border-gray-400 p-0.5 ${getBg('bg-white', true)}`}>{vmsBlank(formatNumberWithCommas(row.rfrBkgTtl))}</td>
                            <td className={`border border-gray-400 p-0.5 ${getBg('bg-white', true)}`}>{vmsBlank(row.rfrUtiliz)}</td>

                    {!activityHidden && (

                            <td className={`border border-gray-400 p-0.5 ${getBg('bg-[#E3ECF8] text-black', true)}`}>{vmsBlank(formatNumberWithCommas(row.inlandTotal))}</td>
                            <td className={`border border-gray-400 p-0.5 ${getBg('bg-[#C4BD97] text-black', true)}`}>{vmsBlank(formatNumberWithCommas(row.portAct))}</td>
                            <td className={`border border-gray-400 p-0.5 ${getBg('bg-[#C4BD97] text-black', true)}`}>{vmsBlank(formatNumberWithCommas(row.portNoAct))}</td>
                            <td className={`border border-gray-400 p-0.5 ${getBg('bg-[#E3ECF8] text-black', true)}`}>{vmsBlank(formatNumberWithCommas(row.portTotal))}</td>

                    {!opIssuesHidden && (

                    )}

                            <td className={`border border-gray-400 p-0.5 ${getBg('bg-[#DDD9C4] text-black', false)}`}>{vmsBlank(renderSecAlloc(row.sgsinDryVsRfr))}</td>

                            <td className={`border border-gray-400 py-0.5 text-left px-2 whitespace-nowrap cursor-default ${getBg('bg-[#DDD9C4] text-black', false)}`} onMouseEnter={showHoverTooltip(vmsBlank(row.actualRot), row.vvd)} onMouseLeave={hideHoverTooltip}>{vmsBlank(renderAsteriskHide(row.actualRot))}</td>

                            <td className={`border border-gray-400 p-0.5 ${getBg('bg-white', false)}`}>{vmsBlank(formatNumberWithCommas(row.lnt))}</td>
                            <td className={`border border-gray-400 p-0.5 ${getBg('bg-white', false)}`}>{vmsBlank(formatNumberWithCommas(row.imt))}</td>
                            <td className={`border border-gray-400 p-0.5 ${getBg('bg-white', false)}`}>{vmsBlank(formatNumberWithCommas(row.let))}</td>

                    )}
                    {!dgVolumeHidden && (

                    {!remarksHidden && (

                    )}
                </tr>
            );
        }
        const MemoDetailTableRow = React.memo(DetailTableRow);

        // Same extraction/memoization as DetailTableRow above, for the POL Booking Flash tab's
        // per-row rendering (see the shared writeup above this section for why). Uses the
        // hoisted polRowStatusInfo/polNumVal/polVmsBlank/polUtilGapClass helpers directly (pure
        // functions, no props needed for them).
        function PolTableRow({
            row, visibleColCount,
            showReefer, showActivity, showEta, showOpIssues, showVco,
            isRowHighlighted, onToggleRowHighlight
        }) {
            // Click-vs-double-click disambiguation timer -- see DetailTableRow's identical
            // clickTimerRef/handleRowClick/handleRowDoubleClick for the full reasoning.
            const clickTimerRef = useRef(null);
            if (row.isBlankRow) {
                return (
                    <tr>
                        {row.showTrade && <td rowSpan={row.tradeSpan} className="border border-gray-400 bg-white dark:bg-gray-800"></td>}
                        {row.showSub && <td rowSpan={row.subSpan} className="border border-gray-400 bg-[#e2efda]"></td>}
                        {row.showLane && <td rowSpan={row.laneSpan} className="border border-gray-400 bg-[#bdd7ee]"></td>}
                        <td colSpan={visibleColCount} className="border-0 bg-white dark:bg-gray-800 p-0.5 h-[22px]">&nbsp;</td>
                    </tr>
                );
            }
            const { bg, badge } = polRowStatusInfo(row);
            const bgNoText = bg.replace(/\btext-\S+\b/g, '').replace(/\s+/g, ' ').trim();
            // Click-to-highlight (2026-09-14, per Kevin) -- same mechanism as
            // DetailTableRow's handleRowClick above (see its comment for the full reasoning,
            // including the 2026-09-14 double-click fix): an outline rather than a background
            // so it stays visible on top of this table's own row-status coloring (`bg`), a
            // getSelection() guard so a click that ends a text-selection drag copies the
            // value without also toggling the row, and a short defer-and-cancel-on-dblclick
            // so a genuine double-click (whose first click fires before any selection exists)
            // doesn't toggle the row either.
            const handleRowClick = () => {
                if (clickTimerRef.current) clearTimeout(clickTimerRef.current);
                clickTimerRef.current = setTimeout(() => {
                    clickTimerRef.current = null;
                    const sel = window.getSelection();
                    if (sel && sel.toString().length > 0) return;
                    onToggleRowHighlight(row.id);
                }, 300);
            };
            const handleRowDoubleClick = () => {
                if (clickTimerRef.current) { clearTimeout(clickTimerRef.current); clickTimerRef.current = null; }
            };
            const highlightClass = isRowHighlighted ? ' outline outline-[3px] outline-[#E5007D] -outline-offset-[2px]' : '';
            return (
                <tr className={bg + highlightClass} onClick={handleRowClick} onDoubleClick={handleRowDoubleClick}>
                    {row.showTrade && <td data-autofit-col="trade" rowSpan={row.tradeSpan} className="border border-gray-400 font-bold bg-white dark:bg-gray-800 align-top pt-0.5">{row.trade}</td>}
                    {row.showSub && <td data-autofit-col="subTrade" rowSpan={row.subSpan} className="border border-gray-400 font-bold bg-[#e2efda] text-black align-top pt-0.5">{row.subTrade}</td>}
                    {row.showLane && <td data-autofit-col="lane" rowSpan={row.laneSpan} className="border border-gray-400 font-bold bg-[#bdd7ee] text-[#2f5597] align-top pt-0.5">{row.lane}</td>}
                    <td data-autofit-col="saleWeek" className={`border border-gray-400 p-0.5 ${bg}`}>{badge}{row.saleWeek}</td>
                    <td data-autofit-col="coastalEtd" className={`border border-gray-400 p-0.5 ${bg}`}>{formatDate(row.coastalEtd)}</td>
                    <td data-autofit-col="portCut" className={`border border-gray-400 p-0.5 ${bg}`}>{formatDate(row.portCut, row.coastalEtd)}</td>
                    <td data-autofit-col="loadingStatus" className={`border border-gray-400 p-0.5 ${bg}`}>{row.loadingStatusDisplay}</td>
                    <td data-autofit-col="vvd" className={`border border-gray-400 p-0.5 font-bold text-black ${bg || 'bg-[#d9e1f2]'}`}>{row.vvd}</td>

                    // cleanKey -> real header key, e.g. "salesweek" -> "Sale Week". When two
                    // headers clean to the same key, the later header WINS THE VALUE lookup but
                    // the key's position in insertion order is fixed by its FIRST occurrence --
                    // this exactly mirrors the old per-row `cleanRow[cleanK] = row[k]` forEach
                    // (later assignments overwrite the value, but a JS object's key order is set
                    // on first insert), so this map's key order matches the old per-row
                    // `cleanRowKeys` exactly.
                    const cleanKeyToRealKey = {};
                    headerRawKeys.forEach(k => {
                        const cleanK = String(k).toLowerCase().replace(/[^a-z0-9]/g, '');
                        cleanKeyToRealKey[cleanK] = k;
                    });
                    const cleanKeysInOrder = Object.keys(cleanKeyToRealKey);

                    // Resolve one getVal(aliases) call's candidate list of real column keys, once.
                    const resolveAliasCandidates = (aliases) => {
                        const candidates = [];
                        for (let alias of aliases) {
                            const cleanAlias = alias.toLowerCase().replace(/[^a-z0-9]/g, '');
                            if (Object.prototype.hasOwnProperty.call(cleanKeyToRealKey, cleanAlias)) {
                                candidates.push(cleanKeyToRealKey[cleanAlias]);
                            }
                        }
                        for (let alias of aliases) {
                            const cleanAlias = alias.toLowerCase().replace(/[^a-z0-9]/g, '');
                            if (cleanAlias.length < 3) continue;
                            const matchingCleanKey = cleanKeysInOrder.find(k => k.includes(cleanAlias));
                            if (matchingCleanKey) {
                                candidates.push(cleanKeyToRealKey[matchingCleanKey]);
                            }
                        }
                        return candidates;
                    };

                    // Cache keyed by the aliases array's own contents (there are ~84 distinct
                    // getVal([...]) call sites below, each invoked once per row) so each field's
                    // candidate list is resolved exactly once per parse no matter how many rows
                    // call it -- a Map lookup per field per row, not a regex per alias per row.
                    const aliasCandidateCache = new Map();
                    const getCandidatesFor = (aliases) => {
                        const cacheKey = JSON.stringify(aliases);
                        let candidates = aliasCandidateCache.get(cacheKey);
                        if (!candidates) {
                            candidates = resolveAliasCandidates(aliases);
                            aliasCandidateCache.set(cacheKey, candidates);
                        }
                        return candidates;
                    };

                    // Per-row lookup: walk the precomputed candidate list and take the first
                    // non-blank value -- exactly getVal()'s old fallthrough-on-blank behaviour
                    // (pass-1 candidates before pass-2 candidates, both in alias order), just
                    // against a short resolved list instead of re-deriving it from scratch.
                    const getValFromRow = (row, aliases) => {
                        const candidates = getCandidatesFor(aliases);
                        for (let i = 0; i < candidates.length; i++) {
                            const v = row[candidates[i]];
                            if (v !== undefined && v !== '') return v;
                        }
                        return '';
                    };

                    const formattedData = rawData.map((row, index) => {
                        const getVal = (aliases) => getValFromRow(row, aliases);

                        const rowObj = {
                            id: index + 1,
                            trade: getVal(['Vessel 1st Trade', 'Trade']) || 'TPT',
                            subTrade: getVal(['Vessel 1st Sub Trade', 'Sub Trade', 'SubTrade', 'Sub_Trade']),
                            lane: getVal(['Vessel 1st Lane', 'Lane']),

                            pic: getVal(['MCT PIC', 'MCT Spc Analyst', 'PIC (spc/mkg)', 'PIC', 'SPC Analyst']),
                            coast: getVal(['MCT Spc Team', 'Spc Team']),
                            cutoff: getVal(['Route Date Cut/off Date', '1st POL Cutoff', '1stPOLCutoff']),
                            etd: getVal(['Route Date Last Port ETD Date', 'ETD Last Port', 'ETDLastPort', 'Last Port ETD']),
                            status: normalizeApStatus(getVal(['Measures Overall Status', 'BKG FLASH STATUS', 'MeasuresOverallStatus'])),
                            statusDisplay: getVal(['Measures Overall Status', 'BKG FLASH STATUS', 'MeasuresOverallStatus']),
                            loadingStatus: normalizeApStatus(getVal(['Measures Loading Status', 'MeasuresLoadingStatus'])),
                            // Same statusDisplay pattern as status/statusDisplay above: loadingStatus

                            loadingStatusDisplay: getVal(['Measures Loading Status', 'MeasuresLoadingStatus']),
                            vvd: getVal(['Vessel 1st VVD', 'VVD']),

                            peakUtilRaw: getVal(['Measures Peak Overall Utilz']),

                            curUtilRaw: getVal(['Measures Overall Booking Utilz']),

                            broken: getVal(['Measures Broken Routes TEU', 'Broken Routes', 'Broken']),
                            bsaTeu: getVal(['Measures BSA TEU', 'BSA TEU']),
                            bsaWgt: getVal(['Measures Last NA Port BSA Wgt', 'Measures BSA WGT']),

                            rfrBkgPlugs: getVal(['Measures Booking Reefer UNIT', 'RFR BKG Plugs', 'Booking Reefer UNIT']),
                            // 2026-09-04 (explicit correction, reverting the 2026-09-03 remap
                            // below): Kevin confirmed "RFR Max Laden TEU" is the correct source
                            // for this DISPLAYED "RFR Max LDN"/"RFR Max Laden TEU" column --
                            // "Should b mapped to this field at the port level" -- i.e. it's
                            // SUPPOSED to vary per POL leg, not be a flat vessel-wide constant.
                            // The 2026-09-03 remap below mistook that per-leg variation (0/20/
                            // blank on real data, e.g. SROT0044S reads 20 at USHOU01 but 0 at
                            // USMIA01) for a data-quality problem and switched to "Measures BSA
                            // TEU RF" for its flat, always-58-per-vessel value -- but a flat
                            // vessel-wide reefer BSA capacity is a DIFFERENT metric from a
                            // per-port max laden allocation, not a fill-in for it; a port
                            // legitimately having 0 reefer allocation is valid business data,
                            // not a broken column. rfrBsaTeuRfMax (below) is untouched -- it
                            // feeds rfrUtilizRaw, a separate Detail-tab-only "RFR Utiliz %"
                            // aggregate metric (never rendered as "RFR Max Laden TEU" anywhere),
                            // so it's correctly still vessel-wide and out of scope for this fix.
                            rfrMaxLdn: getVal(['RFR Max Laden TEU', 'RFR Max LDN']),
                            rfrBkgTtl: getVal(['Measures Reefer TEU', 'RFR BKG TTL', 'RFR BKG Total']),
                            // POL Booking Flash's own "RFR BKG TEU" column reads a POL-scoped
                            // source ("Measures POL Reefer TEU"), a genuinely different column
                            // from rfrBkgTtl above ("Measures Reefer TEU", the OVERALL total --
                            // used by Booking Flash/Detail's "RFR BKG TTL"). Same POL-vs-overall
                            // split already made for curLaden/ladenTeu and peakPolUtilzRaw/
                            // peakUtilRaw. Narrow blast radius (6/899 rows in the reference
                            // dataset, all PAROD-related transship legs) but a real divergence --
                            // ported from booking_flash_report_na_Kevin_1.10_AUTO_REFRESH.html.
                            rfrBkgPol: getVal(['Measures POL Reefer TEU']),
                            rfrBsaTeuRfMax: getVal(['Measures BSA TEU RF']),
                            rfrUtilizPolRaw: getVal(['RFR Utilz%', 'Measures POL Reefer Utilz']),
                            actVsBkgUtilzRaw: getVal(['Activity vs Booking Utilz', 'ActVsBkg']),
                            actVsMaxLdnRaw: getVal(['Activity vs Max Laden', 'ActVsMax']),
                            inlandAct: getVal(['Measures Active Ipi TEU', 'Inland Activity', 'Active Ipi']),
                            inlandNoAct: getVal(['Measures Non Active Ipi TEU', 'Inland No Activity', 'Non Active Ipi']),
                            inlandTotal: getVal(['Measures Ipi Total TEU', 'Inland Total', 'Ipi Total']),
                            portAct: getVal(['Measures Active Local TEU', 'Port Activity', 'Active Local']),
                            portNoAct: getVal(['Measures Non Active Loc TEU', 'Port No Activity', 'Non Active Local']),
                            portTotal: getVal(['Measures Local Total TEU', 'Port Total', 'Local Total']),
                            activeTotalTeu: getVal(['Measures Active total TEU', 'Active total TEU']),
                            past4WeekFlag: getVal(['Route Date Past 4 Week Flag']),
                            opIssues: getVal(['Vessel Operation Notice', 'Operational Issues', 'Operation Notice']),
                            secAlloc: getVal(['MCT Sector Allocation', 'Sector Allocation', 'Sec Alloc']),
                            sgsinDryVsRfr: getVal(['Measures SGSIN Sector Remarks', 'SGSIN Dry vs Reefer', 'SGSIN Dry vs Rfr']),
                            proformaRot: getVal(['Route Location Rotation Port', 'Proforma Rotation']),
                            actualRot: getVal(['Route Location Actual Rotation Port', 'Actual Rotation', 'Actual Ro']),
                            apStatus: getVal(['MCT AP Status', 'AP Status']),
                            tpt: getVal(['Measures TPT', 'TPT']),
                            tat: getVal(['Measures TAT']),
                            lwt: getVal(['Measures LWT', 'LWT']),
                            lnt: getVal(['Measures LNT', 'LNT']),
                            imt: getVal(['Measures IMT', 'IMT']),
                            let: getVal(['Measures LET']),
                            dgTeu: getVal(['Measures DG TEU', 'DG TEU']),
                            remarks: getVal(['Vessel Voyage Remark', 'Voyage Remarks']),
                            vco: getVal(['VCO Analyst', 'VCO Analyst ', 'VCO']),
                            lastCoastalEta: getVal(['Route Date Last Coastal ETA Time', 'Last Coastal ETA Time']),
                            proformaEta: getVal(['Route Date Proforma ETA Time', 'Proforma ETA Time']),
                            coastalEtaVsProforma: getVal(['Route Date Coastal ETA vs Proforma', 'Coastal ETA vs Proforma']),
                            // '1st Pol'/'POL' deliberately NOT kept as fallback aliases -- both
                            // fuzzy-match the real (but wrong, coarser) 'Route Location 1st Pol'
                            // column via getVal()'s substring-fallback pass (confirmed by
                            // tests/check_alias_landmines.py, ported from the same fix on
                            // booking_flash_report_na_Kevin_1.10_AUTO_REFRESH.html), which would
                            // silently reintroduce the old bug (POL column collapsing distinct
                            // terminals like USLAX01/06/08 into one bare "USLAX") on any row
                            // where 'Route Location 1st Yard' is blank -- the Class E landmine
                            // pattern. 'Route Location 1st Yard' alone matches this file's real
                            // header exactly, same as `yard` below.
                            pol: getVal(['Route Location 1st Yard']),
                            yard: getVal(['Route Location 1st Yard', 'RouteLocation1stYard', 'Yard']),
                            plannedMty: getVal(['Measures Planned Mty TEU', 'Planned Mty']),
                            actualMty: getVal(['Measures Actual Mty TEU', 'Actual Mty']),
                            polMaxLdn: getVal(['POL Max Laden TEU', 'POL Max Laden']),
                            polLdnThresh: getVal(['POL Laden Threshold', 'POL Laden Thresh']),
                            discharge: getVal(['Measures Discharge TEU', 'Discharge']),
                            peakPolUtilzRaw: getVal(['Measures Peak Pol Utilz', 'Peak Pol Utilz']),
                            polBkgUtilzRaw: getVal(['Measures POL Booking Utilz', 'POL Booking Utilz']),
                            maxLdnVsPolBkg: getVal(['Max Laden vs POL  Booking', 'Max Laden vs POL Booking']),
                            loadableQuant: getVal(['Measures Loadable TEU', 'Loadable Quant', 'Loadable TEU']),
                            loadableWgt: getVal(['Measures Loadable WGT update', 'Loadable WGT']),
                            coastalEtd: getVal(['Route Date Coastal ETD Date', 'Coastal ETD Date', 'Coastal ETD']),
                            portCut: getVal(['Route Date POL Cut/off Date', 'POL Cut/off Date', 'Port Cut']),
                            sectorRemarks: getVal(['Sector Remarks']),
                            tsAvgBooking: getVal(['Trade Summary Avg Booking']),
                            tsAvgMaxLdn: getVal(['Trade Summary Avg Max Laden'])
                        };

                        rowObj.pic = (rowObj.pic && String(rowObj.pic).trim()) || 'TBA';

                        const activeTotalTeuNum = toNum(rowObj.activeTotalTeu);
                        const ladenTeuNum = toNum(rowObj.ladenTeu);
                        rowObj.actVsBkgUtilzRaw = ladenTeuNum > 0 ? (activeTotalTeuNum / ladenTeuNum) : 0;

                        const rfrBsaTeuRfMax = toNum(rowObj.rfrBsaTeuRfMax);
                        rowObj.rfrUtilizRaw = rfrBsaTeuRfMax > 0 ? (toNum(rowObj.rfrBkgTtl) / rfrBsaTeuRfMax) : 0;

                        return rowObj;
                    });

                    return { ok: true, rows: formattedData };
                }
                return { ok: false, error: 'The file appears to be empty.' };
            };

            const processFile = (file) => {
                if (!file) return;

                if (!window.XLSX) {
                    console.error("XLSX library is not loaded.");
                    setParseError("Unable to read the file: the XLSX library failed to load. Please refresh the page and try again.");
                    return;
                }

                // 2026-09-08, per Kevin: a manually-uploaded .csv export had the exact same
                // "dates one day early" bug as the live CSV_SOURCE_URL fetch (applyCsvText's
                // own comment has the full root-cause writeup: SheetJS's CSV parser
                // auto-detects an ISO-shaped date cell and round-trips it through a
                // UTC-anchored Date object, shifting it back a day in any timezone behind
                // UTC). This function was reading EVERY upload -- .csv or .xlsx alike -- as
                // a binary string and never passing `raw: true`, so a .csv upload hit the
                // identical bug. A real .xlsx/.xls upload does NOT have this bug (its date
                // cells are already properly-typed Excel serials, not text SheetJS has to
                // guess at) -- and forcing raw:true on a real workbook would instead make
                // its genuinely date-typed cells come back as bare serial numbers instead of
                // formatted text, breaking every date column on an Excel upload. So only a
                // .csv file switches to the same text-read + raw:true shape applyCsvText
                // uses; .xlsx/.xls keeps the pre-existing binary-string read untouched.
                const isCsv = /\.csv$/i.test(file.name || '');
                const reader = new FileReader();
                reader.onload = (evt) => {
                    try {
                        const wb = isCsv
                            ? window.XLSX.read(evt.target.result, { type: 'string', raw: true })
                            : window.XLSX.read(evt.target.result, { type: 'binary' });
                        const result = parseWorkbookToRows(wb);
                        if (result.ok) {
                            setRawRows(result.rows);
                            setParseError(null);
                            setAutoFetchError(null);
                            setLastRefresh(new Date());
                            setNewDataAvailable(false);
                            pendingCsvTextRef.current = null;
                            hasLoadedDataRef.current = true;
                            // 2026-09-1x (W11 sequence-guard follow-up): a manual upload
                            // doesn't fetch a URL, so it never claims a csvApplySeqRef
                            // ticket the normal way -- bump the shared counter directly
                            // here instead, so any CSV-pipeline fetch already in flight
                            // (initial load, a poll, or a manual "Refresh Now") that
                            // hasn't committed yet will find its own ticket stale the
                            // moment it tries to, and correctly back off rather than
                            // overwriting this deliberate upload with older live-CSV
                            // data. See csvApplySeqRef's own big comment (near
                            // pendingCsvTextRef) for the full design.
                            csvApplySeqRef.current++;
                            // This IS the live dataset now -- keep liveRawRowsRef in sync (see
                            // its own comment) and drop out of historical-viewing mode if it
                            // was active, since a genuine new upload should always win over
                            // whatever historical date happened to be on screen.
                            liveRawRowsRef.current = result.rows;
                            setViewingHistoricalDate(null);
                        } else {
                            setParseError(result.error);
                        }
                        if (fileInputRef.current) fileInputRef.current.value = '';
                    } catch (error) {
                        console.error("Error parsing the file:", error);
                        setParseError(`Failed to parse the uploaded file: ${error && error.message ? error.message : 'unknown error'}. Please verify the file is a valid Excel export and try again.`);
                        if (fileInputRef.current) fileInputRef.current.value = '';
                    }
                };
                if (isCsv) reader.readAsText(file); else reader.readAsBinaryString(file);
            };

            const handleFileUpload = (e) => {
                processFile(e.target.files[0]);
            };

            const handleDrop = (e) => {
                e.preventDefault();
                setIsDragging(false);
                if (e.dataTransfer.files && e.dataTransfer.files.length > 0) {
                    processFile(e.dataTransfer.files[0]);
                    e.dataTransfer.clearData();
                }
            };

            const processOldFile = (file) => {
                if (!file) return;
                if (!window.XLSX) {
                    setOldParseError("Unable to read the file: the XLSX library failed to load. Please refresh the page and try again.");
                    return;
                }
                // Same .csv-vs-.xlsx branch as processFile above, same reason -- see its
                // own comment for the full root-cause writeup.
                const isCsv = /\.csv$/i.test(file.name || '');
                const reader = new FileReader();
                reader.onload = (evt) => {
                    try {
                        const wb = isCsv
                            ? window.XLSX.read(evt.target.result, { type: 'string', raw: true })
                            : window.XLSX.read(evt.target.result, { type: 'binary' });
                        const result = parseWorkbookToRows(wb);
                        if (result.ok) {
                            setOldRawRows(result.rows);
                            setOldFileName(file.name);
                            setOldParseError(null);
                        } else {
                            setOldParseError(result.error);
                        }
                        if (oldFileInputRef.current) oldFileInputRef.current.value = '';
                    } catch (error) {
                        console.error("Error parsing the old file:", error);
                        setOldParseError(`Failed to parse the file: ${error && error.message ? error.message : 'unknown error'}. Please verify it's a valid Booking Flash export.`);
                        if (oldFileInputRef.current) oldFileInputRef.current.value = '';
                    }
                };
                if (isCsv) reader.readAsText(file); else reader.readAsBinaryString(file);
            };

            const handleOldFileUpload = (e) => {
                processOldFile(e.target.files[0]);
            };

            const clearOldFile = () => {
                setOldRawRows([]);
                setOldFileName(null);
                setOldParseError(null);
            };

            // --- Historical Data (2026-09-01): view any past day's export as the live
            // report, or compare two past days, from HISTORICAL_DATA_CSV_URL's rolling
            // daily-snapshot archive -- see that constant's own comment for the source
            // shape and DATA_ARCHITECTURE.md for the parsed field mapping.

            // Record Date normalization: SheetJS's CSV reader auto-detects this column
            // as a date type (its raw text, e.g. "2026-08-24", looks like a date to it)
            // and reformats it via sheet_to_json's raw:false default short-date display
            // ("8/24/26"), NOT the original ISO string in the file -- confirmed live
            // against the real published link (ws['A2'] comes back {t:'n', v:46258,
            // w:"8/24/26"}). Grouping/sorting/displaying by that short-date string would
            // be wrong once single- and double-digit days mix (plain string sort puts
            // "8/9/26" after "8/10/26", not before it) -- so a parallel raw:true pass
            // recovers the underlying Excel date serial and this converts it back to a
            // stable, correctly-sortable 'YYYY-MM-DD' key via XLSX.SSF.parse_date_code
            // (the same SSF module SheetJS itself uses to build that "8/24/26" display
            // string, just applied with a format this app controls instead of SheetJS's
            // default). Falls back to the plain string value on anything that isn't a
            // date-typed cell, so a future export where this column somehow ISN'T
            // auto-detected as a date still groups/sorts correctly on its literal text.
            const normalizeRecordDate = (value) => {
                if (typeof value === 'number' && window.XLSX && window.XLSX.SSF && window.XLSX.SSF.parse_date_code) {
                    const d = window.XLSX.SSF.parse_date_code(value);
                    if (d && d.y) {
                        const pad = (n) => String(n).padStart(2, '0');
                        return `${d.y}-${pad(d.m)}-${pad(d.d)}`;
                    }
                }
                return String(value || '').trim();
            };

            // Fetch + group the archive once on mount (see the effect below) -- this is
            // a manually-triggered feature (a user has to open the popover and pick a
            // date), not something needing CSV_SOURCE_URL's 10-minute poll, so there's
            // no interval here, just an initial load plus the "Refresh Historical List"
            // button in the popover for whenever Hoa has appended a new day since the
            // page loaded.
            const fetchHistoricalData = async () => {
                if (!isHistoricalCsvSourceConfigured()) return;
                // 2026-09-1x (W11 sequence-guard follow-up): three independent call
                // sites can trigger this with no ordering between them -- the
                // mount effect, every time historicalDataOpen flips true (rapidly
                // opening/closing the popover can fire overlapping fetches), and the
                // "Refresh Historical List" button. Uses its OWN independent counter
                // (historicalApplySeqRef), not csvApplySeqRef/sectorApplySeqRef -- this
                // commits to setHistoricalRowsByDate/setHistoricalDates/
                // historicalParsedCacheRef, state slots none of the other pipelines
                // touch. See csvApplySeqRef's own big comment (near pendingCsvTextRef)
                // for the shared design.
                const mySeq = ++historicalApplySeqRef.current;
                try {
                    const res = await fetch(HISTORICAL_DATA_CSV_URL, { cache: 'no-store' });
                    if (!res.ok) throw new Error(`Fetch failed with status ${res.status}`);
                    const csvText = await res.text();
