        // getPercentNum / formatPercent are only ever applied to raw columns that Power
        // Query casts to Percentage.Type (curUtilRaw <- "Measures Overall Booking Utilz",
        // peakUtilRaw <- "Measures Peak Overall Utilz", standbyRaw <- "Trunk Threshold",
        // rfrUtilizRaw <- "Measures POL Reefer Utilz", plus the computed actVsBkgUtilzRaw
        // ratio) - i.e. always fractional decimals (0.75 = 75%), never bare whole-number
        // percents. Verified against Booking_Flash_Data_MAIN_UPLOAD_8-12-2026.xlsx: every
        // sampled value in these columns (899/899 rows) is a plain fractional decimal, and
        // two real rows have values up to 8.0 (=800%, e.g. rows 161 & 329 in "Measures POL
        // Reefer Utilz"/"RFR Utilz%") - well outside the old "(0,5] must be fractional"
        // guess, which would have silently left those rendered as "8%" instead of "800%".
        // So we trust the known column type and scale unconditionally instead of guessing
        // from the value's magnitude.
        const getPercentNum = (val) => {
            if (!val) return 0;
            let s = String(val).trim();
            if (s.includes('%')) return parseFloat(s) || 0;
            let n = parseFloat(s);
            if (isNaN(n)) return 0;
            return n * 100;
        };

        const formatPercent = (val) => {
            if (val === '' || val === null || val === undefined) return '';
            let strVal = String(val).trim();
            if (strVal.includes('%')) {
                const parsed = parseFloat(strVal);
                return isNaN(parsed) ? strVal : `${Math.round(parsed)}%`;
            }
            let num = parseFloat(strVal);
            if (!isNaN(num)) {
                return `${Math.round(num * 100)}%`;
            }
            return strVal;
        };

        const formatNumberWithCommas = (val) => {
            if (val === '' || val === null || val === undefined || isNaN(val)) return val;
            return Math.round(parseFloat(val)).toLocaleString('en-US');
        };

        const formatAccountingNumber = (val) => {
            if (val === '' || val === null || val === undefined || isNaN(val)) return val;
            const num = Math.round(parseFloat(val));
            if (num < 0) {
                return `(-${Math.abs(num).toLocaleString('en-US')})`;
            }
            return num.toLocaleString('en-US');
        };

        // Native Excel Conditional Formatting rule (Booking_Flash!N13:O47 and
        // POL_Booking_Flash!V13:W2000): ($Current-$Peak) > 10 percentage points -> solid
        // red fill on BOTH the Peak and Current Laden Utiliz % cells. Both inputs here are
        // expected already on the 0-100 percent-point scale (not 0-1 fractions) — matching
        // how this file's `calc` fields and the PivotTableViewer's raw-field parsing both
        // already produce/consume percent values.
        const isUtilGapFlagged = (currentUtilz, peakUtilz) => {
            const cur = Number(currentUtilz) || 0;
            const peak = Number(peakUtilz) || 0;
            return (cur - peak) > 10;
        };
        const utilGapCellClass = (currentUtilz, peakUtilz) =>
            isUtilGapFlagged(currentUtilz, peakUtilz) ? 'bg-red-600 text-white font-bold' : '';

        function compareSaleWeek(a, b) {
            const parse = (s) => {
                const m = /^(\d{4})\/W(\d{1,2})$/.exec(String(s || '').trim());
                return m ? [parseInt(m[1], 10), parseInt(m[2], 10)] : null;
            };
            const pa = parse(a), pb = parse(b);
            if (pa && pb) {
                if (pa[0] !== pb[0]) return pa[0] - pb[0];
                return pa[1] - pb[1];
            }
            // fallback: keep unparseable/blank values sorted after real weeks, else lexicographic
            if (pa && !pb) return -1;
            if (!pa && pb) return 1;
            return String(a || '').localeCompare(String(b || ''));
        }

        // Sector Allocation text formatting: bold known port/lane keyword labels,
        // color numeric "+N*"/"(-N*)" deltas red, and blank out a cell that is
        // literally just "*".
        const SEC_ALLOC_BOLD_KEYWORDS = [
            "AEJEA:", "CNNGB:", "CNSHA:", "CNSHK:", "CR/GT/NI Discharge:", "EB PA Load:",
            "FRFOS/ESVLC Discharge:", "GRPIR:", "INPAV:", "KRPUS:", "LATAM Load:", "MX Laden:",
            "PA Load:", "PAROD Discharge :", "PAROD Move Count Unit:", "LKCMB:", "SGSIN:",
            "BEANR:", "DEBRV:", "DEHAM:", "FRLEH:", "GBSOU:", "LATAM:", "NLRTM:", "THLCH:",
            "VNCMP:", "ESALG:", "ESVLC:", "FRFOS:", "ITGOA:", "ITSPE:", "Laden:", "ITSAL:",
            "TRALI:", "TRISK:", "TRIST:", "INNSA:", "MTY:", "PAROD Discharge:"
        ];

        const renderSecAlloc = (text) => {
            if (text === null || text === undefined || text === '') return text;
            const raw = String(text);
            if (raw.trim() === '*') return null;

            const escapeRegex = (s) => s.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
            // Longer keywords first so e.g. "PAROD Discharge :" wins over a shorter overlapping alternative.
            const sortedKeywords = [...SEC_ALLOC_BOLD_KEYWORDS].sort((a, b) => b.length - a.length);
            const keywordPattern = sortedKeywords.map(escapeRegex).join('|');
            const redPattern = '\\+\\d+\\*+|\\(-\\d+\\*+\\)';
            const combined = new RegExp(`(${keywordPattern})|(${redPattern})`, 'gi');

            const parts = [];
            let lastIndex = 0;
            let match;
            let key = 0;
            while ((match = combined.exec(raw)) !== null) {
                if (match.index > lastIndex) {
                    parts.push(<React.Fragment key={key++}>{raw.slice(lastIndex, match.index)}</React.Fragment>);
                }
                if (match[1]) {
                    parts.push(<b key={key++}>{match[1]}</b>);
                } else if (match[2]) {
                    parts.push(<span key={key++} className="text-red-600 font-semibold">{match[2]}</span>);
                }
                lastIndex = combined.lastIndex;
                if (match.index === combined.lastIndex) combined.lastIndex += 1;
            }
            if (lastIndex < raw.length) {
                parts.push(<React.Fragment key={key++}>{raw.slice(lastIndex)}</React.Fragment>);
            }
            return parts;
        };

        // Lighter-weight companion to renderSecAlloc: applies only the VBA
        // "hide lone asterisk" rule (Trim(cell.Text) = "*" -> blank), with no
        // bold-keyword or red-delta formatting. Used on Detail View columns
        // that are in the AH13:AN asterisk-blanking range but NOT in the
        // AI13:AJ bold/red range (Operational Issues, Proforma Rotation,
        // Actual Rotation, AP Status, Voyage Remarks).
        const renderAsteriskHide = (text) => {
            if (text === null || text === undefined || text === '') return text;
            const raw = String(text);
            if (raw.trim() === '*') return null;
            return raw;
        };


                const PivotTableViewer = ({ data, config }) => {
            const [collapsedNodes, setCollapsedNodes] = useState(new Set());
            const toggleCollapse = (nodeId) => {
                const next = new Set(collapsedNodes);
                if (next.has(nodeId)) next.delete(nodeId);
                else next.add(nodeId);
                setCollapsedNodes(next);
            };
            const { rowFields = [], dataFields = [], title = "Pivot", colField = null, valuesInRows = false, rowClass = null } = config;
            
            const aggregated = useMemo(() => {
                const root = { _totals: {}, _children: {}, label: 'Grand Total', context: {} };
                const colKeysSet = new Set();
                
                data.forEach(row => {
                    if (colField) {
                        const colVal = row[colField] || '(blank)';
                        colKeysSet.add(colVal);
                    }
                    
                    let current = root;
                    
                    const aggregateData = (node, r, colVal = 'Total') => {
                        if (!node._totals[colVal]) {
                            node._totals[colVal] = {};
                            dataFields.forEach(df => {
                                node._totals[colVal][df.name] = { sum: 0, count: 0, max: -Infinity };
                            });
                        }
                        dataFields.forEach(df => {
                            const val = parseFloat(String(r[df.base] || '0').replace(/[,%()]/g, '')) || 0;
                            node._totals[colVal][df.name].sum += val;
                            node._totals[colVal][df.name].count += 1;
                            if (val > node._totals[colVal][df.name].max) node._totals[colVal][df.name].max = val;
                        });
                    };
                    
                    const cVal = colField ? (row[colField] || '(blank)') : 'Total';
                    
                    // Aggregate root
                    aggregateData(root, row, 'Total');
                    if (colField) aggregateData(root, row, cVal);
                    
                    rowFields.forEach((rf, idx) => {
                        const val = row[rf.key] || '(blank)';
                        if (!current._children[val]) {
                            current._children[val] = { _totals: {}, _children: {}, label: val, context: { ...current.context, [rf.key]: row[rf.key] } };
                        }
                        
                        current = current._children[val];
                        aggregateData(current, row, 'Total');
                        if (colField) aggregateData(current, row, cVal);
                    });
                });
                
                const colKeys = Array.from(colKeysSet).sort(compareSaleWeek);

                // Parent-level (e.g. Trade) subtotal rollup for fields that opt in via
                // `rollupSumOfChildren: true`. By default every node's _totals (at every
                // level, including intermediate parent nodes) is aggregated directly from
                // the raw rows beneath it — correct for 'sum'/'count'/'avg' fields (sum of
                // raw rows always equals sum of children's sums), and mathematically still
                // a valid "further max" for 'max' fields. Verified against
                // validation_ground_truth.json's Trade_Summary `trade_total` rows, though,
                // that a Trade-level subtotal of a max-aggregated field (e.g. "Max Laden")
                // is actually the SUM of its Sub Trades' own max values, not a further max
                // across all raw rows (e.g. TPT Max Laden 2026/W27 = 18800+3725+28045 =
                // 50570, matching ground truth exactly — not max(18800,3725,28045)=28045).
                // 'calc' fields (e.g. Trunk Utilization = Total TEU / Max Laden) need no
                // separate handling: they read from these same _totals at render time, so
                // once the underlying 'max' field is rolled up correctly the ratio is too
                // (verified: 17763 / 50570 = 0.3512557 matches ground truth's TPT Trunk
                // Utilization trade_total for 2026/W27 exactly).
                const rollupFields = dataFields.filter(df => df.rollupSumOfChildren && df.agg === 'max');
                if (rollupFields.length > 0) {
                    const applyRollup = (node) => {
                        const childNodes = Object.values(node._children);
                        childNodes.forEach(applyRollup); // post-order: children resolved first
                        if (childNodes.length === 0) return; // leaf: keep raw-aggregated value
                        rollupFields.forEach(df => {
                            const colVals = new Set(Object.keys(node._totals));
                            childNodes.forEach(c => Object.keys(c._totals).forEach(cv => colVals.add(cv)));
                            colVals.forEach(colVal => {
                                if (!node._totals[colVal] || !node._totals[colVal][df.name]) return;
                                let sum = 0;
                                childNodes.forEach(c => {
                                    const ct = c._totals[colVal] && c._totals[colVal][df.name];
                                    if (ct) sum += ct.max;
                                });
                                node._totals[colVal][df.name].max = sum;
                            });
                        });
                    };
                    applyRollup(root);
                }

                return { root, colKeys };
            }, [data, config]);
            
            const flatten = (node, level = 0, isLastChild = true, prefix = '', parentId = 'root') => {
                let rows = [];
                const nodeId = `${parentId}-${node.label}`;
                const hasChildren = Object.keys(node._children).length > 0;
                rows.push({
                    id: nodeId,
                    level,
                    label: node.label,
                    totals: node._totals,
                    context: node.context,
                    isLastChild,
                    prefix,
                    hasChildren
                });
                
                if (collapsedNodes.has(nodeId)) return rows;
                
                const childrenKeys = rowFields[level] && rowFields[level].key === 'saleWeek'
                    ? Object.keys(node._children).sort(compareSaleWeek)
                    : Object.keys(node._children).sort();
                childrenKeys.forEach((key, index) => {
                    const isLast = index === childrenKeys.length - 1;
                    const newPrefix = prefix + (isLastChild ? '    ' : '│   ');
                    rows = rows.concat(flatten(node._children[key], level + 1, isLast, newPrefix, nodeId));
                });
                return rows;
            };
            
            const renderRows = useMemo(() => {
                if (!aggregated.root || Object.keys(aggregated.root._totals).length === 0) return [];
                return flatten(aggregated.root, 0, true, '');
            }, [aggregated]);
            
            const colKeysToRender = colField ? aggregated.colKeys : ['Total'];
            
            return (
                <div className="border-2 border-black overflow-x-auto bg-white shadow-md mb-4">
                    <h2 className="text-xl font-bold bg-[#002060] text-white p-2 flex justify-between">

                        {colField && <span className="text-sm font-normal self-end">Columns: {colField}</span>}
                    </h2>
                    <table className="w-full text-xs text-center border-collapse border border-gray-400 whitespace-nowrap">

                            {colField && !valuesInRows && (
                                <tr>
                                    <th className="border border-black p-1 min-w-[200px] text-left">Row Labels</th>
                                    {colKeysToRender.map((c, i) => (
                                        <th key={i} colSpan={dataFields.length} className="border border-black p-1 bg-[#1e2f50]">{c}</th>
                                    ))}
                                    <th colSpan={dataFields.length} className="border border-black p-1 font-bold">Grand Total</th>
                                </tr>
                            )}
                            <tr>
                                <th className="border border-black p-1 min-w-[200px] text-left">Row Labels</th>
                                {colField && valuesInRows && (
                                    <>
                                        <th className="border border-black p-1 bg-[#1e2f50]">Values</th>
                                        {colKeysToRender.map((c, i) => (
                                            <th key={i} className="border border-black p-1 bg-[#1e2f50]">{c}</th>
                                        ))}
                                        <th className="border border-black p-1 font-bold">Grand Total</th>
                                    </>
                                )}
                                {(!colField || !valuesInRows) && (colField ? [...colKeysToRender, 'Total'] : ['Total']).map((cKey) => (
                                    dataFields.map((df, dfIdx) => (
                                        <th key={`${cKey}-${dfIdx}`} className={`border border-black p-1 min-w-[80px] ${cKey === 'Total' && colField ? 'font-bold bg-[#203764]' : ''}`}>{df.label}</th>
                                    ))
                                ))}
                            </tr>
                        </thead>
                        <tbody>
                            {renderRows.map((row, i) => {
                                const trClassBase = `hover:bg-gray-100 ${row.level === 0 ? 'bg-[#d9e1f2] font-bold' : ''} ${row.level === 1 ? 'font-bold' : ''}`;
                                const customClass = rowClass && row.level === rowFields.length ? rowClass(row.totals, row.context) : '';
                                
                                if (valuesInRows) {
                                    return (
                                        <React.Fragment key={i}>
                                            <tr className={`${trClassBase} ${customClass} ${row.level === 0 ? 'bg-[#d9e1f2] font-bold' : ''}`}>
                                                <td rowSpan={dataFields.length + 1} className="border border-gray-400 p-1 text-left align-top">
                                                    <span style={{ paddingLeft: `${Math.max(0, row.level - 1) * 1.5}rem` }} className="flex items-center">
                                                        {row.level > 0 && (row.hasChildren 
                                                            ? <button onClick={() => toggleCollapse(row.id)} className="mr-1 w-4 text-center border border-gray-400 bg-white shadow-sm font-bold text-[10px] leading-tight hover:bg-gray-200">{collapsedNodes.has(row.id) ? '+' : '−'}</button>
                                                            : <span className="mr-1 w-4 text-center inline-block">•</span>
                                                        )}
                                                        {row.label}
                                                    </span>
                                                </td>
                                                {/* Fill the empty cells for the parent header row so borders connect */}
                                                <td className="border border-gray-400 p-1 bg-gray-100"></td>
                                                {[...colKeysToRender, 'Total'].map((cKey, cIdx) => (
                                                    <td key={`empty-${cIdx}`} className="border border-gray-400 p-1 bg-gray-100"></td>
                                                ))}
                                            </tr>
                                            {dataFields.map((df, dfIdx) => (
                                                <tr key={`${i}-${dfIdx}`} className={`${customClass || 'bg-white hover:bg-gray-50'}`}>
                                                    <td className="border border-gray-400 p-1 text-left bg-gray-100 font-semibold">{df.label}</td>
                                                    {[...colKeysToRender, 'Total'].map((cKey, cIdx) => {
                                                        let val = 0;
                                                        const tGrp = row.totals[cKey] || {};
                                                        if (df.agg === 'calc' && df.calc) {
                                                            val = df.calc(tGrp);
                                                        } else {
                                                            const t = tGrp[df.name] || { sum: 0, max: 0, count: 0 };
                                                            if (df.agg === 'sum') val = t.sum;
                                                            if (df.agg === 'max') val = t.max;
                                                            if (df.agg === 'count') val = t.count;
                                                            if (df.agg === 'avg') val = t.count > 0 ? t.sum / t.count : 0;
                                                        }
                                                        
                                                        let displayVal = val;
                                                        if (df.format === 'number') displayVal = formatNumberWithCommas(val);
                                                        else if (df.format === 'percent') displayVal = `${Math.round(val)}%`;
                                                        else if (df.format === 'accounting') displayVal = formatAccountingNumber(val);
                                                        
                                                        // Backward-compatible extension: pass the row's full totals
                                                        // bundle (tGrp) as a 2nd arg so cellClass callbacks that need
                                                        // to compare sibling fields (e.g. Peak vs Current Utiliz %)
                                                        // can do so; existing single-arg callbacks just ignore it.
                                                        const cClass = df.cellClass ? df.cellClass(val, tGrp) : '';
                                                        return <td key={cIdx} className={`border border-gray-400 p-1 ${cKey === 'Total' ? 'font-bold bg-[#eef2fa]' : ''} ${cClass}`}>{displayVal}</td>;
                                                    })}
                                                </tr>
                                            ))}
                                        </React.Fragment>
                                    );
                                }
                                
                                return (
                                    <tr key={i} className={`${trClassBase} ${customClass}`}>
                                        <td className="border border-gray-400 p-1 text-left">
                                            <span style={{ paddingLeft: `${Math.max(0, row.level - 1) * 1.5}rem` }}>
                                                {row.level > 0 && (row.hasChildren
                                                    ? <span onClick={() => toggleCollapse(row.id)} className="cursor-pointer select-none hover:text-blue-700">{collapsedNodes.has(row.id) ? '▶ ' : '▼ '}</span>
                                                    : '• '
                                                )}
                                                {row.label}
                                            </span>
                                        </td>
                                        {(colField ? [...colKeysToRender, 'Total'] : ['Total']).map((cKey) => (
                                            dataFields.map((df, colIdx) => {
                                                let val = 0;
                                                const tGrp = row.totals[cKey] || {};
                                                if (df.agg === 'calc' && df.calc) {
                                                    val = df.calc(tGrp);
                                                } else {
                                                    const t = tGrp[df.name] || { sum: 0, max: 0, count: 0 };
                                                    if (df.agg === 'sum') val = t.sum;
                                                    if (df.agg === 'max') val = t.max;
                                                    if (df.agg === 'count') val = t.count;
                                                    if (df.agg === 'avg') val = t.count > 0 ? t.sum / t.count : 0;
                                                }

                                                let displayVal = val;
                                                if (df.format === 'number') displayVal = formatNumberWithCommas(val);
                                                else if (df.format === 'percent') displayVal = `${Math.round(val)}%`;
                                                else if (df.format === 'accounting') displayVal = formatAccountingNumber(val);

                                                // Mirrors native POL_Booking_Flash CF rules like
                                                // AND($H12="VMS", P12=0) -> white-on-white font, which hide the
                                                // "0" placeholder for VMS rows on specific numeric columns. This
                                                // pivot reads straight from filteredRawRows (not the Detail
                                                // View's tableData VMS field-wipe), so a VMS leaf row's raw 0
                                                // would otherwise render as a literal "0" here. Only applies at
                                                // the leaf level (one raw row per group, since rowFields here
                                                // form a unique key) and only to dataFields opted in via
                                                // config.vmsZeroMaskFields.
                                                const isLeafRow = row.level === rowFields.length;
                                                const rowIsVMS = isLeafRow && String(row.context.vvd || '').trim().toUpperCase() === 'VMS';
                                                if (rowIsVMS && val === 0 && config.vmsZeroMaskFields && config.vmsZeroMaskFields.includes(df.name)) {
                                                    displayVal = '';
                                                }

                                                // See matching comment above: cellClass(val, tGrp) is a
                                                // backward-compatible extension for sibling-field comparisons.
                                                const cClass = df.cellClass ? df.cellClass(val, tGrp) : '';
                                                return <td key={`${cKey}-${colIdx}`} className={`border border-gray-400 p-1 ${cKey === 'Total' ? 'font-bold bg-[#eef2fa]' : ''} ${cClass}`}>{displayVal}</td>;
                                            })
                                        ))}
                                    </tr>
                                );
                            })}
                        </tbody>
                    </table>
                </div>
            );
        };

        function FlashReportDashboard() {

                + (bsaHidden ? 0 : 2)            // BSA TEU, BSA Wgt

                                    loadableQuant: getVal(['Measures Loadable TEU', 'Loadable Quant', 'Loadable TEU']),
                                    loadableWgt: getVal(['Measures Loadable WGT update', 'Loadable WGT']),
                                    coastalEtd: getVal(['Route Date Coastal ETD Date', 'Coastal ETD Date', 'Coastal ETD']),
                                    portCut: getVal(['Route Date POL Cut/off Date', 'POL Cut/off Date', 'Port Cut']),
                                    sectorRemarks: getVal(['Sector Remarks'])
                                };

                                // Per the reference workbook's hidden NOTES sheet: "No PIC on the Max
                                // Laden table will result in a 'TBA' for the SPC PIC." Normalize blank/
                                // whitespace-only PIC here — the earliest point pic is read from the raw
                                // file — so 'TBA' flows through consistently to rawRows, the Detail View,
                                // filteredRawRows (and thus any pivot fed by it), and the existing SPC
                                // Analyst slicer (whose 'TBA' button and matchAnalyst .includes() check
                                // already expect this literal value).
                                rowObj.pic = (rowObj.pic && String(rowObj.pic).trim()) || 'TBA';

                                const totalAct = (parseFloat(rowObj.inlandAct) || 0) + (parseFloat(rowObj.portAct) || 0);
                                const totalTot = (parseFloat(rowObj.inlandTotal) || 0) + (parseFloat(rowObj.portTotal) || 0);
                                rowObj.actVsBkgUtilzRaw = totalTot > 0 ? (totalAct / totalTot) : 0;
                                
                                return rowObj;
                            });

                            setRawRows(formattedData);
                            setParseError(null);
                            setLastRefresh(new Date());
                            if (fileInputRef.current) fileInputRef.current.value = '';
                        }
                    } catch (error) {
                        console.error("Error parsing the file:", error);
                        setParseError(`Failed to parse the uploaded file: ${error && error.message ? error.message : 'unknown error'}. Please verify the file is a valid Excel export and try again.`);
                    }
                };
                reader.readAsBinaryString(file);
            };
            
            const handleFileUpload = (e) => {
                processFile(e.target.files[0]);
            };
            
            const handleDrop = (e) => {
                e.preventDefault();
                setIsDragging(false);
                if (e.dataTransfer.files && e.dataTransfer.files.length > 0) {
                    processFile(e.dataTransfer.files[0]);
                    e.dataTransfer.clearData();
                }
            };

            const exportToExcel = () => {
                const table = document.querySelector('table');
                if (!table || !window.XLSX) return;
                const wb = XLSX.utils.table_to_book(table);
                XLSX.writeFile(wb, `${activeTab}_export.xlsx`);
            };

            const toggleFilter = (setState, value) => {
                setState(prev => prev.includes(value) ? prev.filter(v => v !== value) : [...prev, value]);
            };

            const clearSlicers = () => {
                setSelectedSubTrades([]);
                setSelectedAnalysts([]);
                setSelectedCoasts([]);
                setSelectedLanes([]);
                setSelectedSaleWeeks([]);
                setSelectedYards([]);
                setHeaderFilters({});
            };

            // Distinct Sale Week values present in the uploaded data (dedup'd, blanks
            // dropped), ordered chronologically via compareSaleWeek rather than the
            // default lexicographic Array.sort — mirrors Excel's
            // Slicer_Route_Date_1st_Sale_Week, which lists weeks in date order.
            const saleWeekOptions = useMemo(() => {
                const seen = new Set();
                rawRows.forEach(row => {
                    const week = row.saleWeek;
                    if (week !== undefined && week !== null && String(week).trim() !== '') {
                        seen.add(String(week).trim());
                    }
                });
                return Array.from(seen).sort(compareSaleWeek);
            }, [rawRows]);

            // Yard codes (e.g. USLAX06) are open-ended data values rather than a fixed
            // small vocabulary like Coast/Sub Trade, so unlike those hardcoded slicer
            // option lists, the Yard slicer's options are derived from the distinct
            // values actually present in the uploaded data.
            const availableYards = useMemo(() => {
                const set = new Set();
                rawRows.forEach(row => {
                    if (row.yard) set.add(row.yard);
                });
                return Array.from(set).sort();
            }, [rawRows]);

            const filteredRawRows = useMemo(() => {
                return rawRows.filter(row => {
                    const matchSubTrade = selectedSubTrades.length === 0 || selectedSubTrades.includes(row.subTrade);
                    const matchAnalyst = selectedAnalysts.length === 0 || selectedAnalysts.some(analyst =>
                        row.pic && row.pic.toLowerCase().includes(analyst.toLowerCase())
                    );
                    const matchLane = selectedLanes.length === 0 || selectedLanes.includes(row.lane);
                    const matchCoast = selectedCoasts.length === 0 || selectedCoasts.includes(row.coast);
                    const matchSaleWeek = selectedSaleWeeks.length === 0 || selectedSaleWeeks.includes(row.saleWeek);
                    const matchYard = selectedYards.length === 0 || selectedYards.includes(row.yard);

                    let matchHeaderFilters = true;
                    for (const key in headerFilters) {
                        const filterValue = headerFilters[key];
                        if (filterValue && filterValue.trim() !== '') {
                            const rawRowVal = String(row[key] || '').toLowerCase();
                            const searchVal = filterValue.toLowerCase().trim();
                            
                            const cleanedRowVal = rawRowVal.replace(/[,%()]/g, '');
                            const cleanedSearchVal = searchVal.replace(/[,%()]/g, '');
                            
                            if (!rawRowVal.includes(searchVal) && !cleanedRowVal.includes(cleanedSearchVal)) {
                                matchHeaderFilters = false;
                                break;
                            }
                        }
                    }
                    return matchSubTrade && matchAnalyst && matchLane && matchCoast && matchSaleWeek && matchYard && matchHeaderFilters;
                });
            }, [rawRows, selectedSubTrades, selectedAnalysts, selectedLanes, selectedCoasts, selectedSaleWeeks, selectedYards, headerFilters]);

            // Static reference seed data from the Sector_Data sheet (not derived from the uploaded file).
            const sectorDataMapped = useMemo(() => {
                return SECTOR_DATA_SEED.map(r => ({
                    trade: r['Vessel 1st Trade'],
                    subTrade: r['Vessel 1st Sub Trade'],
                    lane: r['Vessel 1st Lane'],
                    podSec: r['POD Sec'],
                    sectorAlloc: r['MCT Sector Allocation'],
                    avgBooking: r['Average Booking'],
                    openSpace: r['Sector Open Space']
                }));
            }, []);


            const sectorRows = useMemo(() => {
                const parsed = [];
                filteredRawRows.forEach(row => {
                    if (row.sectorRemarks) {
                        const parts = String(row.sectorRemarks).split('/');
                        parts.forEach(p => {
                            const match = p.match(/([A-Z]+):\s*([\d,]+)\s*-\s*([\d,]+)/);
                            if (match) {
                                parsed.push({
                                    ...row,
                                    podSector: match[1],
                                    sectorAlloc: parseFloat(match[2].replace(/,/g, '')),
                                    avgBooking: parseFloat(match[3].replace(/,/g, ''))
                                });
                            }
                        });
                    }
                });
                return parsed;
            }, [filteredRawRows]);

            const tableData = useMemo(() => {
                const aggregatedMap = {};
                filteredRawRows.forEach(row => {
                    const key = `${row.trade}-${row.subTrade}-${row.lane}-${row.saleWeek}-${row.vvd}-${row.vessel}`;
                    if (!row.vvd && !row.vessel) {
                        aggregatedMap[`uid-${row.id}`] = row;
                        return;
                    }

                    if (!aggregatedMap[key]) {
                        aggregatedMap[key] = { ...row };
                        const numerics = ['curLaden', 'quote', 'shortfall', 'rfrBkgPlugs', 'rfrBkgTtl', 'inlandAct', 'inlandNoAct', 'inlandTotal', 'portAct', 'portNoAct', 'portTotal', 'dgTeu', 'tpt', 'tat', 'lwt', 'lnt', 'imt', 'let'];
                        numerics.forEach(n => aggregatedMap[key][n] = parseFloat(aggregatedMap[key][n]) || 0);

                        const maxes = ['maxLdn', 'bsaTeu', 'bsaWgt', 'rfrBsaPlugs', 'rfrMaxLdn'];
                        maxes.forEach(n => aggregatedMap[key][n] = parseFloat(aggregatedMap[key][n]) || 0);
                        
                        aggregatedMap[key].curUtilRaw = getPercentNum(row.curUtilRaw);
                    } else {
                        const numerics = ['curLaden', 'quote', 'rfrBkgPlugs', 'rfrBkgTtl', 'inlandAct', 'inlandNoAct', 'inlandTotal', 'portAct', 'portNoAct', 'portTotal', 'dgTeu', 'tpt', 'tat', 'lwt', 'lnt', 'imt', 'let'];
                        numerics.forEach(n => {
                            aggregatedMap[key][n] += (parseFloat(row[n]) || 0);
                        });

                        const maxes = ['maxLdn', 'bsaTeu', 'bsaWgt', 'rfrBsaPlugs', 'rfrMaxLdn'];
                        maxes.forEach(n => {
                            aggregatedMap[key][n] = Math.max(aggregatedMap[key][n], parseFloat(row[n]) || 0);
                        });
                        
                        aggregatedMap[key].curUtilRaw = Math.max(aggregatedMap[key].curUtilRaw, getPercentNum(row.curUtilRaw));
                    }
                });

                return Object.values(aggregatedMap).map(row => {
                    row.standby = formatPercent(row.standbyRaw);
                    row.peakUtil = formatPercent(row.peakUtilRaw);
                    row.rfrUtiliz = formatPercent(row.rfrUtilizRaw);
                    
                    const totalAct = (parseFloat(row.inlandAct) || 0) + (parseFloat(row.portAct) || 0);
                    const totalTot = (parseFloat(row.inlandTotal) || 0) + (parseFloat(row.portTotal) || 0);
                    row.actVsBkgUtilzRaw = totalTot > 0 ? (totalAct / totalTot) : 0;
                    row.actVsBkgUtilz = formatPercent(row.actVsBkgUtilzRaw);
                    
                    row.actVsMaxLdnRaw = totalAct - (parseFloat(row.maxLdn) || 0);
                    const formattedMaxLdnRaw = formatNumberWithCommas(row.actVsMaxLdnRaw);
                    row.actVsMaxLdn = (row.actVsMaxLdnRaw > 0 ? '+' : '') + formattedMaxLdnRaw;
                    row.actVsMaxLdnStyle = row.actVsMaxLdnRaw > 0 ? { color: 'red' } : {};

                    const parsedMax = parseFloat(row.maxLdn);
                    row.maxLdn = (parsedMax === 0 || isNaN(parsedMax)) ? '' : formatNumberWithCommas(row.maxLdn);

                    row.curUtil = `${Math.round(row.curUtilRaw || 0)}%`;

                    // Native CF (Booking_Flash!N13:O47): ($O-$N)>10% -> red fill on both Peak
                    // Utiliz % (N/row.peakUtil) and Current Laden Utiliz % (O/row.curUtil).
                    // row.curUtilRaw is already on the 0-100 percent-point scale (converted via
                    // getPercentNum above); normalize row.peakUtilRaw (still fractional, see the
                    // getPercentNum comment near its definition) the same way before comparing.
                    row.utilGapFlagged = isUtilGapFlagged(row.curUtilRaw, getPercentNum(row.peakUtilRaw));
                    row.utilGapStyle = row.utilGapFlagged ? { backgroundColor: '#dc2626', color: '#fff', fontWeight: 'bold' } : {};

                    if (row.maxLdn !== '' && row.curLaden !== undefined) {
                        const rawMaxLdn = parseFloat(String(row.maxLdn).replace(/,/g, ''));
                        const calculatedShortfall = row.curLaden - rawMaxLdn;
                        row.shortfall = formatAccountingNumber(calculatedShortfall);
                    } else {
                        row.shortfall = formatAccountingNumber(row.shortfall);
                    }
                    
                    row.curLaden = formatNumberWithCommas(row.curLaden);
                    row.quote = formatNumberWithCommas(row.quote);
                    row.bsaTeu = formatNumberWithCommas(row.bsaTeu);
                    row.bsaWgt = formatNumberWithCommas(row.bsaWgt);
                    
                    if (String(row.vvd).trim().toUpperCase() === 'VMS') {
                        const fieldsToKeep = ['id', 'trade', 'subTrade', 'lane', 'saleWeek', 'pic', 'vvd'];
                        Object.keys(row).forEach(key => {
                            if (!fieldsToKeep.includes(key)) {
                                row[key] = '';
                            }
                        });
                    }

                    return row;
                });
            }, [filteredRawRows]);

            const processedData = useMemo(() => {
                let filtered = [...tableData]; // Already filtered!
                
                filtered.sort((a, b) => {
                    if (a.trade !== b.trade) return String(a.trade || '').localeCompare(String(b.trade || ''));
                    if (a.subTrade !== b.subTrade) return String(a.subTrade || '').localeCompare(String(b.subTrade || ''));
                    if (a.lane !== b.lane) return String(a.lane || '').localeCompare(String(b.lane || ''));
                    if (a.saleWeek !== b.saleWeek) return compareSaleWeek(a.saleWeek, b.saleWeek);
                    return String(a.vessel || '').localeCompare(String(b.vessel || ''));
                });

                const withBlanks = [];
                for (let i = 0; i < filtered.length; i++) {
                    withBlanks.push(filtered[i]);
                    const isLastInLane = i === filtered.length - 1 || filtered[i].lane !== filtered[i+1].lane;
                    if (isLastInLane) {
                        withBlanks.push({
                            id: `blank-${filtered[i].id || i}`,
                            isBlankRow: true,
                            trade: filtered[i].trade,
                            subTrade: filtered[i].subTrade,
                            lane: filtered[i].lane
                        });
                    }
                }

                const spanned = withBlanks.map(row => ({
                    ...row,
                    showTrade: true, tradeSpan: 1,
                    showSub: true, subSpan: 1,
                    showLane: true, laneSpan: 1
                }));

                for (let i = 0; i < spanned.length; i++) {
                    if (spanned[i].showTrade) {
                        let spanCount = 1;
                        for (let j = i + 1; j < spanned.length; j++) {
                            if (spanned[j].trade === spanned[i].trade) {
                                spanCount++;
                                spanned[j].showTrade = false;
                            } else break;
                        }
                        spanned[i].tradeSpan = spanCount;
                    }

                    if (spanned[i].showSub) {
                        let spanCount = 1;
                        for (let j = i + 1; j < spanned.length; j++) {
                            if (spanned[j].trade === spanned[i].trade && spanned[j].subTrade === spanned[i].subTrade) {
                                spanCount++;
                                spanned[j].showSub = false;
                            } else break;
                        }
                        spanned[i].subSpan = spanCount;
                    }

                    if (spanned[i].showLane) {
                        let spanCount = 1;
                        for (let j = i + 1; j < spanned.length; j++) {
                            if (spanned[j].trade === spanned[i].trade &&
                                spanned[j].subTrade === spanned[i].subTrade &&
                                spanned[j].lane === spanned[i].lane) {
                                spanCount++;
                                spanned[j].showLane = false;
                            } else break;
                        }
                        spanned[i].laneSpan = spanCount;
                    }
                }
                return spanned;
            }, [tableData]);

            return (
                <div className="min-h-screen bg-[#f3f3f3] p-4 font-sans select-none text-black">
                    <input type="file" accept=".xlsx, .xls, .csv" ref={fileInputRef} onChange={handleFileUpload} className="hidden" />

                    {parseError && (
                        <div className="bg-red-100 border-2 border-red-500 text-red-800 font-bold px-4 py-3 rounded mb-4 mx-4 shadow-sm" role="alert">
                            {parseError}
                        </div>
                    )}

                    {tableData.length === 0 ? (
                        <div
                            onDrop={handleDrop}
                            onDragOver={(e) => { e.preventDefault(); setIsDragging(true); }}
                            onDragLeave={() => setIsDragging(false)}
                            className={`flex flex-col items-center justify-center h-[80vh] border-4 border-dashed rounded-lg shadow-sm p-10 text-center m-4 transition-colors ${isDragging ? 'border-blue-600 bg-blue-50' : 'border-gray-400 bg-white'}`}
                        >
                            <h1 className="text-4xl font-extrabold italic tracking-tighter text-[#002060] mb-4" style={{ fontFamily: 'Arial, sans-serif' }}>
                                Booking Flash Report NA
                            </h1>
                            <p className="text-gray-600 mb-8 text-lg max-w-lg">
                                Please upload the underlying data file to populate and generate the pivot table.
                            </p>
                            <button onClick={() => fileInputRef.current?.click()} className="bg-[#002060] text-white px-8 py-4 rounded shadow-md hover:bg-blue-800 transition-colors text-lg font-bold cursor-pointer">
                                Upload Underlying Data
                            </button>
                        </div>
                    ) : (
                        <>
                            <div className="flex justify-between items-end mb-2 border-b-2 border-gray-300 pb-1">
                                <h1 className="text-3xl font-extrabold italic tracking-tighter" style={{ fontFamily: 'Arial, sans-serif' }}>
                                    Booking Flash Report NA
                                </h1>
                                <div className="text-sm font-bold pb-1">
                                    Last Refresh: <span className="text-blue-700 italic">{lastRefresh ? `${lastRefresh.toLocaleDateString()} ${lastRefresh.toLocaleTimeString()}` : '—'}</span>
                                </div>
                            </div>

                            <div className="flex gap-4 mb-4 items-stretch">
                                <div className="flex-1 bg-[#e7e6e6] border-2 border-black p-3 flex flex-col shadow-sm rounded-sm">
                                    <div className="flex justify-end mb-1">
                                        <button onClick={clearSlicers} className="bg-gray-700 text-white px-2 py-1 text-xs font-bold rounded-sm hover:bg-gray-900 transition-colors cursor-pointer">Clear Filters</button>
                                    </div>
                                    <div className="flex justify-between items-start mb-2">
                                        <div className="flex items-start">
                                            <span className="text-sm font-bold mr-2 w-20 mt-1">Sub Trade</span>
                                            <div className="flex flex-col flex-1 relative">
                                                <div className="flex justify-end mb-1 absolute right-0 -top-5">
                                                    <ListFilterIcon size={16} className="text-gray-500 mr-1" />
                                                    <FilterIcon size={16} className="text-gray-500" />
                                                </div>
                                                <div className="flex flex-wrap bg-[#d9d9d9] p-1 border border-gray-300 rounded-sm">
                                                    {['AW', 'LN', 'PN', 'PS', 'TA'].map(trade => (
                                                        <SlicerBtn key={trade} bgClass="bg-[#a9d08e]" isSelected={selectedSubTrades.includes(trade)} isFilterActive={selectedSubTrades.length > 0} onClick={() => toggleFilter(setSelectedSubTrades, trade)}>{trade}</SlicerBtn>
                                                    ))}
                                                </div>
                                            </div>
                                        </div>

                                        <div className="flex items-start">
                                            <span className="text-sm font-bold mr-2 w-12 mt-1">Coast</span>
                                            <div className="flex flex-col flex-1 relative">
                                                <div className="flex justify-end mb-1 absolute right-0 -top-5">
                                                    <ListFilterIcon size={16} className="text-gray-500 mr-1" />
                                                    <FilterIcon size={16} className="text-gray-500" />
                                                </div>
                                                <div className="flex flex-wrap bg-[#d9d9d9] p-1 border border-gray-300 rounded-sm">
                                                    {['WC', 'EC'].map(c => (
                                                        <SlicerBtn key={c} bgClass="bg-[#c00000]" isSelected={selectedCoasts.includes(c)} isFilterActive={selectedCoasts.length > 0} onClick={() => toggleFilter(setSelectedCoasts, c)}>{c}</SlicerBtn>
                                                    ))}
                                                </div>
                                            </div>
                                        </div>
                                    </div>

                                    <div className="flex items-start mb-2">
                                        <span className="text-sm font-bold mr-2 w-20 mt-1">SPC Analyst</span>
                                        <div className="flex flex-col flex-1 relative">
                                            <div className="flex justify-end mb-1 absolute right-0 -top-5">
                                                <ListFilterIcon size={16} className="text-gray-500 mr-1" />
                                                <FilterIcon size={16} className="text-gray-500" />
                                            </div>
                                            <div className="flex flex-nowrap overflow-x-auto whitespace-nowrap bg-[#d9d9d9] p-1 border border-gray-300 rounded-sm w-fit">
                                                {['Evan', 'Joe', 'Kysa', 'Lani', 'Peter', 'Resid', 'Ryan H', 'Ryan T', 'TBA'].map(a => (
                                                    <SlicerBtn key={a} bgClass="bg-[#ed7d31]" isSelected={selectedAnalysts.includes(a)} isFilterActive={selectedAnalysts.length > 0} onClick={() => toggleFilter(setSelectedAnalysts, a)}>{a}</SlicerBtn>
                                                ))}
                                            </div>
                                        </div>
                                    </div>

                                    <div className="flex items-start">
                                        <span className="text-sm font-bold mr-2 w-20 mt-1">Lane</span>
                                        <div className="flex flex-col flex-1 relative">
                                            <div className="flex justify-end mb-1 absolute right-0 -top-5">
                                                <ListFilterIcon size={16} className="text-gray-500 mr-1" />
                                                <FilterIcon size={16} className="text-gray-500" />
                                            </div>
                                            <div className="flex flex-wrap bg-[#d9d9d9] p-1 border border-gray-300 rounded-sm">
                                                {['AL5', 'AN2', 'ANG', 'AT1', 'AT3', 'AT4', 'EC1', 'EC2', 'EC3', 'EC4', 'EMA', 'FLX', 'FP2', 'MAR', 'MS2', 'PN1', 'PN3', 'PS1', 'PS3', 'PS4', 'PS6', 'PS7', 'PS8', 'VSE', 'WIN'].map(lane => (
                                                    <SlicerBtn key={lane} bgClass="bg-[#5b9bd5]" isSelected={selectedLanes.includes(lane)} isFilterActive={selectedLanes.length > 0} onClick={() => toggleFilter(setSelectedLanes, lane)}>{lane}</SlicerBtn>
                                                ))}
                                            </div>
                                        </div>
                                    </div>

                                    <div className="flex items-start mt-2">
                                        <span className="text-sm font-bold mr-2 w-20 mt-1">Sale Week</span>
                                        <div className="flex flex-col flex-1 relative">
                                            <div className="flex justify-end mb-1 absolute right-0 -top-5">
                                                <ListFilterIcon size={16} className="text-gray-500 mr-1" />
                                                <FilterIcon size={16} className="text-gray-500" />
                                            </div>
                                            <div className="flex flex-nowrap overflow-x-auto whitespace-nowrap bg-[#d9d9d9] p-1 border border-gray-300 rounded-sm w-fit max-w-full">
                                                {saleWeekOptions.map(week => (
                                                    <SlicerBtn key={week} bgClass="bg-[#7030a0]" isSelected={selectedSaleWeeks.includes(week)} isFilterActive={selectedSaleWeeks.length > 0} onClick={() => toggleFilter(setSelectedSaleWeeks, week)}>{week}</SlicerBtn>
                                                ))}
                                            </div>
                                        </div>
                                    </div>

                                    {availableYards.length > 0 && (
                                        <div className="flex items-start mt-2">
                                            <span className="text-sm font-bold mr-2 w-20 mt-1">Yard</span>
                                            <div className="flex flex-col flex-1 relative">
                                                <div className="flex justify-end mb-1 absolute right-0 -top-5">
                                                    <ListFilterIcon size={16} className="text-gray-500 mr-1" />
                                                    <FilterIcon size={16} className="text-gray-500" />
                                                </div>
                                                <div className="flex flex-wrap bg-[#d9d9d9] p-1 border border-gray-300 rounded-sm">
                                                    {availableYards.map(yard => (
                                                        <SlicerBtn key={yard} bgClass="bg-[#7030a0]" isSelected={selectedYards.includes(yard)} isFilterActive={selectedYards.length > 0} onClick={() => toggleFilter(setSelectedYards, yard)}>{yard}</SlicerBtn>
                                                    ))}
                                                </div>
                                            </div>
                                        </div>
                                    )}
                                </div>

                                <div className="flex flex-col gap-2">
                                    <div className="flex bg-[#e7e6e6] border-2 border-black p-2 shadow-sm rounded-sm text-sm font-bold text-center gap-2 max-w-4xl">
                                        <div className="flex flex-col gap-1 w-1/4">
                                            <button onClick={() => setApStatusHidden(!apStatusHidden)} className={`border border-black p-1 h-full flex items-center justify-center cursor-pointer hover:brightness-105 text-xs leading-tight transition-all ${apStatusHidden ? 'bg-[#d9d9d9]' : 'bg-[#a9d08e]'}`}>{apStatusHidden ? 'Show AP Status' : 'Hide AP Status'}</button>
                                            <button onClick={() => setRotationHidden(!rotationHidden)} className={`border border-black p-1 h-full flex items-center justify-center cursor-pointer hover:brightness-105 text-xs leading-tight transition-all ${rotationHidden ? 'bg-[#d9d9d9]' : 'bg-[#a9d08e]'}`}>{rotationHidden ? 'Show Rotation' : 'Hide Rotation'}</button>
                                            <button onClick={() => setRemarksHidden(!remarksHidden)} className={`border border-black p-1 h-full flex items-center justify-center cursor-pointer hover:brightness-105 text-xs leading-tight transition-all ${remarksHidden ? 'bg-[#d9d9d9]' : 'bg-[#a9d08e]'}`}>{remarksHidden ? 'Show Voyage Remarks' : 'Hide Voyage Remarks'}</button>
                                        </div>
                                        <div className="flex flex-col gap-1 w-1/4">
                                            <button onClick={() => setTradeBreakdownHidden(!tradeBreakdownHidden)} className={`border border-black p-1 h-full flex items-center justify-center cursor-pointer hover:brightness-105 text-xs leading-tight transition-all ${tradeBreakdownHidden ? 'bg-[#d9d9d9]' : 'bg-[#a9d08e]'}`}>{tradeBreakdownHidden ? 'Show Trade Breakdown' : 'Hide Trade Breakdown'}</button>
                                            <button onClick={() => setDgVolumeHidden(!dgVolumeHidden)} className={`border border-black p-1 h-full flex items-center justify-center cursor-pointer hover:brightness-105 text-xs leading-tight transition-all ${dgVolumeHidden ? 'bg-[#d9d9d9]' : 'bg-[#a9d08e]'}`}>{dgVolumeHidden ? 'Show DG Volume' : 'Hide DG Volume'}</button>
