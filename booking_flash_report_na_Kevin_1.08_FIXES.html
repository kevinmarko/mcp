                                                    <th className="border border-black p-1 min-w-[50px] bg-[#DAEEF3]">{renderFilter('bsaTeu')}</th>
                                                    <th className="border border-black p-1 min-w-[60px] bg-[#DAEEF3]">{renderFilter('bsaWgt')}</th>
                                                </>
                                            )}

                                            {!reeferHidden && (
                                                <>
                                                    <th className="border border-black p-1 min-w-[50px] bg-[#ffc000]">{renderFilter('rfrBsaPlugs')}</th>
                                                    <th className="border border-black p-1 min-w-[50px] bg-[#ffc000]">{renderFilter('rfrBkgPlugs')}</th>
                                                    <th className="border border-black p-1 min-w-[50px] bg-[#ffc000]">{renderFilter('rfrMaxLdn')}</th>
                                                    <th className="border border-black p-1 min-w-[50px] bg-[#ffc000]">{renderFilter('rfrBkgTtl')}</th>
                                                    <th className="border border-black p-1 min-w-[50px] bg-[#ffc000]">{renderFilter('rfrUtiliz')}</th>
                                                </>
                                            )}
                                            
                                            {!activityHidden && (
                                                <>
                                                    <th className="border border-black p-1 min-w-[60px]">{renderFilter('actVsBkgUtilz')}</th>
                                                    <th className="border border-black p-1 min-w-[60px]">{renderFilter('actVsMaxLdn')}</th>

                                                    <th className="border border-black p-1 min-w-[50px] bg-[#C4BD97]">{renderFilter('inlandAct')}</th>
                                                    <th className="border border-black p-1 min-w-[60px] bg-[#C4BD97]">{renderFilter('inlandNoAct')}</th>
                                                    <th className="border border-black p-1 min-w-[50px] bg-[#C4BD97]">{renderFilter('inlandTotal')}</th>
                                                    <th className="border border-black p-1 min-w-[50px] bg-[#C4BD97]">{renderFilter('portAct')}</th>
                                                    <th className="border border-black p-1 min-w-[60px] bg-[#C4BD97]">{renderFilter('portNoAct')}</th>
                                                    <th className="border border-black p-1 min-w-[50px] bg-[#C4BD97]">{renderFilter('portTotal')}</th>
                                                </>
                                            )}

                                            {!opIssuesHidden && (
                                                <th className="border border-black p-1 min-w-[80px]">{renderFilter('opIssues')}</th>
                                            )}
                                            {!sectorAllocHidden && (
                                                <>
                                                    <th className="border border-black p-1 min-w-[80px]">{renderFilter('secAlloc')}</th>
                                                    <th className="border border-black p-1 min-w-[80px]">{renderFilter('sgsinDryVsRfr')}</th>
                                                </>
                                            )}
                                            {!rotationHidden && (
                                                <>
                                                    <th className="border border-black p-1 min-w-[100px]">{renderFilter('proformaRot')}</th>
                                                    <th className="border border-black p-1 min-w-[100px]">{renderFilter('actualRot')}</th>
                                                </>
                                            )}
                                            {!apStatusHidden && (
                                                <th className="border border-black p-1 min-w-[60px]">{renderFilter('apStatus')}</th>
                                            )}
                                            {!vcoHidden && (
                                                <th className="border border-black p-1 min-w-[80px]">{renderFilter('vco')}</th>
                                            )}
                                            {!tradeBreakdownHidden && (
                                                <>
                                                    <th className="border border-black p-1 min-w-[40px]">{renderFilter('tpt')}</th>
                                                    <th className="border border-black p-1 min-w-[40px]">{renderFilter('tat')}</th>
                                                    <th className="border border-black p-1 min-w-[40px]">{renderFilter('lwt')}</th>
                                                    <th className="border border-black p-1 min-w-[40px]">{renderFilter('lnt')}</th>
                                                    <th className="border border-black p-1 min-w-[40px]">{renderFilter('imt')}</th>
                                                    <th className="border border-black p-1 min-w-[40px]">{renderFilter('let')}</th>
                                                </>
                                            )}
                                            {!dgVolumeHidden && (
                                                <th className="border border-black p-1 min-w-[50px]">{renderFilter('dgTeu')}</th>
                                            )}

                                            {!remarksHidden && (
                                                <th className="border border-black p-1 min-w-[200px]">{renderFilter('remarks')}</th>
                                            )}
                                        </tr>

                                        {/* HEADER TITLES ROW 1 */}
                                        <tr>
                                            <th rowSpan={2} className="border border-black font-semibold p-1.5 min-w-[50px] text-[11px] leading-tight">Trade</th>
                                            <th rowSpan={2} className="border border-black font-semibold p-1.5 min-w-[50px] text-[11px] leading-tight">Sub Trade</th>
                                            <th rowSpan={2} className="border border-black font-semibold p-1.5 min-w-[50px] text-[11px] leading-tight">Lane</th>
                                            <th rowSpan={2} className="border border-black font-semibold p-1.5 min-w-[60px] text-[11px] leading-tight">Sale Week</th>
                                            <th rowSpan={2} className="border border-black font-semibold p-1.5 min-w-[80px] text-[11px] leading-tight" title={'NOTES: No PIC on the Max Laden table will result in a "TBA" for the SPC PIC.'}>PIC (spc/mkg)</th>
                                            <th rowSpan={2} className="border border-black font-semibold p-1.5 min-w-[60px] text-[11px] leading-tight">1st POL<br/>Cutoff</th>
                                            <th rowSpan={2} className="border border-black font-semibold p-1.5 min-w-[60px] text-[11px] leading-tight">ETD Last<br/>Port</th>
                                            <th rowSpan={2} className="border border-black font-semibold p-1.5 min-w-[50px] text-[11px] leading-tight">Status</th>
                                            <th rowSpan={2} className="border border-black font-semibold p-1.5 min-w-[80px] text-[11px] leading-tight">VVD</th>
                                            <th rowSpan={2} className="border border-black font-semibold p-1.5 min-w-[120px] text-[11px] leading-tight">Vessel Name</th>
                                            <th rowSpan={2} className="border border-black font-semibold p-1.5 min-w-[50px] text-[11px] leading-tight">Max LDN</th>
                                            <th rowSpan={2} className="border border-black font-semibold p-1.5 min-w-[60px] text-[11px] leading-tight">Standby<br/>Threshold</th>
                                            <th rowSpan={2} className="border border-black font-semibold p-1.5 min-w-[50px] text-[11px] leading-tight bg-[#d9e1f2] text-black">Current<br/>Laden<br/>(TEU)</th>
                                            <th rowSpan={2} className="border border-black font-semibold p-1.5 min-w-[50px] text-[11px] leading-tight" title="NOTES: Peak will be one day behind. Will show the % jump from day to day.">Peak<br/>Utiliz %</th>
                                            <th rowSpan={2} className="border border-black font-bold p-1.5 min-w-[50px] text-[11px] leading-tight bg-[#FDE9D9] text-[#974706]">Current<br/>Laden<br/>Utiliz %</th>
                                            <th rowSpan={2} className="border border-black font-semibold p-1.5 min-w-[50px] text-[11px] leading-tight">Max LDN vs<br/>BKG<br/>(Short_Fall)</th>
                                            <th rowSpan={2} className="border border-black font-semibold p-1.5 min-w-[50px] text-[11px] leading-tight text-white">ONE<br/>Quote<br/>(TEU)</th>
                                            <th rowSpan={2} className="border border-black font-semibold p-1.5 min-w-[50px] text-[11px] leading-tight" title="NOTES: Broken routes volume will show on any VVD has cutoff date less than 37 days.">Broken<br/>Routes</th>
                                            {!bsaHidden && (
                                                <>
                                                    <th rowSpan={2} className="border border-black font-semibold p-1.5 min-w-[50px] text-[11px] leading-tight bg-[#DAEEF3] text-black">BSA TEU</th>
                                                    <th rowSpan={2} className="border border-black font-semibold p-1.5 min-w-[60px] text-[11px] leading-tight bg-[#DAEEF3] text-black">BSA Wgt<br/>(Last NA Port )</th>
                                                </>
                                            )}
                                            
                                            {!reeferHidden && (
                                                <>
                                                    <th rowSpan={2} className="border border-black font-semibold p-1.5 min-w-[50px] text-[11px] leading-tight bg-[#ffc000] text-black">RFR BSA<br/>Plugs</th>
                                                    <th rowSpan={2} className="border border-black font-semibold p-1.5 min-w-[50px] text-[11px] leading-tight bg-[#ffc000] text-black">RFR BKG<br/>Plugs</th>
                                                    <th rowSpan={2} className="border border-black font-semibold p-1.5 min-w-[50px] text-[11px] leading-tight bg-[#ffc000] text-black">RFR Max<br/>LDN</th>
                                                    <th rowSpan={2} className="border border-black font-semibold p-1.5 min-w-[50px] text-[11px] leading-tight bg-[#ffc000] text-black">RFR BKG<br/>TTL</th>
                                                    <th rowSpan={2} className="border border-black font-semibold p-1.5 min-w-[50px] text-[11px] leading-tight bg-[#ffc000] text-black">RFR<br/>Utiliz %</th>
                                                </>
                                            )}
                                            
                                            {!activityHidden && (
                                                <>
                                                    <th rowSpan={2} className="border border-black font-semibold p-1.5 min-w-[60px] text-[11px] leading-tight">Activity vs<br/>Booking Utilz</th>
                                                    <th rowSpan={2} className="border border-black font-semibold p-1.5 min-w-[60px] text-[11px] leading-tight">Activity vs<br/>Max Laden</th>
                                                    <th colSpan={3} className="border border-black font-bold p-1 min-w-[160px] text-[12px] leading-tight bg-[#C4BD97] text-black">Inland Activity</th>
                                                    <th colSpan={3} className="border border-black font-bold p-1 min-w-[160px] text-[12px] leading-tight bg-[#C4BD97] text-black">Port Activity</th>
                                                </>
                                            )}

                                            {!opIssuesHidden && <th rowSpan={2} className="border border-black font-semibold p-1.5 min-w-[80px] text-[11px] leading-tight">Operational<br/>Issues</th>}
                                            {!sectorAllocHidden && (
                                                <>
                                                    <th rowSpan={2} className="border border-black font-semibold p-1.5 min-w-[80px] text-[11px] leading-tight">Sector<br/>Allocation</th>
                                                    <th rowSpan={2} className="border border-black font-semibold p-1.5 min-w-[80px] text-[11px] leading-tight">SGSIN Dry<br/>vs Reefer</th>
                                                </>
                                            )}
                                            {!rotationHidden && (
                                                <>
                                                    <th rowSpan={2} className="border border-black font-semibold p-1.5 min-w-[100px] text-[11px] leading-tight">Proforma<br/>Rotation</th>
                                                    <th rowSpan={2} className="border border-black font-semibold p-1.5 min-w-[100px] text-[11px] leading-tight">Actual<br/>Rotation</th>
                                                </>
                                            )}
                                            {!apStatusHidden && <th rowSpan={2} className="border border-black font-semibold p-1.5 min-w-[60px] text-[11px] leading-tight">AP<br/>Status</th>}
                                            {!vcoHidden && <th rowSpan={2} className="border border-black font-semibold p-1.5 min-w-[80px] text-[11px] leading-tight">VCO<br/>Analyst</th>}
                                            {!tradeBreakdownHidden && (
                                                <>
                                                    <th rowSpan={2} className="border border-black font-semibold p-1.5 min-w-[40px] text-[11px] leading-tight">TPT</th>
                                                    <th rowSpan={2} className="border border-black font-semibold p-1.5 min-w-[40px] text-[11px] leading-tight">TAT</th>
                                                    <th rowSpan={2} className="border border-black font-semibold p-1.5 min-w-[40px] text-[11px] leading-tight">LWT</th>
                                                    <th rowSpan={2} className="border border-black font-semibold p-1.5 min-w-[40px] text-[11px] leading-tight">LNT</th>
                                                    <th rowSpan={2} className="border border-black font-semibold p-1.5 min-w-[40px] text-[11px] leading-tight">IMT</th>
                                                    <th rowSpan={2} className="border border-black font-semibold p-1.5 min-w-[40px] text-[11px] leading-tight">LET</th>
                                                </>
                                            )}
                                            {!dgVolumeHidden && <th rowSpan={2} className="border border-black font-semibold p-1.5 min-w-[50px] text-[11px] leading-tight">DG<br/>TEU</th>}
                                            
                                            {!remarksHidden && (
                                                <th rowSpan={2} className="border border-black font-semibold p-1.5 min-w-[200px] text-[11px] leading-tight text-left">Voyage Remarks</th>
                                            )}
                                        </tr>
                                        {/* HEADER TITLES ROW 2 (For Sub-headers) */}
                                        <tr>
                                            {!activityHidden && (
                                                <>
                                                    <th className="border border-black font-semibold p-1.5 min-w-[50px] text-[11px] leading-tight bg-[#002060] text-white">Inland<br/>Activity</th>
                                                    <th className="border border-black font-semibold p-1.5 min-w-[60px] text-[11px] leading-tight bg-[#002060] text-white">Inland No<br/>Activity</th>
                                                    <th className="border border-black font-semibold p-1.5 min-w-[50px] text-[11px] leading-tight bg-[#002060] text-white">Inland<br/>Total</th>
                                                    <th className="border border-black font-semibold p-1.5 min-w-[50px] text-[11px] leading-tight bg-[#002060] text-white">Port<br/>Activity</th>
                                                    <th className="border border-black font-semibold p-1.5 min-w-[60px] text-[11px] leading-tight bg-[#002060] text-white">Port No<br/>Activity</th>
                                                    <th className="border border-black font-semibold p-1.5 min-w-[50px] text-[11px] leading-tight bg-[#002060] text-white">Port<br/>Total</th>
                                                </>
                                            )}
                                        </tr>
                                    </thead>
                                    <tbody>
                                        {processedData.map((row, index) => {
                                            if (row.isBlankRow) {
                                                return (
                                                    <tr key={row.id || `blank-${index}`} className="h-4">
                                                        {row.showTrade && <td rowSpan={row.tradeSpan} className="border border-gray-400 font-bold bg-white align-top pt-1.5">{row.trade}</td>}
                                                        {row.showSub && <td rowSpan={row.subSpan} className="border border-gray-400 font-bold bg-[#e2efda] align-top pt-1.5">{row.subTrade}</td>}
                                                        {row.showLane && <td rowSpan={row.laneSpan} className="border border-gray-400 font-bold bg-[#bdd7ee] text-[#2f5597] align-top pt-1.5">{row.lane}</td>}
                                                        <td colSpan={detailBlankRowColSpan} className="border border-gray-400 bg-[#f3f3f3]"></td>
                                                    </tr>
                                                );
                                            }

                                            // Deliberately keyed on `status` (Measures Overall Status), not
                                            // `loadingStatus` (Measures Loading Status) — Detail View/Booking_Flash
                                            // coloring stays on the overall status field; only POL_Booking_Flash's
                                            // rowClass uses the POL-level loading status.
                                            const isVMS = String(row.vvd).trim().toUpperCase() === 'VMS';
                                            const isAPOnly = String(row.status).trim().toUpperCase() === 'AP ONLY';
                                            const isAPFrozen = String(row.status).trim().toUpperCase() === 'AP FROZEN';

                                            // Colors verified 8/13/2026 against theme1.xml's <a:clrScheme> +
                                            // conditional_formatting_rules.json's resolved dxf fills (see the
                                            // matching note by POL_Booking_Flash's rowClass above for the full
                                            // tint math): VMS's theme-0/tint -0.14996795556505021 resolves to an
                                            // exact #D9D9D9 match; AP Frozen's theme-5/tint 0.39994506668294322
                                            // resolves to #D99694, 1 unit off #DA9694 on the R channel only
                                            // (negligible/expected drift); AP Only's literal dxf hex #FFC000
                                            // matches exactly. No hardcoded values changed.
                                            const getBg = (defaultBg, isApRange) => {
                                                if (isVMS) return 'bg-[#d9d9d9]';
                                                if (isAPOnly && isApRange) return 'bg-[#ffc000]';
                                                if (isAPFrozen && isApRange) return 'bg-[#DA9694]';
                                                return defaultBg;
                                            };

                                            return (
                                                <tr key={row.id || index}>
                                                    {row.showTrade && <td rowSpan={row.tradeSpan} className="border border-gray-400 font-bold bg-white align-top pt-1.5">{row.trade}</td>}
                                                    {row.showSub && <td rowSpan={row.subSpan} className="border border-gray-400 font-bold bg-[#e2efda] align-top pt-1.5">{row.subTrade}</td>}
                                                    {row.showLane && <td rowSpan={row.laneSpan} className="border border-gray-400 font-bold bg-[#bdd7ee] text-[#2f5597] align-top pt-1.5">{row.lane}</td>}
                                                    
                                                    <td className={`border border-gray-400 font-bold ${getBg('bg-white', true)}`}>{row.saleWeek}</td>
                                                    <td className={`border border-gray-400 ${getBg('bg-white', true)}`}>{row.pic}</td>
                                                    <td className={`border border-gray-400 ${getBg('bg-white', true)}`}>{row.cutoff}</td>
                                                    <td className={`border border-gray-400 ${getBg('bg-white', true)}`}>{row.etd}</td>
                                                    <td className={`border border-gray-400 ${getBg('bg-white', true)}`}>{row.status}</td>
                                                    <td className={`border border-gray-400 font-bold text-black ${getBg('bg-[#d9e1f2]', true)}`}>{row.vvd}</td>
                                                    <td className={`border border-gray-400 font-bold text-left px-2 truncate text-[#2f5597] max-w-[140px] ${getBg('bg-[#d9e1f2]', true)}`}>{row.vessel}</td>
                                                    <td className={`border border-gray-400 font-bold ${getBg('bg-white', true)}`}>{row.maxLdn}</td>
                                                    <td className={`border border-gray-400 ${getBg('bg-white', true)}`}>{row.standby}</td>
                                                    <td className={`border border-gray-400 font-bold ${getBg('bg-[#d9e1f2]', true)}`}>{row.curLaden}</td>
                                                    <td className={`border border-gray-400 ${getBg('bg-white', true)}`} style={row.utilGapFlagged && !isVMS && !isAPOnly && !isAPFrozen ? row.utilGapStyle : {}}>{row.peakUtil}</td>
                                                    <td className={`border border-gray-400 font-bold text-black ${getBg('bg-[#FDE9D9]', true)}`} style={row.utilGapFlagged && !isVMS && !isAPOnly && !isAPFrozen ? row.utilGapStyle : {}}>{row.curUtil}</td>
                                                    <td className={`border border-gray-400 ${getBg('bg-white', true)}`}>{row.shortfall}</td>
                                                    <td className={`border border-gray-400 font-bold text-[#974706] ${getBg('bg-white', true)}`}>{row.quote}</td>
                                                    <td className={`border border-gray-400 text-[#2f5597] ${getBg('bg-white', true)}`}>{row.broken}</td>
                                                    {!bsaHidden && (
                                                        <>
                                                            <td className={`border border-gray-400 ${getBg('bg-white', true)}`}>{row.bsaTeu}</td>
                                                            <td className={`border border-gray-400 ${getBg('bg-white', true)}`}>{row.bsaWgt}</td>
                                                        </>
                                                    )}
                                                    {!reeferHidden && (
                                                        <>
                                                            <td className={`border border-gray-400 ${getBg('bg-white', true)}`}>{row.rfrBsaPlugs}</td>
                                                            <td className={`border border-gray-400 ${getBg('bg-white', true)}`}>{row.rfrBkgPlugs}</td>
                                                            <td className={`border border-gray-400 ${getBg('bg-white', true)}`}>{row.rfrMaxLdn}</td>
                                                            <td className={`border border-gray-400 ${getBg('bg-white', true)}`}>{row.rfrBkgTtl}</td>
                                                            <td className={`border border-gray-400 ${getBg('bg-white', true)}`}>{row.rfrUtiliz}</td>
                                                        </>
                                                    )}
                                                    {!activityHidden && (
                                                        <>
                                                            <td className={`border border-gray-400 ${getBg('bg-white', true)}`}>{row.actVsBkgUtilz}</td>
                                                            <td className={`border border-gray-400 ${getBg('bg-white', true)}`} style={row.actVsMaxLdnStyle}>{row.actVsMaxLdn}</td>
                                                            <td className={`border border-gray-400 ${getBg('bg-white', true)}`}>{row.inlandAct}</td>
                                                            <td className={`border border-gray-400 ${getBg('bg-white', true)}`}>{row.inlandNoAct}</td>
                                                            <td className={`border border-gray-400 ${getBg('bg-white', true)}`}>{row.inlandTotal}</td>
                                                            <td className={`border border-gray-400 ${getBg('bg-white', true)}`}>{row.portAct}</td>
                                                            <td className={`border border-gray-400 ${getBg('bg-white', true)}`}>{row.portNoAct}</td>
                                                            <td className={`border border-gray-400 ${getBg('bg-white', true)}`}>{row.portTotal}</td>
                                                        </>
                                                    )}
                                                    {!opIssuesHidden && (
                                                        <td className={`border border-gray-400 text-left px-2 truncate max-w-[150px] ${getBg('bg-white', false)}`} style={String(row.opIssues || '').trim().toUpperCase().startsWith('**ALERT') ? { color: '#FF0000', fontWeight: 'bold' } : {}}>{renderAsteriskHide(row.opIssues)}</td>
                                                    )}
                                                    {!sectorAllocHidden && (
                                                        <>
                                                            <td className={`border border-gray-400 text-left px-2 ${getBg('bg-white', false)}`}>{renderSecAlloc(row.secAlloc)}</td>
                                                            <td className={`border border-gray-400 ${getBg('bg-white', false)}`}>{renderSecAlloc(row.sgsinDryVsRfr)}</td>
                                                        </>
                                                    )}
                                                    {!rotationHidden && (
                                                        <>
                                                            <td className={`border border-gray-400 truncate max-w-[150px] ${getBg('bg-white', false)}`}>{renderAsteriskHide(row.proformaRot)}</td>
                                                            <td className={`border border-gray-400 truncate max-w-[150px] ${getBg('bg-white', false)}`}>{renderAsteriskHide(row.actualRot)}</td>
                                                        </>
                                                    )}
                                                    {!apStatusHidden && (
                                                        <td className={`border border-gray-400 ${getBg('bg-white', false)}`}>{renderAsteriskHide(row.apStatus)}</td>
                                                    )}
                                                    {!vcoHidden && (
                                                        <td className={`border border-gray-400 ${getBg('bg-white', false)}`}>{row.vco}</td>
                                                    )}
                                                    {!tradeBreakdownHidden && (
                                                        <>
                                                            <td className={`border border-gray-400 ${getBg('bg-white', false)}`}>{row.tpt}</td>
                                                            <td className={`border border-gray-400 ${getBg('bg-white', false)}`}>{row.tat}</td>
                                                            <td className={`border border-gray-400 ${getBg('bg-white', false)}`}>{row.lwt}</td>
                                                            <td className={`border border-gray-400 ${getBg('bg-white', false)}`}>{row.lnt}</td>
                                                            <td className={`border border-gray-400 ${getBg('bg-white', false)}`}>{row.imt}</td>
                                                            <td className={`border border-gray-400 ${getBg('bg-white', false)}`}>{row.let}</td>
                                                        </>
                                                    )}
                                                    {!dgVolumeHidden && (
                                                        <td className={`border border-gray-400 ${getBg('bg-white', false)}`}>{row.dgTeu}</td>
                                                    )}

                                                    {!remarksHidden && (
                                                        <td className="border border-gray-400 bg-white text-left px-2 truncate max-w-xs">{renderAsteriskHide(row.remarks)}</td>
                                                    )}
                                                </tr>
                                            );
                                        })}
                                        
                                        {processedData.length === 0 && (
                                            <tr>
                                                <td colSpan={detailNoDataColSpan} className="p-8 text-center text-gray-500 font-semibold bg-white border border-gray-400">
                                                    No data matches the selected filters.
                                                </td>
                                            </tr>
                                        )}
                                    </tbody>
                                </table>
                            </div>
                                                    )}
                            </div>
                        </>
                    )}
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<FlashReportDashboard />);
    </script>
</body>
</html>
