                                                        if (df.agg === 'count') val = t.count;
                                                        if (df.agg === 'avg') val = t.count > 0 ? t.sum / t.count : 0;
                                                    }

                                                    let displayVal = val;
                                                    if (df.format === 'number') displayVal = formatNumberWithCommas(val);
                                                    else if (df.format === 'percent') displayVal = `${Math.round(df.rawFraction ? getPercentNum(val) : val)}%`;
                                                    else if (df.format === 'accounting') displayVal = formatAccountingNumber(val);
                                                    else if (df.format === 'accountingSignedRed') displayVal = formatAccountingSigned(val);

                                                    if (df.hideOnLevels && df.hideOnLevels.includes(row.level)) {
                                                        displayVal = '';
                                                    }

                                                    const isSubtotalRow = row.level < rowFields.length && row.level > 0;
                                                    const isGrandTotalRow = row.level === 0;
                                                    const cClass = `${df.cellClass ? df.cellClass(val, tGrp) : ''} ${negativeValueClass(val, df.format)}`.trim();
                                                    const cClassHasOwnBg = cClass.includes('bg-');
                                                    // Class B fix -- see the fuller writeup on the first cClassHasOwnText of this
                                                    // shape above (~line 1817). Same mirror of cClassHasOwnBg, applied to text color
                                                    // so this Total column's own `text-black dark:text-gray-100` never collides with
                                                    // a dataField's own `text-` utility (e.g. avgMaxVsBkg's `text-red-600`) at equal
                                                    // Tailwind specificity.
                                                    const cClassHasOwnText = cClass.includes('text-');
                                                    return <td key={`${cKey}-${colIdx}`} data-autofit-col={df.name} className={`border border-gray-400 py-1 px-0.5 ${cKey === 'Total' ? 'font-bold' : ''} ${(cKey === 'Total' && !cClassHasOwnBg) ? 'bg-white dark:bg-gray-800' : ''} ${(cKey === 'Total' && !cClassHasOwnBg && !cClassHasOwnText) ? 'text-black dark:text-gray-100' : ''} ${isGrandTotalRow ? 'bg-[#d9e1f2] text-black font-bold' : isSubtotalRow ? 'bg-blue-100 dark:bg-blue-900 font-bold' : ''} ${cClass}`}>{displayVal}</td>;
                                                })
                                            ))}
                                        </tr>
                                    );
                                }

                                if (valuesInRows) {
                                    return (
                                        <React.Fragment key={i}>
                                            <tr className={`${trClassBase} ${customClass} ${row.level === 0 ? 'bg-[#d9e1f2] text-black font-bold' : ''}`}>
                                                <td rowSpan={dataFields.length + 1} data-autofit-col="rowLabels" className={`border border-gray-400 py-1 px-0.5 align-top ${row.level === 0 ? 'text-center' : 'text-left'}`}>
                                                    <span style={{ paddingLeft: row.level === 0 ? 0 : `${Math.max(0, row.level - 1) * 1.5}rem` }} className={row.level === 0 ? '' : 'inline-flex items-center'}>
                                                        {row.level > 0 && !hideRowToggles && (row.hasChildren
                                                            ? <button type="button" onClick={() => toggleCollapse(row.id)} aria-label={collapsedNodes.has(row.id) ? 'Expand row' : 'Collapse row'} className="mr-1 w-4 text-center border border-gray-400 dark:border-gray-500 bg-white dark:bg-gray-700 dark:text-gray-100 shadow-sm font-bold text-[10px] leading-tight hover:bg-gray-200 dark:hover:bg-gray-600">{collapsedNodes.has(row.id) ? '+' : '−'}</button>
                                                            : <span className="mr-1 w-4 text-center inline-block">•</span>
                                                        )}
                                                        {row.label}
                                                    </span>
                                                </td>
                                                <td className="border border-gray-400 py-1 px-0.5 bg-gray-100 dark:bg-gray-700"></td>
                                                {colKeysWithTotal.map((cKey, cIdx) => (
                                                    <td key={`empty-${cIdx}`} className="border border-gray-400 py-1 px-0.5 bg-gray-100 dark:bg-gray-700"></td>
                                                ))}
                                            </tr>
                                            {dataFields.map((df, dfIdx) => (
                                                <tr key={`${i}-${dfIdx}`} className={`${customClass || 'bg-white dark:bg-gray-800 hover:bg-gray-50 dark:hover:bg-gray-700'}`}>
                                                    <td data-autofit-col="valuesCol" className="border border-gray-400 py-1 px-0.5 text-left bg-gray-100 dark:bg-gray-700 font-semibold">{df.label}</td>
                                                    {colKeysWithTotal.map((cKey, cIdx) => {
                                                        let val = 0;
                                                        const tGrp = row.totals[cKey] || {};
                                                        if (df.agg === 'calc' && df.calc) {
                                                            val = df.calc(tGrp, row.context, cKey);
                                                        } else {
                                                            const t = tGrp[df.name] || { sum: 0, max: 0, count: 0 };
                                                            if (df.agg === 'sum') val = t.sum;
                                                            if (df.agg === 'max') val = t.max;
                                                            if (df.agg === 'count') val = t.count;
                                                            if (df.agg === 'avg') val = t.count > 0 ? t.sum / t.count : 0;
                                                        }

                                                        let displayVal = val;
                                                        if (df.format === 'number') displayVal = formatNumberWithCommas(val);
                                                        else if (df.format === 'percent') displayVal = `${Math.round(df.rawFraction ? getPercentNum(val) : val)}%`;
                                                        else if (df.format === 'accounting') displayVal = formatAccountingNumber(val);
                                                        else if (df.format === 'accountingSignedRed') displayVal = formatAccountingSigned(val);

                                                        const cClass = `${df.cellClass ? df.cellClass(val, tGrp) : ''} ${negativeValueClass(val, df.format)}`.trim();
                                                        const cClassHasOwnBg = cClass.includes('bg-');
                                                        // Class B fix -- see the fuller writeup on the first cClassHasOwnText of this
                                                        // shape above (~line 1817).
                                                        const cClassHasOwnText = cClass.includes('text-');
                                                        return <td key={cIdx} data-autofit-col={cKey === 'Total' ? 'grandTotalValuesCol' : `col:${cKey}`} className={`border border-gray-400 py-1 px-0.5 ${cKey === 'Total' ? 'font-bold' : ''} ${(cKey === 'Total' && !cClassHasOwnBg) ? 'bg-[#eef2fa] dark:bg-blue-950' : ''} ${(cKey === 'Total' && !cClassHasOwnBg && !cClassHasOwnText) ? 'text-black dark:text-gray-100' : ''} ${cClass}`}>{displayVal}</td>;
                                                    })}
                                                </tr>
                                            ))}
                                        </React.Fragment>
                                    );
                                }
                                
                                return (
                                    <tr key={i} className={`${trClassBase} ${customClass}`}>
                                        <td data-autofit-col="rowLabels" className={`border border-gray-400 py-1 px-0.5 ${row.level === 0 ? 'text-center' : 'text-left'}`} style={grandTotalCellStyle}>
                                            <span style={{ paddingLeft: row.level === 0 ? 0 : `${Math.max(0, row.level - 1) * 1.5}rem` }}>
                                                {row.level > 0 && !hideRowToggles && (row.hasChildren
                                                    ? <button type="button" onClick={() => toggleCollapse(row.id)} aria-label={collapsedNodes.has(row.id) ? 'Expand row' : 'Collapse row'} className="cursor-pointer select-none hover:text-blue-700 bg-transparent border-0 p-0 m-0 inline align-baseline">{collapsedNodes.has(row.id) ? '▶ ' : '▼ '}</button>
                                                    : '• '
                                                )}
                                                {getRowStatusBadge(customClass)}{row.label}
                                            </span>
                                        </td>
                                        {colKeysWithTotal.map((cKey) => (
                                            dataFields.map((df, colIdx) => {
                                                let val = 0;
                                                const tGrp = row.totals[cKey] || {};
                                                if (df.agg === 'calc' && df.calc) {
                                                    val = df.calc(tGrp, row.context, cKey);
                                                } else {
                                                    const t = tGrp[df.name] || { sum: 0, max: 0, count: 0 };
                                                    if (df.agg === 'sum') val = t.sum;
                                                    if (df.agg === 'max') val = t.max;
                                                    if (df.agg === 'count') val = t.count;
                                                    if (df.agg === 'avg') val = t.count > 0 ? t.sum / t.count : 0;
                                                }

                                                let displayVal = val;
                                                if (df.format === 'number') displayVal = formatNumberWithCommas(val);
                                                else if (df.format === 'percent') displayVal = `${Math.round(df.rawFraction ? getPercentNum(val) : val)}%`;
                                                else if (df.format === 'accounting') displayVal = formatAccountingNumber(val);
                                                else if (df.format === 'accountingSignedRed') displayVal = formatAccountingSigned(val);

                                                const isLeafRow = row.level === rowFields.length;
                                                const rowIsVMS = isLeafRow && String(row.context.vvd || '').trim().toUpperCase() === 'VMS';
                                                let isVmsMasked = false;
                                                if (rowIsVMS && val === 0 && config.vmsZeroMaskFields && config.vmsZeroMaskFields.includes(df.name)) {
                                                    displayVal = '';
                                                    isVmsMasked = true;
                                                }
                                                
                                                if (df.hideOnLevels && df.hideOnLevels.includes(row.level)) {
                                                    displayVal = '';
                                                }

                                                const cClass = `${(!isVmsMasked && df.cellClass) ? df.cellClass(val, tGrp) : ''} ${!isVmsMasked ? negativeValueClass(val, df.format) : ''}`.trim();
                                                const cClassHasOwnBg = cClass.includes('bg-');
                                                // Class B fix -- see the fuller writeup on the first cClassHasOwnText of this
                                                // shape above (~line 1817).
                                                const cClassHasOwnText = cClass.includes('text-');
                                                return <td key={`${cKey}-${colIdx}`} data-autofit-col={df.name} className={`border border-gray-400 py-1 px-0.5 ${cKey === 'Total' ? 'font-bold' : ''} ${(cKey === 'Total' && !cClassHasOwnBg) ? 'bg-[#eef2fa] dark:bg-blue-950' : ''} ${(cKey === 'Total' && !cClassHasOwnBg && !cClassHasOwnText) ? 'text-black dark:text-gray-100' : ''} ${cClass}`} style={grandTotalCellStyle}>{displayVal}</td>;
                                            })
                                        ))}
                                    </tr>
                                );
                            })}
                        </tbody>
                    </table>
                </div>
            );
        };

        const CSV_SOURCE_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vQNykGT8bYqwDC4k9loE5L8-j-rs9fyzPetfnrNwYAAZVRTXVLDyxrtCm9eP736OUAYEi6wULzeCaBn/pub?gid=0&single=true&output=csv';
        // 2026-09-10, per Kevin: "maybe we should poll the google sheet every 10
        // minutes" -- bumped from the original 5. Governs both this source's poll
        // (checkForUpdates below) and SECTOR_DATA_CSV_URL's identical poll
        // (fetchAndApplySectorData) -- both are live Google Sheet "Publish to the
        // web" CSV exports, on the same cadence by design (see DATA_ARCHITECTURE.md's
        // SECTOR_DATA_SEED entry). Deliberately NOT shared with the app-update poll
        // (APP_UPDATE_POLL_INTERVAL_MS, near checkForAppUpdate) -- how often to check
        // for new DATA and how often to check for a new APP VERSION are unrelated
        // concerns that just happened to start out equal, so keeping them on separate
        // constants means tuning one (like this one, just now) can't silently change
        // the other.
        const POLL_INTERVAL_MS = 10 * 60 * 1000;
        const APP_UPDATE_POLL_INTERVAL_MS = 5 * 60 * 1000;

        // How long an already-fetched Historical Data archive stays "fresh enough" to
        // reuse without re-fetching (see fetchHistoricalData). A THIRD independent
        // interval, deliberately not folded into either constant above -- same reasoning
        // as their own comment: these are three separate concerns, and tuning one must
        // not silently move the others.
        //
        // Why this exists at all: HISTORICAL_DATA_CSV_URL is an append-only archive, and
        // it only grows -- the 9-day sample committed to this repo is 6.5MB/8,769 rows,
        // but MEASURED AGAINST THE LIVE URL on 2026-09-15 it was already 15.9MB/22,366
        // rows. Every fetch of it costs that download PLUS a full XLSX.read +
        // sheet_to_json parse of every row: timed in-page against that live archive,
        // 1,957ms to fetch. The parse half was originally quoted here as "8,935ms" --
        // that number was wrong as a description of the FULL parse; it only ever timed
        // ONE of the two sheet_to_json passes the code actually performs (raw:false for
        // values, raw:true for the untouched "Record Date" -- see fetchHistoricalData).
        // The correctly measured figure for the whole inline parse, both passes
        // included, is ~14,199ms of main-thread blocking (measured 2026-09-15 by
        // sampling main-thread responsiveness during a real archive load, same
        // 15.9MB/22,366 rows), for ~16.2s total with the fetch. Corrected 2026-09-16
        // after a docs pass traced the wrong figure back to this comment; see
        // parseHistoricalArchiveInWorker's own comment (which already used the correct
        // number) for where it's used to size the worker's fallback behavior. The parse
        // is synchronous on the main thread. The popover-open effect (see its own comment
        // for the 2026-09-08 staleness bug that put it there) fires on EVERY open, so
        // opening, closing and re-opening the popover three times used to pay all of
        // that three times over. Re-measure before quoting these numbers -- they grow
        // with the archive.
        //
        // Why 15 SECONDS and not something longer: this window exists ONLY to collapse a
        // burst of opens into one fetch. It must stay far shorter than the interval at
        // which the archive can meaningfully change, because the popover-open re-fetch it
        // suppresses is itself the 2026-09-08 bug fix (see that effect's comment).
        //
        // An earlier draft of this used 5 minutes, mirroring the `max-age=300` Google's
        // published-CSV endpoint advertises on this URL, and claimed that "fully preserves"
        // the 2026-09-08 intent. That was wrong, and the reasoning was tidy but aimed at the
        // wrong requirement -- HTTP cache freshness, not user-visible staleness. Concretely:
        // Hoa's daily append lands at 09:00:30; the user opens the popover at 09:00:10 and
        // the fetch completes just before the append, so today is missing; they close it and
        // reopen at 09:03; a 5-minute window skips the re-fetch, today is STILL missing, and
        // nothing on screen says the list is stale. Recovering needs the "Refresh Historical
        // List" button -- exactly the button 2026-09-08 exists because users don't think to
        // click. 15s reproduces none of that (any real "did Hoa post today yet?" re-open is
        // far more than 15s after the last one) while still collapsing the open/close/open
        // burst this guard was added for.
        //
        // The "Refresh Historical List" button always bypasses this window entirely
        // (`{ force: true }`), no matter how recent the last fetch was.
        const HISTORICAL_REFETCH_WINDOW_MS = 15 * 1000;

        // (c) FETCH TIMEOUT (2026-09-16, adversarial-review fix): before this, there was NO
        // timeout anywhere on the archive `fetch()` -- a request silently black-holed by a
        // corporate proxy or a dead connection left "Loading the historical archive..." on
        // screen forever, with no error ever surfaced, and the only visible escape (the
        // "Refresh Historical List" button) just launched a second attempt with the exact
        // same failure mode instead of recovering from the first.
        //
        // Sized deliberately, not copied from an unrelated constant: the archive is 15.9MB,
        // and this must tolerate a genuinely slow but still-working download, not just a
        // fast one -- fetchHistoricalData's own measurement is 1,957ms on a normal
        // connection (see HISTORICAL_REFETCH_WINDOW_MS above), so 60s leaves roughly 30x
        // headroom over that baseline (~270KB/s sustained for the full transfer), comfortably
        // above a throttled/loaded connection while still guaranteeing SOME failure surfaces
        // rather than an infinite hang. This ONLY bounds the network download -- it is
        // deliberately cleared (see fetchHistoricalData) the moment the response body finishes
        // downloading, before the parse phase starts, so it can never fire against a slow-but-
        // healthy Worker parse and wrongly abort it; the parse phase has its own, much longer,
        // budget (HISTORICAL_WORKER_PARSE_TIMEOUT_MS, 5 minutes) for exactly that reason.
        const HISTORICAL_FETCH_TIMEOUT_MS = 60 * 1000;

        // 2026-09-14, per Kevin's "not everyone gets the schedule-change banner at
        // the same time" report: every poll below used to run on a plain
        // `setInterval(fn, POLL_INTERVAL_MS)`, which starts counting from whenever
        // THAT PARTICULAR BROWSER TAB happened to mount -- not from any shared
        // clock. Two people who opened the app minutes apart would poll (and so
        // notice the exact same server-side change) up to a full POLL_INTERVAL_MS
        // apart, purely from that load-time offset. Proved live with two
        // Playwright sessions loaded 15s apart against a shared mock data source:
        // they saw the identical change 10.5s apart despite identical settings
        // (see HANDOFF.md's "Schedule-change notification: not simultaneous
        // across users" entry for the full writeup and numbers).
        //   Fix: align every poll to the next WALL-CLOCK multiple of its own
        // interval (e.g. every 10 minutes means :00/:10/:20/:30/:40/:50 past the
        // hour, UTC) instead of "N minutes after this tab loaded". Since
        // Date.now() is the same real-world millisecond count for every user
        // regardless of timezone, and every interval used here divides evenly
        // into an hour, this makes every tab's poll land within the same handful
        // of seconds of each other (fetch latency + a tick of JS scheduling
        // jitter), not up to a whole interval apart. msUntilNextAlignedTick's
        // `intervalMs - (now % intervalMs)` is exactly "time until the next
        // multiple of intervalMs since the Unix epoch" -- the epoch itself starts
        // on a whole-minute boundary, so this lines up with human-readable clock
        // marks with no timezone math needed. Each poll site below reschedules
        // itself via setTimeout (recomputing the delay fresh each time) rather
        // than a single setInterval, so it self-corrects for the poll's own
        // variable run time and for browser throttling of backgrounded tabs
        // instead of silently drifting off-alignment over a long-running session.
        const msUntilNextAlignedTick = (intervalMs) => intervalMs - (Date.now() % intervalMs);
        // Schedules `fn` to run at the next wall-clock-aligned tick, then again
        // after every subsequent one, indefinitely -- the self-rescheduling
        // replacement for `setInterval(fn, intervalMs)` described above. Returns a
        // cancel function, same shape as `() => clearInterval(id)` at every
        // existing call site, so swapping one for the other needs no other change
        // nearby. `fn` may be sync or async -- awaited either way so two ticks of
        // the same poll can never overlap if `fn` itself ever runs long.
        const scheduleAlignedInterval = (fn, intervalMs) => {
            let timeoutId = null;
            let cancelled = false;
            const tick = async () => {
                if (cancelled) return;
                try { await fn(); } finally {
                    if (!cancelled) timeoutId = setTimeout(tick, msUntilNextAlignedTick(intervalMs));
                }
            };
            timeoutId = setTimeout(tick, msUntilNextAlignedTick(intervalMs));
            return () => { cancelled = true; clearTimeout(timeoutId); };
        };
        const isCsvSourceConfigured = () => !!CSV_SOURCE_URL && !CSV_SOURCE_URL.includes('REPLACE_WITH');

        // SCHEDULE_CHANGE_THRESHOLDS -- 2026-09-08, feeds diffScheduleChange() (see
        // near compareEtd above) and the "Large schedule change" warning banner (see
        // its render block near the other applyCsvText-driven banners).
        //
        // Calibrated 2026-09-08 against Booking_Flash_Historical_Data_2026-08-24_to_
        // 2026-09-01.csv -- 9 real consecutive days, 8 day-over-day diffs, 28 lanes,
        // 368-391 VVDs/day, 223 (lane, day-pair) observations. Full derivation/raw
        // numbers in DATA_ARCHITECTURE.md's entry for this feature; summary below.
        //
        // Two complementary rules decide whether a lane's VVD losses are significant
        // (see diffScheduleChange's own use of these numbers for exactly how they
        // combine): a UNIVERSAL net-loss rule (applies at every lane size) and a
        // SUPPLEMENTARY gross-rate rule (large lanes only). Net loss (removed minus
        // added, i.e. VVDs actually lost with no same-day replacement) is the one that
        // matters most: across all 223 observations it NEVER exceeded 1 in a single
        // lane in a single refresh -- including the archive's single busiest day
        // (2026-08-30->31, a routine weekly voyage-number rollover that swapped 24
        // VVDs for 23 new ones across ~24 different lanes simultaneously, net ~0
        // everywhere but one). A flat percentage threshold alone would have false-
        // positived on that routine day for any small lane (MAR-sized lanes: losing 1
        // of 3 near-term sailings reads as 33%) and would have MISSED a real "lost 2
        // of 5, no replacement" event on a small lane if judged by raw count alone
        // without the net-loss framing. The supplementary rate rule exists for a
        // different case the net-loss rule can't see: a LARGE lane where many VVDs get
        // swapped out and immediately back-filled (net ~0) but the sheer gross
        // proportion changing at once is still worth a heads-up -- the archive's worst
        // *normal* case there (excluding one known data-format artifact, see below)
        // was 13.3% (ANG, 15->15, fully backfilled same day).
        const SCHEDULE_CHANGE_THRESHOLDS = {
            // A lane (>= laneSizeForRatePct VVDs) losing more than this % of its own
            // previous-refresh VVDs at once is flagged, regardless of net loss --
            // catches "most of a large lane got swapped in one refresh" even when
            // backfilled to net-zero. p90/p95/p99 across 223 observations were
            // 6.2%/7.1%/10.0%; worst normal case (lanes >=8 VVDs) was 13.3% -- set well
            // above that with real margin while still catching a genuine multi-sailing
            // loss.
            perLaneRemovedRatePct: 40,
            // Below this many VVDs in a lane (old-dataset count), the rate rule above
            // is too noisy to trust (see this constant's own top comment for why) --
            // use the universal net-loss rule instead for those lanes too. There's a
            // clean gap in observed lane sizes in the calibration data (2-7, then a
            // jump to 10+, nothing at 8-9), so 8 is a real cutoff, not an arbitrary one
            // -- revisit if a future lane ever sits at exactly 8-9 VVDs.
            laneSizeForRatePct: 8,
            // Net VVDs lost (removed minus added) in one lane in one refresh, with NO
            // same-day replacement -- applies at every lane size, not just small ones.
            // Never exceeded 1 anywhere in 223 real (lane, day-pair) observations,
            // including the routine mass-rollover day above -- 2+ never occurred
            // naturally in 9 days of real data, so this fires zero times on the
            // baseline while still catching a real "MAR lost 2 of 3 sailings" event.
            laneNetLossThreshold: 2,
            // >=1 DISTINCT VVD having a Cutoff or ETD flip from POPULATED TO BLANK, or a
            // POL flip TO the literal "NO N.A. CALL", in one refresh -- flagged on its
            // own, independent of the per-lane removed-VVD rules above (this is the
            // exact real-world pattern from the motivating case: the VVD is still
            // present, just with blanked/flipped fields, so a removed-VVD count alone
            // wouldn't catch it). Direction matters and is deliberately NOT symmetric:
            // across all 8 day-pairs / ~3,300 held-in-common VVD comparisons, this
            // populated->blank direction happened on exactly ONE real VVD in the whole
            // archive (7E3T0001W, lane EC4) -- and that VVD disappeared entirely the
            // very next refresh, the closest real analog in this data to Kevin's actual
            // MAR/NLAT0668E incident. The OPPOSITE direction (blank->populated, i.e. a
            // schedule finally being announced, or a sailing's real N.A. port coming
            // back) happened twice in the same archive and was benign both times (a
            // schedule being filled in) -- deliberately excluded from this count so
            // good news doesn't trigger the same warning as bad news. See
            // diffScheduleChange's own dateFlips/polFlips direction tracking.
            concerningFlipVvdThreshold: 1,
        };

        const SECTOR_DATA_CSV_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vTHQ6pKVIaNKU3DiTaLFrqKJS-mr0DP12xhXXcsCvPDJiTolxYOA013WwHZAg5mFC4xN9cPwSNr3-O_/pub?gid=0&single=true&output=csv';
        const isSectorCsvSourceConfigured = () => !!SECTOR_DATA_CSV_URL && !SECTOR_DATA_CSV_URL.includes('REPLACE_WITH');

        // HISTORICAL_DATA_CSV_URL: a THIRD independent "Publish to the web" CSV link,
        // separate from CSV_SOURCE_URL (today's live data) and SECTOR_DATA_CSV_URL
        // (Sector Summary's right pivot). Its shape is different from both of those,
        // though: it's ONE Google Sheet whose rows span MANY dates via a leading
        // "Record Date" column, not a snapshot of just today -- confirmed by fetching
        // the real published link and inspecting it directly (98 columns: "Record
        // Date" plus the exact same 97-column Data_download schema
        // parseWorkbookToRows/getVal() already parse). This is NOT "one published
        // Sheet per historical week" -- an earlier assumption that turned out not to
        // match the real data -- so the app groups this single source's rows by
        // Record Date client-side instead of expecting a separate URL per date. Hoa
        // (a colleague) appends a new day's rows to this Sheet daily, so the
        // distinct-date list is designed to grow unbounded, not fixed at whatever
        // count it happens to have today. Same isXCsvSourceConfigured() placeholder-
        // guard pattern as the other two. Ported from
        // booking_flash_report_na_Kevin_1.10_AUTO_REFRESH.html.
        const HISTORICAL_DATA_CSV_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vR1YNb3SKa8jS53bK2UNLg6DSxUUNKMm36NjAlADroYHeWtb4CZiAfHHHzarRVUw5Z2tIaGVjY174gq/pub?output=csv';
        const isHistoricalCsvSourceConfigured = () => !!HISTORICAL_DATA_CSV_URL && !HISTORICAL_DATA_CSV_URL.includes('REPLACE_WITH');

        // --- Historical archive parsing, off the main thread where possible (2026-09-15) ---
        //
        // WHY: parsing this archive is the single largest block of synchronous work the app
        // does. It runs XLSX.read plus TWO sheet_to_json passes (raw:false for values,
        // raw:true for the untouched "Record Date" -- see fetchHistoricalData for why both
        // are needed) over 15.9MB / 22,366 rows. One pass alone measured 8,935ms on
        // 2026-09-15; nothing repaints for any of it. Since the archive now loads on demand,
        // that block lands on the user's click rather than during page load, where a
        // multi-second freeze reads as the app hanging.
        //
        // WHAT CROSSES THE BOUNDARY: the worker returns `rows` plus `recordDatesRaw` -- just
        // the "Record Date" cell per row, not the whole second raw:true parse. That keeps a
        // full duplicate copy of 22k x 98 cells from being structured-cloned back, and it
        // keeps date NORMALISATION on the main thread using the app's own
        // normalizeRecordDate, so there is no second copy of that logic to drift.
        // Structured-clone of `rows` still costs main-thread time on receipt -- this makes
        // the freeze much smaller, it does not make it zero.
        //
        // SEMANTICS ARE UNCHANGED ON PURPOSE: the worker calls the same SheetJS build with
        // the same options as the inline path below, so output is identical. The CDN URL is
        // read off the page's own <script> tag rather than retyped, so it cannot drift from
        // the pinned version the app loads (deliberate security state -- see the tag's own
        // comment). Chunking sheet_to_json was the other option and was NOT taken: it would
        // change how a CSV is parsed and so require AGENTS.md check 3 (date timezone safety)
        // to be re-run, for a worse result than getting off the thread entirely.
        //
        // FALLS BACK SILENTLY: Workers can be unavailable or blocked -- notably the app is
        // served inside an Apps Script HtmlService sandbox iframe whose CSP is not under our
        // control and may refuse blob: workers. Every failure path (no Worker constructor,
        // construction throw, worker onerror, importScripts failure inside the worker, or a
        // timeout) resolves to null so the caller runs the original inline parse. A blocked
        // worker must never turn a working feature into a broken one.
        // --- localStorage durability probe (2026-09-15) ---
        //
        // THE QUESTION THIS ANSWERS: the app persists three user preferences in
        // localStorage (bookingFlashDarkMode / bookingFlashAutoRefresh /
        // bookingFlashFreezePanes). In production the app is served inside an Apps Script
        // HtmlService sandbox iframe whose own window.location is a TRANSIENT
        // *.googleusercontent.com URL -- the code already knows this and works around it for
        // navigation and update-detection (see checkForAppUpdate). localStorage is keyed by
        // ORIGIN. If that sandbox origin is not stable between page loads, those three
        // preferences silently reset every time and nobody would ever file a bug for it --
        // they would just re-toggle dark mode and shrug.
        //
        // Nothing in this repo had ever tested that, and it can't be tested from a dev
        // machine: it only reproduces on the deployed /exec URL behind the org's Google
        // sign-in. So instead of guessing, the app measures it on itself and reports the
        // answer in Settings, where Kevin can read it in one look in real production.
        //
        // HOW: write a marker containing the origin that wrote it. On the next load, compare.
        //   - marker missing entirely  -> storage is being cleared or is unavailable
        //   - marker present, origin differs -> the origin rotated; prefs DO silently reset
        //   - marker present, origin matches -> prefs persist correctly
        // Every access is wrapped: localStorage can THROW (not just return null) in a private
        // window or with site data blocked, and an uncaught throw here would take the whole
        // app down on load, which is far worse than not knowing the answer.
        const STORAGE_PROBE_KEY = 'bookingFlashStorageProbe';

        const readStorageProbe = () => {
            try {
                const raw = window.localStorage.getItem(STORAGE_PROBE_KEY);
                const now = { origin: String(window.location.origin || 'unknown'), at: Date.now() };
                if (!raw) {
                    try { window.localStorage.setItem(STORAGE_PROBE_KEY, JSON.stringify({ ...now, loads: 1 })); } catch { return { status: 'unwritable' }; }
                    return { status: 'first-run', origin: now.origin };
                }
                let prev = null;
                try { prev = JSON.parse(raw); } catch { prev = null; }
                if (!prev || !prev.origin) {
                    try { window.localStorage.setItem(STORAGE_PROBE_KEY, JSON.stringify({ ...now, loads: 1 })); } catch {}
                    return { status: 'first-run', origin: now.origin };
                }
                const loads = (typeof prev.loads === 'number' ? prev.loads : 1) + 1;
                const rotated = prev.origin !== now.origin;
                try { window.localStorage.setItem(STORAGE_PROBE_KEY, JSON.stringify({ ...now, loads })); } catch {}
                return {
                    status: rotated ? 'origin-rotated' : 'persisting',
                    origin: now.origin,
                    previousOrigin: prev.origin,
                    loads
                };
            } catch (err) {
                return { status: 'unavailable', error: String((err && err.message) || err) };
            }
        };

        const describeStorageProbe = (p) => {
            if (!p) return '';
            if (p.status === 'persisting') return `Saved settings are persisting normally (${p.loads} loads on this browser).`;
            if (p.status === 'first-run') return 'First load on this browser — reopen the report later to confirm saved settings persist.';
            if (p.status === 'origin-rotated') return `⚠️ Saved settings are NOT persisting: this page's storage origin changed (${p.previousOrigin} → ${p.origin}), so Dark Mode / Auto-Refresh / Freeze Panes reset each time.`;
            if (p.status === 'unwritable') return '⚠️ This browser is not allowing the report to save settings, so Dark Mode / Auto-Refresh / Freeze Panes will reset each visit.';
            return '⚠️ This browser is blocking storage entirely, so Dark Mode / Auto-Refresh / Freeze Panes will reset each visit.';
        };

        // --- Server-backed preference sync (2026-09-16) ---
        //
        // See docs/SERVER_PREFS_CONTRACT.md for the frozen contract this implements. Short
        // version: Code.gs's doGet injects `window.__SERVER_PREFS__` as a plain synchronous
        // <script> tag before this app's own <script type="text/babel"> runs (same technique
        // already used for `window.__EXEC_URL__`, see checkForAppUpdate elsewhere in this
        // file), so it is safe to read once, here at module scope, before the component ever
        // mounts. On every non-Apps-Script path (localhost, static hosting) the global is
        // simply absent (`undefined`) -- that, `available:false`, and `available:true` are the
        // three shapes this code has to handle correctly.
        //
        // MUST NEVER THROW: this runs before first paint. `window.__SERVER_PREFS__` itself is
        // trusted (it's our own server's inline script, not user input), but localStorage can
        // THROW -- not just return null -- in a private window or with site data blocked (see
        // the storage probe's own comment above), so every localStorage touch here stays
        // wrapped exactly like the rest of this file.
        const SERVER_PREFS = (typeof window !== 'undefined' && window.__SERVER_PREFS__) || null;

        // Client resolution rule (contract section "Client resolution rule"): server value when
        // available===true AND that key's value is non-null, else localStorage, else null. This
        // returns the resolved RAW STRING only ('1' / '0' / null) -- each preference below still
        // applies its own existing null/'1' semantics on top, unchanged (autoRefresh treats null
        // as "never set" -> default ON; the other two collapse null/'0'/garbage to false). Do not
        // fold that asymmetry into this helper -- it is a deliberate, dated product decision, not
        // an oversight to "clean up".
        const resolveUserPref = (key) => {
            try {
                if (SERVER_PREFS && SERVER_PREFS.available === true && SERVER_PREFS.values &&
                    Object.prototype.hasOwnProperty.call(SERVER_PREFS.values, key)) {
                    const serverValue = SERVER_PREFS.values[key];
                    if (serverValue !== null && serverValue !== undefined) return serverValue;
                }
            } catch { /* fall through to localStorage */ }
            try {
                const stored = window.localStorage.getItem(key);
                return stored === null || stored === undefined ? null : stored;
            } catch {
                return null;
            }
        };

        // --- Field-visibility preferences (2026-09-16) ---
        //
        // Per the 2026-09-15 meeting: field visibility must survive a refresh ("Ensure
        // settings remain in effect after the page is refreshed"). Until now all fifteen of
        // these toggles reset to a hardcoded default on every load.
        //
        // READS go through resolveUserPref above, so if these keys are ever added to the
        // server contract they start resolving server-side with no change here. WRITES are
        // localStorage-only, deliberately: docs/SERVER_PREFS_CONTRACT.md is FROZEN and shared
        // by several concurrently-working agents, and its seed-key set is part of that
        // contract. Quietly pushing fifteen new keys up to Code.gs would change a contract
        // this change has no mandate to change. resolveUserPref falls through to localStorage
        // for any key the server does not know, so this is forward-compatible rather than a
        // fork -- promoting these to server-backed later is a contract amendment plus adding
        // them to SERVER_PREF_SEED_KEYS, not a rewrite of anything below.
        //
        // Note `stored === null ? dflt : stored === '1'` rather than a bare `stored === '1'`:
        // it distinguishes "never set" from "explicitly shown", which a bare comparison
        // collapses -- the same asymmetry autoRefreshEnabled already relies on.
        const FIELD_HIDDEN_DEFAULTS = {
            remarks: true, reefer: true, bsa: true, activity: true, sectorAlloc: false,
            dgVolume: true, opIssues: false, apStatus: true, rotation: true,
            tradeBreakdown: true, vco: true, eta: true,
            // Identity fields default to VISIBLE, unlike the twelve above: hiding a mid-table
            // column shifts every column to its right in the Excel/CSV export (a
            // table_to_sheet scrape of the rendered DOM), so anyone downstream keying on
            // column POSITION rather than header text would break. Defaulting to visible
            // keeps today's export byte-identical unless a user opts out.
            pic: false, status: false, polStatus: false,
        };

        function useFieldVisibilityPref(storageKey, defaultValue) {
            const [value, setValue] = React.useState(() => {
                const stored = resolveUserPref(storageKey);
                return stored === null ? defaultValue : stored === '1';
            });
            React.useEffect(() => {
                try { window.localStorage.setItem(storageKey, value ? '1' : '0'); } catch { }
            }, [storageKey, value]);
            return [value, setValue];
        }

        // Restored (2026-09-17, per Kevin): the on-page macro-button grid, alongside the
        // Fields picker rather than instead of it -- both drive the same useFieldVisibilityPref
        // state above, so toggling from either stays in sync with the other.
        const MacroToggleBtn = ({ hidden, onClick, label }) => (
            <button
                type="button"
                onClick={onClick}
                aria-pressed={!hidden}
                className={`border border-black p-0.5 h-full flex items-center justify-center cursor-pointer hover:brightness-105 text-[9px] leading-tight transition-all ${hidden ? 'bg-[#d9d9d9]' : 'bg-[#a9d08e] dark:bg-[#3d5a34] dark:text-gray-400'}`}
            >
                {hidden ? label : `Hide ${label}`}
            </button>
        );

        /* Macro-grid button ORDER, per tab, by FIELD_TOGGLES key (2026-09-18).
           The grids themselves are now DERIVED from FIELD_TOGGLES filtered by activeTab (see
           macroGridToggles below) instead of being two hand-written arrays of
           {hidden, onClick, label} literals. Those arrays were the same truth written a third
           and fourth time next to the picker's own descriptor list, and they had already been
           deduped once (4219f78) and drifted apart again anyway -- extending a toggle's
           `tabs: [...]` updated the picker but silently left the grid short a button.

           Only the ORDER stays hand-written, because it is genuinely presentational and it is
           NOT derivable: it is the verbatim pre-Fields-picker on-page layout that 320a3f6
           removed and 85d258c restored as a mechanical revert, which is the layout the repo
           owner asked to have back. It is neither alphabetical nor FIELD_TOGGLES order, so
           normalising it would silently rearrange buttons someone has muscle memory for.

           Any tab toggle NOT listed here is APPENDED in FIELD_TOGGLES order rather than
           dropped -- that is the point: a future toggle can never again be silently missing
           from the grid, it just lands at the end until someone places it deliberately. */
        const MACRO_GRID_ORDER = {
            pol_booking: ['reefer', 'activity', 'opIssues', 'eta', 'vco'],
            detail: ['apStatus', 'rotation', 'tradeBreakdown', 'activity', 'remarks',
                     'dgVolume', 'sectorAlloc', 'opIssues', 'bsa', 'reefer'],
        };

        /* Keys the macro grid deliberately does NOT show, even though they are real toggles on
           their tab in FIELD_TOGGLES.

           All three are the SAME artifact, not three separate decisions. `pic` and `status`
           (Detail) and `polStatus` (POL Booking Flash) only became toggles on 2026-09-16 -- they
           were unconditional columns before, see FIELD_HIDDEN_DEFAULTS' own note -- and that is
           the same day 320a3f6 deleted the macro grid. 85d258c restored it the next day as a
           mechanical revert of the older array, which predated all three. So nobody ever decided
           to leave them out of the grid; they simply did not exist when that array was last
           written, and a derived grid would now add three buttons the owner never asked for.

           Excluded rather than added, because this change's mandate is the six new POL toggles
           and the rendered button set should be exactly today's plus those six. Note all three also
           default to VISIBLE, unlike the other twelve, so their buttons would be the only ones
           rendering in the "Hide ..." state on first load.

           Flagged rather than settled: if the owner wants them in the grid, deleting them from
           this list (and placing them in MACRO_GRID_ORDER) is the whole change. */
        const MACRO_GRID_EXCLUDED_KEYS = ['pic', 'status', 'polStatus'];

        // Structural-only availability check (contract section "Client write rule"). Deliberately
        // does NOT look at location.hostname or any other environment sniff -- a hostname check
        // would make the test seam unreachable and silently turn the whole regression suite into
        // a false positive (see the contract). `google.script.run` only exists inside the real
        // Apps Script HtmlService sandbox, so this is already false on localhost/static hosting
        // without needing to ask where the page is running.
        // Which preferences should be pushed UP to the server on this page's first
        // render, and which must not be.
        //
        // The three write-back effects below are keyed on their preference's value, so
        // React runs each of them once on mount as well as on every later change. Left
        // alone that means three google.script.run calls on EVERY page load, each one
        // writing a value that the server itself just supplied -- three Apps Script
        // executions per load per user to achieve nothing, and a transient failure in
        // any of them would flip the Settings status line to 'error' when nothing is
        // actually wrong.
        //
        // But there is exactly one case where a mount write IS the point: a user who
        // has been using this app since before server sync existed has their real
        // choice sitting in localStorage while the server has never heard of them. If
        // we suppressed every mount write, that choice would never migrate up, and the
        // first time they opened the app in another browser it would silently revert to
        // defaults -- the very bug this feature exists to fix.
        //
        // So: seed a key only when the server is reachable, has NO value for it, and
        // localStorage does. Computed once here, at module scope, because it must
        // observe localStorage BEFORE the write-back effects run -- by the time an
        // effect asks, it has already written the value itself and every key would look
        // like it needs seeding.
        const SERVER_PREF_SEED_KEYS = (() => {
            const seed = {};
            const keys = ['bookingFlashDarkMode', 'bookingFlashAutoRefresh', 'bookingFlashFreezePanes'];
            for (const key of keys) {
                let needs = false;
                try {
                    if (SERVER_PREFS && SERVER_PREFS.available === true && SERVER_PREFS.values &&
                        (SERVER_PREFS.values[key] === null || SERVER_PREFS.values[key] === undefined)) {
                        needs = window.localStorage.getItem(key) !== null;
                    }
                } catch { needs = false; }
                seed[key] = needs;
            }
            return seed;
        })();

        // Used by each write-back effect to decide whether its mount run should reach
        // the server. `firstRunRef` is flipped by the caller, so this stays a pure read.
        const shouldSendPrefToServer = (key, isMountRun) =>
            !isMountRun || SERVER_PREF_SEED_KEYS[key] === true;

        const isServerPrefSyncAvailable = () => {
            try {
                return !!(window.__SERVER_PREFS__ && window.__SERVER_PREFS__.available === true &&
                    typeof google !== 'undefined' && google.script && google.script.run);
            } catch {
                return false;
            }
        };

        // Fire-and-forget write to the server, behind the structural check above. `onOutcome`
        // (optional) is called with a boolean once the round trip resolves, purely so the
        // Settings diagnostic line can report it -- nothing here ever reverts local state,
        // throws, alerts, or blocks on the result; the next successful write simply overwrites
        // whatever the server has. Guards the call itself in try/catch too, in case a
        // partially-deployed Code.gs doesn't have `saveUserPref` yet.
        const saveUserPref = (key, value, onOutcome) => {
            try {
                if (!isServerPrefSyncAvailable()) return;
                google.script.run
                    .withSuccessHandler((res) => {
                        try { onOutcome && onOutcome(!!(res && res.ok)); } catch { /* never throw from the callback */ }
                    })
                    .withFailureHandler(() => {
                        try { onOutcome && onOutcome(false); } catch { /* never throw from the callback */ }
                    })
                    .saveUserPref(key, value);
            } catch {
                try { onOutcome && onOutcome(false); } catch { /* never throw from the callback */ }
            }
        };

        // TWO-PHASE TIMEOUT (2026-09-16, fixing a bad worst case): a single timeout covering
        // both "did the worker even start" and "is the parse still running" made the worst
        // case additive instead of a simple upper bound. A worker that's alive but merely
        // slow (a loaded machine, a big archive) would sit through the FULL timeout and only
        // THEN fall back to the ~14,199ms inline parse (measured 2026-09-15, 15.9MB / 22,366
        // rows) -- i.e. timeout + inline, not max(timeout, inline). The timeout could not
        // simply be shortened to fix this: the worker legitimately needs ~14s of CPU on a
        // fast machine and could need several times that on a slow one, so a short deadline
        // would abort healthy in-progress work and force the inline fallback EVERY time,
        // making the common case strictly worse (a Worker whose only job was adding a false
        // negative on top of the same 14s parse it wanted to avoid).
        //
        // The fix separates "never started" from "started, still working": the worker posts
        // { ready: true } the instant its importScripts() call returns successfully -- i.e.
        // the blob: worker wasn't CSP-blocked and the pinned xlsx script actually loaded.
        // Everything after that line is pure CPU-bound parse work, not a startup failure
        // mode, so once `ready` arrives it gets its own, much longer, deadline instead of
        // continuing to run out the short one.
        const HISTORICAL_WORKER_STARTUP_TIMEOUT_MS = 10 * 1000; // "did it even start" only --
        // covers a blob: worker being CSP-blocked, the Worker constructor being unavailable,
        // or importScripts() itself failing (bad/blocked CDN fetch inside the worker). None
        // of those take anywhere near 10s in practice; this exists to fail fast on them, not
        // to bound real work.
        const HISTORICAL_WORKER_PARSE_TIMEOUT_MS = 5 * 60 * 1000; // generous ceiling for the
        // CPU-bound phase, once we already know the worker is alive. The measured inline cost
        // is ~14,199ms on a normal machine; this leaves multiple times that much headroom for
        // a slow one before giving up, while still guaranteeing the promise eventually settles
        // instead of leaving the caller (and the "Loading historical data..." UI) waiting
        // forever on a truly hung worker. Every failure path here still resolves to null, never
        // throws, so the inline parse below stays the guaranteed fallback either way.
        //
        // CANCELLATION (2026-09-16, adversarial-review fix -- unbounded concurrent
        // fetches/workers): the caller can now pass an optional AbortSignal as the second
        // argument. This is how fetchHistoricalData actively tears down a SUPERSEDED attempt
        // (a forced "Refresh Historical List" click, or any newly-started fetch, while a
        // previous one is still running) instead of leaving it to run all the way to
        // completion, or up to HISTORICAL_WORKER_PARSE_TIMEOUT_MS, doing wasted work while
        // holding its own structured-clone of the CSV plus the parsed result. An AbortSignal
        // was chosen over a separately-returned "cancel handle" object because the caller
        // already creates one AbortController per attempt to cancel the `fetch()` itself (see
        // fetchHistoricalData) -- reusing its `.signal` here means ONE controller cancels both
        // the network request and the worker for a given attempt, instead of two independent
        // cancellation mechanisms that could drift out of sync. Aborting resolves to null, the
        // same as every other failure path -- it never rejects/throws -- so this function's
        // contract ("never throws, caller's own seq guard is what actually prevents a stale
        // result from being committed or from falling through to the inline parse") is
        // unchanged.
        const parseHistoricalArchiveInWorker = (csvText, signal) => new Promise((resolve) => {
            let url = null, worker = null, startupTimer = null, parseTimer = null, settled = false;
            const cleanup = () => {
                if (startupTimer) clearTimeout(startupTimer);
                if (parseTimer) clearTimeout(parseTimer);
                try { if (worker) worker.terminate(); } catch {}
                try { if (url) URL.revokeObjectURL(url); } catch {}
                if (signal) signal.removeEventListener('abort', onAbort);
            };
            const finish = (value) => { if (!settled) { settled = true; cleanup(); resolve(value); } };
            const onAbort = () => {
                // Superseded by a newer fetchHistoricalData attempt (or, less commonly, the
                // same controller's fetch-phase timeout firing before this worker even started
                // -- either way, the response is identical: stop doing this work and resolve
                // null so the caller's await unblocks immediately instead of waiting out the
                // full parse timeout). See the big comment above this function for why a
                // shared AbortSignal is the mechanism.
                console.warn('Historical archive worker cancelled (superseded by a newer fetch, or the fetch-phase timeout).');
                finish(null);
            };
            if (signal) {
                if (signal.aborted) { finish(null); return; } // already cancelled before we even started -- e.g. a supersede that landed while this promise's executor was queued but not yet run.
                signal.addEventListener('abort', onAbort);
            }
            try {
                if (typeof Worker === 'undefined' || typeof Blob === 'undefined' || !URL.createObjectURL) return finish(null);
                const tag = document.querySelector('script[src*="xlsx"]');
                const xlsxUrl = tag && tag.src;
                if (!xlsxUrl) return finish(null);
                const src = [
                    'self.onmessage = function (e) {',
                    '  try {',
                    '    importScripts(e.data.xlsxUrl);',
                    // Posted the moment importScripts() returns -- see the two-phase timeout
                    // comment above parseHistoricalArchiveInWorker for why this exists: it is
                    // the one signal that separates "the worker never started" (CSP/blob:
                    // block, missing Worker support, a failed importScripts fetch) from "the
                    // worker is alive and now doing legitimately slow CPU-bound work", which
                    // the two callers must not time out the same way.
                    '    self.postMessage({ ready: true });',
                    '    var wb = XLSX.read(e.data.csvText, { type: "string", raw: true });',
                    '    var ws = wb.Sheets[wb.SheetNames[0]];',
                    '    var rows = XLSX.utils.sheet_to_json(ws, { raw: false, defval: "" });',
                    '    var rawDateOnly = XLSX.utils.sheet_to_json(ws, { raw: true, defval: "" });',
                    '    var recordDatesRaw = rows.map(function (r, i) {',
                    '      return rawDateOnly[i] ? rawDateOnly[i]["Record Date"] : r["Record Date"];',
                    '    });',
                    // PEAK MEMORY (2026-09-16): drop the intermediate raw:true parse as soon
                    // as recordDatesRaw -- the only thing derived from it -- is built, so the
                    // worker's own heap can release ~22k rows' worth of duplicate cells before
                    // the postMessage below has to structured-clone `rows` back to the main
                    // thread. This is a small, safe trim, not a redesign: peak memory during
                    // the parse is still roughly 2x the 15.9MB CSV (the string is cloned INTO
                    // the worker while the main thread's copy is also being dropped around the
                    // same time -- see the caller's own comment -- and `rows` still gets cloned
                    // back out in full). The real fix -- returning only the date list up front
                    // and fetching one date's rows on demand instead of parsing and returning
                    // all 22,366 rows every time -- is a bigger interface change and is
                    // deliberately out of scope here.
                    '    rawDateOnly = null;',
                    '    self.postMessage({ ok: true, rows: rows, recordDatesRaw: recordDatesRaw });',
                    '  } catch (err) {',
                    '    self.postMessage({ ok: false, error: String((err && err.message) || err) });',
                    '  }',
                    '};'
                ].join('\n');
                url = URL.createObjectURL(new Blob([src], { type: 'text/javascript' }));
                worker = new Worker(url);
                worker.onmessage = (ev) => {
                    const d = ev.data;
                    if (d && d.ready) {
                        // Worker is alive and past importScripts -- every failure mode the
                        // startup timeout exists to catch is now ruled out. Swap to the much
                        // longer parse-phase deadline instead of letting the short one keep
                        // running through the actual CPU-bound work (that was the bug: see
                        // the two-phase timeout comment above this function).
                        if (startupTimer) { clearTimeout(startupTimer); startupTimer = null; }
                        parseTimer = setTimeout(() => {
                            console.warn('Historical archive worker parse timed out, falling back to main-thread parse.');
                            finish(null);
                        }, HISTORICAL_WORKER_PARSE_TIMEOUT_MS);
                        return;
                    }
                    if (!d || !d.ok) {
                        console.warn('Historical archive worker failed, falling back to main-thread parse:', d && d.error);
                        return finish(null);
                    }
                    finish({ rows: d.rows, recordDatesRaw: d.recordDatesRaw });
                };
                worker.onerror = (ev) => {
                    console.warn('Historical archive worker errored, falling back to main-thread parse:', ev && ev.message);
                    finish(null);
                };
                startupTimer = setTimeout(() => {
                    console.warn('Historical archive worker never signaled ready, falling back to main-thread parse.');
                    finish(null);
                }, HISTORICAL_WORKER_STARTUP_TIMEOUT_MS);
                worker.postMessage({ csvText, xlsxUrl });
                // PEAK MEMORY (2026-09-16): postMessage() has already queued its own
                // structured-clone copy of csvText for the worker synchronously above -- this
                // function doesn't need its own reference to the 15.9MB string anymore. Null
                // out the parameter binding so it can be GC'd instead of being held alive for
                // the lifetime of this still-pending promise (which can now run for minutes
                // under HISTORICAL_WORKER_PARSE_TIMEOUT_MS). See the caller's own comment for
                // why this only trims, rather than eliminates, the ~2x peak: the worker's own
                // clone and the parsed `rows` cloned back both still exist independently.
                csvText = null;
            } catch (err) {

            // whether or not the data changed -- set inside fetchCsvText itself (see its own
            // comment) so every caller (initial load, the background poll, manual Refresh Now)
            // gets it for free with no duplicated setState calls.

            const [rawRows, setRawRows] = useState([]);
            const [activeTab, setActiveTab] = useState('detail');

            // 2026-09-21 perf: tracks whether the POL tab has EVER been the active tab this
            // session. Mutated during render (not inside an effect) -- a deliberately idempotent
            // ref write, safe under React 18's double-render in StrictMode, that avoids paying an
            // extra render+effect cycle just to flip a one-way flag. Read at PolBookingTablePanel's
            // call site below: once true it stays true, keeping that panel mounted forever (hidden
            // via CSS, not unmounted) so its ~1.5s mount cost is paid once per session instead of
            // on every tab switch. See PolBookingTablePanel's own comment for the measured cost.
            const hasMountedPolTabRef = useRef(false);

            /* Field picker descriptors (2026-09-16, per the 2026-09-15 meeting).

               DECLARED HERE, not up beside the *Hidden declarations, because
               fieldsHiddenOnThisTab below reads `activeTab` -- declared on the line above.
               Evaluated during render rather than inside an effect, reading it any earlier
               is a genuine ReferenceError, not the quieter deferred-effect version of that
               mistake this file already hit once with the Historical Data popover's Escape
               handler. Keep this block below activeTab if either is ever moved.

               One descriptor list drives the picker, the Reset control, the hidden-count
               badge and the header-filter cleanup, so none of them can disagree about which
               fields exist. `filters` is which per-column header filters each toggle gates:
               derived by scanning the renderFilter()/filterCell() keys that actually render
               behind each one, not written from memory -- several are not guessable

               set on Detail than on POL, so its list is the union).

               INVARIANT: a key belongs here only if EVERY render site of it, on every tab,
               is gated by this toggle. headerFilters is one flat map shared by both tabs,
               so a key that renders ungated anywhere is still visible and usable there,
               and clearing it would yank a control the user can still see. Scanning only
               the tabs a toggle claims is NOT enough -- scan the whole file per key.
               tests/check_field_filter_gating.py enforces this, because the rule was
               broken the first time this list was written (see the bsa entry below). */
            const FIELD_TOGGLES = [
                { key: 'pic', label: 'PIC (spc/mkg)', group: 'Identity', hidden: picHidden, set: setPicHidden, tabs: ['detail'], filters: ['pic'] },
                { key: 'status', label: 'Status', group: 'Identity', hidden: statusHidden, set: setStatusHidden, tabs: ['detail'], filters: ['status'] },
                /* polStatus and vco are POL-ONLY by DATA GRAIN, not by oversight -- a
                   2026-09-18 request to also put both (plus eta below) on the Detail tab was
                   measured against real data and declined. Do not "fix" this by adding
                   'detail' to either tabs array.

                   Detail rows are one per vessel-voyage (tableData aggregates by
                   trade-subTrade-lane-saleWeek-vvd-vessel); POL rows are one per voyage x POL
                   leg. Any field not in tableData's numerics/maxes lists is first-leg-wins, so
                   rendering a per-leg field on a Detail row silently shows ONE arbitrary POL's

                   (count of voyages whose legs hold >1 distinct non-blank value):
                     VCO Analyst              281/333 -- per-leg, e.g. HSMT0090E/AT1 reads
                                              Veronica Charlton / Maurice Robinson / Gail
                                              Jordan / Alysha Haygood across its four legs
                     Measures Loading Status    3/333 -- mostly voyage-level, but not reliably
                   Detail's own equivalents are DIFFERENT, genuinely voyage-level source
                   columns, each varying 0/333: 'status' reads Measures Overall Status, 'pic'
                   reads MCT Spc Analyst / MCT Mktg Analyst. Same one-column-per-grain pattern
                   as cutoff/etd vs coastalEtd/portCut already documented in
                   DATA_ARCHITECTURE.md. The reference workbook agrees: its POL_Booking_Flash
                   sheet carries VCO Analyst and its own per-leg Status, and its 47-column
                   Booking_Flash sheet carries neither.

                   polStatus has a second, independent blocker: Detail already ships a toggle
                   labelled "Status" (the 'status' entry above, over Measures Overall Status),
                   so moving this one there would put two identically-labelled "Status" toggles
                   in the same Identity group over two different fields. */
                { key: 'polStatus', label: 'Status', group: 'Identity', hidden: polStatusHidden, set: setPolStatusHidden, tabs: ['pol_booking'], filters: ['loadingStatus'] },
                { key: 'vco', label: 'VCO Analyst', group: 'Identity', hidden: vcoHidden, set: setVcoHidden, tabs: ['pol_booking'], filters: ['vco'] },
                { key: 'apStatus', label: 'AP Status', group: 'Commercial', hidden: apStatusHidden, set: setApStatusHidden, tabs: ['detail', 'pol_booking'], filters: ['apStatus'] },
                /* 'bsaWgt' only, NOT 'bsaTeu' -- still deliberate, and re-decided (not just

                   'bsaTeu' back. It is still NOT added back, because the reason that

                   UNGATED:

                   POL's BSA toggle gates only the NEW column it adds there, BSA Wgt. POL's

                   FIELD_HIDDEN_DEFAULTS' own comment keeps pic/status visible to avoid; and
                   (b) BSA TEU is one of the real POL_Booking_Flash report sheet's own 37

                   So filterCell('bsaTeu', 'BSA TEU') on POL is still ungated, 'bsaTeu' still
                   has an ungated render site, and listing it here would still make ANY
                   toggle flip silently wipe a filter a POL user had typed into a column
                   still on their screen -- the opposite of the harm this mechanism exists to
                   prevent. Add it back only if POL's BSA TEU column itself ever becomes
                   gated by showBsa. */
                { key: 'bsa', label: 'BSA', group: 'Commercial', hidden: bsaHidden, set: setBsaHidden, tabs: ['detail', 'pol_booking'], filters: ['bsaWgt'] },
                { key: 'tradeBreakdown', label: 'Trade Breakdown', group: 'Commercial', hidden: tradeBreakdownHidden, set: setTradeBreakdownHidden, tabs: ['detail', 'pol_booking'], filters: ['imt', 'let', 'lnt', 'lwt', 'tat', 'tpt'] },
                /* On BOTH tabs since 2026-09-18. It was the one exception held back from the
