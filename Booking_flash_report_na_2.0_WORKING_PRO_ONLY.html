                                                    // Determine if we should show the row grouping label and calculate rowspan
                                                    const renderedFields = [];
                                                    for (let rfIdx = 0; rfIdx < rowFields.length; rfIdx++) {
                                                        const isFirstInstance = i === 0 || renderRows[i - 1].path[rfIdx] !== row.path[rfIdx] || 
                                                            (rfIdx > 0 && renderRows[i - 1].path[rfIdx - 1] !== row.path[rfIdx - 1]);
                                                        
                                                        // Only show the cell if it's the first instance AND we are on the first value row (so it doesn't repeat per value row)
                                                        const showVal = isFirstInstance && isFirstValRow;
                                                        
                                                        if (showVal) {
                                                            let groupRowSpan = 0;
                                                            for (let j = i; j < renderRows.length; j++) {
                                                                let samePath = true;
                                                                for(let k=0; k<=rfIdx; k++){
                                                                    if (renderRows[j].path[k] !== row.path[k]) {
                                                                        samePath = false;
                                                                        break;
                                                                    }
                                                                }
                                                                if (samePath) {
                                                                groupRowSpan += dataFields.length; // Span all value rows for this group item
                                                            } else {
                                                                break;
                                                            }
                                                        }
                                                        renderedFields.push(
                                                            <td key={`rl-${rfIdx}`} rowSpan={groupRowSpan} data-autofit-col={`rowLabels-${rfIdx}`} className={`border border-gray-400 py-1 px-1 text-center align-top ${rowFields[rfIdx].cellClass ? rowFields[rfIdx].cellClass : 'bg-gray-50 dark:bg-gray-800'} whitespace-nowrap ${row.level === rfIdx + 1 ? 'font-bold' : ''}`} style={colWidths[`rowLabels-${rfIdx}`] ? { width: colWidths[`rowLabels-${rfIdx}`], minWidth: colWidths[`rowLabels-${rfIdx}`] } : undefined}>
                                                                {row.path[rfIdx]}
                                                            </td>
                                                        );
                                                    }
                                                }

                                                // Calculate if this is a subtotal row or grand total row
                                                const isGrandTotal = row.level === 0;
                                                    const isSubtotal = row.level < rowFields.length && row.level > 0;
                                                    
                                                    let rowSpanContext = null;
                                                    if (isGrandTotal) {
                                                       rowSpanContext = <td rowSpan={dataFields.length} className="border border-gray-400 py-1 px-1 text-left align-top bg-[#d9e1f2] text-black font-bold whitespace-nowrap" colSpan={rowFields.length}>Grand Total</td>;
                                                    } else if (isSubtotal) {
                                                        const label = `${row.label} Total`;
                                                        rowSpanContext = <td rowSpan={dataFields.length} className="border border-gray-400 py-1 px-1 text-left align-top bg-blue-100 dark:bg-blue-900 font-bold whitespace-nowrap" colSpan={rowFields.length - row.level + 1}>{label}</td>;
                                                    }

                                                    return (
                                                        <tr key={`tab-${i}-${dfIdx}`} className={`${customClass || 'bg-white dark:bg-gray-800 hover:bg-gray-50 dark:hover:bg-gray-700'}`}>
                                                            {isFirstValRow && rowSpanContext}
                                                            {!isGrandTotal && !isSubtotal && renderedFields}
                                                            <td data-autofit-col="valuesCol" className={`border border-gray-400 py-1 px-1 text-left font-semibold ${isGrandTotal ? 'bg-[#d9e1f2] text-black' : isSubtotal ? 'bg-blue-100 dark:bg-blue-900' : 'bg-white dark:bg-gray-800'}`} style={colWidths.valuesCol ? { width: colWidths.valuesCol, minWidth: colWidths.valuesCol } : undefined}>{df.label}</td>
                                                            {colKeysWithTotal.map((cKey, cIdx) => {
                                                                let val = 0;
                                                                const tGrp = row.totals[cKey] || {};
                                                                if (df.agg === 'calc' && df.calc) {
                                                                    val = df.calc(tGrp, row.context, cKey);
                                                                } else {
                                                                    const t = tGrp[df.name] || { sum: 0, max: 0, count: 0 };
                                                                    if (df.agg === 'sum') val = t.sum;
                                                                    if (df.agg === 'max') val = t.max;
                                                                    if (df.agg === 'count') val = t.count;
                                                                    if (df.agg === 'avg') val = t.count > 0 ? t.sum / t.count : 0;
                                                                }

                                                                let displayVal = val;
                                                                if (df.format === 'number') displayVal = formatNumberWithCommas(val);
                                                                else if (df.format === 'percent') displayVal = `${Math.round(df.rawFraction ? getPercentNum(val) : val)}%`;
                                                                else if (df.format === 'accounting') displayVal = formatAccountingNumber(val);
                                                                else if (df.format === 'accountingSignedRed') displayVal = formatAccountingSigned(val);

                                                                // Latent-bug fix (correctness audit, 2026-09-10): this is the ONE of
                                                                // PivotTableViewer's render branches (tabular:true + valuesInRows:true) that
                                                                // used to skip the `hideOnLevels` check the other two branches both apply
                                                                // (see the identical `if (df.hideOnLevels...)` block ~40 lines below in the
                                                                // "Tabular without Values In Rows" branch, and again in the default
                                                                // non-tabular tree branch further down) -- a dataField carrying
                                                                // `hideOnLevels: [...]` would render its subtotal/grand-total value here
                                                                // instead of being blanked out like it is everywhere else. Matched exactly:
                                                                // both sibling branches blank the CELL TEXT (`displayVal = ''`) while still
                                                                // rendering the cell's background/border/cClass -- they do not omit the
                                                                // `<td>` itself -- so this does the same, not some alternate "skip the cell"
                                                                // interpretation. This is a no-op today: Trade Summary is the only config
                                                                // that reaches this branch (tabular+valuesInRows), and none of its three
                                                                // dataFields (maxLdn/curLaden/utilization) set `hideOnLevels`, so
                                                                // `df.hideOnLevels` is always undefined here and the condition never fires
                                                                // on the live app. It would only matter if a future Trade-Summary-shaped
                                                                // config added a `hideOnLevels` dataField.
                                                                if (df.hideOnLevels && df.hideOnLevels.includes(row.level)) {
                                                                    displayVal = '';
                                                                }

                                                                const cClass = `${df.cellClass ? df.cellClass(val, tGrp) : ''} ${negativeValueClass(val, df.format)}`.trim();
                                                                const cClassHasOwnBg = cClass.includes('bg-');
                                                                // Class B fix (see HANDOFF.md's "Known bug classes" and getBg's own comment in
                                                                // detailRowStatus above for the fuller writeup): this is the exact mirror of
                                                                // cClassHasOwnBg just above, applied to TEXT color instead of background. A
                                                                // dataField's own cClass (e.g. avgMaxVsBkg's `text-red-600 font-semibold`) can
                                                                // supply a text-color utility without supplying its own background, so checking
                                                                // cClassHasOwnBg alone isn't enough -- the Total column's own `text-black
                                                                // dark:text-gray-100` below would still get concatenated onto the same cell as
                                                                // cClass's `text-red-600`, two same-specificity Tailwind utilities whose winner
                                                                // is decided only by Tailwind's stylesheet insertion order, not by which one
                                                                // appears later in this class string. Omitting our own text-color (but keeping
                                                                // the Total column's background) whenever cClass brings its own makes the
                                                                // winner deterministic from this code instead.
                                                                const cClassHasOwnText = cClass.includes('text-');
                                                                const colKeyStr = cKey === 'Total' ? 'grandTotalValuesCol' : `col:${cKey}`;
                                                                return <td key={cIdx} data-autofit-col={colKeyStr} className={`border border-gray-400 py-1 px-0.5 ${cKey === 'Total' ? 'font-bold' : ''} ${(cKey === 'Total' && !cClassHasOwnBg) ? 'bg-[#eef2fa] dark:bg-blue-950' : ''} ${(cKey === 'Total' && !cClassHasOwnBg && !cClassHasOwnText) ? 'text-black dark:text-gray-100' : ''} ${isGrandTotal ? 'bg-[#d9e1f2] text-black' : isSubtotal ? 'bg-blue-100 dark:bg-blue-900' : ''} ${cClass}`} style={colWidths[colKeyStr] ? { width: colWidths[colKeyStr], minWidth: colWidths[colKeyStr] } : undefined}>{displayVal}</td>;
                                                            })}
                                                        </tr>
                                                    );
                                                })}
                                            </React.Fragment>
                                        );
                                    }

                                    // Tabular without Values In Rows
                                    return (
                                        <tr key={`tab-${i}`} className={`hover:bg-gray-100 dark:hover:bg-gray-700 ${customClass}`}>
                                            {row.level === 0 ? (
                                                <td colSpan={rowFields.length} className="border border-gray-400 py-1 px-1 text-left font-bold bg-[#d9e1f2] text-black whitespace-nowrap">
                                                    Grand Total
                                                </td>
                                            ) : row.level < rowFields.length ? (
                                                <>
                                                    {rowFields.map((rf, rfIdx) => {
                                                        if (rfIdx < row.level - 1) {
                                                            const showVal = i === 0 || renderRows[i - 1].path[rfIdx] !== row.path[rfIdx] || 
                                                                (rfIdx > 0 && renderRows[i - 1].path[rfIdx - 1] !== row.path[rfIdx - 1]);
                                                            
                                                            if (showVal) {
                                                                let rowSpan = 1;
                                                                for (let j = i + 1; j < renderRows.length; j++) {
                                                                    let samePath = true;
                                                                    for(let k=0; k<=rfIdx; k++){
                                                                        if (renderRows[j].path[k] !== row.path[k]) {
                                                                            samePath = false;
                                                                            break;

                                                                return (
                                                                    <td key={`subt-${rfIdx}`} rowSpan={rowSpan} data-autofit-col={`rowLabels-${rfIdx}`} className={`border border-gray-400 py-1 px-1 text-center align-top ${rf.cellClass ? rf.cellClass : 'bg-white dark:bg-gray-800'} font-bold whitespace-nowrap`}>
                                                                        {row.path[rfIdx]}

                                                            return null;

                                                            return <td key={`subt-${rfIdx}`} colSpan={rowFields.length - rfIdx} className="border border-gray-400 py-1 px-1 text-left font-bold bg-blue-100 dark:bg-blue-900 whitespace-nowrap">{row.label} Total</td>;
                                                        }
                                                        return null;

                                                </>
                                            ) : (
                                                rowFields.map((rf, rfIdx) => {
                                                    const showVal = i === 0 || renderRows[i - 1].path[rfIdx] !== row.path[rfIdx] || 
                                                        (rfIdx > 0 && renderRows[i - 1].path[rfIdx - 1] !== row.path[rfIdx - 1]);
                                                    
                                                    if (showVal) {

                                                        for (let j = i + 1; j < renderRows.length; j++) {

                                                        return (

                                                                {getRowStatusBadge(customClass)}{row.path[rfIdx]}

                                            {colKeysWithTotal.map((cKey) => (

                                                        if (df.agg === 'sum') val = t.sum;
