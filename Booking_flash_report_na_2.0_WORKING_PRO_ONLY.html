    <style>
        /* 2026-09-08, per Kevin: a "bubble pop" on the per-slicer clear (x) button --
           see SlicerClearBtn's own comment for how this gets triggered. Not expressible
           as a plain Tailwind utility class (needs a keyframe with a mid-point overshoot,
           not just a two-state transition), so it's the one hand-written CSS rule in this
           otherwise Tailwind-only app. */
        @keyframes bubblePop {
            0%   { transform: scale(1);   opacity: 1; }
            40%  { transform: scale(1.6); opacity: 1; }
            100% { transform: scale(0);   opacity: 0; }
        }
        /* "Row Highlighting & Focus" dimming (2026-09-15, per Kevin), reimplemented as CSS
           on 2026-09-18 after it was measured freezing the whole page for ~41 SECONDS on a
           single click. The original passed `anyRowHighlighted={highlightedRowIds.size > 0}`
           as a prop to EVERY row and derived a per-row `opacity-40` class from it. That one
           boolean flips false->true for all rows at once on the very first highlight (and
           back on the last un-highlight), so React.memo's shallow compare failed for every
           row instance simultaneously and React re-rendered and reconciled the ENTIRE
           un-virtualized table synchronously inside the click handler. Measured on the real
           8,769-row historical CSV, the POL Booking Flash tab renders 9,232 <tr> / 193,417
           <td>: the page went unresponsive for 38+s and the commit landed at ~41,081ms.
           Doing the dim in CSS instead means the 0<->1 transition changes exactly ONE class,
           on the <table> element, and the browser's own selector matching fades the rest --
           no row component re-renders at all, and the browser only PAINTS the ~40 rows
           actually in the viewport rather than all 9,232. This is the same "don't thread a
           table-wide value through per-row props" lesson as the F5 (unthrottled mousemove)
           and F9 (POL field-toggle) freezes; see HANDOFF.md's "Known bug classes".
           Scoped to `tbody` so the sticky <thead> never fades with the body. */
        /* One veil over the table, not a dim on every row. The per-row form of this rule
           (`tbody tr:not(.bf-row-hl) { opacity: .4 }`) was correct and still cost seconds,
           because the price is the NUMBER OF ELEMENTS whose style changes, not which
           property does the fading. Measured on the 9,232-row POL table, forced style+layout
           flush: applying opacity to those rows 31,704ms, removing it 2,864ms -- and even the
           cheapest property tried (outline-color) still cost 2,615ms across the same rows. A
           profile of the real click confirmed where it lands: on Clear Highlights React's own
           commit was 289ms and the browser then spent 3,772ms. React was never the problem
           after the memo fix; the element count was.
           So: veil the whole table with one absolutely-positioned ::after and lift the single
           selected row above it with z-index. Two elements change instead of 9,231, and the
           cost stops scaling with row count -- measured ~220-360ms, symmetric in both
           directions, versus 31,704/2,864.
           Visually this is the same effect, not an approximation: over a white backdrop
           `opacity: .4` yields 0.4*colour + 0.6*white, and a 60%-white veil yields exactly the
           same blend. Verified by screenshot rather than by argument -- a dimmed row measures
           240.5 mean luminance under the veil vs 237.6 under the old opacity rule (3/255,
           imperceptible), with the residual pixel difference confined to text antialiasing.
           Do NOT "simplify" this back to a per-row rule.
           Ordering notes, all verified in a real browser before this shipped:
             - <thead> is sticky at z-20/z-30, above the veil's z-1, so the header stays crisp
               exactly as it did when the dim was scoped to tbody.
             - Freeze Panes' sticky <td>s carry an inline z-index:1, equal to the veil's. The
               ::after is the table's last child, so it paints over them in unhighlighted rows
               (correct -- they should dim), while the selected row's own z-index:2 stacking
               context keeps ITS frozen cells crisp. Scrolled 600px right with Freeze Panes on,
               the highlighted row's sticky cells land at the same x as every other row's.
             - `position: relative` on the <table> makes it a containing block. The only
               absolutely-positioned descendant is the visually-hidden <caption>, which sets no
               offsets and is clipped to 1x1, so it does not move. The hover tooltip is
               deliberately rendered outside the table (see hoverTooltip's own comment). */
        /* 2026-09-21 CORRECTION -- the veil above still wasn't the end of it. Kevin reported
           the app STILL paused noticeably on "Clear Highlights" even after everything above
           shipped. Real CPU profiling (CDP Profiler + Tracing, real historical CSV, POL's
           9,232-row/193k-cell table) found the remaining cost wasn't React -- it was
           `.bf-has-highlight { position: relative; }` ITSELF, toggled on/off the <table>
           element on every 0<->1 transition; toggling `position` forces a layout pass over
           that element's entire subtree (measured in isolation, no React/click-handler
           involved at all: 717-1274ms add / 432-616ms remove -- reproducing essentially the
           whole real-click cost on its own).
           FIRST ATTEMPTED FIX (recorded because it DID NOT WORK, not deleted): make
           `position: relative` an unconditional, never-toggled utility on both tables and
           every row, only ever toggling the veil's `::after` existence and the row's
           z-index/outline via the `.bf-has-highlight`/`.bf-row-hl` CLASSES. Shipped, then
           re-measured with tests/perf_highlight_benchmark.js -- SAME numbers, no improvement.
           Isolating further (direct classList.add/remove timing via page.evaluate, no app
           code involved) found the real, page-wide cause: toggling a CSS CLASS on ANY
           element anywhere on this page -- not just the big table, not just `position` --
           costs hundreds to several thousand ms, highly variably; toggling a plain HTML
           ATTRIBUTE with an equivalent visual effect on the exact same element costs tens of
           ms. The prime suspect (consistent with every measurement, though not confirmed by
           reading its minified source): `cdn.tailwindcss.com`'s own MutationObserver, which
           watches `class` attribute mutations document-wide to catch newly-used utility
           classes needing a JIT compile -- see AGENTS.md's "New bug class: a first-use
           Tailwind utility costs a whole-document style recalc" for the FIRST time this same
           script caused this kind of damage. `bf-has-highlight`/`bf-row-hl` were never
           Tailwind utilities (always plain hand-written CSS, right here), so no compile
           should ever have been needed for them -- but the observer's reaction to ANY
           qualifying class mutation costs real time regardless of whether anything actually
           needed compiling.
           REAL FIX: stop mutating `class` attributes for highlighting, full stop.
           `bf-highlight-host` below is a permanent, never-toggled class -- it fixes
           `position: relative` and the veil's `::after` EXISTENCE once at mount and never
           touches them again. What toggles per click now is a plain data ATTRIBUTE instead
           of a class -- `data-bf-any-highlighted` on the <table>, `data-bf-highlighted` on a
           <tr> -- matched by attribute selectors below. Do NOT go back to toggling a class
           here; if you think you have a reason to, measure with
           tests/perf_highlight_benchmark.js first -- the first fix above looked correct by
           the same reasoning and measured as a no-op. */
        .bf-highlight-host { position: relative; }
        .bf-highlight-host::after { content: ''; position: absolute; inset: 0; background: rgba(255, 255, 255, 0.6); pointer-events: none; z-index: 1; opacity: 0; }
        .dark .bf-highlight-host::after { background: rgba(17, 24, 39, 0.6); }
        .bf-highlight-host[data-bf-any-highlighted="true"]::after { opacity: 1; }
        /* The highlight ring itself, plus the z-index needed to rise above the veil above --
           both keyed off a data ATTRIBUTE now (`data-bf-highlighted`), never a class; see the
           2026-09-21 correction above for why. Previously three Tailwind ARBITRARY-VALUE
           utilities (outline-[3px], outline-[#E5007D], -outline-offset-[2px]) which appear
           nowhere else in this file -- so the Tailwind CDN's JIT had to recognise and inject
           them the very first time any row was highlighted. As plain CSS here it is parsed
           with the rest of the stylesheet before the app renders. Outline rather than a
           background, for the original reason: nearly every <td> sets its own background, which
           would paint over a <tr>-level one, whereas an outline draws round the row's full box
           in its own paint step on top of every cell. */
        tr[data-bf-highlighted="true"] { outline: 3px solid #E5007D; outline-offset: -2px; z-index: 2; }

        /* 2026-09-20, per Kevin: the Lane slicer row (overflow-x-auto, see its own comment
           near availableLanes.map) needs a full-height native scrollbar to appear once its
           buttons overflow -- on Windows with classic (non-overlay) scrollbars, that reserves
           a tall track with its own arrow buttons, rendering as a big empty gray bar between
           Lane and Sales Week. These pseudo-elements/scrollbar-width fully override a
           Chromium/Edge/Firefox scrollbar's own theme for just this element, shrinking that
           track to a slim line without changing the scroll behavior itself. */
        .thin-scrollbar { scrollbar-width: thin; scrollbar-color: #999 transparent; }
        .thin-scrollbar::-webkit-scrollbar { height: 6px; width: 6px; }
        .thin-scrollbar::-webkit-scrollbar-track { background: transparent; }
        .thin-scrollbar::-webkit-scrollbar-thumb { background: #999; border-radius: 3px; }
        .dark .thin-scrollbar::-webkit-scrollbar-thumb { background: #6b7280; }
        .dark .thin-scrollbar { scrollbar-color: #6b7280 transparent; }
    </style>

        // toNum: shared raw-string -> number helper for real arithmetic (Class D, 2026-08-18
        // -- strips thousands-separator commas so "42,079" doesn't truncate to 42 at the first
        // non-numeric char the way a bare parseFloat would). Also strips "%" (some raw percent

        // NEGATIVE 1,234, parentheses standing in for the minus sign instead of accompanying one.
        // Stripping the parens and nothing else silently discarded that sign: toNum("(1,234)")
        // returned +1234, turning a real negative into a positive with no error, no NaN, nothing
        // visibly wrong -- exactly the "silently 100x/sign-flipped" failure mode this file's own
        // helpers have twice shipped at percent-scale (ff07afb, 22af1d4). Neither real export
        // audited on 2026-09-10 (964-row xlsx, 8,769-row live CSV) currently produces a

        // both arrive with a plain leading "-" (e.g. "Max Laden vs POL  Booking" going as low as

        // live comma-formatted CSV eventually hit the pre-Class-D parseFloat. Must NOT fire on
        // this app's OWN "(-N)" accounting-negative display convention (formatAccountingNumber/
        // formatAccountingSigned below, e.g. "(-1,234)") being re-parsed -- that string already
        // carries an explicit minus once the parens are stripped, so it must pass through

        const toNum = (val) => {

            // 2026-09-21, code-review finding: `parseFloat(...) || 0` doesn't exclude
            // Infinity/-Infinity (Infinity is truthy, so `|| 0` never substitutes it) --
            // same gap as getPercentNum/getPeakUtilPercentNum had, just here on the raw-TEU
            // side, where this function silently poisons real SUM/MAX aggregations instead.
            let n = parseFloat(stripped);
            if (!isFinite(n)) n = 0;
            if (/^\(.*\)$/.test(s) && !stripped.startsWith('-') && n !== 0) {

        const getPercentNum = (val) => {

            // percent-formatted cell whose value is >=1,000% can arrive thousands-separated
            // (e.g. "1,036%", confirmed possible here because adjacent raw percent columns in
            // real exports already reach 1400% as bare fractions -- see RFR Utilz%/"Measures
            // POL Reefer Utilz", 28 booked TEU / 2 max TEU = 14 -> 1400%). A bare parseFloat
            // stops at the first non-numeric character, so "1,036%" silently truncated to 1 (as
            // "1%") instead of 1036 -- undetectable without a data point that actually reaches
            // 4 digits. Strip the comma before parsing, exactly like toNum already does; no
            // effect on any value below 1,000% (nothing to strip).
            // 2026-09-21, code-review finding: `parseFloat(...) || 0` and `isNaN(n)` both
            // let Infinity/-Infinity through unmodified (Infinity is truthy, so `|| 0`
            // never substitutes it; isNaN(Infinity) is false), so a raw cell corrupted to

            // export -- silently poisoned every SUM this feeds (curUtilRaw's multi-leg

            // treated like any other bad input. isFinite() rejects NaN and both
            // Infinities, matching this function's existing contract of defaulting bad

            if (s.includes('%')) {

            const scaled = n * 100;

        const getPeakUtilPercentNum = (val) => {

            // 2026-09-10 fix: same comma-truncation hole as getPercentNum above -- a

            // 2026-09-21, code-review finding: this branch returned parseFloat(...)

            // (e.g. an upstream BI divide-by-zero export) returned JS Infinity/-Infinity

            // 2026-09-21, code-review finding: both branches below used to guard with a bare

                const parsed = parseFloat(strVal.replace(/,/g, ''));

        // of falling back like any other bad input. isFinite() closes the same hole here.
        const formatNumberWithCommas = (val) => {
            if (val === '' || val === null || val === undefined) return val;

            if (val === '' || val === null || val === undefined) return val;

            if (val === '' || val === null || val === undefined) return val;
            const num = Math.round(parseFloat(String(val).replace(/,/g, '')));
            if (!isFinite(num)) return val;
            if (num < 0) return `(-${Math.abs(num).toLocaleString('en-US')})`;
            return `+${num.toLocaleString('en-US')}`;
