                // the fallback match, instead of redoing both per row per active filter.
                const activeHeaderFilters = [];
                for (const key in deferredHeaderFilters) {
                    const filterValue = deferredHeaderFilters[key];
                    if (filterValue && filterValue.trim() !== '') {
                        const searchVal = filterValue.toLowerCase().trim();
                        activeHeaderFilters.push({
                            key,
                            searchVal,
                            cleanedSearchVal: searchVal.replace(/[,%()]/g, '')
                        });
                    }
                }

                rawRows.forEach(row => {
                    const matchSubTrade = subTradeSet.size === 0 || subTradeSet.has(row.subTrade);
                    const matchAnalyst = analystsLower.length === 0 || (row.pic && analystsLower.some(analystLower =>
                        row.pic.toLowerCase().includes(analystLower)
                    ));
                    // MKG PIC (2026-09-09) -- same substring-against-the-whole-pic-string
                    // matching convention as matchAnalyst just above, deliberately: a loose
                    // "includes" check, not isolated to the split Mktg half specifically, for
                    // identical behavior/precision to the existing SPC Analyst filter.
                    const matchMktgAnalyst = mktgAnalystsLower.length === 0 || (row.pic && mktgAnalystsLower.some(mktgLower =>
                        row.pic.toLowerCase().includes(mktgLower)
                    ));
                    const matchLane = laneSet.size === 0 || laneSet.has(row.lane);
                    const matchCoast = coastSet.size === 0 || coastSet.has(row.coast);
                    const matchSaleWeek = saleWeekSet.size === 0 || saleWeekSet.has(row.saleWeek);
                    // NOTE: these two read `detailTabAffectsFilter`/`polTabAffectsFilter`,
                    // NOT the raw `isDetailTab`/`isPolBookingTab`. That is deliberate and
                    // load-bearing -- see their declarations for why. Those two names are
                    // what this memo's dependency array lists, so reading only them keeps
                    // the dependency array complete BY CONSTRUCTION: there is no way for a
                    // future edit here to depend on a tab value the memo isn't keyed on.
                    // Don't "simplify" either line back to the raw boolean.
                    const matchYard = detailTabAffectsFilter || yardSet.size === 0 || yardSet.has(row.yard);

                    // Named for its ONLY legitimate use -- deciding whether this row passes
                    // the AP Status slicer -- and deliberately not `currentStatusField`,
                    // which invited reuse as "this row's status". It is not that: when no AP
                    // Status is selected, `polTabAffectsFilter` is false on every tab, so on
                    // POL this holds `row.status` rather than the `row.loadingStatus` that
                    // tab displays. Harmless for the comparison below (which short-circuits
                    // on an empty selection) and wrong for anything else -- if you need the
                    // row's real status field, derive it separately from `isPolBookingTab`
                    // and add that to the dependency array.
                    const apStatusFieldForFilter = polTabAffectsFilter ? row.loadingStatus : row.status;
                    const matchApStatus = apStatusSet.size === 0 || apStatusSet.has(apStatusFieldForFilter);

                    let matchHeaderFilters = true;
                    for (let i = 0; i < activeHeaderFilters.length; i++) {
                        const { key, searchVal, cleanedSearchVal } = activeHeaderFilters[i];
                        const rawRowVal = String(row[key] || '').toLowerCase();
                        const cleanedRowVal = rawRowVal.replace(/[,%()]/g, '');

                        if (!rawRowVal.includes(searchVal) && !cleanedRowVal.includes(cleanedSearchVal)) {
                            matchHeaderFilters = false;
                            break;
                        }
                    }

                    const headerAndApMatch = matchApStatus && matchHeaderFilters;

                    if (headerAndApMatch && matchAnalyst && matchMktgAnalyst && matchLane && matchCoast && matchSaleWeek && matchYard) vSubTrades.add(row.subTrade);
                    if (headerAndApMatch && matchSubTrade && matchMktgAnalyst && matchLane && matchCoast && matchSaleWeek && matchYard) {
                        const raw = String(row.pic || '').trim();
                        if (raw.includes('/')) {
                            const spc = raw.split('/')[0].trim();
                            if (spc) vAnalysts.add(spc);
                        }
                    }
                    if (headerAndApMatch && matchSubTrade && matchAnalyst && matchLane && matchCoast && matchSaleWeek && matchYard) {
                        const raw = String(row.pic || '').trim();
                        if (raw.includes('/')) {
                            const mktg = raw.split('/')[1].trim();
                            if (mktg) vMktgAnalysts.add(mktg);
                        }
                    }
                    if (headerAndApMatch && matchSubTrade && matchAnalyst && matchMktgAnalyst && matchCoast && matchSaleWeek && matchYard) vLanes.add(row.lane);
                    if (headerAndApMatch && matchSubTrade && matchAnalyst && matchMktgAnalyst && matchLane && matchSaleWeek && matchYard) vCoasts.add(row.coast);
                    if (headerAndApMatch && matchSubTrade && matchAnalyst && matchMktgAnalyst && matchLane && matchCoast && matchYard) vSaleWeeks.add(row.saleWeek);
                    if (headerAndApMatch && matchSubTrade && matchAnalyst && matchMktgAnalyst && matchLane && matchCoast && matchSaleWeek) vYards.add(row.yard);

                    if (matchSubTrade && matchAnalyst && matchMktgAnalyst && matchLane && matchCoast && matchSaleWeek && matchYard && headerAndApMatch) {
                        fRows.push(row);
                    }
                });

                return {
                    filteredRawRows: fRows,
                    validSubTrades: vSubTrades,
                    validCoasts: vCoasts,
                    validAnalysts: vAnalysts,
                    validMktgAnalysts: vMktgAnalysts,
                    validLanes: vLanes,
                    validSaleWeeks: vSaleWeeks,
                    validYards: vYards
                };
            }, [rawRows, deferredSelectedSubTrades, deferredSelectedAnalysts, deferredSelectedMktgAnalysts, deferredSelectedLanes, deferredSelectedCoasts, deferredSelectedSaleWeeks, deferredSelectedYards, deferredSelectedApStatuses, deferredHeaderFilters, detailTabAffectsFilter, polTabAffectsFilter]);

            // The inputs that can actually change a measured POL column width, declared
            // ONCE as a single object. This object is the single source of truth for BOTH
            // the effect's dependency array (spread below, via polAutoFitDepValues) and the
            // skip guard's comparison -- deliberately, so the two cannot drift apart.
            //
            // The previous version listed these fields three times: in the dep array, in the
            // guard's comparison, and in the object written to the ref. Adding a POL
            // column-visibility toggle to the dep array while missing the other two spots
            // would have silently DISABLED re-measurement for it: the effect re-runs, the
            // guard sees its tracked fields unchanged, returns early, and the new column
            // keeps a stale width. No error, visual-only, so it would ship. A new entry here
            // updates the dep array and the guard at once.
            //
            // 2026-09-18: this list used to hold only five of the toggles that gate POL
            // columns. The other seven were left out ON PURPOSE, because every entry here was
            // another trigger for a pass that re-measured all ~19.5k cells, and leaving them
            // out was the only thing keeping those seven toggles fast -- at the cost of a
            // newly revealed column starting at its CSS min-width instead of a fitted one.
            // That trade is gone: the pass below now measures only the columns that do not
            // already have a width (see its own comment), so a toggle that reveals ONE column
            // measures that column's cells and nothing else, and a toggle that only HIDES
            // columns measures nothing at all and returns immediately. All twelve are listed
            // now, so every POL column auto-fits on the click that reveals it.
            const polAutoFitDeps = {
                rows: filteredRawRows,
                polStatus: polStatusHidden,
                reefer: reeferHidden,
                activity: activityHidden,
                eta: etaHidden,
                opIssues: opIssuesHidden,
                vco: vcoHidden,
                bsa: bsaHidden,
                rotation: rotationHidden,
                apStatus: apStatusHidden,
                tradeBreakdown: tradeBreakdownHidden,
                dgVolume: dgVolumeHidden,
                remarks: remarksHidden,
                sectorAlloc: sectorAllocHidden
            };
            // Object.values() preserves insertion order for string keys, so this array's
            // length and ordering are stable across renders -- the two things React requires
            // of a dependency array. Spread into it below rather than listed by hand.
            const polAutoFitDepValues = Object.values(polAutoFitDeps);
            const polAutoFitSigRef = useRef(null);
            // Which column keys already have a measured width for the CURRENT row set. Reset
            // whenever the rows change; otherwise it only ever grows, as columns are revealed.
            const polMeasuredKeysRef = useRef(new Set());

            useLayoutEffect(() => {
                if (activeTab !== 'pol_booking') return;
                const container = polTableContainerRef.current;
                if (!container) return;

                // 2026-09-15 perf: skip the whole measurement pass when nothing that can
                // change a width has changed since the last one that ran.
                //
                // `activeTab` HAS to stay in the dependency array below -- it's what makes
                // this run when the user first arrives on POL, since before that the table
                // isn't mounted and `polTableContainerRef.current` is null, so an earlier
                // run bailed at the check above without measuring anything. But that also
                // means React re-runs this on EVERY switch back to POL, even when the rows
                // and column-visibility flags are identical and `polColWidths` (state,
                // which survives the tab switch) already holds the exact widths this pass
                // would recompute.
                //
                // That was not cheap: measured on the live data 2026-09-15, this table has
                // ~19.5k `[data-autofit-col]` cells and the pass builds a Range +
                // getBoundingClientRect for every one of them -- 307-473ms of forced layout --
                // to produce **23** column widths. Paid again on every return to the tab.
                //
                // The booleans are booleans and `filteredRawRows` is a memoized array whose
                // identity is stable unless the filters actually changed, so an identity/===
                // comparison here is exact -- this can only skip a pass whose inputs are
                // genuinely unchanged, never one that would have produced a different width.
                // Set AFTER the container check so a run that bailed early (table not mounted
                // yet) doesn't poison the cache.
                //
                // NOTE this deliberately does not add `zoomLevel`/`textSizePx`, which do
                // affect rendered text width: POL's auto-fit never depended on them (the
                // Detail table's equivalent effect does). That's a pre-existing gap, not
                // something this guard introduces or should silently change.
                //
                // IF YOU EVER CLOSE THAT GAP, two places need changing, not one. Adding
                // zoomLevel/textSizePx to polAutoFitDeps re-runs this effect, but the
                // incremental path below would then find no NEW column keys and return
                // having measured nothing -- every width would stay at its old font size,
                // silently. They must also invalidate `polMeasuredKeysRef` the way a row-set
                // change does, i.e. be folded into the `rowsChanged` condition just below
                // (rename it, it stops being about rows). The same applies to anything else
                // that can change a cell's rendered text WITHOUT changing `filteredRawRows`:
                // today nothing does -- renderAsteriskHide/renderSecAlloc/formatDate and the
                // rest are pure functions of the row -- and that is what makes the memo below
                // exact rather than merely usually-right.
                const lastSig = polAutoFitSigRef.current;
                if (lastSig && Object.keys(polAutoFitDeps).every(k => lastSig[k] === polAutoFitDeps[k])) {
                    return;
                }
                // Row-set changes can change any column's widest value, so they invalidate
                // every cached key. A pure column-visibility change cannot: with
                // `white-space: nowrap` forced (below), a cell's measured content width is a
                // function of its own text and font, NOT of how much room its column was
                // given -- so revealing or hiding a NEIGHBOURING column cannot alter it. That
                // is what makes the incremental path below exact rather than an approximation.
                const rowsChanged = !lastSig || lastSig.rows !== polAutoFitDeps.rows;
                polAutoFitSigRef.current = polAutoFitDeps;
                if (rowsChanged) polMeasuredKeysRef.current = new Set();

                // 2026-09-18 perf -- measure only the columns that still need a width.
                //
                // Every column key in the table is readable from the ~25 header cells, which
                // is cheap to query; the ~21k BODY cells are what cost 300ms+ to measure. So
                // read the key set from the headers first and diff it against what has already
                // been measured for this row set:
                //   - nothing new (the common case -- any toggle that HIDES columns, and every
                //     return to this tab) -> return without touching a single body cell;
                //   - one revealed column -> measure that column's ~1.4k cells, not all 21k.
                // Combined with the keyed <tbody> (see polColumnSignature), this is what took
                // the worst toggle on this tab from 9,116ms to the low hundreds. Re-measure
                // the numbers with tests/perf_toggle_benchmark.js before changing any of it.
                const headerCells = container.querySelectorAll('thead [data-autofit-col]');
                const measured = polMeasuredKeysRef.current;
                const pendingKeys = [];
                headerCells.forEach(el => {
                    const key = el.getAttribute('data-autofit-col');
                    if (key && !measured.has(key) && !pendingKeys.includes(key)) pendingKeys.push(key);
                });
                if (pendingKeys.length === 0) return;

                // Attribute-selector values are quoted, so the only characters that could break
                // out are a double quote or a backslash. No column label contains either today
                // (they are things like `RFR Utilz%`, `Inland w/Activity`, `SGSIN Dry vs RFR`),
                // but a future label could, and a malformed selector would throw inside a
                // layout effect and blank the tab. Fall back to measuring everything in that
                // case: slower, never broken.
                const needsFallback = pendingKeys.some(k => k.includes('"') || k.includes('\\'));
                const cells = needsFallback
                    ? container.querySelectorAll('[data-autofit-col]')
                    : container.querySelectorAll(pendingKeys.map(k => `[data-autofit-col="${k}"]`).join(','));

                // Deduplicated: see measureAutoFitMaxWidths for why, and for the measurements.
                // This is the site that matters -- on the first switch to this tab every column
                // key is still pending, so `cells` is every auto-fit cell in the table.
                const maxByKey = measureAutoFitMaxWidths(cells);

                // Mark every key this pass actually produced a number for. Keys are recorded
                // here rather than from `pendingKeys` so a key whose cells were not in the DOM
                // (nothing matched the selector) is retried on the next pass instead of being
                // cached as done with no width.
                Object.keys(maxByKey).forEach(key => measured.add(key));

                const AUTO_FIT_PADDING = 22;
                const AUTO_FIT_MIN = 40;
                setPolColWidths(prev => {
                    let changed = false;
                    const next = { ...prev };
                    Object.keys(maxByKey).forEach(key => {
                        if (manualPolColWidthKeysRef.current.has(key)) return;
                        const target = Math.ceil(Math.max(AUTO_FIT_MIN, maxByKey[key] + AUTO_FIT_PADDING));
                        if (Math.abs((prev[key] || 0) - target) > 1) {
                            next[key] = target;
                            changed = true;
                        }
                    });
                    return changed ? next : prev;
                });
            }, [activeTab, ...polAutoFitDepValues]);

            const compareData = useMemo(() => {
                if (rawRows.length === 0 || oldRawRows.length === 0) return null;

                // 2026-09-03: apply the same slicer selections (Sub Trade, Coast, SPC
                // Analyst, Lane, Sale Week, Yard, AP Status) used everywhere else in the
                // app, so the comparison only covers what's currently sliced-to -- this
                // previously ran against the full unfiltered rawRows/oldRawRows no matter
                // what was selected in the slicer panel, silently ignoring it. Deliberately
                // NOT reusing filteredRawRows: that useMemo only covers the current/live
                // dataset (no "old" counterpart), and also folds in the per-column header
                // text filters and "valid option" set-building that only the wired-in table
                // tabs need -- this is its own small predicate instead, applied to both
                // datasets. Yard is applied unconditionally (unlike filteredRawRows, which
                // skips it on the Detail tab) since Compare's rows are the same per-POL-leg
                // grain as POL Booking Flash/Trade/Sector Summary, not Detail's per-vessel
                // grain.
                // Loop-invariant precomputation, the same treatment F3 gave the main
                // filteredRawRows memo (see its own `subTradeSet`/`analystsLower` block) --
                // which this predicate never received, because it is a deliberate separate
                // implementation (see the comment above) and the F3 pass only touched the
                // other one. Every right-hand side below is identical for all rows: the
                // membership lists become Sets (O(1) instead of an O(k) Array#includes scan
                // per row per filter) and the analyst names are lowercased once instead of
                // once per row per selected analyst. Applied across BOTH rawRows and
                // oldRawRows, the full unfiltered arrays, on every slicer click.
                const cmpSubTradeSet = new Set(selectedSubTrades);
                const cmpLaneSet = new Set(selectedLanes);
                const cmpCoastSet = new Set(selectedCoasts);
                const cmpSaleWeekSet = new Set(selectedSaleWeeks);
                const cmpYardSet = new Set(selectedYards);
                const cmpApStatusSet = new Set(selectedApStatuses);
                const cmpAnalystsLower = selectedAnalysts.map(analyst => analyst.toLowerCase());
                const cmpMktgAnalystsLower = selectedMktgAnalysts.map(mktg => mktg.toLowerCase());

                const matchesSlicers = (row) => {
                    if (cmpSubTradeSet.size > 0 && !cmpSubTradeSet.has(row.subTrade)) return false;
                    // `!row.pic` reproduces the original `row.pic && ...` guard exactly: when a
                    // row has no PIC, the old callback was falsy for every selected analyst, so
                    // .some() was false and the row was rejected. row.pic is lowercased once per
                    // row here rather than once per selected analyst.
                    if (cmpAnalystsLower.length > 0) {
                        if (!row.pic) return false;
                        const picLower = row.pic.toLowerCase();
                        if (!cmpAnalystsLower.some(analystLower => picLower.includes(analystLower))) return false;
                    }
                    if (cmpMktgAnalystsLower.length > 0) {
                        if (!row.pic) return false;
                        const picLower = row.pic.toLowerCase();
                        if (!cmpMktgAnalystsLower.some(mktgLower => picLower.includes(mktgLower))) return false;
                    }
                    if (cmpLaneSet.size > 0 && !cmpLaneSet.has(row.lane)) return false;
                    if (cmpCoastSet.size > 0 && !cmpCoastSet.has(row.coast)) return false;
                    if (cmpSaleWeekSet.size > 0 && !cmpSaleWeekSet.has(row.saleWeek)) return false;
                    if (cmpYardSet.size > 0 && !cmpYardSet.has(row.yard)) return false;
                    if (cmpApStatusSet.size > 0 && !cmpApStatusSet.has(row.status)) return false;
                    return true;
                };
                const newRows = rawRows.filter(matchesSlicers);
                const oldRows = oldRawRows.filter(matchesSlicers);

                // 2026-09-04 (math/logic audit): slicer option lists (availableLanes,
                // saleWeekOptions, etc.) are only ever built from rawRows (the current/new
                // file) -- oldRawRows never contributes to what's selectable. So a user can
                // select a Lane/Sale Week/etc. that exists in the new file but not at all in
                // the old one (a lane added since the old snapshot, differing week coverage,
                // ...), filtering oldRows down to zero while newRows keeps its full filtered
                // set. Nothing previously signaled this -- it just rendered as e.g. "Vessels
                // Old: 0 -> New: 74 (+74)", indistinguishable from genuine 100% growth.
                // Confirmed live: removing a lane from the "old" side entirely and selecting
                // it as a slicer reproduced exactly that misleading reading on every KPI
                // tile. Flag it here (only when the UNFILTERED side had real data -- a file
                // that's just plain empty is a different, already-handled case) so the
                // render can show an explicit warning instead of a silently-misleading delta.
                const oldZeroedBySlicers = oldRawRows.length > 0 && oldRows.length === 0;
                const newZeroedBySlicers = rawRows.length > 0 && newRows.length === 0;

                const keyOf = (row) => {
                    const vvd = String(row.vvd || '').trim();
                    const pol = String(row.pol || '').trim();
                    return (vvd && pol) ? `${vvd}|${pol}` : null;
                };

                const oldByKey = new Map();
                oldRows.forEach(row => { const k = keyOf(row); if (k && !oldByKey.has(k)) oldByKey.set(k, row); });
                const newByKey = new Map();
                newRows.forEach(row => { const k = keyOf(row); if (k && !newByKey.has(k)) newByKey.set(k, row); });

                // 2026-09-09 (found while investigating Kevin's POL Analyze-modal Max Laden
                // report -- same bug shape, a different spot): "Vessel Utilz" (curUtilRaw,
                // "Measures Overall Booking Utilz") and "Peak Utilz" (peakUtilRaw, "Measures
                // Peak Overall Utilz") are both per-(VVD, POL-leg) raw fragments at this row's
                // own grain -- Compare's rows are deliberately per-leg (see keyOf above), so
                // reading row.curUtilRaw/row.peakUtilRaw directly gives one leg's own slice, not
                // the true vessel-wide figure Booking Flash/Detail renders under these same
                // labels. tableData (Detail's own aggregation) already knows this: it SUMs
                // curUtilRaw across a VVD's legs (the 2026-09-03 fix, DATA_ARCHITECTURE.md) and
                // MAXes peakUtilRaw (the 2026-09-09 percent-scale fix elsewhere in this file) --
                // Compare's own diff never adopted either aggregation, since it bypasses
                // tableData entirely. Confirmed live via two real production pulls ~5 hours
                // apart: 54 distinct VVDs got 2+ separate "Vessel Utilz changed" rows in the same
                // comparison, and for at least 2 of them (TSTT0053W, QUIT0020W) the TRUE
                // vessel-level Current Laden Utiliz % never moved at all (21%->21%, 28%->28%) --
                // their legs simply shifted in opposite directions and canceled out -- while
                // Compare still flagged the vessel as "changed" twice, and the one correct
                // number never appeared anywhere. Fixed by aggregating both fields per VVD,
                // across BOTH datasets, mirroring tableData's own logic exactly (SUM via
                // getPercentNum for curUtilRaw, MAX via getPeakUtilPercentNum for peakUtilRaw),
                // and reading that aggregate here instead of the raw per-leg value -- maxLdn
                // stays untouched (confirmed live: byte-identical across every leg of every
                // real multi-leg VVD today, a genuine vessel-wide constant, not a fragment), and
                // curLaden stays untouched too (it's supposed to be POL-scoped here, same as
                // POL Booking Flash's own per-leg render -- Compare's row already carries its
                // own POL column right next to VVD, so a per-leg Current Laden reads correctly
                // in a context that's explicit about being POL-scoped).
                const sumPercentByVvd = (rows, key) => {
                    const map = new Map();
                    rows.forEach(row => {
                        const vvd = String(row.vvd || '').trim();
                        if (!vvd) return;
                        map.set(vvd, (map.get(vvd) || 0) + getPercentNum(row[key]));
                    });
                    return map;
                };
                const maxPeakByVvd = (rows, key) => {
                    const map = new Map();
                    rows.forEach(row => {
                        const vvd = String(row.vvd || '').trim();
                        if (!vvd) return;
                        const v = getPeakUtilPercentNum(row[key]) || 0;
                        if (!map.has(vvd) || v > map.get(vvd)) map.set(vvd, v);
                    });
                    return map;
                };
                const oldCurUtilByVvd = sumPercentByVvd(oldRows, 'curUtilRaw');
                const newCurUtilByVvd = sumPercentByVvd(newRows, 'curUtilRaw');
                const oldPeakUtilByVvd = maxPeakByVvd(oldRows, 'peakUtilRaw');
                const newPeakUtilByVvd = maxPeakByVvd(newRows, 'peakUtilRaw');
                // Known, accepted trade-off: a VVD's leg rows are diffed independently (see the
                // main loop below), so if the true vessel-level Vessel/Peak Utilz genuinely
                // changed, every one of that VVD's leg rows will now show the identical,
                // correct diff line -- once per leg, not deduplicated to a single row. Showing
                // the same correct number twice is a cosmetic nit; showing two different wrong
                // numbers once each (the pre-fix behavior) is the actual bug, and this fixes
                // that.

                const TRACKED_FIELDS = [
                    { key: 'statusDisplay', label: 'Status', type: 'text' },
                    { key: 'pic', label: 'PIC', type: 'text' },
                    { key: 'vessel', label: 'Vessel', type: 'text' },
                    { key: 'maxLdn', label: 'Max Laden', type: 'number' },
                    { key: 'curLaden', label: 'Current Laden', type: 'number' },
                    { key: 'curUtilRaw', label: 'Vessel Utilz', type: 'percent' },
                    { key: 'peakUtilRaw', label: 'Peak Utilz', type: 'percent' },
                    // 2026-09-15, per Kevin: extend this tab's existing vessel-change tracking to
                    // also flag ETD/1st POL Cutoff changes -- ongoing data-quality issue with these
                    // two dates going missing or changing on the live source. No "carry forward
                    // the last known date" behavior here by design -- Kevin explicitly asked to
                    // hold off on that.
                    //
                    // Scope note vs. the separate, unrelated scheduleChangeWarning feature (the
                    // auto-refresh side of the same underlying data problem, see diffScheduleChange
                    // above): that detector only fires on a blank<->populated TRANSITION
                    // (isBlankVal(old) !== isBlankVal(new)) -- it does not catch a populated value
                    // changing to a different populated value (e.g. cutoff shifting 6/29->6/30
                    // while staying non-blank). This tab's manual-snapshot compare below flags ANY
                    // value change, blank or not, so the two features are not full parity with each
                    // other despite covering the same two fields -- a same-populated-value change is
                    // currently visible ONLY here, not on the live auto-refresh banner. Unifying them
                    // (or deciding the auto-refresh side should also catch this) is a product
                    // decision for Kevin, not made here.
                    { key: 'cutoff', label: '1st POL Cutoff', type: 'date' },
                    { key: 'etd', label: 'ETD Last Port', type: 'date' },
                ];
                // 2026-09-04 (math/logic audit): peakUtilRaw needs getPeakUtilPercentNum,
                // not the plain getPercentNum every other percent field here uses -- same
                // double-scaling bug fixed on the Detail/POL tabs earlier today (a raw
                // value that's already percent-scale, e.g. 214 meaning 214%, was getting
                // an extra *100 applied, showing 21400%). This tab had its own separate
                // copy of the percent-parsing logic that never got that fix, so a vessel's
                // Peak Utilz change would still show the old double-scaled numbers here
                // even though the Detail/POL tabs now render it correctly. getPeakUtilPercentNum
                // returns NaN (not 0) for a blank value, so it's wrapped to fall back to 0 --
                // matching getPercentNum's own blank-input convention -- otherwise two blank
                // values would compare as NaN !== NaN (always true in JS) and get flagged as
                // a spurious "change" on every vessel missing this field on both sides.
                const peakUtilPercentSafe = (val) => { const n = getPeakUtilPercentNum(val); return isNaN(n) ? 0 : n; };
                const percentNumFor = (field, val) => field.key === 'peakUtilRaw' ? peakUtilPercentSafe(val) : getPercentNum(val);
                // 'side' ('old'/'new') picks which VVD-aggregate map to consult for the two
                // vessel-scoped fields above; every other field still reads straight off the
                // per-leg row as before.
                // 1st POL Cutoff/ETD Last Port use formatDateOnly (2026-09-15), not formatDate,
                // so an incidental time-of-day component on the raw cell (a live-source export
                // inconsistency) never makes an unchanged date look like a change, and so these
                // fields render identically here and in the Detail table/Report Card regardless
                // of whether a time component happens to be present -- see formatDateOnly's own
                // comment. formatDate()/formatDateOnly() both already return '' for a blank/
                // missing value, so a date going missing (or appearing) compares against '' and
                // correctly registers as a change.
                const fieldVal = (row, field, side) => {
                    if (field.key === 'curUtilRaw') return Math.round((side === 'old' ? oldCurUtilByVvd : newCurUtilByVvd).get(String(row.vvd || '').trim()) || 0);
                    if (field.key === 'peakUtilRaw') return Math.round((side === 'old' ? oldPeakUtilByVvd : newPeakUtilByVvd).get(String(row.vvd || '').trim()) || 0);
                    if (field.type === 'text') return String(row[field.key] || '').trim();
                    if (field.type === 'percent') return Math.round(percentNumFor(field, row[field.key]));
                    if (field.type === 'date') return formatDateOnly(row[field.key]);
                    return Math.round(toNum(row[field.key]));
                };
                const formatFieldVal = (row, field, side) => {
                    if (field.key === 'curUtilRaw' || field.key === 'peakUtilRaw') return `${fieldVal(row, field, side)}%`;
                    if (field.type === 'text') return String(row[field.key] || '').trim() || '—';
                    if (field.type === 'percent') return `${Math.round(percentNumFor(field, row[field.key]))}%`;
                    // Same blank-fallback convention as the 'text' branch above, so a date going
                    // missing shows as "... -> —" in Notable Vessel Changes, not a blank cell.
                    if (field.type === 'date') return fieldVal(row, field, side) || '—';
                    return formatNumberWithCommas(toNum(row[field.key]));
                };
                const identity = (row) => ({
                    trade: row.trade, subTrade: row.subTrade, lane: row.lane,
                    saleWeek: row.saleWeek, vvd: row.vvd, pol: row.pol, vessel: row.vessel,
                });
                // 2026-09-09, per Kevin: color the NEW value green/red for an increase/decrease,
                // but only for "Current Laden" and "Vessel Utilz" -- not "Max Laden", "Peak
                // Utilz", or the text fields (Status/PIC/Vessel), which stay plain.
                const COLORABLE_FIELD_KEYS = new Set(['curLaden', 'curUtilRaw']);
                // computeIncreased (2026-09-15, hoisted above the per-row loop below along with
                // COLORABLE_FIELD_KEYS -- neither depends on the row, so both used to be
                // reallocated on every matched vessel leg for no reason): 'increased' is
                // computed for EVERY tracked field, including the two 'date' ones, even though
                // neither is in COLORABLE_FIELD_KEYS yet, so this is currently unused for them --
                // but fieldVal()'s date branch returns an "M/D/YY" STRING, and JS `>` on strings
                // is lexicographic, not chronological (e.g. "10/2/26" sorts before "9/28/26"
                // because '1' < '9'). A genuinely later cutoff/ETD would compute as a "decrease"
                // the moment a future change adds 'cutoff'/'etd' to COLORABLE_FIELD_KEYS (a
                // plausible next ask, per this PR's own "ongoing data-quality issue" framing) --
                // fixed at the source via the file's own compareEtd (used elsewhere for exactly
                // this "is date A after date B" question, e.g. the Departed-star chart logic)
                // rather than a second, separately-parsed integer encoding. If EITHER side fails
                // to parse (e.g. a populated<->blank transition), direction is genuinely unknown,
                // not "decreased" -- forcing `increased: false` there would color a blank-to-
                // populated date red the instant date coloring is ever turned on.
                const computeIncreased = (f, oldRow, newRow) => {
                    if (f.type !== 'date') return fieldVal(newRow, f, 'new') > fieldVal(oldRow, f, 'old');
                    const oldParsed = parseKnownDate(String(oldRow[f.key] ?? '').trim());
                    const newParsed = parseKnownDate(String(newRow[f.key] ?? '').trim());
                    return !!(oldParsed && newParsed && compareEtd(newRow[f.key], oldRow[f.key]) > 0);
                };

                const added = [];
                const removed = [];
                const changed = [];

                newByKey.forEach((newRow, key) => {
                    if (!oldByKey.has(key)) added.push(identity(newRow));
                });
                oldByKey.forEach((oldRow, key) => {
                    if (!newByKey.has(key)) {
                        removed.push(identity(oldRow));
                        return;
                    }
                    const newRow = newByKey.get(key);
                    const diffs = TRACKED_FIELDS
                        .filter(f => fieldVal(oldRow, f, 'old') !== fieldVal(newRow, f, 'new'))
                        .map(f => ({
                            label: f.label,
                            oldVal: formatFieldVal(oldRow, f, 'old'),
                            newVal: formatFieldVal(newRow, f, 'new'),
                            colorable: COLORABLE_FIELD_KEYS.has(f.key),
                            increased: computeIncreased(f, oldRow, newRow),
                        }));
                    if (diffs.length > 0) changed.push({ ...identity(newRow), diffs });
                });

                const overallSnapshot = (rows) => {
                    const byLane = {};
                    let ladenSum = 0;
                    rows.forEach(row => {
                        const lane = row.lane || '(blank)';
                        const v = toNum(row.maxLdn);
                        if (!(lane in byLane) || v > byLane[lane]) byLane[lane] = v;
                        ladenSum += toNum(row.ladenTeu);
                    });
                    const maxLdnSum = Object.values(byLane).reduce((s, v) => s + v, 0);

                    const byLaneWeek = {};
                    rows.forEach(row => {
                        const lane = row.lane || '(blank)';
                        const key = `${lane}|${row.saleWeek || '(blank)'}`;
                        if (!byLaneWeek[key]) byLaneWeek[key] = { lane, maxLdn: 0, laden: 0 };
                        byLaneWeek[key].maxLdn = Math.max(byLaneWeek[key].maxLdn, toNum(row.maxLdn));
                        byLaneWeek[key].laden += toNum(row.ladenTeu);
                    });
                    const weeklyByLane = {};
                    Object.values(byLaneWeek).forEach(bucket => {
                        if (!weeklyByLane[bucket.lane]) weeklyByLane[bucket.lane] = [];
                        weeklyByLane[bucket.lane].push(bucket);
                    });
                    let avgWklyCapacitySum = 0, avgWklyLadenSum = 0;
                    Object.values(weeklyByLane).forEach(weeks => {
                        const n = weeks.length;
                        avgWklyCapacitySum += weeks.reduce((s, w) => s + w.maxLdn, 0) / n;
                        avgWklyLadenSum += weeks.reduce((s, w) => s + w.laden, 0) / n;
                    });

                    return {
                        maxLdn: maxLdnSum,
                        laden: ladenSum,
                        utilz: avgWklyCapacitySum > 0 ? Math.round((avgWklyLadenSum / avgWklyCapacitySum) * 100) : 0,
                        // 2026-09-04 (math/logic audit): was rows.length -- these rows are
                        // per-POL-leg (same grain as POL Booking Flash), not per-vessel, so a
                        // tile labeled "Vessels" was counting POL legs instead. Confirmed
                        // against the real sample: 374 distinct VVDs but 964 rows (most
                        // vessels call more than one port -- 89% of real VVDs have 2+ legs),
                        // a ~2.6x overcount. Dedupe by VVD (the per-voyage identifier, same
                        // field keyOf above uses) to count actual distinct vessels instead.
                        bookingCount: new Set(rows.map(r => String(r.vvd || '').trim()).filter(Boolean)).size,
                    };
                };

                return {
                    added, removed, changed,
                    oldZeroedBySlicers, newZeroedBySlicers,
                    oldSnapshot: overallSnapshot(oldRows),
                    newSnapshot: overallSnapshot(newRows),
                };
            }, [rawRows, oldRawRows, selectedSubTrades, selectedAnalysts, selectedMktgAnalysts, selectedLanes, selectedCoasts, selectedSaleWeeks, selectedYards, selectedApStatuses]);

            const serviceLaneAnalysis = useMemo(() => {
                if (activeTab !== 'detail' && activeTab !== 'pol_booking' && activeTab !== 'sector_summary') return null;
                const groupKey = activeTab === 'pol_booking' ? 'pol' : 'lane';
                const groupLabel = activeTab === 'pol_booking' ? 'POL' : 'Lane';
                const chartEtdField = groupKey === 'pol' ? 'coastalEtd' : 'etd';
                const today = new Date();

                const weeksPresent = Array.from(new Set(
                    filteredRawRows.map(r => r.saleWeek).filter(w => w !== undefined && w !== null && String(w).trim() !== '')
                )).sort(compareSaleWeek);

                // 2026-09-21, per Kevin ("defaulting on the wrong last four weeks"): this used
                // to be weeksPresent.slice(-4) -- the last 4 Sale Weeks PRESENT IN THE DATA, not
                // the last 4 weeks relative to today. This dataset is a forward booking forecast
                // that reaches weeks/months out, so with no Sale Week filter applied that trailing
                // slice landed on the furthest-out forecast weeks (e.g. 2026/W46-W49), which are
                // "still mostly unbooked" by design (see DATA_ARCHITECTURE.md's 2026-09-09 Peak
                // Utilization writeup) -- rendering a near-0% "Performance Summary" instead of
                // actual recent activity. Restrict the default window to weeks that have at least
                // one row already departed (real ETD/Coastal ETD on or before today, same
                // field/fallback and isOnOrBeforeDay helper the trend chart's own "Departed" flag
                // below uses) before taking the trailing 4. Falls back to the old
                // weeksPresent.slice(-4) only when NO week in the current filter set has departed
                // yet (e.g. an all-future test fixture), so this can never produce an empty default.
                const departedWeekSet = new Set();
                filteredRawRows.forEach(r => {
                    if (isOnOrBeforeDay(r[chartEtdField] || r.etd, today)) departedWeekSet.add(r.saleWeek);
                });
                const departedWeeksPresent = weeksPresent.filter(w => departedWeekSet.has(w));
                const defaultWeeksSource = departedWeeksPresent.length > 0 ? departedWeeksPresent : weeksPresent;

                const manualWeeks = analysisSelectedWeeks.length > 0
                    ? weeksPresent.filter(w => analysisSelectedWeeks.includes(w))
                    : [];
                const usingDefault = !analysisShowAllWeeks && manualWeeks.length === 0;
                const activeWeeks = analysisShowAllWeeks
                    ? weeksPresent
                    : (usingDefault ? defaultWeeksSource.slice(-4) : manualWeeks);
                if (activeWeeks.length === 0) return null;
                const weekSet = new Set(activeWeeks);
                const analysisRows = filteredRawRows.filter(r => weekSet.has(r.saleWeek));
                if (analysisRows.length === 0) return null;

                // 2026-09-21, code-review finding: `parseFloat(...) || 0` doesn't exclude
                // Infinity (Infinity is truthy) -- the same gap fixed above in
                // getPeakUtilPercentNum's own push-filter for this function's sibling field
                // avgPeakUtilization, left unpatched on numVal's own maxLdn/laden aggregation.
                const numVal = (row, key) => {
                    const n = parseFloat(String(row[key] ?? '').replace(/[,%()]/g, ''));
                    return isFinite(n) ? n : 0;
                };

                const groupBy = (fieldKey) => {
                    const byKeyWeek = {};
                    const groupPeakUtils = {};

                    // 2026-09-09, per Kevin: "The Analyze button for the POL Booking Flash tab
                    // is also relative to the overall max laden. It should be relative to the
                    // POL Max Laden." Confirmed live: groupBy('pol')'s buckets were reading the
                    // vessel/Lane-wide maxLdn ("MCT Max Laden Update") -- identical across every
                    // POL leg of the same VVD -- instead of the genuinely POL-specific polMaxLdn
                    // ("POL Max Laden TEU"). On real data, 17 of 27 multi-POL lanes showed every
                    // POL card under that lane with a byte-identical Avg Max Laden, an impossible
                    // result for physically different ports -- e.g. Lane EC4's USHOU05/USMOB01
                    // both showed 2,359.64 pre-fix; correctly 1,738.21/621.43 post-fix. Peak
                    // Utilization has the identical bug shape (peakUtilRaw is vessel-wide
                    // "Measures Peak Overall Utilz"; peakPolUtilzRaw is the POL-specific "Measures
                    // Peak Pol Utilz") -- caught by checking every field this card renders, not
                    // just the one Kevin named. Branching on fieldKey (not activeTab) is
                    // deliberate: groupBy is also called a second time (see laneSummaries below)
                    // to build Overall Snapshot/the trend chart's own aggregate.
                    //
                    // 2026-09-09 -> 2026-09-10 update: that second call used to be hardcoded to
                    // groupBy('lane') regardless of tab, on the theory that Overall Snapshot was
                    // intentionally Lane-wide everywhere (see the retired "these per-POL capacity
                    // figures don't sum to the Overall Snapshot above" caption, removed 2026-09-10
                    // alongside this). Kevin: "I'm thinking they should all be POL level as well,
                    // for this tab specifically[, so] when you filter down to just one port of
                    // call, you are not still seeing averages relative to the overall" -- true as
                    // reported: filtering the Yard slicer to one POL narrowed the breakdown card
                    // but NOT Overall Snapshot, which kept summing every OTHER port on the same
                    // lane(s) via the vessel-wide maxLdn field, so Overall could look nothing like
                    // the one visible card. Fixed by calling groupBy(groupKey) for this second pass
                    // too (see laneSummaries below) -- POL-scoped on the POL tab, still Lane-scoped
                    // on Booking Flash/Detail, since groupKey already tracks that per activeTab.
                    // Verified this doesn't reintroduce the 2026-08-18 over-counting bug this same
                    // fieldKey branch exists to prevent: unlike the pre-fix POL cards (which read
                    // the vessel-wide maxLdn, identical across every POL leg of a VVD -- summing
                    // those really would multiply-count one vessel's capacity), polMaxLdn is each
                    // port's own allocated share. Checked against the real sample export across
                    // every multi-POL VVD (333 of them): summing polMaxLdn across a VVD's distinct
                    // POLs reconstructs its single vessel-wide maxLdn exactly (or within striking
                    // rounding distance) for ~95% of them -- e.g. the EC4/USHOU05+USMOB01 case
                    // above, 1,738.21 + 621.43 = 2,359.64, its exact vessel-wide value -- so summing
                    // POL-level numbers doesn't inflate the total, it just re-partitions the same
                    // total by port instead of by lane. The remaining ~5% (18 of 333 VVDs, all
                    // under an open AP appeal or AP-Frozen status at capture time) don't sum
                    // exactly, off by up to ~1,400 TEU on a few -- an accepted, unengineered-around
                    // edge case tied to that operational state, not a scope bug worth chasing here.
                    // Verified against POL Booking
                    // Flash's own displayed "Current Laden Utilz %" (polBkgUtilzRaw, an
                    // independent, already-computed field): the fixed ratio-of-averages here now
                    // lands within ~1 point of it on average, vs. ~23 points off pre-fix.
                    const maxLdnField = fieldKey === 'pol' ? 'polMaxLdn' : 'maxLdn';
                    const peakField = fieldKey === 'pol' ? 'peakPolUtilzRaw' : 'peakUtilRaw';

                    analysisRows.forEach(row => {
                        const g = row[fieldKey] || '(blank)';
                        const w = row.saleWeek;
                        const bucketKey = `${g}|${w}`;
                        if (!byKeyWeek[bucketKey]) byKeyWeek[bucketKey] = { key: g, maxLdn: 0, laden: 0 };
                        const bucket = byKeyWeek[bucketKey];
                        bucket.maxLdn = Math.max(bucket.maxLdn, numVal(row, maxLdnField));
                        bucket.laden += numVal(row, 'curLaden');

                        if (!groupPeakUtils[g]) groupPeakUtils[g] = [];
                        // 2026-09-04: now shares getPeakUtilPercentNum (see its definition) instead
                        // of duplicating this scale-correction logic inline -- same self-correcting
                        // behavior, no change here, just de-duplicated so the Detail tab and the
                        // utilization-gap alert could reuse the identical, already-proven heuristic.
                        const parsedPeakUtil = getPeakUtilPercentNum(row[peakField]);
                        // 2026-09-21, code-review finding: isNaN() alone doesn't exclude
                        // Infinity/-Infinity (isNaN(Infinity) is false), so a raw cell arriving
                        // as the literal string "Infinity%" (e.g. an upstream BI divide-by-zero
                        // export) would poison this group's average to Infinity -- previously
                        // masked as a plausible-looking 100% by the avgPeakUtilization clamp
                        // removed elsewhere in this function, now surfaced as literal
                        // "Infinity%" in the Analyze modal card and its Excel export.
                        // isFinite() rejects NaN and both Infinities in one check.
                        if (isFinite(parsedPeakUtil)) groupPeakUtils[g].push(parsedPeakUtil);
                    });
                    
                    const byKey = {};
                    Object.values(byKeyWeek).forEach(bucket => {
                        if (!byKey[bucket.key]) byKey[bucket.key] = [];
                        byKey[bucket.key].push(bucket);
                    });
                    
                    return Object.entries(byKey).map(([key, weeks]) => {
                        const n = weeks.length;
                        const avgWklyMaxLdn = weeks.reduce((s, w) => s + w.maxLdn, 0) / n;
                        const avgWklyLaden = weeks.reduce((s, w) => s + w.laden, 0) / n;
                        const avgWklyShortfall = avgWklyLaden - avgWklyMaxLdn;
                        const avgUtilization = avgWklyMaxLdn > 0 ? (avgWklyLaden / avgWklyMaxLdn) * 100 : 0;
                        
                        const pUtils = groupPeakUtils[key] || [];
                        // 2026-09-21, data-mapping audit: was clamped to a max of 100 here,
                        // silently flooring lanes whose real average Peak Utiliz % is over 100%
                        // (individual VVDs routinely peak at 150-270%, confirmed correct via
                        // DATA_ARCHITECTURE.md's peakUtilRaw history and the reference workbook's
                        // own ground truth -- e.g. FOWT0529S=211%, LCMT0034S=233%). The clamp had
                        // no comment/rationale anywhere in this file or the docs, predates the
                        // 2026-09-04/09-09 fixes that established 200%+ peaks as legitimate
                        // business data (not a bug), and was inconsistent with every other place
                        // this app renders Peak Utiliz % (row.peakUtil, the Compare tab, the POL
                        // tab), all of which are uncapped. On real data it wasn't a corner case:
                        // 3 of 28 lanes in the 8-12-2026 sample average over 100% (e.g. WIN at
                        // 211%), and all three were silently flattened to exactly 100%. Removed
                        // so this card matches every other Peak Utiliz % surface in the app.
                        const avgPeakUtilization = pUtils.length > 0 ? pUtils.reduce((s, v) => s + v, 0) / pUtils.length : 0;

                        return { group: key, weekCount: n, avgWklyMaxLdn, avgWklyLaden, avgWklyShortfall, avgUtilization, avgPeakUtilization };
                    }).sort((a, b) => collator.compare(String(a.group), String(b.group)));
                };

                // 2026-09-10, per Kevin: rows with no POL (e.g. a VMS placeholder row --
                // see the Compare tab's identical VMS-blank-key precedent above) were
                // showing up as their own all-zero "(blank)" card in the Breakdown by POL
                // list. Filtered out of the rendered/exported groups only -- laneSummaries
                // (and the Overall Snapshot KPIs computed from it) still includes it, same
                // as it always has (a blank-group row still contributes to the total, it
                // just doesn't get its own visible card) -- unaffected by the laneSummaries
                // change directly below, which changes WHICH dimension Overall aggregates
                // by, not whether blanks count.
                const rawGroupSummaries = groupBy(groupKey);
                const groupSummaries = rawGroupSummaries.filter(g => g.group !== '(blank)');
                // Overall Snapshot's own aggregate. Was `groupKey === 'lane' ? rawGroupSummaries
                // : groupBy('lane')` -- i.e. always Lane-based, even on the POL tab, requiring
                // a second groupBy('lane') call there since rawGroupSummaries was already
                // POL-based. See groupBy's own 2026-09-10 comment above (fieldKey section) for
                // why this is now just rawGroupSummaries unconditionally: on Booking Flash/
                // Detail, groupKey IS already 'lane', so this is byte-identical to before; on
                // POL Booking Flash, Overall now aggregates the same POL-scoped buckets the
                // breakdown cards already show, instead of a separately-computed Lane-wide
                // total that didn't shrink when the Yard/POL filter did.
                const laneSummaries = rawGroupSummaries;

                const overallCapacity = laneSummaries.reduce((s, g) => s + g.avgWklyMaxLdn, 0);
                const overallLaden = laneSummaries.reduce((s, g) => s + g.avgWklyLaden, 0);
                const overallShortfall = overallLaden - overallCapacity;
                const overallUtilization = overallCapacity > 0 ? (overallLaden / overallCapacity) * 100 : 0;

                // "Departed" (2026-09-02): a week's bar carries the star once every group/VVD
                // contributing to it has already sailed (row.etd on or before today). Within
                // a single group's own bucket for that week, this is still an OR across its
                // rows (any VVD in that group departing marks the GROUP departed for that
                // week, same as maxLdn/laden are folded in by max/sum below). But across
                // GROUPS -- when multiple are present in the analysis window -- 2026-09-04
                // (Kevin, Item 22): switched from OR to AND. Was: any ONE group departing that
                // week was enough to star it, so a week could show departed while other
                // groups hadn't sailed yet -- now every group present for that week must be
                // departed. Computed once per render rather than per row so every row in this
                // pass compares against the exact same moment.
                //
                // "group" here means Lane on Booking Flash/Detail, POL on POL Booking Flash --
                // was hardcoded to row.lane/maxLdn regardless of tab until 2026-09-10, when
                // Overall Snapshot's own aggregate (laneSummaries above) switched the same way
                // for the same reason (see groupBy's 2026-09-10 comment for the full writeup):
                // this trend chart sits directly under Overall Snapshot and was still drawing
                // Lane-wide bars even when Overall itself had just become POL-scoped, which
                // would have reintroduced the identical "filtered to one port, chart still
                // shows the whole lane" mismatch one section down. chartMaxLdnField mirrors
                // groupBy's own fieldKey branch exactly (polMaxLdn on the POL tab, else the
                // vessel-wide maxLdn) so this second, independent aggregation pass stays
                // consistent with the first.
                //
                // 2026-09-11: the departed check itself (row.etd below) had the same bug
                // chartMaxLdnField was fixed for above, one step behind -- it was still reading
                // row.etd ("Route Date Last Port ETD Date") unconditionally on BOTH tabs. That
                // field is the vessel's voyage-wide Last Port ETD and is identical across every
                // POL leg of the same VVD, so on the POL-scoped tab it doesn't tell you when
                // THIS POL's leg actually sailed. Confirmed via real data in
                // Booking_Flash_Data_MAIN_UPLOAD_8-12-2026.xlsx: VVD NOCT0082W, sale week
                // 2026/W32, has POL USHOU with Coastal ETD 2026-09-03 and POL USMOB with
                // Coastal ETD 2026-09-05, but both legs share the same Last Port ETD =
                // 2026-09-05 -- so on any "today" between 2026-09-03 and 2026-09-05, USHOU's
                // leg has already sailed but this check (reading the shared Last Port ETD)
                // wrongly reported it as not departed. 11 real VVDs in that file reproduce this
                // (also HFWT0171W, HI3T0017W, HOVT0060W, HRVT0060W, HSMT0091E, NCMT0031W,
                // NOBT0043E, RBTT0005W, SROT0045S, TSTT0053W, YPMT0196W). Fix: on the POL tab,
                // check row.coastalEtd ("Route Date Coastal ETD Date") instead -- the POL-
                // specific departure date for that leg -- mirroring chartMaxLdnField's own
                // groupKey branch immediately above. Falls back to row.etd when coastalEtd is
                // blank (17 of 8,769 rows in the historical CSV have coastalEtd blank with etd
                // populated) so a sparse row doesn't silently stop counting as departed.
                const chartMaxLdnField = groupKey === 'pol' ? 'polMaxLdn' : 'maxLdn';
                const weeklyTotalsMap = {};
                analysisRows.forEach(row => {
                    const w = row.saleWeek;
                    const group = row[groupKey] || '(blank)';
                    const bucketKey = `${group}|${w}`;
                    if (!weeklyTotalsMap[bucketKey]) {
                        weeklyTotalsMap[bucketKey] = { week: w, group, maxLdn: 0, laden: 0, departed: false };
                    }
                    weeklyTotalsMap[bucketKey].maxLdn = Math.max(weeklyTotalsMap[bucketKey].maxLdn, numVal(row, chartMaxLdnField));
                    weeklyTotalsMap[bucketKey].laden += numVal(row, 'curLaden');
                    if (isOnOrBeforeDay(row[chartEtdField] || row.etd, today)) weeklyTotalsMap[bucketKey].departed = true;
                });

                const weeklySeriesMap = {};
                Object.values(weeklyTotalsMap).forEach(bucket => {
                    const w = bucket.week;
                    if (!weeklySeriesMap[w]) {
                        weeklySeriesMap[w] = { week: w, maxLdn: 0, laden: 0, departed: true };
                    }
                    weeklySeriesMap[w].maxLdn += bucket.maxLdn;
                    weeklySeriesMap[w].laden += bucket.laden;
                    if (!bucket.departed) weeklySeriesMap[w].departed = false;
                });
                const weeklySeries = Object.values(weeklySeriesMap).sort((a, b) => compareSaleWeek(a.week, b.week));

                return {
                    groupLabel,
                    weekRange: activeWeeks.length > 1 ? `${activeWeeks[0]} to ${activeWeeks[activeWeeks.length - 1]}` : activeWeeks[0],
                    weekCount: activeWeeks.length,
                    groupCount: groupSummaries.length,
                    overall: { utilization: overallUtilization, capacity: overallCapacity, laden: overallLaden, shortfall: overallShortfall },
                    groups: groupSummaries,
                    weeksPresent,
                    activeWeeks,
                    usingDefault,
                    showingAll: analysisShowAllWeeks,
                    weeklySeries
                };
            }, [activeTab, filteredRawRows, analysisSelectedWeeks, analysisShowAllWeeks]);

            const laneAwareMaxLdn = (ctx, cKey) => {
                const matching = filteredRawRows.filter(r =>
                    (!ctx.trade || r.trade === ctx.trade) &&
                    (!ctx.subTrade || r.subTrade === ctx.subTrade) &&
                    (cKey === 'Total' || r.saleWeek === cKey)
                );
                // 2026-09-04 (math/logic audit): the cKey==='Total' branch used to pool
                // matching rows across EVERY sale week and take one MAX-per-lane over all of
                // them, week-blind -- the exact Class G temporal-scope-mismatch pattern
                // already found and fixed on the Compare tab's overallSnapshot() (see
                // DATA_ARCHITECTURE.md): a numerator summed over many weeks divided by a
                // denominator that's really just one week's peak capacity, producing
                // nonsense figures (verified: 396% on the real sample data, pooling all ~17
                // weeks). This branch is currently unreachable in the live UI (Trade Summary
                // sets showGrandTotalColumn: false, so no column ever requests cKey==='Total'
                // -- confirmed via grep, only caller of this function), but it's exactly the
                // kind of dormant landmine that reappears the moment someone re-enables that
                // column. Fixed to the same week-aware convention Compare already uses:
                // average each lane's per-week max across the weeks actually present, THEN
                // sum across lanes -- instead of one week-blind max per lane. Per-week
                // columns (cKey !== 'Total') are unaffected, already correctly single-week
                // scoped both in numerator and denominator.
                if (cKey === 'Total') {
                    const byLaneWeek = {};
                    matching.forEach(r => {
                        const lane = r.lane || '(blank)';
                        const week = r.saleWeek || '(blank)';
                        const key = `${lane}|${week}`;
                        const v = toNum(r.maxLdn);
                        if (!(key in byLaneWeek) || v > byLaneWeek[key]) byLaneWeek[key] = v;
                    });
                    const weeksByLane = {};
                    Object.entries(byLaneWeek).forEach(([key, v]) => {
                        const lane = key.slice(0, key.lastIndexOf('|'));
                        if (!weeksByLane[lane]) weeksByLane[lane] = [];
                        weeksByLane[lane].push(v);
                    });
                    return Object.values(weeksByLane).reduce((sum, weeks) => sum + (weeks.reduce((s, v) => s + v, 0) / weeks.length), 0);
                }
                const byLane = {};
                matching.forEach(r => {
                    const lane = r.lane || '(blank)';
                    const v = toNum(r.maxLdn);
                    if (!(lane in byLane) || v > byLane[lane]) byLane[lane] = v;
                });
                return Object.values(byLane).reduce((s, v) => s + v, 0);
            };

            const sectorDataMapped = useMemo(() => {
                // 2026-09-14, per Kevin's bug report: every slicer except Lane had
                // stopped narrowing this table (Coast, SPC Analyst, MKG PIC, Sales Week,
                // Yard). Root cause: sectorSourceRows comes from a completely separate
                // data source (SECTOR_DATA_CSV_URL, seeded by SECTOR_DATA_SEED above) that
                // only ever carries Trade/Sub Trade/Lane/POD Sector/allocation numbers --
                // no Coast, PIC, Sales Week, or Yard columns exist on it to check
                // directly, so those slicers had nothing to match against here even
                // though they correctly narrowed filteredRawRows (and so the "Average Max
                // Laden vs Booking" pivot right next to this one, via past4WeekRows) the
                // whole time. Only Sub Trade and Lane were ever checked directly against
                // this table's own rows -- everything else silently no-op'd.
                // Fix: derive which Sub Trade+Lane combinations remain valid under EVERY
                // active slicer by reading them off filteredRawRows instead (it already
                // combines all of them -- Sub Trade, Lane, Coast, SPC Analyst, MKG PIC,
                // Sales Week, Yard, AP Status, header filters), and gate this table by
                // that derived set instead of re-checking selectedSubTrades/selectedLanes
                // in isolation. Confirmed safe against real data before shipping: at zero
                // filters selected, every one of this table's Sub Trade+Lane combinations
                // already has at least one matching row in filteredRawRows, so this
                // introduces no "combo disappears even with nothing filtered" regression.
                const validSectorKeys = new Set(filteredRawRows.map(r => `${r.subTrade}|${r.lane}`));
                return sectorSourceRows
                    .filter(r => validSectorKeys.has(`${r['Vessel 1st Sub Trade']}|${r['Vessel 1st Lane']}`))
                    .map(r => {
                        const lane = r['Vessel 1st Lane'];
                        const podSec = r['POD Sec'];
                        return {
                            trade: r['Vessel 1st Trade'],
                            subTrade: r['Vessel 1st Sub Trade'],
                            lane,
                            podSec,
                            // 2026-09-04 (2nd pass): SECTOR_DATA_CSV_URL's published Sheet
                            // originally had "MCT Sector Allocation" as a column header TWICE --
                            // once right after POD Sec, once again as the row's last column --
                            // which SheetJS resolved by suffixing the second occurrence's key with
                            // "_1" (see git history for that first fix's full writeup). Kevin has
                            // since renamed the Sheet's last column to the distinct, unambiguous
                            // "Sector Allocation" (confirmed live: the header row no longer has any
                            // duplicate, and sheet_to_json() no longer produces a "_1" key at all,
                            // which would have silently broken the old "_1"-preferring fix -- it
                            // would have quietly fallen through to the stale "MCT Sector
                            // Allocation" column again). Now reads the new column name directly,
                            // with the old "_1" pattern kept as a fallback in case a future edit
                            // ever reintroduces an exact duplicate, and the original plain key as
                            // the last resort so this never goes fully blank.
                            sectorAlloc: r['Sector Allocation'] !== undefined ? r['Sector Allocation']
                                : (r['MCT Sector Allocation_1'] !== undefined ? r['MCT Sector Allocation_1'] : r['MCT Sector Allocation']),
                            avgBooking: r['Average Booking'],
                            openSpace: r['Sector Open Space'],
                            portExcluded: PORT_EXCLUDE_KEYS.has(`${lane}|${podSec}`)
                        };
                    });
            }, [sectorSourceRows, filteredRawRows]);

            const past4WeekRows = useMemo(() => {
                return filteredRawRows.filter(row =>
                    String(row.past4WeekFlag || '').trim().toUpperCase() === 'Y' &&
                    !SECTOR_SUMMARY_LANE_EXCLUDE.has(String(row.lane || '').trim().toUpperCase())
                );
            }, [filteredRawRows]);

            const SECTOR_LEFT_ORDER = {
                ROOT: ['TPT', 'TAT', 'LAT'],
                TPT: ['AW', 'PN', 'PS'],
                'TPT|AW': ['EC1', 'EC2', 'EC3', 'EC4', 'WIN'],
                'TPT|PN': ['FP2', 'PN1', 'PN3'],
                'TPT|PS': ['MS2', 'PS1', 'PS3', 'PS4', 'PS6', 'PS7', 'PS8', 'VSE'],
                TAT: ['TA'],
                'TAT|TA': ['AL5', 'AT1', 'AT3', 'AT4', 'EMA'],
                LAT: ['LN'],
                'LAT|LN': ['AN2', 'ANG', 'FLX', 'MAR'],
            };
            const SECTOR_RIGHT_ORDER = {
                ROOT: ['TPT', 'TAT'],
                TPT: ['AW', 'PN', 'PS'],
                'TPT|AW': ['EC3'],
                'TPT|AW|EC3': ['CNNGB', 'CNSHA', 'CNTAO', 'LKCMB', 'PAMIT', 'SGSIN', 'THLCH', 'VNCMP'],
                'TPT|PN': ['FP2'],
                'TPT|PN|FP2': ['SGSIN'],
                'TPT|PS': ['PS3'],
                'TPT|PS|PS3': ['CNSHA', 'CNSHK', 'INNSA', 'SGSIN'],
                TAT: ['TA'],
                'TAT|TA': ['AL5', 'AT1', 'AT3', 'AT4', 'EMA'],
                'TAT|TA|AL5': ['BEANR', 'DEHAM', 'FRLEH', 'GBSOU'],
                'TAT|TA|AT1': ['BEANR', 'DEBRV', 'FRLEH', 'GBSOU', 'NLRTM'],
                'TAT|TA|AT3': ['BEANR', 'DEBRV', 'GBSOU', 'NLRTM', 'USHOU'],
                'TAT|TA|AT4': ['ESALG', 'ESVLC', 'FRFOS', 'ITGOA', 'ITSPE'],
                'TAT|TA|EMA': ['GRPIR', 'ITSAL', 'TRALI', 'TRISK', 'TRIST'],
            };
            // Trade Summary's own row order -- rowFields is just [trade, subTrade] (no Lane
            // level), so this only needs two levels deep. Without a childOrder, the fallback is
            // a plain alphabetical sort of the Trade rows (LAT/TAT/TPT); the reference workbook's
            // real Trade_Summary sheet order is TPT/TAT/LAT (same business order as
            // SECTOR_LEFT_ORDER above). Sub Trade order within each Trade is already alphabetical
            // in the reference. Ported from booking_flash_report_na_Kevin_1.10_AUTO_REFRESH.html.
            const TRADE_SUMMARY_ORDER = {
                ROOT: ['TPT', 'TAT', 'LAT'],
                TPT: ['AW', 'PN', 'PS'],
                TAT: ['TA'],
                LAT: ['LN'],
            };

            // 2026-09-08, per Kevin: PAROD (Panama Rodman) is a one-off relay/transship leg
            // that was deliberately pulled into POL Booking Flash so MKG can see PAROD's own
            // loading number on that tab -- it's NOT a normal NA port call and must NOT be
            // added into a vessel's Overall/Detail-tab "Current Laden (TEU)" total. Confirmed
            // against the reference workbook: AL5's Booking_Flash sheet's own cached "Current
            // Laden (TEU)" already excludes the PAROD leg (matches its own NOTES tab: "AL5 ETD
            // Last port of NA ports not PAROD" / "PAROD POL load volume from Space
            // bottleneck"), while a naive sum-every-leg-per-VVD includes it and overstates the
            // vessel's total by exactly the PAROD leg's TEU -- reproduced live, including on
            // already-departed AL5 weeks where the number should otherwise be stable. Matched
            // by yard/POL code (not by Lane) so this stays correct if PAROD is ever added to a
            // lane other than AL5. POL Booking Flash itself is unaffected -- that tab renders
            // straight from filteredRawRows, never from tableData, so PAROD's own row keeps
            // showing there exactly as before.
            const isParodLeg = (row) => String(row.pol || '').trim().toUpperCase().startsWith('PAROD');

            const tableData = useMemo(() => {
                const aggregatedMap = {};
                filteredRawRows.forEach(row => {
                    const key = `${row.trade}-${row.subTrade}-${row.lane}-${row.saleWeek}-${row.vvd}-${row.vessel}`;
                    if (!row.vvd && !row.vessel) {
                        aggregatedMap[`uid-${row.id}`] = row;
                        return;
                    }

                    if (!aggregatedMap[key]) {
                        aggregatedMap[key] = { ...row };
                        // 'broken' (Broken Routes) -- like every other TEU-quantity field here, a
                        // VVD's multiple raw POL-leg rows need to be SUMMED, not first-leg-wins.
                        // 'shortfall' also belongs here (see the duplicate-key branch's own
                        // comment below for why it was missing there specifically).
                        const numerics = ['quote', 'shortfall', 'broken', 'rfrBkgPlugs', 'rfrBkgTtl', 'inlandAct', 'inlandNoAct', 'inlandTotal', 'portAct', 'portNoAct', 'portTotal', 'dgTeu', 'tpt', 'tat', 'lwt', 'lnt', 'imt', 'let', 'ladenTeu', 'activeTotalTeu'];
                        numerics.forEach(n => aggregatedMap[key][n] = toNum(aggregatedMap[key][n]));
                        // 'curLaden' (Current Laden (TEU)) is summed across a VVD's POL legs same
                        // as the fields above, EXCEPT a PAROD leg -- see isParodLeg's own comment.
                        aggregatedMap[key].curLaden = isParodLeg(row) ? 0 : toNum(row.curLaden);

                        // 'peakUtilRaw'/'rfrBsaTeuRfMax' are both "Max of ..." per their DAX (see
                        // rfrUtilizRaw's own post-aggregation recompute below) -- omitting them
                        // here left them first-leg-wins.
                        // 'rfrMaxLdn' deliberately does NOT belong in this list (2026-09-04, 3rd
                        // pass on this field today) -- see its own post-aggregation override
                        // below, right next to rfrUtilizRaw's, for why.
                        // 'peakUtilRaw' deliberately does NOT belong in THIS list either
                        // (2026-09-09) -- see its own dedicated handling right below for why
                        // plain toNum() silently corrupts it.
                        const maxes = ['maxLdn', 'bsaTeu', 'bsaWgt', 'rfrBsaPlugs', 'rfrBsaTeuRfMax'];
                        maxes.forEach(n => aggregatedMap[key][n] = toNum(aggregatedMap[key][n]));

                        // 'peakUtilRaw' ("Peak Utiliz %", 2026-09-09 fix): still "Max of ..." like
                        // the fields above, but toNum() (used everywhere else in this list) strips
                        // the raw value's "%" suffix, e.g. "3%" -> 3 -- and the ONLY thing telling
                        // getPeakUtilPercentNum() downstream (see its own comment) that a value is
                        // already percent-scale, rather than a raw fraction needing *100, is that
                        // very "%" suffix. Losing it here silently fed a bare small number back
                        // into getPeakUtilPercentNum(), which then misread it as a fraction and
                        // multiplied by 100 -- inflating a real 3% into a displayed 300%, but only
                        // for the (0%, 5%] range where that heuristic kicks in, which is exactly why
                        // this only ever hit low-utilization vessels/weeks, not every row. Confirmed
                        // live: FOWT0531S (lane AN2, 2026/W46) legs read "3%"/"3%" on Measures Peak
                        // Overall Utilz -- correct aggregated value is 3%, was rendering 300%; the
                        // same far-future week showed this on several unrelated lanes too, because
                        // "peak utilization still under 5%" is just common that far out on the
                        // booking horizon, not tied to any one lane. Fix: compare using the same
                        // percent-aware parse the display layer uses, and keep the result as a
                        // percent STRING (not a bare number) so the post-aggregation
                        // getPeakUtilPercentNum(row.peakUtilRaw) call below still sees a "%" and
                        // takes its "already percent-scale" branch instead of re-guessing.
                        aggregatedMap[key].peakUtilRaw = `${getPeakUtilPercentNum(row.peakUtilRaw) || 0}%`;

                        // curUtilRaw (Current Laden Utiliz %, Booking Flash's own "Booking Utilz"
                        // measure) is SUMMED across a VVD's POL legs, not maxed -- 2026-09-03 (2nd
                        // pass) correction. Was Math.max(...) here, which understated every
                        // multi-leg VVD to its single highest-utilized leg instead of the true
                        // combined figure; confirmed against VVD SROT0044S (lane AN2, week
                        // 2026/W30): legs read 56% and 21%, correct total is 77%, MAX would have
                        // shown only 56%.
                        aggregatedMap[key].curUtilRaw = getPercentNum(row.curUtilRaw);
                    } else {
                        // 'shortfall' and 'broken': present in the init-branch numerics list above
                        // but were missing from this accumulate branch, so a later leg's raw value
