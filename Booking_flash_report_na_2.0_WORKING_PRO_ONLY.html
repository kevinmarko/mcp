                   Flash -- not for a data reason (Sector Remarks / SGSIN Sector Remarks are
                   voyage-level: identical on every leg of all 333 multi-leg voyages in the real
                   sample export, and matching the reference workbook's own cached Booking_Flash
                   value 26/26, exactly like the Rotation and Voyage Remarks columns that did
                   ship) but for a DEFAULT-visibility one. `sectorAlloc` is one of only five keys
                   in FIELD_HIDDEN_DEFAULTS that default to VISIBLE, and one shared
                   `sectorAllocHidden` drives both tabs, so adding 'pol_booking' here puts two
                   columns on every existing POL user's screen -- and in their Excel export --
                   the next time they load, with no action from them. Measured at the time, not
                   reasoned: a freshly loaded POL tab went from 23 to 25 header/body columns.

                   Three ways to ship it were put to Kevin:
                     (a) flip FIELD_HIDDEN_DEFAULTS.sectorAlloc to true -- but that removes the
                         column from the DETAIL tab's default view and export for everyone;
                     (b) a separate POL-only hidden state + localStorage key -- diverges the two
                         tabs and needs the picker's one-checkbox-per-key to become tab-aware;
                     (c) accept it as visible-by-default on POL.
                   Kevin chose (c). So the two columns ARE on by default here, deliberately. That
                   is the whole of the decision -- there is nothing left to fix, and flipping
                   FIELD_HIDDEN_DEFAULTS.sectorAlloc to true to "tidy it up" would silently undo
                   it on both tabs at once. The harm stays bounded because both columns append at
                   the far RIGHT of the POL table (see PolTableRow), so no pre-existing column
                   changes position on screen or in the export. */
                { key: 'sectorAlloc', label: 'Sector Allocation', group: 'Commercial', hidden: sectorAllocHidden, set: setSectorAllocHidden, tabs: ['detail', 'pol_booking'], filters: ['sectorRemarks', 'sgsinDryVsRfr'] },
                { key: 'reefer', label: 'Reefer', group: 'Cargo', hidden: reeferHidden, set: setReeferHidden, tabs: ['detail', 'pol_booking'], filters: ['rfrBkgPlugs', 'rfrBkgTtl', 'rfrBsaPlugs', 'rfrMaxLdn', 'rfrUtiliz', 'rfrBkgPol', 'rfrUtilizPolRaw'] },
                { key: 'dgVolume', label: 'DG Volume', group: 'Cargo', hidden: dgVolumeHidden, set: setDgVolumeHidden, tabs: ['detail', 'pol_booking'], filters: ['dgTeu'] },
                { key: 'activity', label: 'Activity', group: 'Operational', hidden: activityHidden, set: setActivityHidden, tabs: ['detail', 'pol_booking'], filters: ['actVsBkgUtilz', 'actVsMaxLdn', 'inlandAct', 'inlandNoAct', 'inlandTotal', 'portAct', 'portNoAct', 'portTotal'] },
                { key: 'opIssues', label: 'Operational Issues', group: 'Operational', hidden: opIssuesHidden, set: setOpIssuesHidden, tabs: ['detail', 'pol_booking'], filters: ['opIssues'] },
                { key: 'rotation', label: 'Rotation', group: 'Operational', hidden: rotationHidden, set: setRotationHidden, tabs: ['detail', 'pol_booking'], filters: ['actualRot', 'proformaRot'] },
                /* eta is POL-ONLY for the same grain reason as polStatus/vco above (read that
                   comment first), and more starkly: measured over the same 333 multi-leg
                   voyages, all three source columns are per-POL-leg -- 333/333 for Route Date
                   Last Coastal ETA Time and Route Date Proforma ETA Time, 286/333 for Route
                   Date Coastal ETA vs Proforma. Not one multi-leg voyage has a single ETA.

                   The column NAME misleads: "Last Coastal ETA" is the latest estimate of THAT
                   leg's coastal ETA, not the ETA at the voyage's final port. HSMT0090E/AT1
                   reads 7/18, 7/21, 7/24, 7/27 at USNYC01, USORF03, USCHS01, USSAV01.

                   There is also nothing voyage-grain to render instead: the export carries no
                   voyage-level ETA column at all. Its nearest neighbour, Route Date Last Port
                   ETD Date, is an ETD (0/333, genuinely voyage-level) and Detail already
                   renders it as "ETD Last Port". Aggregating the per-leg values is not a safe
                   substitute either -- coastalEtaVsProforma is a pre-built duration STRING
                   ("+7 days 16 hrs"), not a number, and this file has shipped wrong figures
                   more than once from a guessed SUM/MAX on a voyage-level rollup (rfrMaxLdn,
                   peakUtilRaw, curUtilRaw -- see DATA_ARCHITECTURE.md). Putting an ETA on
                   Detail needs Kevin to define the intended voyage-level value first. */
                { key: 'eta', label: 'ETA', group: 'Operational', hidden: etaHidden, set: setEtaHidden, tabs: ['pol_booking'], filters: ['lastCoastalEta', 'proformaEta', 'coastalEtaVsProforma'] },
                { key: 'remarks', label: 'Voyage Remarks', group: 'Operational', hidden: remarksHidden, set: setRemarksHidden, tabs: ['detail', 'pol_booking'], filters: ['remarks'] },
            ];

            const FIELD_TOGGLE_GROUPS = ['Identity', 'Commercial', 'Cargo', 'Operational'];

            /* The macro-button grid's contents for the current tab, derived from the same
               FIELD_TOGGLES descriptors the Fields picker uses so the two UIs cannot disagree
               about which fields a tab has -- see MACRO_GRID_ORDER / MACRO_GRID_EXCLUDED_KEYS
               at module scope for the ordering rule and the pic/status exclusion.

               Declared BELOW FIELD_TOGGLES on purpose. Babel Standalone's loose transform
               raises no TDZ error, so a `const` placed above the thing it reads resolves to
               undefined and fails silently rather than throwing -- the same trap the field
               picker's Escape handler comment above describes. Keep this below FIELD_TOGGLES if
               either is ever moved. */
            const macroGridToggles = (() => {
                const onTab = FIELD_TOGGLES.filter(
                    f => f.tabs.includes(activeTab) && !MACRO_GRID_EXCLUDED_KEYS.includes(f.key)
                );
                const order = MACRO_GRID_ORDER[activeTab] || [];
                const rank = (key) => {
                    const i = order.indexOf(key);
                    // Unplaced keys sort after every placed one, keeping their FIELD_TOGGLES
                    // order among themselves (stable sort), rather than disappearing.
                    return i === -1 ? order.length : i;
                };
                return onTab
                    .map((f, i) => ({ f, i }))
                    .sort((a, b) => (rank(a.f.key) - rank(b.f.key)) || (a.i - b.i))
                    .map(({ f }) => f);
            })();

            /* Count only fields the CURRENT tab renders -- a badge reading "6 hidden" on the
               Detail tab when four of those six are POL-only would be worse than none. */
            const fieldsHiddenOnThisTab = FIELD_TOGGLES.filter(
                f => f.tabs.includes(activeTab) && f.hidden
            ).length;

            const hiddenFilterKeys = FIELD_TOGGLES.filter(f => f.hidden).flatMap(f => f.filters);
            const hiddenFilterKeysSignature = hiddenFilterKeys.join(',');

            /* Reset reads FIELD_HIDDEN_DEFAULTS rather than repeating the literals, so a
               changed default cannot drift from what Reset restores. Scoped to field
               visibility only: unlike the testing build's resetViewPrefs, this deliberately
               does NOT touch slicers, zoom or tab -- snapping those back from a control
               labelled "fields" would be a surprise. */
            const resetFieldVisibility = () => {
                FIELD_TOGGLES.forEach(f => f.set(FIELD_HIDDEN_DEFAULTS[f.key]));
            };

            /* Field picker open/close.

               Click-to-open/click-to-close only (fieldPickerPinned) -- the trigger briefly lived
               inside the Settings popover (2026-09-17 to 2026-09-21), where hover-to-open never
               made sense (popping a second overlay on hover over a row inside an already-open
               popover), and stayed click-to-open after moving back out next to Coast in the
               tab-bar row (2026-09-21, per Kevin: "put the fields button next to the coast
               button") -- consistent, predictable behavior mattered more than restoring the
               pre-2026-09-17 hover-reveal mode. A prior hover-reveal mode (fieldPickerHover) was
               removed here for the same reason; its state and both setters used to be beside
               fieldPickerPinned's throughout this block, harmless but dead once nothing ever set
               it true again.

               Fixed rather than absolute follows this file's hoverTooltip precedent: an
               absolutely positioned child is clipped by any overflow-auto ancestor regardless
               of z-index. z-40 matches the floating Clear Highlights pill -- above the sticky
               header, below modals. */
            const [fieldPickerPinned, setFieldPickerPinned] = useState(false);
            const [fieldPickerRect, setFieldPickerRect] = useState(null);
            const fieldPickerBtnRef = useRef(null);
            const fieldPickerPanelRef = useRef(null);
            const fieldPickerOpen = fieldPickerPinned && !!fieldPickerRect;

            const anchorFieldPicker = () => {
                const r = fieldPickerBtnRef.current && fieldPickerBtnRef.current.getBoundingClientRect();
                if (r) setFieldPickerRect({ left: r.left, top: r.top, bottom: r.bottom });
            };

            /* Escape closes. Declared AFTER fieldPickerPinned's own useState, not before it --
               this file already lost an Escape handler exactly once to that ordering
               (Historical Data popover) and Babel Standalone raises no error for it, so it
               just quietly stops working. Verify Escape by hand; a syntax check cannot. */
            useEffect(() => {
                if (!fieldPickerPinned) return;
                const onKey = (e) => {
                    if (e.key === 'Escape') { setFieldPickerPinned(false); }
                };
                document.addEventListener('keydown', onKey);
                return () => document.removeEventListener('keydown', onKey);
            }, [fieldPickerPinned]);

            useEffect(() => {
                if (!fieldPickerPinned) return;
                const onDown = (e) => {
                    const inPanel = fieldPickerPanelRef.current && fieldPickerPanelRef.current.contains(e.target);
                    const inBtn = fieldPickerBtnRef.current && fieldPickerBtnRef.current.contains(e.target);
                    if (!inPanel && !inBtn) { setFieldPickerPinned(false); }
                };
                document.addEventListener('mousedown', onDown);
                return () => document.removeEventListener('mousedown', onDown);
            }, [fieldPickerPinned]);
            const [parseError, setParseError] = useState(null);
            const [newDataAvailable, setNewDataAvailable] = useState(false);
            // New-app-version banner (2026-09-10, per Kevin: "is there an alert we can
            // send out when the app has been updated ... for people to refresh their
            // page or force a refresh?"). This app has no build step and no service
            // worker, so there's no framework-level "new version" signal to hook into --
            // the only way to know the deployed HTML itself changed underneath an
            // already-open tab is to periodically re-check for a change and compare it
            // against what was last observed (see the poll effect below, right alongside
            // the CSV/sector polls). Deliberately NOT a hand-maintained version number/
            // build id: no discipline required on every future edit ("don't forget to
            // bump the version const" is exactly the class of thing that's already gone
            // stale once in this repo -- see AGENTS.md's file-pointer note), and it
            // catches literally any shipped change, not just ones someone remembered to
            // tag. The check itself is computed fresh (a content hash, either server- or
            // client-side depending on deploy path -- see checkForAppUpdate's own
            // comment below) rather than diffing full raw HTML, for two independent
            // reasons: (1) 2026-09-10 bug report from Kevin -- on the Google Apps
            // Script Web App deploy path (apps-script/), this page runs inside Apps
            // Script's sandboxed iframe, whose own window.location is a transient
            // *.googleusercontent.com URL that is NEITHER the real page the user opened
            // NOR guaranteed byte-stable across requests, so a raw full-HTML diff
            // against it fired a false "new version" on almost every single poll (this
            // was symptom 2 of that report -- see checkForAppUpdate/forceAppReload's
            // comments for the full root-cause chain and symptom 1, the accompanying
            // blank-page-on-refresh bug); (2) even outside that specific sandbox, an
            // unknown host could inject its own per-request noise into the response
            // (an analytics snippet, a proxy timestamp) that would cause the same false
            // positive. appHtmlBaselineRef below stores a short fingerprint (a server-
            // computed hex hash on the Apps Script path, or a cheap client-computed hash
            // of just the app's own payload elsewhere), not the ~500KB page text.
            const [appUpdateAvailable, setAppUpdateAvailable] = useState(false);
            const appHtmlBaselineRef = useRef(null);
            const [autoFetchError, setAutoFetchError] = useState(null);
            const [isCheckingForUpdates, setIsCheckingForUpdates] = useState(false);
            // Schedule-change warning (2026-09-08, see diffScheduleChange/
            // SCHEDULE_CHANGE_THRESHOLDS above) -- holds the diff summary whenever the
            // most recent applyCsvText swap looked drastic enough to be the live Sheet
            // changing underneath the app, rather than a normal small refresh. null
            // means "no warning to show" (either nothing significant happened, or the
            // most recent swap was the very first load with nothing to diff against).
            const [scheduleChangeWarning, setScheduleChangeWarning] = useState(null);

            // "Full Details" popup for the schedule-change warning banner (2026-09-09, per
            // Kevin: the banner's own summaryLines are deliberately just counts + a truncated
            // VVD/lane list -- see diffScheduleChange's own comment -- so this is the itemized
            // "what it actually was, what it actually became" view for every VVD the diff
            // touched, on demand rather than always rendered inline. Same draggable/click-
            // through-backdrop/explicit-close-only popup pattern as Analyze/Historical
            // Data/Settings above (see makeDragHandler's own comment), for the identical reason
            // (so it can be moved aside while cross-checking against the live table underneath).
            // Deliberately does NOT carry its own `open && data` guard on `scheduleChangeWarning`
            // here -- rendered instead as `scheduleChangeDetailOpen && scheduleChangeWarning &&`
            // at the render site itself, so if the warning is dismissed (or superseded by a new,
            // non-significant refresh) while this is open, it disappears for free with no extra
            // effect needed.
            //
            // MUST live after scheduleChangeWarning's own useState just above -- same class of
            // bug as historicalDataOpen's Escape-handler note elsewhere in this file: placing
            // this block (or just the useMemo's dependency array) BEFORE scheduleChangeWarning's
            // declaration would read it while still in Babel Standalone's var-hoisted
            // pre-assignment state (undefined, not a TDZ crash -- see that other comment for why
            // no error gets thrown for this class of bug), so scheduleChangeFlipsByVvd would
            // silently compute [] forever regardless of the real data. Confirmed live: this
            // exact mistake was made and caught before shipping -- the "Flipped sailings"
            // section silently never rendered while "Removed sailings" (which doesn't go through
            // this useMemo) rendered fine, with zero console/page errors either way.
            const [scheduleChangeDetailOpen, setScheduleChangeDetailOpen] = useState(false);
            const [scheduleChangeDetailPos, setScheduleChangeDetailPos] = useState({ x: 0, y: 0 });
            const startScheduleChangeDetailDrag = makeDragHandler(scheduleChangeDetailPos, setScheduleChangeDetailPos);
            useEffect(() => {
                if (!scheduleChangeDetailOpen) setScheduleChangeDetailPos({ x: 0, y: 0 });
            }, [scheduleChangeDetailOpen]);
            // Cutoff/ETD + POL flips, regrouped from diffScheduleChange's own per-field arrays
            // into one row per VVD (mirrors the Compare tab's own "Notable Vessel Changes"
            // shape/style, which Kevin already knows) -- a VVD flipping BOTH its Cutoff AND its
            // POL in the same refresh reads as one row with two change lines, not two separate
            // rows. `concerning` marks the "bad news" direction (populated->blank, flipped TO
            // "NO N.A. CALL") so the detail view can visually distinguish it from the benign
            // opposite direction, same distinction SCHEDULE_CHANGE_THRESHOLDS already makes for
            // whether a flip counts toward the warning firing at all.
            const scheduleChangeFlipsByVvd = useMemo(() => {
                if (!scheduleChangeWarning) return [];
                const byVvd = new Map();
                const addChange = (vvd, lane, label, oldVal, newVal, concerning) => {
                    if (!byVvd.has(vvd)) byVvd.set(vvd, { vvd, lane, changes: [] });
                    byVvd.get(vvd).changes.push({ label, oldVal, newVal, concerning });
                };
                for (const f of scheduleChangeWarning.dateFlips) {
                    addChange(f.vvd, f.lane, f.field === 'cutoff' ? '1st POL Cutoff' : 'ETD Last Port',
                        f.oldValue || '—', f.newValue || '—', f.direction === 'populated_to_blank');
                }
                for (const f of scheduleChangeWarning.polFlips.toNoNaCall) {
                    addChange(f.vvd, f.lane, 'POL', f.oldValue || '—', f.newValue || '—', true);
                }
                for (const f of scheduleChangeWarning.polFlips.fromNoNaCall) {
                    addChange(f.vvd, f.lane, 'POL', f.oldValue || '—', f.newValue || '—', false);
                }
                return [...byVvd.values()].sort((a, b) =>
                    collator.compare(String(a.lane || ''), String(b.lane || '')) || collator.compare(a.vvd, b.vvd));
            }, [scheduleChangeWarning]);

            const pendingCsvTextRef = useRef(null);
            const lastLoadedCsvTextRef = useRef(null);
            const hasLoadedDataRef = useRef(false);

            // 2026-09-1x (W11 follow-up -- general request-sequencing guard, per
            // Kevin's approval of the architectural proposal deferred in the original
            // audit): the three narrow fixes above/below (hasLoadedDataRef in the
            // initial-mount effect, the viewingHistoricalDate staging branch in
            // handleManualRefresh, applyPendingUpdate's try/catch) each closed one
            // CONCRETE, reproduced interleaving, but they don't compose with each
            // other: a manual "Refresh Now" click (handleManualRefresh, with
            // viewingHistoricalDate NOT set) still calls applyCsvText() with no
            // ordering check at all, so its own slow, still-in-flight fetch can
            // resolve AFTER an independent background poll has already
            // staged-and-auto-applied a FRESHER result (via applyPendingUpdate),
            // silently overwriting that fresher data -- none of the three narrow
            // guards are aware of each other's in-flight state, so this interleaving
            // slips through all of them. This is the residual gap named when that
            // fix was originally deferred.
            //
            // The mechanism: csvApplySeqRef is a single monotonically-increasing
            // ticket counter shared by every function that can eventually commit
            // fetched CSV text into rawRows -- the initial-mount effect, the
            // background poll (checkForUpdates), handleManualRefresh, and
            // applyPendingUpdate (plus processFile's manual-upload commit, see its
            // own comment). Each claims a ticket via
            // `const mySeq = ++csvApplySeqRef.current;` at the moment it STARTS its
            // own attempt (before its own `await fetchCsvText()` -- or, for
            // applyPendingUpdate, which fetches nothing itself, inherited from
            // whichever earlier fetch staged the pending text, via
            // pendingCsvTextSeqRef below). Immediately before actually calling
            // applyCsvText() to commit, each site re-checks
            // `mySeq === csvApplySeqRef.current`: if some OTHER attempt has since
            // claimed a LATER ticket -- whether or not that later attempt has even
            // finished yet -- this one's result is stale by definition and it backs
            // off without committing, silently and harmlessly (not an error --
            // something newer is already in flight or has already landed). This is
            // "last INITIATED wins, as long as nothing even newer has started since,"
            // deliberately NOT "last RESOLVED wins" -- the exact bug being fixed is a
            // slow, EARLIER-started fetch resolving LATER and beating a faster,
            // LATER-started one that already committed.
            //
            // pendingCsvTextSeqRef remembers which ticket the currently-staged
            // "New data available" payload belongs to. This matters because staged
            // text can sit for minutes (the user has to notice the banner, or return
            // from Historical View before it can apply) -- if an EVEN NEWER ticket
            // commits directly in the meantime, the staged payload is stale relative
            // to what's already on screen, and applyPendingUpdate must recognize that
            // and quietly clear the stale banner instead of clobbering data that
            // already landed.
            //
            // What this deliberately does NOT replace (each answers a different
            // question the ticket counter cannot; kept exactly as before, verified
            // live -- see the W11 verification notes):

                    const FIELD_CANDIDATES = {};
                    Object.keys(FIELD_ALIASES).forEach(f => { FIELD_CANDIDATES[f] = resolveAliasCandidates(FIELD_ALIASES[f]); });

                    // Per-row lookup: walk the precomputed candidate list and take the first
                    // non-blank value -- exactly getVal()'s old fallthrough-on-blank behaviour
                    // (pass-1 candidates before pass-2 candidates, both in alias order), just
                    // against a list resolved once above instead of re-derived per row.
                    const getValFromRow = (row, fieldKey) => {
                        const candidates = FIELD_CANDIDATES[fieldKey];
                        for (let i = 0; i < candidates.length; i++) {
                            const v = row[candidates[i]];
                            if (v !== undefined && v !== '') return v;
                        }
                        return '';
                    };

                    const formattedData = rawData.map((row, index) => {
                        const getVal = (fieldKey) => getValFromRow(row, fieldKey);

                        const rowObj = {
                            id: index + 1,
                            trade: getVal('trade') || 'TPT',
                            subTrade: getVal('subTrade'),
                            lane: getVal('lane'),
                            saleWeek: getVal('saleWeek'),
                            pic: getVal('pic'),
                            coast: getVal('coast'),
                            cutoff: getVal('cutoff'),
                            etd: getVal('etd'),
                            status: normalizeApStatus(getVal('status')),
                            statusDisplay: getVal('statusDisplay'),
                            loadingStatus: normalizeApStatus(getVal('loadingStatus')),
                            // Same statusDisplay pattern as status/statusDisplay above: loadingStatus
                            // is normalized (upper-cased) for the AP Frozen/AP Only comparisons that
                            // drive POL Booking Flash's row coloring and AP Status slicer, so its
                            // Status column always rendered ALL CAPS ("AP ONLY") instead of the
                            // source's real title case ("AP Only"). loadingStatusDisplay keeps the
                            // original raw text for display -- ported from
                            // booking_flash_report_na_Kevin_1.10_AUTO_REFRESH.html.
                            loadingStatusDisplay: getVal('loadingStatusDisplay'),
                            vvd: getVal('vvd'),
                            vessel: getVal('vessel'),
                            maxLdn: getVal('maxLdn'),
                            standbyRaw: getVal('standbyRaw'),
                            curLaden: getVal('curLaden'),
                            ladenTeu: getVal('ladenTeu'),
                            peakUtilRaw: getVal('peakUtilRaw'),
                            // 2026-09-03 (2nd pass): reverted back to 'Measures Overall Booking Utilz'
                            // -- explicit correction. The earlier remap to 'Laden Utiliz%' (see git
                            // history) was based on comparing single raw-row values and concluding
                            // 'Measures Overall Booking Utilz' must be the wrong column because it
                            // "disagreed" with 'Laden Utiliz%' on most rows. That comparison missed
                            // the real bug: this field is a per-POL-leg figure that tableData's
                            // multi-leg aggregation was combining with Math.max(...) instead of
                            // summing (see the curUtilRaw aggregation below), silently understating
                            // every multi-leg VVD -- confirmed against VVD SROT0044S (lane AN2, week
                            // 2026/W30, legs USHOU01 + USMIA01): 'Measures Overall Booking Utilz'
                            // reads 0.56 and 0.21 on those two legs and the correct Current Laden
                            // Utiliz % is their SUM, 0.77 (77%), not either leg alone. 'Laden Utiliz%'
                            // is a different, unrelated finished column -- not this field's source.
                            curUtilRaw: getVal('curUtilRaw'),
                            shortfall: getVal('shortfall'),
                            quote: getVal('quote'),
                            broken: getVal('broken'),
                            bsaTeu: getVal('bsaTeu'),
                            bsaWgt: getVal('bsaWgt'),
                            rfrBsaPlugs: getVal('rfrBsaPlugs'),
                            rfrBkgPlugs: getVal('rfrBkgPlugs'),
                            // 2026-09-04 (explicit correction, reverting the 2026-09-03 remap
                            // below): Kevin confirmed "RFR Max Laden TEU" is the correct source
                            // for this DISPLAYED "RFR Max LDN"/"RFR Max Laden TEU" column --
                            // "Should b mapped to this field at the port level" -- i.e. it's
                            // SUPPOSED to vary per POL leg, not be a flat vessel-wide constant.
                            // The 2026-09-03 remap below mistook that per-leg variation (0/20/
                            // blank on real data, e.g. SROT0044S reads 20 at USHOU01 but 0 at
                            // USMIA01) for a data-quality problem and switched to "Measures BSA
                            // TEU RF" for its flat, always-58-per-vessel value -- but a flat
                            // vessel-wide reefer BSA capacity is a DIFFERENT metric from a
                            // per-port max laden allocation, not a fill-in for it; a port
                            // legitimately having 0 reefer allocation is valid business data,
                            // not a broken column. rfrBsaTeuRfMax (below) is untouched -- it
                            // feeds rfrUtilizRaw, a separate Detail-tab-only "RFR Utiliz %"
                            // aggregate metric (never rendered as "RFR Max Laden TEU" anywhere),
                            // so it's correctly still vessel-wide and out of scope for this fix.
                            rfrMaxLdn: getVal('rfrMaxLdn'),
                            rfrBkgTtl: getVal('rfrBkgTtl'),
                            // POL Booking Flash's own "RFR BKG TEU" column reads a POL-scoped
                            // source ("Measures POL Reefer TEU"), a genuinely different column
                            // from rfrBkgTtl above ("Measures Reefer TEU", the OVERALL total --
                            // used by Booking Flash/Detail's "RFR BKG TTL"). Same POL-vs-overall
                            // split already made for curLaden/ladenTeu and peakPolUtilzRaw/
                            // peakUtilRaw. Narrow blast radius (6/899 rows in the reference
                            // dataset, all PAROD-related transship legs) but a real divergence --
                            // ported from booking_flash_report_na_Kevin_1.10_AUTO_REFRESH.html.
                            rfrBkgPol: getVal('rfrBkgPol'),
                            rfrBsaTeuRfMax: getVal('rfrBsaTeuRfMax'),
                            rfrUtilizPolRaw: getVal('rfrUtilizPolRaw'),
                            actVsBkgUtilzRaw: getVal('actVsBkgUtilzRaw'),
                            actVsMaxLdnRaw: getVal('actVsMaxLdnRaw'),
                            inlandAct: getVal('inlandAct'),
                            inlandNoAct: getVal('inlandNoAct'),
                            inlandTotal: getVal('inlandTotal'),
                            portAct: getVal('portAct'),
                            portNoAct: getVal('portNoAct'),
                            portTotal: getVal('portTotal'),
                            activeTotalTeu: getVal('activeTotalTeu'),
                            past4WeekFlag: getVal('past4WeekFlag'),
                            opIssues: getVal('opIssues'),
                            secAlloc: getVal('secAlloc'),
                            sgsinDryVsRfr: getVal('sgsinDryVsRfr'),
                            proformaRot: getVal('proformaRot'),
                            actualRot: getVal('actualRot'),
                            apStatus: getVal('apStatus'),
                            tpt: getVal('tpt'),
                            tat: getVal('tat'),
                            lwt: getVal('lwt'),
                            lnt: getVal('lnt'),
                            imt: getVal('imt'),
                            let: getVal('let'),
                            dgTeu: getVal('dgTeu'),
                            remarks: getVal('remarks'),
                            vco: getVal('vco'),
                            lastCoastalEta: getVal('lastCoastalEta'),
                            proformaEta: getVal('proformaEta'),
                            coastalEtaVsProforma: getVal('coastalEtaVsProforma'),
                            // '1st Pol'/'POL' deliberately NOT kept as fallback aliases -- both
                            // fuzzy-match the real (but wrong, coarser) 'Route Location 1st Pol'
                            // column via getVal()'s substring-fallback pass (confirmed by
                            // tests/check_alias_landmines.py, ported from the same fix on
                            // booking_flash_report_na_Kevin_1.10_AUTO_REFRESH.html), which would
                            // silently reintroduce the old bug (POL column collapsing distinct
                            // terminals like USLAX01/06/08 into one bare "USLAX") on any row
                            // where 'Route Location 1st Yard' is blank -- the Class E landmine
                            // pattern. 'Route Location 1st Yard' alone matches this file's real
                            // header exactly, same as `yard` below.
                            pol: getVal('pol'),
                            yard: getVal('yard'),
                            plannedMty: getVal('plannedMty'),
                            actualMty: getVal('actualMty'),
                            polMaxLdn: getVal('polMaxLdn'),
                            polLdnThresh: getVal('polLdnThresh'),
                            discharge: getVal('discharge'),
                            peakPolUtilzRaw: getVal('peakPolUtilzRaw'),
                            polBkgUtilzRaw: getVal('polBkgUtilzRaw'),
                            maxLdnVsPolBkg: getVal('maxLdnVsPolBkg'),
                            loadableQuant: getVal('loadableQuant'),
                            loadableWgt: getVal('loadableWgt'),
                            coastalEtd: getVal('coastalEtd'),
                            portCut: getVal('portCut'),
                            sectorRemarks: getVal('sectorRemarks'),
                            tsAvgBooking: getVal('tsAvgBooking'),
                            tsAvgMaxLdn: getVal('tsAvgMaxLdn')
                        };

                        rowObj.pic = (rowObj.pic && String(rowObj.pic).trim()) || 'TBA';

                        const activeTotalTeuNum = toNum(rowObj.activeTotalTeu);
                        const ladenTeuNum = toNum(rowObj.ladenTeu);
                        rowObj.actVsBkgUtilzRaw = ladenTeuNum > 0 ? (activeTotalTeuNum / ladenTeuNum) : 0;

                        const rfrBsaTeuRfMax = toNum(rowObj.rfrBsaTeuRfMax);
                        rowObj.rfrUtilizRaw = rfrBsaTeuRfMax > 0 ? (toNum(rowObj.rfrBkgTtl) / rfrBsaTeuRfMax) : 0;

                        return rowObj;
                    });

                    return { ok: true, rows: formattedData };
                }
                return { ok: false, error: 'The file appears to be empty.' };
            };

            const processFile = (file) => {
                if (!file) return;

                if (!window.XLSX) {
                    console.error("XLSX library is not loaded.");
                    setParseError("Unable to read the file: the XLSX library failed to load. Please refresh the page and try again.");
                    return;
                }

                // 2026-09-08, per Kevin: a manually-uploaded .csv export had the exact same
                // "dates one day early" bug as the live CSV_SOURCE_URL fetch (applyCsvText's
                // own comment has the full root-cause writeup: SheetJS's CSV parser
                // auto-detects an ISO-shaped date cell and round-trips it through a
                // UTC-anchored Date object, shifting it back a day in any timezone behind
                // UTC). This function was reading EVERY upload -- .csv or .xlsx alike -- as
                // a binary string and never passing `raw: true`, so a .csv upload hit the
                // identical bug. A real .xlsx/.xls upload does NOT have this bug (its date
                // cells are already properly-typed Excel serials, not text SheetJS has to
                // guess at) -- and forcing raw:true on a real workbook would instead make
                // its genuinely date-typed cells come back as bare serial numbers instead of
                // formatted text, breaking every date column on an Excel upload. So only a
                // .csv file switches to the same text-read + raw:true shape applyCsvText
                // uses; .xlsx/.xls keeps the pre-existing binary-string read untouched.
                const isCsv = /\.csv$/i.test(file.name || '');
                const reader = new FileReader();
                reader.onload = (evt) => {
                    try {
                        const wb = isCsv
                            ? window.XLSX.read(evt.target.result, { type: 'string', raw: true })
                            : window.XLSX.read(evt.target.result, { type: 'binary' });
                        const result = parseWorkbookToRows(wb);
                        if (result.ok) {
                            setRawRows(result.rows);
                            setParseError(null);
                            setAutoFetchError(null);
                            setLastRefresh(new Date());
                            setNewDataAvailable(false);
                            pendingCsvTextRef.current = null;
                            hasLoadedDataRef.current = true;
                            // 2026-09-1x (W11 sequence-guard follow-up): a manual upload
                            // doesn't fetch a URL, so it never claims a csvApplySeqRef
                            // ticket the normal way -- bump the shared counter directly
                            // here instead, so any CSV-pipeline fetch already in flight
                            // (initial load, a poll, or a manual "Refresh Now") that
                            // hasn't committed yet will find its own ticket stale the
                            // moment it tries to, and correctly back off rather than
                            // overwriting this deliberate upload with older live-CSV
                            // data. See csvApplySeqRef's own big comment (near
                            // pendingCsvTextRef) for the full design.
                            csvApplySeqRef.current++;
                            // This IS the live dataset now -- keep liveRawRowsRef in sync (see
                            // its own comment) and drop out of historical-viewing mode if it
                            // was active, since a genuine new upload should always win over
                            // whatever historical date happened to be on screen.
                            liveRawRowsRef.current = result.rows;
                            setViewingHistoricalDate(null);
                        } else {
                            setParseError(result.error);
                        }
                        if (fileInputRef.current) fileInputRef.current.value = '';
                    } catch (error) {
                        console.error("Error parsing the file:", error);
                        setParseError(`Failed to parse the uploaded file: ${error && error.message ? error.message : 'unknown error'}. Please verify the file is a valid Excel export and try again.`);
                        if (fileInputRef.current) fileInputRef.current.value = '';
                    }
                };
                if (isCsv) reader.readAsText(file); else reader.readAsBinaryString(file);
            };

            const handleFileUpload = (e) => {
                processFile(e.target.files[0]);
            };

            const handleDrop = (e) => {
                e.preventDefault();
                setIsDragging(false);
                if (e.dataTransfer.files && e.dataTransfer.files.length > 0) {
                    processFile(e.dataTransfer.files[0]);
                    e.dataTransfer.clearData();
                }
            };

            const processOldFile = (file) => {
                if (!file) return;
                if (!window.XLSX) {
                    setOldParseError("Unable to read the file: the XLSX library failed to load. Please refresh the page and try again.");
                    return;
                }
                // Same .csv-vs-.xlsx branch as processFile above, same reason -- see its
                // own comment for the full root-cause writeup.
                const isCsv = /\.csv$/i.test(file.name || '');
                const reader = new FileReader();
                reader.onload = (evt) => {
                    try {
                        const wb = isCsv
                            ? window.XLSX.read(evt.target.result, { type: 'string', raw: true })
                            : window.XLSX.read(evt.target.result, { type: 'binary' });
                        const result = parseWorkbookToRows(wb);
                        if (result.ok) {
                            setOldRawRows(result.rows);
                            setOldFileName(file.name);
                            setOldParseError(null);
                        } else {
                            setOldParseError(result.error);
                        }
                        if (oldFileInputRef.current) oldFileInputRef.current.value = '';
                    } catch (error) {
                        console.error("Error parsing the old file:", error);
                        setOldParseError(`Failed to parse the file: ${error && error.message ? error.message : 'unknown error'}. Please verify it's a valid Booking Flash export.`);
                        if (oldFileInputRef.current) oldFileInputRef.current.value = '';
                    }
                };
                if (isCsv) reader.readAsText(file); else reader.readAsBinaryString(file);
            };

            const handleOldFileUpload = (e) => {
                processOldFile(e.target.files[0]);
            };

            const clearOldFile = () => {
                setOldRawRows([]);
                setOldFileName(null);
                setOldParseError(null);
            };

            // --- Historical Data (2026-09-01): view any past day's export as the live
            // report, or compare two past days, from HISTORICAL_DATA_CSV_URL's rolling
            // daily-snapshot archive -- see that constant's own comment for the source
            // shape and DATA_ARCHITECTURE.md for the parsed field mapping.

            // Record Date normalization: SheetJS's CSV reader auto-detects this column
            // as a date type (its raw text, e.g. "2026-08-24", looks like a date to it)
            // and reformats it via sheet_to_json's raw:false default short-date display
            // ("8/24/26"), NOT the original ISO string in the file -- confirmed live
            // against the real published link (ws['A2'] comes back {t:'n', v:46258,
            // w:"8/24/26"}). Grouping/sorting/displaying by that short-date string would
            // be wrong once single- and double-digit days mix (plain string sort puts
            // "8/9/26" after "8/10/26", not before it) -- so a parallel raw:true pass
            // recovers the underlying Excel date serial and this converts it back to a
            // stable, correctly-sortable 'YYYY-MM-DD' key via XLSX.SSF.parse_date_code
            // (the same SSF module SheetJS itself uses to build that "8/24/26" display
            // string, just applied with a format this app controls instead of SheetJS's
            // default). Falls back to the plain string value on anything that isn't a
            // date-typed cell, so a future export where this column somehow ISN'T
            // auto-detected as a date still groups/sorts correctly on its literal text.
            const normalizeRecordDate = (value) => {
                if (typeof value === 'number' && window.XLSX && window.XLSX.SSF && window.XLSX.SSF.parse_date_code) {
                    const d = window.XLSX.SSF.parse_date_code(value);
                    if (d && d.y) {
                        const pad = (n) => String(n).padStart(2, '0');
                        return `${d.y}-${pad(d.m)}-${pad(d.d)}`;
                    }
                }
                return String(value || '').trim();
            };

            // (b) SUPERSEDE PROPERLY (2026-09-16, adversarial-review fix -- unbounded
            // concurrent fetches/workers): called right before a FORCED fetchHistoricalData
            // call starts, since `force` is the only path that can begin a new attempt while
            // a previous one might still be running (the in-flight guard below already stops
            // a non-forced call from ever reaching this point while one is active). Aborting
            // the previous attempt's shared AbortController tears down BOTH halves of
            // whatever phase it's in -- an in-flight `fetch()` rejects with AbortError, and an
            // in-flight parseHistoricalArchiveInWorker() call is listening on that same signal
            // and terminates its worker -- instead of leaving it to run to completion (or up
            // to HISTORICAL_WORKER_PARSE_TIMEOUT_MS) in the background, holding its own
            // 15.9MB CSV clone and ~22k-row result the whole time. historicalApplySeqRef
            // remains the correctness backstop that stops a cancelled attempt's result from
            // ever being committed -- this function is purely about not wasting the work in
            // the first place, not about correctness (which the seq guard already handled).
            const cancelInFlightHistoricalFetch = () => {
                if (historicalFetchControllerRef.current) {
                    try { historicalFetchControllerRef.current.abort(); } catch {}
                }
            };

            // Fetch + group the archive on demand (see the popover-open effect below)
            // -- this is a manually-triggered feature (a user has to open the popover
            // and pick a date), not something needing CSV_SOURCE_URL's 10-minute poll,
            // so there's no interval here: it runs when the popover is opened, plus the
            // "Refresh Historical List" button in the popover for whenever Hoa has
            // appended a new day since the last fetch. (This used to say "once on
            // mount"; that mount fetch was removed 2026-09-15 -- see the NOTE below the
            // function for why, and HISTORICAL_REFETCH_WINDOW_MS for what it cost.)
            const fetchHistoricalData = async ({ force = false } = {}) => {
                if (!isHistoricalCsvSourceConfigured()) return;
                if (!force) {
                    // (a) IN-FLIGHT GUARD (2026-09-16, adversarial-review fix): the elapsed-
                    // time window below only rate-limits on how long ago the last fetch
                    // STARTED -- it says nothing about whether that fetch is still running.
                    // On a slow network the whole fetch+parse pipeline can legitimately take
                    // longer than HISTORICAL_REFETCH_WINDOW_MS's 15s (that window exists to
                    // collapse a BURST of opens, not to bound pipeline duration -- see its own
                    // comment), so a user who closes the popover and reopens it more than 15s
                    // later while the FIRST fetch is still in flight would, without this
                    // check, start a second full fetch+parse+worker pipeline stacked on top of
                    // the first -- each holding its own structured-clone of the 15.9MB CSV and
                    // ~22k-row result at once. Checked BEFORE the elapsed-time window: a
                    // genuinely in-flight fetch is refused regardless of how long ago it
                    // started.
                    if (historicalFetchInFlightRef.current) return;
                    // Reuse an archive fetched within the last HISTORICAL_REFETCH_WINDOW_MS
                    // rather than re-downloading and re-parsing all of it -- see that
                    // constant's own comment for the cost being avoided and why the window
                    // is 15 seconds.
                    if (historicalLastFetchStartedAtRef.current !== null
                        && (Date.now() - historicalLastFetchStartedAtRef.current) < HISTORICAL_REFETCH_WINDOW_MS) {
                        return;
                    }
                } else {
                    // `force` (the "Refresh Historical List" button) always bypasses both
                    // guards above by design -- but if it lands while a previous attempt is
                    // still running, that attempt must be actively torn down here, not just
                    // outraced and left to finish on its own. See cancelInFlightHistoricalFetch.
                    cancelInFlightHistoricalFetch();
                }
                historicalFetchInFlightRef.current = true;
                setHistoricalFetchInFlight(true); // (d) drives the Refresh button's disabled/loading state
                historicalLastFetchStartedAtRef.current = Date.now();
                // 2026-09-1x (W11 sequence-guard follow-up): three independent call
                // sites can trigger this with no ordering between them -- the
                // mount effect, every time historicalDataOpen flips true (rapidly
                // opening/closing the popover can fire overlapping fetches), and the
                // "Refresh Historical List" button. Uses its OWN independent counter
                // (historicalApplySeqRef), not csvApplySeqRef/sectorApplySeqRef -- this
                // commits to setHistoricalRowsByDate/setHistoricalDates/
                // historicalParsedCacheRef, state slots none of the other pipelines
                // touch. See csvApplySeqRef's own big comment (near pendingCsvTextRef)
                // for the shared design.
                const mySeq = ++historicalApplySeqRef.current;
                // One AbortController per attempt, created synchronously before any `await`
                // so a supersede or the fetch-phase timeout (both below) always have
                // something live to cancel. Stored in the ref immediately so
                // cancelInFlightHistoricalFetch (called by the NEXT attempt, if any) can find
                // it -- see that function's own comment, and parseHistoricalArchiveInWorker's,
                // for why one controller/signal covers both the fetch and the worker.
                const controller = new AbortController();
                historicalFetchControllerRef.current = controller;
                // (c) FETCH TIMEOUT: see HISTORICAL_FETCH_TIMEOUT_MS's own comment for why
                // 60s and why this must be cleared the moment the download itself finishes
                // (right after `res.text()` below) rather than left running through the parse
                // phase, where it could otherwise wrongly abort a slow-but-healthy worker.
                const fetchTimeoutTimer = setTimeout(() => {
                    console.warn(`Historical archive fetch exceeded ${HISTORICAL_FETCH_TIMEOUT_MS}ms, aborting.`);
                    controller.abort();
                }, HISTORICAL_FETCH_TIMEOUT_MS);
                try {
                    const res = await fetch(HISTORICAL_DATA_CSV_URL, { cache: 'no-store', signal: controller.signal });
                    if (!res.ok) throw new Error(`Fetch failed with status ${res.status}`);
                    // PEAK MEMORY (2026-09-16): `let`, not `const` -- this 15.9MB string gets
                    // explicitly dropped below (nulled out) as soon as this function no longer
                    // needs its own copy, whichever path (worker or inline) ends up using it
                    // last, so it can be GC'd instead of sitting alive in this async function's
                    // closure for the rest of the grouping work further down. See
                    // parseHistoricalArchiveInWorker's own PEAK MEMORY comment for the full
                    // picture and why this only trims, rather than eliminates, the ~2x peak.
                    let csvText = await res.text();
                    // The download itself is done (successfully) -- stop the fetch-phase
                    // timeout here so it can never fire later and abort a still-running,
                    // perfectly healthy worker parse. `controller` stays alive and can still be
                    // aborted by a LATER supersede (cancelInFlightHistoricalFetch) for the rest
                    // of this attempt's lifetime -- only this one timer is being retired.
                    clearTimeout(fetchTimeoutTimer);
                    // Yield to the browser for one paint BEFORE the synchronous parse below.
                    //
                    // Why this is here: XLSX.read + sheet_to_json over this archive is
                    // ~14,199ms of SYNCHRONOUS main-thread work (15.9MB / 22,366 rows, both
                    // sheet_to_json passes included -- measured 2026-09-15 by sampling
                    // main-thread responsiveness during a real archive load; an earlier
                    // "~8,935ms"/"~9s" figure quoted in this comment only ever timed ONE of
                    // the two passes and was corrected 2026-09-16 -- see
                    // HISTORICAL_REFETCH_WINDOW_MS's own comment for the same correction).
                    // Nothing can repaint while it runs. Until 2026-09-15 that block happened
                    // during page load; now that the archive loads on demand it happens when
                    // the user clicks "Historical Data", where an unannounced ~14s freeze
                    // reads as the app hanging (the popover's own close button stops
                    // responding, tabs can't be switched, and the browser can raise "page
                    // unresponsive").
                    //
                    // Without this yield, React has batched the popover-open state change but
                    // the browser may not have painted it yet, so the user can be left staring
                    // at a frozen pre-open frame with no "Loading..." text at all. A double
                    // rAF (paint scheduled -> paint committed) guarantees the loading message
                    // below is actually on screen before the thread locks up. setTimeout is
                    // the fallback for a backgrounded tab, where rAF never fires.
                    //
                    // BE CLEAR ABOUT WHAT THIS DOES AND DOESN'T FIX: the ~14s block is still
                    // there and the UI is still unresponsive for its duration (this is also
                    // why the Worker path below is tried first -- see
                    // parseHistoricalArchiveInWorker -- this yield only helps the INLINE
                    // fallback path actually taken). This only
                    // guarantees the user sees an explanation first. Actually REMOVING the
                    // freeze means getting the parse off the main thread (a Web Worker --
                    // SheetJS runs in one, loaded from the same pinned CDN URL) or chunking
                    // sheet_to_json by row range. Both are real changes that need their own
                    // verification -- chunking in particular alters how a CSV gets parsed and
                    // so would require AGENTS.md check 3 (date timezone safety) to be re-run.
                    await new Promise(resolve => {
                        let settled = false;
                        const done = () => { if (!settled) { settled = true; resolve(); } };
                        if (typeof requestAnimationFrame === 'function') {
                            requestAnimationFrame(() => requestAnimationFrame(done));
                        }
                        setTimeout(done, 60);
                    });
                    if (mySeq !== historicalApplySeqRef.current) return;
                    // 2026-09-08: `raw: true` HERE (at the XLSX.read level, not just the
                    // sheet_to_json calls below) -- see applyCsvText's own comment on the
                    // identical fix for the full writeup of why. Net effect on this
                    // function specifically: rawDateOnly's "Record Date" value is now
                    // always the untouched literal string (never auto-promoted to a date
                    // serial by SheetJS's CSV parser), so normalizeRecordDate's numeric
                    // branch above no longer ever fires -- its plain
                    // `String(value || '').trim()` fallback already returns a clean,
                    // correctly-sortable 'YYYY-MM-DD' for this column's actual shape,
                    // so no change was needed there, just left in place as a defensive
                    // fallback for a hypothetical future source that IS date-typed.
                    // Try the Worker first (see parseHistoricalArchiveInWorker for why, what
                    // crosses the boundary, and every way it can fall back). It resolves to
                    // null -- never throws -- whenever a worker can't be used, so the inline
                    // parse below stays the guaranteed path and this stays a pure speedup.
                    // Pass this attempt's own signal so a later supersede
                    // (cancelInFlightHistoricalFetch) can terminate the worker too, not just
                    // abort the fetch -- see parseHistoricalArchiveInWorker's own comment.
                    const offThread = await parseHistoricalArchiveInWorker(csvText, controller.signal);
                    if (mySeq !== historicalApplySeqRef.current) return;

                    let rawData, recordDatesRaw;
                    if (offThread) {
                        // The worker already has (and has dropped -- see its own PEAK MEMORY
                        // comment) its copy, and produced everything this path needs from it.
                        // This function's copy served no further purpose the moment
                        // parseHistoricalArchiveInWorker resolved; drop it now rather than
                        // letting it sit alive through the grouping loop below.
                        csvText = null;
                        rawData = offThread.rows;
                        recordDatesRaw = offThread.recordDatesRaw;
                    } else {
                        const wb = window.XLSX.read(csvText, { type: 'string', raw: true });
                        const ws = wb.Sheets[wb.SheetNames[0]];
                        rawData = window.XLSX.utils.sheet_to_json(ws, { raw: false, defval: '' });
                    // "Record Date" is the one column in this archive that ISN'T part of
                    // the normal 97-column Data_download schema -- it's how a single
                    // published Sheet holds many days' worth of rows at all. getVal()
                    // inside parseWorkbookToRows only ever pulls fields it's told to look
                    // for by name, so this extra column is simply never referenced once a
                    // date's rows are handed to it below -- confirmed safe, not a landmine
                    // risk the way an aliased column would be (see DATA_ARCHITECTURE.md's
                    // Class E). rawDateOnly is the raw:true parallel pass normalizeRecordDate
                    // above needs -- same row order as rawData, so they're zipped by index.
                        const rawDateOnly = window.XLSX.utils.sheet_to_json(ws, { raw: true, defval: '' });
                        recordDatesRaw = rawData.map((r, i) => (rawDateOnly[i] ? rawDateOnly[i]['Record Date'] : r['Record Date']));
                        // The inline path is done with the raw string too, same reasoning as
                        // the `offThread` branch above.
                        csvText = null;
                    }

                    // Grouping and date normalisation stay HERE, on the main thread, for both
                    // paths -- normalizeRecordDate is the app's own and is deliberately not
                    // duplicated inside the worker, so the two paths cannot diverge on how a
                    // "Record Date" becomes a 'YYYY-MM-DD' key. This loop is cheap: it only
                    // pushes existing row references into buckets.
                    const grouped = {};
                    rawData.forEach((row, i) => {
                        const rawValue = recordDatesRaw[i];
                        const d = normalizeRecordDate(rawValue);
                        if (!d) return;
                        if (!grouped[d]) grouped[d] = [];
                        grouped[d].push(row);
                    });
                    // Back off if a newer fetch has started since -- e.g. the popover
                    // was closed and reopened (or "Refresh Historical List" clicked
                    // again) before this one landed. Whichever fetch was started LAST
                    // should win, not whichever happens to resolve last by accident.
                    if (mySeq !== historicalApplySeqRef.current) return;
                    setHistoricalRowsByDate(grouped);
                    setHistoricalDates(Object.keys(grouped).sort().reverse()); // newest first
                    setHistoricalFetchError(null);
                    historicalParsedCacheRef.current = {}; // stale now -- a refresh may have changed a date's rows
                } catch (err) {
                    // Superseded (a newer, force-triggered attempt called
                    // cancelInFlightHistoricalFetch on this one, via the shared controller) --
                    // a newer attempt already owns historicalLastFetchStartedAtRef/the UI/the
                    // seq, so this stale attempt must not touch any of them. This covers BOTH
                    // an aborted fetch() (AbortError) and any other error a half-cancelled
                    // attempt might surface -- the seq check is the single source of truth for
                    // "am I still the current attempt," not the error's type.
                    if (mySeq !== historicalApplySeqRef.current) return;
                    if (err && err.name === 'AbortError') {
                        // Not superseded (checked above) -- the only OTHER thing that aborts
                        // this attempt's controller is (c)'s fetch-phase timeout. Surface a
                        // specific, actionable message instead of the generic browser
                        // "The user aborted a request." AbortError text.
                        console.warn(`Historical archive fetch timed out after ${HISTORICAL_FETCH_TIMEOUT_MS}ms.`);
                        historicalLastFetchStartedAtRef.current = null;
                        setHistoricalFetchError('Fetching the historical archive timed out -- check your connection and click "Refresh Historical List" to try again.');
                        return;
                    }
                    // Let the next popover open retry immediately rather than sitting
                    // behind HISTORICAL_REFETCH_WINDOW_MS with nothing loaded.
                    historicalLastFetchStartedAtRef.current = null;
                    console.error('Historical data fetch failed:', err);
                    setHistoricalFetchError(err.message);
                } finally {
                    // (a)/(d) cleanup: only touch the in-flight flag/UI state if THIS is
                    // still the current attempt -- if it was superseded, a newer attempt
                    // already set both to true for itself and owns turning them back off when
                    // IT settles. Without this guard, a superseded attempt's finally running
                    // (slightly) after the new one started would incorrectly flip
                    // historicalFetchInFlightRef back to false while the new attempt is still
                    // genuinely running, defeating the whole point of the in-flight guard.
                    if (mySeq === historicalApplySeqRef.current) {
                        historicalFetchInFlightRef.current = false;
                        setHistoricalFetchInFlight(false);
                    }
                    // Same reasoning for the controller ref: only clear it if it still points
                    // to THIS attempt's controller -- a superseded attempt's finally must not
                    // null out the new attempt's live controller (which cancelInFlightHistoricalFetch
                    // and a later supersede both depend on being able to find).
                    if (historicalFetchControllerRef.current === controller) {
                        historicalFetchControllerRef.current = null;
                    }
                    clearTimeout(fetchTimeoutTimer); // no-op if already cleared above; guards every remaining exit path (thrown non-fetch errors, early `return`s) against leaking the timer.
                }
            };

            // NOTE: there is deliberately NO mount effect calling fetchHistoricalData()
            // here. There used to be, and it made every single page load download and
            // fully parse the whole append-only archive -- ~16.2s of work against the
            // live URL as measured 2026-09-15 (1,957ms fetch + ~14,199ms synchronous
            // main-thread parse; an earlier "~10.9s"/"~8.9s" figure quoted here only ever
            // timed one of the parse's two sheet_to_json passes and was corrected
            // 2026-09-16 -- see HISTORICAL_REFETCH_WINDOW_MS's own comment for the same
            // correction and the full measurement) --
            // before the user had asked for anything, for a feature that, as the
            // function's own comment above says, is manually triggered (open the
            // popover, pick a date). Nothing outside the popover reads
            // historicalDates/historicalRowsByDate, and the
            // popover-open effect below already covers every path into it, including the
            // very first open. The popover's own empty state (further down, keyed on
            // `historicalDates.length === 0`) already covered this case; its wording was
            // widened on 2026-09-15 from a bare "Loading historical dates..." to also warn
            // that the page stops responding for several seconds, since after this change
            // that wait is triggered by a user's click rather than absorbed into page load
            // (see the yield-before-parse comment in fetchHistoricalData).

            // 2026-09-08, per Kevin: opened the Historical Data popover wanting to compare
            // "yesterday to today" and today wasn't offered as a date -- confirmed live
            // that today's row DOES exist in HISTORICAL_DATA_CSV_URL's archive (Hoa's daily
            // append had already run), so this wasn't a missing-data problem. Root cause:
            // fetchHistoricalData only ever ran once, on page mount -- if the page
            // had been open since before that day's append ran (or was just open a while),
            // the date list goes stale and nothing re-fetches it except the manual
            // "Refresh Historical List" button, easy to not think to click. (That mount
            // effect is gone as of 2026-09-15 -- see the NOTE above for why -- so this
            // effect is now the ONLY thing that populates the date list, first open
            // included, not just the thing that keeps it fresh.) Both "View a
            // Date" and "Compare Two Dates" already read from the exact same
            // `historicalDates` array (see their shared render block further down), so
            // this wasn't a Compare-specific gap either -- View a Date would have shown
            // the same stale list, it just wasn't the mode being tested that day. Re-fetch
            // every time the popover is opened (not just on mount) so the common case --
            // open the popover, want today -- works without an extra manual click, and
            // the button stays for a mid-session refresh while the popover is already
            // open. ("cheap (one CSV fetch)" is what this comment used to claim here; it
            // isn't -- that fetch is the whole 6.5MB+ archive plus a full parse of it, on
            // EVERY open. Hence HISTORICAL_REFETCH_WINDOW_MS, which keeps this effect's
            // freshness intent while collapsing a burst of opens into one fetch.)
            useEffect(() => {
                if (historicalDataOpen) fetchHistoricalData();
                // eslint-disable-next-line react-hooks/exhaustive-deps
            }, [historicalDataOpen]);

            // Parses one historical date's row slice through the SAME parseWorkbookToRows
            // every other loading path uses -- built from that date's raw rows via
            // SheetJS's json_to_sheet/book_new, the same round trip a real single-day
            // CSV upload would go through -- so every getVal() alias/computed field this
            // app already gets right (Broken Routes aggregation, RFR Utiliz % recompute,
            // POL column, etc.) applies identically here, never a second parallel
            // implementation that could quietly drift from the real one. Cached per date
            // in historicalParsedCacheRef so flipping back and forth between the same
            // date(s) doesn't reparse ~1,000 rows on every click.
            const getParsedHistoricalRows = (date) => {
                if (historicalParsedCacheRef.current[date]) return historicalParsedCacheRef.current[date];
                const rowsForDate = historicalRowsByDate[date];
                if (!rowsForDate || rowsForDate.length === 0) {
                    return { ok: false, error: `No historical rows found for ${date}.` };
                }
                const ws = window.XLSX.utils.json_to_sheet(rowsForDate);
                const wb = window.XLSX.utils.book_new();
                window.XLSX.utils.book_append_sheet(wb, ws, 'Sheet1');
                const result = parseWorkbookToRows(wb);
                if (result.ok) historicalParsedCacheRef.current[date] = result;
                return result;
            };

            // "View this date" -- swaps rawRows to one historical day's parsed snapshot
            // so all 4 visible tabs render exactly as if that day's export had been
            // uploaded. Deliberately does NOT touch liveRawRowsRef (see its own comment
            // above) -- only processFile/applyCsvText ever do, so it always holds the
            // true live/manual dataset no matter how many historical dates get viewed.
            const viewHistoricalDate = (date) => {
                const result = getParsedHistoricalRows(date);
                if (result.ok) {
                    setRawRows(result.rows);
                    setViewingHistoricalDate(date);
                    setHistoricalFetchError(null);
                } else {
                    setHistoricalFetchError(result.error);
                }
            };

            // "Back to Live" -- restores whatever the live/manual dataset actually was
            // before any historical date was viewed.
            const backToLiveData = () => {
                setRawRows(liveRawRowsRef.current);
                setViewingHistoricalDate(null);
            };

            // "Compare These Two Dates" -- feeds two historical snapshots into the
            // EXISTING Compare tab/oldRawRows mechanism (see compareData above) instead
            // of building a second, parallel diff view: Snapshot A becomes oldRawRows
            // (the "old" side of that existing diff), Snapshot B becomes rawRows (the
            // "current" side), then jumps straight to the Compare tab. oldFileName is
            // repurposed to say which historical date is standing in for the "old
            // file" -- the Compare tab's render (unchanged) already displays whatever's
            // in oldFileName, so no new UI is needed there. The manual "old file"
            // upload/Change File/Clear affordances keep working exactly as before
            // afterward -- this only seeds the two states once, it doesn't replace
            // their normal lifecycle.
            const compareHistoricalDates = (dateA, dateB) => {
                const resultA = getParsedHistoricalRows(dateA);
                if (!resultA.ok) { setHistoricalFetchError(resultA.error); return; }
                const resultB = getParsedHistoricalRows(dateB);
                if (!resultB.ok) { setHistoricalFetchError(resultB.error); return; }
                setOldRawRows(resultA.rows);
                setOldFileName(`Historical snapshot: ${dateA}`);
                setOldParseError(null);
                setRawRows(resultB.rows);
                setViewingHistoricalDate(dateB);
                setHistoricalFetchError(null);
                setActiveTab('compare');
                setHistoricalDataOpen(false);
            };

            const fetchCsvText = async () => {
                const res = await fetch(CSV_SOURCE_URL, { cache: 'no-store' });
                if (!res.ok) throw new Error(`Fetch failed with status ${res.status}`);
                const text = await res.text();
                // See lastChecked's own comment near its useState -- every successful fetch
                // counts as "checked," independent of whether applyCsvText below ends up
                // finding a real change worth applying.
                setLastChecked(new Date());
                return text;
            };

            const applyCsvText = (csvText) => {
                // 2026-09-08, per Kevin: "1st POL Cutoff"/"ETD Last Port" (and any other
                // ISO-shaped date column pulled from the live CSV) were rendering exactly
                // one day EARLIER than the real date, on every lane, every row -- reproduced
                // and root-caused: SheetJS's default CSV parser auto-detects an ISO-shaped
                // cell (e.g. "2026-08-16") as a date, converts it via an internal Date
                // object anchored to UTC midnight, then formats that Date's LOCAL calendar
                // day for its `w` (displayed text) property. In any timezone behind UTC --
                // every North American one included -- that local day is the PREVIOUS day,
                // so this app's `getVal()` receives an already-wrong "8/15/26" for a real
                // "2026-08-16" cell before formatDate/parseKnownDate (which are themselves
                // timezone-safe -- pure regex/arithmetic, no Date object) ever see it.
                // Confirmed empirically: reproduced the exact off-by-one under
                // America/New_York and America/Los_Angeles (0 under UTC, which is why this
                // was never caught testing in a UTC sandbox), and confirmed it's isolated to
                // ISO-shaped cells specifically -- plain numbers, comma-formatted numbers,
                // percentages, blanks, and the year-less "Mon D" date shape all came through
                // byte-for-byte identical either way.
                //   Fix: pass `raw: true` to XLSX.read ITSELF (not just sheet_to_json) --
                // this makes SheetJS's CSV parser keep every cell as its literal original
                // text, never auto-promoting an ISO-shaped one to a date type at all, so the
                // buggy Date-object round-trip simply never happens. This app's own
                // getVal()/formatDate()/parseKnownDate() already parse a raw ISO string
                // correctly (that's the FIRST branch parseKnownDate tries), so nothing else
                // needed to change -- this was purely a SheetJS-internal conversion this app
                // never asked for and had no way to see happening.
                const wb = window.XLSX.read(csvText, { type: 'string', raw: true });
                const result = parseWorkbookToRows(wb);
                if (result.ok) {
                    // Schedule-change warning (2026-09-08, see diffScheduleChange/
                    // SCHEDULE_CHANGE_THRESHOLDS above): diff the OLD live dataset
                    // against the NEW one about to replace it, BEFORE either
                    // liveRawRowsRef.current or rawRows gets overwritten below --
                    // liveRawRowsRef.current is always the true "current live dataset"
                    // regardless of what's currently on screen (rawRows may be showing
                    // a historical snapshot instead, if viewingHistoricalDate is set).
                    // Skipped entirely on the very first-ever load (nothing to compare
                    // against yet) -- guarded on liveRawRowsRef.current having anything
                    // in it at all.
                    if (liveRawRowsRef.current.length > 0) {
                        const scheduleDiff = diffScheduleChange(liveRawRowsRef.current, result.rows);
                        setScheduleChangeWarning(scheduleDiff.isSignificant ? scheduleDiff : null);
                    }
                    setRawRows(result.rows);
                    setParseError(null);
                    setAutoFetchError(null);
                    setLastRefresh(new Date());
                    setNewDataAvailable(false);
                    pendingCsvTextRef.current = null;
                    lastLoadedCsvTextRef.current = csvText;
                    hasLoadedDataRef.current = true;
                    // Same reasoning as processFile above: this IS the live dataset now,
                    // so re-sync liveRawRowsRef and exit historical-viewing mode if it
                    // was active.
                    liveRawRowsRef.current = result.rows;
                    setViewingHistoricalDate(null);
                }
                return result;
            };

            const fetchAndApplySectorData = async () => {
                if (!isSectorCsvSourceConfigured()) return;
                // 2026-09-1x (W11 sequence-guard follow-up): this function is called
                // from three independent, genuinely concurrent-capable sites -- the
                // initial-mount effect, its own POLL_INTERVAL_MS interval, and
                // handleManualRefresh's fire-and-forget call -- with no ordering
                // between them before this fix, the same shape as the CSV-pipeline
                // race those three fixes above addressed (flagged in the original W11
                // audit as suspected-but-not-yet-reproduced with a concrete
                // stale-overwrite, for lack of a cheap ordering-sensitive field to
                // observe). Uses its OWN independent counter (sectorApplySeqRef), not
                // csvApplySeqRef -- this commits to setSectorSourceRows, a completely
                // separate state slot from rawRows, so mixing the two counters would
                // incorrectly invalidate an in-flight CSV-pipeline ticket on an
                // unrelated sector fetch, and vice versa. See csvApplySeqRef's own big
                // comment (near pendingCsvTextRef) for the shared design.
                const mySeq = ++sectorApplySeqRef.current;
                try {
