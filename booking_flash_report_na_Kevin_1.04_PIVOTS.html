<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Booking Flash Report NA</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useMemo, useRef, useEffect } = React;

        const FilterIcon = ({ size, className }) => (
            <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>
                <polygon points="22 3 2 3 10 12.46 10 19 14 21 14 12.46 22 3"/>
            </svg>
        );

        const ListFilterIcon = ({ size, className }) => (
            <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>
                <path d="M3 6h18"/><path d="M7 12h10"/><path d="M10 18h4"/>
            </svg>
        );

        const SlicerBtn = ({ children, bgClass, isSelected, isFilterActive, onClick }) => {
            const isFaded = isFilterActive && !isSelected;
            return (
                <button
                    onClick={onClick}
                    className={`
                        ${bgClass}
                        ${isFaded ? 'opacity-40' : 'opacity-100'}
                        text-white px-2 py-0.5 text-xs font-semibold m-0.5 cursor-pointer
                        border ${isSelected ? 'border-black shadow-inner' : 'border-transparent'}
                        hover:brightness-110 transition-all
                    `}
                >
                    {children}
                </button>
            );
        };

        
        const getPercentNum = (val) => {
            if (!val) return 0;
            let s = String(val).trim();
            if (s.includes('%')) return parseFloat(s) || 0;
            let n = parseFloat(s);
            if (isNaN(n)) return 0;
            if (n > 0 && n <= 5) return n * 100;
            return n;
        };

        const formatPercent = (val) => {
            if (val === '' || val === null || val === undefined) return '';
            let strVal = String(val).trim();
            if (strVal.includes('%')) {
                const parsed = parseFloat(strVal);
                return isNaN(parsed) ? strVal : `${Math.round(parsed)}%`;
            }
            let num = parseFloat(strVal);
            if (!isNaN(num)) {
                if (num > 0 && num <= 5) return `${Math.round(num * 100)}%`;
                else if (num === 0) return `0%`;
                else return `${Math.round(num)}%`;
            }
            return strVal;
        };

        const formatNumberWithCommas = (val) => {
            if (val === '' || val === null || val === undefined || isNaN(val)) return val;
            return Math.round(parseFloat(val)).toLocaleString('en-US');
        };

        const formatAccountingNumber = (val) => {
            if (val === '' || val === null || val === undefined || isNaN(val)) return val;
            const num = Math.round(parseFloat(val));
            if (num < 0) {
                return `(-${Math.abs(num).toLocaleString('en-US')})`;
            }
            return num.toLocaleString('en-US');
        };
        
        
                const PivotTableViewer = ({ data, config }) => {
            const [collapsedNodes, setCollapsedNodes] = useState(new Set());
            const toggleCollapse = (nodeId) => {
                const next = new Set(collapsedNodes);
                if (next.has(nodeId)) next.delete(nodeId);
                else next.add(nodeId);
                setCollapsedNodes(next);
            };
            const { rowFields = [], dataFields = [], title = "Pivot", colField = null, valuesInRows = false, rowClass = null } = config;
            
            const aggregated = useMemo(() => {
                const root = { _totals: {}, _children: {}, label: 'Grand Total', context: {} };
                const colKeysSet = new Set();
                
                data.forEach(row => {
                    if (colField) {
                        const colVal = row[colField] || '(blank)';
                        colKeysSet.add(colVal);
                    }
                    
                    let current = root;
                    
                    const aggregateData = (node, r, colVal = 'Total') => {
                        if (!node._totals[colVal]) {
                            node._totals[colVal] = {};
                            dataFields.forEach(df => {
                                node._totals[colVal][df.name] = { sum: 0, count: 0, max: -Infinity };
                            });
                        }
                        dataFields.forEach(df => {
                            const val = parseFloat(String(r[df.base] || '0').replace(/[,%()]/g, '')) || 0;
                            node._totals[colVal][df.name].sum += val;
                            node._totals[colVal][df.name].count += 1;
                            if (val > node._totals[colVal][df.name].max) node._totals[colVal][df.name].max = val;
                        });
                    };
                    
                    const cVal = colField ? (row[colField] || '(blank)') : 'Total';
                    
                    // Aggregate root
                    aggregateData(root, row, 'Total');
                    if (colField) aggregateData(root, row, cVal);
                    
                    rowFields.forEach((rf, idx) => {
                        const val = row[rf.key] || '(blank)';
                        if (!current._children[val]) {
                            current._children[val] = { _totals: {}, _children: {}, label: val, context: { ...current.context, [rf.key]: row[rf.key] } };
                        }
                        
                        current = current._children[val];
                        aggregateData(current, row, 'Total');
                        if (colField) aggregateData(current, row, cVal);
                    });
                });
                
                const colKeys = Array.from(colKeysSet).sort();
                return { root, colKeys };
            }, [data, config]);
            
            const flatten = (node, level = 0, isLastChild = true, prefix = '', parentId = 'root') => {
                let rows = [];
                const nodeId = `${parentId}-${node.label}`;
                const hasChildren = Object.keys(node._children).length > 0;
                rows.push({
                    id: nodeId,
                    level,
                    label: node.label,
                    totals: node._totals,
                    context: node.context,
                    isLastChild,
                    prefix,
                    hasChildren
                });
                
                if (collapsedNodes.has(nodeId)) return rows;
                
                const childrenKeys = Object.keys(node._children).sort();
                childrenKeys.forEach((key, index) => {
                    const isLast = index === childrenKeys.length - 1;
                    const newPrefix = prefix + (isLastChild ? '    ' : '│   ');
                    rows = rows.concat(flatten(node._children[key], level + 1, isLast, newPrefix, nodeId));
                });
                return rows;
            };
            
            const renderRows = useMemo(() => {
                if (!aggregated.root || Object.keys(aggregated.root._totals).length === 0) return [];
                return flatten(aggregated.root, 0, true, '');
            }, [aggregated]);
            
            const colKeysToRender = colField ? aggregated.colKeys : ['Total'];
            
            return (
                <div className="border-2 border-black overflow-x-auto bg-white shadow-md mb-4">
                    <h2 className="text-xl font-bold bg-[#002060] text-white p-2 flex justify-between">
                        <span>{title}</span>
                        {colField && <span className="text-sm font-normal self-end">Columns: {colField}</span>}
                    </h2>
                    <table className="w-full text-xs text-center border-collapse border border-gray-400 whitespace-nowrap">
                        <thead className="bg-[#203764] text-white sticky top-0 z-10 shadow-sm border-black">
                            {colField && !valuesInRows && (
                                <tr>
                                    <th className="border border-black p-1 min-w-[200px] text-left">Row Labels</th>
                                    {colKeysToRender.map((c, i) => (
                                        <th key={i} colSpan={dataFields.length} className="border border-black p-1 bg-[#1e2f50]">{c}</th>
                                    ))}
                                    <th colSpan={dataFields.length} className="border border-black p-1 font-bold">Grand Total</th>
                                </tr>
                            )}
                            <tr>
                                <th className="border border-black p-1 min-w-[200px] text-left">Row Labels</th>
                                {colField && valuesInRows && (
                                    <>
                                        <th className="border border-black p-1 bg-[#1e2f50]">Values</th>
                                        {colKeysToRender.map((c, i) => (
                                            <th key={i} className="border border-black p-1 bg-[#1e2f50]">{c}</th>
                                        ))}
                                        <th className="border border-black p-1 font-bold">Grand Total</th>
                                    </>
                                )}
                                {(!colField || !valuesInRows) && (colField ? [...colKeysToRender, 'Total'] : ['Total']).map((cKey) => (
                                    dataFields.map((df, dfIdx) => (
                                        <th key={`${cKey}-${dfIdx}`} className={`border border-black p-1 min-w-[80px] ${cKey === 'Total' && colField ? 'font-bold bg-[#203764]' : ''}`}>{df.label}</th>
                                    ))
                                ))}
                            </tr>
                        </thead>
                        <tbody>
                            {renderRows.map((row, i) => {
                                const trClassBase = `hover:bg-gray-100 ${row.level === 0 ? 'bg-[#d9e1f2] font-bold' : ''} ${row.level === 1 ? 'font-bold' : ''}`;
                                const customClass = rowClass && row.level === rowFields.length ? rowClass(row.totals, row.context) : '';
                                
                                if (valuesInRows) {
                                    return (
                                        <React.Fragment key={i}>
                                            <tr className={`${trClassBase} ${customClass} ${row.level === 0 ? 'bg-[#d9e1f2] font-bold' : ''}`}>
                                                <td rowSpan={dataFields.length + 1} className="border border-gray-400 p-1 text-left align-top">
                                                    <span style={{ paddingLeft: `${Math.max(0, row.level - 1) * 1.5}rem` }} className="flex items-center">
                                                        {row.level > 0 && (row.hasChildren 
                                                            ? <button onClick={() => toggleCollapse(row.id)} className="mr-1 w-4 text-center border border-gray-400 bg-white shadow-sm font-bold text-[10px] leading-tight hover:bg-gray-200">{collapsedNodes.has(row.id) ? '+' : '−'}</button>
                                                            : <span className="mr-1 w-4 text-center inline-block">•</span>
                                                        )}
                                                        {row.label}
                                                    </span>
                                                </td>
                                                {/* Fill the empty cells for the parent header row so borders connect */}
                                                <td className="border border-gray-400 p-1 bg-gray-100"></td>
                                                {[...colKeysToRender, 'Total'].map((cKey, cIdx) => (
                                                    <td key={`empty-${cIdx}`} className="border border-gray-400 p-1 bg-gray-100"></td>
                                                ))}
                                            </tr>
                                            {dataFields.map((df, dfIdx) => (
                                                <tr key={`${i}-${dfIdx}`} className={`${customClass || 'bg-white hover:bg-gray-50'}`}>
                                                    <td className="border border-gray-400 p-1 text-left bg-gray-100 font-semibold">{df.label}</td>
                                                    {[...colKeysToRender, 'Total'].map((cKey, cIdx) => {
                                                        let val = 0;
                                                        const tGrp = row.totals[cKey] || {};
                                                        if (df.agg === 'calc' && df.calc) {
                                                            val = df.calc(tGrp);
                                                        } else {
                                                            const t = tGrp[df.name] || { sum: 0, max: 0, count: 0 };
                                                            if (df.agg === 'sum') val = t.sum;
                                                            if (df.agg === 'max') val = t.max;
                                                            if (df.agg === 'count') val = t.count;
                                                            if (df.agg === 'avg') val = t.count > 0 ? t.sum / t.count : 0;
                                                        }
                                                        
                                                        let displayVal = val;
                                                        if (df.format === 'number') displayVal = formatNumberWithCommas(val);
                                                        else if (df.format === 'percent') displayVal = `${Math.round(val)}%`;
                                                        else if (df.format === 'accounting') displayVal = formatAccountingNumber(val);
                                                        
                                                        const cClass = df.cellClass ? df.cellClass(val) : '';
                                                        return <td key={cIdx} className={`border border-gray-400 p-1 ${cKey === 'Total' ? 'font-bold bg-[#eef2fa]' : ''} ${cClass}`}>{displayVal}</td>;
                                                    })}
                                                </tr>
                                            ))}
                                        </React.Fragment>
                                    );
                                }
                                
                                return (
                                    <tr key={i} className={`${trClassBase} ${customClass}`}>
                                        <td className="border border-gray-400 p-1 text-left">
                                            <span style={{ paddingLeft: `${Math.max(0, row.level - 1) * 1.5}rem` }}>
                                                {row.level > 0 && (row.hasChildren ? '▼ ' : '• ')}
                                                {row.label}
                                            </span>
                                        </td>
                                        {(colField ? [...colKeysToRender, 'Total'] : ['Total']).map((cKey) => (
                                            dataFields.map((df, colIdx) => {
                                                let val = 0;
                                                const tGrp = row.totals[cKey] || {};
                                                if (df.agg === 'calc' && df.calc) {
                                                    val = df.calc(tGrp);
                                                } else {
                                                    const t = tGrp[df.name] || { sum: 0, max: 0, count: 0 };
                                                    if (df.agg === 'sum') val = t.sum;
                                                    if (df.agg === 'max') val = t.max;
                                                    if (df.agg === 'count') val = t.count;
                                                    if (df.agg === 'avg') val = t.count > 0 ? t.sum / t.count : 0;
                                                }
                                                
                                                let displayVal = val;
                                                if (df.format === 'number') displayVal = formatNumberWithCommas(val);
                                                else if (df.format === 'percent') displayVal = `${Math.round(val)}%`;
                                                else if (df.format === 'accounting') displayVal = formatAccountingNumber(val);
                                                
                                                const cClass = df.cellClass ? df.cellClass(val) : '';
                                                return <td key={`${cKey}-${colIdx}`} className={`border border-gray-400 p-1 ${cKey === 'Total' ? 'font-bold bg-[#eef2fa]' : ''} ${cClass}`}>{displayVal}</td>;
                                            })
                                        ))}
                                    </tr>
                                );
                            })}
                        </tbody>
                    </table>
                </div>
            );
        };

        function FlashReportDashboard() {
            const [remarksHidden, setRemarksHidden] = useState(true);
            const [reeferHidden, setReeferHidden] = useState(false);
            const [bsaHidden, setBsaHidden] = useState(false);
            const [activityHidden, setActivityHidden] = useState(false);
            const [sectorAllocHidden, setSectorAllocHidden] = useState(false);
            const [dgVolumeHidden, setDgVolumeHidden] = useState(false);
            const [opIssuesHidden, setOpIssuesHidden] = useState(false);
            const [apStatusHidden, setApStatusHidden] = useState(false);
            const [rotationHidden, setRotationHidden] = useState(false);
            const [tradeBreakdownHidden, setTradeBreakdownHidden] = useState(false);
            const [vcoHidden, setVcoHidden] = useState(false);
            const [zoomLevel, setZoomLevel] = useState(1.0);
            const [isDragging, setIsDragging] = useState(false);
            const [rawRows, setRawRows] = useState([]);
            const [activeTab, setActiveTab] = useState('detail');
            const fileInputRef = useRef(null);

            const [selectedSubTrades, setSelectedSubTrades] = useState([]);
            const [selectedAnalysts, setSelectedAnalysts] = useState([]);
            const [selectedCoasts, setSelectedCoasts] = useState([]);
            const [selectedLanes, setSelectedLanes] = useState([]);

            const [headerFilters, setHeaderFilters] = useState({});

            const handleHeaderFilterChange = (key, value) => {
                setHeaderFilters(prev => ({ ...prev, [key]: value }));
            };

            const renderFilter = (colKey) => (
                <input 
                    type="text" 
                    className="block w-full text-black font-normal text-[9px] px-1 py-0.5 border border-gray-400 focus:outline-none focus:border-blue-500 bg-white placeholder-gray-400 shadow-inner rounded-sm" 
                    placeholder="Filter..." 
                    value={headerFilters[colKey] || ''} 
                    onChange={e => handleHeaderFilterChange(colKey, e.target.value)} 
                    onClick={e => e.stopPropagation()}
                />
            );

            const processFile = (file) => {
                if (!file) return;

                if (!window.XLSX) {
                    console.error("XLSX library is not loaded.");
                    return;
                }

                const reader = new FileReader();
                reader.onload = (evt) => {
                    try {
                        const bstr = evt.target.result;
                        const wb = window.XLSX.read(bstr, { type: 'binary' });
                        const wsname = wb.SheetNames[0];
                        const ws = wb.Sheets[wsname];

                        const rawData = window.XLSX.utils.sheet_to_json(ws, { raw: false, defval: '' });

                        if (rawData && rawData.length > 0) {
                            const formattedData = rawData.map((row, index) => {
                                const cleanRow = {};
                                const rowKeys = Object.keys(row);
                                
                                rowKeys.forEach(k => {
                                    const cleanK = String(k).toLowerCase().replace(/[^a-z0-9]/g, '');
                                    cleanRow[cleanK] = row[k];
                                });

                                const cleanRowKeys = Object.keys(cleanRow);

                                const getVal = (aliases) => {
                                    for (let alias of aliases) {
                                        const cleanAlias = alias.toLowerCase().replace(/[^a-z0-9]/g, '');
                                        if (cleanRow[cleanAlias] !== undefined && cleanRow[cleanAlias] !== '') {
                                            return cleanRow[cleanAlias];
                                        }
                                    }
                                    for (let alias of aliases) {
                                        const cleanAlias = alias.toLowerCase().replace(/[^a-z0-9]/g, '');
                                        if (cleanAlias.length < 3) continue;
                                        const matchingKey = cleanRowKeys.find(k => k.includes(cleanAlias));
                                        if (matchingKey && cleanRow[matchingKey] !== '') {
                                            return cleanRow[matchingKey];
                                        }
                                    }
                                    return '';
                                };

                                const rowObj = {
                                    id: index + 1,
                                    trade: getVal(['Trade']) || 'TPT',
                                    subTrade: getVal(['Sub Trade', 'SubTrade', 'Sub_Trade']),
                                    lane: getVal(['Lane', 'Service']),
                                    saleWeek: getVal(['Sale Week', 'SaleWeek', 'Week']),
                                    pic: getVal(['MCT Spc Analyst', 'PIC (spc/mkg)', 'PIC', 'SPC Analyst', 'Mktg Analyst']),
                                    coast: getVal(['MCT Spc Team', 'Spc Team', 'Coast']),
                                    cutoff: getVal(['1st POL Cutoff', '1stPOLCutoff', 'Cutoff', '1st POL']),
                                    etd: getVal(['ETD Last Port', 'ETDLastPort', 'Last Port ETD', 'ETD']),
                                    status: getVal(['Measures Overall Status', 'BKG FLASH STATUS', 'MeasuresOverallStatus']),
                                    vvd: getVal(['Vessel 1st VVD', 'VVD', 'Voyage']),
                                    vessel: getVal(['Vessel Name', 'Vessel']),
                                    maxLdn: getVal(['MCT Max Laden', 'Max LDN', 'MaxLdn', 'Max Laden']),
                                    standbyRaw: getVal(['Trunk Threshold', 'Standby Threshold', 'Overall Threshold', 'Threshold', 'Standby']),
                                    curLaden: getVal(['Measures POL Laden TEU', 'Current Laden', 'Laden TEU', 'Cur Laden']),
                                    peakUtilRaw: getVal(['Measures Peak Overall Utilz', 'Peak Utiliz', 'Peak Overall', 'Peak Util']),
                                    curUtilRaw: getVal(['Measures Overall Booking Utilz', 'Current Laden Utiliz', 'Booking Utilz', 'Booking Utiliz']),
                                    shortfall: getVal(['Max LDN vs BKG', 'Short_Fall', 'Short Fall', 'Shortfall', 'Max Laden vs POL  Booking', 'Max Laden vs POL Booking']),
                                    quote: getVal(['Measures ONE Quote volume', 'ONE Quote', 'ONE Quote Volume', 'Quote']),
                                    broken: getVal(['Measures Broken Routes TEU', 'Broken Routes', 'Broken']),
                                    bsaTeu: getVal(['BSA TEU']),
                                    bsaWgt: getVal(['BSA Wgt', 'BSA QTY', 'Wgt']),
                                    rfrBsaPlugs: getVal(['RFR BSA Plugs', 'BSA UNIT RF']),
                                    rfrBkgPlugs: getVal(['RFR BKG Plugs', 'Booking Reefer UNIT']),
                                    rfrMaxLdn: getVal(['RFR Max LDN', 'RFR Max Laden']),
                                    rfrBkgTtl: getVal(['RFR BKG TTL', 'Reefer TEU', 'RFR BKG Total']),
                                    rfrUtilizRaw: getVal(['RFR Utiliz', 'Reefer Utilz', 'Reefer Utiliz']),
                                    actVsBkgUtilzRaw: getVal(['Activity vs Booking Utilz', 'ActVsBkg']),
                                    actVsMaxLdnRaw: getVal(['Activity vs Max Laden', 'ActVsMax']),
                                    inlandAct: getVal(['Inland Activity', 'Active Ipi']),
                                    inlandNoAct: getVal(['Inland No Activity', 'Non Active Ipi']),
                                    inlandTotal: getVal(['Inland Total', 'Ipi Total']),
                                    portAct: getVal(['Port Activity', 'Active Local']),
                                    portNoAct: getVal(['Port No Activity', 'Non Active Local']),
                                    portTotal: getVal(['Port Total', 'Local Total']),
                                    opIssues: getVal(['Operational Issues', 'Operation Notice']),
                                    secAlloc: getVal(['Sector Allocation', 'Sec Alloc']),
                                    sgsinDryVsRfr: getVal(['SGSIN Dry vs Reefer', 'SGSIN Dry vs Rfr']),
                                    proformaRot: getVal(['Proforma Rotation', 'Proforma ETA']),
                                    actualRot: getVal(['Actual Rotation', 'Actual Ro']),
                                    apStatus: getVal(['AP Status']),
                                    tpt: getVal(['TPT']),
                                    tat: getVal(['TAT']),
                                    lwt: getVal(['LWT']),
                                    lnt: getVal(['LNT']),
                                    imt: getVal(['IMT']),
                                    let: getVal(['LET']),
                                    dgTeu: getVal(['DG TEU']),
                                    remarks: getVal(['Voyage Remarks', 'Remarks']),
                                    vco: getVal(['VCO Analyst', 'VCO Analyst ', 'VCO']),

                                    pol: getVal(['Route Location 1st Pol', '1st Pol', 'POL']),
                                    plannedMty: getVal(['Measures Planned Mty TEU', 'Planned Mty']),
                                    actualMty: getVal(['Measures Actual Mty TEU', 'Actual Mty']),
                                    polMaxLdn: getVal(['POL Max Laden TEU', 'POL Max Laden']),
                                    polLdnThresh: getVal(['POL Laden Threshold', 'POL Laden Thresh']),
                                    discharge: getVal(['Measures Discharge TEU', 'Discharge']),
                                    peakPolUtilzRaw: getVal(['Measures Peak Pol Utilz', 'Peak Pol Utilz']),
                                    polBkgUtilzRaw: getVal(['Measures POL Booking Utilz', 'POL Booking Utilz']),
                                    maxLdnVsPolBkg: getVal(['Max Laden vs POL  Booking', 'Max Laden vs POL Booking']),
                                    loadableQuant: getVal(['Measures Loadable TEU', 'Loadable Quant', 'Loadable TEU']),
                                    loadableWgt: getVal(['Measures Loadable WGT update', 'Loadable WGT']),
                                    coastalEtd: getVal(['Route Date Coastal ETD Date', 'Coastal ETD Date', 'Coastal ETD']),
                                    portCut: getVal(['Route Date POL Cut/off Date', 'POL Cut/off Date', 'Port Cut']),
                                    sectorRemarks: getVal(['Sector Remarks'])
                                };
                                
                                const totalAct = (rowObj.inlandAct || 0) + (rowObj.portAct || 0);
                                const totalTot = (rowObj.inlandTotal || 0) + (rowObj.portTotal || 0);
                                rowObj.actVsBkgUtilzRaw = totalTot > 0 ? (totalAct / totalTot) : 0;
                                
                                return rowObj;
                            });

                            setRawRows(formattedData);
                            if (fileInputRef.current) fileInputRef.current.value = '';
                        }
                    } catch (error) {
                        console.error("Error parsing the file:", error);
                    }
                };
                reader.readAsBinaryString(file);
            };
            
            const handleFileUpload = (e) => {
                processFile(e.target.files[0]);
            };
            
            const handleDrop = (e) => {
                e.preventDefault();
                setIsDragging(false);
                if (e.dataTransfer.files && e.dataTransfer.files.length > 0) {
                    processFile(e.dataTransfer.files[0]);
                    e.dataTransfer.clearData();
                }
            };

            const exportToExcel = () => {
                const table = document.querySelector('table');
                if (!table || !window.XLSX) return;
                const wb = XLSX.utils.table_to_book(table);
                XLSX.writeFile(wb, `${activeTab}_export.xlsx`);
            };

            const toggleFilter = (setState, value) => {
                setState(prev => prev.includes(value) ? prev.filter(v => v !== value) : [...prev, value]);
            };

            const clearSlicers = () => {
                setSelectedSubTrades([]);
                setSelectedAnalysts([]);
                setSelectedCoasts([]);
                setSelectedLanes([]);
                setHeaderFilters({});
            };

            
            const filteredRawRows = useMemo(() => {
                return rawRows.filter(row => {
                    const matchSubTrade = selectedSubTrades.length === 0 || selectedSubTrades.includes(row.subTrade);
                    const matchAnalyst = selectedAnalysts.length === 0 || selectedAnalysts.some(analyst =>
                        row.pic && row.pic.toLowerCase().includes(analyst.toLowerCase())
                    );
                    const matchLane = selectedLanes.length === 0 || selectedLanes.includes(row.lane);
                    const matchCoast = selectedCoasts.length === 0 || selectedCoasts.includes(row.coast);
                    
                    let matchHeaderFilters = true;
                    for (const key in headerFilters) {
                        const filterValue = headerFilters[key];
                        if (filterValue && filterValue.trim() !== '') {
                            const rawRowVal = String(row[key] || '').toLowerCase();
                            const searchVal = filterValue.toLowerCase().trim();
                            
                            const cleanedRowVal = rawRowVal.replace(/[,%()]/g, '');
                            const cleanedSearchVal = searchVal.replace(/[,%()]/g, '');
                            
                            if (!rawRowVal.includes(searchVal) && !cleanedRowVal.includes(cleanedSearchVal)) {
                                matchHeaderFilters = false;
                                break;
                            }
                        }
                    }
                    return matchSubTrade && matchAnalyst && matchLane && matchCoast && matchHeaderFilters;
                });
            }, [rawRows, selectedSubTrades, selectedAnalysts, selectedLanes, selectedCoasts, headerFilters]);

            
            const sectorRows = useMemo(() => {
                const parsed = [];
                filteredRawRows.forEach(row => {
                    if (row.sectorRemarks) {
                        const parts = String(row.sectorRemarks).split('/');
                        parts.forEach(p => {
                            const match = p.match(/([A-Z]+):\s*([\d,]+)\s*-\s*([\d,]+)/);
                            if (match) {
                                parsed.push({
                                    ...row,
                                    podSector: match[1],
                                    sectorAlloc: parseFloat(match[2].replace(/,/g, '')),
                                    avgBooking: parseFloat(match[3].replace(/,/g, ''))
                                });
                            }
                        });
                    }
                });
                return parsed;
            }, [filteredRawRows]);

            const tableData = useMemo(() => {
                const aggregatedMap = {};
                filteredRawRows.forEach(row => {
                    const key = `${row.lane}-${row.saleWeek}-${row.vvd}-${row.vessel}`;
                    if (!row.vvd && !row.vessel) {
                        aggregatedMap[`uid-${row.id}`] = row;
                        return;
                    }

                    if (!aggregatedMap[key]) {
                        aggregatedMap[key] = { ...row };
                        const numerics = ['curLaden', 'quote', 'shortfall', 'rfrBkgPlugs', 'rfrBkgTtl', 'inlandAct', 'inlandNoAct', 'inlandTotal', 'portAct', 'portNoAct', 'portTotal', 'dgTeu', 'tpt', 'tat', 'lwt', 'lnt', 'imt', 'let'];
                        numerics.forEach(n => aggregatedMap[key][n] = parseFloat(aggregatedMap[key][n]) || 0);

                        const maxes = ['maxLdn', 'bsaTeu', 'bsaWgt', 'rfrBsaPlugs', 'rfrMaxLdn'];
                        maxes.forEach(n => aggregatedMap[key][n] = parseFloat(aggregatedMap[key][n]) || 0);
                        
                        aggregatedMap[key].curUtilRaw = getPercentNum(row.curUtilRaw);
                    } else {
                        const numerics = ['curLaden', 'quote', 'rfrBkgPlugs', 'rfrBkgTtl', 'inlandAct', 'inlandNoAct', 'inlandTotal', 'portAct', 'portNoAct', 'portTotal', 'dgTeu', 'tpt', 'tat', 'lwt', 'lnt', 'imt', 'let'];
                        numerics.forEach(n => {
                            aggregatedMap[key][n] += (parseFloat(row[n]) || 0);
                        });

                        const maxes = ['maxLdn', 'bsaTeu', 'bsaWgt', 'rfrBsaPlugs', 'rfrMaxLdn'];
                        maxes.forEach(n => {
                            aggregatedMap[key][n] = Math.max(aggregatedMap[key][n], parseFloat(row[n]) || 0);
                        });
                        
                        aggregatedMap[key].curUtilRaw += getPercentNum(row.curUtilRaw);
                    }
                });

                return Object.values(aggregatedMap).map(row => {
                    row.standby = formatPercent(row.standbyRaw);
                    row.peakUtil = formatPercent(row.peakUtilRaw);
                    row.rfrUtiliz = formatPercent(row.rfrUtilizRaw);
                    
                    const totalAct = (parseFloat(row.inlandAct) || 0) + (parseFloat(row.portAct) || 0);
                    const totalTot = (parseFloat(row.inlandTotal) || 0) + (parseFloat(row.portTotal) || 0);
                    row.actVsBkgUtilzRaw = totalTot > 0 ? (totalAct / totalTot) : 0;
                    row.actVsBkgUtilz = formatPercent(row.actVsBkgUtilzRaw);
                    
                    row.actVsMaxLdnRaw = totalAct - (parseFloat(row.maxLdn) || 0);
                    const formattedMaxLdnRaw = formatNumberWithCommas(row.actVsMaxLdnRaw);
                    row.actVsMaxLdn = (row.actVsMaxLdnRaw > 0 ? '+' : '') + formattedMaxLdnRaw;
                    row.actVsMaxLdnStyle = row.actVsMaxLdnRaw > 0 ? { color: 'red' } : {};

                    const parsedMax = parseFloat(row.maxLdn);
                    row.maxLdn = (parsedMax === 0 || isNaN(parsedMax)) ? '' : formatNumberWithCommas(row.maxLdn);

                    row.curUtil = `${Math.round(row.curUtilRaw || 0)}%`;

                    if (row.maxLdn !== '' && row.curLaden !== undefined) {
                        const rawMaxLdn = parseFloat(String(row.maxLdn).replace(/,/g, ''));
                        const calculatedShortfall = row.curLaden - rawMaxLdn;
                        row.shortfall = formatAccountingNumber(calculatedShortfall);
                    } else {
                        row.shortfall = formatAccountingNumber(row.shortfall);
                    }
                    
                    row.curLaden = formatNumberWithCommas(row.curLaden);
                    row.quote = formatNumberWithCommas(row.quote);
                    row.bsaTeu = formatNumberWithCommas(row.bsaTeu);
                    row.bsaWgt = formatNumberWithCommas(row.bsaWgt);
                    
                    if (String(row.vvd).trim().toUpperCase() === 'VMS') {
                        const fieldsToKeep = ['id', 'trade', 'subTrade', 'lane', 'saleWeek', 'pic', 'vvd'];
                        Object.keys(row).forEach(key => {
                            if (!fieldsToKeep.includes(key)) {
                                row[key] = '';
                            }
                        });
                    }

                    return row;
                });
            }, [filteredRawRows]);

            const processedData = useMemo(() => {
                let filtered = [...tableData]; // Already filtered!
                
                filtered.sort((a, b) => {
                    if (a.trade !== b.trade) return String(a.trade || '').localeCompare(String(b.trade || ''));
                    if (a.subTrade !== b.subTrade) return String(a.subTrade || '').localeCompare(String(b.subTrade || ''));
                    if (a.lane !== b.lane) return String(a.lane || '').localeCompare(String(b.lane || ''));
                    if (a.saleWeek !== b.saleWeek) return String(a.saleWeek || '').localeCompare(String(b.saleWeek || ''));
                    return String(a.vessel || '').localeCompare(String(b.vessel || ''));
                });

                const withBlanks = [];
                for (let i = 0; i < filtered.length; i++) {
                    withBlanks.push(filtered[i]);
                    const isLastInLane = i === filtered.length - 1 || filtered[i].lane !== filtered[i+1].lane;
                    if (isLastInLane) {
                        withBlanks.push({
                            id: `blank-${filtered[i].id || i}`,
                            isBlankRow: true,
                            trade: filtered[i].trade,
                            subTrade: filtered[i].subTrade,
                            lane: filtered[i].lane
                        });
                    }
                }

                const spanned = withBlanks.map(row => ({
                    ...row,
                    showTrade: true, tradeSpan: 1,
                    showSub: true, subSpan: 1,
                    showLane: true, laneSpan: 1
                }));

                for (let i = 0; i < spanned.length; i++) {
                    if (spanned[i].showTrade) {
                        let spanCount = 1;
                        for (let j = i + 1; j < spanned.length; j++) {
                            if (spanned[j].trade === spanned[i].trade) {
                                spanCount++;
                                spanned[j].showTrade = false;
                            } else break;
                        }
                        spanned[i].tradeSpan = spanCount;
                    }

                    if (spanned[i].showSub) {
                        let spanCount = 1;
                        for (let j = i + 1; j < spanned.length; j++) {
                            if (spanned[j].trade === spanned[i].trade && spanned[j].subTrade === spanned[i].subTrade) {
                                spanCount++;
                                spanned[j].showSub = false;
                            } else break;
                        }
                        spanned[i].subSpan = spanCount;
                    }

                    if (spanned[i].showLane) {
                        let spanCount = 1;
                        for (let j = i + 1; j < spanned.length; j++) {
                            if (spanned[j].trade === spanned[i].trade &&
                                spanned[j].subTrade === spanned[i].subTrade &&
                                spanned[j].lane === spanned[i].lane) {
                                spanCount++;
                                spanned[j].showLane = false;
                            } else break;
                        }
                        spanned[i].laneSpan = spanCount;
                    }
                }
                return spanned;
            }, [tableData]);

            return (
                <div className="min-h-screen bg-[#f3f3f3] p-4 font-sans select-none text-black">
                    <input type="file" accept=".xlsx, .xls, .csv" ref={fileInputRef} onChange={handleFileUpload} className="hidden" />
                    
                    {tableData.length === 0 ? (
                        <div className="flex flex-col items-center justify-center h-[80vh] border-4 border-dashed border-gray-400 rounded-lg bg-white shadow-sm p-10 text-center m-4">
                            <h1 className="text-4xl font-extrabold italic tracking-tighter text-[#002060] mb-4" style={{ fontFamily: 'Arial, sans-serif' }}>
                                Booking Flash Report NA
                            </h1>
                            <p className="text-gray-600 mb-8 text-lg max-w-lg">
                                Please upload the underlying data file to populate and generate the pivot table.
                            </p>
                            <button onClick={() => fileInputRef.current?.click()} className="bg-[#002060] text-white px-8 py-4 rounded shadow-md hover:bg-blue-800 transition-colors text-lg font-bold cursor-pointer">
                                Upload Underlying Data
                            </button>
                        </div>
                    ) : (
                        <>
                            <div className="flex justify-between items-end mb-2 border-b-2 border-gray-300 pb-1">
                                <h1 className="text-3xl font-extrabold italic tracking-tighter" style={{ fontFamily: 'Arial, sans-serif' }}>
                                    Booking Flash Report NA
                                </h1>
                                <div className="text-sm font-bold pb-1">
                                    Last Refresh: <span className="text-blue-700 italic">07/30/2026 2:43 PM</span>
                                </div>
                            </div>

                            <div className="flex gap-4 mb-4 items-stretch">
                                <div className="flex-1 bg-[#e7e6e6] border-2 border-black p-3 flex flex-col shadow-sm rounded-sm">
                                    <div className="flex justify-between items-start mb-2">
                                        <div className="flex items-start">
                                            <span className="text-sm font-bold mr-2 w-20 mt-1">Sub Trade</span>
                                            <div className="flex flex-col flex-1 relative">
                                                <div className="flex justify-end mb-1 absolute right-0 -top-5">
                                                    <ListFilterIcon size={16} className="text-gray-500 mr-1" />
                                                    <FilterIcon size={16} className="text-gray-500" />
                                                </div>
                                                <div className="flex flex-wrap bg-[#d9d9d9] p-1 border border-gray-300 rounded-sm">
                                                    {['AW', 'LN', 'PN', 'PS', 'TA'].map(trade => (
                                                        <SlicerBtn key={trade} bgClass="bg-[#a9d08e]" isSelected={selectedSubTrades.includes(trade)} isFilterActive={selectedSubTrades.length > 0} onClick={() => toggleFilter(setSelectedSubTrades, trade)}>{trade}</SlicerBtn>
                                                    ))}
                                                </div>
                                            </div>
                                        </div>

                                        <div className="flex items-start">
                                            <span className="text-sm font-bold mr-2 w-12 mt-1">Coast</span>
                                            <div className="flex flex-col flex-1 relative">
                                                <div className="flex justify-end mb-1 absolute right-0 -top-5">
                                                    <ListFilterIcon size={16} className="text-gray-500 mr-1" />
                                                    <FilterIcon size={16} className="text-gray-500" />
                                                </div>
                                                <div className="flex flex-wrap bg-[#d9d9d9] p-1 border border-gray-300 rounded-sm">
                                                    {['WC', 'EC'].map(c => (
                                                        <SlicerBtn key={c} bgClass="bg-[#c00000]" isSelected={selectedCoasts.includes(c)} isFilterActive={selectedCoasts.length > 0} onClick={() => toggleFilter(setSelectedCoasts, c)}>{c}</SlicerBtn>
                                                    ))}
                                                </div>
                                            </div>
                                        </div>
                                    </div>

                                    <div className="flex items-start mb-2">
                                        <span className="text-sm font-bold mr-2 w-20 mt-1">SPC Analyst</span>
                                        <div className="flex flex-col flex-1 relative">
                                            <div className="flex justify-end mb-1 absolute right-0 -top-5">
                                                <ListFilterIcon size={16} className="text-gray-500 mr-1" />
                                                <FilterIcon size={16} className="text-gray-500" />
                                            </div>
                                            <div className="flex flex-nowrap overflow-x-auto whitespace-nowrap bg-[#d9d9d9] p-1 border border-gray-300 rounded-sm w-fit">
                                                {['Evan', 'Joe', 'Kysa', 'Lani', 'Peter', 'Resid', 'Ryan H', 'Ryan T', 'TBA'].map(a => (
                                                    <SlicerBtn key={a} bgClass="bg-[#ed7d31]" isSelected={selectedAnalysts.includes(a)} isFilterActive={selectedAnalysts.length > 0} onClick={() => toggleFilter(setSelectedAnalysts, a)}>{a}</SlicerBtn>
                                                ))}
                                            </div>
                                        </div>
                                    </div>

                                    <div className="flex items-start">
                                        <span className="text-sm font-bold mr-2 w-20 mt-1">Lane</span>
                                        <div className="flex flex-col flex-1 relative">
                                            <div className="flex justify-end mb-1 absolute right-0 -top-5">
                                                <ListFilterIcon size={16} className="text-gray-500 mr-1" />
                                                <FilterIcon size={16} className="text-gray-500" />
                                            </div>
                                            <div className="flex flex-wrap bg-[#d9d9d9] p-1 border border-gray-300 rounded-sm">
                                                {['AL5', 'AN2', 'ANG', 'AT1', 'AT3', 'AT4', 'EC1', 'EC2', 'EC3', 'EC4', 'EMA', 'FLX', 'FP2', 'MAR', 'MS2', 'PN1', 'PN3', 'PS1', 'PS3', 'PS4', 'PS6', 'PS7', 'PS8', 'VSE', 'WIN'].map(lane => (
                                                    <SlicerBtn key={lane} bgClass="bg-[#5b9bd5]" isSelected={selectedLanes.includes(lane)} isFilterActive={selectedLanes.length > 0} onClick={() => toggleFilter(setSelectedLanes, lane)}>{lane}</SlicerBtn>
                                                ))}
                                            </div>
                                        </div>
                                    </div>
                                </div>

                                <div className="flex flex-col gap-2">
                                    <div className="flex bg-[#e7e6e6] border-2 border-black p-2 shadow-sm rounded-sm text-sm font-bold text-center gap-2 max-w-4xl">
                                        <div className="flex flex-col gap-1 w-1/4">
                                            <button onClick={() => setApStatusHidden(!apStatusHidden)} className={`border border-black p-1 h-full flex items-center justify-center cursor-pointer hover:brightness-105 text-xs leading-tight transition-all ${apStatusHidden ? 'bg-[#d9d9d9]' : 'bg-[#a9d08e]'}`}>{apStatusHidden ? 'Show AP Status' : 'Hide AP Status'}</button>
                                            <button onClick={() => setRotationHidden(!rotationHidden)} className={`border border-black p-1 h-full flex items-center justify-center cursor-pointer hover:brightness-105 text-xs leading-tight transition-all ${rotationHidden ? 'bg-[#d9d9d9]' : 'bg-[#a9d08e]'}`}>{rotationHidden ? 'Show Rotation' : 'Hide Rotation'}</button>
                                            <button onClick={() => setRemarksHidden(!remarksHidden)} className={`border border-black p-1 h-full flex items-center justify-center cursor-pointer hover:brightness-105 text-xs leading-tight transition-all ${remarksHidden ? 'bg-[#d9d9d9]' : 'bg-[#a9d08e]'}`}>{remarksHidden ? 'Show Voyage Remarks' : 'Hide Voyage Remarks'}</button>
                                        </div>
                                        <div className="flex flex-col gap-1 w-1/4">
                                            <button onClick={() => setTradeBreakdownHidden(!tradeBreakdownHidden)} className={`border border-black p-1 h-full flex items-center justify-center cursor-pointer hover:brightness-105 text-xs leading-tight transition-all ${tradeBreakdownHidden ? 'bg-[#d9d9d9]' : 'bg-[#a9d08e]'}`}>{tradeBreakdownHidden ? 'Show Trade Breakdown' : 'Hide Trade Breakdown'}</button>
                                            <button onClick={() => setDgVolumeHidden(!dgVolumeHidden)} className={`border border-black p-1 h-full flex items-center justify-center cursor-pointer hover:brightness-105 text-xs leading-tight transition-all ${dgVolumeHidden ? 'bg-[#d9d9d9]' : 'bg-[#a9d08e]'}`}>{dgVolumeHidden ? 'Show DG Volume' : 'Hide DG Volume'}</button>
                                            <button onClick={() => setVcoHidden(!vcoHidden)} className={`border border-black p-1 h-full flex items-center justify-center cursor-pointer hover:brightness-105 text-xs leading-tight transition-all ${vcoHidden ? 'bg-[#d9d9d9]' : 'bg-[#a9d08e]'}`}>{vcoHidden ? 'Show VCO Analyst' : 'Hide VCO Analyst'}</button>
                                        </div>
                                        <div className="flex flex-col gap-1 w-1/4">
                                            <button onClick={() => setBsaHidden(!bsaHidden)} className={`border border-black p-1 h-full flex items-center justify-center cursor-pointer hover:brightness-105 text-xs leading-tight transition-all ${bsaHidden ? 'bg-[#d9d9d9]' : 'bg-[#a9d08e]'}`}>{bsaHidden ? 'Show BSA' : 'Hide BSA'}</button>
                                            <button onClick={() => setReeferHidden(!reeferHidden)} className={`border border-black p-1 h-full flex items-center justify-center cursor-pointer hover:brightness-105 text-xs leading-tight transition-all ${reeferHidden ? 'bg-[#d9d9d9]' : 'bg-[#a9d08e]'}`}>{reeferHidden ? 'Show Reefer' : 'Hide Reefer'}</button>
                                            <button onClick={() => setActivityHidden(!activityHidden)} className={`border border-black p-1 h-full flex items-center justify-center cursor-pointer hover:brightness-105 text-xs leading-tight transition-all ${activityHidden ? 'bg-[#d9d9d9]' : 'bg-[#a9d08e]'}`}>{activityHidden ? 'Show Activity' : 'Hide Activity'}</button>
                                        </div>
                                        <div className="flex flex-col gap-1 w-1/4">
                                            <button onClick={() => setSectorAllocHidden(!sectorAllocHidden)} className={`border border-black p-1 h-full flex items-center justify-center cursor-pointer hover:brightness-105 text-xs leading-tight transition-all ${sectorAllocHidden ? 'bg-[#d9d9d9]' : 'bg-[#a9d08e]'}`}>{sectorAllocHidden ? 'Show Sector Allocation' : 'Hide Sector Allocation'}</button>
                                            <button onClick={() => setOpIssuesHidden(!opIssuesHidden)} className={`border border-black p-1 h-full flex items-center justify-center cursor-pointer hover:brightness-105 text-xs leading-tight transition-all ${opIssuesHidden ? 'bg-[#d9d9d9]' : 'bg-[#a9d08e]'}`}>{opIssuesHidden ? 'Show Operational Issues' : 'Hide Operational Issues'}</button>
                                        </div>
                                    </div>
                                    <div className="flex gap-2 items-center">
                                        <div className="ml-2 flex items-center gap-2 font-bold text-sm">
                                            Zoom:
                                            <button onClick={() => setZoomLevel(prev => Math.max(0.5, prev - 0.1))} className="px-2 py-1 bg-gray-200 border-2 border-black hover:bg-gray-300">-</button>
                                            <span>{Math.round(zoomLevel * 100)}%</span>
                                            <button onClick={() => setZoomLevel(prev => Math.min(2.0, prev + 0.1))} className="px-2 py-1 bg-gray-200 border-2 border-black hover:bg-gray-300">+</button>
                                        </div>
                                    </div>
                                </div>
                            </div>

                            
                            <div className="flex gap-2 mb-2">
                                <button onClick={() => setActiveTab('trade_summary')} className={`px-4 py-2 font-bold rounded-t-md ${activeTab === 'trade_summary' ? 'bg-[#002060] text-white' : 'bg-gray-300 text-black hover:bg-gray-400'}`}>Trade_Summary</button>
                                <button onClick={() => setActiveTab('sector_summary')} className={`px-4 py-2 font-bold rounded-t-md ${activeTab === 'sector_summary' ? 'bg-[#002060] text-white' : 'bg-gray-300 text-black hover:bg-gray-400'}`}>Sector_Summary</button>
                                <button onClick={() => setActiveTab('pol_booking')} className={`px-4 py-2 font-bold rounded-t-md ${activeTab === 'pol_booking' ? 'bg-[#002060] text-white' : 'bg-gray-300 text-black hover:bg-gray-400'}`}>POL_Booking_Flash</button>
                                <button onClick={() => setActiveTab('booking_flash')} className={`px-4 py-2 font-bold rounded-t-md ${activeTab === 'booking_flash' ? 'bg-[#002060] text-white' : 'bg-gray-300 text-black hover:bg-gray-400'}`}>Booking_Flash</button>
                                <button onClick={() => setActiveTab('detail')} className={`px-4 py-2 font-bold rounded-t-md ${activeTab === 'detail' ? 'bg-[#002060] text-white' : 'bg-gray-300 text-black hover:bg-gray-400'}`}>Detail View</button>
                            </div>
                            
                            {/* TABLE DATA */}

                            {activeTab === 'trade_summary' && (
                                <PivotTableViewer 
                                    data={filteredRawRows}
                                    config={{
                                        title: "Trade Summary",
                                        rowFields: [
                                            { key: 'trade', label: 'Trade' },
                                            { key: 'subTrade', label: 'Sub Trade' },
                                            { key: 'lane', label: 'Lane' },
                                            { key: 'saleWeek', label: 'Sale Week' },
                                            { key: 'vvd', label: 'VVD' },
                                            { key: 'vessel', label: 'Vessel' }
                                        ],
                                        dataFields: [
                                            { name: 'maxLdn', base: 'maxLdn', label: 'Max LDN', agg: 'max', format: 'number' },
                                            { name: 'standby', base: 'standbyRaw', label: 'Standby Threshold', agg: 'max', format: 'percent' },
                                            { name: 'curLaden', base: 'curLaden', label: 'Current Laden', agg: 'sum', format: 'number' },
                                            { name: 'utilization', label: 'Current Laden Utiliz %', agg: 'calc', calc: (t) => t.maxLdn && t.maxLdn.max > 0 ? (t.curLaden.sum / t.maxLdn.max) * 100 : 0, format: 'percent' },
                                            { name: 'shortfall', label: 'Shortfall', agg: 'calc', calc: (t) => t.maxLdn && t.maxLdn.max > 0 ? t.curLaden.sum - t.maxLdn.max : 0, format: 'accounting' },
                                            { name: 'quote', base: 'quote', label: 'ONE Quote', agg: 'sum', format: 'number' },
                                            { name: 'bsaTeu', base: 'bsaTeu', label: 'BSA TEU', agg: 'max', format: 'number' },
                                            { name: 'rfrBkgTtl', base: 'rfrBkgTtl', label: 'RFR BKG TTL', agg: 'sum', format: 'number' },
                                            { name: 'portTotal', base: 'portTotal', label: 'Port Total', agg: 'sum', format: 'number' }
                                        ]
                                    }} 
                                />
                            )}
                            {activeTab === 'sector_summary' && (
                                <div className="flex flex-col lg:flex-row gap-8 items-start">
                                <PivotTableViewer 
                                    data={filteredRawRows}
                                    config={{
                                        title: "Sector Summary",
                                        rowFields: [
                                            { key: 'trade', label: 'Trade' },
                                            { key: 'subTrade', label: 'Sub Trade' },
                                            { key: 'lane', label: 'Lane' },
                                            { key: 'saleWeek', label: 'Sale Week' }
                                        ],
                                        dataFields: [
                                            { name: 'secAlloc', base: 'secAlloc', label: 'Sector Alloc', agg: 'sum', format: 'number' },
                                            { name: 'avgBooking', base: 'curLaden', label: 'Average Booking', agg: 'avg', format: 'number' },
                                            { name: 'curLaden', base: 'curLaden', label: 'Current Laden', agg: 'sum', format: 'number' },
                                            { name: 'utilization', label: 'Current Laden Utiliz %', agg: 'calc', calc: (t) => t.secAlloc && t.secAlloc.sum > 0 ? (t.curLaden.sum / t.secAlloc.sum) * 100 : 0, format: 'percent' },
                                        ]
                                    }} 
                                />
                                <PivotTableViewer 
                                    data={filteredRawRows}
                                    config={{
                                        title: "Average Max Laden vs Booking",
                                        rowFields: [
                                            { key: 'trade', label: 'Trade' },
                                            { key: 'subTrade', label: 'Sub Trade' },
                                            { key: 'lane', label: 'Lane' }
                                        ],
                                        dataFields: [
                                            { name: 'avgMaxLdn', base: 'maxLdn', label: 'Avg Max Laden', agg: 'avg', format: 'number' },
                                            { name: 'avgBkg', base: 'curLaden', label: 'Avg Booking', agg: 'avg', format: 'number' },
                                            { name: 'avgMaxVsBkg', label: 'Avg Max Laden vs Bkg', agg: 'calc', calc: (t) => {
                                                const avgBkg = t.avgBkg.count > 0 ? t.avgBkg.sum/t.avgBkg.count : 0;
                                                const avgMax = t.avgMaxLdn.count > 0 ? t.avgMaxLdn.sum/t.avgMaxLdn.count : 0;
                                                return avgBkg - avgMax;
                                            }, format: 'accounting' },
                                            { name: 'avgUtilz', label: 'Avg Utilization', agg: 'calc', calc: (t) => {
                                                const avgBkg = t.avgBkg.count > 0 ? t.avgBkg.sum/t.avgBkg.count : 0;
                                                const avgMax = t.avgMaxLdn.count > 0 ? t.avgMaxLdn.sum/t.avgMaxLdn.count : 0;
                                                return avgMax > 0 ? (avgBkg / avgMax) * 100 : 0;

                                                    <td className={`border border-gray-400 ${getBg('bg-white', false)}`}>{row.secAlloc}</td>
                                                    <td className={`border border-gray-400 ${getBg('bg-white', false)}`}>{row.sgsinDryVsRfr}</td>
                                                    <td className={`border border-gray-400 truncate max-w-[150px] ${getBg('bg-white', false)}`}>{row.proformaRot}</td>
                                                    <td className={`border border-gray-400 truncate max-w-[150px] ${getBg('bg-white', false)}`}>{row.actualRot}</td>
                                                    <td className={`border border-gray-400 ${getBg('bg-white', false)}`}>{row.apStatus}</td>
                                                    <td className={`border border-gray-400 ${getBg('bg-white', false)}`}>{row.tpt}</td>
                                                    <td className={`border border-gray-400 ${getBg('bg-white', false)}`}>{row.tat}</td>
                                                    <td className={`border border-gray-400 ${getBg('bg-white', false)}`}>{row.lwt}</td>
                                                    <td className={`border border-gray-400 ${getBg('bg-white', false)}`}>{row.lnt}</td>
                                                    <td className={`border border-gray-400 ${getBg('bg-white', false)}`}>{row.imt}</td>
                                                    <td className={`border border-gray-400 ${getBg('bg-white', false)}`}>{row.let}</td>
                                                    <td className={`border border-gray-400 ${getBg('bg-white', false)}`}>{row.dgTeu}</td>
                                                    
                                                    {!remarksHidden && (
                                                        <td className="border border-gray-400 bg-white text-left px-2 truncate max-w-xs">{row.remarks}</td>
                                                    )}
                                                </tr>
                                            );
                                        })}
                                        
                                        {processedData.length === 0 && (
                                            <tr>
                                                <td colSpan={remarksHidden ? 46 : 47} className="p-8 text-center text-gray-500 font-semibold bg-white border border-gray-400">
                                                    No data matches the selected filters.
                                                </td>
                                            </tr>
                                        )}
                                    </tbody>
                                </table>
                            </div>
                                                    )}
                        </>
                    )}
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<FlashReportDashboard />);
    </script>
</body>
</html>
