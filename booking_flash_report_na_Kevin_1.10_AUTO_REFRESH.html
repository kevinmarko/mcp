            // data file) against rawRows (whatever's currently loaded -- via
            // auto-refresh, manual upload, or a prior file). Deliberately compares
            // the FULL datasets, not filteredRawRows -- a snapshot-to-snapshot diff
            // shouldn't be silently narrowed by whatever slicer state another tab
            // happens to be in.
            //
            // Bookings are matched by VVD + POL -- the same grain POL_Booking_Flash
            // already treats as a unique leaf (one raw row per VVD+POL pair,
            // confirmed elsewhere in this project). A row missing either half of
            // that key is excluded from matching entirely (never spuriously
            // "matched" to an unrelated row via two blank keys colliding) -- it can
            // still show up as added/removed, just never as changed.
            const compareData = useMemo(() => {
                if (rawRows.length === 0 || oldRawRows.length === 0) return null;

                const keyOf = (row) => {
                    const vvd = String(row.vvd || '').trim();
                    const pol = String(row.pol || '').trim();
                    return (vvd && pol) ? `${vvd}|${pol}` : null;
                };

                const oldByKey = new Map();
                oldRawRows.forEach(row => { const k = keyOf(row); if (k && !oldByKey.has(k)) oldByKey.set(k, row); });
                const newByKey = new Map();
                rawRows.forEach(row => { const k = keyOf(row); if (k && !newByKey.has(k)) newByKey.set(k, row); });

                // Curated to the fields an ops user would actually care about
                // changing -- not every raw field, which would make routine
                // rounding/formatting noise look like a meaningful change.
                const TRACKED_FIELDS = [
                    { key: 'statusDisplay', label: 'Status', type: 'text' },
                    { key: 'pic', label: 'PIC', type: 'text' },
                    { key: 'vessel', label: 'Vessel', type: 'text' },
                    { key: 'maxLdn', label: 'Max Laden', type: 'number' },
                    { key: 'curLaden', label: 'Current Laden', type: 'number' },
                    { key: 'curUtilRaw', label: 'Booking Utilz', type: 'percent' },
                    { key: 'peakUtilRaw', label: 'Peak Utilz', type: 'percent' },
                ];
                const fieldVal = (row, field) => {
                    if (field.type === 'text') return String(row[field.key] || '').trim();
                    if (field.type === 'percent') return Math.round(getPercentNum(row[field.key]));
                    return Math.round(toNum(row[field.key]));
                };
                const formatFieldVal = (row, field) => {
                    if (field.type === 'text') return String(row[field.key] || '').trim() || '—';
                    if (field.type === 'percent') return `${Math.round(getPercentNum(row[field.key]))}%`;
                    return formatNumberWithCommas(toNum(row[field.key]));
                };
                const identity = (row) => ({
                    trade: row.trade, subTrade: row.subTrade, lane: row.lane,
                    saleWeek: row.saleWeek, vvd: row.vvd, pol: row.pol, vessel: row.vessel,
                });

                const added = [];
                const removed = [];
                const changed = [];

                newByKey.forEach((newRow, key) => {
                    if (!oldByKey.has(key)) added.push(identity(newRow));
                });
                oldByKey.forEach((oldRow, key) => {
                    if (!newByKey.has(key)) {
                        removed.push(identity(oldRow));
                        return;
                    }
                    const newRow = newByKey.get(key);
                    const diffs = TRACKED_FIELDS
                        .filter(f => fieldVal(oldRow, f) !== fieldVal(newRow, f))
                        .map(f => ({ label: f.label, oldVal: formatFieldVal(oldRow, f), newVal: formatFieldVal(newRow, f) }));
                    if (diffs.length > 0) changed.push({ ...identity(newRow), diffs });
                });

                // Overall snapshot per dataset: Max Laden = sum of each distinct
                // lane's own max (the same by-lane-max-then-sum invariant as
                // laneAwareMaxLdn/the Analyze modal's Overall Snapshot, generalized
                // across the whole dataset with no Trade/SubTrade split); Laden =
                // straight sum. Booking count is the raw row count of that dataset
                // (not the matched-key count), so it reflects exactly what was
                // uploaded/loaded, including any rows that couldn't be matched.
                const overallSnapshot = (rows) => {
                    const byLane = {};
                    let ladenSum = 0;
                    rows.forEach(row => {
                        const lane = row.lane || '(blank)';
                        const v = toNum(row.maxLdn);
                        if (!(lane in byLane) || v > byLane[lane]) byLane[lane] = v;
                        ladenSum += toNum(row.ladenTeu);
                    });
                    const maxLdnSum = Object.values(byLane).reduce((s, v) => s + v, 0);
                    return {
                        maxLdn: maxLdnSum,
                        laden: ladenSum,
                        utilz: maxLdnSum > 0 ? Math.round((ladenSum / maxLdnSum) * 100) : 0,
                        bookingCount: rows.length,
                    };
                };

                return {
                    added, removed, changed,
                    oldSnapshot: overallSnapshot(oldRawRows),
                    newSnapshot: overallSnapshot(rawRows),
                };
            }, [rawRows, oldRawRows]);

            // "Analyze" button data (2026-08-14): summarizes how the currently-visible service
            // lane(s) (Booking Flash tab) or POL/port(s) (POL_Booking_Flash tab) are performing,
            // scoped to the last 4 distinct Sale Weeks present in the CURRENT filter set (not a
            // fixed calendar window -- if the user has already filtered to specific weeks, those
            // are what "last 4" is computed from). Both tabs use the same underlying booking
            // fields (maxLdn/ladenTeu/peakUtilRaw) -- only the *breakdown* dimension changes
            // (Lane vs POL), since POL is a within-lane loading-port breakdown of the same
            // bookings, not a separate metric. Per-group weekly aggregates: weekly Max Laden =
            // MAX across that group+week's rows (a capacity ceiling, not additive within one
            // group); weekly Laden = SUM (total booked that week); then each is averaged across
            // the group's available weeks (up to 4).
            //
            // The Overall Snapshot's capacity/laden/shortfall are DELIBERATELY always computed
            // from a by-LANE grouping, never from the display-breakdown grouping directly --
            // caught live: on POL_Booking_Flash, summing each POL card's own avgWklyMaxLdn
            // quadruple-counted a single lane's capacity (every port under the same lane repeats
            // that lane's own Max Laden, e.g. 4 ports x 3,718 = ~14,870 instead of the real
            // 3,718), since POL is a sub-division of one lane's capacity, not an independent
            // trunk. Summing distinct LANES' own max is valid (mirrors this app's existing
            // DAX-confirmed "sum of per-Lane max" pattern -- see laneAwareMaxLdn/Trade Summary's
            // Max Laden) since different lanes genuinely have independent capacity; summing
            // sub-divisions of the same lane is not. On the Booking Flash tab the breakdown IS
            // by Lane already, so this by-lane overall is identical to what summing the display
            // cards would have given -- no behavior change there, only the POL tab's overall
            // capacity is now correct.
            const serviceLaneAnalysis = useMemo(() => {
                if (activeTab !== 'detail' && activeTab !== 'pol_booking') return null;
                const groupKey = activeTab === 'pol_booking' ? 'pol' : 'lane';
                const groupLabel = activeTab === 'pol_booking' ? 'POL' : 'Lane';

                const weeksPresent = Array.from(new Set(
                    filteredRawRows.map(r => r.saleWeek).filter(w => w !== undefined && w !== null && String(w).trim() !== '')
                )).sort(compareSaleWeek);
                const last4Weeks = weeksPresent.slice(-4);
                if (last4Weeks.length === 0) return null;
                const weekSet = new Set(last4Weeks);
                const analysisRows = filteredRawRows.filter(r => weekSet.has(r.saleWeek));
                if (analysisRows.length === 0) return null;

                const numVal = (row, key) => parseFloat(String(row[key] ?? '').replace(/[,%()]/g, '')) || 0;

                // groupBy: aggregates analysisRows into weekly buckets keyed by (fieldKey, week),
                // then rolls each key's buckets up into a per-key average across its available
                // weeks. Used twice below with different fieldKeys -- once always on 'lane' (for
                // the Overall Snapshot) and once on whichever dimension this tab displays.
                const groupBy = (fieldKey) => {
                    const byKeyWeek = {};
                    analysisRows.forEach(row => {
                        const g = row[fieldKey] || '(blank)';
                        const w = row.saleWeek;
                        const bucketKey = `${g}|${w}`;
                        if (!byKeyWeek[bucketKey]) byKeyWeek[bucketKey] = { key: g, maxLdn: 0, laden: 0, peakUtilSum: 0, peakUtilCount: 0 };
                        const bucket = byKeyWeek[bucketKey];
                        bucket.maxLdn = Math.max(bucket.maxLdn, numVal(row, 'maxLdn'));
                        bucket.laden += numVal(row, 'ladenTeu');
                        bucket.peakUtilSum += numVal(row, 'peakUtilRaw') * 100;
                        bucket.peakUtilCount += 1;
                    });
                    const byKey = {};
                    Object.values(byKeyWeek).forEach(bucket => {
                        if (!byKey[bucket.key]) byKey[bucket.key] = [];
                        byKey[bucket.key].push(bucket);
                    });
                    return Object.entries(byKey).map(([key, weeks]) => {
                        const n = weeks.length;
                        const avgWklyMaxLdn = weeks.reduce((s, w) => s + w.maxLdn, 0) / n;
                        const avgWklyLaden = weeks.reduce((s, w) => s + w.laden, 0) / n;
                        const avgWklyShortfall = avgWklyLaden - avgWklyMaxLdn;
                        const avgUtilization = avgWklyMaxLdn > 0 ? (avgWklyLaden / avgWklyMaxLdn) * 100 : 0;
                        const avgPeakUtilization = weeks.reduce((s, w) => s + (w.peakUtilCount > 0 ? w.peakUtilSum / w.peakUtilCount : 0), 0) / n;
                        return { group: key, weekCount: n, avgWklyMaxLdn, avgWklyLaden, avgWklyShortfall, avgUtilization, avgPeakUtilization };
                    }).sort((a, b) => String(a.group).localeCompare(String(b.group)));
                };

                const groupSummaries = groupBy(groupKey);
                const laneSummaries = groupKey === 'lane' ? groupSummaries : groupBy('lane');

                const overallCapacity = laneSummaries.reduce((s, g) => s + g.avgWklyMaxLdn, 0);
                const overallLaden = laneSummaries.reduce((s, g) => s + g.avgWklyLaden, 0);
                const overallShortfall = overallLaden - overallCapacity;
                const overallUtilization = overallCapacity > 0 ? (overallLaden / overallCapacity) * 100 : 0;

                return {
                    groupLabel,
                    weekRange: last4Weeks.length > 1 ? `${last4Weeks[0]} to ${last4Weeks[last4Weeks.length - 1]}` : last4Weeks[0],
                    weekCount: last4Weeks.length,
                    groupCount: groupSummaries.length,
                    overall: { utilization: overallUtilization, capacity: overallCapacity, laden: overallLaden, shortfall: overallShortfall },
                    groups: groupSummaries
                };
            }, [activeTab, filteredRawRows]);

            // Used by Trade_Summary's Max Laden/Trunk Utilization dataFields (see their
            // comments for the confirmed-against-ground-truth reasoning): the real DAX is
            // "sum across each distinct Lane's own max", which a pivot with no Lane rowField
            // can't express via the generic max/rollupSumOfChildren machinery alone. ctx is a
            // tree node's accumulated {trade, subTrade?} context (from PivotTableViewer's
            // row.context); cKey is either a specific Sale Week or the literal 'Total' column.
            const laneAwareMaxLdn = (ctx, cKey) => {
                const matching = filteredRawRows.filter(r =>
                    (!ctx.trade || r.trade === ctx.trade) &&
                    (!ctx.subTrade || r.subTrade === ctx.subTrade) &&
                    (cKey === 'Total' || r.saleWeek === cKey)
                );
                const byLane = {};
                matching.forEach(r => {
                    const lane = r.lane || '(blank)';
                    const v = toNum(r.maxLdn);
                    if (!(lane in byLane) || v > byLane[lane]) byLane[lane] = v;
                });
                return Object.values(byLane).reduce((s, v) => s + v, 0);
            };

            // Static reference seed data from the Sector_Data sheet (not derived from the uploaded file).
            const sectorDataMapped = useMemo(() => {
                // Dry/Reefer split (DRY_REEFER_SECTOR_SEED) is keyed at Lane+PODSec, summed
                // across its VVD-level and aggregate-level rows for that pair (the two aren't
                // clearly additive per the source sheet's structure -- flagged as a caveat,
                // not silently trusted as exact). null when this Lane+PODSec has no entry at
                // all in the (very small, 3-lane) source table, so "no data" is distinguishable
                // from a genuine zero.
                const dryReeferByLanePod = {};
                DRY_REEFER_SECTOR_SEED.forEach(r => {
                    const key = `${r.lane}|${r.podSec}`;
                    if (!dryReeferByLanePod[key]) dryReeferByLanePod[key] = { drySec: 0, rfrSec: 0 };
                    dryReeferByLanePod[key].drySec += r.drySec;
                    dryReeferByLanePod[key].rfrSec += r.rfrSec;
                });
                return SECTOR_DATA_SEED.map(r => {
                    const lane = r['Vessel 1st Lane'];
                    const podSec = r['POD Sec'];
                    const dr = dryReeferByLanePod[`${lane}|${podSec}`];
                    return {
                        trade: r['Vessel 1st Trade'],
                        subTrade: r['Vessel 1st Sub Trade'],
                        lane,
                        podSec,
                        sectorAlloc: r['MCT Sector Allocation'],
                        avgBooking: r['Average Booking'],
                        openSpace: r['Sector Open Space'],
                        drySec: dr ? dr.drySec : null,
                        rfrSec: dr ? dr.rfrSec : null,
                        portExcluded: PORT_EXCLUDE_KEYS.has(`${lane}|${podSec}`)
                    };
                });
            }, []);

            // Sector_Summary's "Average Max Laden vs Booking" pivot in the reference Excel is
            // scoped by its own report filter (Route Date Past 4 Week Flag = Y, see
            // past4WeekFlag above) -- independent of whatever Sale Week slicer buttons the user
            // has selected, so this filters filteredRawRows (which already reflects the other
            // slicers) down further, on top of them rather than instead of them.
            const past4WeekRows = useMemo(() => {
                return filteredRawRows.filter(row => String(row.past4WeekFlag || '').trim().toUpperCase() === 'Y');
            }, [filteredRawRows]);

            // KPI summary strip at the top of the Sector_Summary tab (2026-08-14, purely a
            // visual addition -- not on the reference sheet) -- mirrors the "Average Max Laden
            // vs Booking" pivot's own Grand Total math below.
            //
            // Real bug found 2026-08-17 via user report ("these numbers seem very wrong" --
            // +17,476 / 350% shown here): this originally took a FLAT max of tsAvgMaxLdn across
            // every row regardless of lane -- the exact same bug just fixed on the pivot itself
            // below (see that dataField's comment for the full story and the ground-truth sum
            // check: 59,990 = every distinct lane's own max, confirmed by hand). This card must
            // match the pivot's own Grand Total exactly since they describe the same number, so
            // it needs the identical fix: group by lane, take each lane's own max, sum those.
            const sectorSummaryKpis = useMemo(() => {
                const avgBkgSum = past4WeekRows.reduce((s, r) => s + toNum(r.tsAvgBooking), 0);
                const maxLdnByLane = {};
                past4WeekRows.forEach(r => {
                    const lane = r.lane || '(blank)';
                    const v = toNum(r.tsAvgMaxLdn);
                    if (!(lane in maxLdnByLane) || v > maxLdnByLane[lane]) maxLdnByLane[lane] = v;
                });
                const avgMaxLdnSum = Object.values(maxLdnByLane).reduce((s, v) => s + v, 0);
                const sectorAllocSum = sectorDataMapped.reduce((s, r) => s + (parseFloat(r.sectorAlloc) || 0), 0);
                const openSpaceSum = sectorDataMapped.reduce((s, r) => s + (parseFloat(r.openSpace) || 0), 0);
                return {
                    avgMaxVsBkg: avgBkgSum - avgMaxLdnSum,
                    avgUtilz: avgMaxLdnSum > 0 ? (avgBkgSum / avgMaxLdnSum) * 100 : 0,
                    sectorAllocSum,
                    openSpaceSum
                };
            }, [past4WeekRows, sectorDataMapped]);


            const sectorRows = useMemo(() => {
                const parsed = [];
                filteredRawRows.forEach(row => {
                    if (row.sectorRemarks) {
                        const parts = String(row.sectorRemarks).split('/');
                        parts.forEach(p => {
                            const match = p.match(/([A-Z]+):\s*([\d,]+)\s*-\s*([\d,]+)/);
                            if (match) {
                                parsed.push({
                                    ...row,
                                    podSector: match[1],
                                    sectorAlloc: parseFloat(match[2].replace(/,/g, '')),
                                    avgBooking: parseFloat(match[3].replace(/,/g, ''))
                                });
                            }
                        });
                    }
                });
                return parsed;
            }, [filteredRawRows]);

            const tableData = useMemo(() => {
                const aggregatedMap = {};
                filteredRawRows.forEach(row => {
                    const key = `${row.trade}-${row.subTrade}-${row.lane}-${row.saleWeek}-${row.vvd}-${row.vessel}`;
                    if (!row.vvd && !row.vessel) {
                        aggregatedMap[`uid-${row.id}`] = row;
                        return;
                    }

                    if (!aggregatedMap[key]) {
                        aggregatedMap[key] = { ...row };
                        const numerics = ['curLaden', 'quote', 'shortfall', 'rfrBkgPlugs', 'rfrBkgTtl', 'inlandAct', 'inlandNoAct', 'inlandTotal', 'portAct', 'portNoAct', 'portTotal', 'dgTeu', 'tpt', 'tat', 'lwt', 'lnt', 'imt', 'let', 'ladenTeu', 'activeTotalTeu'];
                        numerics.forEach(n => aggregatedMap[key][n] = toNum(aggregatedMap[key][n]));

                        const maxes = ['maxLdn', 'bsaTeu', 'bsaWgt', 'rfrBsaPlugs', 'rfrMaxLdn'];
                        maxes.forEach(n => aggregatedMap[key][n] = toNum(aggregatedMap[key][n]));

                        aggregatedMap[key].curUtilRaw = getPercentNum(row.curUtilRaw);
                    } else {
                        const numerics = ['curLaden', 'quote', 'rfrBkgPlugs', 'rfrBkgTtl', 'inlandAct', 'inlandNoAct', 'inlandTotal', 'portAct', 'portNoAct', 'portTotal', 'dgTeu', 'tpt', 'tat', 'lwt', 'lnt', 'imt', 'let', 'ladenTeu', 'activeTotalTeu'];
                        numerics.forEach(n => {
                            aggregatedMap[key][n] += toNum(row[n]);
                        });

                        const maxes = ['maxLdn', 'bsaTeu', 'bsaWgt', 'rfrBsaPlugs', 'rfrMaxLdn'];
                        maxes.forEach(n => {
                            aggregatedMap[key][n] = Math.max(aggregatedMap[key][n], toNum(row[n]));
                        });
                        
                        aggregatedMap[key].curUtilRaw = Math.max(aggregatedMap[key].curUtilRaw, getPercentNum(row.curUtilRaw));
                    }
                });

                return Object.values(aggregatedMap).map(row => {
                    row.standby = formatPercent(row.standbyRaw);
                    row.peakUtil = formatPercent(row.peakUtilRaw);
                    row.rfrUtiliz = formatPercent(row.rfrUtilizRaw);
                    
                    // Per confirmed DAX (Manage Measures screenshot, 2026-08-14): "Activity vs
                    // Booking Utilz" = DIVIDE(SUM(Measures Active total TEU), Sum of Measures
                    // Laden TEU, 0); "Activity vs Max Laden" = SUM(Measures Active total TEU) -
                    // Max of MCT Max Laden Update. Both use activeTotalTeu/ladenTeu directly, NOT
                    // the manual inlandAct+portAct/inlandTotal+portTotal sums previously used here
                    // (those were never actually the right source columns per the DAX text).
                    const activeTotalTeuNum = toNum(row.activeTotalTeu);
                    const ladenTeuNum = toNum(row.ladenTeu);
                    row.actVsBkgUtilzRaw = ladenTeuNum > 0 ? (activeTotalTeuNum / ladenTeuNum) : 0;
                    row.actVsBkgUtilz = formatPercent(row.actVsBkgUtilzRaw);

                    row.actVsMaxLdnRaw = activeTotalTeuNum - toNum(row.maxLdn);
                    const formattedMaxLdnRaw = formatNumberWithCommas(row.actVsMaxLdnRaw);
                    row.actVsMaxLdn = (row.actVsMaxLdnRaw > 0 ? '+' : '') + formattedMaxLdnRaw;
                    row.actVsMaxLdnStyle = row.actVsMaxLdnRaw > 0 ? { color: 'red' } : {};

                    const parsedMax = parseFloat(row.maxLdn);
                    row.maxLdn = (parsedMax === 0 || isNaN(parsedMax)) ? '' : formatNumberWithCommas(row.maxLdn);

                    row.curUtil = `${Math.round(row.curUtilRaw || 0)}%`;

                    // Native CF (Booking_Flash!N13:O47): ($O-$N)>10% -> red fill on both Peak
                    // Utiliz % (N/row.peakUtil) and Current Laden Utiliz % (O/row.curUtil).
                    // row.curUtilRaw is already on the 0-100 percent-point scale (converted via
                    // getPercentNum above); normalize row.peakUtilRaw (still fractional, see the
                    // getPercentNum comment near its definition) the same way before comparing.
                    row.utilGapFlagged = isUtilGapFlagged(row.curUtilRaw, getPercentNum(row.peakUtilRaw));
                    row.utilGapStyle = row.utilGapFlagged ? { backgroundColor: '#dc2626', color: '#fff', fontWeight: 'bold' } : {};

                    // shortfallNegative captured from the raw pre-format number (matching the
                    // reference Excel's red-for-negative rule, see negativeValueClass) since
                    // row.shortfall itself becomes the already-"(-N)"-formatted display string
                    // right below. Per confirmed DAX: "Max LDN vs BKG (Shortfall)" = [Sum of
                    // Measures Laden TEU] - [Max of MCT Max Laden Update] -- uses ladenTeu (the
                    // same column Trunk Utilization already correctly sums), NOT curLaden
                    // ("Measures POL Laden TEU", a different raw column -- see the ladenTeu/
                    // curLaden split documented near their getVal aliases).
                    if (row.maxLdn !== '' && row.ladenTeu !== undefined) {
                        const rawMaxLdn = toNum(row.maxLdn);
                        const calculatedShortfall = toNum(row.ladenTeu) - rawMaxLdn;
                        row.shortfallNegative = calculatedShortfall < 0;
                        row.shortfall = formatAccountingNumber(calculatedShortfall);
                    } else {
                        row.shortfallNegative = toNum(row.shortfall) < 0;
                        row.shortfall = formatAccountingNumber(row.shortfall);
                    }
                    
                    row.curLaden = formatNumberWithCommas(row.curLaden);
                    row.quote = formatNumberWithCommas(row.quote);
                    row.bsaTeu = formatNumberWithCommas(row.bsaTeu);
                    row.bsaWgt = formatNumberWithCommas(row.bsaWgt);
                    
                    if (String(row.vvd).trim().toUpperCase() === 'VMS') {
                        const fieldsToKeep = ['id', 'trade', 'subTrade', 'lane', 'saleWeek', 'pic', 'vvd'];
                        Object.keys(row).forEach(key => {
                            if (!fieldsToKeep.includes(key)) {
                                // Object-valued fields (e.g. actVsMaxLdnStyle/utilGapStyle, both set as
                                // {} or a style object above) must wipe to {} not '' -- passing a string
                                // to a React `style` prop throws ("style prop expects a mapping ... not
                                // a string"), which crashes the whole Detail View render on any real
                                // dataset containing a VMS row.
                                row[key] = (row[key] && typeof row[key] === 'object') ? {} : '';
                            }
                        });
                    }

                    return row;
                });
            }, [filteredRawRows]);

            const processedData = useMemo(() => {
                let filtered = [...tableData]; // Already filtered!
                
                filtered.sort((a, b) => {
                    if (a.trade !== b.trade) return String(a.trade || '').localeCompare(String(b.trade || ''));
                    if (a.subTrade !== b.subTrade) return String(a.subTrade || '').localeCompare(String(b.subTrade || ''));
                    if (a.lane !== b.lane) return String(a.lane || '').localeCompare(String(b.lane || ''));
                    if (a.saleWeek !== b.saleWeek) return compareSaleWeek(a.saleWeek, b.saleWeek);
                    return String(a.vessel || '').localeCompare(String(b.vessel || ''));
                });

                const withBlanks = [];
                for (let i = 0; i < filtered.length; i++) {
                    withBlanks.push(filtered[i]);
                    const isLastInLane = i === filtered.length - 1 || filtered[i].lane !== filtered[i+1].lane;
                    if (isLastInLane) {
                        withBlanks.push({
                            id: `blank-${filtered[i].id || i}`,
                            isBlankRow: true,
                            trade: filtered[i].trade,
                            subTrade: filtered[i].subTrade,
                            lane: filtered[i].lane
                        });
                    }
                }

                const spanned = withBlanks.map(row => ({
                    ...row,
                    showTrade: true, tradeSpan: 1,
                    showSub: true, subSpan: 1,
                    showLane: true, laneSpan: 1
                }));

                for (let i = 0; i < spanned.length; i++) {
                    if (spanned[i].showTrade) {
                        let spanCount = 1;
                        for (let j = i + 1; j < spanned.length; j++) {
                            if (spanned[j].trade === spanned[i].trade) {
                                spanCount++;
                                spanned[j].showTrade = false;
                            } else break;
                        }
                        spanned[i].tradeSpan = spanCount;
                    }

                    if (spanned[i].showSub) {
                        let spanCount = 1;
                        for (let j = i + 1; j < spanned.length; j++) {
                            if (spanned[j].trade === spanned[i].trade && spanned[j].subTrade === spanned[i].subTrade) {
                                spanCount++;
                                spanned[j].showSub = false;
                            } else break;
                        }
                        spanned[i].subSpan = spanCount;
                    }

                    if (spanned[i].showLane) {
                        let spanCount = 1;
                        for (let j = i + 1; j < spanned.length; j++) {
                            if (spanned[j].trade === spanned[i].trade &&
                                spanned[j].subTrade === spanned[i].subTrade &&
                                spanned[j].lane === spanned[i].lane) {
                                spanCount++;
                                spanned[j].showLane = false;
                            } else break;
                        }
                        spanned[i].laneSpan = spanCount;
                    }
                }
                return spanned;
            }, [tableData]);

            // select-none removed app-wide 2026-08-14 (was blocking users from copying any
            // table text, which is a real need -- e.g. pasting a VVD or lane code
            // elsewhere). Buttons/slicers don't need it explicitly: browsers don't select
            // button text on a normal click by default, and the column-resize drag handlers
            // already call e.preventDefault() on their own mousedown (see makeColResizer),
            // which independently suppresses the text-selection drag browsers would
            // otherwise start.
            return (
                <div className="min-h-screen bg-[#f3f3f3] p-4 font-sans text-black">
                    <input type="file" accept=".xlsx, .xls, .csv" ref={fileInputRef} onChange={handleFileUpload} className="hidden" />
                    <input type="file" accept=".xlsx, .xls, .csv" ref={oldFileInputRef} onChange={handleOldFileUpload} className="hidden" />

                    {parseError && (
                        <div className="bg-red-100 border-2 border-red-500 text-red-800 font-bold px-4 py-3 rounded mb-4 mx-4 shadow-sm" role="alert">
                            {parseError}
                        </div>
                    )}

                    {/* Only shown once data is already loaded (autoFetchError from the
                        initial load, before any data exists, is instead folded into the
                        dropzone copy below) -- a failed background/manual refresh check
                        shouldn't block the view someone's already looking at. */}
                    {autoFetchError && rawRows.length > 0 && (
                        <div className="bg-yellow-50 border-2 border-yellow-400 text-yellow-800 font-semibold px-4 py-2 rounded mb-4 mx-4 shadow-sm text-sm" role="alert">
                            {autoFetchError}
                        </div>
                    )}

                    {/* New-data-detected banner (2026-08-18): the background poll never
                        swaps rawRows on its own -- it only sets newDataAvailable and
                        stashes the fetched CSV in pendingCsvTextRef, so a user mid-filter
                        never has data change under them without choosing to. */}
                    {newDataAvailable && rawRows.length > 0 && (
                        <div className="flex items-center justify-between gap-3 bg-blue-50 border-2 border-blue-400 text-blue-900 font-semibold px-4 py-2 rounded mb-4 mx-4 shadow-sm text-sm" role="status">
                            <span>New data is available from the underlying Sheet.</span>
                            <button onClick={applyPendingUpdate} className="bg-blue-700 text-white px-3 py-1 rounded shadow-sm hover:bg-blue-800 transition-colors text-sm font-bold cursor-pointer whitespace-nowrap">
                                Refresh
                            </button>
                        </div>
                    )}

                    {/* Bug found via live testing 2026-08-17: this used to gate on
                        tableData.length === 0 -- but tableData is Detail View's own
                        filteredRawRows-derived, per-tab processed data, so ANY slicer
                        combination that happens to match zero rows (e.g. an incompatible
                        Sub Trade + Lane pair) made the *entire app* -- every tab, including
                        Sector_Summary's pivots that don't even read tableData -- fall back to
                        this "please upload a file" screen, even though a file was already
                        loaded. Detail View already has its own proper empty-state fallback
                        ("No data matches the selected filters", see processedData.length===0
                        below) that this bug made unreachable. Gate on rawRows (whether a file
                        was ever uploaded) instead, which is the actually-correct signal. */}
                    {rawRows.length === 0 ? (
                        <div
                            onDrop={handleDrop}
                            onDragOver={(e) => { e.preventDefault(); setIsDragging(true); }}
                            onDragLeave={() => setIsDragging(false)}
                            className={`flex flex-col items-center justify-center h-[80vh] border-4 border-dashed rounded-lg shadow-sm p-10 text-center m-4 transition-colors ${isDragging ? 'border-blue-600 bg-blue-50' : 'border-gray-400 bg-white'}`}
                        >
                            <OneLogo className="h-24 w-auto mb-4" />
                            <h1 className="text-4xl font-extrabold italic tracking-tighter text-[#E5007D] mb-4" style={{ fontFamily: 'Arial, sans-serif' }}>
                                Booking Flash Report NA
                            </h1>
                            <p className="text-gray-600 mb-2 text-lg max-w-lg">
                                {isCsvSourceConfigured()
                                    ? (autoFetchError || 'Loading the latest data automatically...')
                                    : 'Please upload the underlying data file to populate and generate the pivot table.'}
                            </p>
                            {isCsvSourceConfigured() && autoFetchError && (
                                <p className="text-gray-500 mb-6 text-sm max-w-lg">
                                    You can also upload the file manually below.
                                </p>
                            )}
                            <div className="flex gap-3">
                                <button onClick={() => fileInputRef.current?.click()} className="bg-[#E5007D] text-white px-8 py-4 rounded shadow-md hover:bg-blue-800 transition-colors text-lg font-bold cursor-pointer">
                                    Upload Underlying Data
                                </button>
                                {isCsvSourceConfigured() && autoFetchError && (
                                    <button onClick={handleManualRefresh} disabled={isCheckingForUpdates} className="bg-white text-[#E5007D] border-2 border-[#E5007D] px-8 py-4 rounded shadow-md hover:bg-blue-50 transition-colors text-lg font-bold cursor-pointer disabled:opacity-50">
                                        {isCheckingForUpdates ? 'Checking...' : 'Retry'}
                                    </button>
                                )}
                            </div>
                        </div>
                    ) : (
                        <>
                            <div className="flex flex-wrap justify-between items-end gap-2 mb-2 border-b-2 border-gray-300 pb-1">
                                <div className="flex items-center gap-4">
                                    <OneLogo className="h-11 w-auto" />
                                    <h1 className="text-3xl font-extrabold italic tracking-tighter" style={{ fontFamily: 'Arial, sans-serif' }}>
                                        Booking Flash Report NA
                                    </h1>
                                </div>
                                <div className="flex items-center gap-3 text-sm font-bold pb-1">
                                    <span>
                                        Last Refresh: <span className="text-blue-700 italic">{lastRefresh ? `${lastRefresh.toLocaleDateString()} ${lastRefresh.toLocaleTimeString()}` : '—'}</span>
                                    </span>
                                    {isCsvSourceConfigured() && (
                                        <button onClick={handleManualRefresh} disabled={isCheckingForUpdates} title="Re-fetch the latest data from the Sheet now" className="text-xs font-bold text-[#E5007D] border border-[#E5007D] rounded px-2 py-1 hover:bg-blue-50 transition-colors cursor-pointer disabled:opacity-50 whitespace-nowrap">
                                            {isCheckingForUpdates ? 'Checking...' : 'Refresh Now'}
                                        </button>
                                    )}
                                    <button onClick={() => fileInputRef.current?.click()} title="Upload a file manually instead" className="text-xs font-bold text-gray-500 border border-gray-400 rounded px-2 py-1 hover:bg-gray-100 transition-colors cursor-pointer whitespace-nowrap">
                                        Upload File
                                    </button>
                                </div>
                            </div>

                            <div className="flex flex-wrap gap-2 mb-4 items-stretch">
                                {/* Restacked 2026-08-14 into a single flex-wrap flow (was 5 hand-laid-out
                                    rows, each a fixed-width label + its own full-width box even for
                                    short lists like Coast's 2 buttons) so short slicers (Coast, Sub
                                    Trade) share a row with their neighbors and the panel only grows
                                    vertically where a slicer genuinely needs it (Lane/Yard's long
                                    button lists). Also dropped the decorative ListFilterIcon/FilterIcon
                                    pair that sat in every slicer's corner -- confirmed via code read
                                    they had no onClick/behavior at all, so they were a false
                                    affordance; removing them also reclaims the vertical space that
                                    absolute-positioning them above each box used to reserve. */}
                                <div className="flex-1 bg-[#e7e6e6] border-2 border-black p-2 flex flex-col gap-2 shadow-sm rounded-sm">
                                    <div className="flex justify-end">
                                        <button onClick={clearSlicers} className="bg-gray-700 text-white px-2 py-1 text-xs font-bold rounded-sm hover:bg-gray-900 transition-colors cursor-pointer">Clear Filters</button>
                                    </div>
                                    <div className="flex flex-wrap gap-x-4 gap-y-2">
                                        <div className="flex items-start">
                                            <span className="text-sm font-bold mr-2 w-16 mt-1">Sub Trade</span>
                                            <div className="flex flex-wrap bg-[#d9d9d9] p-1 border border-gray-300 rounded-sm">
                                                {['AW', 'LN', 'PN', 'PS', 'TA'].map(trade => (
                                                    <SlicerBtn key={trade} bgClass="bg-[#a9d08e]" extraClass="w-[45px]" isSelected={selectedSubTrades.includes(trade)} isFilterActive={selectedSubTrades.length > 0} onClick={() => toggleFilter(setSelectedSubTrades, trade)}>{trade}</SlicerBtn>
                                                ))}
                                            </div>
                                        </div>

                                        <div className="flex items-start">
                                            <span className="text-sm font-bold mr-2 w-12 mt-1">Coast</span>
                                            <div className="flex flex-wrap bg-[#d9d9d9] p-1 border border-gray-300 rounded-sm">
                                                {['WC', 'EC'].map(c => (
                                                    <SlicerBtn key={c} bgClass="bg-[#c00000]" isSelected={selectedCoasts.includes(c)} isFilterActive={selectedCoasts.length > 0} onClick={() => toggleFilter(setSelectedCoasts, c)}>{c}</SlicerBtn>
                                                ))}
                                            </div>
                                        </div>

                                        <div className="flex items-start">
                                            <span className="text-sm font-bold mr-2 w-20 mt-1">SPC Analyst</span>
                                            <div className="flex flex-wrap bg-[#d9d9d9] p-1 border border-gray-300 rounded-sm">
                                                {['Evan', 'Joe', 'Kysa', 'Lani', 'Peter', 'Resid', 'Ryan H', 'Ryan T', 'TBA'].map(a => (
                                                    <SlicerBtn key={a} bgClass="bg-[#ed7d31]" extraClass="w-[65px]" isSelected={selectedAnalysts.includes(a)} isFilterActive={selectedAnalysts.length > 0} onClick={() => toggleFilter(setSelectedAnalysts, a)}>{a}</SlicerBtn>
                                                ))}
                                            </div>
                                        </div>

                                        <div className="flex items-start">
                                            <span className="text-sm font-bold mr-2 w-20 mt-1">Sale Week</span>
                                            <div className="flex flex-wrap bg-[#d9d9d9] p-1 border border-gray-300 rounded-sm">
                                                {saleWeekOptions.map(week => (
                                                    <SlicerBtn key={week} bgClass="bg-[#555555]" extraClass="w-[75px] shrink-0" isSelected={selectedSaleWeeks.includes(week)} isFilterActive={selectedSaleWeeks.length > 0} onClick={() => toggleFilter(setSelectedSaleWeeks, week)}>{week}</SlicerBtn>
                                                ))}
                                            </div>
                                        </div>

                                        <div className="flex items-start w-full">
                                            <span className="text-sm font-bold mr-2 w-20 mt-1">Lane</span>
                                            <div className="flex flex-wrap bg-[#d9d9d9] p-1 border border-gray-300 rounded-sm">
                                                {['AL5', 'AN2', 'ANG', 'AT1', 'AT3', 'AT4', 'EC1', 'EC2', 'EC3', 'EC4', 'EMA', 'FLX', 'FP2', 'MAR', 'MS2', 'PN1', 'PN3', 'PS1', 'PS3', 'PS4', 'PS6', 'PS7', 'PS8', 'VSE', 'WIN'].map(lane => (
                                                    <SlicerBtn key={lane} bgClass="bg-[#E5007D]" extraClass="w-[45px]" isSelected={selectedLanes.includes(lane)} isFilterActive={selectedLanes.length > 0} onClick={() => toggleFilter(setSelectedLanes, lane)}>{lane}</SlicerBtn>
                                                ))}
                                            </div>
                                        </div>

                                        {availableYards.length > 0 && (
                                            <div className="flex items-start w-full">
                                                <span className="text-sm font-bold mr-2 w-20 mt-1">Yard</span>
                                                <div className="flex flex-wrap bg-[#d9d9d9] p-1 border border-gray-300 rounded-sm">
                                                    {availableYards.map(yard => (
                                                        <SlicerBtn key={yard} bgClass="bg-[#ed7d31]" extraClass="w-[75px]" isSelected={selectedYards.includes(yard)} isFilterActive={selectedYards.length > 0} onClick={() => toggleFilter(setSelectedYards, yard)}>{yard}</SlicerBtn>
                                                    ))}
                                                </div>
                                            </div>
                                        )}
                                    </div>
                                </div>

                                <div className="flex flex-col gap-2">
                                    {/* Different tabs show different toggle panels (2026-08-14) -- POL_Booking_Flash
                                        only has 5 own toggleable column groups per the reference Excel's
                                        VBA (Toggle_POL_Reefer/Act/ETA/Operation macros + the shared
                                        ToggleVco_Macro), while Booking Flash (the flat Detail View table)
                                        keeps its full original set. Toggle_Trade/Toggle_DG_Macro (Trade
                                        Breakdown/DG Volume) were confirmed via direct xlsx inspection to
                                        belong only to the Booking_Flash sheet, not POL_Booking_Flash, so

                                            const rowStatusBadge = isVMS ? '[VMS] ' : isAPOnly ? '[AP Only] ' : isAPFrozen ? '[AP Frozen] ' : '';

                                            return (
                                                <tr key={row.id || index}>
                                                    {row.showTrade && <td rowSpan={row.tradeSpan} className="border border-gray-400 font-bold bg-white align-top pt-1.5">{row.trade}</td>}
                                                    {row.showSub && <td rowSpan={row.subSpan} className="border border-gray-400 font-bold bg-[#e2efda] align-top pt-1.5">{row.subTrade}</td>}
                                                    {row.showLane && <td rowSpan={row.laneSpan} className="border border-gray-400 font-bold bg-[#bdd7ee] text-[#2f5597] align-top pt-1.5">{row.lane}</td>}

                                                    <td className={`border border-gray-400 font-bold ${getBg('bg-white', true)}`}>{rowStatusBadge}{row.saleWeek}</td>
                                                    <td className={`border border-gray-400 ${getBg('bg-white', true)}`}>{row.pic}</td>
                                                    <td className={`border border-gray-400 ${getBg('bg-white', true)}`}>{row.cutoff}</td>
                                                    <td className={`border border-gray-400 ${getBg('bg-white', true)}`}>{row.etd}</td>
                                                    <td className={`border border-gray-400 ${getBg('bg-white', true)}`}>{row.statusDisplay}</td>
                                                    <td className={`border border-gray-400 font-bold text-black ${getBg('bg-[#d9e1f2]', true)}`}>{row.vvd}</td>
                                                    <td className={`border border-gray-400 font-bold text-left px-2 truncate text-[#2f5597] max-w-[140px] ${getBg('bg-[#d9e1f2]', true)}`}>{row.vessel}</td>
                                                    <td className={`border border-gray-400 font-bold ${getBg('bg-white', true)}`}>{row.maxLdn}</td>
                                                    <td className={`border border-gray-400 ${getBg('bg-white', true)}`}>{row.standby}</td>
                                                    <td className={`border border-gray-400 font-bold ${getBg('bg-[#d9e1f2]', true)}`}>{row.curLaden}</td>
                                                    <td className={`border border-gray-400 ${getBg('bg-white', true)}`} style={row.utilGapFlagged && !isVMS && !isAPOnly && !isAPFrozen ? row.utilGapStyle : {}} title={row.utilGapFlagged && !isVMS && !isAPOnly && !isAPFrozen ? 'Utilization increased by 10% or greater since the prior business day.' : undefined}>{row.peakUtil}</td>
                                                    <td className={`border border-gray-400 font-bold text-black ${getBg('bg-[#FDE9D9]', true)}`} style={row.utilGapFlagged && !isVMS && !isAPOnly && !isAPFrozen ? row.utilGapStyle : {}} title={row.utilGapFlagged && !isVMS && !isAPOnly && !isAPFrozen ? 'Utilization increased by 10% or greater since the prior business day.' : undefined}>{row.curUtil}</td>
                                                    <td className={`border border-gray-400 ${getBg('bg-white', true)} ${row.shortfallNegative ? 'text-red-600' : ''}`}>{row.shortfall}</td>
                                                    <td className={`border border-gray-400 font-bold text-[#974706] ${getBg('bg-white', true)}`}>{row.quote}</td>
                                                    <td className={`border border-gray-400 text-[#2f5597] ${getBg('bg-white', true)}`}>{row.broken}</td>
                                                    {!bsaHidden && (
                                                        <>
                                                            <td className={`border border-gray-400 ${getBg('bg-white', true)}`}>{row.bsaTeu}</td>
                                                            <td className={`border border-gray-400 ${getBg('bg-white', true)}`}>{row.bsaWgt}</td>
                                                        </>
                                                    )}
                                                    {!reeferHidden && (
                                                        <>
                                                            <td className={`border border-gray-400 ${getBg('bg-white', true)}`}>{row.rfrBsaPlugs}</td>
                                                            <td className={`border border-gray-400 ${getBg('bg-white', true)}`}>{row.rfrBkgPlugs}</td>
                                                            <td className={`border border-gray-400 ${getBg('bg-white', true)}`}>{row.rfrMaxLdn}</td>
                                                            <td className={`border border-gray-400 ${getBg('bg-white', true)}`}>{row.rfrBkgTtl}</td>
                                                            <td className={`border border-gray-400 ${getBg('bg-white', true)}`}>{row.rfrUtiliz}</td>
                                                        </>
                                                    )}
                                                    {!activityHidden && (
                                                        <>
                                                            <td className={`border border-gray-400 ${getBg('bg-white', true)}`}>{row.actVsBkgUtilz}</td>
                                                            <td className={`border border-gray-400 ${getBg('bg-white', true)}`} style={row.actVsMaxLdnStyle}>{row.actVsMaxLdn}</td>
                                                            <td className={`border border-gray-400 ${getBg('bg-white', true)}`}>{row.inlandAct}</td>
                                                            <td className={`border border-gray-400 ${getBg('bg-white', true)}`}>{row.inlandNoAct}</td>
                                                            <td className={`border border-gray-400 ${getBg('bg-white', true)}`}>{row.inlandTotal}</td>
                                                            <td className={`border border-gray-400 ${getBg('bg-white', true)}`}>{row.portAct}</td>
                                                            <td className={`border border-gray-400 ${getBg('bg-white', true)}`}>{row.portNoAct}</td>
                                                            <td className={`border border-gray-400 ${getBg('bg-white', true)}`}>{row.portTotal}</td>
                                                        </>
                                                    )}
                                                    {!opIssuesHidden && (
                                                        <td className={`border border-gray-400 text-left px-2 truncate max-w-[150px] ${getBg('bg-white', false)}`} style={String(row.opIssues || '').trim().toUpperCase().startsWith('**ALERT') ? { color: '#FF0000', fontWeight: 'bold' } : {}}>{renderAsteriskHide(row.opIssues)}</td>
                                                    )}
                                                    {!sectorAllocHidden && (
                                                        <>
                                                            {/* Per the real "Sector Allocation" DAX measure (CONCATENATEX of
                                                                distinct Sector Remarks), the Detail View's rich-text Sector
                                                                Allocation column is sourced from sectorRemarks, not the numeric
                                                                secAlloc field (which stays bound to MCT Sector Allocation for
                                                                the separate Sector_Summary pivot's numeric sum). */}
                                                            <td className={`border border-gray-400 text-left px-2 ${getBg('bg-white', false)}`}>{renderSecAlloc(row.sectorRemarks)}</td>
                                                            <td className={`border border-gray-400 ${getBg('bg-white', false)}`}>{renderSecAlloc(row.sgsinDryVsRfr)}</td>
                                                        </>
                                                    )}
                                                    {!rotationHidden && (
                                                        <>
                                                            <td className={`border border-gray-400 truncate max-w-[150px] ${getBg('bg-white', false)}`}>{renderAsteriskHide(row.proformaRot)}</td>
                                                            <td className={`border border-gray-400 truncate max-w-[150px] ${getBg('bg-white', false)}`}>{renderAsteriskHide(row.actualRot)}</td>
                                                        </>
                                                    )}
                                                    {!apStatusHidden && (
                                                        <td className={`border border-gray-400 ${getBg('bg-white', false)}`}>{renderAsteriskHide(row.apStatus)}</td>
                                                    )}
                                                    {!vcoHidden && (
                                                        <td className={`border border-gray-400 ${getBg('bg-white', false)}`}>{row.vco}</td>
                                                    )}
                                                    {!tradeBreakdownHidden && (
                                                        <>
                                                            <td className={`border border-gray-400 ${getBg('bg-white', false)}`}>{row.tpt}</td>
                                                            <td className={`border border-gray-400 ${getBg('bg-white', false)}`}>{row.tat}</td>
                                                            <td className={`border border-gray-400 ${getBg('bg-white', false)}`}>{row.lwt}</td>
                                                            <td className={`border border-gray-400 ${getBg('bg-white', false)}`}>{row.lnt}</td>
                                                            <td className={`border border-gray-400 ${getBg('bg-white', false)}`}>{row.imt}</td>
                                                            <td className={`border border-gray-400 ${getBg('bg-white', false)}`}>{row.let}</td>
                                                        </>
                                                    )}
                                                    {!dgVolumeHidden && (
                                                        <td className={`border border-gray-400 ${getBg('bg-white', false)}`}>{row.dgTeu}</td>
                                                    )}

                                                    {!remarksHidden && (
                                                        <td className="border border-gray-400 bg-white text-left px-2 truncate max-w-xs">{renderAsteriskHide(row.remarks)}</td>
                                                    )}
                                                </tr>
                                            );
                                        })}
                                        
                                        {processedData.length === 0 && (
                                            <tr>
                                                <td colSpan={detailNoDataColSpan} className="p-8 text-center text-gray-500 font-semibold bg-white border border-gray-400">
                                                    No data matches the selected filters.
                                                </td>
                                            </tr>
                                        )}
                                    </tbody>
                                </table>
                            </div>
                            </>
                                                    )}

                            {activeTab === 'compare' && (
                                <div className="bg-white border-2 border-black rounded-lg shadow-md p-4">
                                    <h2 className="text-2xl font-extrabold text-[#E5007D] mb-1">📊 Compare</h2>
                                    <p className="text-gray-600 mb-4 text-sm max-w-2xl">
                                        Upload an older Booking Flash data export to see what's changed since
                                        then -- new bookings, removed bookings, and any changes to Status,
                                        PIC, Vessel, Max Laden, Current Laden, or Booking/Peak Utilization on
                                        bookings present in both.
                                    </p>

                                    {oldParseError && (
                                        <div className="bg-red-100 border-2 border-red-500 text-red-800 font-bold px-4 py-3 rounded mb-4 shadow-sm" role="alert">
                                            {oldParseError}
                                        </div>
                                    )}

                                    {oldRawRows.length === 0 ? (
                                        <div className="flex flex-col items-center justify-center border-4 border-dashed border-gray-400 rounded-lg p-10 text-center bg-gray-50">
                                            <p className="text-gray-600 mb-4 max-w-md">
                                                No old file loaded yet. Upload a previous Booking Flash data
                                                export (the same kind of file used for the main upload) to
                                                compare it against the {rawRows.length.toLocaleString()} bookings
                                                currently loaded.
                                            </p>
                                            <button onClick={() => oldFileInputRef.current?.click()} className="bg-[#E5007D] text-white px-6 py-3 rounded shadow-md hover:bg-blue-800 transition-colors font-bold cursor-pointer">
                                                Upload Old Data File
                                            </button>
                                        </div>
                                    ) : (
                                        <>
                                            <div className="flex flex-wrap items-center justify-between gap-2 mb-4 pb-2 border-b-2 border-gray-300">
                                                <div className="text-sm">
                                                    Comparing <span className="font-bold text-blue-700">{oldFileName}</span> ({oldRawRows.length.toLocaleString()} bookings)
                                                    {' '}against the current data ({rawRows.length.toLocaleString()} bookings, last refreshed {lastRefresh ? lastRefresh.toLocaleString() : '—'}).
                                                </div>
                                                <div className="flex gap-2">
                                                    <button onClick={() => oldFileInputRef.current?.click()} className="text-xs font-bold text-[#E5007D] border border-[#E5007D] rounded px-2 py-1 hover:bg-blue-50 transition-colors cursor-pointer">
                                                        Change File
                                                    </button>
                                                    <button onClick={clearOldFile} className="text-xs font-bold text-gray-500 border border-gray-400 rounded px-2 py-1 hover:bg-gray-100 transition-colors cursor-pointer">
                                                        Clear
                                                    </button>
                                                </div>
                                            </div>

                                            {compareData && (
                                                <>
                                                    <div className="grid grid-cols-2 md:grid-cols-4 gap-3 mb-6">
                                                        {[
                                                            { label: 'Bookings', old: compareData.oldSnapshot.bookingCount, cur: compareData.newSnapshot.bookingCount, fmt: (v) => v.toLocaleString() },
                                                            { label: 'Total Max Laden', old: compareData.oldSnapshot.maxLdn, cur: compareData.newSnapshot.maxLdn, fmt: formatNumberWithCommas },
                                                            { label: 'Total Booked TEU', old: compareData.oldSnapshot.laden, cur: compareData.newSnapshot.laden, fmt: formatNumberWithCommas },
                                                            { label: 'Overall Utilization', old: compareData.oldSnapshot.utilz, cur: compareData.newSnapshot.utilz, fmt: (v) => `${v}%` },
                                                        ].map(card => {
                                                            const delta = card.cur - card.old;
                                                            const deltaColor = delta > 0 ? 'text-green-700' : delta < 0 ? 'text-red-700' : 'text-gray-500';
                                                            const deltaSign = delta > 0 ? '+' : '';
                                                            return (
                                                                <div key={card.label} className="border border-gray-300 rounded-md p-3 bg-gray-50">
                                                                    <div className="text-xs font-bold text-gray-500 uppercase mb-1">{card.label}</div>
                                                                    <div className="text-sm text-gray-500">Old: {card.fmt(card.old)}</div>
                                                                    <div className="text-lg font-extrabold text-[#E5007D]">New: {card.fmt(card.cur)}</div>
                                                                    <div className={`text-sm font-bold ${deltaColor}`}>{deltaSign}{card.fmt(delta)}</div>
                                                                </div>
                                                            );
                                                        })}
                                                    </div>

                                                    <h3 className="text-lg font-bold text-green-700 mb-2">New Bookings ({compareData.added.length})</h3>
                                                    {compareData.added.length === 0 ? (
                                                        <p className="text-sm text-gray-500 mb-6">No new bookings since the old file.</p>
                                                    ) : (
                                                        <div className="overflow-x-auto mb-6 border border-gray-300 rounded">
                                                            <table className="w-full text-xs text-left border-collapse">
                                                                <thead className="bg-green-100">
                                                                    <tr>
                                                                        <th className="p-1.5 border border-gray-300">Trade</th>
                                                                        <th className="p-1.5 border border-gray-300">Sub Trade</th>
                                                                        <th className="p-1.5 border border-gray-300">Lane</th>
                                                                        <th className="p-1.5 border border-gray-300">Sale Week</th>
                                                                        <th className="p-1.5 border border-gray-300">VVD</th>
                                                                        <th className="p-1.5 border border-gray-300">POL</th>
                                                                        <th className="p-1.5 border border-gray-300">Vessel</th>
                                                                    </tr>
                                                                </thead>
                                                                <tbody>
                                                                    {compareData.added.map((row, i) => (
                                                                        <tr key={i} className="odd:bg-white even:bg-green-50">
                                                                            <td className="p-1.5 border border-gray-300">{row.trade}</td>
                                                                            <td className="p-1.5 border border-gray-300">{row.subTrade}</td>
                                                                            <td className="p-1.5 border border-gray-300">{row.lane}</td>
                                                                            <td className="p-1.5 border border-gray-300">{row.saleWeek}</td>
                                                                            <td className="p-1.5 border border-gray-300">{row.vvd}</td>
                                                                            <td className="p-1.5 border border-gray-300">{row.pol}</td>
                                                                            <td className="p-1.5 border border-gray-300">{row.vessel}</td>
                                                                        </tr>
                                                                    ))}
                                                                </tbody>
                                                            </table>
                                                        </div>
                                                    )}

                                                    <h3 className="text-lg font-bold text-red-700 mb-2">Removed Bookings ({compareData.removed.length})</h3>
                                                    {compareData.removed.length === 0 ? (
                                                        <p className="text-sm text-gray-500 mb-6">No bookings were removed since the old file.</p>
                                                    ) : (
                                                        <div className="overflow-x-auto mb-6 border border-gray-300 rounded">
                                                            <table className="w-full text-xs text-left border-collapse">
                                                                <thead className="bg-red-100">
                                                                    <tr>
                                                                        <th className="p-1.5 border border-gray-300">Trade</th>
                                                                        <th className="p-1.5 border border-gray-300">Sub Trade</th>
                                                                        <th className="p-1.5 border border-gray-300">Lane</th>
                                                                        <th className="p-1.5 border border-gray-300">Sale Week</th>
                                                                        <th className="p-1.5 border border-gray-300">VVD</th>
                                                                        <th className="p-1.5 border border-gray-300">POL</th>
                                                                        <th className="p-1.5 border border-gray-300">Vessel</th>
                                                                    </tr>
                                                                </thead>
                                                                <tbody>
                                                                    {compareData.removed.map((row, i) => (
                                                                        <tr key={i} className="odd:bg-white even:bg-red-50">
                                                                            <td className="p-1.5 border border-gray-300">{row.trade}</td>
                                                                            <td className="p-1.5 border border-gray-300">{row.subTrade}</td>
                                                                            <td className="p-1.5 border border-gray-300">{row.lane}</td>
                                                                            <td className="p-1.5 border border-gray-300">{row.saleWeek}</td>
                                                                            <td className="p-1.5 border border-gray-300">{row.vvd}</td>
                                                                            <td className="p-1.5 border border-gray-300">{row.pol}</td>
                                                                            <td className="p-1.5 border border-gray-300">{row.vessel}</td>
                                                                        </tr>
                                                                    ))}
                                                                </tbody>
                                                            </table>
                                                        </div>
                                                    )}

                                                    <h3 className="text-lg font-bold text-amber-700 mb-2">Changed Bookings ({compareData.changed.length})</h3>
                                                    {compareData.changed.length === 0 ? (
                                                        <p className="text-sm text-gray-500">No tracked-field changes on bookings present in both files.</p>
                                                    ) : (
                                                        <div className="overflow-x-auto border border-gray-300 rounded">
                                                            <table className="w-full text-xs text-left border-collapse">
                                                                <thead className="bg-amber-100">
                                                                    <tr>
                                                                        <th className="p-1.5 border border-gray-300">Trade</th>
                                                                        <th className="p-1.5 border border-gray-300">Sub Trade</th>
                                                                        <th className="p-1.5 border border-gray-300">Lane</th>
                                                                        <th className="p-1.5 border border-gray-300">Sale Week</th>
                                                                        <th className="p-1.5 border border-gray-300">VVD</th>
                                                                        <th className="p-1.5 border border-gray-300">POL</th>
                                                                        <th className="p-1.5 border border-gray-300">What Changed</th>
                                                                    </tr>
                                                                </thead>
                                                                <tbody>
                                                                    {compareData.changed.map((row, i) => (
                                                                        <tr key={i} className="odd:bg-white even:bg-amber-50">
                                                                            <td className="p-1.5 border border-gray-300">{row.trade}</td>
                                                                            <td className="p-1.5 border border-gray-300">{row.subTrade}</td>
                                                                            <td className="p-1.5 border border-gray-300">{row.lane}</td>
                                                                            <td className="p-1.5 border border-gray-300">{row.saleWeek}</td>
                                                                            <td className="p-1.5 border border-gray-300">{row.vvd}</td>
                                                                            <td className="p-1.5 border border-gray-300">{row.pol}</td>
                                                                            <td className="p-1.5 border border-gray-300">
                                                                                {row.diffs.map((d, di) => (
                                                                                    <div key={di}>
                                                                                        <span className="font-bold">{d.label}:</span> {d.oldVal} <span className="text-gray-400">{'→'}</span> {d.newVal}
                                                                                    </div>
                                                                                ))}
                                                                            </td>
                                                                        </tr>
                                                                    ))}
                                                                </tbody>
                                                            </table>
                                                        </div>
                                                    )}
                                                </>
                                            )}
                                        </>
                                    )}
                                </div>
                            )}
                            </div>
                        </>
                    )}
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<FlashReportDashboard />);
    </script>
</body>
</html>
