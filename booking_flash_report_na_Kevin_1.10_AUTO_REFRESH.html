        // Audited 2026-08-13: the raw "Measures Overall Status"/"Measures Loading Status"
        // columns hold multiple literal string variants for the same two logical AP
        // statuses -- "AP Frozen(GD6)" and "AP Frozen" (Booking_Flash vs POL_Booking_Flash
        // sheets), "AP Only(GD6)", "AP ONLY", and "AP Only" (per the reference workbook's
        // pivot-filter VBA macros). The plain `.trim()`/`.trim().toUpperCase()` comparisons
        // previously used at each match site only ever matched the bare "AP Frozen"/
        // "AP Only" forms -- "AP Frozen(GD6)" (the form Booking_Flash's own pivot filters
        // reference) never matched at all, silently disabling AP Frozen highlighting for
        // that data. Normalize once here (uppercase + strip a trailing "(GD6)" suffix) so
        // every downstream comparison collapses all 5 known variants to one of two
        // canonical values ("AP FROZEN"/"AP ONLY").
        const normalizeApStatus = (raw) => String(raw || '')
            .trim()
            .replace(/\s*\(GD6\)\s*$/i, '')
            .toUpperCase();


        // Real bug found 2026-08-18 via live data from the published Google Sheet: raw
        // numeric columns (Max Laden, Laden TEU, Active Total TEU, etc.) come through
        // sheet_to_json({raw:false}) as thousands-separated strings whenever the source
        // cell has number formatting applied ("42,079", not "42079") -- confirmed via a
        // direct fetch+parse of the live CSV. The old static reference .xlsx file's
        // equivalent columns happened not to be comma-formatted, so this was a dormant
        // bug this whole project: plain parseFloat() stops at the first non-numeric
        // character, silently truncating "42,079" down to just 42 -- a ~1000x
        // undercount that only surfaced once the live-refresh feature started pulling
        // from a source that actually formats its numbers this way (Trade Summary's
        // Trunk Utilization showing e.g. "753114%" was the visible symptom). This
        // mirrors the comma-stripping already done ad hoc in a few places (PivotTableViewer's
        // own numVal, POL_Booking_Flash's numVal) -- toNum is the same idea, applied
        // consistently everywhere a raw getVal() string needs to become a real number.
        const toNum = (val) => parseFloat(String(val ?? '').replace(/[,%()]/g, '')) || 0;

        // getPercentNum / formatPercent are only ever applied to raw columns that Power
        // Query casts to Percentage.Type (curUtilRaw <- "Measures Overall Booking Utilz",
        // peakUtilRaw <- "Measures Peak Overall Utilz", standbyRaw <- "Trunk Threshold",
        // rfrUtilizRaw <- "Measures POL Reefer Utilz", plus the computed actVsBkgUtilzRaw
        // ratio) - i.e. always fractional decimals (0.75 = 75%), never bare whole-number
        // percents. Verified against Booking_Flash_Data_MAIN_UPLOAD_8-12-2026.xlsx: every
        // sampled value in these columns (899/899 rows) is a plain fractional decimal, and
        // two real rows have values up to 8.0 (=800%, e.g. rows 161 & 329 in "Measures POL
        // Reefer Utilz"/"RFR Utilz%") - well outside the old "(0,5] must be fractional"
        // guess, which would have silently left those rendered as "8%" instead of "800%".
        // So we trust the known column type and scale unconditionally instead of guessing
        // from the value's magnitude.
        const getPercentNum = (val) => {
            if (!val) return 0;
            let s = String(val).trim();

                    // Trade/root is correct (combining genuinely different lanes), but summing
                    // DOWN from SaleWeek children into their Lane parent is not (it would just
                    // multiply the same constant by the week count). Fields with no such
                    // constant-within-a-deeper-dimension behavior (e.g. Max Laden, genuinely
                    // max-per-raw-row) default to Infinity -- sum applies at every level, as
                    // before.
                    const applyRollup = (node, depth) => {
                        const childNodes = Object.values(node._children);
                        childNodes.forEach(c => applyRollup(c, depth + 1)); // post-order
                        if (childNodes.length === 0) return; // leaf: keep raw-aggregated value
                        rollupFields.forEach(df => {
                            const stableAtDepth = df.rollupStableAtDepth || Infinity;
                            if (depth >= stableAtDepth) return; // children are past the stable depth -- don't sum, keep this node's own raw (already-correct) value
                            const colVals = new Set(Object.keys(node._totals));
                            childNodes.forEach(c => Object.keys(c._totals).forEach(cv => colVals.add(cv)));
                            colVals.forEach(colVal => {
                                if (!node._totals[colVal] || !node._totals[colVal][df.name]) return;
                                let sum = 0;
                                childNodes.forEach(c => {
                                    const ct = c._totals[colVal] && c._totals[colVal][df.name];
                                    if (ct) sum += ct.max;
                                });
                                node._totals[colVal][df.name].max = sum;
                            });
                        });
                    };
                    // Apply all the way to the synthetic root too (rendered as the visible
                    // "Grand Total" row), not just Trade-level nodes. This is NOT double-
                    // counting: post-order, summing each Trade's already-summed total at the
                    // root is mathematically identical to summing every leaf value directly
                    // (associativity of sum) -- e.g. root = TPT_sum(50570) + TAT_sum(11000) =
                    // 61570 = the same 61570 you'd get summing all 5 raw subtrade maxes
                    // directly. An earlier version of this comment treated that as suspicious
                    // inflation and skipped root; live-tested against the full real dataset,
                    // that turned out to be the wrong call: on a sibling pivot with the same
                    // shape of Max/Sum ratio but no rollup, the *un-rolled-up* root produced
                    // an obviously-wrong 3831% "Current Laden Utiliz %" on real data (summing
                    // Current Laden across 964 rows against a Max Laden that was just one
                    // row's raw max, since it never rolled up past the leaf level either) --
                    // strong evidence the un-rolled-up root value is the one to distrust, not
                    // the rolled-up one.
                    applyRollup(root);
                }

                return { root, colKeys };
            }, [data, config]);
            
            const flatten = (node, level = 0, isLastChild = true, prefix = '', parentId = 'root', parentPath = '') => {
                let rows = [];
                const nodeId = `${parentId}-${node.label}`;
                const hasChildren = Object.keys(node._children).length > 0;
                rows.push({
                    id: nodeId,
                    level,
                    label: node.label,
                    totals: node._totals,
                    context: node.context,
                    isLastChild,
                    prefix,
                    hasChildren
                });

                if (collapsedNodes.has(nodeId)) return rows;

                // childOrder (2026-08-25, Sector Summary's two side-by-side pivots only): a
                // path-keyed lookup (e.g. `{ ROOT: ['TPT','TAT','LAT'], TPT: ['AW','PN','PS'],
                // 'TPT|AW': ['EC1','EC2','EC3','EC4','WIN'], ... }`, path segments joined by
                // '|') giving each level's real-world canonical child order, extracted
                // directly from the reference .xlsm (its Trade order there is a deliberate
                // manual override baked into the pivot -- not alphabetical, not derivable --
                // confirmed via the pivot XML's item-index overrides; Sub Trade/Lane/POD
                // Sector order reflects the reference's own "first seen in its source data"
                // order, not hand-tuned but also not alphabetical). Replaces the earlier
                // level-0-only, alphabetically-computed `topLevelOrder` (which only aligned
                // the two pivots with EACH OTHER, not with the real Excel order Kevin pointed
                // out -- see SECTOR_LEFT_ORDER/SECTOR_RIGHT_ORDER below). A path with no entry
                // in `childOrder`, or a child not listed under its path's entry, falls back to
                // alphabetical -- so a lane/sector that exists live but wasn't in the
                // reference snapshot (the right pivot's live source updates independently)
                // still renders, just appended after the known ones instead of breaking.
                const path = parentPath || 'ROOT';
                const order = childOrder && childOrder[path];
                const childrenKeys = rowFields[level] && rowFields[level].key === 'saleWeek'
                    ? Object.keys(node._children).sort(compareSaleWeek)
                    : order
                        ? [
                            ...order.filter(k => k in node._children),
                            ...Object.keys(node._children).filter(k => !order.includes(k)).sort()
                        ]
                        : Object.keys(node._children).sort();
                childrenKeys.forEach((key, index) => {
                    const isLast = index === childrenKeys.length - 1;
                    const newPrefix = prefix + (isLastChild ? '    ' : '│   ');
                    const newParentPath = parentPath ? `${parentPath}|${key}` : key;
                    rows = rows.concat(flatten(node._children[key], level + 1, isLast, newPrefix, nodeId, newParentPath));
                });
                return rows;
            };
            
            const renderRows = useMemo(() => {
                if (!aggregated.root || Object.keys(aggregated.root._totals).length === 0) return [];
                const flat = flatten(aggregated.root, 0, true, '');
                // flatten's first element is always the synthetic root (level 0, the Grand
                // Total row) -- drop it here rather than in flatten itself so collapsedNodes/
                // nodeId bookkeeping for its children stays untouched.
                return showGrandTotal ? flat : flat.filter(row => row.level !== 0);
            }, [aggregated, showGrandTotal]);
            
            const colKeysToRender = colField ? aggregated.colKeys : ['Total'];

            // showGrandTotalColumn (2026-08-25): opt-out of the extra "Grand Total" COLUMN a
            // colField pivot appends after its real columns (e.g. Trade Summary's per-Sale-
            // Week columns) -- distinct from showGrandTotal above, which controls the Grand
            // Total ROW. Gated on `colField` being truthy: a pivot with no colField has no
            // real columns of its own at all (colKeysToRender is already just ['Total'] in
            // that case, its ONLY column) -- this flag must never touch that pivot, or it'd
            // lose its sole column entirely. Trade Summary is the only PivotTableViewer
            // instance that sets colField, so this only ever changes behavior there.
            const colKeysWithTotal = colField
                ? (showGrandTotalColumn ? [...colKeysToRender, 'Total'] : colKeysToRender)
                : ['Total'];

            // Auto-fit column widths (2026-08-26, Kevin: "Auto-fit the column width on
            // the Trade and Sector Summary tabs"). Every column with no manually-set
            // width (the common/default case -- see manualColWidthKeysRef above) is
            // sized to its own real rendered content instead of the previous fixed
            // min-w-[80px]/min-w-[200px] one-size-fits-all guess, matching Excel's own
            // "AutoFit Column Width": a short Lane code no longer reserves the same
            // width as a long formatted number, and a long Trade->SubTrade->Lane row
            // label no longer gets force-wrapped just because 200px was a guess.
            //
            // tableRef + data-autofit-col (added to every relevant <th>/<td> below,
            // keyed identically to colWidths -- 'rowLabels', a dataField's `name`, or
            // (Trade Summary's colField+valuesInRows layout only, which previously had
            // no per-column width control at all) 'valuesCol'/`col:${weekKey}`) let
            // this effect find every rendered cell belonging to a given logical
            // column, take the widest one's real content width via
            // measureRenderedTextWidth, and seed colWidths with that as the DEFAULT --
            // never touching a key already in manualColWidthKeysRef, so a user's own
            // drag-resize still overrides it exactly as before.
            //
            // Recomputes whenever this pivot's actual rendered content changes --
            // renderRows/colKeysWithTotal/dataFields are memoized/stable references
            // that only change identity on a real data change (new file uploaded,
            // live refresh), a config swap, or a tree node expand/collapse, never
            // merely because colWidths itself changed -- so setColWidths here can't
            // re-trigger this same effect and loop. Guarded to only write when the
            // computed width actually differs (>1px) from the current one, so it
            // settles after one pass instead of fighting layout.
            useLayoutEffect(() => {
                const table = tableRef.current;
                if (!table) return;
                const cells = table.querySelectorAll('[data-autofit-col]');
                const maxByKey = {};
                cells.forEach(el => {
                    const key = el.getAttribute('data-autofit-col');
                    const w = measureRenderedTextWidth(el);
                    if (!(key in maxByKey) || w > maxByKey[key]) maxByKey[key] = w;
                });
                // Fixed allowance per column covering each cell's own py-1/px-0.5
                // padding + border-collapse border + the absolutely-positioned
                // ColResizeHandle's 6px hit area on header cells (position:absolute,
                // so it contributes nothing to measureRenderedTextWidth's flow-based
                // measurement) plus a little breathing room so text never touches the
                // handle or the next column's border.
                const AUTO_FIT_PADDING = 22;
                const AUTO_FIT_MIN = 40;
                setColWidths(prev => {
                    let changed = false;
                    const next = { ...prev };
                    Object.keys(maxByKey).forEach(key => {
                        if (manualColWidthKeysRef.current.has(key)) return;
                        const target = Math.ceil(Math.max(AUTO_FIT_MIN, maxByKey[key] + AUTO_FIT_PADDING));
                        if (Math.abs((prev[key] || 0) - target) > 1) {
                            next[key] = target;
                            changed = true;
                        }
                    });
                    return changed ? next : prev;
                });
            }, [renderRows, colKeysWithTotal, dataFields]);

            /* dark:bg-gray-800 (2026-08-21): darkens the table's own background AND
               (since a <td> with no explicit bg is transparent, letting this
               wrapper's background show through) every "plain" cell that has no
               conditional-formatting color of its own -- those get light text for
               free via inheritance from the app root's dark:text-gray-100. Every
               cell that DOES carry one of the reference workbook's real Excel CF
               colors keeps that exact color unchanged and gets an explicit
               text-black pin (see each one below) so it stays legible against its
               own always-light fill regardless of theme. */
            return (
                <div className="border-2 border-black dark:border-gray-600 overflow-x-auto bg-white dark:bg-gray-800 shadow-lg rounded-md mb-4">
                    {/* text-lg/py-1.5 (2026-08-26, was text-xl/p-2 -- Kevin, on a Trade Summary
                        screenshot: "the header here doesn't have to be so big") -- shared by
                        every PivotTableViewer instance (Trade Summary, both Sector Summary
                        pivots), so this shrinks all of them consistently rather than leaving
                        Trade Summary's title bar a different size from its siblings'.
                        "Columns: {colField}" removed the same round ("remove the Columns:
                        SalesWeek") -- only ever rendered when colField is set, which only Trade
                        Summary's config does, so this was effectively Trade-Summary-only despite
                        living in the shared header; Sector Summary's pivots never set colField
                        and were unaffected either way. */}
                    <h2 className="text-lg font-bold text-white py-1.5 px-2 flex justify-between rounded-t-sm" style={{ backgroundColor: accentColor }}>
                        <span>{title}</span>
                    </h2>
                    <table ref={tableRef} className="w-full text-xs text-center border-collapse border border-gray-400">
                        <caption style={{ position: 'absolute', width: '1px', height: '1px', padding: 0, margin: '-1px', overflow: 'hidden', clip: 'rect(0,0,0,0)', whiteSpace: 'nowrap', border: 0 }}>{title}</caption>
                        {/* shadow-[...] (2026-08-26): a sticky <thead>'s shared border-collapse
                            bottom border silently glitches to the wrong (adjacent tbody row's)
                            color once the header is stuck and the body scrolls underneath it --
                            a real Chromium border-collapse+position:sticky rendering bug, not a
                            className mistake (confirmed via an isolated repro: the collapsed
                            border read back as the tbody's own border color mid-scroll even
                            though every computed style still reported black). An explicit
                            outset box-shadow on the thead itself repaints a solid black replica
                            of that boundary on top, immune to the bug since it's painted
                            directly on the sticky element's own box, not resolved via the
                            table's collapsed-border algorithm. Combined into one arbitrary-value
                            shadow utility alongside the pre-existing shadow-sm (Tailwind's
                            box-shadow property can't be set twice on one element -- the second
                            utility would just override the first, not add to it). */}
                        <thead className="bg-[#333333] text-white sticky top-0 z-10 shadow-[0_1px_2px_rgba(0,0,0,0.05),0_1px_0_black] border-black">
                            {colField && !valuesInRows && (
                                <tr>
                                    <th data-autofit-col="rowLabels" className="border border-black py-0.5 px-0.5 min-w-[200px] text-left relative" style={colWidths.rowLabels ? { width: colWidths.rowLabels, minWidth: colWidths.rowLabels } : undefined}>Row Labels<ColResizeHandle colKey="rowLabels" /></th>
                                    {colKeysToRender.map((c, i) => (
                                        <th key={i} colSpan={dataFields.length} className="border border-black py-0.5 px-0.5 bg-[#444444]">{c}</th>
                                    ))}
                                    {showGrandTotalColumn && <th colSpan={dataFields.length} className="border border-black py-0.5 px-0.5 font-bold">Grand Total</th>}
                                </tr>
                            )}
                            <tr>
                                <th data-autofit-col="rowLabels" className="border border-black py-0.5 px-0.5 min-w-[200px] text-left relative" style={colWidths.rowLabels ? { width: colWidths.rowLabels, minWidth: colWidths.rowLabels } : undefined}>Row Labels<ColResizeHandle colKey="rowLabels" /></th>
                                {colField && valuesInRows && (
                                    <>
                                        {/* valuesCol/`col:${c}` (2026-08-26): this layout (Trade Summary's
                                            only, colField+valuesInRows together) previously had NO width
                                            control at all on these headers -- no min-w, no colWidths, no
                                            ColResizeHandle -- so they relied entirely on the browser's
                                            table-layout:auto default. Wiring them into the same
                                            colWidths/ColResizeHandle/data-autofit-col mechanism as every
                                            other column here makes auto-fit and manual override behave
                                            consistently across all 3 pivot instances instead of leaving this
                                            one an exception. */}
                                        <th data-autofit-col="valuesCol" className="border border-black py-0.5 px-0.5 bg-[#444444] relative" style={colWidths.valuesCol ? { width: colWidths.valuesCol, minWidth: colWidths.valuesCol } : undefined}>Values<ColResizeHandle colKey="valuesCol" /></th>
                                        {colKeysToRender.map((c, i) => (
                                            <th key={i} data-autofit-col={`col:${c}`} className="border border-black py-0.5 px-0.5 bg-[#444444] relative" style={colWidths[`col:${c}`] ? { width: colWidths[`col:${c}`], minWidth: colWidths[`col:${c}`] } : undefined}>{c}<ColResizeHandle colKey={`col:${c}`} /></th>
                                        ))}
                                        {showGrandTotalColumn && <th data-autofit-col="grandTotalValuesCol" className="border border-black py-0.5 px-0.5 font-bold relative" style={colWidths.grandTotalValuesCol ? { width: colWidths.grandTotalValuesCol, minWidth: colWidths.grandTotalValuesCol } : undefined}>Grand Total<ColResizeHandle colKey="grandTotalValuesCol" /></th>}
                                    </>
                                )}
                                {(!colField || !valuesInRows) && colKeysWithTotal.map((cKey) => (
                                    dataFields.map((df, dfIdx) => (
                                        <th key={`${cKey}-${dfIdx}`} data-autofit-col={df.name} className={`border border-black py-0.5 px-0.5 min-w-[80px] relative ${cKey === 'Total' && colField ? 'font-bold bg-[#333333]' : ''}`} style={colWidths[df.name] ? { width: colWidths[df.name], minWidth: colWidths[df.name] } : undefined}>{df.label}<ColResizeHandle colKey={df.name} /></th>
                                    ))
                                ))}
                            </tr>
                        </thead>
                        <tbody className="whitespace-nowrap">
                            {renderRows.map((row, i) => {
                                const customClass = rowClass && row.level === rowFields.length ? rowClass(row.totals, row.context) : '';
                                // hover:bg-gray-100 (specificity 0,2,0) would otherwise beat a plain
                                // bg-[#DA9694]/bg-[#ffc000]/bg-[#d9d9d9] status class (specificity 0,1,0)
                                // on mouse-over, washing out AP Frozen/AP Only/VMS row coloring -- Detail
                                // View has no such hover wash-out (its rows carry no hover state at all),
                                // so skip the hover class whenever a status color is present to match it.
                                const trClassBase = `${customClass ? '' : 'hover:bg-gray-100 dark:hover:bg-gray-700'} ${row.level === 0 ? (prettyGrandTotal ? 'font-bold shadow-md' : 'bg-[#d9e1f2] text-black font-bold') : ''} ${row.level === 1 ? 'font-bold' : ''}`;
                                // Every data <td> below unconditionally gets bg-[#eef2fa] whenever
                                // cKey === 'Total' -- true for every cell on a pivot with no colField
                                // (Sector_Summary's pivots have none), which would otherwise paint over
                                // a row-level Grand Total background. Computed once per row and applied
                                // directly on each <td>'s style (both the row-label cell and the data
                                // cells) rather than fighting it via CSS specificity.
                                const grandTotalCellStyle = (row.level === 0 && prettyGrandTotal) ? { backgroundColor: accentColor, color: '#fff' } : undefined;

                                if (valuesInRows) {
                                    return (
                                        <React.Fragment key={i}>
                                            <tr className={`${trClassBase} ${customClass} ${row.level === 0 ? 'bg-[#d9e1f2] text-black font-bold' : ''}`}>
                                                {/* Same Grand-Total-centering rule as the non-valuesInRows branch
                                                    below: row.level === 0 is always the single Grand Total row --
                                                    center it (dropping the flex layout, which would otherwise
                                                    left-anchor the text regardless of the td's text-align) while
                                                    every other row keeps its left-aligned, indented hierarchy. */}
                                                <td rowSpan={dataFields.length + 1} data-autofit-col="rowLabels" className={`border border-gray-400 py-1 px-0.5 align-top ${row.level === 0 ? 'text-center' : 'text-left'}`}>
                                                    {/* inline-flex (2026-08-26, was flex): `flex` makes this span a
                                                        BLOCK-level flex container, which -- having no explicit
                                                        width of its own -- stretches to fill its containing <td>'s
                                                        full content-box width regardless of how short its own text
                                                        is. That's invisible normally (text-align/padding still look
                                                        right either way), but it broke this column's auto-fit
                                                        measurement: measureRenderedTextWidth's Range selects this
                                                        span's contents and measures ITS box, so every row (whether
                                                        "LAT" or "TAT") reported back the column's OWN current width,
                                                        not the real text width -- a self-reinforcing loop where the
                                                        "measured" width was just whatever width the column already
                                                        happened to have. inline-flex keeps the same icon+text
                                                        alignment but sizes the span to its own content
                                                        (shrink-to-fit, like a normal inline element), so the Range
                                                        measurement reflects the real "LAT"/"TAT"/etc. text width and
                                                        auto-fit sizes this column correctly. */}
                                                    <span style={{ paddingLeft: row.level === 0 ? 0 : `${Math.max(0, row.level - 1) * 1.5}rem` }} className={row.level === 0 ? '' : 'inline-flex items-center'}>
                                                        {row.level > 0 && (row.hasChildren
                                                            ? <button type="button" onClick={() => toggleCollapse(row.id)} aria-label={collapsedNodes.has(row.id) ? 'Expand row' : 'Collapse row'} className="mr-1 w-4 text-center border border-gray-400 dark:border-gray-500 bg-white dark:bg-gray-700 dark:text-gray-100 shadow-sm font-bold text-[10px] leading-tight hover:bg-gray-200 dark:hover:bg-gray-600">{collapsedNodes.has(row.id) ? '+' : '−'}</button>
                                                            : <span className="mr-1 w-4 text-center inline-block">•</span>
                                                        )}
                                                        {row.label}
                                                    </span>
                                                </td>
                                                {/* Fill the empty cells for the parent header row so borders connect */}
                                                <td className="border border-gray-400 py-1 px-0.5 bg-gray-100 dark:bg-gray-700"></td>
                                                {colKeysWithTotal.map((cKey, cIdx) => (
                                                    <td key={`empty-${cIdx}`} className="border border-gray-400 py-1 px-0.5 bg-gray-100 dark:bg-gray-700"></td>
                                                ))}
                                            </tr>
                                            {dataFields.map((df, dfIdx) => (
                                                <tr key={`${i}-${dfIdx}`} className={`${customClass || 'bg-white dark:bg-gray-800 hover:bg-gray-50 dark:hover:bg-gray-700'}`}>
                                                    <td data-autofit-col="valuesCol" className="border border-gray-400 py-1 px-0.5 text-left bg-gray-100 dark:bg-gray-700 font-semibold">{df.label}</td>
                                                    {colKeysWithTotal.map((cKey, cIdx) => {
                                                        let val = 0;
                                                        const tGrp = row.totals[cKey] || {};
                                                        if (df.agg === 'calc' && df.calc) {
                                                            // 3rd/4th args (row.context, cKey) are additive --
                                                            // existing 1-arg calc functions elsewhere simply
                                                            // ignore them. Added so a calc field can look up a
                                                            // value keyed by this node's tree context (e.g.
                                                            // trade/subTrade) and which column (Sale Week or
                                                            // 'Total') it's being rendered for -- needed by
                                                            // Trade_Summary's lane-aware Max Laden fix below.
                                                            val = df.calc(tGrp, row.context, cKey);
                                                        } else {
                                                            const t = tGrp[df.name] || { sum: 0, max: 0, count: 0 };
                                                            if (df.agg === 'sum') val = t.sum;
                                                            if (df.agg === 'max') val = t.max;
                                                            if (df.agg === 'count') val = t.count;
                                                            if (df.agg === 'avg') val = t.count > 0 ? t.sum / t.count : 0;
                                                        }

                                                        let displayVal = val;
                                                        if (df.format === 'number') displayVal = formatNumberWithCommas(val);
                                                        // rawFraction fields (e.g. peakUtilRaw, standbyRaw) store a raw
                                                        // fractional decimal (1.5 = 150%), not an already-scaled percent
                                                        // -- confirmed empirically against the real upload file (see
                                                        // getPercentNum's own comment + the 8/14/2026 live sample showing
                                                        // "Measures Peak Pol Utilz" values like 0.09/0.7/3.63). Scale via
                                                        // getPercentNum ONLY for display; `val` itself stays raw/unscaled
                                                        // so cellClass callbacks below (which call getPercentNum(val)
                                                        // themselves) don't get double-scaled.
                                                        else if (df.format === 'percent') displayVal = `${Math.round(df.rawFraction ? getPercentNum(val) : val)}%`;
                                                        else if (df.format === 'accounting') displayVal = formatAccountingNumber(val);
                                                        else if (df.format === 'accountingSignedRed') displayVal = formatAccountingSigned(val);

                                                        // Backward-compatible extension: pass the row's full totals
                                                        // bundle (tGrp) as a 2nd arg so cellClass callbacks that need
                                                        // to compare sibling fields (e.g. Peak vs Current Utiliz %)
                                                        // can do so; existing single-arg callbacks just ignore it.
                                                        // negativeValueClass mirrors the reference Excel's red-negative-
                                                        // number rule (see its definition) for accounting/number fields.
                                                        const cClass = `${df.cellClass ? df.cellClass(val, tGrp) : ''} ${negativeValueClass(val, df.format)}`.trim();
                                                        // Same fix as the sibling branch below: don't let the
                                                        // always-on Total-column tint fight a cellClass-driven
                                                        // background of equal specificity (see that comment).
                                                        const cClassHasOwnBg = cClass.includes('bg-');
                                                        return <td key={cIdx} data-autofit-col={cKey === 'Total' ? 'grandTotalValuesCol' : `col:${cKey}`} className={`border border-gray-400 py-1 px-0.5 ${(cKey === 'Total' && !cClassHasOwnBg) ? 'font-bold bg-[#eef2fa] dark:bg-blue-950 text-black dark:text-gray-100' : (cKey === 'Total' ? 'font-bold' : '')} ${cClass}`}>{displayVal}</td>;
                                                    })}
                                                </tr>
                                            ))}
                                        </React.Fragment>
                                    );
                                }
                                
                                return (
                                    <tr key={i} className={`${trClassBase} ${customClass}`}>
                                        {/* Row Labels column is normally left-aligned so the indentation
                                            hierarchy (paddingLeft below) reads correctly, but the reference
                                            Excel pivots center-align the Grand Total row specifically -- match
                                            that here (row.level === 0 is always the single Grand Total row). */}
                                        <td data-autofit-col="rowLabels" className={`border border-gray-400 py-1 px-0.5 ${row.level === 0 ? 'text-center' : 'text-left'}`} style={grandTotalCellStyle}>
                                            <span style={{ paddingLeft: row.level === 0 ? 0 : `${Math.max(0, row.level - 1) * 1.5}rem` }}>
                                                {row.level > 0 && (row.hasChildren
                                                    ? <button type="button" onClick={() => toggleCollapse(row.id)} aria-label={collapsedNodes.has(row.id) ? 'Expand row' : 'Collapse row'} className="cursor-pointer select-none hover:text-blue-700 bg-transparent border-0 p-0 m-0 inline align-baseline">{collapsedNodes.has(row.id) ? '▶ ' : '▼ '}</button>
                                                    : '• '
                                                )}
                                                {getRowStatusBadge(customClass)}{row.label}
                                            </span>
                                        </td>
                                        {colKeysWithTotal.map((cKey) => (
                                            dataFields.map((df, colIdx) => {
                                                let val = 0;
                                                const tGrp = row.totals[cKey] || {};
                                                if (df.agg === 'calc' && df.calc) {
                                                    val = df.calc(tGrp, row.context, cKey);
                                                } else {
                                                    const t = tGrp[df.name] || { sum: 0, max: 0, count: 0 };
                                                    if (df.agg === 'sum') val = t.sum;
                                                    if (df.agg === 'max') val = t.max;
                                                    if (df.agg === 'count') val = t.count;

                                    pol: getVal(['Route Location 1st Yard']),
                                    yard: getVal(['Route Location 1st Yard', 'RouteLocation1stYard', 'Yard']),
                                    plannedMty: getVal(['Measures Planned Mty TEU', 'Planned Mty']),
                                    actualMty: getVal(['Measures Actual Mty TEU', 'Actual Mty']),
                                    polMaxLdn: getVal(['POL Max Laden TEU', 'POL Max Laden']),
                                    polLdnThresh: getVal(['POL Laden Threshold', 'POL Laden Thresh']),
                                    discharge: getVal(['Measures Discharge TEU', 'Discharge']),
                                    peakPolUtilzRaw: getVal(['Measures Peak Pol Utilz', 'Peak Pol Utilz']),
                                    polBkgUtilzRaw: getVal(['Measures POL Booking Utilz', 'POL Booking Utilz']),
                                    maxLdnVsPolBkg: getVal(['Max Laden vs POL  Booking', 'Max Laden vs POL Booking']),
                                    loadableQuant: getVal(['Measures Loadable TEU', 'Loadable Quant', 'Loadable TEU']),
                                    loadableWgt: getVal(['Measures Loadable WGT update', 'Loadable WGT']),
                                    coastalEtd: getVal(['Route Date Coastal ETD Date', 'Coastal ETD Date', 'Coastal ETD']),
                                    portCut: getVal(['Route Date POL Cut/off Date', 'POL Cut/off Date', 'Port Cut']),
                                    sectorRemarks: getVal(['Sector Remarks']),
                                    // Per the real "Avg Max Laden vs Bkg"/"Avg Utilization" DAX measures,
                                    // both reference these two PRE-COMPUTED raw columns directly (SUM of
                                    // the booking one, MAX of the max-laden one) -- not a true row-level
                                    // average of curLaden/maxLdn as previously implemented.
                                    tsAvgBooking: getVal(['Trade Summary Avg Booking']),
                                    tsAvgMaxLdn: getVal(['Trade Summary Avg Max Laden'])
                                };

                                // Per the reference workbook's hidden NOTES sheet: "No PIC on the Max
                                // Laden table will result in a 'TBA' for the SPC PIC." Normalize blank/
                                // whitespace-only PIC here — the earliest point pic is read from the raw
                                // file — so 'TBA' flows through consistently to rawRows, the Detail View,
                                // filteredRawRows (and thus any pivot fed by it), and the existing SPC
                                // Analyst slicer (whose 'TBA' button and matchAnalyst .includes() check
                                // already expect this literal value).
                                rowObj.pic = (rowObj.pic && String(rowObj.pic).trim()) || 'TBA';

                                // Per the confirmed DAX (see activeTotalTeu's comment above): Activity vs
                                // Booking Utilz = DIVIDE(SUM(Measures Active total TEU), Sum of Measures
                                // Laden TEU, 0) -- uses activeTotalTeu directly (not inlandAct+portAct)
                                // over ladenTeu (not inlandTotal+portTotal). This had the wrong
                                // numerator AND denominator before this fix.
                                const activeTotalTeuNum = toNum(rowObj.activeTotalTeu);
                                const ladenTeuNum = toNum(rowObj.ladenTeu);
                                rowObj.actVsBkgUtilzRaw = ladenTeuNum > 0 ? (activeTotalTeuNum / ladenTeuNum) : 0;

                                // RFR Utilz = DIVIDE(Sum of Measures Reefer TEU, Max of Measures BSA
                                // TEU RF, 0) -- rfrBkgTtl is already "Measures Reefer TEU".
                                const rfrBsaTeuRfMax = toNum(rowObj.rfrBsaTeuRfMax);
                                rowObj.rfrUtilizRaw = rfrBsaTeuRfMax > 0 ? (toNum(rowObj.rfrBkgTtl) / rfrBsaTeuRfMax) : 0;


                                return rowObj;
                            });

                            return { ok: true, rows: formattedData };
                        }
                        return { ok: false, error: 'The file appears to be empty.' };
            };

            const processFile = (file) => {
                if (!file) return;

                if (!window.XLSX) {
                    console.error("XLSX library is not loaded.");
                    setParseError("Unable to read the file: the XLSX library failed to load. Please refresh the page and try again.");
                    return;
                }

                const reader = new FileReader();
                reader.onload = (evt) => {
                    try {
                        const bstr = evt.target.result;
                        const wb = window.XLSX.read(bstr, { type: 'binary' });
                        const result = parseWorkbookToRows(wb);
                        if (result.ok) {
                            setRawRows(result.rows);
                            setParseError(null);
                            setAutoFetchError(null);
                            setLastRefresh(new Date());
                            // A manual upload always wins over anything the background
                            // poll had queued -- drop any stale pending-update banner.
                            setNewDataAvailable(false);
                            pendingCsvTextRef.current = null;
                            hasLoadedDataRef.current = true;
                            // This IS the live dataset now -- keep liveRawRowsRef in sync
                            // (see its own comment) and drop out of historical-viewing mode
                            // if it was active, since a genuine new upload should always win
                            // over whatever historical date happened to be on screen.
                            liveRawRowsRef.current = result.rows;
                            setViewingHistoricalDate(null);
                        } else {
                            setParseError(result.error);
                        }
                        if (fileInputRef.current) fileInputRef.current.value = '';
                    } catch (error) {
                        console.error("Error parsing the file:", error);
                        setParseError(`Failed to parse the uploaded file: ${error && error.message ? error.message : 'unknown error'}. Please verify the file is a valid Excel export and try again.`);
                        if (fileInputRef.current) fileInputRef.current.value = '';
                    }
                };
                reader.readAsBinaryString(file);
            };

            const handleFileUpload = (e) => {
                processFile(e.target.files[0]);
            };

            const handleDrop = (e) => {
                e.preventDefault();
                setIsDragging(false);
                if (e.dataTransfer.files && e.dataTransfer.files.length > 0) {
                    processFile(e.dataTransfer.files[0]);
                    e.dataTransfer.clearData();
                }
            };

            // --- Compare tab: load a second, older data file to diff against the
            // current data. Reuses the same pure parseWorkbookToRows() the main
            // upload path uses, so it inherits the same schema validation and
            // getVal() field mapping -- an "old" file is just a normal Booking
            // Flash data export, nothing special about its format.
            const processOldFile = (file) => {
                if (!file) return;
                if (!window.XLSX) {
                    setOldParseError("Unable to read the file: the XLSX library failed to load. Please refresh the page and try again.");
                    return;
                }
                const reader = new FileReader();
                reader.onload = (evt) => {
                    try {
                        const wb = window.XLSX.read(evt.target.result, { type: 'binary' });
                        const result = parseWorkbookToRows(wb);
                        if (result.ok) {
                            setOldRawRows(result.rows);
                            setOldFileName(file.name);
                            setOldParseError(null);
                        } else {
                            setOldParseError(result.error);
                        }
                        if (oldFileInputRef.current) oldFileInputRef.current.value = '';
                    } catch (error) {
                        console.error("Error parsing the old file:", error);
                        setOldParseError(`Failed to parse the file: ${error && error.message ? error.message : 'unknown error'}. Please verify it's a valid Booking Flash export.`);
                        if (oldFileInputRef.current) oldFileInputRef.current.value = '';
                    }
                };
                reader.readAsBinaryString(file);
            };

            const handleOldFileUpload = (e) => {
                processOldFile(e.target.files[0]);
            };

            const clearOldFile = () => {
                setOldRawRows([]);
                setOldFileName(null);
                setOldParseError(null);
            };

            // --- Historical Data (2026-09-01): view any past day's export as the live
            // report, or compare two past days, from HISTORICAL_DATA_CSV_URL's rolling
            // daily-snapshot archive -- see that constant's own comment for the source
            // shape and DATA_ARCHITECTURE.md for the parsed field mapping.

            // Record Date normalization: SheetJS's CSV reader auto-detects this column
            // as a date type (its raw text, e.g. "2026-08-24", looks like a date to it)
            // and reformats it via sheet_to_json's raw:false default short-date display
            // ("8/24/26"), NOT the original ISO string in the file -- confirmed live
            // against the real published link (ws['A2'] comes back {t:'n', v:46258,
            // w:"8/24/26"}). Grouping/sorting/displaying by that short-date string would
            // be wrong once single- and double-digit days mix (plain string sort puts
            // "8/9/26" after "8/10/26", not before it) -- so a parallel raw:true pass
            // recovers the underlying Excel date serial and this converts it back to a
            // stable, correctly-sortable 'YYYY-MM-DD' key via XLSX.SSF.parse_date_code
            // (the same SSF module SheetJS itself uses to build that "8/24/26" display
            // string, just applied with a format this app controls instead of SheetJS's
            // default). Falls back to the plain string value on anything that isn't a
            // date-typed cell, so a future export where this column somehow ISN'T
            // auto-detected as a date still groups/sorts correctly on its literal text.
            const normalizeRecordDate = (value) => {
                if (typeof value === 'number' && window.XLSX && window.XLSX.SSF && window.XLSX.SSF.parse_date_code) {
                    const d = window.XLSX.SSF.parse_date_code(value);
                    if (d && d.y) {
                        const pad = (n) => String(n).padStart(2, '0');
                        return `${d.y}-${pad(d.m)}-${pad(d.d)}`;
                    }
                }
                return String(value || '').trim();
            };

            // Fetch + group the archive once on mount (see the effect below) -- this is
            // a manually-triggered feature (a user has to open the popover and pick a
            // date), not something needing CSV_SOURCE_URL's 5-minute poll, so there's
            // no interval here, just an initial load plus the "Refresh Historical List"
            // button in the popover for whenever Hoa has appended a new day since the
            // page loaded.
            const fetchHistoricalData = async () => {
                if (!isHistoricalCsvSourceConfigured()) return;
                try {
                    const res = await fetch(HISTORICAL_DATA_CSV_URL, { cache: 'no-store' });
                    if (!res.ok) throw new Error(`Fetch failed with status ${res.status}`);
                    const csvText = await res.text();
                    const wb = window.XLSX.read(csvText, { type: 'string' });
                    const ws = wb.Sheets[wb.SheetNames[0]];
                    const rawData = window.XLSX.utils.sheet_to_json(ws, { raw: false, defval: '' });
                    // "Record Date" is the one column in this archive that ISN'T part of
                    // the normal 97-column Data_download schema -- it's how a single
                    // published Sheet holds many days' worth of rows at all. getVal()
                    // inside parseWorkbookToRows only ever pulls fields it's told to look
                    // for by name, so this extra column is simply never referenced once a
                    // date's rows are handed to it below -- confirmed safe, not a landmine
                    // risk the way an aliased column would be (see DATA_ARCHITECTURE.md's
                    // Class E). rawDateOnly is the raw:true parallel pass normalizeRecordDate
                    // above needs -- same row order as rawData, so they're zipped by index.
                    const rawDateOnly = window.XLSX.utils.sheet_to_json(ws, { raw: true, defval: '' });
                    const grouped = {};
                    rawData.forEach((row, i) => {
                        const rawValue = rawDateOnly[i] ? rawDateOnly[i]['Record Date'] : row['Record Date'];
                        const d = normalizeRecordDate(rawValue);
                        if (!d) return;
                        if (!grouped[d]) grouped[d] = [];
                        grouped[d].push(row);
                    });
                    setHistoricalRowsByDate(grouped);
                    setHistoricalDates(Object.keys(grouped).sort().reverse()); // newest first
                    setHistoricalFetchError(null);
                    historicalParsedCacheRef.current = {}; // stale now -- a refresh may have changed a date's rows
                } catch (err) {
                    console.error('Historical data fetch failed:', err);
                    setHistoricalFetchError(err.message);
                }
            };

            useEffect(() => {
                fetchHistoricalData();
                // eslint-disable-next-line react-hooks/exhaustive-deps
            }, []);

            // Parses one historical date's row slice through the SAME parseWorkbookToRows
            // every other loading path uses -- built from that date's raw rows via
            // SheetJS's json_to_sheet/book_new, the same round trip a real single-day
            // CSV upload would go through -- so every getVal() alias/computed field this
            // app already gets right (Broken Routes aggregation, RFR Utiliz % recompute,
            // POL column, etc.) applies identically here, never a second parallel
            // implementation that could quietly drift from the real one. Cached per date
            // in historicalParsedCacheRef so flipping back and forth between the same
            // date(s) doesn't reparse ~1,000 rows on every click.
            const getParsedHistoricalRows = (date) => {
                if (historicalParsedCacheRef.current[date]) return historicalParsedCacheRef.current[date];
                const rowsForDate = historicalRowsByDate[date];
                if (!rowsForDate || rowsForDate.length === 0) {
                    return { ok: false, error: `No historical rows found for ${date}.` };
                }
                const ws = window.XLSX.utils.json_to_sheet(rowsForDate);
                const wb = window.XLSX.utils.book_new();
                window.XLSX.utils.book_append_sheet(wb, ws, 'Sheet1');
                const result = parseWorkbookToRows(wb);
                if (result.ok) historicalParsedCacheRef.current[date] = result;
                return result;
            };

            // "View this date" -- swaps rawRows to one historical day's parsed snapshot
            // so all 4 visible tabs render exactly as if that day's export had been
            // uploaded. Deliberately does NOT touch liveRawRowsRef (see its own comment
            // above) -- only processFile/applyCsvText ever do, so it always holds the
            // true live/manual dataset no matter how many historical dates get viewed.
            const viewHistoricalDate = (date) => {
                const result = getParsedHistoricalRows(date);
                if (result.ok) {
                    setRawRows(result.rows);
                    setViewingHistoricalDate(date);
                    setHistoricalFetchError(null);
                } else {
                    setHistoricalFetchError(result.error);
                }
            };

            // "Back to Live" -- restores whatever the live/manual dataset actually was
            // before any historical date was viewed.
            const backToLiveData = () => {
                setRawRows(liveRawRowsRef.current);
                setViewingHistoricalDate(null);
            };

            // "Compare These Two Dates" -- feeds two historical snapshots into the
            // EXISTING Compare tab/oldRawRows mechanism (see compareData above) instead
            // of building a second, parallel diff view: Snapshot A becomes oldRawRows
            // (the "old" side of that existing diff), Snapshot B becomes rawRows (the
            // "current" side), then jumps straight to the Compare tab. oldFileName is
            // repurposed to say which historical date is standing in for the "old
            // file" -- the Compare tab's render (unchanged) already displays whatever's
            // in oldFileName, so no new UI is needed there. The manual "old file"
            // upload/Change File/Clear affordances keep working exactly as before
            // afterward -- this only seeds the two states once, it doesn't replace
            // their normal lifecycle.
            const compareHistoricalDates = (dateA, dateB) => {
                const resultA = getParsedHistoricalRows(dateA);
                if (!resultA.ok) { setHistoricalFetchError(resultA.error); return; }
                const resultB = getParsedHistoricalRows(dateB);
                if (!resultB.ok) { setHistoricalFetchError(resultB.error); return; }
                setOldRawRows(resultA.rows);
                setOldFileName(`Historical snapshot: ${dateA}`);
                setOldParseError(null);
                setRawRows(resultB.rows);
                setViewingHistoricalDate(dateB);
                setHistoricalFetchError(null);
                setActiveTab('compare');
                setHistoricalDataOpen(false);
            };

            // --- Automated data refresh (Google Sheet published-CSV link) ------------
            // Looker's own schedule overwrites the Sheet's first tab; this app only
            // ever reads the Sheet's public "Publish to the web" CSV export and never
            // talks to Looker or a Google API directly. See CSV_SOURCE_URL above.

            const fetchCsvText = async () => {
                const res = await fetch(CSV_SOURCE_URL, { cache: 'no-store' });
                if (!res.ok) throw new Error(`Fetch failed with status ${res.status}`);
                return res.text();
            };

            // Parses + applies fetched CSV text immediately (used for the initial load
            // and for the explicit "apply now" actions below) -- NOT used by the silent
            // background poll, which only compares and stashes (see checkForUpdates).
            const applyCsvText = (csvText) => {
                const wb = window.XLSX.read(csvText, { type: 'string' });
                const result = parseWorkbookToRows(wb);
                if (result.ok) {
                    setRawRows(result.rows);
                    setParseError(null);
                    setAutoFetchError(null);
                    setLastRefresh(new Date());
                    setNewDataAvailable(false);
                    pendingCsvTextRef.current = null;
                    lastLoadedCsvTextRef.current = csvText;
                    hasLoadedDataRef.current = true;
                    // Same reasoning as processFile above: this IS the live dataset now,
                    // so re-sync liveRawRowsRef and exit historical-viewing mode if it
                    // was active.
                    liveRawRowsRef.current = result.rows;
                    setViewingHistoricalDate(null);
                }
                return result;
            };

            // Fetches + applies Sector Summary's live source (2026-08-25) -- see
            // SECTOR_DATA_CSV_URL/sectorSourceRows above. Deliberately simpler than
            // applyCsvText: no schema validation (this is a small, single-purpose
            // sheet, not a general upload target) and no banner-gating (nothing to
            // protect a user's in-progress view from), just fetch, parse, apply. A
            // failure leaves sectorSourceRows exactly as it was (the last successful
            // fetch, or the SECTOR_DATA_SEED fallback if there's never been one) --
            // never blanks the pivot over a transient network hiccup.
            const fetchAndApplySectorData = async () => {
                if (!isSectorCsvSourceConfigured()) return;
                try {
                    const res = await fetch(SECTOR_DATA_CSV_URL, { cache: 'no-store' });
                    if (!res.ok) throw new Error(`Fetch failed with status ${res.status}`);
                    const csvText = await res.text();
                    const wb = window.XLSX.read(csvText, { type: 'string' });
                    const ws = wb.Sheets[wb.SheetNames[0]];
                    const rows = window.XLSX.utils.sheet_to_json(ws, { raw: false, defval: '' });
                    if (rows && rows.length > 0) {
                        setSectorSourceRows(rows);
                        setSectorFetchError(null);
                    }
                } catch (err) {
                    console.error('Sector data fetch failed:', err);
                    setSectorFetchError(err.message);
                }
            };

            // Initial load: try the published Sheet once on mount. Falls back to the
            // ordinary upload dropzone (with a plain-language error) if it fails --
            // rawRows just stays empty, which is the same "please upload" gate that
            // already existed before auto-refresh was added. Sector data is fetched
            // in parallel, independently -- its own failure doesn't block or get
            // blocked by the main data's load path.
            useEffect(() => {
                fetchAndApplySectorData();
                if (!isCsvSourceConfigured()) return;
                let cancelled = false;
                (async () => {
                    try {
                        const csvText = await fetchCsvText();
                        if (cancelled) return;
                        const result = applyCsvText(csvText);
                        if (!result.ok) setAutoFetchError(result.error);
                    } catch (err) {
                        if (cancelled) return;
                        console.error('Initial data fetch failed:', err);
                        setAutoFetchError(`Couldn't load data automatically (${err.message}). Upload a file manually below, or click Refresh once the connection is back.`);
                    }
                })();
                return () => { cancelled = true; };
                // eslint-disable-next-line react-hooks/exhaustive-deps
            }, []);

            // Background polling: every POLL_INTERVAL_MS, check whether the published
            // CSV has changed. Per Kevin's chosen refresh UX, this NEVER swaps rawRows
            // out from under someone who's mid-filter -- it only raises the
            // "New data available" banner (newDataAvailable) for them to click. The
            // one exception is if nothing has successfully loaded yet at all (e.g. the
            // initial fetch failed and the user hasn't uploaded manually either) --
            // then there's no in-progress view to protect, so it applies directly.
            useEffect(() => {
                if (!isCsvSourceConfigured()) return;
                const checkForUpdates = async () => {
                    setIsCheckingForUpdates(true);
                    try {
                        const csvText = await fetchCsvText();
                        if (!hasLoadedDataRef.current) {
                            // Nothing loaded via ANY path yet -- no in-progress view to
                            // protect, so apply directly instead of showing a banner
                            // nobody has data to compare against.
                            applyCsvText(csvText);
                        } else if (csvText !== lastLoadedCsvTextRef.current) {
                            pendingCsvTextRef.current = csvText;
                            setNewDataAvailable(true);
                        }
                    } catch (err) {
                        // Silent -- a transient network hiccup on a background check
                        // shouldn't interrupt someone who already has data loaded.
                        console.error('Background refresh check failed:', err);
                    } finally {
                        setIsCheckingForUpdates(false);
                    }
                };
                const intervalId = setInterval(checkForUpdates, POLL_INTERVAL_MS);
                return () => clearInterval(intervalId);
                // eslint-disable-next-line react-hooks/exhaustive-deps
            }, []);

            // Sector data's own background poll -- deliberately a separate interval
            // from the main data's above rather than piggybacking on it, so this
            // source's schedule/failure is never coupled to whether the MAIN source
            // happens to be configured. Same POLL_INTERVAL_MS cadence (no reason for
            // it to differ), applies directly every tick (see fetchAndApplySectorData
            // above for why no banner-gating is needed here).
            useEffect(() => {
                if (!isSectorCsvSourceConfigured()) return;
                const intervalId = setInterval(fetchAndApplySectorData, POLL_INTERVAL_MS);
                return () => clearInterval(intervalId);
                // eslint-disable-next-line react-hooks/exhaustive-deps
            }, []);

            // "New data available" banner click -- applies what the background poll
            // already fetched and stashed, no extra round-trip.
            const applyPendingUpdate = () => {
                if (pendingCsvTextRef.current) {
                    applyCsvText(pendingCsvTextRef.current);
                }
            };

            // Manual "Refresh now" -- an explicit user action, so (unlike the passive
            // background poll) it fetches AND applies immediately. Refreshes sector
            // data too (fetchAndApplySectorData gates on its own
            // isSectorCsvSourceConfigured(), independent of the main source's), since
            // there's only the one button and a user clicking it means "refresh
            // everything," not just the main table.
            const handleManualRefresh = async () => {
                fetchAndApplySectorData();
                if (!isCsvSourceConfigured()) return;
                setIsCheckingForUpdates(true);
                try {
                    const csvText = await fetchCsvText();
                    const result = applyCsvText(csvText);
                    if (!result.ok) setAutoFetchError(result.error);
                } catch (err) {
                    console.error('Manual refresh failed:', err);
                    setAutoFetchError(`Refresh failed (${err.message}). Please try again, or upload a file manually.`);
                } finally {
                    setIsCheckingForUpdates(false);
                }
            };

            const exportToExcel = () => {
                if (!window.XLSX || !activeTabContentRef.current) return;
                // Scope to the active tab's own container (not the whole document) and
                // export every table found there -- some tabs (e.g. Sector_Summary) render
                // multiple side-by-side tables, and picking only the first would silently
                // drop the rest.
                const tables = activeTabContentRef.current.querySelectorAll('table');
                if (tables.length === 0) return;
                const wb = XLSX.utils.book_new();
                tables.forEach((table, i) => {
                    const caption = table.querySelector('caption');
                    const rawName = (caption && caption.textContent.trim()) || `Table ${i + 1}`;
                    const sheetName = rawName.replace(/[\\/?*[\]:]/g, ' ').slice(0, 31) || `Table ${i + 1}`;
                    const ws = XLSX.utils.table_to_sheet(table);
                    XLSX.utils.book_append_sheet(wb, ws, sheetName);
                });
                XLSX.writeFile(wb, `${activeTab}_export.xlsx`);
            };

            // Exports just the Analyze modal's summary (not the whole table -- that's what the
            // main Export button above is for) as its own small workbook.
            const exportAnalysisToExcel = () => {
                if (!window.XLSX || !serviceLaneAnalysis) return;
                const rows = [
                    {
                        [serviceLaneAnalysis.groupLabel]: 'OVERALL',
                        'Avg Utilization %': Math.round(serviceLaneAnalysis.overall.utilization),
                        'Avg Peak Utilization %': '',
                        'Avg Wkly Capacity (Max Laden)': Math.round(serviceLaneAnalysis.overall.capacity),
                        'Avg Wkly Laden': Math.round(serviceLaneAnalysis.overall.laden),
                        'Avg Wkly Shortfall': Math.round(serviceLaneAnalysis.overall.shortfall)
                    },
                    ...serviceLaneAnalysis.groups.map(g => ({
                        [serviceLaneAnalysis.groupLabel]: g.group,
                        'Avg Utilization %': Math.round(g.avgUtilization),
                        'Avg Peak Utilization %': Math.round(g.avgPeakUtilization),
                        'Avg Wkly Capacity (Max Laden)': Math.round(g.avgWklyMaxLdn),
                        'Avg Wkly Laden': Math.round(g.avgWklyLaden),
                        'Avg Wkly Shortfall': Math.round(g.avgWklyShortfall)
                    }))
                ];
                // Same caveat as the modal's own on-screen note next to "Breakdown by POL" (2026-08-26
                // math audit) -- a user pulling this into Excel and summing the per-POL capacity
                // column by hand would get a materially wrong total (POL:Lane is many-to-many, so
                // per-POL capacity isn't additive) with nothing here to warn them otherwise. A blank
                // spacer + a note row (not a cell comment, so it survives any spreadsheet tool, not
                // just Excel) keeps the numeric columns above it clean for anyone charting/summing
                // just the OVERALL + per-group rows without noticing extra text mixed in.
                if (serviceLaneAnalysis.groupLabel === 'POL') {
                    rows.push({ [serviceLaneAnalysis.groupLabel]: '' });
                    rows.push({ [serviceLaneAnalysis.groupLabel]: "Note: a single Lane can span multiple POLs, so the per-POL capacity figures above don't sum to the OVERALL row -- that total is computed by Lane, not by POL." });
                }
                const ws = XLSX.utils.json_to_sheet(rows);
                const wb = XLSX.utils.book_new();
                XLSX.utils.book_append_sheet(wb, ws, 'Service Lane Analysis'.slice(0, 31));
                const weekTag = String(serviceLaneAnalysis.weekRange).replace(/[^\w]+/g, '_');
                XLSX.writeFile(wb, `${activeTab}_analysis_${weekTag}.xlsx`);
            };

            const toggleFilter = (setState, value) => {
                setState(prev => prev.includes(value) ? prev.filter(v => v !== value) : [...prev, value]);
            };

            // Closes the Analyze modal AND resets its own Sale Week selector back to the
            // default ("last 4 weeks") for next time it's opened -- see analysisSelectedWeeks
            // above for why. Used by every close affordance (backdrop click, ×, Close
            // Analysis) instead of calling setAnalysisModalOpen(false) directly.
            const closeAnalysisModal = () => {
                setAnalysisModalOpen(false);
                setAnalysisSelectedWeeks([]);
            };

            const clearSlicers = () => {
                setSelectedSubTrades([]);
                setSelectedAnalysts([]);
                setSelectedCoasts([]);
                setSelectedLanes([]);
                setSelectedSaleWeeks([]);
                setSelectedYards([]);
                setSelectedApStatuses([]);
                setHeaderFilters({});
                setYardSearchText('');
                setSaleWeekSearchText('');
            };

            // Distinct Sale Week values present in the uploaded data (dedup'd, blanks
            // dropped), ordered chronologically via compareSaleWeek rather than the
            // default lexicographic Array.sort — mirrors Excel's
            // Slicer_Route_Date_1st_Sale_Week, which lists weeks in date order.
            const saleWeekOptions = useMemo(() => {
                const seen = new Set();
                rawRows.forEach(row => {
                    const week = row.saleWeek;
                    if (week !== undefined && week !== null && String(week).trim() !== '') {
                        seen.add(String(week).trim());
                    }
                });
                return Array.from(seen).sort(compareSaleWeek);
            }, [rawRows]);

            // Drives selectedSaleWeeks from the Sale Week slicer's own type-to-filter
            // box (2026-08-25, same partial-match pattern as the Yard slicer above --
            // Kevin: "I should be just [able] to type the week number and the weeks
            // should show up"). Typing e.g. "27" selects every week whose label
            // contains that text (just "2026/W27" here since no other week number
            // contains "27" as a substring), so a whole sale week can be grabbed
            // without hunting for its button. Selection is driven by this effect
            // (not the input's onChange) so a search matching zero weeks correctly
            // filters down to zero rows instead of being treated as "no filter" --
            // same '__NO_MATCH__' sentinel reasoning as the Yard effect below.
            useEffect(() => {
                if (!saleWeekSearchText || saleWeekSearchText.trim() === '') {
                    setSelectedSaleWeeks([]);
                    return;
                }
                const searchLower = saleWeekSearchText.trim().toLowerCase();
                const matchingWeeks = saleWeekOptions.filter(week =>
                    String(week).toLowerCase().includes(searchLower)
                );
                if (matchingWeeks.length > 0) {
                    setSelectedSaleWeeks(matchingWeeks);
                } else {
                    setSelectedSaleWeeks(['__NO_MATCH__']);
                }
            }, [saleWeekSearchText, saleWeekOptions]);

            // Yard codes (e.g. USLAX06) are open-ended data values rather than a fixed
            // small vocabulary like Coast/Sub Trade, so unlike those hardcoded slicer
            // option lists, the Yard slicer's options are derived from the distinct
            // values actually present in the uploaded data.
            const availableYards = useMemo(() => {
                const set = new Set();
                rawRows.forEach(row => {
                    // "NO N.A. CALL" (2026-08-26, per Kevin: "don't include NO N.A. CALL in the
                    // slicer") -- a real value in the raw Yard column (rows with no actual North
                    // America call), but not something worth a slicer button for. Excluded here
                    // only -- rows carrying it are untouched everywhere else (still render,
                    // still match an empty/no-selection Yard filter).
                    if (row.yard && row.yard.trim().toUpperCase() !== 'NO N.A. CALL') set.add(row.yard);
                });
                return Array.from(set).sort();
            }, [rawRows]);

            // Sub Trade / Coast / SPC Analyst / Lane (2026-08-26, Kevin: "there should be
            // data for new lanes on the backend... they should be auto added to the
            // report/tables/slicers... the same goes for everything else... as analysts
            // change and lanes change"). These 4 slicers used to be hardcoded literal
            // arrays -- a real business change (a new Lane, a new SPC Analyst added to the
            // roster) would silently need a code change to ever get a filter button, even
            // though the underlying rows were already flowing through every table
            // unfiltered. Switched to the same derive-from-the-uploaded-data pattern
            // saleWeekOptions/availableYards already used, so new values show up
            // automatically on the next upload/refresh -- no code change needed.
            //
            // Each preserves its prior on-screen order (verified: Sub Trade/Lane/SPC
            // Analyst's old hardcoded lists were already alphabetical, so a plain .sort()
            // reproduces them exactly; Coast's wasn't -- "WC" before "EC" -- kept via
            // COAST_PREFERRED_ORDER, any future coast not in that list still appends after
            // rather than being dropped).
            const availableSubTrades = useMemo(() => {
                const set = new Set();
                rawRows.forEach(row => { if (row.subTrade) set.add(row.subTrade); });
                return Array.from(set).sort();
            }, [rawRows]);

            const COAST_PREFERRED_ORDER = ['WC', 'EC'];
            const availableCoasts = useMemo(() => {
                const set = new Set();
                rawRows.forEach(row => { if (row.coast) set.add(row.coast); });
                const known = COAST_PREFERRED_ORDER.filter(c => set.has(c));
                const extra = Array.from(set).filter(c => !COAST_PREFERRED_ORDER.includes(c)).sort();
                return [...known, ...extra];
            }, [rawRows]);

            // PIC (e.g. "Evan / Alex") is a compound "SPC / MKG" field -- the SPC Analyst
            // slicer only ever matched/showed the SPC (left) half. A standalone value with
            // no "/" is ambiguous (could be an SPC-only or MKG-only entry) and was never
            // offered as a button before this either, so it's still skipped here rather
            // than guessed at.
            const availableAnalysts = useMemo(() => {
                const set = new Set();
                rawRows.forEach(row => {
                    const raw = String(row.pic || '').trim();
                    if (!raw.includes('/')) return;
                    const spc = raw.split('/')[0].trim();
                    if (spc) set.add(spc);
                });
                return Array.from(set).sort();
            }, [rawRows]);

            const availableLanes = useMemo(() => {
                const set = new Set();
                rawRows.forEach(row => { if (row.lane) set.add(row.lane); });
                return Array.from(set).sort();
            }, [rawRows]);

            // Drives selectedYards from the Yard slicer's partial-match search box
            // (2026-08-24, matching VERSION_1.75_WORKING). Clearing the box clears
            // the selection entirely. A search that matches zero yards selects a
            // nonexistent sentinel ('__NO_MATCH__') rather than leaving selectedYards
            // empty -- matchYard below (and toggleFilter's isFilterActive checks)
            // treat an empty selectedYards as "no filter applied" (show every row),
            // so a genuinely empty *result set* needs a selection that can never
            // match any real row instead.
            useEffect(() => {
                if (!yardSearchText || yardSearchText.trim() === '') {
                    setSelectedYards([]);
                    return;
                }
                const searchLower = yardSearchText.trim().toLowerCase();
                const matchingYards = availableYards.filter(yard =>
                    String(yard).toLowerCase().includes(searchLower)
                );
                if (matchingYards.length > 0) {
