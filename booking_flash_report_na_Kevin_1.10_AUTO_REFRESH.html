                    setSelectedYards(matchingYards);
                } else {
                    setSelectedYards(['__NO_MATCH__']);
                }
            }, [yardSearchText, availableYards]);

            const filteredRawRows = useMemo(() => {
                return rawRows.filter(row => {
                    const matchSubTrade = selectedSubTrades.length === 0 || selectedSubTrades.includes(row.subTrade);
                    const matchAnalyst = selectedAnalysts.length === 0 || selectedAnalysts.some(analyst =>
                        row.pic && row.pic.toLowerCase().includes(analyst.toLowerCase())
                    );
                    const matchLane = selectedLanes.length === 0 || selectedLanes.includes(row.lane);
                    const matchCoast = selectedCoasts.length === 0 || selectedCoasts.includes(row.coast);
                    const matchSaleWeek = selectedSaleWeeks.length === 0 || selectedSaleWeeks.includes(row.saleWeek);
                    // Yard slicer is hidden on the Booking Flash (Detail View) tab (2026-08-24,
                    // "the POL will be really needed [there]" -- Kevin/Adam) -- don't let a
                    // selection made earlier on another tab silently keep filtering Detail's
                    // rows once its own toggle buttons are gone from view.
                    const matchYard = activeTab === 'detail' || selectedYards.length === 0 || selectedYards.includes(row.yard);
                    const matchApStatus = selectedApStatuses.length === 0 || selectedApStatuses.includes(row.status);

                    let matchHeaderFilters = true;
                    for (const key in headerFilters) {
                        const filterValue = headerFilters[key];
                        if (filterValue && filterValue.trim() !== '') {
                            const rawRowVal = String(row[key] || '').toLowerCase();
                            const searchVal = filterValue.toLowerCase().trim();
                            
                            const cleanedRowVal = rawRowVal.replace(/[,%()]/g, '');
                            const cleanedSearchVal = searchVal.replace(/[,%()]/g, '');
                            
                            if (!rawRowVal.includes(searchVal) && !cleanedRowVal.includes(cleanedSearchVal)) {
                                matchHeaderFilters = false;
                                break;
                            }
                        }
                    }
                    return matchSubTrade && matchAnalyst && matchLane && matchCoast && matchSaleWeek && matchYard && matchApStatus && matchHeaderFilters;
                });
            }, [rawRows, selectedSubTrades, selectedAnalysts, selectedLanes, selectedCoasts, selectedSaleWeeks, selectedYards, selectedApStatuses, headerFilters, activeTab]);

            // POL Booking Flash column auto-fit (2026-08-26, Kevin: "the trade summary table can
            // auto-fit the columns as well" -- referencing Trade Summary's existing auto-fit,
            // which this tab (a hand-built table, not a PivotTableViewer instance) never had --
            // only manual drag-resize via startPolColResize/polColWidths. Same mechanism as
            // PivotTableViewer's own auto-fit effect (see its comment for the full rationale):
            // every `[data-autofit-col]`-tagged header/body cell is measured via
            // measureRenderedTextWidth (the Range API, real rendered content width, independent
            // of the cell's own possibly-stretched box), the widest cell per column key wins, and
            // that becomes the column's width unless the user has manually dragged it
            // (manualPolColWidthKeysRef, checked/populated the same way PivotTableViewer's
            // manualColWidthKeysRef is). AUTO_FIT_PADDING/AUTO_FIT_MIN match PivotTableViewer's own
            // constants for visual consistency across every auto-fit table in the app.
            //
            // Placed here (after filteredRawRows, not next to polColWidths' own declaration much
            // earlier in this component) because its dependency array needs filteredRawRows
            // in scope -- same ordering constraint the tableAreaMaxHeight effect above already
            // documents for a different piece of state.
            //
            // Gated on `activeTab === 'pol_booking'` internally (not on the dependency array,
            // which needs to look the same shape every render per the Rules of Hooks) so it's a
            // no-op with nothing to measure on every other tab, and naturally re-runs the moment
            // the user switches back to this tab (activeTab is itself a dependency).
            useLayoutEffect(() => {
                if (activeTab !== 'pol_booking') return;
                const container = polTableContainerRef.current;
                if (!container) return;
                const cells = container.querySelectorAll('[data-autofit-col]');
                const maxByKey = {};
                cells.forEach(el => {
                    const key = el.getAttribute('data-autofit-col');
                    const w = measureRenderedTextWidth(el);
                    if (!(key in maxByKey) || w > maxByKey[key]) maxByKey[key] = w;
                });
                const AUTO_FIT_PADDING = 22;
                const AUTO_FIT_MIN = 40;
                setPolColWidths(prev => {
                    let changed = false;
                    const next = { ...prev };
                    Object.keys(maxByKey).forEach(key => {
                        if (manualPolColWidthKeysRef.current.has(key)) return;
                        const target = Math.ceil(Math.max(AUTO_FIT_MIN, maxByKey[key] + AUTO_FIT_PADDING));
                        if (Math.abs((prev[key] || 0) - target) > 1) {
                            next[key] = target;
                            changed = true;
                        }
                    });
                    return changed ? next : prev;
                });
            }, [activeTab, filteredRawRows, reeferHidden, activityHidden, etaHidden, opIssuesHidden, vcoHidden]);

            // Compare tab data (2026-08-19): diffs oldRawRows (an uploaded "old"
            // data file) against rawRows (whatever's currently loaded -- via
            // auto-refresh, manual upload, or a prior file). Deliberately compares
            // the FULL datasets, not filteredRawRows -- a snapshot-to-snapshot diff
            // shouldn't be silently narrowed by whatever slicer state another tab
            // happens to be in.
            //
            // Bookings are matched by VVD + POL -- the same grain POL_Booking_Flash
            // already treats as a unique leaf (one raw row per VVD+POL pair,
            // confirmed elsewhere in this project). A row missing either half of
            // that key is excluded from matching entirely (never spuriously
            // "matched" to an unrelated row via two blank keys colliding) -- and,
            // since keyOf() returns null for it, never inserted into oldByKey/
            // newByKey at all, so it doesn't appear in ANY of the three buckets
            // below either (not added, not removed, not changed -- corrected
            // 2026-08-26; a prior version of this comment claimed it "can still
            // show up as added/removed," which the code doesn't actually do).
            // Confirmed harmless on real data (2026-08-26 audit): every blank-key
            // row seen in two real exports was a VVD='VMS' placeholder spacer row
            // (a documented non-booking pattern elsewhere in this app), so silently
            // excluding them here is the desired behavior in practice -- but a
            // future export with a genuine booking row missing only its POL would
            // vanish from this tab entirely rather than surfacing as added/removed.
            const compareData = useMemo(() => {
                if (rawRows.length === 0 || oldRawRows.length === 0) return null;

                const keyOf = (row) => {
                    const vvd = String(row.vvd || '').trim();
                    const pol = String(row.pol || '').trim();
                    return (vvd && pol) ? `${vvd}|${pol}` : null;
                };

                const oldByKey = new Map();
                oldRawRows.forEach(row => { const k = keyOf(row); if (k && !oldByKey.has(k)) oldByKey.set(k, row); });
                const newByKey = new Map();
                rawRows.forEach(row => { const k = keyOf(row); if (k && !newByKey.has(k)) newByKey.set(k, row); });

                // Curated to the fields an ops user would actually care about
                // changing -- not every raw field, which would make routine
                // rounding/formatting noise look like a meaningful change.
                const TRACKED_FIELDS = [
                    { key: 'statusDisplay', label: 'Status', type: 'text' },
                    { key: 'pic', label: 'PIC', type: 'text' },
                    { key: 'vessel', label: 'Vessel', type: 'text' },
                    { key: 'maxLdn', label: 'Max Laden', type: 'number' },
                    { key: 'curLaden', label: 'Current Laden', type: 'number' },
                    { key: 'curUtilRaw', label: 'Booking Utilz', type: 'percent' },
                    { key: 'peakUtilRaw', label: 'Peak Utilz', type: 'percent' },
                ];
                const fieldVal = (row, field) => {
                    if (field.type === 'text') return String(row[field.key] || '').trim();
                    if (field.type === 'percent') return Math.round(getPercentNum(row[field.key]));
                    return Math.round(toNum(row[field.key]));
                };
                const formatFieldVal = (row, field) => {
                    if (field.type === 'text') return String(row[field.key] || '').trim() || '—';
                    if (field.type === 'percent') return `${Math.round(getPercentNum(row[field.key]))}%`;
                    return formatNumberWithCommas(toNum(row[field.key]));
                };
                const identity = (row) => ({
                    trade: row.trade, subTrade: row.subTrade, lane: row.lane,
                    saleWeek: row.saleWeek, vvd: row.vvd, pol: row.pol, vessel: row.vessel,
                });

                const added = [];
                const removed = [];
                const changed = [];

                newByKey.forEach((newRow, key) => {
                    if (!oldByKey.has(key)) added.push(identity(newRow));
                });
                oldByKey.forEach((oldRow, key) => {
                    if (!newByKey.has(key)) {
                        removed.push(identity(oldRow));
                        return;
                    }
                    const newRow = newByKey.get(key);
                    const diffs = TRACKED_FIELDS
                        .filter(f => fieldVal(oldRow, f) !== fieldVal(newRow, f))
                        .map(f => ({ label: f.label, oldVal: formatFieldVal(oldRow, f), newVal: formatFieldVal(newRow, f) }));
                    if (diffs.length > 0) changed.push({ ...identity(newRow), diffs });
                });

                // Overall snapshot per dataset: Max Laden = sum of each distinct
                // lane's own max (the same by-lane-max-then-sum invariant as
                // laneAwareMaxLdn/the Analyze modal's Overall Snapshot, generalized
                // across the whole dataset with no Trade/SubTrade split); Laden =
                // straight sum. Booking count is the raw row count of that dataset
                // (not the matched-key count), so it reflects exactly what was
                // uploaded/loaded, including any rows that couldn't be matched.
                // Both independently verified correct (2026-08-26, by hand against
                // both raw source files) -- kept exactly as-is below.
                const overallSnapshot = (rows) => {
                    const byLane = {};
                    let ladenSum = 0;
                    rows.forEach(row => {
                        const lane = row.lane || '(blank)';
                        const v = toNum(row.maxLdn);
                        if (!(lane in byLane) || v > byLane[lane]) byLane[lane] = v;
                        ladenSum += toNum(row.ladenTeu);
                    });
                    const maxLdnSum = Object.values(byLane).reduce((s, v) => s + v, 0);

                    // Utilization needs the SAME time granularity on both sides of the
                    // ratio, unlike maxLdnSum/ladenSum above -- found 2026-08-26:
                    // dividing ladenSum (a multi-week CUMULATIVE booking total, ~17
                    // weeks' worth) by maxLdnSum (each lane's single PEAK-week capacity,
                    // summed) inflated this to 394-396% on real data, a temporal-scope
                    // mismatch, not a real utilization reading. Mirrors
                    // serviceLaneAnalysis's own already-correct methodology (the Analyze
                    // modal, see its own comment above): per lane, average each week's
                    // own max/laden across that lane's weeks, THEN sum those per-lane
                    // averages across lanes -- "average weekly demand" vs. "average
                    // weekly capacity" at the same granularity, not peak-vs-cumulative.
                    const byLaneWeek = {};
                    rows.forEach(row => {
                        const lane = row.lane || '(blank)';
                        const key = `${lane}|${row.saleWeek || '(blank)'}`;
                        if (!byLaneWeek[key]) byLaneWeek[key] = { lane, maxLdn: 0, laden: 0 };
                        byLaneWeek[key].maxLdn = Math.max(byLaneWeek[key].maxLdn, toNum(row.maxLdn));
                        byLaneWeek[key].laden += toNum(row.ladenTeu);
                    });
                    const weeklyByLane = {};
                    Object.values(byLaneWeek).forEach(bucket => {
                        if (!weeklyByLane[bucket.lane]) weeklyByLane[bucket.lane] = [];
                        weeklyByLane[bucket.lane].push(bucket);
                    });
                    let avgWklyCapacitySum = 0, avgWklyLadenSum = 0;
                    Object.values(weeklyByLane).forEach(weeks => {
                        const n = weeks.length;
                        avgWklyCapacitySum += weeks.reduce((s, w) => s + w.maxLdn, 0) / n;
                        avgWklyLadenSum += weeks.reduce((s, w) => s + w.laden, 0) / n;
                    });

                    return {
                        maxLdn: maxLdnSum,
                        laden: ladenSum,
                        utilz: avgWklyCapacitySum > 0 ? Math.round((avgWklyLadenSum / avgWklyCapacitySum) * 100) : 0,
                        bookingCount: rows.length,
                    };
                };

                return {
                    added, removed, changed,
                    oldSnapshot: overallSnapshot(oldRawRows),
                    newSnapshot: overallSnapshot(rawRows),
                };
            }, [rawRows, oldRawRows]);

            // "Analyze" button data (2026-08-14): summarizes how the currently-visible service
            // lane(s) (Booking Flash tab) or POL/port(s) (POL_Booking_Flash tab) are performing,
            // scoped to the last 4 distinct Sale Weeks present in the CURRENT filter set (not a
            // fixed calendar window -- if the user has already filtered to specific weeks, those
            // are what "last 4" is computed from). Both tabs use the same underlying booking
            // fields (maxLdn/ladenTeu/peakUtilRaw) -- only the *breakdown* dimension changes
            // (Lane vs POL), since POL is a within-lane loading-port breakdown of the same
            // bookings, not a separate metric. Per-group weekly aggregates: weekly Max Laden =
            // MAX across that group+week's rows (a capacity ceiling, not additive within one
            // group); weekly Laden = SUM (total booked that week); then each is averaged across
            // the group's available weeks (up to 4).
            //
            // The Overall Snapshot's capacity/laden/shortfall are DELIBERATELY always computed
            // from a by-LANE grouping, never from the display-breakdown grouping directly --
            // caught live: on POL_Booking_Flash, summing each POL card's own avgWklyMaxLdn
            // quadruple-counted a single lane's capacity (every port under the same lane repeats
            // that lane's own Max Laden, e.g. 4 ports x 3,718 = ~14,870 instead of the real
            // 3,718). Summing distinct LANES' own max is valid (mirrors this app's existing
            // DAX-confirmed "sum of per-Lane max" pattern -- see laneAwareMaxLdn/Trade Summary's
            // Max Laden) since different lanes genuinely have independent capacity. On the
            // Booking Flash tab the breakdown IS by Lane already, so this by-lane overall is
            // identical to what summing the display cards would have given -- no behavior change
            // there, only the POL tab's overall capacity is now correct.
            //
            // Corrected 2026-08-26 (full math audit, Kevin: "make sure all the math works"): a
            // prior version of this comment claimed "POL is a sub-division of one lane's
            // capacity" -- checked directly against the real data and that's false. POL:Lane is
            // many-to-many, not one-to-many (e.g. POL "USLAX" and "USNYC" each appear under 10+
            // distinct lanes in a real export; lane "AT4" alone spans 5 distinct POLs). This
            // doesn't make any number the app DISPLAYS wrong -- the Overall Snapshot's own
            // by-lane grouping above is correct regardless, and exportAnalysisToExcel's "OVERALL"
            // row sources from serviceLaneAnalysis.overall directly, never from summing the
            // per-group rows it also exports, so nothing here self-contradicts. It DOES mean the
            // per-POL cards' own "Avg Wkly Max Laden" values are NOT meaningfully additive across
            // POLs (each POL+week's MAX(maxLdn) is really "the largest capacity among whichever
            // lanes happened to load through this port that week", a cross-lane figure, not a
            // port-intrinsic one) -- confirmed live: summing all 19 POL cards' capacity on an
            // unfiltered file gave 57,137, ~14% over the correct by-lane Overall Snapshot total of
            // 50,123. A user manually totaling the visible/exported per-POL capacity column (a
            // natural thing to do) would get a materially wrong number with no indication why --
            // flagged here so nobody "fixes" the Overall Snapshot to match that sum instead.
            const serviceLaneAnalysis = useMemo(() => {
                if (activeTab !== 'detail' && activeTab !== 'pol_booking') return null;
                const groupKey = activeTab === 'pol_booking' ? 'pol' : 'lane';
                const groupLabel = activeTab === 'pol_booking' ? 'POL' : 'Lane';

                const weeksPresent = Array.from(new Set(
                    filteredRawRows.map(r => r.saleWeek).filter(w => w !== undefined && w !== null && String(w).trim() !== '')
                )).sort(compareSaleWeek);
                // Manual week selection from the modal's own Sale Week selector (2026-08-26)
                // wins when present, intersected with weeksPresent (in chronological order) so
                // a selection can never reference a week that's since dropped out of the
                // current filter set/upload -- if that intersection empties out entirely
                // (every previously-picked week is gone), this falls through to the same
                // "last 4" default as an untouched selection, rather than returning null/
                // breaking the modal. Not capped at 4 -- selecting 5+ weeks is the whole point
                // of this control (see analysisSelectedWeeks above).
                const manualWeeks = analysisSelectedWeeks.length > 0
                    ? weeksPresent.filter(w => analysisSelectedWeeks.includes(w))
                    : [];
                const usingDefault = manualWeeks.length === 0;
                const activeWeeks = usingDefault ? weeksPresent.slice(-4) : manualWeeks;
                if (activeWeeks.length === 0) return null;
                const weekSet = new Set(activeWeeks);
                const analysisRows = filteredRawRows.filter(r => weekSet.has(r.saleWeek));
                if (analysisRows.length === 0) return null;

                const numVal = (row, key) => parseFloat(String(row[key] ?? '').replace(/[,%()]/g, '')) || 0;

                // groupBy: aggregates analysisRows into weekly buckets keyed by (fieldKey, week),
                // then rolls each key's buckets up into a per-key average across its available
                // weeks. Used twice below with different fieldKeys -- once always on 'lane' (for
                // the Overall Snapshot) and once on whichever dimension this tab displays.
                const groupBy = (fieldKey) => {
                    const byKeyWeek = {};
                    analysisRows.forEach(row => {
                        const g = row[fieldKey] || '(blank)';
                        const w = row.saleWeek;
                        const bucketKey = `${g}|${w}`;
                        if (!byKeyWeek[bucketKey]) byKeyWeek[bucketKey] = { key: g, maxLdn: 0, laden: 0, peakUtilSum: 0, peakUtilCount: 0 };
                        const bucket = byKeyWeek[bucketKey];
                        bucket.maxLdn = Math.max(bucket.maxLdn, numVal(row, 'maxLdn'));
                        bucket.laden += numVal(row, 'ladenTeu');
                        bucket.peakUtilSum += numVal(row, 'peakUtilRaw') * 100;
                        bucket.peakUtilCount += 1;
                    });
                    const byKey = {};
                    Object.values(byKeyWeek).forEach(bucket => {
                        if (!byKey[bucket.key]) byKey[bucket.key] = [];
                        byKey[bucket.key].push(bucket);
                    });
                    return Object.entries(byKey).map(([key, weeks]) => {
                        const n = weeks.length;
                        const avgWklyMaxLdn = weeks.reduce((s, w) => s + w.maxLdn, 0) / n;
                        const avgWklyLaden = weeks.reduce((s, w) => s + w.laden, 0) / n;
                        const avgWklyShortfall = avgWklyLaden - avgWklyMaxLdn;
                        const avgUtilization = avgWklyMaxLdn > 0 ? (avgWklyLaden / avgWklyMaxLdn) * 100 : 0;
                        const avgPeakUtilization = weeks.reduce((s, w) => s + (w.peakUtilCount > 0 ? w.peakUtilSum / w.peakUtilCount : 0), 0) / n;
                        return { group: key, weekCount: n, avgWklyMaxLdn, avgWklyLaden, avgWklyShortfall, avgUtilization, avgPeakUtilization };
                    }).sort((a, b) => String(a.group).localeCompare(String(b.group)));
                };

                const groupSummaries = groupBy(groupKey);
                const laneSummaries = groupKey === 'lane' ? groupSummaries : groupBy('lane');

                const overallCapacity = laneSummaries.reduce((s, g) => s + g.avgWklyMaxLdn, 0);
                const overallLaden = laneSummaries.reduce((s, g) => s + g.avgWklyLaden, 0);
                const overallShortfall = overallLaden - overallCapacity;
                const overallUtilization = overallCapacity > 0 ? (overallLaden / overallCapacity) * 100 : 0;

                return {
                    groupLabel,
                    weekRange: activeWeeks.length > 1 ? `${activeWeeks[0]} to ${activeWeeks[activeWeeks.length - 1]}` : activeWeeks[0],
                    weekCount: activeWeeks.length,
                    groupCount: groupSummaries.length,
                    overall: { utilization: overallUtilization, capacity: overallCapacity, laden: overallLaden, shortfall: overallShortfall },
                    groups: groupSummaries,
                    // Exposed for the modal's own Sale Week selector UI: weeksPresent (every
                    // distinct week in the current filter set, not just the active 4/manual
                    // selection) drives the full row of toggle buttons; usingDefault/activeWeeks
                    // tell it which ones to show as "active" when analysisSelectedWeeks is empty.
                    weeksPresent,
                    activeWeeks,
                    usingDefault
                };
            }, [activeTab, filteredRawRows, analysisSelectedWeeks]);

            // Used by Trade_Summary's Max Laden/Trunk Utilization dataFields (see their
            // comments for the confirmed-against-ground-truth reasoning): the real DAX is
            // "sum across each distinct Lane's own max", which a pivot with no Lane rowField
            // can't express via the generic max/rollupSumOfChildren machinery alone. ctx is a
            // tree node's accumulated {trade, subTrade?} context (from PivotTableViewer's
            // row.context); cKey is either a specific Sale Week or the literal 'Total' column.
            const laneAwareMaxLdn = (ctx, cKey) => {
                const matching = filteredRawRows.filter(r =>
                    (!ctx.trade || r.trade === ctx.trade) &&
                    (!ctx.subTrade || r.subTrade === ctx.subTrade) &&
                    (cKey === 'Total' || r.saleWeek === cKey)
                );
                const byLane = {};
                matching.forEach(r => {
                    const lane = r.lane || '(blank)';
                    const v = toNum(r.maxLdn);
                    if (!(lane in byLane) || v > byLane[lane]) byLane[lane] = v;
                });
                return Object.values(byLane).reduce((s, v) => s + v, 0);
            };

            // Live source (2026-08-25) -- sectorSourceRows is fetched from
            // SECTOR_DATA_CSV_URL (see fetchAndApplySectorData above), starting from
            // SECTOR_DATA_SEED as a same-shape fallback until the first fetch resolves
            // (or forever, if the source is ever unreachable). Its rows arrive with
            // {raw:false} parsing (same as the main data), so numeric-looking fields
            // may be comma-formatted strings, not JS numbers -- PivotTableViewer's own
            // aggregation already strips commas before parsing (see its dataFields
            // config below), so this is safe as consumed here; don't add any new
            // direct-arithmetic use of these fields without routing it through the
            // same comma-stripping (see HANDOFF.md's Class D bug).
            // Slicer scoping (2026-08-26): sectorSourceRows is its own independent live
            // source (see comment above) and only ever carried these 9 columns -- Coast,
            // PIC/SPC Analyst, Sale Week, Yard, and AP Status have no equivalent column
            // here at all, so those 5 slicers can't meaningfully apply to this pivot and
            // are deliberately left unfiltered below (matching filteredRawRows on a
            // nonexistent field would just silently blank the table, not fix anything).
            // Sub Trade and Lane DO exist here ('Vessel 1st Sub Trade' / 'Vessel 1st
            // Lane'), so those two are filtered the same way filteredRawRows filters the
            // left-hand pivot (see matchSubTrade/matchLane above) -- this is the fix for
            // "Sector Summary tab slicers only filter the left pivot."
            const sectorDataMapped = useMemo(() => {
                return sectorSourceRows
                    .filter(r => {
                        const matchSubTrade = selectedSubTrades.length === 0 || selectedSubTrades.includes(r['Vessel 1st Sub Trade']);
                        const matchLane = selectedLanes.length === 0 || selectedLanes.includes(r['Vessel 1st Lane']);
                        return matchSubTrade && matchLane;
                    })
                    .map(r => {
                        const lane = r['Vessel 1st Lane'];
                        const podSec = r['POD Sec'];
                        return {
                            trade: r['Vessel 1st Trade'],
                            subTrade: r['Vessel 1st Sub Trade'],
                            lane,
                            podSec,
                            sectorAlloc: r['MCT Sector Allocation'],
                            avgBooking: r['Average Booking'],
                            openSpace: r['Sector Open Space'],
                            portExcluded: PORT_EXCLUDE_KEYS.has(`${lane}|${podSec}`)
                        };
                    });
            }, [sectorSourceRows, selectedSubTrades, selectedLanes]);

            // Sector_Summary's "Average Max Laden vs Booking" pivot in the reference Excel is
            // scoped by its own report filter (Route Date Past 4 Week Flag = Y, see
            // past4WeekFlag above) -- independent of whatever Sale Week slicer buttons the user
            // has selected, so this filters filteredRawRows (which already reflects the other
            // slicers) down further, on top of them rather than instead of them.
            const past4WeekRows = useMemo(() => {
                return filteredRawRows.filter(row => String(row.past4WeekFlag || '').trim().toUpperCase() === 'Y');
            }, [filteredRawRows]);

            // Sector Summary tab: its two side-by-side pivots -- "Average Max Laden vs
            // Booking" (from past4WeekRows) and "Sector Summary" (from sectorDataMapped,
            // its own independent live source, see SECTOR_DATA_CSV_URL above) -- each
            // sort their own rows alphabetically by default at every level, which is
            // WRONG, not just misaligned between the two: Kevin showed a screenshot of
            // the real reference Excel proving the actual Trade order is TPT, then TAT,
            // then LAT -- not alphabetical (TAT/TPT/LAT). Confirmed directly from the
            // reference .xlsm's pivot XML (2026-08-25): the Trade field's row-item list
            // carries an explicit manual index override (its RAW pivot-cache order is
            // alphabetical-ish LAT/TAT/TPT, but someone deliberately reordered the
            // displayed items to TPT/TAT/LAT) -- a real, intentional business order, safe
            // to hardcode. Sub Trade/Lane/POD Sector below Trade are NOT hand-reordered in
            // the reference (their pivot XML uses plain identity ordering) -- they reflect
            // whatever order the reference's own source tables happened to produce, which
            // is what's hardcoded below since that's the only defensible "real order" for
            // levels nobody deliberately curated.
            //
            // Two separate order maps (left has no POD Sector level at all, unlike right,
            // and the two pivots' Lane sets differ per Trade) rather than one shared one --
            // but both start with the same Trade-level sequence (TPT, TAT, [LAT]), so
            // wherever a Trade exists on both sides it still lands on the same row: the
            // "align the two pivots" goal from the prior fix falls out of matching the
            // real order, it doesn't need its own separate computation anymore.
            // flatten()'s `k in node._children` check skips any listed key a given node
            // doesn't actually have (e.g. the right pivot's Sector_Data source has no LAT
            // rows at all -- confirmed in the reference too, its own Sector_Summary pivot's
            // Trade field only contains TAT/TPT). A trade/lane/sector present live but
            // absent from this reference snapshot (the right side's source updates
            // independently) still renders -- it's appended alphabetically after the known
            // ones, not hidden.
            const SECTOR_LEFT_ORDER = {
                ROOT: ['TPT', 'TAT', 'LAT'],
                TPT: ['AW', 'PN', 'PS'],
                'TPT|AW': ['EC1', 'EC2', 'EC3', 'EC4', 'WIN'],
                'TPT|PN': ['FP2', 'PN1', 'PN3'],
                'TPT|PS': ['MS2', 'PS1', 'PS3', 'PS4', 'PS6', 'PS7', 'PS8', 'VSE'],
                TAT: ['TA'],
                'TAT|TA': ['AL5', 'AT1', 'AT3', 'AT4', 'EMA'],
                LAT: ['LN'],
                'LAT|LN': ['AN2', 'ANG', 'FLX', 'MAR'],
            };
            const SECTOR_RIGHT_ORDER = {
                ROOT: ['TPT', 'TAT'],
                TPT: ['AW', 'PN', 'PS'],
                'TPT|AW': ['EC3'],
                'TPT|AW|EC3': ['CNNGB', 'CNSHA', 'CNTAO', 'LKCMB', 'PAMIT', 'SGSIN', 'THLCH', 'VNCMP'],
                'TPT|PN': ['FP2'],
                'TPT|PN|FP2': ['SGSIN'],
                'TPT|PS': ['PS3'],
                'TPT|PS|PS3': ['CNSHA', 'CNSHK', 'INNSA', 'SGSIN'],
                TAT: ['TA'],
                'TAT|TA': ['AL5', 'AT1', 'AT3', 'AT4', 'EMA'],
                'TAT|TA|AL5': ['BEANR', 'DEHAM', 'FRLEH', 'GBSOU'],
                'TAT|TA|AT1': ['BEANR', 'DEBRV', 'FRLEH', 'GBSOU', 'NLRTM'],
                'TAT|TA|AT3': ['BEANR', 'DEBRV', 'GBSOU', 'NLRTM', 'USHOU'],
                'TAT|TA|AT4': ['ESALG', 'ESVLC', 'FRFOS', 'ITGOA', 'ITSPE'],
                'TAT|TA|EMA': ['GRPIR', 'ITSAL', 'TRALI', 'TRISK', 'TRIST'],
            };
            // Trade Summary's own row order (2026-09-01 data-audit fix): rowFields is just
            // [trade, subTrade] (no Lane level), so this only needs two levels deep. Without a
            // childOrder, PivotTableViewer's fallback is a plain alphabetical sort of the Trade
            // rows, which renders LAT/TAT/TPT -- the reference workbook's real Trade_Summary
            // sheet order is TPT/TAT/LAT (same business order already used for Sector Summary's
            // SECTOR_LEFT_ORDER above). Sub Trade order within each Trade is already alphabetical
            // in the reference (confirmed AW/PN/PS, TA, LN), so this is just the Trade level.
            const TRADE_SUMMARY_ORDER = {
                ROOT: ['TPT', 'TAT', 'LAT'],
                TPT: ['AW', 'PN', 'PS'],
                TAT: ['TA'],
                LAT: ['LN'],
            };

            const sectorRows = useMemo(() => {
                const parsed = [];
                filteredRawRows.forEach(row => {
                    if (row.sectorRemarks) {
                        const parts = String(row.sectorRemarks).split('/');
                        parts.forEach(p => {
                            const match = p.match(/([A-Z]+):\s*([\d,]+)\s*-\s*([\d,]+)/);
                            if (match) {
                                parsed.push({
                                    ...row,
                                    podSector: match[1],
                                    sectorAlloc: parseFloat(match[2].replace(/,/g, '')),
                                    avgBooking: parseFloat(match[3].replace(/,/g, ''))
                                });
                            }
                        });
                    }
                });
                return parsed;
            }, [filteredRawRows]);

            const tableData = useMemo(() => {
                const aggregatedMap = {};
                filteredRawRows.forEach(row => {
                    const key = `${row.trade}-${row.subTrade}-${row.lane}-${row.saleWeek}-${row.vvd}-${row.vessel}`;
                    if (!row.vvd && !row.vessel) {
                        aggregatedMap[`uid-${row.id}`] = row;
                        return;
                    }

                    if (!aggregatedMap[key]) {
                        aggregatedMap[key] = { ...row };
                        // 'broken' (Broken Routes) added 2026-09-01 data-audit fix -- like every
                        // other TEU-quantity field here, a VVD's multiple raw POL-leg rows need
                        // to be SUMMED, not first-leg-wins; it was the one quantity field missing
                        // from this list, silently dropping later legs' volume.
                        const numerics = ['curLaden', 'quote', 'shortfall', 'broken', 'rfrBkgPlugs', 'rfrBkgTtl', 'inlandAct', 'inlandNoAct', 'inlandTotal', 'portAct', 'portNoAct', 'portTotal', 'dgTeu', 'tpt', 'tat', 'lwt', 'lnt', 'imt', 'let', 'ladenTeu', 'activeTotalTeu'];
                        numerics.forEach(n => aggregatedMap[key][n] = toNum(aggregatedMap[key][n]));

                        // 'peakUtilRaw'/'rfrBsaTeuRfMax' added 2026-09-01 -- both are "Max of ..."
                        // per their confirmed DAX (see rfrUtilizRaw recompute below and Peak Laden
                        // Utilz %'s own MAX-across-legs convention, same as curUtilRaw just below),
                        // but neither was aggregated at all before, leaving them first-leg-wins.
                        const maxes = ['maxLdn', 'bsaTeu', 'bsaWgt', 'rfrBsaPlugs', 'rfrMaxLdn', 'peakUtilRaw', 'rfrBsaTeuRfMax'];
                        maxes.forEach(n => aggregatedMap[key][n] = toNum(aggregatedMap[key][n]));

                        aggregatedMap[key].curUtilRaw = getPercentNum(row.curUtilRaw);
                    } else {
                        // 'shortfall' added 2026-09-01 (second data-audit pass, historical-dataset
                        // re-validation) -- the same bug class as 'broken' above, just missed the
                        // first time: present in the init-branch numerics list but absent here, so
                        // a later leg's raw shortfall was silently dropped instead of summed. Mostly
                        // dormant/masked because row.shortfall is normally overwritten by a fresh
                        // ladenTeu-maxLdn calc below whenever the VVD's aggregated Max Laden is
                        // non-zero (the common case) -- it only actually renders this raw summed
                        // value on the rarer maxLdn-blank branch, which is exactly the condition
                        // that let it go unnoticed in the first 2026-09-01 pass (no multi-leg VVD in
                        // that day's sample happened to hit it). Confirmed live on other dates in the
                        // historical archive (e.g. 2026-08-28 SCNT1010W: legs [103,0,14,20] should
                        // sum to 137, was rendering only the first leg's 103).
                        const numerics = ['curLaden', 'quote', 'shortfall', 'broken', 'rfrBkgPlugs', 'rfrBkgTtl', 'inlandAct', 'inlandNoAct', 'inlandTotal', 'portAct', 'portNoAct', 'portTotal', 'dgTeu', 'tpt', 'tat', 'lwt', 'lnt', 'imt', 'let', 'ladenTeu', 'activeTotalTeu'];
                        numerics.forEach(n => {
                            aggregatedMap[key][n] += toNum(row[n]);
                        });

                        const maxes = ['maxLdn', 'bsaTeu', 'bsaWgt', 'rfrBsaPlugs', 'rfrMaxLdn', 'peakUtilRaw', 'rfrBsaTeuRfMax'];
                        maxes.forEach(n => {
                            aggregatedMap[key][n] = Math.max(aggregatedMap[key][n], toNum(row[n]));
                        });

                        aggregatedMap[key].curUtilRaw = Math.max(aggregatedMap[key].curUtilRaw, getPercentNum(row.curUtilRaw));
                    }
                });

                return Object.values(aggregatedMap).map(row => {
                    row.standby = formatPercent(row.standbyRaw);
                    row.peakUtil = formatPercent(row.peakUtilRaw);

                    // 2026-09-01 data-audit fix: rfrUtilizRaw was computed once per RAW leg in
                    // parseWorkbookToRows (a leg's own rfrBkgTtl / that leg's own rfrBsaTeuRfMax)
                    // and never recomputed after aggregation, so a multi-leg VVD rendered its
                    // first leg's ratio instead of the aggregated one -- understating RFR Utiliz %
                    // by 2-10x on 125 real VVDs. Per confirmed DAX, RFR Utilz = DIVIDE(Sum of
                    // Measures Reefer TEU, Max of Measures BSA TEU RF, 0); rfrBkgTtl is already
                    // summed above (numerics), rfrBsaTeuRfMax is now MAX-aggregated above (maxes),
                    // so recompute the ratio fresh from those aggregated totals here, same pattern
                    // as actVsBkgUtilzRaw just below.
                    const rfrBsaTeuRfMaxNum = toNum(row.rfrBsaTeuRfMax);
                    row.rfrUtilizRaw = rfrBsaTeuRfMaxNum > 0 ? (toNum(row.rfrBkgTtl) / rfrBsaTeuRfMaxNum) : 0;
                    row.rfrUtiliz = formatPercent(row.rfrUtilizRaw);

                    // Per confirmed DAX (Manage Measures screenshot, 2026-08-14): "Activity vs
                    // Booking Utilz" = DIVIDE(SUM(Measures Active total TEU), Sum of Measures
                    // Laden TEU, 0); "Activity vs Max Laden" = SUM(Measures Active total TEU) -
                    // Max of MCT Max Laden Update. Both use activeTotalTeu/ladenTeu directly, NOT
                    // the manual inlandAct+portAct/inlandTotal+portTotal sums previously used here
                    // (those were never actually the right source columns per the DAX text).
                    const activeTotalTeuNum = toNum(row.activeTotalTeu);
                    const ladenTeuNum = toNum(row.ladenTeu);
                    row.actVsBkgUtilzRaw = ladenTeuNum > 0 ? (activeTotalTeuNum / ladenTeuNum) : 0;
                    row.actVsBkgUtilz = formatPercent(row.actVsBkgUtilzRaw);

                    row.actVsMaxLdnRaw = activeTotalTeuNum - toNum(row.maxLdn);
                    const formattedMaxLdnRaw = formatNumberWithCommas(row.actVsMaxLdnRaw);
                    row.actVsMaxLdn = (row.actVsMaxLdnRaw > 0 ? '+' : '') + formattedMaxLdnRaw;
                    row.actVsMaxLdnStyle = row.actVsMaxLdnRaw > 0 ? { color: 'red' } : {};

                    const parsedMax = parseFloat(row.maxLdn);
                    row.maxLdn = (parsedMax === 0 || isNaN(parsedMax)) ? '' : formatNumberWithCommas(row.maxLdn);

                    row.curUtil = `${Math.round(row.curUtilRaw || 0)}%`;

                    // Native CF (Booking_Flash!N13:O47): ($O-$N)>10% -> red fill on both Peak
                    // Utiliz % (N/row.peakUtil) and Current Laden Utiliz % (O/row.curUtil).
                    // row.curUtilRaw is already on the 0-100 percent-point scale (converted via
                    // getPercentNum above); normalize row.peakUtilRaw (still fractional, see the
                    // getPercentNum comment near its definition) the same way before comparing.
                    row.utilGapFlagged = isUtilGapFlagged(row.curUtilRaw, getPercentNum(row.peakUtilRaw));
                    row.utilGapStyle = row.utilGapFlagged ? { backgroundColor: '#dc2626', color: '#fff', fontWeight: 'bold' } : {};

                    // shortfallNegative captured from the raw pre-format number (matching the
                    // reference Excel's red-for-negative rule, see negativeValueClass) since
                    // row.shortfall itself becomes the already-"(-N)"-formatted display string
                    // right below. Per confirmed DAX: "Max LDN vs BKG (Shortfall)" = [Sum of
                    // Measures Laden TEU] - [Max of MCT Max Laden Update] -- uses ladenTeu (the
                    // same column Trunk Utilization already correctly sums), NOT curLaden
                    // ("Measures POL Laden TEU", a different raw column -- see the ladenTeu/
                    // curLaden split documented near their getVal aliases).
                    if (row.maxLdn !== '' && row.ladenTeu !== undefined) {
                        const rawMaxLdn = toNum(row.maxLdn);
                        const calculatedShortfall = toNum(row.ladenTeu) - rawMaxLdn;
                        row.shortfallNegative = calculatedShortfall < 0;
                        row.shortfall = formatAccountingNumber(calculatedShortfall);
                    } else {
                        row.shortfallNegative = toNum(row.shortfall) < 0;
                        row.shortfall = formatAccountingNumber(row.shortfall);
                    }
                    
                    row.curLaden = formatNumberWithCommas(row.curLaden);
                    row.quote = formatNumberWithCommas(row.quote);
                    row.bsaTeu = formatNumberWithCommas(row.bsaTeu);
                    row.bsaWgt = formatNumberWithCommas(row.bsaWgt);
                    
                    if (String(row.vvd).trim().toUpperCase() === 'VMS') {
                        const fieldsToKeep = ['id', 'trade', 'subTrade', 'lane', 'saleWeek', 'pic', 'vvd'];
                        Object.keys(row).forEach(key => {
                            if (!fieldsToKeep.includes(key)) {
                                // Object-valued fields (e.g. actVsMaxLdnStyle/utilGapStyle, both set as
                                // {} or a style object above) must wipe to {} not '' -- passing a string
                                // to a React `style` prop throws ("style prop expects a mapping ... not
                                // a string"), which crashes the whole Detail View render on any real
                                // dataset containing a VMS row.
                                row[key] = (row[key] && typeof row[key] === 'object') ? {} : '';
                            }
                        });
                    }

                    return row;
                });
            }, [filteredRawRows]);

            const processedData = useMemo(() => {
                let filtered = [...tableData]; // Already filtered!
                
                filtered.sort((a, b) => {
                    if (a.trade !== b.trade) return String(a.trade || '').localeCompare(String(b.trade || ''));
                    if (a.subTrade !== b.subTrade) return String(a.subTrade || '').localeCompare(String(b.subTrade || ''));
                    if (a.lane !== b.lane) return String(a.lane || '').localeCompare(String(b.lane || ''));
                    if (a.saleWeek !== b.saleWeek) return compareSaleWeek(a.saleWeek, b.saleWeek);
                    return String(a.vessel || '').localeCompare(String(b.vessel || ''));
                });

                const withBlanks = [];
                for (let i = 0; i < filtered.length; i++) {
                    withBlanks.push(filtered[i]);
                    const isLastInLane = i === filtered.length - 1 || filtered[i].lane !== filtered[i+1].lane;
                    if (isLastInLane) {
                        withBlanks.push({
                            id: `blank-${filtered[i].id || i}`,
                            isBlankRow: true,
                            trade: filtered[i].trade,
                            subTrade: filtered[i].subTrade,
                            lane: filtered[i].lane
                        });
                    }
                }

                const spanned = withBlanks.map(row => ({
                    ...row,
                    showTrade: true, tradeSpan: 1,
                    showSub: true, subSpan: 1,
                    showLane: true, laneSpan: 1
                }));

                for (let i = 0; i < spanned.length; i++) {
                    if (spanned[i].showTrade) {
                        let spanCount = 1;
                        for (let j = i + 1; j < spanned.length; j++) {
                            if (spanned[j].trade === spanned[i].trade) {
                                spanCount++;
                                spanned[j].showTrade = false;
                            } else break;
                        }
                        spanned[i].tradeSpan = spanCount;
                    }

                    if (spanned[i].showSub) {
                        let spanCount = 1;
                        for (let j = i + 1; j < spanned.length; j++) {
                            if (spanned[j].trade === spanned[i].trade && spanned[j].subTrade === spanned[i].subTrade) {
                                spanCount++;
                                spanned[j].showSub = false;
                            } else break;
                        }
                        spanned[i].subSpan = spanCount;
                    }

                    if (spanned[i].showLane) {
                        let spanCount = 1;
                        for (let j = i + 1; j < spanned.length; j++) {
                            if (spanned[j].trade === spanned[i].trade &&
                                spanned[j].subTrade === spanned[i].subTrade &&
                                spanned[j].lane === spanned[i].lane) {
                                spanCount++;
                                spanned[j].showLane = false;
                            } else break;
                        }
                        spanned[i].laneSpan = spanCount;
                    }
                }
                return spanned;
            }, [tableData]);

            // select-none removed app-wide 2026-08-14 (was blocking users from copying any
            // table text, which is a real need -- e.g. pasting a VVD or lane code
            // elsewhere). Buttons/slicers don't need it explicitly: browsers don't select
            // button text on a normal click by default, and the column-resize drag handlers
            // already call e.preventDefault() on their own mousedown (see makeColResizer),
            // which independently suppresses the text-selection drag browsers would
            // otherwise start.
            return (
                // `dark` on this wrapper (2026-08-21), not <html>/<body> --
                // Tailwind's 'class' dark-mode strategy activates every
                // descendant `dark:` variant off the nearest `.dark`
                // ancestor, so scoping it here is sufficient and avoids
                // reaching outside React's own root element.
                <div className={`min-h-screen p-4 font-sans ${darkMode ? 'dark bg-[#0f1115] text-gray-100' : 'bg-[#f3f3f3] text-black'}`}>
                    <input type="file" accept=".xlsx, .xls, .csv" ref={fileInputRef} onChange={handleFileUpload} className="hidden" />
                    <input type="file" accept=".xlsx, .xls, .csv" ref={oldFileInputRef} onChange={handleOldFileUpload} className="hidden" />

                    {parseError && (
                        <div className="bg-red-100 dark:bg-red-950 border-2 border-red-500 dark:border-red-700 text-red-800 dark:text-red-300 font-bold px-4 py-3 rounded mb-4 mx-4 shadow-sm" role="alert">
                            {parseError}
                        </div>
                    )}

                    {/* Only shown once data is already loaded (autoFetchError from the
                        initial load, before any data exists, is instead folded into the
                        dropzone copy below) -- a failed background/manual refresh check
                        shouldn't block the view someone's already looking at. */}
                    {autoFetchError && rawRows.length > 0 && (
                        <div className="bg-yellow-50 dark:bg-yellow-950 border-2 border-yellow-400 dark:border-yellow-700 text-yellow-800 dark:text-yellow-300 font-semibold px-4 py-2 rounded mb-4 mx-4 shadow-sm text-sm" role="alert">
                            {autoFetchError}
                        </div>
                    )}

                    {/* New-data-detected banner (2026-08-18): the background poll never
                        swaps rawRows on its own -- it only sets newDataAvailable and
                        stashes the fetched CSV in pendingCsvTextRef, so a user mid-filter
                        never has data change under them without choosing to. */}
                    {newDataAvailable && rawRows.length > 0 && (
                        <div className="flex items-center justify-between gap-3 bg-blue-50 dark:bg-blue-950 border-2 border-blue-400 dark:border-blue-700 text-blue-900 dark:text-blue-200 font-semibold px-4 py-2 rounded mb-4 mx-4 shadow-sm text-sm" role="status">
                            <span>New data is available from the underlying Sheet.</span>
                            <button onClick={applyPendingUpdate} className="bg-blue-700 text-white px-3 py-1 rounded shadow-sm hover:bg-blue-800 transition-colors text-sm font-bold cursor-pointer whitespace-nowrap">
                                Refresh
                            </button>
                        </div>
                    )}

                    {/* Historical-viewing banner (2026-09-01): a second, always-visible

                                        for (let j = i + 1; j < spanned.length && spanned[j].trade === spanned[i].trade; j++) { n++; spanned[j].showTrade = false; }
                                        spanned[i].tradeSpan = n;
                                    }
                                    if (spanned[i].showSub) {
                                        let n = 1;
                                        for (let j = i + 1; j < spanned.length && spanned[j].trade === spanned[i].trade && spanned[j].subTrade === spanned[i].subTrade; j++) { n++; spanned[j].showSub = false; }
                                        spanned[i].subSpan = n;
                                    }
                                    if (spanned[i].showLane) {
                                        let n = 1;
                                        for (let j = i + 1; j < spanned.length && spanned[j].trade === spanned[i].trade && spanned[j].subTrade === spanned[i].subTrade && spanned[j].lane === spanned[i].lane; j++) { n++; spanned[j].showLane = false; }
                                        spanned[i].laneSpan = n;
                                    }
                                }

                                // Same VMS/AP Frozen/AP Only/NO N.A. CALL precedence and hex colors as the
                                // rowClass this replaces (see the theme-tint verification comment history
                                // in project memory) -- computed per row instead of per pivot-aggregate.
                                // loadingStatus is already normalized (normalizeApStatus) to 'AP FROZEN'/
                                // 'AP ONLY', matching POL_Booking_Flash's established loadingStatus-not-
                                // status convention (Measures Loading Status diverges from Measures Overall
                                // Status on ~5.7% of rows).
                                const rowStatusInfo = (row) => {
                                    const isVMS = String(row.vvd || '').trim().toUpperCase() === 'VMS';
                                    const isAPFrozen = row.loadingStatus === 'AP FROZEN';
                                    const isAPOnly = row.loadingStatus === 'AP ONLY';
                                    const isNoNACall = String(row.pol || '').trim().toUpperCase() === 'NO N.A. CALL';
                                    const bg = isVMS ? 'bg-[#d9d9d9] text-black font-semibold'
                                        : isAPFrozen ? 'bg-[#DA9694] text-black font-bold'
                                        : isAPOnly ? 'bg-[#ffc000] text-black font-bold'
                                        : isNoNACall ? 'bg-[#FF0000] italic text-black' : '';
                                    // 2026-08-25: dropped the [AP Frozen]/[AP Only] badges specifically
                                    // (Kevin: they don't need to be in the Sale Week cell, on both this
                                    // tab and Booking Flash's own copy of this same pattern) -- NO N.A.
                                    // CALL keeps its badge, row background color still conveys AP
                                    // Frozen/AP Only status. [VMS] dropped too (Kevin: "VMS doesn't need
                                    // to be in Sales week as well ... it should be only sales week") --
                                    // the grey row fill (isVMS above) already conveys VMS status.
                                    const badge = isNoNACall ? '[NO N.A. CALL] ' : '';
                                    return { isVMS, bg, badge };
                                };
                                // Native CF (POL_Booking_Flash!V13:W2000): ($W-$V)>10% -> red fill on both
                                // Peak Laden Utilz % and Current Laden Utilz %; both sides are raw
                                // fractional (0-1), so both need getPercentNum before comparing.
                                const utilGapClass = (row) => utilGapCellClass(getPercentNum(row.polBkgUtilzRaw), getPercentNum(row.peakPolUtilzRaw));
                                // Native POL_Booking_Flash CF rules do AND($H12="VMS", <col>=0) -> white font
                                // on these specific columns to hide the "0" placeholder on VMS rows.
                                // Extended 8/14/2026 with the Reefer/Inland/Port groups per direct xlsx
                                // inspection of the reference sheet's conditional formatting (dxf rules on
                                // M/N/AA/AB/AC/AD/AE/AF all follow the same VMS-zero pattern).
                                const VMS_ZERO_MASK_FIELDS = ['plannedMty', 'actualMty', 'discharge', 'curLaden', 'peakPolUtilzRaw', 'loadableQuant', 'loadableWgt', 'rfrMaxLdn', 'rfrBkgPol', 'inlandAct', 'inlandNoAct', 'inlandTotal', 'portAct', 'portNoAct', 'portTotal'];
                                // Local to this tab's row rendering (maskZero + every per-row data cell
                                // below) -- distinct from the outer numVal used by serviceLaneAnalysis.
                                // Previously also fed the tab's now-removed Grand Total row; kept here
                                // since these row-level uses still need it.
                                const numVal = (row, key) => parseFloat(String(row[key] ?? '0').replace(/[,%()]/g, '')) || 0;
                                const maskZero = (row, key, displayVal) => (rowStatusInfo(row).isVMS && numVal(row, key) === 0 && VMS_ZERO_MASK_FIELDS.includes(key)) ? '' : displayVal;

                                // Column-group visibility, driven by the per-tab toggle panel above
                                // (reeferHidden/activityHidden/etaHidden/opIssuesHidden/vcoHidden --
                                // activityHidden covers BOTH Inland and Port groups together, matching
                                // the reference's single Toggle_POL_Act_Macro spanning AA:AF).
                                const showReefer = !reeferHidden;
                                const showActivity = !activityHidden;
                                const showEta = !etaHidden;
                                const showOpIssues = !opIssuesHidden;
                                const showVco = !vcoHidden;
                                // Used by the blank spacer row's filler <td> so its colSpan tracks
                                // whichever optional groups are currently visible (8 always-visible
                                // label columns after the 3 rowSpan-merged ones -- was 7 until BSA TEU

                                // Peak Dry/Reefer Utilz (POL) columns were removed the same day -- +
                                // whichever optional groups are showing).
                                const visibleColCount = 8 + 11
                                    + (showReefer ? 3 : 0)
                                    + (showActivity ? 6 : 0)
                                    + (showEta ? 3 : 0)
                                    + (showOpIssues ? 1 : 0)
                                    + (showVco ? 1 : 0);

                                // whitespace-normal overrides the table's default whitespace-nowrap so
                                // long header labels wrap onto multiple lines instead of forcing every
                                // column far wider than its data needs -- matches the reference sheet's
                                // own wrap_text=True header cells (row 11 height 45pt to fit wrapped text).
                                // rowSpan={2} is a REAL HTML table attribute (not a CSS class -- Tailwind's
                                // row-span-* utilities only apply inside display:grid, not <table>), needed
                                // so every single-row column correctly spans both header rows next to the
                                // Inland/Port groups' 2-row (group-label + sub-header) structure. It's a
                                // harmless no-op on tabs/states where the second header row doesn't render
                                // at all (showActivity false).
                                // User-adjustable widths (polColWidths/startPolColResize, from the
                                // top-level component) keyed by row-field key or label text.
                                // data-autofit-col (2026-08-26, column auto-fit -- see the
                                // polColWidths auto-fit useLayoutEffect near polColWidths'
                                // own declaration): tagged on the inner <div>{label}</div>,
                                // NOT the <th> itself, because this <th> also contains
                                // renderFilter's own <input> -- Range-measuring the whole
                                // <th> would measure the input's own w-full box (which
                                // stretches to fill whatever width the column already has, a
                                // circular/self-reinforcing measurement, the same class of
                                // bug already found and fixed on Trade Summary's Row Labels
                                // column, see its own `inline-flex` fix comment) instead of
                                // the real label text's content width.
                                const headerCell = (key, label, extraClass = '') => (
                                    <th rowSpan={2} className={`border border-black py-0.5 px-0.5 min-w-[70px] text-xs leading-tight font-semibold align-bottom whitespace-normal relative ${extraClass}`} style={polColWidths[key] ? { width: polColWidths[key], minWidth: polColWidths[key] } : undefined}>
                                        <div data-autofit-col={key}>{label}</div>

                                        <ColResizeHandle onMouseDown={startPolColResize(key)} />
                                    </th>

                                // Plain (non-filterable) header cell for the metric columns -- no
                                // filter <input> inside, so (unlike headerCell above) the <th>
                                // itself is a safe, direct data-autofit-col target: its only
                                // children are the label text and the (now excluded via
                                // data-resize-handle) ColResizeHandle.
                                const th = (label, extraClass = '') => (
                                    <th rowSpan={2} data-autofit-col={label} className={`border border-black py-0.5 px-0.5 min-w-[70px] text-xs leading-tight font-semibold whitespace-normal relative ${extraClass}`} style={polColWidths[label] ? { width: polColWidths[label], minWidth: polColWidths[label] } : undefined}>{label}<ColResizeHandle onMouseDown={startPolColResize(label)} /></th>
                                );

                                return (
                                <>
                                {/* max-h + overflow-auto (2026-08-25, "freeze the headers and slicers on
                                    top"): bounds this table to its own scrollable box with a real
                                    vertical scrollbar, instead of the whole page scrolling past it. The
                                    thead's sticky top-0 below then sticks correctly within THIS box (a
                                    plain overflow-x-auto div can't do that -- CSS spec forces overflow-y
                                    to resolve as 'auto' too whenever overflow-x isn't 'visible', so an
                                    attempted overflow-x-auto/overflow-y-visible split silently collapses
                                    back to auto/auto and never gives you a real page-scrolling sticky
                                    header; confirmed live, not a guess). Bounding the height instead
                                    means the filter panel/tab bar above never need to become sticky
                                    themselves either -- the page itself no longer scrolls past them,
                                    only this box scrolls internally. */}
                                <div ref={polTableContainerRef} className="border-2 border-black dark:border-gray-600 overflow-auto bg-white dark:bg-gray-800 shadow-md mb-4" style={{ maxHeight: tableAreaMaxHeight || '70vh', transform: 'translateZ(0)', willChange: 'transform', isolation: 'isolate' }}>
                                    {/* border-separate/border-spacing:0 (2026-08-26, replacing border-collapse):
                            the real fix for the "sticky header borders turn transparent /
                            white lines appear while scrolling" report -- border-collapse makes
                            Chromium resolve every shared cell edge (including the thead's own
                            bottom edge) through a table-wide collapsed-border algorithm keyed to
                            each cell's un-stickied layout position, which visibly desyncs from
                            the thead's actual on-screen (stickied) position once you scroll,
                            since the algorithm doesn't know the thead has been repositioned.
                            border-separate removes that algorithm entirely -- every cell paints
                            its own border independent of any other cell's, so there's no shared
                            edge left to mis-resolve. The pre-existing box-shadow on the thead
                            itself (below) is kept as a second line of defense, and
                            translateZ(0)/will-change/isolation on both this container and the
                            thead promote each to its own compositor layer, so the scrolling tbody

                            live, not doubled" note here was wrong): border-spacing:0 keeps cells
                            touching with no GAP between them, but every cell here still declares
                            its OWN full 4-side border (`border border-gray-400`/`border-black`
                            className, same as before this fix), so border-separate renders TWO
                            full-weight borders touching edge-to-edge at every internal seam --
                            visibly thicker than the single collapsed hairline this table had
                            before. The scoped .pol-flash-table style below strips each cell's own
                            top+left border (leaving only right+bottom), the same technique
                            already used on the sibling Booking Flash/Detail table's copy of this
                            same fix -- restores the original single-hairline look; the outer
                            top/left frame line comes from this scroll container's own border-2
                            border-black instead. */}
                                    <style>{`.pol-flash-table th, .pol-flash-table td { border-top: none !important; border-left: none !important; }`}</style>

                        <thead className="bg-[#333333] text-white sticky top-0 z-10 shadow-[0_1px_2px_rgba(0,0,0,0.05),0_1px_0_black] border-black" style={{ willChange: 'transform', transform: 'translateZ(0)', backfaceVisibility: 'hidden', isolation: 'isolate' }}>
                                            <tr>
                                                {headerCell('trade', 'Trade')}

                                                {headerCell('pol', 'POL')}

                                                    header, no merged group-label row (unlike Inland/Port
                                                    below), confirmed via direct xlsx inspection. */}
                                                {showReefer && th('RFR Max Laden TEU', 'bg-[#FFC000] text-black')}
                                                {showReefer && th('RFR BKG TEU', 'bg-[#FFC000] text-black')}
                                                {showReefer && th('RFR Utilz%', 'bg-[#FFC000] text-black')}
                                                {th('Planned Mty (TEU)')}
                                                {th('Actual Mty (TEU)')}
                                                {th('POL Max Laden (TEU)')}
                                                {th('POL Laden Threshold')}
                                                {th('Discharge (TEU)')}
                                                {th('Current Laden (TEU)', 'bg-[#444444]')}

                                                {/* Inland/Port Total groups (cols AA:AF) -- each gets a

                                                    (tan #DDD9C3 for Inland, darker khaki #C4BD97 for Port,
                                                    both theme2-tint colors resolved via direct xlsx
                                                    inspection) plus 3 individual sub-header cells in the
                                                    second header row below. */}
                                                {showActivity && <th colSpan={3} className="border border-black p-1 text-xs leading-tight font-semibold bg-[#DDD9C3] text-black">Inland Total</th>}
                                                {showActivity && <th colSpan={3} className="border border-black p-1 text-xs leading-tight font-semibold bg-[#C4BD97] text-black">Port Total</th>}
                                                {showEta && th('Last Coastal ETA Time')}

                                            </tr>
                                            {showActivity && (
                                                <tr>
                                                    <th data-autofit-col="Inland w/Activity" className="border border-black p-1 min-w-[70px] text-xs leading-tight font-semibold whitespace-normal relative" style={polColWidths['Inland w/Activity'] ? { width: polColWidths['Inland w/Activity'], minWidth: polColWidths['Inland w/Activity'] } : undefined}>Inland w/Activity<ColResizeHandle onMouseDown={startPolColResize('Inland w/Activity')} /></th>
                                                    <th data-autofit-col="Inland No-Activity" className="border border-black p-1 min-w-[70px] text-xs leading-tight font-semibold whitespace-normal relative" style={polColWidths['Inland No-Activity'] ? { width: polColWidths['Inland No-Activity'], minWidth: polColWidths['Inland No-Activity'] } : undefined}>Inland No-Activity<ColResizeHandle onMouseDown={startPolColResize('Inland No-Activity')} /></th>
                                                    <th data-autofit-col="Inland Total sub" className="border border-black p-1 min-w-[70px] text-xs leading-tight font-semibold whitespace-normal relative" style={polColWidths['Inland Total sub'] ? { width: polColWidths['Inland Total sub'], minWidth: polColWidths['Inland Total sub'] } : undefined}>Inland Total<ColResizeHandle onMouseDown={startPolColResize('Inland Total sub')} /></th>
                                                    <th data-autofit-col="Port w/Activity" className="border border-black p-1 min-w-[70px] text-xs leading-tight font-semibold whitespace-normal relative" style={polColWidths['Port w/Activity'] ? { width: polColWidths['Port w/Activity'], minWidth: polColWidths['Port w/Activity'] } : undefined}>Port w/Activity<ColResizeHandle onMouseDown={startPolColResize('Port w/Activity')} /></th>
                                                    <th data-autofit-col="Port No-Activity" className="border border-black p-1 min-w-[70px] text-xs leading-tight font-semibold whitespace-normal relative" style={polColWidths['Port No-Activity'] ? { width: polColWidths['Port No-Activity'], minWidth: polColWidths['Port No-Activity'] } : undefined}>Port No-Activity<ColResizeHandle onMouseDown={startPolColResize('Port No-Activity')} /></th>
                                                    <th data-autofit-col="Port Total sub" className="border border-black p-1 min-w-[70px] text-xs leading-tight font-semibold whitespace-normal relative" style={polColWidths['Port Total sub'] ? { width: polColWidths['Port Total sub'], minWidth: polColWidths['Port Total sub'] } : undefined}>Port Total<ColResizeHandle onMouseDown={startPolColResize('Port Total sub')} /></th>
                                                </tr>

                                        </thead>
                                        <tbody className="whitespace-nowrap text-xs leading-[14px]">
                                            {spanned.map((row, i) => {

                                                        <tr key={row.id}>
                                                            {row.showTrade && <td rowSpan={row.tradeSpan} className="border border-gray-400 bg-white dark:bg-gray-800"></td>}

                                                            <td colSpan={visibleColCount} className="border-0 bg-white dark:bg-gray-800 p-0.5"></td>

                                                const { bg, badge } = rowStatusInfo(row);
                                                // bg's own text-black (added for dark mode -- see

                                                // text colors of equal specificity -- the exact undefined-
                                                // winner conflict already fixed elsewhere in this file (see

                                                const bgNoText = bg.replace(/\btext-\S+\b/g, '').replace(/\s+/g, ' ').trim();

                                                        {showReefer && <td data-autofit-col="RFR Utilz%" className={`border border-gray-400 p-0.5 ${bg}`}>{`${Math.round(getPercentNum(row.rfrUtilizPolRaw))}%`}</td>}
                                                        <td data-autofit-col="Planned Mty (TEU)" className={`border border-gray-400 p-0.5 ${bg}`}>{maskZero(row, 'plannedMty', formatNumberWithCommas(numVal(row, 'plannedMty')))}</td>

                                                        {/* Same class-of-equal-specificity conflict as the Sector_Summary

                                                        <td data-autofit-col="Peak Laden Utilz %" className={`border border-gray-400 p-0.5 ${utilGapClass(row) || bg}`} title={utilGapClass(row) ? 'Utilization increased by 10% or greater since the prior business day.' : undefined}>{maskZero(row, 'peakPolUtilzRaw', `${Math.round(getPercentNum(row.peakPolUtilzRaw))}%`)}</td>
                                                        <td data-autofit-col="Current Laden Utilz %" className={`border border-gray-400 p-0.5 ${utilGapClass(row) || bg}`} title={utilGapClass(row) ? 'Utilization increased by 10% or greater since the prior business day.' : undefined}>{Math.round(getPercentNum(row.polBkgUtilzRaw))}%</td>

                                            // definition above), so no further trim/case-fold needed here.

                                            const isAPFrozen = row.status === 'AP FROZEN';

                                            // Quote/Broken Routes columns from fighting getBg's own
                                            // text-black pin on a flagged (always-light, VMS/AP) row -- same
                                            // equal-specificity conflict class as bgNoText on the POL table.
                                            const isFlaggedRow = isVMS || isAPOnly || isAPFrozen;

                                            // conditional_formatting_rules.json's resolved dxf fills (see the
                                            // matching note by POL_Booking_Flash's rowClass above for the full
                                            // tint math): VMS's theme-0/tint -0.14996795556505021 resolves to an
                                            // exact #D9D9D9 match; AP Frozen's theme-5/tint 0.39994506668294322
                                            // resolves to #D99694, 1 unit off #DA9694 on the R channel only
                                            // (negligible/expected drift); AP Only's literal dxf hex #FFC000
                                            // matches exactly. No hardcoded values changed.
                                            const getBg = (defaultBg, isApRange) => {
                                                if (isVMS) return 'bg-[#d9d9d9] text-black';
                                                if (isAPOnly && isApRange) return 'bg-[#ffc000] text-black';
                                                if (isAPFrozen && isApRange) return 'bg-[#DA9694] text-black';

                                                // already-pinned pastel CF color passed in by the caller.
                                                return defaultBg === 'bg-white' ? 'bg-white dark:bg-gray-800' : defaultBg;

                                            // WCAG 1.4.1: getBg conveys AP Frozen/AP Only/VMS status via
                                            // background color alone. Add a terse text badge, prefixed once
                                            // on the leftmost cell that always renders for every row (Trade/
                                            // Sub Trade/Lane are rowSpan'd and skipped on most rows, so
                                            // Sale Week is the true leftmost visible cell here).
                                            // 2026-08-25: dropped the [AP Only]/[AP Frozen] badges specifically
                                            // (Kevin: they don't need to be in the Sale Week cell, on both this
                                            // tab and POL Booking Flash's own copy of this same pattern), and
                                            // [VMS] too (Kevin: "VMS doesn't need to be in Sales week as well
                                            // ... it should be only sales week") -- the grey row fill (isVMS)
                                            // already conveys VMS status (the WCAG rationale above still holds).
                                            const rowStatusBadge = '';

                                                    <td className={`border border-gray-400 p-0.5 font-bold ${getBg('bg-white', true)}`}>{rowStatusBadge}{row.saleWeek}</td>
                                                    <td className={`border border-gray-400 p-0.5 ${getBg('bg-white', true)}`}>{row.pic}</td>
                                                    <td className={`border border-gray-400 p-0.5 ${getBg('bg-white', true)}`}>{formatDate(row.cutoff)}</td>
                                                    <td className={`border border-gray-400 p-0.5 ${getBg('bg-white', true)}`}>{formatDate(row.etd)}</td>

                                                    <td className={`border border-gray-400 p-0.5 ${getBg('bg-white', true)} ${row.shortfallNegative ? 'text-red-600' : ''}`}>{row.shortfall}</td>

                                                </tr>
                                            );

                                        {processedData.length === 0 && (
