            // Longer keywords first so e.g. "PAROD Discharge :" wins over a shorter overlapping alternative.
            const sortedKeywords = [...SEC_ALLOC_BOLD_KEYWORDS].sort((a, b) => b.length - a.length);
            const keywordPattern = sortedKeywords.map(escapeRegex).join('|');

            const { rowFields = [], dataFields = [], title = "Pivot", colField = null, valuesInRows = false, rowClass = null, accentColor = '#E5007D', prettyGrandTotal = false } = config;

                        const val = row[rf.key] || '(blank)';
                        if (!current._children[val]) {
                            current._children[val] = { _totals: {}, _children: {}, label: val, context: { ...current.context, [rf.key]: row[rf.key] } };
                        }
                        
                        current = current._children[val];
                        aggregateData(current, row, 'Total');
                        if (colField) aggregateData(current, row, cVal);
                    });
                });
                
                const colKeys = Array.from(colKeysSet).sort(compareSaleWeek);

                // Parent-level (e.g. Trade) subtotal rollup for fields that opt in via
                // `rollupSumOfChildren: true`. By default every node's _totals (at every
                // level, including intermediate parent nodes) is aggregated directly from
                // the raw rows beneath it — correct for 'sum'/'count'/'avg' fields (sum of
                // raw rows always equals sum of children's sums), and mathematically still
                // a valid "further max" for 'max' fields. Verified against
                // validation_ground_truth.json's Trade_Summary `trade_total` rows, though,
                // that a Trade-level subtotal of a max-aggregated field (e.g. "Max Laden")
                // is actually the SUM of its Sub Trades' own max values, not a further max
                // across all raw rows (e.g. TPT Max Laden 2026/W27 = 18800+3725+28045 =
                // 50570, matching ground truth exactly — not max(18800,3725,28045)=28045).
                // 'calc' fields (e.g. Trunk Utilization = Total TEU / Max Laden) need no
                // separate handling: they read from these same _totals at render time, so
                // once the underlying 'max' field is rolled up correctly the ratio is too
                // (verified: 17763 / 50570 = 0.3512557 matches ground truth's TPT Trunk
                // Utilization trade_total for 2026/W27 exactly).
                const rollupFields = dataFields.filter(df => df.rollupSumOfChildren && df.agg === 'max');
                if (rollupFields.length > 0) {
                    // rollupStableAtDepth (optional, per-field): the tree depth (1 = first
                    // rowField, 2 = second, ...) at which this field's raw-aggregated value is
                    // already correct/final -- e.g. a value that's constant across a deeper
                    // dimension (like Sector Alloc being constant across Sale Week within one
                    // Lane) is "stable" at the Lane depth: summing UP from Lane to SubTrade/
                    // Trade/root is correct (combining genuinely different lanes), but summing
                    // DOWN from SaleWeek children into their Lane parent is not (it would just
                    // multiply the same constant by the week count). Fields with no such
                    // constant-within-a-deeper-dimension behavior (e.g. Max Laden, genuinely
                    // max-per-raw-row) default to Infinity -- sum applies at every level, as
                    // before.
                    const applyRollup = (node, depth) => {
                        const childNodes = Object.values(node._children);
                        childNodes.forEach(c => applyRollup(c, depth + 1)); // post-order
                        if (childNodes.length === 0) return; // leaf: keep raw-aggregated value
                        rollupFields.forEach(df => {
                            const stableAtDepth = df.rollupStableAtDepth || Infinity;
                            if (depth >= stableAtDepth) return; // children are past the stable depth -- don't sum, keep this node's own raw (already-correct) value
                            const colVals = new Set(Object.keys(node._totals));
                            childNodes.forEach(c => Object.keys(c._totals).forEach(cv => colVals.add(cv)));
                            colVals.forEach(colVal => {
                                if (!node._totals[colVal] || !node._totals[colVal][df.name]) return;
                                let sum = 0;
                                childNodes.forEach(c => {
                                    const ct = c._totals[colVal] && c._totals[colVal][df.name];
                                    if (ct) sum += ct.max;
                                });
                                node._totals[colVal][df.name].max = sum;
                            });
                        });
                    };
                    // Apply all the way to the synthetic root too (rendered as the visible
                    // "Grand Total" row), not just Trade-level nodes. This is NOT double-
                    // counting: post-order, summing each Trade's already-summed total at the
                    // root is mathematically identical to summing every leaf value directly
                    // (associativity of sum) -- e.g. root = TPT_sum(50570) + TAT_sum(11000) =
                    // 61570 = the same 61570 you'd get summing all 5 raw subtrade maxes
                    // directly. An earlier version of this comment treated that as suspicious
                    // inflation and skipped root; live-tested against the full real dataset,
                    // that turned out to be the wrong call: on a sibling pivot with the same
                    // shape of Max/Sum ratio but no rollup, the *un-rolled-up* root produced
                    // an obviously-wrong 3831% "Current Laden Utiliz %" on real data (summing
                    // Current Laden across 964 rows against a Max Laden that was just one
                    // row's raw max, since it never rolled up past the leaf level either) --
                    // strong evidence the un-rolled-up root value is the one to distrust, not
                    // the rolled-up one.
                    applyRollup(root);
                }

                return { root, colKeys };
            }, [data, config]);
            
            const flatten = (node, level = 0, isLastChild = true, prefix = '', parentId = 'root') => {
                let rows = [];
                const nodeId = `${parentId}-${node.label}`;
                const hasChildren = Object.keys(node._children).length > 0;
                rows.push({
                    id: nodeId,
                    level,
                    label: node.label,
                    totals: node._totals,
                    context: node.context,
                    isLastChild,
                    prefix,
                    hasChildren
                });
                
                if (collapsedNodes.has(nodeId)) return rows;
                
                const childrenKeys = rowFields[level] && rowFields[level].key === 'saleWeek'
                    ? Object.keys(node._children).sort(compareSaleWeek)
                    : Object.keys(node._children).sort();
                childrenKeys.forEach((key, index) => {
                    const isLast = index === childrenKeys.length - 1;
                    const newPrefix = prefix + (isLastChild ? '    ' : '│   ');
                    rows = rows.concat(flatten(node._children[key], level + 1, isLast, newPrefix, nodeId));
                });
                return rows;
            };
            
            const renderRows = useMemo(() => {
                if (!aggregated.root || Object.keys(aggregated.root._totals).length === 0) return [];
                return flatten(aggregated.root, 0, true, '');
            }, [aggregated]);
            
            const colKeysToRender = colField ? aggregated.colKeys : ['Total'];
            
            return (
                <div className="border-2 border-black overflow-x-auto bg-white shadow-lg rounded-md mb-4">
                    <h2 className="text-xl font-bold text-white p-2 flex justify-between rounded-t-sm" style={{ backgroundColor: accentColor }}>
                        <span>{title}</span>
                        {colField && <span className="text-sm font-normal self-end">Columns: {colField}</span>}
                    </h2>
                    <table className="w-full text-xs text-center border-collapse border border-gray-400">
                        <caption style={{ position: 'absolute', width: '1px', height: '1px', padding: 0, margin: '-1px', overflow: 'hidden', clip: 'rect(0,0,0,0)', whiteSpace: 'nowrap', border: 0 }}>{title}</caption>
                        <thead className="bg-[#333333] text-white sticky top-0 z-10 shadow-sm border-black">
                            {colField && !valuesInRows && (
                                <tr>
                                    <th className="border border-black p-1 min-w-[200px] text-left relative" style={colWidths.rowLabels ? { width: colWidths.rowLabels, minWidth: colWidths.rowLabels } : undefined}>Row Labels<ColResizeHandle colKey="rowLabels" /></th>
                                    {colKeysToRender.map((c, i) => (
                                        <th key={i} colSpan={dataFields.length} className="border border-black p-1 bg-[#444444]">{c}</th>
                                    ))}
                                    <th colSpan={dataFields.length} className="border border-black p-1 font-bold">Grand Total</th>
                                </tr>
                            )}
                            <tr>
                                <th className="border border-black p-1 min-w-[200px] text-left relative" style={colWidths.rowLabels ? { width: colWidths.rowLabels, minWidth: colWidths.rowLabels } : undefined}>Row Labels<ColResizeHandle colKey="rowLabels" /></th>
                                {colField && valuesInRows && (
                                    <>
                                        <th className="border border-black p-1 bg-[#444444]">Values</th>
                                        {colKeysToRender.map((c, i) => (
                                            <th key={i} className="border border-black p-1 bg-[#444444]">{c}</th>
                                        ))}
                                        <th className="border border-black p-1 font-bold">Grand Total</th>
                                    </>
                                )}
                                {(!colField || !valuesInRows) && (colField ? [...colKeysToRender, 'Total'] : ['Total']).map((cKey) => (
                                    dataFields.map((df, dfIdx) => (
                                        <th key={`${cKey}-${dfIdx}`} className={`border border-black p-1 min-w-[80px] relative ${cKey === 'Total' && colField ? 'font-bold bg-[#203764]' : ''}`} style={colWidths[df.name] ? { width: colWidths[df.name], minWidth: colWidths[df.name] } : undefined}>{df.label}<ColResizeHandle colKey={df.name} /></th>
                                    ))
                                ))}
                            </tr>
                        </thead>
                        <tbody>
                            {renderRows.map((row, i) => {
                                const customClass = rowClass && row.level === rowFields.length ? rowClass(row.totals, row.context) : '';
                                // hover:bg-gray-100 (specificity 0,2,0) would otherwise beat a plain
                                // bg-[#DA9694]/bg-[#ffc000]/bg-[#d9d9d9] status class (specificity 0,1,0)
                                // on mouse-over, washing out AP Frozen/AP Only/VMS row coloring -- Detail
                                // View has no such hover wash-out (its rows carry no hover state at all),
                                // so skip the hover class whenever a status color is present to match it.
                                const trClassBase = `${customClass ? '' : 'hover:bg-gray-100'} ${row.level === 0 ? (prettyGrandTotal ? 'font-bold shadow-md' : 'bg-[#d9e1f2] font-bold') : ''} ${row.level === 1 ? 'font-bold' : ''}`;
                                // Every data <td> below unconditionally gets bg-[#eef2fa] whenever
                                // cKey === 'Total' -- true for every cell on a pivot with no colField
                                // (Sector_Summary's pivots have none), which would otherwise paint over
                                // a row-level Grand Total background. Computed once per row and applied
                                // directly on each <td>'s style (both the row-label cell and the data
                                // cells) rather than fighting it via CSS specificity.
                                const grandTotalCellStyle = (row.level === 0 && prettyGrandTotal) ? { backgroundColor: accentColor, color: '#fff' } : undefined;

                                if (valuesInRows) {
                                    return (
                                        <React.Fragment key={i}>
                                            <tr className={`${trClassBase} ${customClass} ${row.level === 0 ? 'bg-[#d9e1f2] font-bold' : ''}`}>
                                                {/* Same Grand-Total-centering rule as the non-valuesInRows branch
                                                    below: row.level === 0 is always the single Grand Total row --
                                                    center it (dropping the flex layout, which would otherwise
                                                    left-anchor the text regardless of the td's text-align) while
                                                    every other row keeps its left-aligned, indented hierarchy. */}
                                                <td rowSpan={dataFields.length + 1} className={`border border-gray-400 p-1 align-top ${row.level === 0 ? 'text-center' : 'text-left'}`}>
                                                    <span style={{ paddingLeft: row.level === 0 ? 0 : `${Math.max(0, row.level - 1) * 1.5}rem` }} className={row.level === 0 ? '' : 'flex items-center'}>
                                                        {row.level > 0 && (row.hasChildren
                                                            ? <button type="button" onClick={() => toggleCollapse(row.id)} aria-label={collapsedNodes.has(row.id) ? 'Expand row' : 'Collapse row'} className="mr-1 w-4 text-center border border-gray-400 bg-white shadow-sm font-bold text-[10px] leading-tight hover:bg-gray-200">{collapsedNodes.has(row.id) ? '+' : '−'}</button>
                                                            : <span className="mr-1 w-4 text-center inline-block">•</span>
                                                        )}
                                                        {row.label}
                                                    </span>
                                                </td>
                                                {/* Fill the empty cells for the parent header row so borders connect */}
                                                <td className="border border-gray-400 p-1 bg-gray-100"></td>
                                                {[...colKeysToRender, 'Total'].map((cKey, cIdx) => (
                                                    <td key={`empty-${cIdx}`} className="border border-gray-400 p-1 bg-gray-100"></td>
                                                ))}
                                            </tr>
                                            {dataFields.map((df, dfIdx) => (
                                                <tr key={`${i}-${dfIdx}`} className={`${customClass || 'bg-white hover:bg-gray-50'}`}>
                                                    <td className="border border-gray-400 p-1 text-left bg-gray-100 font-semibold">{df.label}</td>
                                                    {[...colKeysToRender, 'Total'].map((cKey, cIdx) => {
                                                        let val = 0;
                                                        const tGrp = row.totals[cKey] || {};
                                                        if (df.agg === 'calc' && df.calc) {
                                                            // 3rd/4th args (row.context, cKey) are additive --
                                                            // existing 1-arg calc functions elsewhere simply
                                                            // ignore them. Added so a calc field can look up a
                                                            // value keyed by this node's tree context (e.g.
                                                            // trade/subTrade) and which column (Sale Week or
                                                            // 'Total') it's being rendered for -- needed by
                                                            // Trade_Summary's lane-aware Max Laden fix below.
                                                            val = df.calc(tGrp, row.context, cKey);
                                                        } else {
                                                            const t = tGrp[df.name] || { sum: 0, max: 0, count: 0 };
                                                            if (df.agg === 'sum') val = t.sum;
                                                            if (df.agg === 'max') val = t.max;
                                                            if (df.agg === 'count') val = t.count;
                                                            if (df.agg === 'avg') val = t.count > 0 ? t.sum / t.count : 0;
                                                        }

                                                        let displayVal = val;
                                                        if (df.format === 'number') displayVal = formatNumberWithCommas(val);
                                                        // rawFraction fields (e.g. peakUtilRaw, standbyRaw) store a raw
                                                        // fractional decimal (1.5 = 150%), not an already-scaled percent
                                                        // -- confirmed empirically against the real upload file (see
                                                        // getPercentNum's own comment + the 8/14/2026 live sample showing
                                                        // "Measures Peak Pol Utilz" values like 0.09/0.7/3.63). Scale via
                                                        // getPercentNum ONLY for display; `val` itself stays raw/unscaled
                                                        // so cellClass callbacks below (which call getPercentNum(val)
                                                        // themselves) don't get double-scaled.
                                                        else if (df.format === 'percent') displayVal = `${Math.round(df.rawFraction ? getPercentNum(val) : val)}%`;
                                                        else if (df.format === 'accounting') displayVal = formatAccountingNumber(val);
                                                        else if (df.format === 'accountingSignedRed') displayVal = formatAccountingSigned(val);

                                                        // Backward-compatible extension: pass the row's full totals
                                                        // bundle (tGrp) as a 2nd arg so cellClass callbacks that need
                                                        // to compare sibling fields (e.g. Peak vs Current Utiliz %)
                                                        // can do so; existing single-arg callbacks just ignore it.
                                                        // negativeValueClass mirrors the reference Excel's red-negative-
                                                        // number rule (see its definition) for accounting/number fields.
                                                        const cClass = `${df.cellClass ? df.cellClass(val, tGrp) : ''} ${negativeValueClass(val, df.format)}`.trim();
                                                        // Same fix as the sibling branch below: don't let the
                                                        // always-on Total-column tint fight a cellClass-driven
                                                        // background of equal specificity (see that comment).
                                                        const cClassHasOwnBg = cClass.includes('bg-');
                                                        return <td key={cIdx} className={`border border-gray-400 p-1 ${(cKey === 'Total' && !cClassHasOwnBg) ? 'font-bold bg-[#eef2fa]' : (cKey === 'Total' ? 'font-bold' : '')} ${cClass}`}>{displayVal}</td>;
                                                    })}
                                                </tr>
                                            ))}
                                        </React.Fragment>
                                    );
                                }
                                
                                return (
                                    <tr key={i} className={`${trClassBase} ${customClass}`}>
                                        {/* Row Labels column is normally left-aligned so the indentation
                                            hierarchy (paddingLeft below) reads correctly, but the reference
                                            Excel pivots center-align the Grand Total row specifically -- match
                                            that here (row.level === 0 is always the single Grand Total row). */}
                                        <td className={`border border-gray-400 p-1 ${row.level === 0 ? 'text-center' : 'text-left'}`} style={grandTotalCellStyle}>
                                            <span style={{ paddingLeft: row.level === 0 ? 0 : `${Math.max(0, row.level - 1) * 1.5}rem` }}>
                                                {row.level > 0 && (row.hasChildren
                                                    ? <button type="button" onClick={() => toggleCollapse(row.id)} aria-label={collapsedNodes.has(row.id) ? 'Expand row' : 'Collapse row'} className="cursor-pointer select-none hover:text-blue-700 bg-transparent border-0 p-0 m-0 inline align-baseline">{collapsedNodes.has(row.id) ? '▶ ' : '▼ '}</button>
                                                    : '• '
                                                )}
                                                {getRowStatusBadge(customClass)}{row.label}
                                            </span>
                                        </td>
                                        {(colField ? [...colKeysToRender, 'Total'] : ['Total']).map((cKey) => (
                                            dataFields.map((df, colIdx) => {
                                                let val = 0;
                                                const tGrp = row.totals[cKey] || {};
                                                if (df.agg === 'calc' && df.calc) {
                                                    val = df.calc(tGrp, row.context, cKey);
                                                } else {
                                                    const t = tGrp[df.name] || { sum: 0, max: 0, count: 0 };
                                                    if (df.agg === 'sum') val = t.sum;
                                                    if (df.agg === 'max') val = t.max;
                                                    if (df.agg === 'count') val = t.count;
                                                    if (df.agg === 'avg') val = t.count > 0 ? t.sum / t.count : 0;
                                                }

                                                let displayVal = val;
                                                if (df.format === 'number') displayVal = formatNumberWithCommas(val);
                                                // See matching comment on the sibling valuesInRows render branch
                                                // above: rawFraction fields need *100 scaling for display only;
                                                // `val` stays raw so cellClass callbacks aren't double-scaled.
                                                else if (df.format === 'percent') displayVal = `${Math.round(df.rawFraction ? getPercentNum(val) : val)}%`;
                                                else if (df.format === 'accounting') displayVal = formatAccountingNumber(val);
                                                else if (df.format === 'accountingSignedRed') displayVal = formatAccountingSigned(val);

                                                // Mirrors native POL_Booking_Flash CF rules like
                                                // AND($H12="VMS", P12=0) -> white-on-white font, which hide the
                                                // "0" placeholder for VMS rows on specific numeric columns. This
                                                // pivot reads straight from filteredRawRows (not the Detail
                                                // View's tableData VMS field-wipe), so a VMS leaf row's raw 0
                                                // would otherwise render as a literal "0" here. Only applies at
                                                // the leaf level (one raw row per group, since rowFields here
                                                // form a unique key) and only to dataFields opted in via
                                                // config.vmsZeroMaskFields.
                                                const isLeafRow = row.level === rowFields.length;
                                                const rowIsVMS = isLeafRow && String(row.context.vvd || '').trim().toUpperCase() === 'VMS';
                                                let isVmsMasked = false;
                                                if (rowIsVMS && val === 0 && config.vmsZeroMaskFields && config.vmsZeroMaskFields.includes(df.name)) {
                                                    displayVal = '';
                                                    isVmsMasked = true;
                                                }

                                                // See matching comment above: cellClass(val, tGrp) is a
                                                // backward-compatible extension for sibling-field comparisons.
                                                // Skip it entirely for a masked-to-blank cell, otherwise a
                                                // sibling field's value could still flag this cell (e.g. red)
                                                // with nothing visible inside it.
                                                const cClass = `${(!isVmsMasked && df.cellClass) ? df.cellClass(val, tGrp) : ''} ${!isVmsMasked ? negativeValueClass(val, df.format) : ''}`.trim();
                                                // grandTotalCellStyle (inline) always wins over the bg-[#eef2fa]
                                                // class below since inline styles beat any class background --
                                                // no need to conditionally drop the class.
                                                //
                                                // Real bug found 2026-08-17 via user report (white text
                                                // unreadable on the Avg Utilization column): the always-on
                                                // bg-[#eef2fa] Total-column tint and a cellClass-driven
                                                // background (e.g. avgUtilz's bg-red-600 when >100%) are two
                                                // separate utility classes of EQUAL CSS specificity -- which
                                                // one visually wins is undefined (depends on stylesheet
                                                // insertion order, not the order they appear in this string),
                                                // so bg-red-600 could lose to the pale bg-[#eef2fa] while
                                                // text-white still applied, leaving white text on a near-white
                                                // background. Fixed by only adding the Total-column tint when
                                                // cClass hasn't already claimed its own background.
                                                const cClassHasOwnBg = cClass.includes('bg-');
                                                return <td key={`${cKey}-${colIdx}`} className={`border border-gray-400 p-1 ${(cKey === 'Total' && !cClassHasOwnBg) ? 'font-bold bg-[#eef2fa]' : (cKey === 'Total' ? 'font-bold' : '')} ${cClass}`} style={grandTotalCellStyle}>{displayVal}</td>;
                                            })
                                        ))}
                                    </tr>
                                );
                            })}
                        </tbody>
                    </table>
                </div>
            );
        };

        // --- Automated data refresh config ---------------------------------------
        // CSV_SOURCE_URL: the Google Sheet's "Publish to the web" CSV link (Sheet ->
        // File > Share > Publish to the web > CSV, targeting the tab Looker's
        // scheduled delivery overwrites). Leave the placeholder in place and the app
        // behaves exactly as before (manual upload/drag-drop only, no auto-fetch or
        // polling) -- swap in the real URL to turn on auto-load + background checks.
        const CSV_SOURCE_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vQNykGT8bYqwDC4k9loE5L8-j-rs9fyzPetfnrNwYAAZVRTXVLDyxrtCm9eP736OUAYEi6wULzeCaBn/pub?gid=0&single=true&output=csv';
        // POLL_INTERVAL_MS: how often to check the published link for changes.
        // 5 minutes matches Google's own cache TTL on publish-to-web links, so
        // polling more often than this can't actually see fresher data anyway.
        const POLL_INTERVAL_MS = 5 * 60 * 1000;
        const isCsvSourceConfigured = () => !!CSV_SOURCE_URL && !CSV_SOURCE_URL.includes('REPLACE_WITH');

        function FlashReportDashboard() {
            const [remarksHidden, setRemarksHidden] = useState(true);
            const [reeferHidden, setReeferHidden] = useState(false);
            const [bsaHidden, setBsaHidden] = useState(false);
            const [activityHidden, setActivityHidden] = useState(false);
            const [sectorAllocHidden, setSectorAllocHidden] = useState(false);
            const [dgVolumeHidden, setDgVolumeHidden] = useState(false);
            const [opIssuesHidden, setOpIssuesHidden] = useState(false);
            const [apStatusHidden, setApStatusHidden] = useState(false);
            const [rotationHidden, setRotationHidden] = useState(false);
            const [tradeBreakdownHidden, setTradeBreakdownHidden] = useState(false);
            const [vcoHidden, setVcoHidden] = useState(false);
            // POL_Booking_Flash-only toggle (its "Hide ETA" button) -- Detail View has no
            // equivalent ETA-vs-Proforma column/toggle of its own.
            const [etaHidden, setEtaHidden] = useState(false);
            const [businessRulesOpen, setBusinessRulesOpen] = useState(false);
            // "Analyze" feature (2026-08-14) -- a modal summarizing how the currently-visible
            // service lane(s)/POL(s) are performing over the last 4 Sale Weeks present in the
            // current filter set, on the Booking Flash and POL_Booking_Flash tabs only.
            const [analysisModalOpen, setAnalysisModalOpen] = useState(false);
            // User-adjustable column widths (2026-08-14) -- separate width maps per hand-built
            // table (POL_Booking_Flash / Booking Flash's Detail View) since both are rendered
            // inline in this component, not their own component instances; PivotTableViewer
            // (Trade_Summary/Sector_Summary/Booking Summary) manages its own width state
            // internally since it IS its own component. Keyed by column identifier (rowField
            // key or dataField name) -> width in px.
            const [polColWidths, setPolColWidths] = useState({});
            const [detailColWidths, setDetailColWidths] = useState({});
            // Generic drag-to-resize handler factory: given a widths state + setter, returns a
            // mousedown handler for a given column key. Shared by every table's resize handles
            // rather than reimplementing the same drag logic per table.
            const makeColResizer = (widths, setWidths) => (key) => (e) => {
                e.preventDefault();
                e.stopPropagation();
                const thEl = e.currentTarget.closest('th');
                const startWidth = widths[key] || (thEl ? thEl.offsetWidth : 80);
                const startX = e.clientX;
                const onMove = (moveEvent) => {
                    const newWidth = Math.max(40, startWidth + (moveEvent.clientX - startX));
                    setWidths(prev => ({ ...prev, [key]: newWidth }));
                };
                const onUp = () => {
                    window.removeEventListener('mousemove', onMove);
                    window.removeEventListener('mouseup', onUp);
                };
                window.addEventListener('mousemove', onMove);
                window.addEventListener('mouseup', onUp);
            };
            const startPolColResize = makeColResizer(polColWidths, setPolColWidths);
            const startDetailColResize = makeColResizer(detailColWidths, setDetailColWidths);
            // A small draggable handle rendered inside a <th> (which needs position:relative
            // for this absolute positioning to anchor correctly). cursor-col-resize + a visible
            // hover/active tint give a discoverable affordance without adding visual clutter
            // when idle.
            const ColResizeHandle = ({ onMouseDown }) => (
                <span
                    onMouseDown={onMouseDown}
                    className="absolute top-0 right-0 h-full w-1.5 cursor-col-resize hover:bg-blue-400 active:bg-blue-600 z-10"
                    style={{ userSelect: 'none' }}
                    aria-hidden="true"
                />
            );
            // A thin horizontal scrollbar mirrored above a wide table (2026-08-14), so the user
            // doesn't have to scroll all the way down to the table's own bottom scrollbar just to
            // pan sideways. `containerRef` is the existing overflow-x-auto wrapper div around the
            // real <table>; this renders a second, independent overflow-x-auto strip above it with
            // a same-width dummy spacer inside, and keeps the two scrollLeft positions in sync in
            // both directions. Width is measured off the real <table> (not the wrapper) via
            // ResizeObserver so it stays correct as columns are drag-resized or data changes.
            const TopScrollSync = ({ containerRef }) => {
                const topRef = useRef(null);
                const [trackWidth, setTrackWidth] = useState(0);
                useEffect(() => {
                    const container = containerRef.current;
                    if (!container) return;
                    const table = container.querySelector('table');
                    const measure = () => setTrackWidth(container.scrollWidth);
                    measure();
                    const ro = new ResizeObserver(measure);
                    ro.observe(container);
                    if (table) ro.observe(table);
                    const onContainerScroll = () => {
                        if (topRef.current) topRef.current.scrollLeft = container.scrollLeft;
                    };
                    container.addEventListener('scroll', onContainerScroll);
                    return () => {
                        ro.disconnect();
                        container.removeEventListener('scroll', onContainerScroll);
                    };
                }, [containerRef]);
                const onTopScroll = (e) => {
                    if (containerRef.current) containerRef.current.scrollLeft = e.target.scrollLeft;
                };
                return (
                    <div
                        ref={topRef}
                        onScroll={onTopScroll}
                        className="overflow-x-auto overflow-y-hidden border-2 border-b-0 border-black bg-gray-200"
                        style={{ height: '14px' }}
                        aria-hidden="true"
                    >
                        <div style={{ width: trackWidth ? `${trackWidth}px` : '100%', height: '1px' }} />
                    </div>
                );
            };

            // side effects if used for text alone). Applied via the CSS `zoom` property (not

            const [textSizePercent, setTextSizePercent] = useState(100);

            // Detail View column-group sizes (field count per toggle group), used to keep

                + (bsaHidden ? 0 : 2)            // BSA TEU, BSA Wgt

            const detailBlankRowColSpan = detailVisibleColumnCount - 3; // minus Trade/Sub Trade/Lane (rendered as separate rowSpan tds)

            const [isCheckingForUpdates, setIsCheckingForUpdates] = useState(false);

            const [oldRawRows, setOldRawRows] = useState([]);

            // AP Status slicer (AP Frozen/AP Only), matching the reference Excel's

            const renderFilter = (colKey, label) => (

                    type="text"

            // Pure parse step shared by every data-loading path (file upload/drop AND
            // the fetch-based auto-refresh below) -- takes an already-parsed SheetJS
            // workbook and returns either { ok: true, rows } or { ok: false, error },
            // touching no component state itself so callers decide what to do with
            // the result (a fresh upload sets state directly; a background poll may
            // just want to compare/stash it first).
            const parseWorkbookToRows = (wb) => {
                        const wsname = wb.SheetNames[0];
                        const ws = wb.Sheets[wsname];

                        const rawData = window.XLSX.utils.sheet_to_json(ws, { raw: false, defval: '' });

                        if (rawData && rawData.length > 0) {
                            // --- Schema validation: confirm this file actually looks like a Booking Flash
                            // "Data_download" export before trusting it, using the same normalized-alias
                            // matching approach as getVal() below so this check can't disagree with how
                            // the app actually reads data. Each entry is the SAME alias list getVal() uses
                            // for that field, so a legacy-schema file using short header names (e.g. plain
                            // 'Trade', 'Sale Week') is recognized here just as it would be by getVal().
                            const CRITICAL_COLUMNS = [
                                ['Vessel 1st Trade', 'Trade'],
                                ['Vessel 1st Sub Trade', 'Sub Trade', 'SubTrade', 'Sub_Trade'],
                                ['Vessel 1st VVD', 'VVD', 'Voyage'],
                                ['Route Date 1st Sale Week', 'Sale Week', 'SaleWeek', 'Week'],
                                ['Route Location 1st Pol', '1st Pol', 'POL'],
                                ['Measures Overall Status', 'BKG FLASH STATUS', 'MeasuresOverallStatus'],
                                ['MCT Max Laden', 'Max LDN', 'MaxLdn', 'Max Laden'],
                                ['Measures POL Laden TEU', 'Current Laden', 'Laden TEU', 'Cur Laden'],
                                ['POL Max Laden TEU', 'POL Max Laden'],
                                ['Measures Overall Booking Utilz', 'Current Laden Utiliz', 'Booking Utilz', 'Booking Utiliz']
                            ];
                            const headerKeys = Object.keys(rawData[0]).map(k => String(k).toLowerCase().replace(/[^a-z0-9]/g, ''));
                            const isColumnPresent = (rawAlias) => {
                                const cleanAlias = rawAlias.toLowerCase().replace(/[^a-z0-9]/g, '');
                                if (headerKeys.includes(cleanAlias)) return true;
                                if (cleanAlias.length < 3) return false;
                                return headerKeys.some(k => k.includes(cleanAlias));
                            };
                            const criticalFoundCount = CRITICAL_COLUMNS.filter(aliases => aliases.some(isColumnPresent)).length;

                            if (criticalFoundCount < CRITICAL_COLUMNS.length / 2) {
                                return { ok: false, error: "This file doesn't look like a Booking Flash \"Data_download\" export — expected columns like \"Vessel 1st Trade\" and \"Route Date 1st Sale Week\" were not found. Please check you're uploading the right file." };
                            }

                            const formattedData = rawData.map((row, index) => {
                                const cleanRow = {};
                                const rowKeys = Object.keys(row);
                                
                                rowKeys.forEach(k => {
                                    const cleanK = String(k).toLowerCase().replace(/[^a-z0-9]/g, '');
                                    cleanRow[cleanK] = row[k];
                                });

                                const cleanRowKeys = Object.keys(cleanRow);

                                const getVal = (aliases) => {
                                    for (let alias of aliases) {
                                        const cleanAlias = alias.toLowerCase().replace(/[^a-z0-9]/g, '');
                                        if (cleanRow[cleanAlias] !== undefined && cleanRow[cleanAlias] !== '') {
                                            return cleanRow[cleanAlias];
                                        }
                                    }
                                    for (let alias of aliases) {
                                        const cleanAlias = alias.toLowerCase().replace(/[^a-z0-9]/g, '');
                                        if (cleanAlias.length < 3) continue;
                                        const matchingKey = cleanRowKeys.find(k => k.includes(cleanAlias));
                                        if (matchingKey && cleanRow[matchingKey] !== '') {
                                            return cleanRow[matchingKey];
                                        }
                                    }
                                    return '';
                                };

                                const rowObj = {
                                    id: index + 1,
                                    trade: getVal(['Vessel 1st Trade', 'Trade']) || 'TPT',
                                    subTrade: getVal(['Vessel 1st Sub Trade', 'Sub Trade', 'SubTrade', 'Sub_Trade']),
                                    lane: getVal(['Vessel 1st Lane', 'Lane', 'Service']),
                                    saleWeek: getVal(['Route Date 1st Sale Week', 'Sale Week', 'SaleWeek', 'Week']),
                                    pic: getVal(['MCT PIC', 'MCT Spc Analyst', 'PIC (spc/mkg)', 'PIC', 'SPC Analyst', 'Mktg Analyst']),
                                    coast: getVal(['MCT Spc Team', 'Spc Team', 'Coast']),
                                    cutoff: getVal(['Route Date Cut/off Date', '1st POL Cutoff', '1stPOLCutoff', 'Cutoff', '1st POL']),
                                    // The real Data Model field is "Route Date Last Port ETD Date"
                                    // (caption "ETD Last port") -- the old alias "ETD Last Port" is word-
                                    // order-reversed relative to the real column name, so it was never
                                    // actually matching anything via getVal's substring fallback (checked:
                                    // "etdlastport" is not a substring of "routedatelastportetddate").
                                    etd: getVal(['Route Date Last Port ETD Date', 'ETD Last Port', 'ETDLastPort', 'Last Port ETD', 'ETD']),
                                    // status/loadingStatus are normalized (see normalizeApStatus above) for the
                                    // AP Frozen/AP Only comparisons below; statusDisplay keeps the original raw
                                    // text (e.g. "AP Frozen(GD6)") for the Detail View's Status column so the
                                    // user still sees exactly what's in the source file.
                                    status: normalizeApStatus(getVal(['Measures Overall Status', 'BKG FLASH STATUS', 'MeasuresOverallStatus'])),
                                    statusDisplay: getVal(['Measures Overall Status', 'BKG FLASH STATUS', 'MeasuresOverallStatus']),
                                    loadingStatus: normalizeApStatus(getVal(['Measures Loading Status', 'MeasuresLoadingStatus'])),
                                    vvd: getVal(['Vessel 1st VVD', 'VVD', 'Voyage']),
                                    vessel: getVal(['Vessel Vessel Name', 'Vessel Name', 'Vessel']),
                                    // Per the real DAX "Max Laden" measure (SUMX per-lane MAX of
                                    // MCT Max Laden Update), the underlying raw column is "MCT Max
                                    // Laden Update", NOT "MCT Max Laden" -- confirmed distinct columns
                                    // in the raw file. Kept 'MCT Max Laden' as a fallback in case a
                                    // future export drops the "Update" column, but the DAX-verified
                                    // name now takes priority.
                                    maxLdn: getVal(['MCT Max Laden Update', 'MCT Max Laden', 'Max LDN', 'MaxLdn', 'Max Laden']),
                                    // Trimmed to the one Power-Query-verified column name (see getPercentNum's
                                    // comment above): the removed legacy fallbacks (Standby Threshold, Overall
                                    // Threshold, Threshold, Standby) were never confirmed to store the same
                                    // fractional-decimal format getPercentNum now unconditionally scales by 100.
                                    standbyRaw: getVal(['Trunk Threshold']),
                                    curLaden: getVal(['Measures POL Laden TEU', 'Current Laden', 'Laden TEU', 'Cur Laden']),
                                    // Trunk Utilization's real DAX is "[Sum of Measures Laden TEU]", a
                                    // DIFFERENT raw column from "Measures POL Laden TEU" (curLaden above,
                                    // which POL_Booking_Flash's own "Current Laden (TEU)"/"POL Laden TEU"
                                    // column genuinely needs). Checked directly: 958 of 964 real rows have
                                    // identical values between the two columns; the 6 that differ always
                                    // have Measures Laden TEU = 0 where POL Laden TEU is nonzero.
                                    ladenTeu: getVal(['Measures Laden TEU']),
                                    // Same trim as standbyRaw above -- only the verified Power-Query column name.
                                    peakUtilRaw: getVal(['Measures Peak Overall Utilz']),
                                    curUtilRaw: getVal(['Measures Overall Booking Utilz']),
                                    shortfall: getVal(['Max LDN vs BKG', 'Short_Fall', 'Short Fall', 'Shortfall', 'Max Laden vs POL  Booking', 'Max Laden vs POL Booking']),
                                    quote: getVal(['Measures ONE Quote volume', 'ONE Quote', 'ONE Quote Volume', 'Quote']),
                                    broken: getVal(['Measures Broken Routes TEU', 'Broken Routes', 'Broken']),
                                    bsaTeu: getVal(['Measures BSA TEU', 'BSA TEU']),
                                    // Per the Ref sheet, raw column "Measures BSA WGT" has no display
                                    // mapping at all; "Measures Last NA Port BSA Wgt" is the one captioned
                                    // "Last NA Port BSA Wgt" (this field's actual pivot label is "BSA Wgt
                                    // (Last NA Port)" per the reference workbook's Booking_Flash sheet).
                                    bsaWgt: getVal(['Measures Last NA Port BSA Wgt', 'Measures BSA WGT', 'BSA Wgt', 'BSA QTY', 'Wgt']),
                                    rfrBsaPlugs: getVal(['Measures BSA UNIT RF', 'RFR BSA Plugs', 'BSA UNIT RF']),
                                    rfrBkgPlugs: getVal(['Measures Booking Reefer UNIT', 'RFR BKG Plugs', 'Booking Reefer UNIT']),
                                    rfrMaxLdn: getVal(['RFR Max Laden TEU', 'RFR Max LDN', 'RFR Max Laden']),
                                    rfrBkgTtl: getVal(['Measures Reefer TEU', 'RFR BKG TTL', 'Reefer TEU', 'RFR BKG Total']),
                                    // Per the real "RFR Utilz" DAX measure (DIVIDE(Sum of Measures
                                    // Reefer TEU, Max of Measures BSA TEU RF, 0)), this is a computed
                                    // ratio, not a raw passthrough column -- rfrBsaTeuRfMax is the
                                    // denominator; rfrUtilizRaw itself is computed just below from this
                                    // and the existing rfrBkgTtl (already "Measures Reefer TEU").
                                    rfrBsaTeuRfMax: getVal(['Measures BSA TEU RF']),
                                    // Audited 8/14/2026 against live ground truth: POL_Booking_Flash's own
                                    // "RFR Utilz%" column (O) is a DIFFERENT, POL-specific measure from the
                                    // "RFR Utilz" DAX measure above -- confirmed via a real row where the
                                    // two diverge (rfrUtilizRaw/"Measures Overall Reefer Utilz" = 0.35, but
                                    // the raw "RFR Utilz%" column and "Measures POL Reefer Utilz" both = 0.4,
                                    // matching the reference sheet's cached O-column value exactly). Kept as
                                    // its own field rather than overloading rfrUtilizRaw so Detail View's
                                    // "RFR Utiliz %" (the real Overall DAX measure) is untouched.
                                    rfrUtilizPolRaw: getVal(['RFR Utilz%', 'Measures POL Reefer Utilz']),
                                    actVsBkgUtilzRaw: getVal(['Activity vs Booking Utilz', 'ActVsBkg']),
                                    actVsMaxLdnRaw: getVal(['Activity vs Max Laden', 'ActVsMax']),
                                    inlandAct: getVal(['Measures Active Ipi TEU', 'Inland Activity', 'Active Ipi']),
                                    inlandNoAct: getVal(['Measures Non Active Ipi TEU', 'Inland No Activity', 'Non Active Ipi']),
                                    inlandTotal: getVal(['Measures Ipi Total TEU', 'Inland Total', 'Ipi Total']),
                                    portAct: getVal(['Measures Active Local TEU', 'Port Activity', 'Active Local']),
                                    portNoAct: getVal(['Measures Non Active Loc TEU', 'Port No Activity', 'Non Active Local']),
                                    portTotal: getVal(['Measures Local Total TEU', 'Port Total', 'Local Total']),
                                    // Per the confirmed DAX text (Manage Measures screenshot, 2026-08-14):
                                    // "Activity vs Booking Utilz" = DIVIDE(SUM([Measures Active total TEU]),
                                    // [Sum of Measures Laden TEU], 0); "Activity vs Max Laden" =
                                    // SUM([Measures Active total TEU]) - [Max of MCT Max Laden Update].
                                    // Both need this raw column directly, NOT a manual inlandAct+portAct
                                    // sum -- confirmed as its own distinct raw column (col 74 in the raw
                                    // file), separate from the individual Inland/Port Activity columns.
                                    activeTotalTeu: getVal(['Measures Active total TEU', 'Active total TEU']),
                                    // Sector_Summary's own "Average Max Laden vs Booking" pivot in the
                                    // reference Excel is scoped by a report filter, "Route Date Past 4
                                    // Week Flag" = Y (B3/C3 on that sheet) -- a raw Y/N column (223 Y /
                                    // 741 N rows in the current upload), independent of whatever Sale
                                    // Week slicer buttons the user has selected elsewhere in the app.
                                    past4WeekFlag: getVal(['Route Date Past 4 Week Flag']),
                                    opIssues: getVal(['Vessel Operation Notice', 'Operational Issues', 'Operation Notice']),
                                    secAlloc: getVal(['MCT Sector Allocation', 'Sector Allocation', 'Sec Alloc']),
                                    sgsinDryVsRfr: getVal(['Measures SGSIN Sector Remarks', 'SGSIN Dry vs Reefer', 'SGSIN Dry vs Rfr']),
                                    proformaRot: getVal(['Route Location Rotation Port', 'Proforma Rotation', 'Proforma ETA']),
                                    actualRot: getVal(['Route Location Actual Rotation Port', 'Actual Rotation', 'Actual Ro']),
                                    apStatus: getVal(['MCT AP Status', 'AP Status']),
                                    tpt: getVal(['TPT']),
                                    tat: getVal(['TAT']),
                                    lwt: getVal(['LWT']),
                                    lnt: getVal(['LNT']),
                                    imt: getVal(['IMT']),
                                    let: getVal(['LET']),
                                    dgTeu: getVal(['DG TEU']),
                                    remarks: getVal(['Vessel Voyage Remark', 'Voyage Remarks', 'Remarks']),
                                    vco: getVal(['VCO Analyst', 'VCO Analyst ', 'VCO']),
                                    // POL_Booking_Flash's ETA group (cols AG:AI in the reference sheet).
                                    // "Coastal ETA vs Proforma" is confirmed pre-formatted text upstream
                                    // (e.g. "+8 days 2 hrs") -- no computation needed, just pass through.
                                    // Uses distinct alias text from proformaRot's own 'Proforma ETA'
                                    // fallback above to avoid the two fields colliding via getVal's
                                    // substring matching.
                                    lastCoastalEta: getVal(['Route Date Last Coastal ETA Time', 'Last Coastal ETA Time']),
                                    proformaEta: getVal(['Route Date Proforma ETA Time', 'Proforma ETA Time']),
                                    coastalEtaVsProforma: getVal(['Route Date Coastal ETA vs Proforma', 'Coastal ETA vs Proforma']),

                                    pol: getVal(['Route Location 1st Pol', '1st Pol', 'POL']),
                                    yard: getVal(['Route Location 1st Yard', 'RouteLocation1stYard', 'Yard']),
                                    plannedMty: getVal(['Measures Planned Mty TEU', 'Planned Mty']),
                                    actualMty: getVal(['Measures Actual Mty TEU', 'Actual Mty']),
                                    polMaxLdn: getVal(['POL Max Laden TEU', 'POL Max Laden']),
                                    polLdnThresh: getVal(['POL Laden Threshold', 'POL Laden Thresh']),
                                    discharge: getVal(['Measures Discharge TEU', 'Discharge']),
                                    peakPolUtilzRaw: getVal(['Measures Peak Pol Utilz', 'Peak Pol Utilz']),
                                    polBkgUtilzRaw: getVal(['Measures POL Booking Utilz', 'POL Booking Utilz']),
                                    maxLdnVsPolBkg: getVal(['Max Laden vs POL  Booking', 'Max Laden vs POL Booking']),
                                    loadableQuant: getVal(['Measures Loadable TEU', 'Loadable Quant', 'Loadable TEU']),
                                    loadableWgt: getVal(['Measures Loadable WGT update', 'Loadable WGT']),
                                    coastalEtd: getVal(['Route Date Coastal ETD Date', 'Coastal ETD Date', 'Coastal ETD']),
                                    portCut: getVal(['Route Date POL Cut/off Date', 'POL Cut/off Date', 'Port Cut']),
                                    sectorRemarks: getVal(['Sector Remarks']),
                                    // Per the real "Avg Max Laden vs Bkg"/"Avg Utilization" DAX measures,
                                    // both reference these two PRE-COMPUTED raw columns directly (SUM of
                                    // the booking one, MAX of the max-laden one) -- not a true row-level
                                    // average of curLaden/maxLdn as previously implemented.
                                    tsAvgBooking: getVal(['Trade Summary Avg Booking']),
                                    tsAvgMaxLdn: getVal(['Trade Summary Avg Max Laden'])
                                };

                                // Per the reference workbook's hidden NOTES sheet: "No PIC on the Max
                                // Laden table will result in a 'TBA' for the SPC PIC." Normalize blank/
                                // whitespace-only PIC here — the earliest point pic is read from the raw
                                // file — so 'TBA' flows through consistently to rawRows, the Detail View,
                                // filteredRawRows (and thus any pivot fed by it), and the existing SPC
                                // Analyst slicer (whose 'TBA' button and matchAnalyst .includes() check
                                // already expect this literal value).
                                rowObj.pic = (rowObj.pic && String(rowObj.pic).trim()) || 'TBA';

                                // Per the confirmed DAX (see activeTotalTeu's comment above): Activity vs
                                // Booking Utilz = DIVIDE(SUM(Measures Active total TEU), Sum of Measures
                                // Laden TEU, 0) -- uses activeTotalTeu directly (not inlandAct+portAct)
                                // over ladenTeu (not inlandTotal+portTotal). This had the wrong
                                // numerator AND denominator before this fix.
                                const activeTotalTeuNum = toNum(rowObj.activeTotalTeu);
                                const ladenTeuNum = toNum(rowObj.ladenTeu);
                                rowObj.actVsBkgUtilzRaw = ladenTeuNum > 0 ? (activeTotalTeuNum / ladenTeuNum) : 0;

                                // RFR Utilz = DIVIDE(Sum of Measures Reefer TEU, Max of Measures BSA
                                // TEU RF, 0) -- rfrBkgTtl is already "Measures Reefer TEU".
                                const rfrBsaTeuRfMax = toNum(rowObj.rfrBsaTeuRfMax);
                                rowObj.rfrUtilizRaw = rfrBsaTeuRfMax > 0 ? (toNum(rowObj.rfrBkgTtl) / rfrBsaTeuRfMax) : 0;

                                // Peak Data POL Dry/Reefer split (see PEAK_DATA_POL_SEED above) -- matched
                                // by lane + first-5-chars-of-pol against the Service+Location Code groups.
                                // Values are already on the 0-100+ percent-point scale (not fractional), so
                                // they're stored plain, matching how the pivot's format:'percent' expects
                                // its `base` fields (see the sheet_to_json {raw:false} + df.format:'percent'
                                // handling elsewhere -- raw Excel percent cells arrive as formatted "NN%"
                                // strings, parsed to plain NN, not NN/100). No match = undefined (renders
                                // blank, not a false zero) -- this seed doesn't claim full lane/pol coverage.
                                const peakDataPolMatch = peakDataPolLookup(rowObj.lane, rowObj.pol);
                                rowObj.peakPolDryUtilz = peakDataPolMatch ? peakDataPolMatch.dryAvg : undefined;
                                rowObj.peakPolRfrUtilz = peakDataPolMatch ? peakDataPolMatch.rfrAvg : undefined;

                                return rowObj;
                            });

                            return { ok: true, rows: formattedData };
                        }
                        return { ok: false, error: 'The file appears to be empty.' };
            };

            const processFile = (file) => {
                if (!file) return;

                if (!window.XLSX) {
                    console.error("XLSX library is not loaded.");
                    setParseError("Unable to read the file: the XLSX library failed to load. Please refresh the page and try again.");
                    return;
                }

                const reader = new FileReader();
                reader.onload = (evt) => {
                    try {
                        const bstr = evt.target.result;
                        const wb = window.XLSX.read(bstr, { type: 'binary' });
                        const result = parseWorkbookToRows(wb);
                        if (result.ok) {
                            setRawRows(result.rows);
                            setParseError(null);
                            setAutoFetchError(null);
                            setLastRefresh(new Date());
                            // A manual upload always wins over anything the background
                            // poll had queued -- drop any stale pending-update banner.
                            setNewDataAvailable(false);
                            pendingCsvTextRef.current = null;
                            hasLoadedDataRef.current = true;
                        } else {
                            setParseError(result.error);
                        }
                        if (fileInputRef.current) fileInputRef.current.value = '';
                    } catch (error) {
                        console.error("Error parsing the file:", error);
                        setParseError(`Failed to parse the uploaded file: ${error && error.message ? error.message : 'unknown error'}. Please verify the file is a valid Excel export and try again.`);
                        if (fileInputRef.current) fileInputRef.current.value = '';
                    }
                };
                reader.readAsBinaryString(file);
            };

            const handleFileUpload = (e) => {
                processFile(e.target.files[0]);
            };

            const handleDrop = (e) => {
                e.preventDefault();
                setIsDragging(false);
                if (e.dataTransfer.files && e.dataTransfer.files.length > 0) {
                    processFile(e.dataTransfer.files[0]);
                    e.dataTransfer.clearData();
                }
            };

            // --- Compare tab: load a second, older data file to diff against the
            // current data. Reuses the same pure parseWorkbookToRows() the main
            // upload path uses, so it inherits the same schema validation and
            // getVal() field mapping -- an "old" file is just a normal Booking
            // Flash data export, nothing special about its format.
            const processOldFile = (file) => {
                if (!file) return;
                if (!window.XLSX) {
                    setOldParseError("Unable to read the file: the XLSX library failed to load. Please refresh the page and try again.");
                    return;
                }
                const reader = new FileReader();
                reader.onload = (evt) => {
                    try {
                        const wb = window.XLSX.read(evt.target.result, { type: 'binary' });
                        const result = parseWorkbookToRows(wb);
                        if (result.ok) {
                            setOldRawRows(result.rows);
                            setOldFileName(file.name);
                            setOldParseError(null);
                        } else {
                            setOldParseError(result.error);
                        }
                        if (oldFileInputRef.current) oldFileInputRef.current.value = '';
                    } catch (error) {
                        console.error("Error parsing the old file:", error);
                        setOldParseError(`Failed to parse the file: ${error && error.message ? error.message : 'unknown error'}. Please verify it's a valid Booking Flash export.`);
                        if (oldFileInputRef.current) oldFileInputRef.current.value = '';
                    }
                };
                reader.readAsBinaryString(file);
            };

            const handleOldFileUpload = (e) => {
                processOldFile(e.target.files[0]);
            };

            const clearOldFile = () => {
                setOldRawRows([]);
                setOldFileName(null);
                setOldParseError(null);
            };

            // --- Automated data refresh (Google Sheet published-CSV link) ------------
            // Looker's own schedule overwrites the Sheet's first tab; this app only
            // ever reads the Sheet's public "Publish to the web" CSV export and never
            // talks to Looker or a Google API directly. See CSV_SOURCE_URL above.

            const fetchCsvText = async () => {
                const res = await fetch(CSV_SOURCE_URL, { cache: 'no-store' });
                if (!res.ok) throw new Error(`Fetch failed with status ${res.status}`);
                return res.text();
            };

            // Parses + applies fetched CSV text immediately (used for the initial load
            // and for the explicit "apply now" actions below) -- NOT used by the silent
            // background poll, which only compares and stashes (see checkForUpdates).
            const applyCsvText = (csvText) => {
                const wb = window.XLSX.read(csvText, { type: 'string' });
                const result = parseWorkbookToRows(wb);
                if (result.ok) {
                    setRawRows(result.rows);
                    setParseError(null);
                    setAutoFetchError(null);
                    setLastRefresh(new Date());
                    setNewDataAvailable(false);
                    pendingCsvTextRef.current = null;
                    lastLoadedCsvTextRef.current = csvText;
                    hasLoadedDataRef.current = true;
                }
                return result;
            };

            // Initial load: try the published Sheet once on mount. Falls back to the
            // ordinary upload dropzone (with a plain-language error) if it fails --
            // rawRows just stays empty, which is the same "please upload" gate that
            // already existed before auto-refresh was added.
            useEffect(() => {
                if (!isCsvSourceConfigured()) return;
                let cancelled = false;
                (async () => {
                    try {
                        const csvText = await fetchCsvText();
                        if (cancelled) return;
                        const result = applyCsvText(csvText);
                        if (!result.ok) setAutoFetchError(result.error);
                    } catch (err) {
                        if (cancelled) return;
                        console.error('Initial data fetch failed:', err);
                        setAutoFetchError(`Couldn't load data automatically (${err.message}). Upload a file manually below, or click Refresh once the connection is back.`);
                    }
                })();
                return () => { cancelled = true; };
                // eslint-disable-next-line react-hooks/exhaustive-deps
            }, []);

            // Background polling: every POLL_INTERVAL_MS, check whether the published
            // CSV has changed. Per Kevin's chosen refresh UX, this NEVER swaps rawRows
            // out from under someone who's mid-filter -- it only raises the
            // "New data available" banner (newDataAvailable) for them to click. The
            // one exception is if nothing has successfully loaded yet at all (e.g. the
            // initial fetch failed and the user hasn't uploaded manually either) --
            // then there's no in-progress view to protect, so it applies directly.
            useEffect(() => {
                if (!isCsvSourceConfigured()) return;
                const checkForUpdates = async () => {
                    setIsCheckingForUpdates(true);
                    try {
                        const csvText = await fetchCsvText();
                        if (!hasLoadedDataRef.current) {
                            // Nothing loaded via ANY path yet -- no in-progress view to
                            // protect, so apply directly instead of showing a banner
                            // nobody has data to compare against.
                            applyCsvText(csvText);
                        } else if (csvText !== lastLoadedCsvTextRef.current) {
                            pendingCsvTextRef.current = csvText;
                            setNewDataAvailable(true);
                        }
                    } catch (err) {
                        // Silent -- a transient network hiccup on a background check
                        // shouldn't interrupt someone who already has data loaded.
                        console.error('Background refresh check failed:', err);
                    } finally {
                        setIsCheckingForUpdates(false);
                    }
                };
                const intervalId = setInterval(checkForUpdates, POLL_INTERVAL_MS);
                return () => clearInterval(intervalId);
                // eslint-disable-next-line react-hooks/exhaustive-deps
            }, []);

            // "New data available" banner click -- applies what the background poll
            // already fetched and stashed, no extra round-trip.
            const applyPendingUpdate = () => {
                if (pendingCsvTextRef.current) {
                    applyCsvText(pendingCsvTextRef.current);
                }
            };

            // Manual "Refresh now" -- an explicit user action, so (unlike the passive
            // background poll) it fetches AND applies immediately.
            const handleManualRefresh = async () => {
                if (!isCsvSourceConfigured()) return;
                setIsCheckingForUpdates(true);
                try {
                    const csvText = await fetchCsvText();
                    const result = applyCsvText(csvText);
                    if (!result.ok) setAutoFetchError(result.error);
                } catch (err) {
                    console.error('Manual refresh failed:', err);
                    setAutoFetchError(`Refresh failed (${err.message}). Please try again, or upload a file manually.`);
                } finally {
                    setIsCheckingForUpdates(false);
                }
            };

            const exportToExcel = () => {
                if (!window.XLSX || !activeTabContentRef.current) return;
                // Scope to the active tab's own container (not the whole document) and
                // export every table found there -- some tabs (e.g. Sector_Summary) render
                // multiple side-by-side tables, and picking only the first would silently
                // drop the rest.
                const tables = activeTabContentRef.current.querySelectorAll('table');
                if (tables.length === 0) return;
                const wb = XLSX.utils.book_new();
                tables.forEach((table, i) => {
                    const caption = table.querySelector('caption');
                    const rawName = (caption && caption.textContent.trim()) || `Table ${i + 1}`;
                    const sheetName = rawName.replace(/[\\/?*[\]:]/g, ' ').slice(0, 31) || `Table ${i + 1}`;
                    const ws = XLSX.utils.table_to_sheet(table);
                    XLSX.utils.book_append_sheet(wb, ws, sheetName);
                });
                XLSX.writeFile(wb, `${activeTab}_export.xlsx`);
            };

            // Exports just the Analyze modal's summary (not the whole table -- that's what the
            // main Export button above is for) as its own small workbook.
            const exportAnalysisToExcel = () => {
                if (!window.XLSX || !serviceLaneAnalysis) return;
                const rows = [
                    {
                        [serviceLaneAnalysis.groupLabel]: 'OVERALL',
                        'Avg Utilization %': Math.round(serviceLaneAnalysis.overall.utilization),
                        'Avg Peak Utilization %': '',
                        'Avg Wkly Capacity (Max Laden)': Math.round(serviceLaneAnalysis.overall.capacity),
                        'Avg Wkly Laden': Math.round(serviceLaneAnalysis.overall.laden),
                        'Avg Wkly Shortfall': Math.round(serviceLaneAnalysis.overall.shortfall)
                    },
                    ...serviceLaneAnalysis.groups.map(g => ({
                        [serviceLaneAnalysis.groupLabel]: g.group,
                        'Avg Utilization %': Math.round(g.avgUtilization),
                        'Avg Peak Utilization %': Math.round(g.avgPeakUtilization),
                        'Avg Wkly Capacity (Max Laden)': Math.round(g.avgWklyMaxLdn),
                        'Avg Wkly Laden': Math.round(g.avgWklyLaden),
                        'Avg Wkly Shortfall': Math.round(g.avgWklyShortfall)
                    }))
                ];
                const ws = XLSX.utils.json_to_sheet(rows);
                const wb = XLSX.utils.book_new();
                XLSX.utils.book_append_sheet(wb, ws, 'Service Lane Analysis'.slice(0, 31));
                const weekTag = String(serviceLaneAnalysis.weekRange).replace(/[^\w]+/g, '_');
                XLSX.writeFile(wb, `${activeTab}_analysis_${weekTag}.xlsx`);
            };

            const toggleFilter = (setState, value) => {
                setState(prev => prev.includes(value) ? prev.filter(v => v !== value) : [...prev, value]);
            };

            const clearSlicers = () => {
                setSelectedSubTrades([]);
                setSelectedAnalysts([]);
                setSelectedCoasts([]);
                setSelectedLanes([]);
                setSelectedSaleWeeks([]);
                setSelectedYards([]);
                setSelectedApStatuses([]);
                setHeaderFilters({});
            };

            // Distinct Sale Week values present in the uploaded data (dedup'd, blanks
            // dropped), ordered chronologically via compareSaleWeek rather than the
            // default lexicographic Array.sort — mirrors Excel's
            // Slicer_Route_Date_1st_Sale_Week, which lists weeks in date order.
            const saleWeekOptions = useMemo(() => {
                const seen = new Set();
                rawRows.forEach(row => {
                    const week = row.saleWeek;
                    if (week !== undefined && week !== null && String(week).trim() !== '') {
                        seen.add(String(week).trim());
                    }
                });
                return Array.from(seen).sort(compareSaleWeek);
            }, [rawRows]);

            // Yard codes (e.g. USLAX06) are open-ended data values rather than a fixed
            // small vocabulary like Coast/Sub Trade, so unlike those hardcoded slicer
            // option lists, the Yard slicer's options are derived from the distinct
            // values actually present in the uploaded data.
            const availableYards = useMemo(() => {
                const set = new Set();
                rawRows.forEach(row => {
                    if (row.yard) set.add(row.yard);
                });
                return Array.from(set).sort();
            }, [rawRows]);

            const filteredRawRows = useMemo(() => {
                return rawRows.filter(row => {
                    const matchSubTrade = selectedSubTrades.length === 0 || selectedSubTrades.includes(row.subTrade);
                    const matchAnalyst = selectedAnalysts.length === 0 || selectedAnalysts.some(analyst =>
                        row.pic && row.pic.toLowerCase().includes(analyst.toLowerCase())
                    );
                    const matchLane = selectedLanes.length === 0 || selectedLanes.includes(row.lane);
                    const matchCoast = selectedCoasts.length === 0 || selectedCoasts.includes(row.coast);
                    const matchSaleWeek = selectedSaleWeeks.length === 0 || selectedSaleWeeks.includes(row.saleWeek);
                    const matchYard = selectedYards.length === 0 || selectedYards.includes(row.yard);
                    const matchApStatus = selectedApStatuses.length === 0 || selectedApStatuses.includes(row.status);

                    let matchHeaderFilters = true;
                    for (const key in headerFilters) {
                        const filterValue = headerFilters[key];
                        if (filterValue && filterValue.trim() !== '') {
                            const rawRowVal = String(row[key] || '').toLowerCase();
                            const searchVal = filterValue.toLowerCase().trim();
                            
                            const cleanedRowVal = rawRowVal.replace(/[,%()]/g, '');
                            const cleanedSearchVal = searchVal.replace(/[,%()]/g, '');
                            
                            if (!rawRowVal.includes(searchVal) && !cleanedRowVal.includes(cleanedSearchVal)) {
                                matchHeaderFilters = false;
                                break;
                            }
                        }
                    }
                    return matchSubTrade && matchAnalyst && matchLane && matchCoast && matchSaleWeek && matchYard && matchApStatus && matchHeaderFilters;
                });
            }, [rawRows, selectedSubTrades, selectedAnalysts, selectedLanes, selectedCoasts, selectedSaleWeeks, selectedYards, selectedApStatuses, headerFilters]);

            // Compare tab data (2026-08-19): diffs oldRawRows (an uploaded "old"
