name: CI

# The app is one static HTML file you edit directly in JSX -- local development still needs no
# build step (see README.md). There is now ONE build artifact, dist/index.html, which is the
# deployable copy with the JSX precompiled; it is what Apps Script serves, and the
# deployable-build job below keeps it from going stale. These jobs mirror AGENTS.md's "Required:
# run the checks after every change to the app" checklist exactly, so a check that's required
# locally is required here too. See README.md's "Verifying changes" section for what each one
# catches and why check 1 alone was never sufficient.
on:
  # 2026-09-24: push used to fire on branches: ['**'], which meant every push to a branch
  # with an open PR ran the ENTIRE check suite TWICE -- once for the push event, once more
  # for pull_request's own synchronize event on the same commit, doubling Actions usage per
  # commit for no added coverage (both runs check the exact same SHA). Restricting push to
  # main only covers the one case pull_request doesn't: a direct push straight to main
  # (a merge, or anything bypassing a PR). Every branch in this repo's own workflow gets a
  # PR immediately, so pull_request alone still covers ordinary development.
  push:
    branches: [main]
  pull_request:

jobs:
  # AGENTS.md check 1 -- fast, catches JSX/JS syntax errors only. The current app file comes from
  # scripts/print_app_file.js, which is the single implementation of the detection rule
  # (scripts/lib/app_file.js pickCurrentAppHtml), so a version bump never needs a workflow edit.
  syntax-check:
    name: Syntax check (Babel + node --check)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - name: Extract inline script and check syntax
        run: |
          APP_FILE="$(node scripts/print_app_file.js)"
          echo "(main app file: $APP_FILE)"
          APP_FILE="$APP_FILE" python3 - <<'EOF'
          import re, os
          content = open(os.environ['APP_FILE']).read()
          open('/tmp/extracted.jsx', 'w').write(re.search(r'<script type="text/babel">(.*?)</script>', content, re.DOTALL).group(1))
          EOF
          node -e "
          const babel = require('@babel/core');
          const fs = require('fs');
          const result = babel.transformFileSync('/tmp/extracted.jsx', { presets: ['@babel/preset-react'] });
          fs.writeFileSync('/tmp/out.js', result.code);
          " && node --check /tmp/out.js

  # Keeps the deployable artifact honest. dist/index.html is COMMITTED so the manual Apps
  # Script deploy stays a copy/paste (see apps-script/README.md) rather than requiring node --
  # which means it can silently go stale the moment someone edits the app file without
  # rebuilding, and stale here means production quietly runs old code behind a green CI.
  # --check rebuilds in memory and diffs, so that fails loudly instead. Blocking, because it is
  # a deterministic file comparison with none of the regression suite's false-failure shape.
  deployable-build:
    name: Deployable build is up to date
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - name: Verify dist/index.html matches a fresh build
        run: node scripts/build_deployable.js --check
      # The artifact is what production loads, so its compiled payload gets the same syntax
      # gate the source does -- a build that emitted broken JS would otherwise only be caught
      # by the (non-blocking) regression suite.
      - name: Syntax-check the compiled payload
        run: |
          node - <<'EOF'
          const fs = require('fs');
          // extractCompiledPayload is required, not re-derived, so this check always matches
          // whatever marker build_deployable.js actually writes -- see that file's own
          // COMPILED_SCRIPT_REGEX/COMPILED_SCRIPT_OPEN comment.
          const { extractCompiledPayload } = require('./scripts/build_deployable.js');
          const html = fs.readFileSync('dist/index.html', 'utf8');
          const payload = extractCompiledPayload(html);
          if (!payload) { console.error('no compiled payload found in dist/index.html'); process.exit(1); }
          // Deliberately NOT un-escaping the build's <\\/script sequences. The app's own source
          // contains the regex literal /<script type="text\\/babel">...<\\/script>/, so reversing
          // the escape blindly corrupts code that was always written that way -- which is how
          // this check first failed. No un-escape is needed: \\/ and / mean the same thing in a
          // JS string, template literal and regex alike, so the payload checks as-is.
          fs.writeFileSync('/tmp/dist_payload.js', payload);
          console.log(`compiled payload: ${(payload.length / 1024).toFixed(0)} KB`);
          EOF
          node --check /tmp/dist_payload.js

  # AGENTS.md check 2 -- static getVal()/alias check against a real export's real header row.
  # Uses the sample export checked into the repo root, same as AGENTS.md's own usage example.
  alias-landmines:
    name: Alias-landmine static check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install openpyxl
      - run: python3 tests/check_alias_landmines.py Booking_Flash_Data_MAIN_UPLOAD_8-12-2026.xlsx

  # Guards the Fields picker's header-filter cleanup. Pure-stdlib and static, so it is fast
  # and blocking: it caught a real shipped bug (bsaTeu listed for auto-clearing while POL
  # renders it ungated), and that bug survived a careful manual scan of the render sites,
  # which is precisely why it is automated rather than written down.
  field-filter-gating:
    name: Field-picker filter-gating check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python3 tests/check_field_filter_gating.py

  # Server-backed preference resolution: WHICH stored value wins and WHETHER a write is sent.
  # Added to CI 2026-09-18 because it was the one check in AGENTS.md's required list that CI did
  # not run -- and that gap had already cost us. #88 merged with this check broken: it slices the
  # preference block positionally, out of the app HTML, and #88 declared a JSX component inside
  # that slice, so `new Function` threw `SyntaxError: Unexpected token '<'` on every run. Nobody
  # saw it, because nothing here ran it. A required check that only runs when someone remembers
  # is not a required check.
  #
  # Blocking, and cheap enough to be: pure Node, no browser, ~22 assertions, needs only the
  # devDependencies `npm ci` already installs.
  server-prefs-logic:
    name: Server preference-resolution check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: node tests/check_server_prefs_logic.js

  # The scheduled per-day historical archive in apps-script/Code.gs (2026-09-29). Runs the real
  # Code.gs under Node with in-memory fakes for the Apps Script services it uses, fed by the
  # committed fixtures: every per-day file must parse (the app's way) to exactly that date's rows
  # from the old single-Sheet archive, the daily job must be idempotent and refuse a download that
  # isn't the export, and the admin-only setup functions must refuse other callers. Blocking;
  # pure Node, no browser.
  archive-logic:
    name: Historical archive (Code.gs) check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: node tests/check_archive_logic.js

  # Same reasoning as server-prefs-logic just above, for the SEPARATE server-extras extension
  # added 2026-09-28 (filter-prefs sync, Export to Drive) -- see docs/SERVER_PREFS_CONTRACT.md's
  # "Addendum (2026-09-28)".
  # A new check added without a ci.yml job is exactly the gap that bit #88; adding this job in
  # the same commit as the feature is the rule that section exists to enforce.
  #
  # Blocking, and cheap enough to be: pure Node, no browser, 15 assertions.
  server-extras-logic:
    name: Server-extras logic check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: node tests/check_server_extras_logic.js

  # The team features in apps-script/DataFeeds.gs and TeamSheet.gs (2026-09-29): the shared CSV
  # cache, VVD notes (author-only), the startup-error log, and the config Sheet -- plus the app's
  # own config validator, loaded verbatim from the app file. Runs the real .gs files under Node
  # with in-memory Apps Script fakes. Blocking; pure Node, no browser.
  team-features-logic:
    name: Team features (DataFeeds.gs / TeamSheet.gs) check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: node tests/check_team_features_logic.js

  # Compare's KPI tiles and the helpers they share with the Analyze modal (2026-09-26). Runs the
  # app's own shared-helper block (between its BEGIN/END markers) headlessly against the real
  # 9-day archive, whose rolling week windows differ between dates -- the case the browser suite's
  # Compare fixtures (identical weeks) cannot exercise, and the one a code review found broken:
  # each side averaged over its own weeks hid two-thirds of the real change. Blocking: pure Node,
  # no browser, 14 assertions, every expected value from an independent implementation.
  compare-kpis:
    name: Compare KPI / shared-helper check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: node tests/check_compare_kpis.js

  # resolveAppHtml() (tests/perf_benchmark.js, over scripts/lib/app_file.js) is shared infrastructure now -- both
  # ci_regression_runner.js and perf_highlight_benchmark.js call it instead of hand-rolling their
  # own BF_APP_HTML handling. A live browser run only ever exercises its two SUCCESS paths (unset,
  # a valid override); nothing exercises its two FAILURE paths (an absolute override, a
  # nonexistent one) or the exact override-flattening bug class it was built to prevent. Blocking,
  # and cheap enough to be: pure Node, no browser, 8 assertions.
  resolve-app-html-check:
    name: App-file resolver check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: node tests/check_resolve_app_html.js

  # Shared-logic pipeline: the generated shared-logic region in the app HTML and apps-script/Shared.gs
  # must match shared/; a stale copy is how hand-synced duplicates drift. A shared/ edit committed
  # without re-running `node scripts/sync_shared.js` fails here. Needs @babel/core, hence `npm ci`.
  # Blocking: deterministic, pure Node, no browser. See docs/TESTING.md "Shared logic".
  shared-sync-check:
    name: Shared-logic sync check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: node tests/check_shared_sync.js

  # The historical-CSV helper: pins the numbers later slices test against, from the committed 9-day
  # CSV, so a helper change that moves one is caught here instead of in a downstream test that
  # assumed the old value. Blocking: pure Node, no browser, dependency-free (`npm ci` only for
  # uniformity with the neighbouring jobs).
  history-days-check:
    name: Historical-days helper check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: node tests/check_history_days.js

  # AGENTS.md check 3 -- forces the timezone itself via subprocess, so it needs no special CI
  # timezone configuration to be meaningful (a UTC-only run would silently miss this bug class).
  timezone-safety:
    name: Date timezone-safety check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: node tests/check_date_timezone_safety.js

  # AGENTS.md check 4 -- live browser regression suite, driven headlessly. The SOURCE run is
  # NON-BLOCKING (step-level continue-on-error below): see tests/ci_regression_runner.js's header
  # comment for why (AGENTS.md's own "Known flakiness" section documents this exact shape of run
  # -- one long automated script -- as an intermittent false-failure source in this project's
  # history). Treat a red source run as "investigate by hand," not as a merge blocker on its own.
  # The dist/index.html run is BLOCKING, as AGENTS.md and scripts/run_ci_locally.js state: there
  # is deliberately no job-level continue-on-error, which would have masked it too (2026-09-28).
  regression-suite:
    name: Live regression suite (source best-effort; dist/index.html blocking)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      # continue-on-error on this step: a flaky/failing source run (see "Known flakiness" above)
      # must neither fail the job nor skip the artifact run below -- a step only runs if every
      # prior step in the job succeeded.
      - run: node tests/ci_regression_runner.js
        continue-on-error: true
      # Run the suite a second time against the DEPLOYED artifact, not just the source it was
      # built from. The chain is otherwise one link short: deployable-build proves
      # dist/index.html matches a fresh build of the source, and the run above proves the
      # source behaves -- but nothing exercises the artifact itself, whose script structure
      # genuinely differs (no babel-standalone, an inert text/babel block, the compiled payload
      # appended after the primer). That is precisely what a future change to
      # scripts/build_deployable.js could break with every other check still green, and the
      # artifact is the thing users actually load. Verified at 125/125 locally against this
      # artifact before being added here.
      - run: BF_APP_HTML=dist/index.html node tests/ci_regression_runner.js

  # The "basic" build (dist/basic/index.html + apps-script/basic/Code.gs) must use NO Google Apps
  # Script server services. tests/check_basic_build.js scans the basic Code.gs for forbidden
  # services (comments stripped), checks the flag script leads dist/basic/index.html's <head>, then
  # loads the basic artifact in a real browser with a fake google.script.run, injected
  # __SERVER_PREFS__/__SERVER_EXTRAS__/__SERVER_CONFIG__ and a fake /exec URL and requires ZERO server
  # calls, no ?archive= request and none of the injected state honored. The same harness run against
  # dist/index.html is a control that must record server calls -- without it a harness that cannot
  # see calls would pass everything. BLOCKING: deterministic (fixtures pin every data source).
  basic-build-check:
    name: Basic build (no Google services) check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: node tests/check_basic_build.js

  # Row-highlight interaction budget (added 2026-09-18 with the fix for the ~41s freeze on the
  # 0->1 highlight -- see tests/perf_highlight_benchmark.js's header for the full post-mortem).
  # BLOCKING, unlike the regression suite above: this is a deterministic script with a numeric
  # threshold, not a long assertion sweep, so it does not have that job's known false-failure
  # shape. The per-tab budgets live in the script (POL 8000ms, Detail 1500ms, both derived from
  # recorded measurements); this job only SCALES them, because a shared runner is slower and
  # noisier than a dev box. 1.5x keeps POL ~3.4x below the 41,000ms regression it guards.
  # 2026-09-19: the script now measures click->PAINTED rather than click->DOM. The old clock
  # stopped before the browser did any of the work to show the change and so scored about a
  # quarter of the interaction -- it missed a 2.7s whole-document style recalc entirely. Every
  # number is therefore larger than it was, which is why this scales the budget instead of
  # keeping the old BF_HIGHLIGHT_BUDGET_MS=4000. If this ever goes red, read the printed
  # per-transition numbers before touching the scale -- the failure mode it is built for (a
  # table-wide value threaded through per-row props, breaking React.memo for every row at once)
  # shows up as SECONDS, not as drift past the threshold.
  highlight-perf:
    name: Row-highlight interaction budget
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: node tests/perf_highlight_benchmark.js
        env:
          BF_HIGHLIGHT_BUDGET_SCALE: '1.5'
      # Run the same budget a second time against the DEPLOYED artifact, not just the source it
      # was measured against. dist/index.html is what production actually loads, and its script
      # structure is deliberately different from the source's (no babel-standalone; a Tailwind
      # JIT-priming script, then the compiled payload appended after it -- see
      # scripts/build_deployable.js for why that inert-block presence and script order are
      # load-bearing). Nothing above exercises that priming path: deployable-build only diffs
      # bytes, and the run above only ever measures the source file. A future change to the
      # build script could reorder or drop the primer -- exactly the kind of thing check 5 and
      # this job exist to catch -- and every other check would stay green while it crept into
      # production. This closes that gap the same way regression-suite's second run does above.
      #
      # Reuses the same POL/Detail budgets and the same 1.5x scale, not new ones -- and that has
      # now been VERIFIED, not just argued from "should be nearly identical." Measured
      # 2026-09-20, same machine, back to back, unscaled (BF_HIGHLIGHT_BUDGET_SCALE=1) against
      # the real 8,769-row historical CSV, click->painted:
      #
      #   POL     source  0->1  306.7ms   1->2  219.2ms   >0->0  315.5ms
      #   POL     dist    0->1  317.4ms   1->2  223.6ms   >0->0  315.7ms
      #   Detail  source  0->1   54.2ms   1->2   44.8ms   >0->0   32.1ms
      #   Detail  dist    0->1   39.7ms   1->2   45.0ms   >0->0   49.5ms
      #
      # The artifact's numbers match the source's to within ordinary run-to-run noise -- exactly
      # what "same DOM, same React code, just precompiled" predicts -- and both are nowhere near
      # either budget: the worst POL reading (317.4ms) is ~25x under the unscaled 8000ms budget
      # (~38x under CI's 1.5x-scaled 12000ms), and the worst Detail reading (54.2ms) is ~28x
      # under the unscaled 1500ms budget. That is a far bigger margin than the 1.5x scale factor
      # above already reasons about ("keeps POL ~3.4x below the 41,000ms regression it guards"),
      # so this step is BLOCKING like the rest of this job, not hedged behind continue-on-error.
      #
      # Also roughly doubles this job's ~6 minute runtime, same tradeoff regression-suite's
      # second run already accepted above for the same reason: exercising the artifact, not
      # just the source it was built from.
      - run: BF_APP_HTML=dist/index.html node tests/perf_highlight_benchmark.js
        env:
          BF_HIGHLIGHT_BUDGET_SCALE: '1.5'
