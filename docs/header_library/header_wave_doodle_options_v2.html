<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>ONE Maritime Header &amp; Google Doodle Master Catalog (20 Editions, v2: smoother and more detailed)</title>
  <script src="https://www.gstatic.com/antigravity/web/dev/tailwindcss.min.js"></script>
  <style>
    body { font-family: "Roboto Flex", Roboto, system-ui, -apple-system, sans-serif; margin: 0; }
    /* Motion rules for every header scene: transform and opacity only; ease-in-out-sine (0.37, 0, 0.63, 1) on every bob and sway; linear only for constant drift;
       first and last keyframe identical (fade loops start and end at opacity 0, the snap-back happens while invisible); distinct durations and negative delays so nothing syncs. */

    /* Seamless sea: each layer is a periodic path translated by exactly ONE period, linear and endless, in opposite directions (back left, mid right, front left). */
    @keyframes waveDriftBack { 0% { transform: translateX(0px); } 100% { transform: translateX(-280px); } }
    @keyframes waveDriftMid { 0% { transform: translateX(0px); } 100% { transform: translateX(240px); } }
    @keyframes waveDriftFront { 0% { transform: translateX(0px); } 100% { transform: translateX(-100px); } }
    /* Generic sway for custom wave-like shapes (aurora ribbons): symmetric, sine eased */
    @keyframes waveSlide1 { 0%, 100% { transform: translateX(-11px); } 50% { transform: translateX(11px); } }
    @keyframes waveSlide2 { 0%, 100% { transform: translateX(11px); } 50% { transform: translateX(-11px); } }
    /* Ships and boats: heave plus a small pitch; the flagship adds a second group with its own slower pitch so the motion never repeats exactly */
    @keyframes shipBob { 0%, 100% { transform: translateY(0px) rotate(-0.3deg); } 50% { transform: translateY(-1px) rotate(0.35deg); } }
    @keyframes shipPitch { 0%, 100% { transform: rotate(0.22deg); } 50% { transform: rotate(-0.22deg); } }
    @keyframes tugBob { 0%, 100% { transform: translateY(0px) rotate(0.8deg); } 50% { transform: translateY(-1.3px) rotate(-0.9deg); } }
    /* Steam: a puff rises, grows and fades; it starts and ends at opacity 0, the last 1% snaps back while invisible */
    @keyframes steamPuff1 { 0% { opacity: 0; transform: translate(0px, 0px) scale(0.6); } 16% { opacity: 0.72; } 99% { opacity: 0; transform: translate(-12px, -8px) scale(1.7); } 100% { opacity: 0; transform: translate(0px, 0px) scale(0.6); } }
    @keyframes steamPuff2 { 0% { opacity: 0; transform: translate(0px, 0px) scale(0.55); } 20% { opacity: 0.6; } 99% { opacity: 0; transform: translate(-17px, -10px) scale(1.9); } 100% { opacity: 0; transform: translate(0px, 0px) scale(0.55); } }
    @keyframes beaconSweep { 0%, 100% { opacity: 0.34; transform: rotate(-5deg); } 50% { opacity: 0.8; transform: rotate(5deg); } }
    /* Working machinery: move, dwell, return */
    @keyframes trolleyMove { 0%, 10%, 100% { transform: translateX(0px); } 45%, 58% { transform: translateX(14px); } }
    @keyframes carrierDrive { 0%, 9%, 100% { transform: translateX(0px); } 46%, 56% { transform: translateX(15px); } }
    @keyframes trainGlide { 0%, 100% { transform: translateX(-22px); } 50% { transform: translateX(22px); } }
    /* Lamps: a soft blink with a dwell at each end */
    @keyframes buoyBlink { 0%, 36%, 100% { opacity: 1; } 52%, 76% { opacity: 0.22; } }
    @keyframes gullGlide { 0%, 100% { transform: translate(0px, 0px); } 50% { transform: translate(4px, -2px); } }
    @keyframes cloudDrift { 0%, 100% { transform: translateX(-8px); } 50% { transform: translateX(8px); } }
    /* Sky clouds of the shared sky: a periodic pattern (760 units) translated by one period */
    @keyframes cloudDriftSky { 0% { transform: translateX(0px); } 100% { transform: translateX(760px); } }
    @keyframes petalFall { 0% { opacity: 0; transform: translate(0px, 0px) rotate(-6deg); } 12% { opacity: 0.9; } 88% { opacity: 0.8; } 99% { opacity: 0; transform: translate(-14px, 11px) rotate(8deg); } 100% { opacity: 0; transform: translate(0px, 0px) rotate(-6deg); } }
    @keyframes sprayPulse { 0%, 100% { opacity: 0.68; transform: scaleY(0.96); } 50% { opacity: 0.95; transform: scaleY(1.04); } }
    @keyframes radarSpin { 0%, 100% { transform: scaleX(1); } 50% { transform: scaleX(0.35); } }
    /* A constant rotation is a drift: one full turn per cycle */
    @keyframes turbineDriftSpin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    @keyframes fireworkPop {
      0%, 100% { opacity: 0; transform: scale(0.55); }
      10% { opacity: 1; transform: scale(1); animation-timing-function: cubic-bezier(0.37, 0, 0.63, 1); }
      58% { opacity: 0.92; transform: scale(1.1); }
      86% { opacity: 0.3; transform: scale(1.16); }
      94% { opacity: 0; transform: scale(1.18); }
    }
    @keyframes lanternFloat { 0%, 100% { transform: translate(0px, 0px); } 50% { transform: translate(0.8px, -2.4px); } }
    @keyframes lockChamberLift { 0%, 100% { transform: translateY(2.2px); } 50% { transform: translateY(-2.8px); } }
    @keyframes lockGateUp { 0%, 100% { transform: translateY(-4.2px); } 50% { transform: translateY(3.2px); } }
    @keyframes lockGateDown { 0%, 100% { transform: translateY(3.2px); } 50% { transform: translateY(-4.2px); } }
    @keyframes ballDrop { 0%, 12%, 100% { transform: translateY(0px) scale(0.96); } 70%, 88% { transform: translateY(4.4px) scale(1.08); } }
    @keyframes yearOldPulse { 0%, 60%, 100% { opacity: 1; } 72%, 88% { opacity: 0.45; } }
    @keyframes yearNewPulse { 0%, 60%, 100% { transform: scale(0.97); opacity: 0.84; } 72%, 88% { transform: scale(1.06); opacity: 1; } }
    /* Water glints twinkle (opacity only), never in step */
    @keyframes glintTwinkle { 0%, 100% { opacity: 0.1; } 50% { opacity: 0.95; } }
    /* Dolphin: a ballistic leap (parabola sampled densely, nose follows the tangent) out of the sea and back in; the sprite sits below the waterline clip for the rest of the cycle */
    @keyframes dolphinLeap {
      0%, 100% { transform: translate(-20px, 32px) rotate(-72.6deg); }
      2.8% { transform: translate(-16.7px, 22.2px) rotate(-69.4deg); }
      5.5% { transform: translate(-13.3px, 14.2px) rotate(-64.9deg); }
      8.3% { transform: translate(-10px, 8px) rotate(-58deg); }
      11% { transform: translate(-6.7px, 3.6px) rotate(-46.8deg); }
      13.8% { transform: translate(-3.3px, 0.9px) rotate(-28.1deg); }
      16.5% { transform: translate(0px, 0px) rotate(0deg); }
      19.3% { transform: translate(3.3px, 0.9px) rotate(28.1deg); }
      22% { transform: translate(6.7px, 3.6px) rotate(46.8deg); }
      24.8% { transform: translate(10px, 8px) rotate(58deg); }
      27.5% { transform: translate(13.3px, 14.2px) rotate(64.9deg); }
      30.3% { transform: translate(16.7px, 22.2px) rotate(69.4deg); }
      33% { transform: translate(20px, 32px) rotate(72.6deg); }
    }
    @keyframes dolphinSplash {
      0%, 4.5%, 100% { opacity: 0; transform: translate(-11.5px, 0px) scale(0.7); }
      7.6% { opacity: 0.95; transform: translate(-11.5px, 0px) scale(1); }
      14% { opacity: 0; transform: translate(-11.5px, 0px) scale(1.12); }
      25.4% { opacity: 0; transform: translate(11.5px, 0px) scale(0.7); }
      28.4% { opacity: 0.95; transform: translate(11.5px, 0px) scale(1); }
      35%, 36% { opacity: 0; transform: translate(11.5px, 0px) scale(1.12); }
    }
    /* One crown for the whole pod, relocated while invisible to the six water crossings (exit and entry of each of the 3 dolphins) */
    @keyframes dolphinSplashPod {
      0%, 100% { opacity: 0; transform: translate(-50.1px, 0px) scale(0.7); }
      1.7% { opacity: 0; transform: translate(-50.1px, 0px) scale(0.7); }
      4.8% { opacity: 0.95; transform: translate(-50.1px, 0px) scale(1); }
      11.2% { opacity: 0; transform: translate(-50.1px, 0px) scale(1.12); }
      21.9% { opacity: 0; transform: translate(-25.9px, 0px) scale(0.7); }
      25% { opacity: 0.95; transform: translate(-25.9px, 0px) scale(1); }
      31.4% { opacity: 0; transform: translate(-25.9px, 0px) scale(1.12); }
      35.1% { opacity: 0; transform: translate(25.2px, 0px) scale(0.7); }
      38.2% { opacity: 0.95; transform: translate(25.2px, 0px) scale(1); }
      44.6% { opacity: 0; transform: translate(25.2px, 0px) scale(1.12); }
      56.4% { opacity: 0; transform: translate(46.8px, 0px) scale(0.7); }
      59.5% { opacity: 0.95; transform: translate(46.8px, 0px) scale(1); }
      65.9% { opacity: 0; transform: translate(46.8px, 0px) scale(1.12); }
      68% { opacity: 0; transform: translate(-11.5px, 0px) scale(0.7); }
      71.1% { opacity: 0.95; transform: translate(-11.5px, 0px) scale(1); }
      77.5% { opacity: 0; transform: translate(-11.5px, 0px) scale(1.12); }
      89.6% { opacity: 0; transform: translate(11.5px, 0px) scale(0.7); }
      92.7% { opacity: 0.95; transform: translate(11.5px, 0px) scale(1); }
      99.1% { opacity: 0; transform: translate(11.5px, 0px) scale(1.12); }
    }
    .anim-sea-back { animation: waveDriftBack 68s linear -17s infinite; }
    .anim-sea-mid { animation: waveDriftMid 41s linear -9s infinite; }
    .anim-sea-front { animation: waveDriftFront 13s linear -4.6s infinite; }
    .anim-wave-1 { animation: waveSlide1 14.3s cubic-bezier(0.37, 0, 0.63, 1) -4s infinite; }
    .anim-wave-2 { animation: waveSlide2 18.7s cubic-bezier(0.37, 0, 0.63, 1) -9s infinite; }
    .anim-ship { animation: shipBob 5.3s cubic-bezier(0.37, 0, 0.63, 1) -1.7s infinite; transform-origin: center; transform-box: fill-box; }
    .anim-ship-pitch { animation: shipPitch 8.3s cubic-bezier(0.37, 0, 0.63, 1) -3.1s infinite; transform-origin: center; transform-box: fill-box; }

    .anim-tug-main { animation: tugBob 4.7s cubic-bezier(0.37, 0, 0.63, 1) -1.6s infinite; transform-origin: center; transform-box: fill-box; }
    .anim-steam-1 { animation: steamPuff1 4.9s cubic-bezier(0.37, 0, 0.63, 1) -1.4s infinite; transform-origin: center; transform-box: fill-box; }
    .anim-steam-2 { animation: steamPuff2 5.9s cubic-bezier(0.37, 0, 0.63, 1) -3.6s infinite; transform-origin: center; transform-box: fill-box; }
    .anim-beacon { animation: beaconSweep 6.1s cubic-bezier(0.37, 0, 0.63, 1) -2.2s infinite; transform-origin: left center; transform-box: fill-box; }
    .anim-beam { animation: beaconSweep 6.1s cubic-bezier(0.37, 0, 0.63, 1) -2.2s infinite; transform-origin: 43% 44%; transform-box: fill-box; }
    .anim-trolley { animation: trolleyMove 9.1s cubic-bezier(0.37, 0, 0.63, 1) -3.4s infinite; }
    .anim-carrier { animation: carrierDrive 12.7s cubic-bezier(0.37, 0, 0.63, 1) -5.2s infinite; }
    .anim-train { animation: trainGlide 17.3s cubic-bezier(0.37, 0, 0.63, 1) -6s infinite; }
    .anim-blink { animation: buoyBlink 2.7s cubic-bezier(0.37, 0, 0.63, 1) -0.6s infinite; }
    .anim-blink-alt { animation: buoyBlink 3.3s cubic-bezier(0.37, 0, 0.63, 1) -1.9s infinite; }
    .anim-gull { animation: gullGlide 7.3s cubic-bezier(0.37, 0, 0.63, 1) -2.8s infinite; }
    .anim-cloud { animation: cloudDrift 41s cubic-bezier(0.37, 0, 0.63, 1) -13s infinite; }
    .anim-sky-cloud { animation: cloudDriftSky 190s linear -61s infinite; }
    .anim-petal { animation: petalFall 9.7s cubic-bezier(0.37, 0, 0.63, 1) -3.8s infinite; transform-origin: center; transform-box: fill-box; }
    .anim-spray { animation: sprayPulse 3.3s cubic-bezier(0.37, 0, 0.63, 1) -1.1s infinite; transform-origin: bottom center; transform-box: fill-box; }
    .anim-radar { animation: radarSpin 3.7s cubic-bezier(0.37, 0, 0.63, 1) infinite; transform-origin: center; transform-box: fill-box; }
    .anim-turbine { animation: turbineDriftSpin 14s linear -3s infinite; transform-origin: center; transform-box: fill-box; }
    .anim-firework { animation: fireworkPop 6.4s linear -2.1s infinite; transform-origin: center; transform-box: fill-box; }
    .anim-firework-alt { animation: fireworkPop 7.3s linear -5.6s infinite; transform-origin: center; transform-box: fill-box; }
    .anim-firework-3 { animation: fireworkPop 8.1s linear -0.7s infinite; transform-origin: center; transform-box: fill-box; }
    .anim-lantern { animation: lanternFloat 5.9s cubic-bezier(0.37, 0, 0.63, 1) -2.3s infinite; }
    .anim-lock-lift { animation: lockChamberLift 9.4s cubic-bezier(0.37, 0, 0.63, 1) -3.1s infinite; }
    .anim-lock-gate-1 { animation: lockGateUp 9.4s cubic-bezier(0.37, 0, 0.63, 1) -3.1s infinite; }
    .anim-lock-gate-2 { animation: lockGateDown 9.4s cubic-bezier(0.37, 0, 0.63, 1) -3.1s infinite; }
    .anim-ball-drop { animation: ballDrop 6.4s cubic-bezier(0.37, 0, 0.63, 1) infinite; transform-origin: center; transform-box: fill-box; }
    .anim-year-old { animation: yearOldPulse 6.4s cubic-bezier(0.37, 0, 0.63, 1) infinite; }
    .anim-year-new { animation: yearNewPulse 6.4s cubic-bezier(0.37, 0, 0.63, 1) infinite; transform-origin: center; transform-box: fill-box; }
    .anim-glint-1 { animation: glintTwinkle 3.7s cubic-bezier(0.37, 0, 0.63, 1) -1.2s infinite; }
    .anim-glint-2 { animation: glintTwinkle 5.3s cubic-bezier(0.37, 0, 0.63, 1) -3.4s infinite; }
    .anim-dolphin-1 { animation: dolphinLeap 10.3s linear -2.1s infinite; transform-origin: center; transform-box: fill-box; }
    .anim-dolphin-2 { animation: dolphinLeap 10.3s linear -5.5s infinite; transform-origin: center; transform-box: fill-box; }
    .anim-dolphin-3 { animation: dolphinLeap 10.3s linear -8.9s infinite; transform-origin: center; transform-box: fill-box; }
    .anim-splash-1 { animation: dolphinSplash 10.3s cubic-bezier(0.37, 0, 0.63, 1) -2.1s infinite; transform-origin: center bottom; transform-box: fill-box; }
    .anim-splash-2 { animation: dolphinSplash 10.3s cubic-bezier(0.37, 0, 0.63, 1) -5.5s infinite; transform-origin: center bottom; transform-box: fill-box; }
    .anim-splash-3 { animation: dolphinSplash 10.3s cubic-bezier(0.37, 0, 0.63, 1) -8.9s infinite; transform-origin: center bottom; transform-box: fill-box; }
    .anim-splash-pod { animation: dolphinSplashPod 10.3s cubic-bezier(0.37, 0, 0.63, 1) -2.41s infinite; transform-origin: center bottom; transform-box: fill-box; }
    /* The same class used again on a sibling must not move in step with the first one. Not for .anim-ship: scenes hang hats, garlands and fairy lights on the flagship in their own .anim-ship group, which must bob exactly with the hull. */
    .anim-blink:nth-child(3n+2) { animation-duration: 3.1s; animation-delay: -1.3s; }
    .anim-blink:nth-child(3n) { animation-duration: 3.7s; animation-delay: -2.4s; }
    .anim-blink-alt:nth-child(2n) { animation-duration: 4.1s; animation-delay: -0.4s; }
    .anim-tug:nth-child(2n) { animation-duration: 4.4s; animation-delay: -2.7s; }
    .anim-beacon:nth-child(2n) { animation-duration: 7.3s; animation-delay: -4.4s; }
    .anim-beacon:nth-child(3n) { animation-duration: 5.3s; animation-delay: -0.8s; }
    .anim-lantern:nth-child(2n) { animation-duration: 6.7s; animation-delay: -4.1s; }
    .anim-gull:nth-child(2n) { animation-duration: 8.9s; animation-delay: -5.5s; }
    .anim-firework:nth-child(2n) { animation-duration: 7.7s; animation-delay: -3.3s; }
    #svgStage, #zoomStage { contain: layout paint style; }
    @media (prefers-reduced-motion: reduce) {
      [class*="anim-"] { animation: none !important; }
    }
    /* ---- Agent B (bz-): transform and opacity only; sine in-out for bobs, linear for drift; each loop seamless ---- */
    @keyframes kfBTrainDrift { 0%, 6% { transform: translateX(-156px); } 100% { transform: translateX(231px); } }
    @keyframes kfBPuffDrift { 0% { opacity: 0; transform: translate(0, 0) scale(0.6); } 25% { opacity: 0.7; } 100% { opacity: 0; transform: translate(-8px, -6px) scale(1.7); } }
    @keyframes kfBTrolley { 0%, 100% { transform: translateX(-8px); } 50% { transform: translateX(8px); } }
    @keyframes kfBGlint { 0%, 100% { opacity: 0.25; } 50% { opacity: 0.85; } }
    .bz-train { animation: kfBTrainDrift 36s linear -14s infinite; }
    .bz-puff { animation: kfBPuffDrift 4.7s ease-out -1.3s infinite; transform-origin: center; transform-box: fill-box; }
    .bz-trolley { animation: kfBTrolley 11.3s cubic-bezier(0.37, 0, 0.63, 1) -4s infinite; }
    .bz-glint { animation: kfBGlint 4.3s cubic-bezier(0.37, 0, 0.63, 1) -1.1s infinite; }
    /* opt8: ONE lock cycle (12.7s) shared by water+ship and both gates, counter-phase gates; mules and lamps run their own periods */
    @keyframes kfBLift { 0%, 100% { transform: translateY(2.4px); } 50% { transform: translateY(-2.6px); } }
    @keyframes kfBGateA { 0%, 100% { transform: translateY(-3.4px); } 50% { transform: translateY(3.4px); } }
    @keyframes kfBGateB { 0%, 100% { transform: translateY(3.4px); } 50% { transform: translateY(-3.4px); } }
    @keyframes kfBMule { 0%, 100% { transform: translateX(-3px); } 50% { transform: translateX(3px); } }
    @keyframes kfBLamp { 0%, 100% { opacity: 0.4; } 50% { opacity: 1; } }
    .bz-lift { animation: kfBLift 12.7s cubic-bezier(0.37, 0, 0.63, 1) -3.2s infinite; }
    .bz-gate-a { animation: kfBGateA 12.7s cubic-bezier(0.37, 0, 0.63, 1) -3.2s infinite; }
    .bz-gate-b { animation: kfBGateB 12.7s cubic-bezier(0.37, 0, 0.63, 1) -3.2s infinite; }
    .bz-mule { animation: kfBMule 9.7s cubic-bezier(0.37, 0, 0.63, 1) -2.6s infinite; }
    .bz-lamp { animation: kfBLamp 3.9s cubic-bezier(0.37, 0, 0.63, 1) -0.8s infinite; }
    /* opt7: lens-cloud band drifts exactly one pattern period (300) per cycle; petals fade in and out (0 opacity at both ends); branch sways about its root */
    @keyframes kfBCloudDrift { 0% { transform: translateX(0); } 100% { transform: translateX(-300px); } }
    @keyframes kfBPetalDrift { 0% { opacity: 0; transform: translate(0, 0) rotate(0deg); } 12% { opacity: 0.9; } 50% { transform: translate(-11px, 7px) rotate(75deg); } 88% { opacity: 0.9; } 100% { opacity: 0; transform: translate(-22px, 16px) rotate(170deg); } }
    @keyframes kfBBranch { 0%, 100% { transform: rotate(-1.2deg); } 50% { transform: rotate(1.2deg); } }
    @keyframes kfBTwinkle { 0%, 100% { opacity: 0.35; } 50% { opacity: 1; } }
    .bz-cloudband { animation: kfBCloudDrift 110s linear -37s infinite; }
    .bz-petal-a, .bz-petal-b, .bz-petal-c { transform-origin: center; transform-box: fill-box; }
    .bz-petal-a { animation: kfBPetalDrift 9.3s linear -2.1s infinite; }
    .bz-petal-b { animation: kfBPetalDrift 12.1s linear -7s infinite; }
    .bz-petal-c { animation: kfBPetalDrift 15.7s linear -4s infinite; }

    .bz-shimmer { animation: kfBGlint 6.9s cubic-bezier(0.37, 0, 0.63, 1) -2s infinite; }

    .bz-twinkle-b { animation: kfBTwinkle 7.9s cubic-bezier(0.37, 0, 0.63, 1) -3.1s infinite; }
    /* opt9: each aurora curtain is ONE animation: linear drift of exactly one pattern period (set by --bz-d) plus 4 sine-eased breaths; twinkles use their own periods */
    @keyframes kfBAuroraDrift {
      0% { transform: translateX(0); opacity: 0.62; animation-timing-function: linear; }
      12.5% { opacity: 1; animation-timing-function: cubic-bezier(0.37, 0, 0.63, 1); }
      25% { opacity: 0.62; animation-timing-function: cubic-bezier(0.37, 0, 0.63, 1); }
      37.5% { opacity: 1; animation-timing-function: cubic-bezier(0.37, 0, 0.63, 1); }
      50% { opacity: 0.62; animation-timing-function: cubic-bezier(0.37, 0, 0.63, 1); }
      62.5% { opacity: 1; animation-timing-function: cubic-bezier(0.37, 0, 0.63, 1); }
      75% { opacity: 0.62; animation-timing-function: cubic-bezier(0.37, 0, 0.63, 1); }
      87.5% { opacity: 1; animation-timing-function: cubic-bezier(0.37, 0, 0.63, 1); }
      100% { transform: translateX(var(--bz-d)); opacity: 0.62; }
    }
    .bz-aur-g { --bz-d: -240px; animation: kfBAuroraDrift 47s linear -11s infinite; }
    .bz-aur-m { --bz-d: 340px; animation: kfBAuroraDrift 61s linear -29s infinite; }
    .bz-aur-t { --bz-d: 200px; animation: kfBAuroraDrift 33s linear -7s infinite; }
    /* opt10: berg heave and penguin waddle are slow symmetric sways; sparkles reuse the twinkle keyframes */
    @keyframes kfBBerg { 0%, 100% { transform: translateY(0.5px); } 50% { transform: translateY(-0.5px); } }
    @keyframes kfBWaddle { 0%, 100% { transform: rotate(-1.4deg); } 50% { transform: rotate(1.4deg); } }
    .bz-berg { animation: kfBBerg 10.1s cubic-bezier(0.37, 0, 0.63, 1) -3s infinite; }

    @keyframes kfBFerry {
      0%, 100% { transform: translate(-3px, 0) rotate(0.3deg); }
      25%, 75% { transform: translate(0, -0.9px) rotate(-0.4deg); }
      50% { transform: translate(3px, 0) rotate(0.3deg); }
    }
    .bz-ferry { animation: kfBFerry 10.7s cubic-bezier(0.37, 0, 0.63, 1) -2.9s infinite; transform-origin: center; transform-box: fill-box; }

      [class*="bz-"] { animation: none; }

    /* ===== Agent C: scenes opt6 opt3 opt1 opt13 opt14 opt15. Classes .cz-*, keyframes kfC*. Only transform and opacity animate. ===== */

  <script>
    let currentOpt = 'opt17';
    let isDark = false;
    let includeInlineDefs = false;

    function sharedDefsMarkup(dark) {
      return `
        <defs>
          <linearGradient id="waveBack" x1="0" y1="0" x2="1" y2="0">
            <stop offset="0%" stop-color="#0284c7" stop-opacity="${dark ? 0.48 : 0.32}"/>
            <stop offset="50%" stop-color="#00b4d8" stop-opacity="${dark ? 0.54 : 0.40}"/>
            <stop offset="100%" stop-color="#0096c7" stop-opacity="${dark ? 0.50 : 0.38}"/>
          </linearGradient>
          <linearGradient id="waveMid" x1="0" y1="0" x2="1" y2="0">
            <stop offset="0%" stop-color="#00b4d8" stop-opacity="${dark ? 0.48 : 0.42}"/>
            <stop offset="55%" stop-color="#00e5ff" stop-opacity="${dark ? 0.55 : 0.48}"/>
            <stop offset="100%" stop-color="#38bdf8" stop-opacity="${dark ? 0.50 : 0.44}"/>
          </linearGradient>
          <linearGradient id="waveFront" x1="0" y1="0" x2="1" y2="0">
            <stop offset="0%" stop-color="#48cae4" stop-opacity="${dark ? 0.46 : 0.48}"/>
            <stop offset="50%" stop-color="#00e5ff" stop-opacity="${dark ? 0.52 : 0.54}"/>
            <stop offset="100%" stop-color="#ff4da6" stop-opacity="${dark ? 0.40 : 0.32}"/>
          </linearGradient>
          <!-- Seamless sea paints: the sheen repeats every period of its wave layer (280 back, 240 mid), so a layer translated by one period looks identical; the front paint is vertical only -->
          <linearGradient id="waveBackD" gradientUnits="userSpaceOnUse" spreadMethod="repeat" x1="0" y1="0" x2="280" y2="0">
            <stop offset="0%" stop-color="#0284c7" stop-opacity="${dark ? 0.46 : 0.30}"/>
            <stop offset="50%" stop-color="#22c1e8" stop-opacity="${dark ? 0.58 : 0.44}"/>
            <stop offset="100%" stop-color="#0284c7" stop-opacity="${dark ? 0.46 : 0.30}"/>
          </linearGradient>
          <linearGradient id="waveMidD" gradientUnits="userSpaceOnUse" spreadMethod="repeat" x1="0" y1="0" x2="240" y2="0">
            <stop offset="0%" stop-color="#00b4d8" stop-opacity="${dark ? 0.46 : 0.40}"/>
            <stop offset="50%" stop-color="#5eead4" stop-opacity="${dark ? 0.56 : 0.50}"/>
            <stop offset="100%" stop-color="#00b4d8" stop-opacity="${dark ? 0.46 : 0.40}"/>
          </linearGradient>
          <linearGradient id="waveFrontD" gradientUnits="userSpaceOnUse" x1="0" y1="39.4" x2="0" y2="48">
            <stop offset="0%" stop-color="#67e8f9" stop-opacity="${dark ? 0.46 : 0.50}"/>
            <stop offset="45%" stop-color="#00b4d8" stop-opacity="${dark ? 0.52 : 0.52}"/>
            <stop offset="100%" stop-color="#0369a1" stop-opacity="${dark ? 0.66 : 0.56}"/>
          </linearGradient>
          <!-- ONE hull: the magenta stays #bc0f70 in the middle, lighter at the rail, deeper toward the waterline -->
          <linearGradient id="hullShade" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="${dark ? '#c91f7f' : '#d03a8d'}"/>
            <stop offset="34%" stop-color="#c0146f"/>
            <stop offset="68%" stop-color="#bc0f70"/>
            <stop offset="100%" stop-color="${dark ? '#8a0852' : '#9c0a5e'}"/>
          </linearGradient>
          <!-- Waterline clip for leaping dolphins: everything above y = 40 shows, the sea hides the rest -->
          <clipPath id="seaClip"><rect x="-200" y="-20" width="1900" height="60"/></clipPath>
          <radialGradient id="sunGlow" cx="50%" cy="50%" r="50%">
            <stop offset="0%" stop-color="#fde047" stop-opacity="0.95"/>
            <stop offset="100%" stop-color="#fb923c" stop-opacity="0.0"/>
          </radialGradient>
          <radialGradient id="beamRad" gradientUnits="userSpaceOnUse" cx="846" cy="9.5" r="128">
            <stop offset="0%" stop-color="#fde047" stop-opacity="0.8"/>
            <stop offset="100%" stop-color="#fde047" stop-opacity="0"/>
          </radialGradient>
          <linearGradient id="beamGrad" x1="0" y1="0" x2="1" y2="0">
            <stop offset="0%" stop-color="#fde047" stop-opacity="${dark ? 0.78 : 0.68}"/>
            <stop offset="100%" stop-color="#fde047" stop-opacity="0.0"/>
          </linearGradient>
        </defs>
      `;
    }

    function svgDefs(dark) {
      return includeInlineDefs ? sharedDefsMarkup(dark) : '';
    }

    // Ultra-Compact Vector "ONE" Container Wordmark Path Generator (Zero <text> nodes; 100% compound-path mergeable!)
    function oneBox(x, y) {
      return `M${x},${y}h1.5v2h-1.5zm2.4,2v-2l1.5,2v-2m2.3,0h-1.4v2h1.4m-1.4-1h1.1`;
    }

    // Seamless sea. Back layer: wavelength 280 (T segments of 140), drifts one period LEFT; mid layer: wavelength 240, drifts one period RIGHT.
    // Both paths are drawn wide enough that the translated copy still covers the whole 1440 strip. Geometry at rest is the original (y bands 35.2 / 37.6).
    // The two glint paths sit on the mid layer and twinkle on their own clock (opacity only).
    function svgLowSeaWaves(dark, seaStartX = -120) {
      let back = `M${seaStartX},35.2 Q${seaStartX + 70},33.8 ${seaStartX + 140},35.2`;
      for (let k = 2; k <= 14; k++) back += ` T${seaStartX + 140 * k},35.2`;
      back += ` L${seaStartX + 1960},60 L${seaStartX},60 Z`;
      const mx = seaStartX - 240;
      let mid = `M${mx},37.6 Q${mx + 60},36.3 ${mx + 120},37.6`;
      for (let k = 2; k <= 16; k++) mid += ` T${mx + 120 * k},37.6`;
      mid += ` L${mx + 1920},60 L${mx},60 Z`;
      return `
        <path class="anim-sea-back" fill="url(#waveBackD)" stroke="rgba(255,255,255,${dark ? 0.18 : 0.42})" stroke-width="0.5" d="${back}"></path>
        <path class="anim-sea-mid" fill="url(#waveMidD)" stroke="rgba(255,255,255,0.78)" stroke-width="0.85" d="${mid}"></path>
        <path class="anim-glint-1" fill="none" stroke="${dark ? '#bae6fd' : '#ffffff'}" stroke-width="0.8" stroke-linecap="round" d="M648,38.6h4M684,39.4h3M742,38.9h4.5M812,39.5h3.5M1074,38.8h4M1112,39.6h3M1166,38.9h4.5M1224,39.4h3.5"></path>
      `;
    }

    // Small, Crisp Foreground Waterline Ripples (y = 39.8..48), wavelength 100, drifting one period LEFT, with a vertical (x-independent) paint so the drift is seamless.
    // A second set of foreground glints twinkles on top of everything.
    function svgOpenWaterFrontWave(xStart = -120) {
      let d = `M${xStart},40`;
      for (let x = xStart; x < 1560; x += 100) {
        d += ` Q${x + 25},38.7 ${x + 50},40 T${x + 100},40`;
      }
      d += ` L1600,40 L1600,60 L${xStart},60 Z`;
      return `<path class="anim-sea-front" fill="url(#waveFrontD)" stroke="#ffffff" stroke-width="1.1" d="${d}"></path>` +

    // Ultra-Detailed 16-Ray Parabolic Chrysanthemum & Weeping-Willow Firework Generator (Compound-Path Optimized!)
    function svgFireworkUltra(x, y, r, cOuter, cMid, cCore, animClass = 'anim-firework', withWillow = false) {
      let outerRays = '', outerTips = '', innerRays = '', innerTips = '', willowPaths = '';
      for (let i = 0; i < 16; i++) {
        const ang = (i * Math.PI) / 8;
        const cos = Math.cos(ang), sin = Math.sin(ang);
        if (i % 2 === 0) {
          const mx = (x + cos * r * 0.52).toFixed(1);
          const my = (y + sin * r * 0.52 - 0.3).toFixed(1);
          const tx = (x + cos * r).toFixed(1);
          const ty = (y + sin * r + 1.1).toFixed(1);
          outerRays += `M${x},${y}Q${mx},${my} ${tx},${ty}`;
          outerTips += `M${(+tx - 0.95).toFixed(1)},${ty}a.95,.95 0 1,0 1.9,0a.95,.95 0 1,0 -1.9,0`;
          if (withWillow && (i === 0 || i === 2 || i === 6 || i === 8 || i === 14)) {
            const wx = (+tx + (cos >= 0 ? 1.8 : -1.8)).toFixed(1);
            const wy = (+ty + 5.2).toFixed(1);
            willowPaths += `M${tx},${ty}Q${wx},${(+ty + 2.4).toFixed(1)} ${wx},${wy}`;
          }
        } else {
          const r2 = r * 0.68;
          const mx = (x + cos * r2 * 0.52).toFixed(1);
          const my = (y + sin * r2 * 0.52 - 0.2).toFixed(1);
          const tx = (x + cos * r2).toFixed(1);
          const ty = (y + sin * r2 + 0.7).toFixed(1);
          innerRays += `M${x},${y}Q${mx},${my} ${tx},${ty}`;
          innerTips += `M${(+tx - 0.75).toFixed(1)},${ty}a.75,.75 0 1,0 1.5,0a.75,.75 0 1,0 -1.5,0`;
        }
      }
      return `
        <g class="${animClass}">
          <circle cx="${x}" cy="${y}" r="${(r * 1.15).toFixed(1)}" fill="url(#sunGlow)" opacity="0.48"/>
          ${withWillow ? `<path d="${willowPaths}" fill="none" stroke="#fde047" stroke-width="0.65" stroke-dasharray="1.1 1.3" stroke-linecap="round" opacity="0.9"/>` : ''}
          <path d="${outerRays}" fill="none" stroke="${cOuter}" stroke-width="1.05" stroke-linecap="round"/>
          <path d="${innerRays}" fill="none" stroke="${cMid}" stroke-width="0.9" stroke-linecap="round"/>
          <path d="${outerTips}" fill="${cOuter}"/>
          <path d="${innerTips}" fill="${cMid}"/>
          <circle cx="${x}" cy="${y}" r="${(r * 0.34).toFixed(1)}" fill="none" stroke="${cCore}" stroke-width="1.2" stroke-dasharray="0.9 1.6" stroke-linecap="round"/>

    // Dynamic Current-to-Upcoming Year Transition (e.g. 2026 → 2027) + Crisp Vector 7-Segment LED Digit Path Generator
    const _nyeNow = new Date();
    const NYE_CUR_YEAR = String((_nyeNow.getMonth() === 0 && _nyeNow.getDate() <= 14) ? _nyeNow.getFullYear() - 1 : _nyeNow.getFullYear());
    const NYE_NEXT_YEAR = String(Number(NYE_CUR_YEAR) + 1);

    function svgYearDigits(yearStr, x0, y0, w = 2.4, h = 4.0, step = 3.5) {
      const hh = +(h / 2).toFixed(2);
      let d = '';
      for (let i = 0; i < yearStr.length; i++) {
        const ch = yearStr[i];
        const x = +(x0 + i * step).toFixed(2);
        const y = +y0.toFixed(2);
        if (ch === '0') d += `M${x},${y}h${w}v${h}h-${w}z`;
        else if (ch === '1') d += `M${+(x + w * 0.65).toFixed(2)},${y}v${h}M${+(x + w * 0.2).toFixed(2)},${+(y + 0.7).toFixed(2)}L${+(x + w * 0.65).toFixed(2)},${y}`;
        else if (ch === '2') d += `M${x},${y}h${w}v${hh}h-${w}v${hh}h${w}`;
        else if (ch === '3') d += `M${x},${y}h${w}v${h}h-${w}M${+(x + 0.3).toFixed(2)},${+(y + hh).toFixed(2)}h${+(w - 0.3).toFixed(2)}`;
        else if (ch === '4') d += `M${x},${y}v${hh}h${w}M${+(x + w * 0.78).toFixed(2)},${y}v${h}`;
        else if (ch === '5') d += `M${+(x + w).toFixed(2)},${y}h-${w}v${hh}h${w}v${hh}h-${w}`;
        else if (ch === '6') d += `M${+(x + w).toFixed(2)},${y}h-${w}v${h}h${w}v-${hh}h-${w}`;
        else if (ch === '7') d += `M${x},${y}h${w}L${+(x + w * 0.45).toFixed(2)},${+(y + h).toFixed(2)}`;
        else if (ch === '8') d += `M${x},${y}h${w}v${h}h-${w}zM${x},${+(y + hh).toFixed(2)}h${w}`;
        else if (ch === '9') d += `M${+(x + w).toFixed(2)},${+(y + hh).toFixed(2)}h-${w}v-${hh}h${w}v${h}h-${w}`;
      }
      return d;
    }

    // ---- Agent B helpers (prefix bz). Pure string builders, 1-decimal coordinates, no DOM. ----
    function bzR(n) { return Math.round(n * 10) / 10; }

    // vertical corrugation ticks for a container, optionally skipping a middle window (where a logo sits)
    function bzCorr(x, y, w, h, pitch, skipFrom, skipTo) {
      let d = '';
      for (let px = x + pitch; px < x + w - 0.6; px += pitch) {
        if (skipFrom !== undefined && px > skipFrom && px < skipTo) continue;
        d += `M${bzR(px)},${bzR(y + 0.5)}v${bzR(h - 1)}`;
      }
      return d;
    }

    // a row of small circles as ONE compound path (cx list, shared cy and r)
    function bzDots(xs, cy, r) {
      return xs.map(cx => `M${bzR(cx - r)},${cy}a${r},${r} 0 1,0 ${bzR(2 * r)},0a${r},${r} 0 1,0 ${bzR(-2 * r)},0`).join('');
    }

    // a small leaf/petal path: origin (x,y), direction ang (deg), length len; as a sub-path for a compound petal path
    function bzPetal(x, y, ang, len) {
      const a = ang * Math.PI / 180, c = Math.cos(a), s = Math.sin(a);
      const p = (u, v) => `${bzR(x + u * c - v * s)},${bzR(y + u * s + v * c)}`;
      return `M${p(0, 0)}Q${p(len * 0.45, -len * 0.5)} ${p(len, 0)}Q${p(len * 0.45, len * 0.5)} ${p(0, 0)}z`;
    }

    // lens-shaped (lenticular) cloud strip repeated every `period` px, covering x0..x1; each lens: [offset, y, width, height]
    function bzLensBand(x0, x1, period, lenses) {
      let d = '';
      for (let base = x0; base < x1; base += period) {
        lenses.forEach(l => {
          const cx = base + l[0], w = l[2], h = l[3];
          d += `M${bzR(cx - w / 2)},${l[1]}a${bzR(w / 2)},${h} 0 1,0 ${w},0a${bzR(w / 2)},${h} 0 1,0 ${-w},0`;
        });
      }
      return d;
    }

    // circles with individual centres/radii as ONE compound path: [[cx, cy, r], ...]
    function bzCircs(list) {
      return list.map(c => `M${bzR(c[0] - c[2])},${c[1]}a${c[2]},${c[2]} 0 1,0 ${bzR(2 * c[2])},0a${c[2]},${c[2]} 0 1,0 ${bzR(-2 * c[2])},0`).join('');
    }

    // aurora ribbon: closed wavy band (quadratic half-waves, `period` px per full wave) from x0 to x1; top edge yT amp aT, bottom edge yB amp aB, in phase
    function bzAuroraBand(x0, x1, period, yT, aT, yB, aB) {
      const h = period / 2, n = Math.ceil((x1 - x0) / h);
      let d = `M${x0},${yT}`;
      for (let i = 0; i < n; i++) d += `Q${bzR(x0 + i * h + h / 2)},${bzR(yT + (i % 2 ? 1 : -1) * 2 * aT)} ${bzR(x0 + (i + 1) * h)},${yT}`;
      d += `V${yB}`;
      for (let i = n - 1; i >= 0; i--) d += `Q${bzR(x0 + i * h + h / 2)},${bzR(yB + (i % 2 ? 1 : -1) * 2 * aB)} ${bzR(x0 + i * h)},${yB}`;
      return d + 'z';
    }
    // just the forward centre-line of the same wave (for a dashed ray stroke)
    function bzWaveLine(x0, x1, period, y, a) {
      const h = period / 2, n = Math.ceil((x1 - x0) / h);
      let d = `M${x0},${y}`;
      for (let i = 0; i < n; i++) d += `Q${bzR(x0 + i * h + h / 2)},${bzR(y + (i % 2 ? 1 : -1) * 2 * a)} ${bzR(x0 + (i + 1) * h)},${y}`;
      return d;
    }
    // 4-point sparkle star as a sub-path
    function bzSpark(x, y, r) {
      const k = bzR(r * 0.22);
      return `M${x},${bzR(y - r)}L${bzR(x + k)},${bzR(y - k)}L${bzR(x + r)},${y}L${bzR(x + k)},${bzR(y + k)}L${x},${bzR(y + r)}L${bzR(x - k)},${bzR(y + k)}L${bzR(x - r)},${y}L${bzR(x - k)},${bzR(y - k)}z`;
    }

    // ellipses with individual centres/radii as ONE compound path: [[cx, cy, rx, ry], ...]
    function bzEllipses(list) {
      return list.map(e => `M${bzR(e[0] - e[2])},${e[1]}a${e[2]},${e[3]} 0 1,0 ${bzR(2 * e[2])},0a${e[2]},${e[3]} 0 1,0 ${bzR(-2 * e[2])},0`).join('');
    }

    // Manhattan tower windows for opt12 as dashed runs: draw the returned path with stroke-width 1.4 and stroke-dasharray "2 2.5" (each dash is a 2 x 1.4 window, pitch 4.5).
    // grids: [x, y, cols, rows, rowStep]; a deterministic ~72% of windows are lit, consecutive lit windows of a row join into one run.
    function bzCityWindows() {
      const grids = [[507.5, 12.5, 2, 5, 4.2], [525, 15.5, 2, 4, 4.3], [541, 16.5, 2, 4, 4.1], [558, 14, 2, 3, 4.4], [577, 16.5, 4, 3, 3.8], [601.5, 9, 1, 5, 4],
        [612.5, 15, 3, 4, 3.6], [633.5, 21, 2, 3, 3.6], [648, 18, 2, 3, 4], [705.5, 15, 2, 4, 4.1], [720.5, 18, 2, 3, 4.2], [734.5, 21, 2, 3, 4]];
      let seed = 11, d = 'M582,9.2h6.5';
      const rnd = () => (seed = (seed * 9301 + 49297) % 233280) / 233280;
      grids.forEach(g => {
        for (let r = 0; r < g[3]; r++) {
          const y = bzR(g[1] + r * g[4] + 0.7);
          let run = 0, start = 0;
          const flush = () => { if (run) d += `M${bzR(start)},${y}h${bzR(2 + 4.5 * (run - 1))}`; run = 0; };
          for (let c = 0; c < g[2]; c++) {
            if (rnd() < 0.72) { if (!run) start = g[0] + c * 4.5; run++; } else flush();
          }
          flush();
        }
      });
      return d;
    }

    // zero-length sub-paths: draws one round dot per x (use stroke + stroke-linecap="round" + stroke-width = diameter); ~15 bytes per dot
    function bzPts(xs, y) {
      return xs.map(x => `M${x},${y}h.01`).join('');
    }

    // ===== Agent C helpers (scenes opt6, opt3, opt1, opt13, opt14, opt15). Every name starts with cz. =====
    // A number as text with at most one decimal and no trailing zero, so every coordinate stays within the one-decimal budget.
    function czN(n) { return String(+n.toFixed(1)); }

    // Tiny seeded random, so a scene draws the same picture on every render.
    function czRng(seed) {
      let s = seed >>> 0;
      return function () { s = (Math.imul(s, 1664525) + 1013904223) >>> 0; return s / 4294967296; };
    }

    // Round dots as ONE compound path: draw it with fill="none", stroke-linecap="round" and stroke-width = the dot diameter.
    function czDots(pts) {
      return pts.map(p => 'M' + czN(p[0]) + ',' + czN(p[1]) + 'h.1').join('');
    }

    // Circles as ONE compound path d: [[cx, cy, r], ...].
    function czCircles(list) {
      return list.map(c => {
        const r = c[2];
        return 'M' + czN(c[0] - r) + ',' + czN(c[1]) + 'a' + czN(r) + ',' + czN(r) + ' 0 1,0 ' + czN(2 * r) + ',0a' + czN(r) + ',' + czN(r) + ' 0 1,0 ' + czN(-2 * r) + ',0';
      }).join('');
    }

    // A pointed leaf (lens) of length len and width wid, centred on x,y and turned deg degrees, as path text.
    function czLeaf(x, y, deg, len, wid) {
      const a = deg * Math.PI / 180, c = Math.cos(a), s = Math.sin(a), h = len / 2;
      const P = (u, v) => czN(x + u * c - v * s) + ',' + czN(y + u * s + v * c);
      return 'M' + P(-h, 0) + 'Q' + P(0, -wid) + ' ' + P(h, 0) + 'Q' + P(0, wid) + ' ' + P(-h, 0) + 'Z';
    }

    // A falling field (snow, leaves) as ONE compound path that repeats exactly every row: translate it by (shear, period) once and the
    // picture is identical to the start, so a linear drift of exactly that distance loops with no seam. make(x, y, r1, r2) draws one item.
    function czLattice(period, shear, x0, x1, perRow, seed, make) {
      const rnd = czRng(seed), base = [];
      for (let i = 0; i < perRow; i++) base.push([x0 + (x1 - x0) * ((i + 0.15 + 0.7 * rnd()) / perRow), period * rnd(), rnd(), rnd()]);
      let d = '';
      const rows = Math.ceil((48 + period) / period) + 1;
      for (let k = 0; k < rows; k++) {
        for (const b of base) {
          const x = b[0] + shear * (k - 1), y = b[1] + period * (k - 1);
          if (y > 48 || y < -period) continue;
          d += make(x, y, b[2], b[3]);
        }
      }
      return d;
    }

    // Low mist as one closed path whose lumps repeat every `period` units (so a drift of exactly one period never shows a seam).
    function czFog(x0, x1, y, period) {
      const q = (a, b) => czN(a) + ',' + czN(b);
      let d = 'M' + q(x0, y + 3);
      for (let x = x0; x < x1; x += period) {
        d += 'Q' + q(x + period * 0.12, y) + ' ' + q(x + period * 0.3, y + 2.2) + 'Q' + q(x + period * 0.45, y - 1.8) + ' ' + q(x + period * 0.62, y + 1.6) + 'Q' + q(x + period * 0.82, y - 1) + ' ' + q(x + period, y + 3);
      }
      const xe = x0 + Math.ceil((x1 - x0) / period) * period;
      return d + 'L' + q(xe, y + 9) + 'L' + q(x0, y + 9) + 'Z';
    }

    // One reindeer for the sleigh team, facing right: returns { fill, line } path text (body and head dots / legs, neck and antlers).
    function czReindeer(x, y, gallop) {
      const f = 'M' + czN(x - 3.4) + ',' + czN(y) + 'a3.4,1.5 0 1,0 6.8,0a3.4,1.5 0 1,0 -6.8,0'
        + 'M' + czN(x + 4.4) + ',' + czN(y - 3.1) + 'a1,.8 0 1,0 2,0a1,.8 0 1,0 -2,0';
      const g = gallop ? 1 : -1;
      const l = 'M' + czN(x + 2.8) + ',' + czN(y - .6) + 'l1.8,-2M' + czN(x + 5) + ',' + czN(y - 3.8) + 'l-.7,-1.6m.7,1.6l1,-1.5'
        + 'M' + czN(x - 2) + ',' + czN(y + 1) + 'l' + czN(-1.8 * g) + ',2M' + czN(x + 2.2) + ',' + czN(y + 1.1) + 'l' + czN(2 * g) + ',1.8';
      return { fill: f, line: l };
    }

    // Spinnaker yacht, bow to the right. x = left edge of the hull, s = scale, n = 1..3 picks its own roll and billow classes.
    // The whole rig rolls on the swell (cz-roll-n) and the spinnaker breathes on top of that (cz-billow-n); the reflection stays on the water.
    function czYacht(x, s, hull, spin, n, dark) {
      return `<g transform="translate(${x} 36) scale(${s})">
              <path d="M1,5.6Q15,7.8 28.4,5.6Q15,6.3 1,5.6Z" fill="${spin}" opacity="${dark ? 0.3 : 0.22}"/>
              <g class="cz-roll-${n}">
                <path d="M15.2,-.8V-21.4L3,-2.4Z" fill="${dark ? '#e2e8f0' : '#ffffff'}" stroke="${dark ? '#94a3b8' : '#cbd5e1'}" stroke-width=".4" stroke-linejoin="round"/>
                <path d="M15.2,-.8V-22M15.2,-.8L3,-2.4M15.2,-14.8L8,-10.6M15.2,-8.4L5.6,-5.8" fill="none" stroke="${dark ? '#cbd5e1' : '#64748b'}" stroke-width=".45"/>
                <g class="cz-billow-${n}">
                  <path d="M16,-22C27.5,-19.4 33.4,-9.6 27.4,-.8L16,-.8Z" fill="${spin}"/>
                  <path d="M16.8,-21C24,-18.4 28.4,-11.6 25.6,-4.4C25.2,-11 21.6,-16.6 16.8,-21Z" fill="#ffffff" opacity=".3"/>
                  <path d="M16,-.8H27.4L26.2,-3.6C22,-2.8 18.6,-2.4 16,-1.8Z" fill="#0f172a" opacity=".16"/>
                </g>
                <path d="M0,0Q14,1.3 29.4,-1.6L25.6,4.2H3.4Z" fill="${hull}"/>
                <path d="M3.4,3.2H25.8L25.5,4.2H3.6Z" fill="#0f172a" opacity=".3"/>
                <path d="M.4,.3Q14,1.5 29,-1.3" fill="none" stroke="#ffffff" stroke-width=".6" opacity=".85"/>
                <path d="M2,4.8Q-4,5.4 -11,4.4M5,5.6Q-1,6.1 -8,5.6M26,3.9Q30,3.9 32.6,2.2" fill="none" stroke="#ffffff" stroke-width=".6" stroke-linecap="round" opacity=".75"/>

    // A four-point sparkle star as path text (cx, cy = centre, r = tip distance).
    function czStar(cx, cy, r) {
      const k = r * 0.3, q = (a, b) => czN(a) + ',' + czN(b);
      return 'M' + q(cx, cy - r) + 'L' + q(cx + k, cy - k) + 'L' + q(cx + r, cy) + 'L' + q(cx + k, cy + k) + 'L' + q(cx, cy + r) + 'L' + q(cx - k, cy + k) + 'L' + q(cx - r, cy) + 'L' + q(cx - k, cy - k) + 'Z';
    }

    // A goose as a flat 'm' mark (wings level, gliding), centred on x,y at scale s.
    function czGoose(x, y, s) {
      const q = (a, b) => czN(x + a * s) + ',' + czN(y + b * s);
      return 'M' + q(-3, 0.9) + 'Q' + q(-1.5, -1.8) + ' ' + q(0, 0) + 'Q' + q(1.5, -1.8) + ' ' + q(3, 0.9);
    }

    // Autumn trees for opt14: back canopies, four trees on trunks, then leaf-clump speckles (light on the sunlit upper-right, shade on the lower-left;
    // the sun is on the right). Returns markup; dark = a dimmer dusk palette.
    function czAutumnTrees(dark) {
      const C = dark ? ['#b91c1c', '#c2410c', '#d97706', '#9a3412', '#ca8a04'] : ['#dc2626', '#f97316', '#f59e0b', '#ea580c', '#eab308'];
      const crimson = [[672, 16, 6.5], [667.6, 19.2, 4], [676.6, 19.4, 4.2], [768, 16, 6.2], [763.6, 19.6, 3.8], [772.6, 19.8, 4]];
      const orange = [[681, 18, 5]], amber = [[690, 14, 7], [685, 18.4, 4.4], [695.4, 18.6, 4.2]], rust = [[700, 17, 5.5]];
      const gold = [[708, 16.5, 6], [703.6, 20, 4], [712.8, 19.8, 4.2]];
      const big = [].concat(crimson, orange, amber, rust, gold).filter(c => c[2] > 4.3);
      const spk = angs => czDots([].concat.apply([], big.map(c => angs.map(a => [c[0] + 0.62 * c[2] * Math.cos(a * Math.PI / 180), c[1] + 0.62 * c[2] * Math.sin(a * Math.PI / 180)]))));
      return `<path d="M672,28.4V19M690,28V16M708,28.4V19M768,29.2V19M690,24L685,20.6M690,22L695,19M768,25L764,22.4" fill="none" stroke="${dark ? '#2a1408' : '#451a03'}" stroke-width="1.2" stroke-linecap="round"/>
            <path d="${czCircles(orange)}" fill="${C[1]}"/><path d="${czCircles(rust)}" fill="${C[3]}"/>
            <path d="${czCircles(crimson)}" fill="${C[0]}"/><path d="${czCircles(amber)}" fill="${C[2]}"/><path d="${czCircles(gold)}" fill="${C[4]}"/>
            <path d="${spk([-62, -32, -88])}" fill="none" stroke="#fde68a" stroke-width="2.4" stroke-linecap="round" opacity="${dark ? 0.3 : 0.55}"/>
            <path d="${spk([148, 118, 176])}" fill="none" stroke="${dark ? '#450a0a' : '#7c2d12'}" stroke-width="2.2" stroke-linecap="round" opacity=".22"/>`;

    // Bulbs hung along one swag of a garland: n points along the quadratic curve from (x0,y0) to (x1,y1) sagging to ctrlY.
    function czSwagPts(x0, y0, x1, y1, ctrlY, n) {
      const out = [], cx = (x0 + x1) / 2;
      for (let i = 1; i <= n; i++) {
        const t = i / (n + 1), u = 1 - t;
        out.push([u * u * x0 + 2 * u * t * cx + t * t * x1, u * u * y0 + 2 * u * t * ctrlY + t * t * y1]);
      }
      return out;
    }

    // Fairy lights hung in swags along the ONE ship's deck (opt15): colours alternate along the string.
    function czShipLights() {
      const sw = [[938, 27, 968, 27.6, 30.4, 3], [968, 27.6, 998, 27.4, 31, 3], [998, 27.4, 1028, 27.6, 31, 3], [1028, 27.4, 1058, 27.4, 31, 2], [1058, 27.4, 1072, 27, 29.4, 1]];
      let pts = [];
      sw.forEach(a => { pts = pts.concat(czSwagPts(a[0], a[1], a[2], a[3], a[4], a[5])); });
      return ['#ef4444', '#22c55e', '#fde047'].map((c, k) => `<path d="${czDots(pts.filter((p, i) => i % 3 === k))}" fill="none" stroke="${c}" stroke-width="1.8" stroke-linecap="round"/>`).join('');
    }

    // ---- Agent D helpers (dz*): small compound-path builders for the opt16..opt20 scenes. Pure string functions, no DOM. ----
    function dzN(n) { return Math.round(n * 10) / 10; }
    function dzRect(x, y, w, h) { return `M${dzN(x)},${dzN(y)}h${dzN(w)}v${dzN(h)}h${dzN(-w)}z`; }
    function dzCircle(x, y, r) { return `M${dzN(x - r)},${dzN(y)}a${r},${r} 0 1 0 ${dzN(2 * r)},0a${r},${r} 0 1 0 ${dzN(-2 * r)},0z`; }
    // Round-cap dots: one zero-length stroke per point (draw with stroke-linecap round, stroke-width = dot diameter).
    function dzDots(pts) { return pts.map(p => `M${dzN(p[0])},${dzN(p[1])}h.1`).join(''); }
    // A grid of small window rectangles as ONE compound path.
    function dzWins(x, y, cols, rows, dx, dy, w, h) {
        let d = '';
        for (let r = 0; r < rows; r++) for (let c = 0; c < cols; c++) d += dzRect(x + c * dx, y + r * dy, w, h);
        return d;
    }
    // A radial firework burst around (cx, cy), drawn with dashed circles: a thick dashed ring gives the radial rays, a ring of zero-length round-cap
    // dashes gives the outer sparks, a second dotted ring (cB) the inner glints, plus a core dot (cC) and a soft glow in dark mode. 3 or 4 nodes, about 450 bytes.
    // The caller wraps it in a <g class="dz-fw-x"> so the whole burst blooms and fades as one (transform-origin = bbox centre, which is (cx, cy)).
    function dzBurst(cx, cy, r, cA, cB, cC, dark) {
        const n = 12, ray = dzN(r * 0.59), cw = dzN(2 * Math.PI * r * 0.59 / n - 1);
        const ring = (rr, col, w, dash, cap) => `<circle cx="${cx}" cy="${cy}" r="${dzN(rr)}" fill="none" stroke="${col}" stroke-width="${w}"${cap ? ' stroke-linecap="round"' : ''} stroke-dasharray="${dash}"/>`;
        return (dark ? `<circle cx="${cx}" cy="${cy}" r="${dzN(r * 1.25)}" fill="url(#sunGlow)" opacity=".4"/>` : '')
            + ring(r * 0.59, cA, dzN(r * 0.5), `1 ${cw}`, false)
            + ring(r, cA, 1.7, `0 ${dzN(2 * Math.PI * r / n)}`, true)
            + ring(r * 0.34, cB, 1.2, `0 ${dzN(2 * Math.PI * r * 0.34 / 6)}`, true)
            + `<circle cx="${cx}" cy="${cy}" r="1.5" fill="${cC}"/>`;
    }

    // Paper lanterns for a list of [x, y] (y = top edge) at one scale s: pill bodies are short fat round-cap strokes (cheap), plus flame dots,
    // tassels and halos. Returns d strings (pill is drawn twice by the caller: gold outline then red body); stroke widths are the caller's.
    function dzLanterns(list, s) {
        let pill = '', flame = '', tassel = '', halo = '';
        list.forEach(l => {
            const x = l[0], y = l[1];
            pill += `M${x},${dzN(y + 3 * s)}v${dzN(1.4 * s)}`;
            flame += `M${x},${dzN(y + 3.7 * s)}h.1`;
            tassel += `M${x},${dzN(y + 7.4 * s)}v${dzN(2.6 * s)}M${dzN(x - 1.4 * s)},${dzN(y + 0.2 * s)}h${dzN(2.8 * s)}`;
            halo += `M${x},${dzN(y + 3.7 * s)}h.1`;
        });
        return { pill, flame, tassel, halo };
    }

    // Three tapered turbine blades around (0, 0), first blade pointing at angle a0 (degrees, 0 = up), reach R. One compound path.
    function dzRotor(R, a0) {
        let d = '';
        for (let k = 0; k < 3; k++) {
            const a = (a0 + k * 120 - 90) * Math.PI / 180, ux = Math.cos(a), uy = Math.sin(a), px = -uy, py = ux;
            d += `M${dzN(ux * 0.7 + px * 0.55)},${dzN(uy * 0.7 + py * 0.55)}L${dzN(ux * R)},${dzN(uy * R)}L${dzN(ux * 0.7 - px * 0.45)},${dzN(uy * 0.7 - py * 0.45)}z`;
        }
        return d;
    }

    // A teardrop candle flame centred on (x, y).
    function dzFlame(x, y) { return `M${x},${dzN(y - 1.9)}q1.3,1.4 1.1,2.5a1.1,1.1 0 0 1 -2.2,0q-.2,-1.1 1.1,-2.5z`; }
    // Monarch butterfly parts around (x, y) at scale s: wings outline, veins, white border spots, body with antennae.
    function dzButterfly(x, y, s) {
        const p = [0, 0, -3.5, -3.2, -5.5, -1.5, -3.2, .8, -4.8, 2.2, -2.5, 3.8, 0, 1.5, 2.5, 3.8, 4.8, 2.2, 3.2, .8, 5.5, -1.5, 3.5, -3.2, 0, 0];
        const q = i => dzN(x + p[i] * s) + ',' + dzN(y + p[i + 1] * s);
        const wings = `M${q(0)}C${q(2)} ${q(4)} ${q(6)}C${q(8)} ${q(10)} ${q(12)}C${q(14)} ${q(16)} ${q(18)}C${q(20)} ${q(22)} ${q(24)}z`;
        const veins = `M${x},${y}l${dzN(-3.6 * s)},${dzN(-.6 * s)}M${x},${y}l${dzN(-2.8 * s)},${dzN(1.6 * s)}M${x},${y}l${dzN(3.6 * s)},${dzN(-.6 * s)}M${x},${y}l${dzN(2.8 * s)},${dzN(1.6 * s)}`;
        const spots = dzDots([[x - 4.4 * s, y - 1.2 * s], [x + 4.4 * s, y - 1.2 * s], [x - 3.4 * s, y + 1.6 * s], [x + 3.4 * s, y + 1.6 * s]]);
        const body = `M${x},${dzN(y - 2.4 * s)}v${dzN(4.2 * s)}M${x},${dzN(y - 2.4 * s)}l${dzN(-1.2 * s)},${dzN(-1.6 * s)}M${x},${dzN(y - 2.4 * s)}l${dzN(1.2 * s)},${dzN(-1.6 * s)}`;

    function filterCards(cat) {
      ['all', 'holiday', 'core'].forEach(k => {
        const b = document.getElementById('flt-' + k);
        if (!b) return;
        if (k === cat) {
          b.className = "px-2 py-0.5 rounded-md font-medium bg-[#bc0f70] text-white cursor-pointer";
        } else {
          b.className = "px-2 py-0.5 rounded-md font-medium hover:opacity-85 cursor-pointer";
        }
      });
      document.querySelectorAll('.opt-card').forEach(card => {
        if (cat === 'all' || card.getAttribute('data-cat') === cat) {
          card.style.display = '';
        } else {
          card.style.display = 'none';
        }
      });
      const holidayKeys = ['opt13','opt14','opt15','opt16','opt17','opt18','opt19','opt20'];
      if (cat === 'holiday' && !holidayKeys.includes(currentOpt)) {
        selectOpt('opt20');
      } else if (cat === 'core' && holidayKeys.includes(currentOpt)) {
        selectOpt('opt5');
      }
    }

    function render() {
      const opt = SCENES[currentOpt];
      const bar = document.getElementById('oceanBarSim');
      const stage = document.getElementById('svgStage');
      const borderStage = document.getElementById('borderStage');
      const zoomWrap = document.getElementById('zoomStageWrap');
      const zoomStage = document.getElementById('zoomStage');
      const zoomBorderStage = document.getElementById('zoomBorderStage');
      const activeTag = document.getElementById('activeTag');
      const descCaption = document.getElementById('descCaption');
      const detailList = document.getElementById('detailList');
      const brandTitle = document.getElementById('brandTitle');

      const bg = isDark ? opt.darkBg : opt.lightBg;
      document.getElementById('sharedDefsSvg').innerHTML = sharedDefsMarkup(isDark);
      bar.style.background = bg;
      bar.style.borderBottom = opt.border;
      borderStage.innerHTML = opt.borderHtml;
      zoomWrap.style.background = bg;
      zoomWrap.style.borderBottom = opt.border;
      zoomBorderStage.innerHTML = opt.borderHtml;

      stage.innerHTML = opt.svg(isDark, "0 0 1440 48");
      zoomStage.innerHTML = opt.svg(isDark, opt.zoomViewBox || "655 0 575 48");

      const perfTag = document.getElementById('perfTag');
      if (perfTag) {
        const nodeCount = stage.querySelectorAll('*').length;
        const minSvg = minifySvg(stage.innerHTML);
        let nAnim = 0; try { nAnim = stage.getAnimations({ subtree: true }).length; } catch (e) {}
      perfTag.textContent = `⚡ ${nodeCount} SVG nodes · ${(minSvg.length / 1024).toFixed(1)} KB min · ${nAnim} animations`;
      }

      activeTag.textContent = opt.name;
      descCaption.textContent = opt.caption;
      detailList.textContent = opt.details;

      const forceLightText = isDark;
      brandTitle.className = forceLightText
        ? "font-semibold text-[14px] text-slate-100 whitespace-nowrap"
        : "font-semibold text-[14px] text-slate-900 whitespace-nowrap";

      document.querySelectorAll('.tab-inactive').forEach(el => {
        if (forceLightText) {
          el.className = el.className.replace(/text-slate-\d+/g, 'text-slate-100').replace(/bg-white\/\d+/g, 'bg-slate-900/45');
        } else {
          el.className = el.className.replace(/text-slate-\d+/g, 'text-slate-900').replace(/bg-slate-900\/\d+/g, 'bg-white/45');
        }
      });

      Object.keys(SCENES).forEach(k => {
        const c = document.getElementById('card-' + k);
        if (!c) return;
        if (k === currentOpt) {
          c.style.borderColor = '#bc0f70';
          c.style.boxShadow = '0 0 0 1.5px #bc0f70';
        } else {
          c.style.borderColor = '';
          c.style.boxShadow = '';
        }
      });
    }

    function selectOpt(k) {
      currentOpt = k;
      render();
    }

    let isStill = false;
    function toggleStill() {
      isStill = !isStill;
      ['previewFrame', 'zoomStageWrap'].forEach(id => document.getElementById(id).classList.toggle('is-still', isStill));
      document.getElementById('btnStill').innerHTML = isStill ? '&#9654; Animated view' : '&#9208; Still view (idle)';
    }

    function togglePreviewTheme() {
      isDark = !isDark;
      document.getElementById('btnTheme').textContent = isDark ? "🌙 Dark Mode" : "☀️ Light Mode";
      render();
    }

    function minifySvg(raw) {
      return raw
        .replace(/<!--[\s\S]*?-->/g, '')
        .replace(/\s+/g, ' ')
        .replace(/>\s+</g, '><')
        .replace(/\s*(\/>|>)\s*/g, '$1')
        .trim();
    }

    function copyCurrentSnippet() {
      const opt = SCENES[currentOpt];
      includeInlineDefs = true;
      const rawSvg = opt.svg(isDark, "0 0 1440 48");
      includeInlineDefs = false;
      const snippet = `<!-- ${opt.name} | Backdrop Light: ${opt.lightBg} | Dark: ${opt.darkBg} -->\n` + minifySvg(rawSvg);
      navigator.clipboard.writeText(snippet).then(() => {
        const btn = document.getElementById('btnCopy');
        btn.textContent = "✓ Copied Minified SVG!";
        setTimeout(() => { btn.textContent = "📋 Copy SVG + CSS"; }, 1800);
      });
    }

    render();
  </script>
